name: Modding documentation

on:
  push:
    branches: [main]
    paths:
      - 'Docs/Modding/**'
      - 'Mods/**'
      - 'Tools/**'
      - 'Assets/Scripts/Eclipse/**/Modding/**'
      - 'AGENTS.md'
      - '.github/workflows/modding-docs.yml'
  pull_request:
    paths:
      - 'Docs/Modding/**'
      - 'Mods/**'
      - 'Tools/**'
      - 'Assets/Scripts/Eclipse/**/Modding/**'
      - 'AGENTS.md'
      - '.github/workflows/modding-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modding-docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Docs/Modding
    steps:
      - name: Check out documentation, examples, and Lua bindings
        uses: actions/checkout@v7
        with:
          # Exclude the recovered Unity export and large LFS art bundles.
          sparse-checkout: |
            Docs/Modding
            Assets/Scripts/Eclipse/Modding
            Mods
            Tools
          lfs: false
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Docs/Modding/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and validate documentation
        run: npm run build
      - name: Upload Pages artifact for manual deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Docs/Modding/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
