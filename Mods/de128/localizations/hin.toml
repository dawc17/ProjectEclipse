# BEGIN Sensei sensei.defeat.
sensei.defeat.OK = "ठीक है"
sensei.defeat.Sensei_defeat1 = "नहीं, रुको... ऐसा नहीं हुआ था... कृपया इस बूढ़े आदमी के भुलक्कड़पन को क्षमा करें।"
sensei.defeat.Sensei_defeat2 = "मुझे लगता है कि यह किसी और तरह से हुआ था... यादें बहुत नाजुक हो सकती हैं।"
sensei.defeat.Sensei_defeat3 = "मुझे लगता है कि उस लड़ाई का अंत इस तरह नहीं हुआ था। मुझे इसे याद करने की कोशिश करने दो..."
sensei.defeat.Sensei_defeat4 = "मेरी यादें बहुत धुंधली हैं... मुझे लगता है कि मैं वह लड़ाई जीत गया था।"
sensei.defeat.Sensei_defeat5 = "नहीं, ऐसा नहीं था। ऐसा लगता है कि मैं तब जीत गया था... शायद।"
sensei.defeat.characterSensei = "सेंसी"
# END Sensei sensei.defeat.

# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "सेंसी की कहानी{br}भाग 1. गवाह"
sensei.entry.ActScreenSensei2 = "सेंसी की कहानी{br}भाग 2. भविष्य की छाया"
sensei.entry.ActScreenSensei3 = "सेंसी की कहानी{br}भाग 3. भीतर का जानवर"
sensei.entry.ActScreenSensei4 = "सेंसी की कहानी{br}भाग 4. प्रतिशोध की कहानी"
sensei.entry.ActScreenSensei5 = "सेंसी की कहानी{br}भाग 5. अपमानित और प्रताड़ित"
sensei.entry.ActScreenSensei6 = "सेंसी की कहानी{br}भाग 6. राक्षस"
sensei.entry.ButcherYoung_Greetings = "मेरी सत्ता पर संदेह करने का साहस कोई नहीं करता! परिवार इसे कभी माफ नहीं करता। तुम यहाँ से जिंदा नहीं बचोगे!"
sensei.entry.Butcher_zone3_1 = "भटका हुआ बेटा वापस आ गया है! क्या आपने मेरे प्रस्ताव पर विचार किया है, राजकुमार? मैं आपको जाने दूँगा और बताऊँगा कि स्फीयर कहाँ है, और आप मुझे सोना देंगे।"
sensei.entry.Butcher_zone3_2 = "उनकी चुप्पी शब्दों से ज़्यादा ज़ोर से बोलती है, बूढ़े आदमी। मैं? मैं खुद के प्रति ईमानदार हूँ—I मैं अपने पाशविक स्वभाव को स्वीकार करता हूँ। वह नहीं करता। लेकिन हम तुम्हें विनम्रता सिखाएंगे! आओ, बच्चों!"
sensei.entry.Guard1_Butcher_Sensei = "बुचर ने मुझे दिखाया कि कैसे दर्द हमारे असली रूप को प्रकट करता है। मैं अब आज़ाद हूँ! तुम भी खुशी पा सकते हो। विरोध मत करो!"
sensei.entry.Guard1_Hermit_Sensei = "बदलाव तय है! मैंने इसे सीखने के लिए आधी दुनिया पार की है, इतना कुछ कुर्बान किया है... गुरु की बुद्धि ही वह सब कुछ है जो मेरे पास है!"
sensei.entry.Guard1_Lynx_Sensei = "क्या तुम्हें मेरे टैटू पसंद हैं? जिस धरती पर मैं पैदा हुआ था, वहाँ सबसे मजबूत लोग उन्हें अपने कारनामों की यादों के रूप में बनवाते हैं। तुम भी जल्द ही इस तस्वीर का हिस्सा बन जाओगे..."
sensei.entry.Guard1_Wasp_Sensei = "क्या तुम भाग्य पर विश्वास करते हो? मुझे लगता है कि मैं आज तुम्हारा सारा पैसा लेकर अपनी किस्मत बनाने वाला हूँ। क्या तुम्हें लगता है कि तुम्हारी किस्मत अच्छी होगी, बूढ़े आदमी?"
sensei.entry.Guard1_Widow_Sensei = "मेरी मालकिन मेरे लिए एक बहन जैसी हैं। मैं उनका दर्द महसूस कर सकता हूँ। वह मुझे राजकुमार को छूने से मना करती हैं, इसलिए मेरा गुस्सा तुम पर बरसेगा!"
sensei.entry.Guard2_Butcher_Sensei = "जीत हमारी मुट्ठी में है! दर्शनशास्त्र मूर्खों के लिए है—मुझे तो बस चाकुओं से खेलना पसंद है। क्या मेरे साथ खेलना चाहते हो?"
sensei.entry.Guard2_Hermit_Sensei = "गुरुजी ने हमें शैडो वर्ल्ड के बारे में बताया था—इसके निवासियों और उस असीम शक्ति के बारे में जो वह हमारे साथ साझा करेंगे। क्या तुम्हें लगता है कि मैं यह सब तुमसे छीनने दूँगा?"
sensei.entry.Guard2_Lynx_Sensei = "हमारा कबीला ऐसा काम करता है जो देवताओं के लिए भी बहुत गंदा है। हम समस्याओं का समाधान करते हैं और दूसरों की गलतियों को सुधारते हैं। और तुम—तुम उन्हीं गलतियों में से एक हो।"
sensei.entry.Guard2_Wasp_Sensei = "मेरे कप्तान को धमकी दे रहे हो? उसने मुझे गुलामी से बचाया था, और मैंने अपनी आज़ादी के लिए काम करने की कसम खाई थी। आत्माएं तुम पर दया करें..."
sensei.entry.Guard2_Widow_Sensei = "मेरी मालकिन कितनी सुंदर हैं! मैं उनका चेहरा देखने के योग्य नहीं था... अब मेरा जीवन उनका है। मैं अपनी आखिरी सांस तक उनके सम्मान की रक्षा करूँगा।"
sensei.entry.HermitYoung_Greetings = "आप परिस्थितियों के शिकार हैं, राजकुमार—आम भलाई के लिए आवश्यक एक बलिदान। मेरा स्कूल महानता हासिल करेगा, और मार्शल आर्ट का स्वर्ण युग शुरू होगा!"
sensei.entry.Hermit_zone2_1 = "आप आगे कुआँ और पीछे खाई वाली स्थिति में हैं, मेरे महाराज। मैं मानता हूँ—मैंने आपको धोखा दिया। हालाँकि मेरे पास कोई विकल्प नहीं था—मेरे स्कूल का भविष्य दांव पर है।"
sensei.entry.Hermit_zone2_2 = "लिंक्स, वह अहंकारी युवक, अपना काम नहीं संभाल सका। मुझे उसका काम खुद ही करना होगा। शिष्यों, सामने और केंद्र में आओ!"
sensei.entry.LynxYoung_Greetings = "मैं बस ऐसे ही नहीं जा सकता। मुझे राजकुमार की जान के लिए पहले ही भुगतान किया जा चुका है। कुछ भी व्यक्तिगत नहीं है, बूढ़े आदमी।"
sensei.entry.Lynx_Sensei_1 = "राजकुमार की बात मत सुनो, बूढ़े आदमी—वह बस पागल हो गया है। हम महामहिम को खुद को चोट पहुँचाने से पहले घर ले जा रहे हैं। तुम्हारी मदद की आवश्यकता नहीं है।"
sensei.entry.Lynx_Sensei_2 = "सच में? जहाँ मैं खड़ा हूँ, वहाँ से मुझे हत्यारों से घिरा हुआ एक डरा हुआ आदमी दिखाई दे रहा है। कुछ मुझे बताता है कि राजकुमार सच कह रहा है। उससे दूर हट जाओ!"
sensei.entry.Lynx_Sensei_3 = "जो करना है करो। वे मुझे बात करने के पैसे नहीं देते। दो सिर का मतलब है ज़्यादा पैसा। हमला करो, लड़कों!"
sensei.entry.NAME_BUTCHER = "कसाई"
sensei.entry.NAME_HERMIT = "तपस्वी"
sensei.entry.NAME_LYNX = "लिंक्स"
sensei.entry.NAME_PRINCE = "राजकुमार"
sensei.entry.NAME_SHOGUN = "शोगुन"
sensei.entry.NAME_WASP = "ततैया"
sensei.entry.NAME_WIDOW = "विधवा"
sensei.entry.OK = "ठीक है"
sensei.entry.Prince_Intro = "मदद करो! ये लोग मुझे मारना चाहते हैं!"
sensei.entry.Prince_zone3_1 = "मेरे नाम को कलंकित करने की तुम्हारी हिम्मत कैसे हुई! तुम... तुम दुखी नीच! मैं तुम्हारे क्रूर शासन को समाप्त करने के लिए वापस आ गया हूँ!"
sensei.entry.Prince_zone6_1 = "आ गए तुम, मेरे वफादार दोस्त! देखो—न्याय की फिर से जीत हुई। शोगुन मेरा वफादार कुत्ता है। उसका दिमाग मेरा है!"
sensei.entry.Prince_zone6_2 = "तुम भी, बूढ़े? तुम मेरे सिंहासन पर दावा करना चाहते हो?! यह मेरा जन्मसिद्ध अधिकार है! कोई इसे मुझसे नहीं छीन सकता!"
sensei.entry.Sensei_arc_intro1 = "एक समय की बात है, मैं टहल रहा था और मेरी मुलाकात स्थानीय जमींदार से हुई—वह अत्यधिक संकट में थे..."
sensei.entry.Sensei_zone3_1 = "तो “किस्मत” का मतलब यही है? अपनी आजादी खरीदना, और अपने लोगों को पागलों के एक गिरोह के हवाले कर देना... और मैं तुम्हारे प्रति इतना दयालु था, राजकुमार।"
sensei.entry.Sensei_zone4_1 = "विडो? बिल्कुल... उसने मुझसे कहा था कि स्फीयर ले लो और उसे शोगुन के पास पहुँचा दो—उसके हाथों में।"
sensei.entry.Sensei_zone6_1 = "राजकुमार, रुको! चारों ओर देखो! स्फीयर तुम्हारे गुस्से पर पलेगा, तुम्हें एक राक्षस में बदल देगा!"
sensei.entry.Shogun_zone6_1 = "कमज़ोर! तुम मेरे मालिक के दरबार के विदूषक बनने के लायक भी नहीं हो। मैं तुम्हें एक ही वार में कुचल दूँगा!"
sensei.entry.TITLE_PRINCE_EVIL = "हॉन्टेड प्रिंस"
sensei.entry.WaspYoung_Greetings = "मैं अपने पिता को क्या बताऊँगी? कि उनकी बेटी कमज़ोर पड़ गई और एक बूढ़े आदमी से लड़ाई हार गई? ऐसा तब तक नहीं होगा जब तक मैं समुद्री डाकुओं के सिंहासन की उत्तराधिकारी हूँ!"
sensei.entry.Wasp_zone4_1 = "विडो ने तुम्हें स्फीयर लेने के लिए भेजा है? क्या तुम इस तरह के कामों के लिए थोड़े ज़्यादा बूढ़े नहीं हो? आह, मुझे क्या परवाह? जहाज पर चढ़ जाओ।"
sensei.entry.Wasp_zone4_2 = "बात यह है कि अब मेरे पास स्फीयर नहीं है। विडो के आदमी कल इसे ले गए। पता नहीं तुम कौन हो, लेकिन मैं झूठों को कभी माफ नहीं करती। इसे जहाज़ के नीचे घसीटो!"
sensei.entry.WidowYoung_Greetings = "राजकुमार ने मेरा अपमान किया—मुझे ठुकरा दिया, मेरी भावनाओं का मज़ाक उड़ाया। अब मैं पलटवार करूँगी! तुम उसके दोस्त हो, इसलिए तुम उस तक यह संदेश पहुँचाओगे..."
sensei.entry.Widow_zone5_1 = "क्या तुम भी मेरा उसी तरह अपमान करने आ रहे हो जिस तरह राजकुमार ने किया था? तुम पुरुष सब एक जैसे होते हो..."
sensei.entry.Widow_zone5_2 = "वह मुझे तुम्हारी दयालुता, सम्मान और गरिमा के बारे में बता रहा था। लेकिन अब मुझे किसी भी पुरुष की बातों पर भरोसा नहीं है। तुम में से हर एक को भुगतना पड़ेगा!"
sensei.entry.Zone2_SenseiReminder = "पिछली बार, मैंने आपको बताया था कि कैसे मैंने राजकुमार को हत्यारों से बचाया था। मुझे पता चला कि हर्मिट गुप्त रूप से उसके सैनिकों को प्रशिक्षित कर रहा था। इसलिए हम वहीं गए।"
sensei.entry.Zone3_SenseiReminder = "हर्मिट ने हमें बताया था कि राजकुमार के सेनापति, शोगुन ने अपने स्वामी को धोखा दिया और उसका अपहरण करने के लिए बुचर को पैसे दिए। अब उस डकैत से मिलने का समय आ गया था।"
sensei.entry.Zone4_SenseiReminder = "राजकुमार की मुसीबतों का कारण एक महिला थी! उसने एक जादुई स्फीयर का उपयोग करके उसे गद्दी से हटाने की योजना बनाई थी—जिसे अब पास के बंदरगाह पर लाया जा रहा था..."
sensei.entry.Zone5_SenseiReminder = "समुद्री डाकू लड़की ने मुझे राजकुमार के साथ विडो के उलझे हुए इतिहास के बारे में बताया था। मुझे स्फीयर नहीं मिला, लेकिन मुझे पता चला कि राजकुमार विडो को खोजने के लिए पहाड़ों पर गया था।"
sensei.entry.Zone6_SenseiReminder = "जादुई स्फीयर ने राजकुमार को पागल कर दिया था! इसने उसे अपार शक्ति दी... ऐसी शक्ति जिसने हम सभी को नष्ट करने की धमकी दी! मैं ऐसा होने नहीं दे सकता था।"
