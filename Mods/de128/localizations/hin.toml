uw.dlgAmericanEvent22Story_May_1 = "वह पूरी तरह जम चुकी है, सेंसेई! हम उसे दरवाज़े पर चल रही ऐसी तेज़ हवाओं के बीच बाहर नहीं निकाल सकते…"
uw.dlgAmericanEvent22Story_Puma_1 = "मुश्किल में है, बूढ़े आदमी… मैंने कभी नहीं सोचा था कि मेरे लोगों का अतीत मेरा पीछा करेगा, लेकिन ऐसा हुआ है। इसलिए मैं उनकी रक्षा करने के लिए भाग कर आई। कृपया, मेरी बात सुनें!"
uw.dlgAmericanEvent22Story_Puma_2 = "क्या आप भी उसे सुन सकते हैं? जब मैं बच्ची थी, एक ओझा ने मुझे एक ऐसी आत्मा के बारे में बताया था जिसकी चीख लहरें उठाती थी और पत्तों को फाड़ देती थी। मैंने कभी नहीं सोचा था कि वह पुरानी कहानी सच साबित होगी!"
uw.dlgAmericanEvent22Story_Puma_3 = "वह हमें अपनी चीख के साथ दौड़ाने के लिए इस तरफ आ रहा है जब तक कि हम हांफते हुए गिर न जाएं… बस मजे के लिए! मुझे छिपने की कोई और जगह नहीं पता…"
uw.dlgAmericanEvent22Story_Sensei_1 = "मेरे निवास के दरवाज़े हर उस व्यक्ति के लिए खुले हैं जो पीड़ित है। लेकिन इन दीवारों के भीतर किसी समुद्री डाकू को देखना अप्रत्याशित है… और पुमा, तुम्हारी हत्यारों की टोली कहाँ है?"
uw.dlgAmericanEvent22Story_Sensei_2 = "ओझाओं के मिथक केवल दृष्टांत हैं। लोगों ने हवा को वश में करने के लिए पाल का आविष्कार किया, और तब से इसने उनकी अच्छी सेवा की है। तुम बस एक मूर्खतापूर्ण परीकथा हो, और शैडो यह साबित कर देगा!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "मैं वुल्फ विंड हूँ! जो भी मुझसे मिलने आएगा, उसे मोमबत्ती की तरह बुझा दिया जाएगा! और देर-सबेर, मैं तुम्हारा दरवाज़ा तोड़ ही दूंगा। यह बस समय की बात है!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "मैं तब तक आ-ऊ-ऊ करूँगा जब तक पत्ते मलबे को ढक न लें। कोई भी यहाँ का रास्ता कभी नहीं खोज पाएगा! साहसी और मूर्ख… तुम प्रकृति की ताकतों से कैसे लड़ सकते हो, नश्वर?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "कितना अपमानजनक… तुमने मेरी शक्तिशाली आवाज़ छीन ली है! लेकिन तुम्हारा विश्वास, लड़की, मुझे फिर से ज़िंदा कर देगा… और मैं अकेला नहीं आऊंगा! क्योंकि हम बहुत हैं!"
uw.dlgArkhosGreetings = "अंधभक्तों! तुम मुझे याद करते हो और परमपिता में अपने विश्वास से मुझे तृप्त करते हो। एक अभिभावक सख्त हो सकते हैं, और तुम कृतज्ञता के साथ मेरी सजा स्वीकार करोगे..."
uw.dlgArkhosLost = "अपनी इस अंतिम घड़ी में मैं किसकी पूजा करूँ? हे निर्माता, तूने मुझे क्यों छोड़ दिया? तूने मुझे उनका नेतृत्व करने की शक्ति दी थी, लेकिन मैं फिर से... असफल रहा।"
uw.dlgArkhosStory1 = "मैं उसकी नस्ल को जानता हूँ। वे अनुयायियों को इकट्ठा करते हैं जिन्हें वे झूठ परोसते हैं। उसके भड़काऊ उपदेशों को मत सुनो, क्योंकि वही उसका मुख्य हथियार है।"
uw.dlgArkhosStory2 = "गलत, बूढ़े आदमी। मेरे पास उन हठी बच्चों के लिए भी कठोर लोहा है। तुम मुझसे प्रार्थना करोगे कि मैं तुम्हें परिवार में शामिल होने दूँ... लेकिन मैं निष्ठुर रहूँगा।"
uw.dlgArkhosWin = "कलंकित भेड़ों, तुम मेरे पास खड़े होने के योग्य भी नहीं हो। दूर हो जाओ! मैं निर्माता को संदेश भेजूँगा कि तुम मनुष्य कैसे फिर से असफल रहे, और वह मेरे बच्चों का पेट भरेगा।"
uw.dlgBerstuuk_Announce = "वर्जित ज्ञान की तलाश में, एक प्रतिभाशाली वैज्ञानिक ने भगवान बनने की अपनी चाहत में विज्ञान और जादू को मिला दिया है। और यह परिवर्तन अपरिहार्य है! अब जंगल उसकी भयानक प्रयोगशाला है, और इंसान उसका शिकार हैं। केवल तुम ही इस भयानक कायापलट को रोक सकते हो! अपने डर को दूर भगाओ और झूठे आदर्श की तलाश में घने जंगल के बीचो-बीच जाओ!"
uw.dlgBerstuuk_Loose_1 = "जब तुम मेरे दरवाज़े पर आए, तो तुमने बिना शब्दों के मुझे सब कुछ बता दिया! मैं इस ज्ञान को एक पतले धागे की तरह तब तक खींचूंगा जब तक कुछ न बचे!"
uw.dlgBerstuuk_Story_1 = "बाहर स्लाय है, जो खलिहान का दरवाज़ा खटखटा रहा है… मैंने रात में जंगल में बहुत कुछ देखा है, लेकिन यह कुछ नया है! उसे क्या हुआ है?"
uw.dlgBerstuuk_Story_10 = "पर्याप्त नहीं। विज्ञान अप्रत्याशित है—बस मुझे ही देख लो! धीरे-धीरे मैंने जंगल को स्वीकार कर लिया, लेकिन वह मुझे स्वीकार करने से इनकार करता रहा। अब तक।"
uw.dlgBerstuuk_Story_2 = "मदद चाहने वालों के लिए, रास्ता सही दरवाज़े तक ले जाता है। लेकिन लगता है स्लाय अपना रास्ता भटक गया है… तुम बूढ़े बदमाश, अपने हाथों पर ध्यान दो! क्या हुआ?"
uw.dlgBerstuuk_Story_3 = "बदमाश मदद की तलाश में था, और उसे वह मिल गई। चलो जंगल में चलते हैं इससे पहले कि वे उसे छीन लें जो उनका हक़ है। इंसानों की ज़िंदगी!"
uw.dlgBerstuuk_Story_4 = "'इंसान'? बेचारा सदमे में है—उसका कोई चेहरा नहीं है! उसे किस बात ने इतना डरा दिया कि उस पर अचानक अंतरात्मा का संकट आ गया?"
uw.dlgBerstuuk_Story_5 = "क्या तुम पक्षियों के गाने की आवाज़ सुन सकते हो? इस समय तक उन्हें चहकना शुरू कर देना चाहिए था, लेकिन यहाँ सन्नाटे के सिवा कुछ नहीं है… इस जंगल में और क्या छिपा है?"
uw.dlgBerstuuk_Story_6 = "बिल्कुल सन्नाटा। बिल्कुल सन्नाटा। लोगों को मदद की ज़रूरत है। तुम्हें मदद करनी ही होगी। अभी मदद करो!"
uw.dlgBerstuuk_Story_7 = "हे भगवान! लोग आम तौर पर सूखी टहनियों और काई में नहीं बदलते, चाहे वे कितने भी डरे हुए क्यों न हों! वह चीज़ क्या है, और असली स्लाय कहाँ है?!"
uw.dlgBerstuuk_Story_8 = "वह यहीं कहीं है। स्लाय का छोटा सा दिमाग बहुत मददगार रहा है। उसने मुझे तुम्हारे बारे में बताया, शैडो—तुम्हारी विशेष शक्ति के बारे में। और यह मेरे दिमाग में बैठ गया!"
uw.dlgBerstuuk_Story_9 = "तो तुम ही वो हो जिसके बारे में उस जीव ने बात की थी? जंगल आएगा और ले जाएगा। और तुमने इन 'हक़दार' जिंदगियों में से कितनों की जान ली है, पागल इंसान?"
uw.dlgBerstuuk_Win_1 = "प्रकृति कोई न कोई रास्ता खोज ही लेगी! हमारी लड़ाई ने मुझे तुम्हारी सोच से भी कहीं अधिक बता दिया है, शैडो। जंगल याद रखेगा। यह मुझे खाकर फिर से जीवित हो जाएगा…"
uw.dlgFatumGreetings = "तुम्हारे साहस की तुलना केवल तुम्हारी मूर्खता से की जा सकती है। लेकिन मैं जानती थी कि तुम आओगे, क्योंकि तुम मेरा भाग्य हो, और मैं तुम्हारा। मैं तुम्हारी नियति को बदल दूँगी—हमेशा के लिए।"
uw.dlgFatumLost = "मैं मानव जाति को जानती हूँ। तुम सब एक ही चक्रव्यूह में ऊपर-नीचे घूमते रहते हो। मैंने यह एक से अधिक बार देखा है। आत्म-विनाश और पतन। इसे कोई नहीं बदल सकता। ऐसा ही तुम्हारा भाग्य है।"
uw.dlgFatumStory1 = "सतर्क रहो, नायक। इतनी गहराई में, वे सार्वभौमिक नियम काम करना बंद कर देते हैं जिनके तुम आदी हो..."
uw.dlgFatumStory2 = "बिल्कुल सही! लड़के को नियंत्रण में रखो। मैं तुम्हारी नियतियों के बारे में सब कुछ जानती हूँ: तुम कौन हो, और कहाँ जा रहे हो। क्या मैं तुम्हें बताऊँ कि अंत में कौन मरता है?"
uw.dlgFatumWin = "तुम्हारा भाग्य तय हो चुका है। जैसे ही तुमने मेरे निवास की दहलीज पर कदम रखा, तुम हार चुके थे। क्या तुम्हारे पास अपनी कहानी को फिर से लिखने का पर्याप्त साहस होगा?"
uw.dlgFungusGreetings = "तुमने इस भूमि को जहर दे दिया है, और अब मेरे मशरूम मर रहे हैं। वे तुम्हारे मस्तिष्क को सोख लेंगे, और हम सब एक हो जाएंगे, मानव। यही तुम्हारी कहानी का अंत होगा!"
uw.dlgFungusLost = "मेरे भाई भगवान बनने के खेल में खुद को भूल गए हैं। पूजा उन्हें कमजोर बनाती है। लेकिन विनाश मानवता के स्वभाव में है; तुम्हारे बिना यह दुनिया बेहतर होगी।"
uw.dlgFungusWin = "दूर हो जाओ! और अपने इस नाजुक जीवन के अंतिम क्षणों का आनंद लो!"
uw.dlgHW21LosePuppeteer_1 = "मैं तुम पर बिना बोलने वाली भूमिका के लिए भी भरोसा नहीं करूँगा, शैडो। मंच वह जगह नहीं है जहाँ तुम रहने के लायक हो—मेरी कला का अपमान मत करो!"
uw.dlgHW21StoryArkhos_1 = "नश्वरो, तुम्हारे शहर में महामारी आ रही है! अपने देवता की शक्ति के सामने झुक जाओ! और अपनी आँखों को सोने की चमक से खुश करो, वरना…"
uw.dlgHW21StoryPuppeteer_1 = "तुम कला के बारे में क्या जानते हो! तुमने मेरे सबसे महान उद्यम को बर्बाद कर दिया है! फिर भी… तीसरा अंक आ रहा है। और उसमें, नायक अपनी आखिरी सांस लेगा!"
uw.dlgHW21StorySensei_1 = "पाताल के देवता कब से आम लोगों से पैसे ऐंठने के लिए यहाँ आने लगे? अपना मुखौटा उतारो, धोखेबाज़, इससे पहले कि हम हथियार उठाएँ!"
uw.dlgHW21StorySensei_2 = "रंगमंच को प्रेरित करना चाहिए, डराना नहीं। और तुमने कला के मूल सार को ही विकृत कर दिया है। हम तुम्हें रोकेंगे इससे पहले कि तुम्हारे 'अभिनेताओं' को नुकसान पहुंचे।"
uw.dlgHW21StoryThief_1 = "रुको! यह मैं हूँ… स्लाय! मुझे मत मारो! उसने वादा किया था कि हर कोई मुझसे डरेगा… और कोई मुझे पहचान नहीं पाएगा। मैंने अपना भेद कैसे खोल दिया?"
uw.dlgHW21StoryThief_2 = "घूमते हुए थिएटर का मालिक—पपेटियर। उसने कहा कि यह उसका सबसे बेहतरीन प्रदर्शन होगा। लोगों के बीच देवता! मेरे लिए इसका कोई मतलब नहीं था। लेकिन दूसरी ओर पैसे…"
uw.dlgHW21WinPuppeteer_1 = "यह एक पूरी विफलता है! तुमने मेरी अद्भुत कहानी को बर्बाद कर दिया और मेरे मुखौटे तोड़ दिए! बिना प्रॉप्स के अब मैं नाटक का मंचन कैसे करूँ…"
uw.dlgHW22EnterArchitect = "तुम्हारी इस पूरी काल्पनिक कहानी ने मुझे थका दिया है… अब हम मेरे नियमों के अनुसार खेलेंगे। और यह तुम्हारे हित में है कि तुम मुझे चौंका दो, शैडो…"
uw.dlgHW22LooseArchitect_1 = "यही उम्मीद थी। मैं तुम्हारी सभी चालें जानता हूँ, शैडो। आख़िरकार, मैंने ही तुम्हारा आविष्कार किया था। शायद उस समय मैं अपने खेल से बाहर था… लेकिन अब तुम्हें अपना नया जीवन पसंद आएगा।"
uw.dlgHW22StoryArchitect_1 = "इसे 'घिसी-पिटी बात' कहते हैं, पपेटियर। नाटककारों को किस बात के पैसे मिलते हैं? प्रतीकों की संख्या के लिए? बड़बड़ाते पागल जीनियस का रूप पुराना हो चुका है, ठीक नायक के रूप की तरह…"
uw.dlgHW22StoryArchitect_2 = "बस इतना ही। हम तुम्हारी दुनिया को शुरू से फिर लिखेंगे! समकालीन, रचनात्मक, प्रासंगिक! आजकल के किशोरों को क्या पसंद है? तुम कुछ कहते क्यों नहीं, शैडो? ओह, हाँ…"
uw.dlgHW22StoryPuppeteer_1 = "एक दस्तक होती है—तुम्हारे दरवाज़े पर एक अप्रत्याशित दस्तक! क्या वह कोई यात्री है जो मिलने आया है, या कुछ और? दिलचस्प है, है ना?"
uw.dlgHW22StoryPuppeteer_2 = "मुझे पता था तुम ऐसा कहोगे, बूढ़े आदमी। गढ़े हुए पात्रों से और क्या उम्मीद की जा सकती है? कागज़ तो कुछ भी सह लेगा… लेकिन दर्शक कभी नहीं सहेंगे!"
uw.dlgHW22StoryPuppeteer_3 = "मैं केवल मंच का गुलाम हूँ, बस इतना ही। और मेरी नई उत्कृष्ट कृति निर्माता के साथ मुलाकात के बारे में बताएगी—पूर्वनियति और स्वतंत्र इच्छा की पीड़ाओं के बारे में…"
uw.dlgHW22StorySensei_1 = "पपेटियर, तुमने जो भी सपने देखे हैं, हम अब तुम्हारे खेल नहीं खेलने वाले। कला दर्द पैदा कर सकती है, लेकिन उस तरीके से नहीं जैसे तुम उसका अभ्यास करते हो।"
uw.dlgHW22StorySensei_2 = "तुमने बहुत ज़्यादा अभिनय कर लिया है, और अब तुम अपनी कल्पनाओं और वास्तविकता में अंतर नहीं बता सकते, कलाकार… तुम पागल हो।"
uw.dlgHW22StorySensei_3 = "तुम्हारे शब्द अजीब और चिंताजनक हैं, अजनबी… मुझे नहीं पता तुम्हारे दिमाग में क्या पागलपन चल रहा है, लेकिन शैडो इसे तुम्हारे दिमाग से बाहर निकाल देगा।"
uw.dlgHW22WinArchitect_1 = "शायद रचना अब अपने निर्माता की नहीं रही और उसने अपना जीवन खुद शुरू कर दिया है… तुमने मुझे चौंका दिया है। मैं देखना चाहता हूँ कि कहानी आगे कहाँ जाती है।"
uw.dlgHoaxenGreetings = "तुम्हारा सारा जीवन केवल एक भ्रम है। और हम इसके निर्माता हैं। जब दूसरे पाशविक बल पर भरोसा करेंगे, हम तुम्हें पागल कर देंगे। आग, पानी, बीमारियाँ—हाहा!"
uw.dlgHoaxenLost = "तुम कहाँ हो, भाई? मुझे अब तुम्हारी आवाज़ सुनाई नहीं दे रही! सचमुच, अकेले कैद होना आग या तलवार से भी बदतर है... जाओ, मूर्खों। परमपिता प्रतीक्षा कर रहे हैं।"
uw.dlgHoaxenStory1 = "“हम”? शैडो, ऐसा लगता है कि हमारे दुश्मन का दिमाग ठिकाने नहीं है। क्षमा करें, हम आपके किस रूप से बात कर रहे हैं? शायद आपका \"भाई\" अधिक तर्कसंगत हो सकता है?"
uw.dlgHoaxenStory2 = "हम पर हँस रहे हो, मानव? मेरा भाई सुझाव देता है कि तुम्हारी आत्माओं को अनंत दुखों की खाई में भेज दिया जाए... तब तुम्हारी दुनिया बिना एक भी बूंद खून बहाए घुटने टेक देगी।"
uw.dlgHoaxenWin = "मैंने तुम्हें मार डाला होता, क्योंकि मेरी दया वास्तव में असीम है। लेकिन मेरा भाई कम सहनशील है; तुम जाने के लिए स्वतंत्र हो, बशर्ते बाहर निकलते समय तुम अपना मानसिक संतुलन न खो बैठो।"
uw.dlgHunter_enter_hunter_1 = "तुम! हे, तुउउम! जो शुरू किया था उसे खत्म करने आए हो, क्या? तुम? तुममें एक शक्ति है। यह मुझसे बाअत करती है। चुप! वरना मैं तुम्हें चुउअप कर दूँगा!"
uw.dlgHunter_greeting_may_1 = "देखो! क्रिस्टल के अंदर कुछ है… क्या उसे ऐसा ही होना चाहिए?"
uw.dlgHunter_greeting_saimon_1 = "कितनी अजीब बात है… मैं उम्मीद कर रहा था कि लाजरस ओबिलिस्क को पीसकर धूल में मिला देगा। मुझे नरसंहार का डर था, लेकिन लगता है कि केवल तुम और मैं बचे हैं। मैं हैरान हूँ।"
uw.dlgHunter_greeting_saimon_2 = "कॉन्संट्रेशन हॉल। क्या तुम बीच में उस क्रिस्टल को देखते हो? इसी तरह ओबिलिस्क छाया ऊर्जा जमा करता है—यों कहें तो, अंधकार का दिल।"
uw.dlgHunter_greeting_sensei_1 = "सन्नाटा एक बुरा शकुन है, मेरे तर्कशील दोस्त। यह बहरे कर देने वाले शब्दों से भी ज़्यादा ज़ोर से बोल सकता है। हम्म… हम कहाँ हैं? यह कौन सी अजीब जगह है?"
uw.dlgHunter_greeting_sensei_2 = "मुझे शक है, मेरी बच्ची… यह जगह वैसी नहीं दिख रही है जैसी मैंने इसे पिछली बार देखा था। मुझे लगने लगा है कि वह बूढ़ा आदमी सही था…"
uw.dlgHunter_loose_hunter_1 = "नीचे लेएएट जाओ। मैं तुम्हें यहाँ हमेशाअअ के लिए छोड़ दूँगा। औऊऊर ज़्यादा नुकसान मत पहुँचाओ।"
uw.dlgHunter_win_hunter_1 = "रुको, शैडो-इंसान! इसे फैऐऐलने मत दो! तुम उसससकी तरह बन जाओओओगे। तुम्हें धोओओखा दिया जाएगा! लेकिन तुम्हारे पास अभी भी एक मौऔऔका है।"
uw.dlgIE21AnnounceAssistant_1 = "वह आखिर है कौन? तुम हमारी दुनिया में क्या कर रहे हो, और हम तुम्हारी बात क्यों सुनें?"
uw.dlgIE21AnnounceAssistant_2 = "हा! मुझे नहीं पता कि तुम कहाँ से आए हो, लेकिन तुम यहाँ ज़्यादा देर नहीं टिकोगे!"
uw.dlgIE21AnnounceAssistant_3 = "हे शैडो, यह बदमाश बहुत आगे बढ़ गया है! चलो इसे कुछ तमीज़ सिखाते हैं!"
uw.dlgIE21AnnounceBoss_1 = "तुम दयनीय नश्वरो! मेरी इच्छा और महिमा के सामने झुक जाओ, या मैं तुम्हें घुटनों पर बैठने के लिए मजबूर कर दूंगा!"
uw.dlgIE21AnnounceBoss_2 = "मुझसे इस तरह बात करने की तुम्हारी हिम्मत कैसे हुई—मैं रावण हूँ, तीनों लोकों का विजेता!"
uw.dlgIE21AnnounceBoss_3 = "घुटने टेकने का यह तुम्हारा आखिरी मौका है। इंकार करो, और मैं तुम्हारा सिर धड़ से अलग कर दूंगा!"
uw.dlgIE21AnnounceSensei_1 = "शैडो, मुझे किसी रहस्यमय खतरे के आने का आभास हो रहा है। कुछ बुरा एक बार फिर हमारी दुनिया में आ गया है।"
uw.dlgIE21Boss_After_Loose = "अगर इस दुनिया के सभी लोग इतने कमज़ोर हैं, तो इस पर विजय प्राप्त करना केवल समय की बात है!"
uw.dlgIE21Boss_After_Win = "मूर्खों! मैं अभी पीछे हट रहा हूँ, लेकिन तुम मुझे इतनी आसानी से नहीं हरा पाओगे। मैं वापस लौटूंगा!"
uw.dlgIndia22Story_May_1 = "और इसलिए तुम भूखे मरने लगे… इस राक्षस को तुम्हारे खुशी के जश्न में क्या चाहिए था? साधारण किसानों ने ऐसे शिकारी को कैसे आकर्षित किया होगा?"
uw.dlgIndia22Story_Rakshasa_1 = "तुम्हारी गंध दिलचस्प है, इंसान। इसमें कोई शक नहीं कि तुम्हारा स्वाद भी उतना ही अच्छा होगा! क्या तुम मेरे पेट की गड़गड़ाहट सुन सकते हो? मेरे चावल के साथ खाने के लिए मांस का एक उम्दा टुकड़ा बहुत बढ़िया रहेगा!"
uw.dlgIndia22Story_Rakshasa_Lose = "तुम्हारे लिए सौभाग्य की बात है कि हमारी लड़ाई ने मुझे थका दिया है। इसके अलावा, मेरी भूख शांत हो गई है… अभी के लिए। मैं फिर से भूख बढ़ाऊंगा और फिर शिकार करूंगा!"
uw.dlgIndia22Story_Sensei_1 = "मुझे उसके बारे में बताओ, यात्री। तुम्हारे कपड़ों से, मैं देख सकता हूँ कि तुमने बहुत दूर की यात्रा की है। तुम्हारे घर पर क्या परेशानी आई है?"
uw.dlgIndia22Story_Sensei_2 = "अपनी भूख पर काबू पा, राक्षस! जो जीवन ही चुरा लेता है, उसके लिए जीवन के उत्सव में कोई आमंत्रण नहीं होगा!"
uw.dlgIndia22Story_Sensei_Win = "कोई जादू किसी बगीचे को नहीं खिलाता—यह कड़ी मेहनत है जो ऐसा करती है। और तुम इसे खुद साबित करने जा रहे हो: अपने पड़ोसियों के खेत को फिर से हरा-भरा करने में मदद करो, वरना…"
uw.dlgIndia22Story_Sitaram_1 = "मैंने तुम्हारे जीवन की कहानी सुनी है। देवता तुम्हें तुम्हारे गुणों के अनुसार फल दें! मैं एक बुरी खबर लाया हूँ: मेरी ज़मीन पर एक दुष्ट आत्मा प्रकट हुई है…"
uw.dlgIndia22Story_Sitaram_2 = "इस राक्षस की दुष्टता का मुकाबला केवल उसकी भूख से ही किया जा सकता है! हम बोहाग बिहू मनाने की तैयारी कर रहे थे, तभी अचानक, यह… प्राणी प्रकट हुआ और हमारे सारे बीजों को निगल गया!"
uw.dlgIndia22Story_Sitaram_3 = "अग्नि देव साक्षी हैं, महोदया, मैं खुद से यही सवाल पूछता हूँ! अब हम खौफ में सूर्यास्त का इंतज़ार कर रहे हैं… मेरे साथ चलिए, मैं आपसे विनती करता हूँ!"
uw.dlgIndia24_Enter_Puppet_1 = "क्या तुम्हारे पास भाग्य को निर्देशित करने के लिए आवश्यक भावना है? मेरा फैसला करो, मैं तो बस कलाओं का एक विनम्र सेवक हूँ। केवल युद्ध में ही तुम वास्तव में समझते हो कि क्या सही है। साहसी बनो, शैडो—हमला करो!"
uw.dlgIndia24_Story_Dandy_1 = "दरवाज़ा खोलो, वरना मैं यह मनहूस दरवाज़ा तोड़ दूँगा! मुझे पता है कि तुम घर पर हो—मैं तुम्हें सुन सकता हूँ! अगर तुमने मुझे पनाह नहीं दी तो मैं इस झोपड़ी में आग लगा दूँगा!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "ओह, नश्वर कितनी शिद्दत से जीवन से चिपके रहते हैं। मैंने इस काम को नहीं चुना था, और मैं इस पर ज़हरीले आंसू नहीं बहाऊंगी… तुमने मेरे साथ ऐसा क्यों किया?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "उसका दिल प्यार से भरा है। देवता हमें शुद्ध बनाते हैं, लेकिन हम अपना रास्ता खुद चुनते हैं। जब नृत्यु लड़की की कहानी सुनती है तो वह इसे समझने लगती है।"
uw.dlgIndia24_Story_Loose_Puppet_3 = "शैडो, तुम्हारे प्रदर्शन में जुनून और प्रतिबद्धता की कमी है। मैं तुम्हें एक और मौका दूँगा। इसका सिर्फ नाटक मत करो—इसे जियो!"
uw.dlgIndia24_Story_Puppet_1 = "नॉक, नॉक! हे पुराने दोस्तों! भाग्य की आवाज़ हम पर आ पड़ी है—और वह आ रही है! उसका लाल किनारा ढलते हुए दिन के समय खुद जीवन की तरह धधक रहा है!"
uw.dlgIndia24_Story_Puppet_2 = "क्या वह तुम्हारी आत्मा के लिए आई है? दुनिया जितनी ही प्राचीन एक कहानी देखो—नृत्यु की किंवदंती, जिसकी नियति में लोगों की जान लेना लिखा था।"
uw.dlgIndia24_Story_Puppet_3 = "सभी भूत बकबक कर रहे हैं। तुम उन पर भरोसा नहीं कर सकते। और इसके अलावा, यह उनकी बताने वाली कहानी नहीं है। मैं तुम्हें उसकी आँखों से सच्चाई दिखाऊंगा। शैडो, केवल तुम ही इसे समझ सकते हो।"
uw.dlgIndia24_Story_Sensei_1 = "वह आवाज़… लगता है हमारा पुराना दुश्मन एक बार फिर से कुछ कर रहा है। इस बार शिकार कौन होगा? मुझे पगोडा की ओर दौड़ता हुआ एक आदमी दिख रहा है…"
uw.dlgIndia24_Story_Sensei_2 = "तुम्हारे कपड़े गंदगी और कालिख से सने हुए हैं, अजनबी। और तुम्हारी टोन मुझे बेचैन कर रही है। समझाओ तुम कौन हो और हमारे दरवाज़े पर तुम्हारा क्या काम है!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "पीछे हटो! मैं यह नहीं चाहता था! मेरा परिवार मुझसे डरता था, और मैंने सोचा कि यही मेरा मौका है… डैंडी ने मुझे अपने साथ ले जाने का वादा किया था, अगर मैं सिर्फ मदद करूँ…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "बस! तुम एक अनंत नींद में सो जाते हो, हालाँकि तुम इसके लायक नहीं हो। लेकिन तुम्हें आंकना मेरा काम नहीं है—वह किसी और का काम है। मैं तो केवल एक अनुरक्षक हूँ।"
uw.dlgIndia24_Story_Win_Puppet_4 = "बिल्कुल तुम्हारी तरह, शैडो। मैं चाहता हूँ कि तुम नृत्यु के रास्ते पर चलो। उसे अपनी जगह समझने में एक युग लग गया।"
uw.dlgIndia24_Story_Win_Puppet_6 = "शो जारी है! तुम, शैडो, स्टार होगे, और मेरे कलाकार तुम्हारे सहायक खिलाड़ी होंगे। नृत्यु की कहानी हमारा सबसे बड़ा प्रोडक्शन होगी!"
uw.dlgIndia24_Story_Win_Sensei_1 = "यह कहानी बहुत गहरी है—तुम्हारे लिए भी। मैं हैरान हूँ! लेकिन यहाँ क्या सीख मिलती है? तुम हमें यह क्यों दिखा रहे हो?"
uw.dlgMegalithGreetings = "यह खदान एक पवित्र स्थान है। तुम यहाँ क्यों हो? चले जाओ और सम्मान के साथ अपने भाग्य का सामना करो। अंतिम चीज़ जो तुम सुनोगे, वह होगी तुम्हारे पैरों के नीचे कांपती हुई धरती।"
uw.dlgMegalithLost = "धिक्कार है! क्या मुझे फिर से हजारों साल इंतजार करना पड़ेगा? मैंने महाद्वीपों को हिला दिया था! पृथ्वी को शुद्ध करना मेरी भूमिका थी!"
uw.dlgMegalithWin = "मैंने मनुष्यों के साथ दयालुता का व्यवहार किया है, जो इटरनल्स के बीच एक दुर्लभ गुण है। मैंने कई बार तुम्हारी प्रजाति की मदद की। इसलिए भागो और अपने प्रियजनों को अपनी अंतिम विदाई दो!"
uw.dlgRaidIntro1 = "क्या तुम अपनी गलती सुधारने की कोशिश कर रहे हो? तुमने द्वार खोले, लेकिन केवल इटरनल्स ही शैडो के संक्रमण को समाप्त कर सकते हैं। हमारे बीच के न होने के कारण, तुम कमजोर हो।"
uw.dlgRaidIntro2 = "तुम भी बाकी सभी की तरह मर जाओगे। मेरी रगों में मैग्मा बहता है, और यह पूरी भूमि को ढक देगा, इसे नए जीवन के लिए शुद्ध करेगा।"
uw.dlgRaidStory1 = "यह कौन सा तहखाना है, और हम यहाँ क्या कर रहे हैं?"
uw.dlgRaidStory2 = "यह इटरनल्स के साम्राज्य का प्रवेश कक्ष है। उनकी निद्रा सहस्राब्दियों तक चली, लेकिन शैडो के द्वारों ने दुनिया को खतरे में डाल दिया है। वे जाग गए हैं।"
uw.dlgRaidStory3 = "बढ़िया—इसका मतलब है कि वे द्वारों से जल्दी और आसानी से निपटने में हमारी मदद करेंगे!"
uw.dlgRaidStory4 = "अरे नहीं। वे द्वारों को तो नष्ट कर देंगे, लेकिन वे पूरी मानव जाति को भी नष्ट कर देंगे। उनके लिए, यह विनाश और निर्माण का केवल एक और चक्र है।"
uw.dlgShurale_Announce = "लालची डाकुओं द्वारा जगाई गई, जंगल की आत्मा अब निर्दोषों पर अपना बदला ले रही है। जीव यादों का चोरी हुआ संदूक तलाश रहा है—जो उसके प्राचीन जादू का बर्तन है। केवल वे जिनके दिलों में सच्चा दुख है, वे ही इस जीव के क्रोध को शांत कर सकते हैं। हालांकि, इसकी कीमत बहुत भारी होगी…"
uw.dlgStoryBtnFight = "लड़ें!"
uw.dlgStoryBtnMore = "और अधिक"
uw.dlgVolcanoGreetings = "सभी इटरनल्स में से, मैं सबसे पहले जागा था। कई योद्धा मेरे हाथों मरने आएंगे, मैं अपना मिशन पूरा करूँगा।"
uw.dlgVolcanoLost = "पर्याप्त! मैं अपनी हार स्वीकार करता हूँ। लेकिन यह जान लो: तुमने मेरे भाई को जगा दिया है। उसके रूप से धोखा मत खाना, क्योंकि वह फुर्तीला और घातक है!"
uw.dlgVolcanoStory1 = "मैंने कुछ आधे खंडहर हो चुके घर और एक विशाल मूर्ति देखी। क्या यहाँ इंसान रहते हैं?"
uw.dlgVolcanoStory2 = "केवल अंधभक्त। वे बख्श दिए जाने की उम्मीद में इटरनल्स की पूजा करते हैं। सचमुच, वे अपने विश्वास में अंधे हैं। यदि हम असफल रहे, तो वे जल्द ही सच्चाई जान जाएंगे।"
uw.dlgVolcanoWin = "मैं अपने भाइयों से कहता आ रहा हूँ कि इस ग्रह की नियति तय करना मेरा कर्तव्य है। देखो, ओ अविश्वासियों, कैसे मेरी ज्वाला इस भूमि को ढक लेती है!"
uw.dlgVortexGreetings = "काला पानी पृथ्वी और शैडो के द्वारों को निगल जाएगा! उनका रहस्य रसातल में खो जाएगा। और सतह पर इसे बताने के लिए कोई नहीं बचेगा!"
uw.dlgVortexLost = "एक हज़ार साल में पहली बार कोई इंसान जीता है। तुम्हारी जीने की इच्छा बहुत प्रबल है! लेकिन तुम कुछ भी करो, अंत वही होगा: तुम मर जाओगे।"
uw.dlgVortexWin = "हजारों सालों से मैंने तुम्हारी प्रजाति का पतन देखा है। इसमें एक अलग ही सुंदरता है। मुझे लगता है कि मैं तुम्हें जीवित रखूँगा—बस मनोरंजन के लिए।"
uw.dlgWhisperGreetings = "ऐसा लगता है कि किसी को अपना भाग्य जानने का इंतज़ार नहीं है। मुझे अपना हाथ दो और दर्पण में देखो!"
uw.dlgWhisperLost = "तुम अभी भी ज़िंदा हो? तो तुम अभी मेरे वश में नहीं हो! फेटम तुम्हारी नियति बताएगी, और फिर मैं अपनी दुनिया में लौट जाऊंगा—तुम्हें दर्पणों के साथ सावधानी से चलने की चेतावनी देकर!"
uw.dlgWhisperWin = "मैं तुम्हें अपने साथ राख, आत्मा और अनंत रात के दायरे में ले जाऊंगा! मुझ पर भरोसा करो—मेरी आँखों में देखो, और नज़रें मत हटाना।"
uw.dlg_American_25_Loose_1 = "तुम नहीं जानते कि तुम किसकी रक्षा कर रहे हो, शैडो। वे तुम्हें धन्यवाद नहीं देंगे। वे सिर्फ तुम्हारी पीठ पीछे तुम्हारा मज़ाक उड़ाएंगे। जंगली… और मैं राक्षस हूँ?"
uw.dlg_American_25_Story_1 = "मे जा चुकी है। उसे कोई ऐसी चीज़ ले गई है जो शायद ही इंसान हो। फिर भी कोई चीख नहीं थी, संघर्ष का कोई निशान नहीं था… जैसे कि वह अपनी मर्जी से बाहर गई हो।"
uw.dlg_American_25_Story_2 = "हम इसमें अकेले नहीं हैं। मे की तरह अन्य—युवा, मजबूत—भी गायब हो गए हैं। उसे इसके आने का अहसास हो गया था… और उसने अपनी जेबें बारूद से भर ली थीं।"
uw.dlg_American_25_Story_3 = "उसका रास्ता साफ़ है। हमें बारिश आने से पहले उसे खोजना होगा, वरना यह हमेशा के लिए मिट जाएगा। चलो, शैडो!"
uw.dlg_American_25_Story_4 = "जैसे ही तुमने इस शापित ज़मीन पर कदम रखा, मुझे तुम्हारी गंध आ गई थी। तुम क्यों आए हो? मेरे दुख को कुचलने के लिए? तुम्हारे पास कोई सम्मान नहीं है—ठीक वैसे ही जैसे उनके पास नहीं था।"
uw.dlg_American_25_Story_5 = "मुझे पता था कि तुम आओगे, ओझा। बच्चों को उनके परिवार वालों को लौटा दो, और हमारी दोस्त हमें। फिर जाओ और अपनी राख के पहाड़ पर सड़ो।"
uw.dlg_American_25_Story_6 = "राख से राख। और तुम भी राख में मिल जाओगे, नश्वर…"
uw.dlg_American_25_Win_1 = "रुको! मैं अपनी मर्जी से उसके साथ गई थी। उसका रूप जानवर जैसा है, हाँ—लेकिन उसका दिल इंसान का है। और वह पीड़ित है… उन्होंने उसका बच्चा चुरा लिया!"
uw.dlg_CHN_NY25_Announce = "बीते युगों के एक नायक की कहानी में डूब जाएं—सच्चाई को कहानी से अलग करें, और एक नई किंवदंती बनाने में मदद करें! एक रहस्यमय पंथ के खिलाफ खड़े हों जो अपने अत्याचारों को छिपाने के लिए एक महान नायक के नाम का इस्तेमाल करता है! उस जगह पर लौटें जहां से यह सब शुरू हुआ था, और एक भगोड़े बदमाश को उसकी सच्ची वीरता खोजने में मदद करें!"
uw.dlg_CHN_NY25_Loose_1 = "नहीं, हमें लड़ना जारी रखना चाहिए! कोई विश्वास नहीं करेगा कि एक साधारण किसान इतनी आसानी से एक दुष्ट पंथ को हरा सकता है। तुम्हें अपना सब कुछ झोंकना होगा!"
uw.dlg_CHN_NY25_Story_1 = "सन कल्ट (सूर्य पंथ) की साल में एक बार अपने महान नायक के जन्मस्थान पर जाने की परंपरा है। लेकिन हर बार, यह एक आपदा साबित होती है…"
uw.dlg_CHN_NY25_Story_2 = "वह इंसान के रूप में पैदा हुआ था? कितनी अजीब बात है। मुझे लगता है कि ये लोग गांव में उपहार लेकर नहीं आ रहे हैं…"
uw.dlg_CHN_NY25_Story_3 = "वे कुछ भी नहीं छोड़ते! वे ग्रामीणों के मवेशी चुराते हैं, नशे की धुत में फसलें बर्बाद करते हैं, खिड़कियां तोड़ते हैं और झगड़े मोल लेते हैं!"
uw.dlg_CHN_NY25_Story_4 = "लेकिन गांव वाले पलटवार क्यों नहीं करते? यह उनकी ज़मीन और उनकी किंवदंती है!"
uw.dlg_CHN_NY25_Story_5 = "वे टूट चुके हैं। जिस नायक ने उन्हें उम्मीद दी थी वह जा चुका है, और पंथ के लोग उसके नाम पर बुराई करते हैं। हमें उन्हें एक बार फिर उम्मीद देनी होगी!"
uw.dlg_CHN_NY25_Story_6 = "कहो कि तुम यह जांचने आए हो कि 'छुट्टी' के लिए सब कुछ तैयार है। और हम लड़ेंगे! शहरवासी देखेंगे कि पंथ का सामना किया जा सकता है!"
uw.dlg_CHN_NY25_Story_7 = "बहुत बढ़िया, जैसा तुम चाहो… मुझे अपने किरदार में आने दो। 'हे लड़के, तुम्हारी हमारे नायक की पोशाक पहनने की हिम्मत कैसे हुई! चले जाओ—हमें दावत की तैयारी करनी है!'"
uw.dlg_CHN_NY25_Story_8 = "मैं कोई किंवदंती का नायक नहीं हो सकता, लेकिन उसकी आत्मा इस ज़मीन में बसती है! वह मेरे सबसे बुरे समय में मेरा मार्गदर्शन करेगा और मुझे साहस देगा! हमला करो!"
uw.dlg_CHN_NY25_Win_1 = "मुझे एक साधारण आदमी से इतनी गति की उम्मीद नहीं थी… तुमने लगभग हमारे चैंपियन को हरा ही दिया था! हमें तुम्हें एक उदाहरण बनाना होगा, ताकि दूसरों के मन में ऐसे विचार न आएं…"
uw.dlg_NY25_Loose_1 = "तुम्हारी यादें ज्वलंत हैं, और दुख तर्क से अधिक ज़ोर से बोलता है। तुम यहीं मेरे साथ रहोगे। थोड़ी देर आराम करो—नींद जल्द ही आ जाएगी。"
uw.dlg_NY25_Story_1 = "स्वागत है! यह केबिन कभी मेरे परिवार का हुआ करता था। कितनी सारी यादें… जब तक चाहो यहाँ रहो। आराम करने के लिए यहाँ तुम्हारी ज़रूरत की हर चीज़ मौजूद है।"
uw.dlg_NY25_Story_2 = "लेकिन तुमने हमें इतनी बार खतरे में डाला है, और अब तुम हमें अपने पुश्तैनी घर में रुकने की पेशकश कर रहे हो? क्या यह कोई चाल है?"
uw.dlg_NY25_Story_3 = "बस अंतरात्मा की आवाज़ बोल रही है! मुझे एहसास हो गया है कि मैंने दूसरों की दयालुता का बहुत लंबे समय तक फायदा उठाया है। लेकिन अब, मैं अच्छा करना चाहता हूँ।"
uw.dlg_NY25_Story_4 = "हम अकेले नहीं हैं… झोपड़ी के सामने लोग इकट्ठा हो रहे हैं। इतनी रात गए उन्हें क्या चाहिए? वे हमें बाहर आने के लिए बुला रहे हैं।"
uw.dlg_NY25_Story_5 = "मत जाओ! प्रेत तुम्हें नष्ट कर देंगे! वे और कुछ नहीं बल्कि दर्दनाक यादों के भूत हैं। जंगल की आत्मा अपने संदूक के लिए आई है! चलो उसे वापस लाएं!"
uw.dlg_NY25_Story_6 = "एक संदूक? तो इसलिए लोग जंगल में गायब हो रहे थे! स्लाय, तुमने हमें धोखा क्यों दिया? हम वैसे भी इस नेक काम में तुम्हारी मदद करते!"
uw.dlg_NY25_Story_7 = "तुम नहीं समझते। अगर मैं उसकी आवाज़ सुनूंगा, तो मैं अपना नियंत्रण खो बैठूंगा—और मैं भी चला जाऊंगा। जब तक मैं उसका एक अंश अपने साथ लेकर चलता हूँ।"
uw.dlg_NY25_Story_8 = "दरवाज़ा खोलो, मैं यहाँ जम रही हूँ, पिताजी। घर ठंडा है और मैं अंदर नहीं हूँ। मैं आपको एक ऐसी जगह दिखाऊंगी जहाँ हम फिर से एक साथ हो सकते हैं।"
uw.dlg_NY25_Story_9 = "रुको! जंगल में मत जाओ—तुम अपना रास्ता भूल जाओगे! मुझे नहीं पता कि तुम किसकी आवाज़ सुन रहे हो, लेकिन यह निश्चित रूप से किसी इंसान की नहीं है!"
uw.dlg_NY25_Win_1 = "उठो, स्लाय! आत्मा को संदूक लौटा दो जबकि वह कमज़ोर है। उसे देखने दो कि मानवता अपने लालच पर जीत हासिल कर सकती है।"
uw.saturn_enter_saturn_1 = "मैं तुम्हारे शब्द तुम्हारे ही गले में वापस उतार दूंगी। और तुम्हारे दोस्त देखेंगे। मेरी जेल से निकलने का एकमात्र तरीका फांसी के फंदे से होकर है। सबसे पहले कौन जाना चाहता है?"
uw.saturn_greeting_saimon_1 = "हमारे शासक, पैट्रिआर्क, ने वर्षों तक पोर्टल का अध्ययन किया। फिर, एक दिन, उसने खुद को सबसे अलग कर लिया। बाद में, उसने ओबिलिस्क का निर्माण किया, और इसने हमारी दुनिया के साथ कुछ किया…"
uw.saturn_greeting_saimon_2 = "आणविक स्तर पर शैडो ओबिलिस्क के समान है। कोई है जो पैट्रिआर्क के खिलाफ इसका इस्तेमाल करने में हमारी मदद करेगा। इसलिए हम यहाँ सैटर्न के कक्ष में हैं…"
uw.saturn_greeting_saimon_3 = "हज़ार बार माफ़ी चाहूँगा, महोदया। फिर भी, हमें लाजरस को मुक्त करना होगा। कृपया हमें उसकी कालकोठरी का रास्ता दिखाएँ, और हम आपको आगे परेशान नहीं करेंगे।"
uw.saturn_greeting_saturn_1 = "बहुत दूर जा रहे हो, बच्चो? तुम अपनी मर्ज़ी से मेरी जेल में आए हो! मुझे आश्चर्य है—क्या यह बहादुरी है या मूर्खता? तुम, दुबले-पतले इंसान—मुझे जवाब दो!"
uw.saturn_greetingn_May_1 = "लेकिन इसका हमसे क्या लेना-देना?"
uw.saturn_lose_saturn_1 = "तुम्हारे लिए इतना काफी है। अगर लाजरस तुम्हारे जैसे नाकारों के साथ मिल रहा है, तो पैट्रिआर्क को कोई खतरा नहीं है। यहाँ से निकल जाओ, निकम्मो! तुम मेरी सूची में नहीं हो।"
uw.saturn_win_saturn_1 = "तुम लाजरस को कभी नहीं ढूंढ पाओगे। वह बदमाश मेरी जेल से भाग निकला और दलदल की ओर भाग गया। तुम भी मरना चाहते हो? तो जाओ उसके पीछे!"
uw.summerfest25_story2_1 = "वाह, वाह… तुम मुझे खोजने के लिए इतने बेताब थे, तो मैंने सोचा कि मैं तुम पर यह उपकार कर दूँ। इसके अलावा, सभी को इस पल का इंतज़ार था।"
uw.summerfest25_story2_2 = "'सभी को'? यह नाटक बंद करो। हम अच्छी तरह जानते हैं कि तुम कौन हो—और तुम दूसरों के दुखों का मज़ा लेने के लिए उनका इस्तेमाल कैसे करते हो।"
uw.summerfest25_story2_3 = "बस एक छोटा सा कैमियो, और बूम—मैं ट्रेंड कर रहा हूँ! ईमानदारी से कहूँ तो, मुझे इतना लोकप्रिय होने की उम्मीद नहीं थी।"
uw.summerfest25_story2_4 = "तुम्हारी चतुराई तुम्हें नहीं बचा पाएगी। तुम्हें कीमत चुकानी होगी—मेरी आँखों के लिए, और तुम्हारे द्वारा की गई सभी बुराइयों के लिए। तुम्हारा भगवान बनने का यह विकृत खेल यहीं खत्म होता है!"
uw.summerfest25_story2_5 = "सच में, एर्मिन? उस तरह की बातें फ्लिप फोन के साथ ही चली गईं। यह 2026 है—समय के साथ चलने की कोशिश करो।"
uw.summerfest25_story2_6 = "आर्किटेक्ट जो भी योजना बना रहा है… उसके चारों ओर एक अंधकार है। एक ऐसी दुर्भावनापूर्ण शक्ति, जो लगभग मूर्त है।"
uw.summerfest25_story2_7 = "उसके बोले गए हर शब्द के साथ, मैं एर्मिन की कहानी पर और अधिक विश्वास करने लगा हूँ। आर्किटेक्ट खतरनाक है—और उसे रोका जाना चाहिए।"
uw.summerfest25_story2_defeat_1 = "ओह नहीं—कितनी निराशाजनक बात है! दर्शकों को और अधिक की उम्मीद थी। ऐसा लगता है कि मुझे अगली बार दांव बढ़ाना ही पड़ेगा।"
uw.summerfest25_story2_win_1 = "दुनिया इतनी क्रूर क्यों है? हमें कष्ट क्यों सहना पड़ता है? मुझे खुद को अंधा क्यों करना पड़ा? मुझे जवाब दो, आर्किटेक्ट—जीने में दर्द क्यों होता है!?"
