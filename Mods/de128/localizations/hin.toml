uw.MERCENARY_RAID = "मर्सिनरी यूनिट"
uw.MERCENARY_RAID_Title = "मर्सिनरी यूनिट"
uw.MiniEventAnnounce = "प्राचीन काल से ही, एक पंथ पृथ्वी के गर्भ में निवास कर रहा है, जो पाताल लोक के देवताओं की गहरी नींद की रखवाली कर रहा है और उन्हें जागने से रोक रहा है। लेकिन इसकी कीमत एक क्रूर अनुष्ठान की लड़ाई है, जो खून की आखिरी बूंद तक लड़ी जाती है।"
uw.MiniEventHungerFight_Enter_1 = "यहाँ पृथ्वी के नीचे, सब कुछ अलग है। हम जीने के लिए लड़ते हैं, और भोजन ही जीवन है! अपने लोगों को—या मेरे लोगों को—इस महान आनंद से वंचित मत करो!"
uw.MiniEventHungerStory_1 = "लोग आत्माओं की सनक की परवाह तभी करते हैं जब उनके घरों पर मुसीबत आती है। उनकी फसलें मुरझा जाती हैं, उनके बच्चे भूखे रह जाते हैं… और अब उनका विश्वास कहाँ है?"
uw.MiniEventHungerStory_2 = "भूख का एक रूप होता है। इसकी निगलने की प्यास भयानक होती है। लेकिन वह कार्सर (Karcer) की भूमिका है, जबकि तुम्हारा और मेरा काम उसे उसकी सदियों पुरानी नींद से जागने से रोकना है।"
uw.MiniEventHunger_Loss_1 = "क्या तुम्हारी माँ ने तुम्हें अपनी प्लेट में कुछ भी न छोड़ना नहीं सिखाया था? यह दिखता है—तुम्हारी आँखों में भूख है! या… तुम्हारे साथ बात क्या है?"
uw.MiniEventHunger_Win_1 = "हाँ, तुम अच्छा प्रहार करते हो, शैडो… चलो तुम्हारी जीत का जश्न कुछ स्वादिष्ट खाने के साथ मनाते हैं! मेरी तरफ से दावत!"
uw.MiniEventStory_1 = "मैं देख रहा हूँ कि तुम, शैडो, मजबूत और दृढ़ आत्मा वाले हो। तुम्हारे कामों की किंवदंतियां दूर-दूर तक फैली हुई हैं। क्या तुम एक और का हिस्सा बनना चाहोगे?"
uw.MiniEventStory_2 = "पाताल लोक की आत्माएं मनमौजी हैं। हम उनके गुस्से को शांत करने के लिए एक अनुष्ठान करते हैं—अनुष्ठानिक लड़ाइयाँ! तुम्हारी भागीदारी हमारे लिए सम्मान की बात होगी।"
uw.MiniEventStory_EnterBattle = "क्या तुम ऐसे रहस्यमय तमाशे के लिए थोड़े बीमार नहीं हो? और तुमने सचमुच इसे चुना है? यह किंवदंतियों का आदमी है? ओह, आत्माएं तो क्रोधित हो जाएंगी…"
uw.MiniEventStory_Loss_1 = "हाँ, खैर… मैं यह मानना चाहता हूँ कि आत्माओं में भी हास्य की भावना होती है, और वे अपना क्रोध हम पर उतारने के बजाय, अखाड़े में हमारी इस बेतुकी लड़ाई पर केवल हंसेंगी…"
uw.MiniEventStory_Win_1 = "खैर… कोई भी इस अखाड़े में संयोग से नहीं आता। तुम सच में किंवदंतियों के आदमी हो, शैडो।"
uw.MiniEventVulkanFight_Enter_1 = "डायन तुम्हें बिना वजह डराती है। यह उससे कहीं अधिक सरल है: स्टील आग में ही मजबूत होता है! देवता केवल शक्ति को समझते हैं और कुछ नहीं। केवल शक्ति ही उन्हें उनकी नींद में वापस भेज सकती है! हमला करो!"
uw.MiniEventVulkanStory_1 = "पवित्र करने वाली अग्नि ही न्यायसंगत है—हमारे पूर्वज ऐसा कहते हैं। लेकिन वे नहीं जानते थे कि अमरों को मानवीय नैतिकता की कोई परवाह नहीं है। यह बस उनका स्वभाव है।"
uw.MiniEventVulkanStory_2 = "क्या तुम धरती के नीचे से उठती गर्मी को महसूस कर रहे हो? तुम्हें एक बात जान लेनी चाहिए: आग किसी को नहीं बख्शती, चाहे वह दोस्त हो या अजनबी। और हम सीधे उसके रास्ते में खड़े हैं。"
uw.MiniEventVulkan_Loss_1 = "तुम्हें फिर से खड़ा होना होगा, शैडो! क्या तुम ज़मीन को कांपते हुए महसूस नहीं कर सकते?! देवता हमारी इस धूल-मिट्टी की लड़ाई से परेशान हो रहे हैं…"
uw.MiniEventVulkan_Win_1 = "यहाँ नर्क की आग जैसी गर्मी है… अग्नि आत्मा अपनी तिजोरी में संतुष्टि से गुर्रा रही है! वास्तव में एक बेहतरीन लड़ाई, शैडो! हमने एक और दिन कमा लिया है!"
