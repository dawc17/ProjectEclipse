sensei.victory.Prince_zone1_1 = "धन्यवाद! तुम नेक हो—बहुत कम लोग अपनों से अनजान व्यक्ति के लिए खड़े होते हैं। मुझे लगा मौत करीब है—ये लोग दया का मतलब नहीं जानते।"
sensei.victory.Prince_zone1_2 = "मुझे कुछ ऐसा पता चला जो मुझे नहीं पता होना चाहिए था: मेरे सैनिक एक निश्चित हर्मिट के तहत निषिद्ध प्रथाओं का अध्ययन कर रहे हैं। वे मुझे गवाह के रूप में खत्म करना चाहते थे..."
sensei.victory.Prince_zone1_3 = "मैं चीजों को स्पष्ट करने के लिए अपने सैनिकों की एक इकाई लेकर गया, लेकिन मुझे बंदी बना लिया गया। हालाँकि, किस्मत अभी भी मेरे साथ थी, और मैं भागने में सफल रहा।"
sensei.victory.Prince_zone2_1 = "मेरे आदमी! उसे मेरी सेना के प्रमुख पद पर रखना एक गलती थी... यदि तुम्हारे पास अभी भी सम्मान का एक अंश है, तो हमें बताओ कि डाकुओं का शिविर कहाँ है!"
sensei.victory.Sensei_arc_outro = "समाप्त।"
sensei.victory.Sensei_zone1_1 = "बहुत अधिक संयोग। किसी को हमारी यात्रा के बारे में पता था और उसने डाकुओं को चेतावनी दी थी। लेकिन हर्मिट इसमें कैसे शामिल है? हमें पता लगाने की जरूरत है। चलो!"
sensei.victory.Sensei_zone2_1 = "तुम्हें शर्म आनी चाहिए! अपने सम्मान को सीधे बेच रहे हो! और किसलिए? क्या तुम्हें लगता है कि लोग एक गद्दार का अनुसरण करेंगे? क्या यह युवाओं के लिए एक अच्छा उदाहरण है?"
sensei.victory.Sensei_zone3_2 = "मुझे जवाब दो: शोगुन उसे मृत क्यों देखना चाहता है, और तुम जिस जादुई स्फीयर की बात कर रहे थे वह क्या है?"
sensei.victory.Sensei_zone4_2 = "हमें राजकुमार को विडो मिलने से पहले रोकना होगा... और स्फीयर..."
sensei.victory.Sensei_zone5_1 = "मैं तुम्हारे साथ सहानुभूति रखता हूँ—सचमुच। लेकिन टूटा हुआ दिल एक बुरा सलाहकार है। कृपया समझें: तुम्हारी वजह से लोग पीड़ित हैं।"
sensei.victory.Sensei_zone6_2 = "रुको! मेरे पास बहुत सारे सवाल हैं! तुम कौन हो? वहाँ क्या है, गेट्स के पीछे? मैं जानना चाहता हूँ..."
sensei.victory.Wasp_zone4_3 = "रुको—मैंने तुम्हें कम आँका था, बूढ़े आदमी! मुझे डिलीवरी के लिए भुगतान किया गया था, लेकिन विडो के सम्मान के लिए लड़ने से मेरा कोई लेना-देना नहीं है। मैं तुम्हें उसके छिपने की जगह दिखाऊँगी!"
sensei.victory.Wasp_zone4_4 = "विडो राजकुमार से प्यार करती थी, लेकिन उसने उसे ठुकरा दिया। फिर उसे एक नया खिलौना मिल गया: शोगुन। वह बुढ़िया अपने बदले के लिए उस मूर्ख सेनापति का इस्तेमाल कर रही है।"
sensei.victory.Wasp_zone4_5 = "विडो पुरुषों पर शासन करना चाहती है और उन्हें एक-दूसरे के खिलाफ लड़वाना चाहती है। स्फीयर उसके चुने हुए व्यक्ति को महान... और उसके प्रति पूरी तरह से वफादार बना देगा।"
sensei.victory.Widow_zone5_3 = "मेरे लिए वापस लौटने का कोई रास्ता नहीं है। मैं देख सकती हूँ कि तुम मदद करना चाहते हो, लेकिन बहुत देर हो चुकी है—राजकुमार पहले ही स्फीयर ले चुका है। शोगुन ने उसकी रक्षा करने की कोशिश की, लेकिन सब व्यर्थ रहा।"
sensei.victory.Widow_zone5_4 = "ने राजकुमार को कभी इतना... उग्र नहीं देखा। उसकी आँखों से अंगारे बरस रहे थे! उसने सोचा कि उस जगह पर एक देशद्रोही को मौत के घाट उतारना मज़ेदार होगा जहाँ हम पहली बार मिले थे। मैं तुम्हें दिखाती हूँ..."
