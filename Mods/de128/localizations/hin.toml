uw.TRANSIENT_BLEEDING = "जलने का प्रभाव छोड़ना।"
uw.Tenebris_greetings_1 = "तुम वास्तविकता के छोर पर हो, यात्री। यह अंतिम सीमा है। इस रेखा के परे वह शून्यता है जिसमें संसारों का जन्म होता है। और वह मैं ही था जिसने उनके प्रकाश और अंधकार को गढ़ा था!"
uw.Tenebris_greetings_2 = "शैडो, उसके पीछे का पोर्टल हमारे लिए मुक्ति का मौका हो सकता है। इटरनल्स ने कहा था कि वे हमारी दुनिया को नष्ट कर देंगे। शायद उसकी मदद से?"
uw.Tenebris_greetings_3 = "तुम पोर्टल में जीवित नहीं बच पाओगे! यह अज्ञात भूमि है। वह अंधकार जिसमें संसारों का निर्माण किया जा सकता है। लेकिन तुम निर्माण नहीं कर सकते, केवल विनाश कर सकते हो। पोर्टल तुम्हें पूरा निगल जाएगा!"
uw.Tenebris_greetings_4 = "यह एक जोखिम है, लेकिन क्या हमारे पास कोई और विकल्प है? हम पोर्टल में प्रवेश करके इटरनल्स को रोक सकते हैं। लेकिन हम एक बड़ी तबाही का कारण भी बन सकते हैं।"
uw.Tenebris_loses = "क्या तुम अंधेरे में छिपे अज्ञात से डरते हो? अब तुम इसका सामना करने के लिए अकेले रह जाओगे! दुनिया धूल में मिल जाती है और फिर से नया जन्म लेती है। सर्पिल पथ का अनुसरण करते हुए।"
uw.Tenebris_wins = "जिद्दी मूर्ख! तुम इंसान केवल ताकत से ही समस्याओं को हल कर सकते हो। लेकिन ब्रह्मांड इस तरह काम नहीं करता। इतने साल हो गए, और तुमने कुछ नहीं सीखा..."
uw.Title_Sitaram = "सीताराम"
uw.War_AfterLoss = "उठो, कठपुतली! और लड़ो! इससे कोई फर्क नहीं पड़ता कि तुम जीतते हो या हारते हो। जब तुम लड़ते हो, तो तुम मेरी सेवा करते हो!"
uw.War_AfterWin = "ढोंगी! तुम्हारा गुस्सा कहाँ है? तुम इसके बिना कैसे लड़ सकते हो? मुझसे लड़ो! चलो तलवारों का एक और नृत्य शुरू करें! मैं जानता हूँ कि तुम्हारे भीतर युद्ध जीवित है!"
uw.War_Greetings1 = "कितना प्यारा दिन है! मैं एक तूफान की तरह युद्ध को आते हुए महसूस कर सकता हूँ। गड़गड़ाहट। ताल मिलाते सेनाओं के अनकहे रोष। वे सभी मेरी वेदी पर उपहार हैं!"
uw.War_Greetings2 = "उसके भीतर क्रोध और खून की प्यास उबल रही है। वह अनंत युद्ध का आनंद लेती है, पर किसलिए? अपनी खोपड़ियों के पहाड़ की चोटी पर उसे क्या मिलेगा?"
uw.War_Greetings3 = "क्या खूनी युद्ध का रोमांच तुम्हारे लिए इतना पराया है? आग, जुनून, तूफानी ताकत! दिखाओ कि तुम क्या कर सकते हो! द्वंद्वयुद्ध में मेरा मनोरंजन करो या मर जाओ!"
