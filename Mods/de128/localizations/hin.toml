# BEGIN Sensei sensei.notify.
sensei.notify.ending = "मुझे याद आया कि अंत में क्या हुआ था। क्या हम अपनी कहानी पर वापस चलें?"
sensei.notify.intro = "यह जगह कुछ यादें ताज़ा करती है। मैं तुम्हें अपनी कहानी बताऊंगा—जो कई साल पहले घटी थी..."
sensei.notify.more = "मुझे कुछ और याद आया। क्या हम अपनी कहानी पर वापस चलें?"
sensei.notify.title = "सेंसी"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "तुम कोई सपना नहीं देख रहे हो। मैंने स्फीयर (गोले) को वापस परछाइयों में ले जाने के लिए समय को रोक दिया है। यहाँ इसकी उपस्थिति एक भूल थी—जो गेट्स ऑफ शैडोज़ की अस्थिरता के कारण हुई थी।"
sensei.victory.Ancient_zone6_2 = "बदलाव करीब है, मानव। फिलहाल के लिए, सो जाओ। जब तुम जागोगे, तो किसी को भी तुम्हारा यह कारनामा याद नहीं रहेगा। ऐसा होना ही चाहिए। एक दिन, तुम समझ जाओगे..."
sensei.victory.Butcher_zone3_3 = "ही-ही! देखो कैसे राजकुमार दुम दबाकर भाग रहा है! तुम्हें अपना चेहरा देखना चाहिए था, बूढ़े आदमी। देखा? तुम्हारा नया दोस्त एक डरपोक झूठा है!"
sensei.victory.Butcher_zone3_4 = "I मैं जानता हूँ कि जैसे ही राजकुमार अपनी आखिरी सांस लेगा, शोगुन मुझे जिंदा नहीं छोड़ेगा। मैं सिर्फ एक मोहरा हूँ—जो काम आने पर फेंका जा सकता है। इसलिए... मैं तुम्हारी मदद करूँगा।"
sensei.victory.Butcher_zone3_5 = "एक महिला ने शोगुन को विश्वास दिलाया कि सिंहासन पर उसका अधिकार है। उसने वादा किया कि उसके पास स्फीयर होगा और वह एक महान सेनापति बनेगा—यह सब उसका अधिपति बनने के बदले में होगा।"
sensei.victory.Butcher_zone3_6 = "बंदरगाह पर जाओ। शोगुन एक जहाज के आने का इंतजार कर रहा है—वही जो स्फीयर ला रहा है। यह राजकुमार के लिए अपना सिंहासन वापस पाने का आखिरी मौका है।"
sensei.victory.Hermit_zone2_3 = "समझने की कोशिश करो—हमारी कला अपने अंत पर है! जीवित रहने के लिए, इसे बदलना होगा। मैं जानता हूँ कैसे, और शोगुन ने अपने आदमियों को प्रशिक्षित करने के बदले में मुझे सुरक्षा देने का वादा किया है।"
sensei.victory.Hermit_zone2_4 = "बुचर अपने गैंग के साथ यहाँ से ज़्यादा दूर नहीं रहता है। वे ही आपके अपहरणकर्ता थे, महाराज। जाइए—may you find the answers you seek."
