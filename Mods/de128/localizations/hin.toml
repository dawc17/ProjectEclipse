uw.blackness_enter_blackness_1 = "संतान। एक महान बलिदान। एक गोला। दिमाग। कसाईखाना। मैं महसूस करता हूँ। तुम खून बहाओगे। मुझे दर्द दिखता है। मुझे भविष्य दिखता है। मैं तुम्हें दिखाऊंगा।"
uw.blackness_greeting_blackness_1 = "बात क्या है, शैडो? क्या तुम्हारी तबीयत ठीक नहीं है?"
uw.blackness_greeting_lazarus_2 = "साइमन? तुम कितने नीच हो! तुम लोगों को यहाँ क्यों लाए? यह तुम्हारे विचारों की गंध पकड़ लेगा! यहाँ से दूर भाग जाओ इससे पहले कि ब्लैकनेस तुम्हारे दिमाग को चख ले!"
uw.blackness_greeting_may_1 = "क्या तुम सुन रहे हो? कुछ नहीं! सन्नाटा। पक्षियों की चहचहाहट के बिना, ऐसा लगता है जैसे यह जगह एम्बर में जम गई हो। क्या हम सही कर रहे हैं? मुझे बहुत बुरा लग रहा है…"
uw.blackness_greeting_saimon_2 = "ये सज्जन तुम्हारी आज़ादी का टिकट हैं, मेरे दोस्त। काले कपड़ों वाला यह बड़ा आदमी किसी तरह ओबिलिस्क और गेट्स से जुड़ा है। वह तुम्हारी मदद करेगा, और तुम उसकी मदद करना।"
uw.blackness_greetingn_saimon_1 = "कोई आश्चर्य नहीं। जब से प्राचीन गेट्स का एक टुकड़ा यहाँ गिरा है, इस जगह पर जीवन एक सांख्यिकीय विसंगति बन गया है। अपनी आँखें खुली रखो—हमें लाजरस को खोजना है।"
uw.blackness_lose_blackness_1 = "तुम यहीं रहो। हमेशा के लिए। एक खून। सदा के लिए। मैं तुम्हें पढ़ूंगा। मैं अपना पेट भरूंगा।"
uw.blackness_win_sensei = "तुमने हमसे झूठ बोला, विज्ञान के आदमी! हमने किसे आज़ाद कर दिया है? हमने इस दुनिया को किस मुसीबत में डाल दिया है? क्या तुम्हें अहसास है कि तुमने क्या किया है?!"
