uw.HW20Arkhos1 = "मुझे यह देखने के लिए किसी दूरदृष्टि की आवश्यकता नहीं है कि विश्वास की आग कमज़ोर और अंधे दोनों को भस्म कर देगी। मैं काली मोमबत्तियां लाया हूँ, ताकि सभी इस सच्चाई को उतनी ही स्पष्टता से देख सकें जितना कि मैं देखता हूँ!"
uw.HW20Fatum1 = "दुनिया के बीच की सीमाएं पतली हो रही हैं—भविष्यवाणी के लिए यह सबसे बेहतरीन रात है! हवा में जादू गूंज रहा है, और मेरे हाथों में, भाग्य के धागे लिपटे हुए हैं!"
uw.HW20Fatum2 = "भविष्य बताना, मेरे लिए, एक खेल है—मैं नश्वरों के भाग्य के साथ जो चाहूँ कर सकता हूँ। लेकिन आप, मेरे दोस्तों, बिल्कुल अलग बात हैं। कृपया, बैठ जाइए!"
uw.HW20Fatum3 = "तुम अपनी नफरत से अंधे हो गए हो। चलो शुरू करते हैं। बोलो मत, बस सुनो। मुझे एक आकृति दिखाई दे रही है… रात जैसी काली… पंख और राख… मुझे हाथ से पकड़ रही है…"
uw.HW20Fatum4 = "तुम… तुम यहाँ कैसे आए? इस दुनिया का रास्ता तुम्हारे लिए सील कर दिया गया था!"
uw.HW20Megalith1 = "तुमने भविष्य बताने और एक छद्मवेशी (masquerade) पार्टी के बारे में बात की थी, इसलिए मैं एक जादुई दर्पण लाया हूँ। हज़ार सालों में पहली बार, मैं अपना अक्स देख सकता हूँ। यह मुखौटा मुझे बहुत प्राचीन दिखा रहा है!"
uw.HW20Whisper1 = "क्या तुम भविष्यवाणी का खेल खेल रही हो, छोटी बहन? नश्वरों की नियति का प्रभार ले रही हो? ऐसे खिलौने हमेशा से सिर्फ मेरे ही रहे हैं!"
uw.HW20Whisper2 = "सील तो था! लेकिन तुमने बुलाया, और इस अद्भुत दर्पण के ज़रिए, मैं आ गई। मैं इसे अपने साथ ले जा रही हूँ। ज़रूर आना, और कुछ सच्चे भविष्यवाणियां सुनना!"
uw.Hunger_AfterLoss = "चूंकि तुम ही चुने गए व्यक्ति हो, मैं तुम्हें मेरे साथ रहने और दावत उड़ाने का एक आखिरी मौका दूँगा। अन्यथा तुम्हारी हड्डियाँ भी धूल में अन्यों के साथ मिल जाएंगी।"
uw.Hunger_AfterWin = "निर्माता, आपने मेरे लिए आहार भेजा, लेकिन यह पर्याप्त नहीं है। मेरी भूख अनंत है, मुझे मुक्ति दें..."
uw.Hunger_Greetings1 = "तुम यहाँ पहुँचने के लिए काफी लंबा रास्ता तय करके आए हो। क्यों? उन कृतघ्न नश्वर लोगों को बचाने के लिए? उन्हें तुम्हारी कोई परवाह नहीं है! मैं तुम्हारे अकेलेपन, तुम्हारी भूख और तुम्हारे... डर को महसूस कर सकता हूँ।"
uw.Hunger_Greetings2 = "शैडो, धोखे में मत आना! वह केवल कमज़ोर दिखता है। तुम उसके दोस्त नहीं हो, तुम बस उसके शिकार हो। यदि तुम थोड़े भी करीब गए तो वह तुम्हें टुकड़ों में फाड़ देगा!"
uw.Hunger_Greetings3 = "क्या तुम मेरे भाइयों को देख सकते हो? वे प्यासे हैं, लेकिन उनकी प्यास एक अलग तरह की है। वे मनोरंजन के भूखे हैं। लेकिन उनकी भूख मेरी भूख के सामने कुछ भी नहीं है!"
