uw.blackness_enter_blackness_1 = "Descendência. Um grande sacrifício. Uma esfera. A mente. Carnificina. Eu sinto. Você vai derramar sangue. Vejo dor. Vejo o futuro. Eu lhe mostrarei."
uw.blackness_greeting_blackness_1 = "Qual é o problema, Shadow? Você está passando mal?"
uw.blackness_greeting_lazarus_2 = "Simon? Que canalha você é! Por que trouxe pessoas para cá? Ela vai sentir o cheiro dos seus pensamentos! Saiam daqui antes que a Escuridão experimente a sua mente!"
uw.blackness_greeting_may_1 = "Você ouve isso? Nada! Silêncio. Sem o canto dos pássaros, é como se este lugar estivesse congelado em âmbar. Estamos fazendo a coisa certa? Estou com um pressentimento muito ruim…"
uw.blackness_greeting_saimon_2 = "Estes nobres cavalheiros são o seu passaporte para a liberdade, meu caro. O grandalhão de preto está, de alguma forma, conectado ao Obelisco e aos Portões. Ele ajuda você, e você ajuda ele."
uw.blackness_greetingn_saimon_1 = "Não é de se admirar. Desde que um fragmento dos antigos Portões caiu aqui, a vida neste lugar tem sido uma anomalia estatística. Fiquem de olhos abertos — precisamos encontrar Lazarus."
uw.blackness_lose_blackness_1 = "Você fica aqui. Eternamente. Um só sangue. Para sempre. Eu lerei você. Eu me alimentarei."
uw.blackness_win_sensei = "Você mentiu para nós, homem da ciência! Quem nós libertamos? A que nós condenamos este mundo? Você tem noção do que fez?!"
