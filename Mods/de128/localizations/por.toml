# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "A História do Sensei{br}Parte 1. A Testemunha"
sensei.entry.ActScreenSensei2 = "A História do Sensei{br}Parte 2. A Sombra do Futuro"
sensei.entry.ActScreenSensei3 = "A História do Sensei{br}Parte 3. A Besta Interior"
sensei.entry.ActScreenSensei4 = "A História do Sensei{br}Parte 4. A História da Vingança"
sensei.entry.ActScreenSensei5 = "A História do Sensei{br}Parte 5. Humilhada e Ofendida"
sensei.entry.ActScreenSensei6 = "A História do Sensei{br}Parte 6. O Monstro"
sensei.entry.ButcherYoung_Greetings = "Ninguém ousa duvidar de minha autoridade! A família nunca se esquece disso. Você não sairá daqui vivo!"
sensei.entry.Butcher_zone3_1 = "Ah, o bom filho à casa torna! Reconsiderou minha proposta, Príncipe? Aquela que, se eu o deixasse ir e contasse a localização da Esfera, você me recompensaria com ouro?"
sensei.entry.Butcher_zone3_2 = "O silêncio dele é maior que qualquer palavra, meu velho. Eu sou honesto comigo mesmo, assumindo minha natureza bestial. Ele, não. Mas vamos lhe ensinar humildade! Venham, crianças!"
sensei.entry.Guard1_Butcher_Sensei = "O Açougueiro me mostrou como a dor revela nosso eu verdadeiro, e agora sou livre! Você também pode encontrar a felicidade. Não resista!"
sensei.entry.Guard1_Hermit_Sensei = "A mudança é iminente! Cruzei metade do mundo para aprender isso e sacrifiquei muito... A sabedoria do Mestre é tudo o que tenho!"
sensei.entry.Guard1_Lynx_Sensei = "Gostou das minhas tatuagens? Na terra onde nasci, o mais forte ganha isso como lembrancinha de seus grandes feitos. Em breve, você também estará aqui no desenho..."
sensei.entry.Guard1_Wasp_Sensei = "Tu acredita em sorte? Porque hoje vou tirar a sorte grande, fazendo uma fortuna com teu dinheiro. Tá se achando sortudo, velho?"
sensei.entry.Guard1_Widow_Sensei = "Minha senhora é como uma irmã para mim. Posso sentir sua dor. Mas ela me proíbe de tocar num fio de cabelo sequer do Príncipe, então minha ira será direcionada a você!"
sensei.entry.Guard2_Butcher_Sensei = "Esse jogo já está ganho! Filosofia é para trouxas! Já eu, meu lance é brincar com facas. Quer brincar comigo?"
sensei.entry.Guard2_Hermit_Sensei = "O Mestre nos contou sobre o Mundo das Sombras, seus habitantes e os poderes imediatos que vai dividir conosco. Acha que vou deixar você tirar isso de nós?"
sensei.entry.Guard2_Lynx_Sensei = "Nosso clã faz o trabalho sujo, aquele que é sujo demais até para os deuses, sabe? Solucionamos os problemas e corrigimos os erros dos outros... erros como você."
sensei.entry.Guard2_Wasp_Sensei = "Você está ameaçando minha capitã? Ela me salvou da escravidão e eu jurei trabalhar por minha liberdade. Que os espíritos tenham misericórdia de ti..."
sensei.entry.Guard2_Widow_Sensei = "Minha senhora é tão justa! Não sou digno de ver seu rosto... Agora minha vida pertence a ela, e vou protegê-la até meu último suspiro."
sensei.entry.HermitYoung_Greetings = "Você é uma vítima das circunstâncias, Príncipe, um sacrifício para o bem comum. Minha escola deve conquistar a grandeza e, então, a era de ouro das artes marciais terá seu início!"
sensei.entry.Hermit_zone2_1 = "Você está entre a cruz e a espada, meu senhor! Eu admito que o traí. Mas não tive escolha, pois o futuro da minha escola está em risco."
sensei.entry.Hermit_zone2_2 = "Lince, esse jovem arrogante, não cumpriu sua tarefa. Terei eu mesmo que fazer seu trabalho. Discípulos, em frente!"
sensei.entry.LynxYoung_Greetings = "Eu não posso partir, já me pagaram pela vida do Príncipe. Nada pessoal, meu velho."
sensei.entry.Lynx_Sensei_1 = "Não dê ouvidos ao Príncipe, velho! Ele enlouqueceu. Vamos levar Sua Alteza para casa antes que ele se machuque. Sua ajuda não é exigida no momento."
sensei.entry.Lynx_Sensei_2 = "Sério? Porque, tudo que vejo, é um homem assustado e cercado por assassinos cruéis. Algo me diz que o Príncipe está dizendo a verdade. Afastem-se dele!"
sensei.entry.Lynx_Sensei_3 = "Faça o que quiser, eles não me pagam para bater papo. E duas cabeças significam mais dinheiro. Peguem-no, homens!"
sensei.entry.NAME_BUTCHER = "AÇOUGUEIRO"
sensei.entry.NAME_HERMIT = "EREMITA"
sensei.entry.NAME_LYNX = "LINCE"
sensei.entry.NAME_PRINCE = "PRÍNCIPE"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "VESPA"
sensei.entry.NAME_WIDOW = "VIUVA"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Socorro! Essas pessoas querem me matar!"
sensei.entry.Prince_zone3_1 = "Como ousa manchar meu nome?! Seu... seu desgraçado! Vou acabar com seu reino de crueldades!"
sensei.entry.Prince_zone6_1 = "Ah, aqui está você, amigo leal! Veja, a justiça triunfa novamente, Shogun é meu fiel cãozinho. Agora sua mente é minha!"
sensei.entry.Prince_zone6_2 = "Você também, velho? Quer tomar meu trono?! Ele é meu por direito de nascença! Ninguém vai tomá-lo de mim!"
sensei.entry.Sensei_arc_intro1 = "Muito tempo atrás, caminhava eu por aí, quando me deparei com o senhor regional, totalmente apavorado..."
sensei.entry.Sensei_zone3_1 = "Então é isso que você chama de “sorte”? Comprar sua liberdade e entregar seus homens de bandeja para uma gangue de lunáticos... E eu fui tão gentil com você, Príncipe!"
sensei.entry.Sensei_zone4_1 = "Viúva? Claro... Ela me disse para apanhar a Esfera e levá-la para o Shogun, entregá-la em mãos."
sensei.entry.Sensei_zone6_1 = "Príncipe, pare! Olhe ao redor! A Esfera está se alimentando de sua raiva, transformando você num monstro!"
sensei.entry.Shogun_zone6_1 = "Seu fraco! Você não é bom nem para ser o bobo da corte de meu senhor. Vou destruí-lo com um único golpe!"
sensei.entry.TITLE_PRINCE_EVIL = "PRÍNCIPE ASSOMBRADO"
sensei.entry.WaspYoung_Greetings = "O que vou dizer a meu pai? Sua filha teve uma crise histérica e perdeu a briga contra um velho? Isso não vai acontecer enquanto eu for a herdeira do trono dos piratas!"
sensei.entry.Wasp_zone4_1 = "A Viúva te enviou para apanhar a Esfera? Tu não é meio velho para esse trabalho, não? Ah, que se dane. Sobe aí, então."
sensei.entry.Wasp_zone4_2 = "Só que eu não estou mais com a Esfera, porque os homens da Viúva levaram ontem. Não sei quem é você, mas mentirosos não passarão! Keelhaul ‘im!"
sensei.entry.WidowYoung_Greetings = "O Príncipe me humilhou quando me rejeitou e riu de meus sentimentos. Agora vou atacar de volta! Vocês são amigos dele, então vão entregar essa mensagem para ele..."
sensei.entry.Widow_zone5_1 = "Você veio me humilhar como o Príncipe fez? Vocês machos são todos iguais..."
sensei.entry.Widow_zone5_2 = "Ele me contou sobre sua gentileza, honra e dignidade. Mas eu não acredito mais nas palavras dos homens. Todos você devem sofrer!"
sensei.entry.Zone2_SenseiReminder = "Da última vez, contava como salvei o Príncipe dos assassinos. Eu descobri que o Eremita estava treinando seus soldados secretamente, então foi para lá que me dirigi."
sensei.entry.Zone3_SenseiReminder = "O Eremita nos contou que o Shogun, o senhor da guerra do Príncipe, havia traído seu senhor e pagado a um tal de Açougueiro para sequestrá-lo. Era hora de visitar o tal bandido."
sensei.entry.Zone4_SenseiReminder = "Os problemas do Príncipe foram causados por uma mulher! Ela tramou um plano para destroná-lo com o auxílio de uma Esfera mágica, que, então, havia sido trazido para um porto próximo dali..."
sensei.entry.Zone5_SenseiReminder = "A pirata me contou a história complicada da Viúva com o Príncipe. Não consegui apanhar a Esfera, mas descobri que o Príncipe havia partido para as montanhas para encontrar a Viúva."
sensei.entry.Zone6_SenseiReminder = "A Esfera mágica enlouqueceu o Príncipe! Deu-lhe um poder imediato... que ameaçava destruir todos nós! Eu não podia permitir isso."
sensei.entry.characterSensei = "SENSEI"
sensei.entry.character_Asian = "LÓTUS"
sensei.entry.character_Blind = "FURÃO"
sensei.entry.character_Fanatic = "NAVALHA"
sensei.entry.character_Indean = "PUMA"
