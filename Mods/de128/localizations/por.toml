sensei.entry.character_Pirate = "PIRATA"
sensei.entry.character_Ronin = "ARAUTO"
sensei.entry.character_Sadist = "TORMENTA"
sensei.entry.character_Savage = "CENTELHA"
sensei.entry.character_Sister = "ASTRA"
sensei.entry.dlgStoryBtnFight = "LUTE"
# END Sensei sensei.entry.

# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Eu me lembrei do que aconteceu no fim! Devo retomar minha história?"
sensei.notify.intro = "Essa cidade despertou algumas de minhas lembranças. Vou contar minha história para você, que aconteceu muitos anos atrás..."
sensei.notify.more = "Eu me lembrei de mais um pouco. Devo retomar a história?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Você está delirando. Eu parei o tempo para levar a Esfera de volta às sombras. Sua presença aqui foi um erro causado pela instabilidade dos Portões das Sombras."
sensei.victory.Ancient_zone6_2 = "A mudança é iminente, humano. Por hora, durma. Quando acordar, ninguém se lembrará de seu feito. É assim que deve ser. Um dia, você compreenderá..."
sensei.victory.Butcher_zone3_3 = "Hi hi! Olha só o Príncipe dando no pé! Você devia ter visto sua cara, meu velho. Sabe, seu novo amigo é um mentiroso sem escrúpulos!"
sensei.victory.Butcher_zone3_4 = "Eu sei que, assim que o Príncipe der seu último suspiro, o Shogun não me deixará viver. Sou apenas uma ferramenta, totalmente dispensável. Então, vou ajudar você."
sensei.victory.Butcher_zone3_5 = "Uma mulher convenceu o Shogun de que o trono é dele por direito. Ela prometeu que ele terá a Esfera, tornando-se um grande senhor da guerra. Tudo isso por ser vassalo dela."
sensei.victory.Butcher_zone3_6 = "Vá até o porto. O Shogun está esperando por um navio que está trazendo a Esfera. É a última chance do Príncipe reivindicar seu trono."
sensei.victory.Hermit_zone2_3 = "Tente entender, nossa arte está para ser extinta! Para sobrevivermos, precisamos mudar as coisas e eu sei como. Além disso, o Shogun me prometeu proteção se eu treinasse seus homens."
sensei.victory.Hermit_zone2_4 = "O Açougueiro reside com sua gangue não muito longe daqui. Foram eles que o sequestraram, senhor. Vá! Espero que encontre suas respostas."
sensei.victory.NAME_BUTCHER = "AÇOUGUEIRO"
sensei.victory.NAME_HERMIT = "EREMITA"
sensei.victory.NAME_PRINCE = "PRÍNCIPE"
sensei.victory.NAME_WASP = "VESPA"
sensei.victory.NAME_WIDOW = "VIUVA"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Obrigado! Você foi muito nobre, pois poucos defenderiam alguém a quem não conhecem. Essas pessoas não conhecem misericórdia, achei que meu fim estava próximo."
sensei.victory.Prince_zone1_2 = "Eu descobri algo que não devia: meus soldados estudam práticas proibidas com um tal Eremita. Eles queriam acabar comigo, pois agora sou uma testemunha..."
sensei.victory.Prince_zone1_3 = "Levei uma unidade de meus homens até ele para esclarecer as coisas, e eles me capturaram. Porém, a sorte estava ao meu lado e consegui fugir."
sensei.victory.Prince_zone2_1 = "MEUS homens! Colocá-lo como chefe do meu exército foi um erro... Se você ainda tiver um pingo de honra, diga-nos onde fica o acampamento desses bandidos!"
sensei.victory.Sensei_arc_outro = "Continua..."
sensei.victory.Sensei_zone1_1 = "Muita coincidência. Alguém sabia de nossa visita e alertou os bandidos. Mas qual o envolvimento do Eremita? Precisamos descobrir isso. Vamos!"
sensei.victory.Sensei_zone2_1 = "Que vergonha! Vendendo sua honra sem o menor pudor! E pelo quê? Você acha mesmo que as pessoas seguirão um traidor? Que esse é um bom exemplo para os jovens?"
sensei.victory.Sensei_zone3_2 = "Diga-me, por que o Shogun o quer morto? E o que é essa Esfera mágica da qual você falava?"
sensei.victory.Sensei_zone4_2 = "Devemos deter o Príncipe antes que ele encontre a Viúva... e a Esfera..."
sensei.victory.Sensei_zone5_1 = "Eu simpatizo com você, de verdade! Mas o coração partido é um péssimo conselheiro. Entenda, por favor, que há pessoas sofrendo por sua causa."
sensei.victory.Sensei_zone6_2 = "Espere! Tenho tantas perguntas! Quem é você? O que há por detrás dos Portões? Eu quero saber..."
sensei.victory.Wasp_zone4_3 = "Pare! Subestimei você, meu velho! Me pagaram para fazer a entrega, mas não para lutar pela honra da Viúva. Vou te mostrar onde ela se esconde!"
sensei.victory.Wasp_zone4_4 = "A Viúva amava o Príncipe, mas ele a rejeitou. Então, ela encontrou um novo brinquedinho: o Shogun. A bruxa está usando aquele senhor da guerra imbecil para se vingar."
sensei.victory.Wasp_zone4_5 = "Ela quer governar os homens e jogá-los uns contra os outros. A Esfera vai fazer com que seu escolhido seja grandioso... e totalmente leal a ela."
sensei.victory.Widow_zone5_3 = "Não há volta para mim. Sei que você quer ajudar, mas é tarde demais... o Príncipe já levou a Esfera. O Shogun tentou defendê-la, mas foi em vão."
sensei.victory.Widow_zone5_4 = "Eu nunca vi o Príncipe tão... selvagem. Seus olhos flamejavam! Ele achou que seria divertido executar um traidor no local onde nos conhecemos. Vou mostrar a você..."
sensei.victory.characterAncient = "ANTIGO"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

