uw.Tenebris_greetings_1 = "Você está no limiar da realidade, viajante. Está é a fronteira final. A partir desta linha, reside o vazio onde os mundos nascem. E fui eu quem forjou sua luz e escuridão!"
uw.Tenebris_greetings_2 = "Sombra, o portal atrás dele pode ser nossa chance de salvação. Os Imortais disseram que destruiriam nosso mundo. Talvez com a ajuda do portal."
uw.Tenebris_greetings_3 = "Você não sobreviverá ao portal! São terras desconhecidas! A escuridão na qual os mundos podem ser criados. Mas você não pode criar, somente destruir. O portal vai lhe engolir inteiro!"
uw.Tenebris_greetings_4 = "É um risco, mas não temos outra opção. Talvez a gente consiga deter os Imortais ao entrar no portal. Mas também podemos causar uma grande catástrofe."
uw.Tenebris_loses = "Você tem medo do desconhecido que se esgueira pela escuridão? Agora você será deixado para enfrentá-lo sozinho! O mundo se transforma em pó e renasce como novo. Seguindo a espiral."
uw.Tenebris_wins = "Seu tolo teimoso! Vocês, humanos, só conseguem resolver seus problemas com a força bruta. Mas o Universo não funciona assim. Todos esses anos e você não aprendeu nada..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Levante, marionete! E lute! Não importa se vai ganhar ou perder. Quando você luta, serve a mim!"
uw.War_AfterWin = "Impostor! Onde está sua fúria? Como é possível lutar sem isso? Lute comigo! Vamos começar outra dança de lâminas! Eu sei há guerra dentro de você!"
uw.War_Greetings1 = "Que dia lindo! Sinto a batalha se aproximar, como uma tempestade. Trovão. A incontável fúria de legiões marchando. Todos presentes para meu altar!"
uw.War_Greetings2 = "A fúria e a sede por sangue fervem dentro dela, que se deleita com a batalha infinita, mas pelo quê? O que há no topo daquela montanha de crânios?"
uw.War_Greetings3 = "Será que você desconhece a emoção de uma batalha sangrenta? Fogo, paixão, poder! Mostre o que sabe fazer! Venha me entreter em combate ou morra!"
uw.ZONE_RAID = "Submundo: Nível 1"
