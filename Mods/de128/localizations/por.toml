uw.BOSS_BISON_21 = "ADANTI"
uw.BOSS_BISON_Title = "Adanti"
uw.BOSS_LAMB = "O CORDEIRO"
uw.BOSS_RAVANA = "RAVANA"
uw.BOSS_RAVANA_Title = "Ravana"
uw.CharacterIndia24Nrityu = "NRITYU"
uw.DEMON_RAID = "MANOPLA"
uw.DEMON_RAID_Title = "Manopla"
uw.EARTHQUAKE = "Tremores periódicos"
uw.EnterPortal_ActScreen = "Portal"
uw.FRAGILITY = "Vulnerabilidade aumentada dentro da área exibida"
uw.Gatekeeper_greetings_1 = "Ar estranho? Ar estranho! Ar estrraanho!"
uw.Gatekeeper_greetings_2 = "Não estão felizes, não estão felizes, não estão felizes! Fizemos, fizemos, fizemos!"
uw.Gatekeeper_greetings_Assistant_1 = "Shadow! Você finalmente acordou!"
uw.Gatekeeper_greetings_Assistant_2 = "Está tão frio aqui! Já não sinto os meus dedos… Onde estamos? O ar parece tão estranho."
uw.Gatekeeper_greetings_Assistant_3 = "Mas por que sinto como se ela nos entendesse?"
uw.Gatekeeper_greetings_Sensei = "Para trás, May! Não sabemos o que ele quer! O mundo dos Imortais foi abalado mais do que eu pensava. Depois do que fizemos, eles não estão felizes com a nossa presença aqui."
uw.Gatekeeper_greetings_Sensei_2 = "Calma agora — não faça movimentos bruscos. Parece que esta criatura não é muito inteligente."
uw.Gatekeeper_greetings_Sensei_3 = "Isso não é importante agora. Passar pelo portal foi escolha nossa, e devemos responder por isso. Ela quer uma luta — não temos escolha, Shadow."
uw.Gatekeeper_lost_Saimon = "Eu esperava mais do portal… Parece que a jornada drenou suas forças, e suas ligações moleculares estão enfraquecidas. Interessante — devemos realizar mais alguns testes."
uw.Gatekeeper_win_Saimon = "Por séculos, este portal capenga nos lembrou de que existem forças além da nossa compreensão. Então você apareceu…"
uw.HARD_GROUND = "Você sofre dano ao cair no chão."
uw.HEAD_BERSTUUK = "Máscara de Berstuuk"
uw.HEALTH_DROPS = "A energia decai com o tempo"
uw.HOT_GROUND = "Chão quente"
uw.HW20Arkhos1 = "Não preciso de previsão para ver que o fogo da fé consumirá tanto os fracos quanto os cegos. Trouxe velas pretas para que todos possam ver esta verdade tão claramente quanto eu!"
uw.HW20Fatum1 = "As fronteiras entre os mundos estão ficando tênues — esta é a melhor noite para profecias! O ar vibra com magia e, em minhas mãos, os próprios fios do destino estão enrolados!"
uw.HW20Fatum2 = "A vidência, para mi, é um jogo — posso fazer o que quiser com o destino dos mortais. Mas vocês, meus amigos, são uma questão totalmente diferente. Por favor, sentem-se!"
uw.HW20Fatum3 = "Você foi cegado pelo seu ódio. Vamos começar. Não fale, apenas escute. Vejo um vulto… negro como a noite… penas e cinzas… me pegando pela mão…"
uw.HW20Fatum4 = "Como… como você veio parar aqui? O caminho para este mundo estava selado para você!"
uw.HW20Megalith1 = "Você falou sobre vidência e um baile de máscaras, então eu trouxe um espelho mágico. Pela primeira vez em mil anos, posso ver meu reflexo. Esta máscara me deixa parecendo um ancião!"
uw.HW20Whisper1 = "Você andou brincando de profecia, irmãzinha? Assumindo o controle dos destinos dos mortais? Brinquedos assim sempre foram apenas meus!"
uw.HW20Whisper2 = "Selado estava! Mas você chamou e, através deste espelho maravilhoso, eu vim. Vou levá-lo comigo. Não se esqueça de me visitar para ouvir algumas previsões de verdade!"
uw.Hunger_AfterLoss = "Já que você é o escolhido, vou lhe dar a última chance de ficar comigo e banquetear. Sssenão, seus ossos vão se juntar aos outros na poeira."
uw.Hunger_AfterWin = "Criador, você me enviou sustento, mas não foi o suficiente. Minha fome é eterna, conceda minha libertação..."
uw.Hunger_Greetings1 = "Você percorreu um longo caminho para chegar aqui. E para quê? Para salvar mortais mal agradecidos? Eles não ligam a mínima para você! Posso sentir sua sssolidão, sua fome e seu... medo."
uw.Hunger_Greetings2 = "Sombra, não seja tolo! Ele só aparenta fraqueza. Você não é amigo dele, apenas sua caça. Ele vai destruir você se chegar mais perto!"
uw.Hunger_Greetings3 = "Consegue ver meus irmãos? Eles estão com sssede, mas de uma raça diferente. Querem diversssão! Mas a fome deles não se compara à minha!"
uw.INVERTED_JOYSTICK = "Movimento invertido"
uw.LIGHT_IN_THE_DARK = "Luz na escuridão"
uw.MERCENARY_RAID = "UNIDADE{br}MERCENÁRIA"
uw.MERCENARY_RAID_Title = "Unidade Mercenária"
uw.MiniEventAnnounce = "Desde tempos imemoriais, um culto habita as entranhas da terra, vigiando o repouso delicado dos deuses do submundo e impedindo seu despertar. Mas o preço é uma batalha ritualística cruel, travada até a última gota de sangue."
uw.MiniEventHungerFight_Enter_1 = "Aqui debaixo da terra, tudo é diferente. Lutamos para viver, e comida é vida! Não prive o seu povo — nem o meu — desta grande alegria!"
uw.MiniEventHungerStory_1 = "As pessoas só se importam com os caprichos dos espíritos quando a desgraça cai sobre seus lares. Suas plantações murcham, seus filhos passam fome… E onde está a fé delas agora?"
uw.MiniEventHungerStory_2 = "A fome tem uma forma. Sua sede de consumir é terrível. Mas esse é o papel de Karcer, enquanto o seu e o meu é impedir que ele desperte de seu sono de séculos."
uw.MiniEventHunger_Loss_1 = "Sua mãe não lhe ensinou a não deixar nada no prato? Dá para notar — há fome nos seus olhos! Ou… qual é o seu problema?"
uw.MiniEventHunger_Win_1 = "Sim, você golpeia bem, Shadow… Vamos comemorar a sua vitória com um rango caprichado! Por minha conta!"
uw.MiniEventStory_1 = "Vejo que você, Shadow, é forte e firme de espírito. As lendas de seus feitos são amplamente conhecidas. Gostaria de se tornar parte de outra?"
uw.MiniEventStory_2 = "Os espíritos do submundo são rebeldes. Realizamos uma cerimônia para acalmar seus temperamentos — batalhas ritualísticas! Sua participação seria uma honra para nós."
uw.MiniEventStory_EnterBattle = "Você não é um pouco franzino para um espetáculo tão arcano? E você escolheu este aí, de verdade? Este é o homem da lenda? Ah, os espíritos ficarão indignados…"
uw.MiniEventStory_Loss_1 = "Sim, bem… Quero acreditar que até os espíritos têm senso de humor, e que eles apenas rirão das nossas trapalhadas na arena, em vez de liberarem sua fúria sobre nós…"
uw.MiniEventStory_Win_1 = "Bem… Ninguém vem a esta arena por acaso. Você realmente é um homem de lendas, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "A bruxa assusta você sem motivo. É muito mais simples do que isso: o aço é temperado no fogo! Os deuses entendem de poder e de mais nada. Somente o poder pode fazê-los voltar ao seu repouso! Atacar!"
uw.MiniEventVulkanStory_1 = "O fogo purificador é justo — assim dizem nossos ancestrais. Mas eles não sabiam que os Imortais não se importam com a moralidade humana. Essa é simplesmente a natureza deles."
uw.MiniEventVulkanStory_2 = "Você sente o calor subindo de debaixo da terra? Há uma coisa que você deve saber: a chama não poupa ninguém, seja amigo ou estranho. E estamos diretamente em seu caminho."
uw.MiniEventVulkan_Loss_1 = "Você deve se levantar, Shadow! Não consegue sentir a terra tremendo?! O deus está enojado com as nossas brincadeiras na poeira…"
uw.MiniEventVulkan_Win_1 = "Está quente como o fogo do inferno aqui… O espírito do fogo ruge satisfeito em sua câmara! Uma bela luta, Shadow! Ganhamos mais um dia!"
