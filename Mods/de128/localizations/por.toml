uw.dlgAmericanEvent22Story_May_1 = "Ela está completamente congelada, Sensei! Não podemos expulsá-la com ventos como estes rugindo na porta…"
uw.dlgAmericanEvent22Story_Puma_1 = "Estamos encrencados, velho… Nunca pensei que o passado do meu povo iria me perseguir, mas perseguiu. Então eu fugi para protegê-los. Por favor, me escute!"
uw.dlgAmericanEvent22Story_Puma_2 = "Vocês conseguem ouvir isso também? Quando eu era criança, um xamã me falou de um espírito cujo uivo levantava as ondas e arrancava as folhas. Nunca pensei que aquele conto antigo se provaria verdadeiro!"
uw.dlgAmericanEvent22Story_Puma_3 = "Ele está vindo por aqui para nos caçar com seu clamor até desabarmos, sem fôlego… Só por esporte! Não conheço outro lugar para me esconder…"
uw.dlgAmericanEvent22Story_Sensei_1 = "As portas da minha morada estão abertas para qualquer um que esteja sofrendo. Mas é inesperado ver um pirata dentro destas paredes… E onde está o seu bando de degoladores, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Os mitos dos xamãs são alegorias. As pessoas inventaram as velas para domar o vento e, desde então, ele as serve muito bem. Você é apenas um conto de fadas bobo, e o Shadow vai provar isso!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Eu am the Wolf Wind! Whoever comes to meet me shall be snuffed out like a candle! And sooner or later, I shall break down your door. It is only a matter of time!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Eu vou uiv-aa-aar até que as folhas cubram os escombros. Ninguém jamais encontrará o caminho para cá! Ousado e tolo… Como pode lutar contra os elementos, mortal?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Que vergonha… Você tirou a minha voz poderosa! Mas a sua fé, garota, vai me trazer de volta à vida… E eu não virei sozinho! Pois nós somos muitos!"
uw.dlgArkhosGreetings = "Fanáticos cegos! Vocês se lembram de mim e me alimentam com a sua fé no Pai. Um pai pode ser rígido, e vocês aceitarão o meu castigo de bom grado..."
uw.dlgArkhosLost = "A quem eu devo adorar nesta minha última hora? Ó Criador, por que me abandonastes? Vós me destes o poder para liderá-los, mas eu falhei... de novo."
uw.dlgArkhosStory1 = "Eu conheço a raça dele. Eles reúnem adeptos alimentando-os com mentiras. Não dê ouvidos a essa pregação fervorosa, esta é a primeira arma dele."
uw.dlgArkhosStory2 = "Errado, velho. Eu tenho o ferro pesado para os filhos desgarrados também. Você vai rezar para que eu o aceite na família... mas eu serei implacável."
uw.dlgArkhosWin = "Ovelha negra. Você não é digno de um lugar ao meu lado. Desapareça! Eu contarei ao Criador como vocês, homens, falharam novamente, e eu vou alimentar os meus filhos."
uw.dlgBerstuuk_Announce = "Buscando conhecimento proibido, um cientista talentoso fundiu ciência e magia em sua busca para se tornar um deus. E a transformação é inevitável! Agora a floresta é o seu laboratório de pesadelo, e os humanos são suas presas. Só você pode impedir essa metamorfose terrível! Afaste o medo e aventure-se no coração do bosque em busca do falso ídolo!"
uw.dlgBerstuuk_Loose_1 = "Quando você veio à minha porta, me contou tudo sem palavras! Vou puxar esse conhecimento como um fio fino até que não reste nada!"
uw.dlgBerstuuk_Story_1 = "Tem alguém lá fora, é o Sly batendo na porta do celeiro… Já vi muita coisa na floresta à noite, mas isso é novidade! O que há de errado com ele?"
uw.dlgBerstuuk_Story_10 = "Não o suficiente. A ciência é imprevisível — olhe para mim! Aos poucos, aceitei a floresta, mas ela continuava se recusando a me aceitar. Até agora."
uw.dlgBerstuuk_Story_2 = "Para quem busca ajuda, o caminho leva à porta certa. Mas Sly parece ter se perdido… Seu velho malandro, cuidado com essas mãos! O que aconteceu?"
uw.dlgBerstuuk_Story_3 = "O malandro estava procurando ajuda, e encontrou. Vamos para a floresta antes que ela leve o que é deles por direito. A vida dos homens!"
uw.dlgBerstuuk_Story_4 = "'Homens'? O coitado está em choque — ele não tem rosto! O que o assustou tanto a ponto de ser atingido por uma crise repentina de consciência?"
uw.dlgBerstuuk_Story_5 = "Consegue ouvir os pássaros cantando? A esta hora eles já deveriam estar piando, mas aqui não há nada além de um silêncio sepulcral… O que mais está à espreita nesta floresta?"
uw.dlgBerstuuk_Story_6 = "Silêncio sepulcral. Silêncio sepulcral. As pessoas precisam de ajuda. Você tem que aju-u-dar. Ajude agora!"
uw.dlgBerstuuk_Story_7 = "Pelos deuses! As pessoas normalmente não se transformam em galhos secos e musgo, por mais assustadas que estejam! O que é aquela coisa, e onde está o verdadeiro Sly?!"
uw.dlgBerstuuk_Story_8 = "Ele está por aqui em algum lugar. A mente pequena do Sly foi de grande ajuda. Ele me falou sobre você, Shadow — sobre o seu poder especial. E tive uma inspiração!"
uw.dlgBerstuuk_Story_9 = "Então você é aquele de quem a criatura falou? O bosque virá e levará embora. E quantas dessas vidas 'por direito' você tirou, seu louco?"
uw.dlgBerstuuk_Win_1 = "A natureza encontrará um jeito! Nossa luta me disse mais do que você imagina, Shadow. A floresta se lembrará. Ela me consumirá para reviver novamente…"
uw.dlgFatumGreetings = "Sua coragem só pode ser comparada com a sua insensatez. Mas eu sabia que vocês viria, porque você é o meu destino, e eu sou o seu. Eu vou reescrever os seus destinos – para sempre."
uw.dlgFatumLost = "Eu conheço a humanidade. Vocês sobem e descem na mesma espiral. Eu vi isso diversas vezzes. Autodestruição e perdição. Nada pode mudar isso. Esse é o seu destino."
uw.dlgFatumStory1 = "Tome cuidado, herói. Nesta profundidade, as leis universais que você conhece não existem..."
uw.dlgFatumStory2 = "É isso mesmo! Segure a coleira do seu garoto. Eu sei tudo sobre os seus destinos: quem vocês são e para onde vocês vão. Querem saber quem morre no final?"
uw.dlgFatumWin = "Seu destino foi selado. Você já perdeu no momento em que colocou os pés na minha morada. Será que você tem coragem suficiente para reescrever a sua história?"
uw.dlgFungusGreetings = "Você envenenou a terra, e agora os meus cogumelos estão morrendo. Eles devem absorver a sua mente, e todos nós nos tornaremos um, humano. Este será o fim da sua história!"
uw.dlgFungusLost = "Meus irmãos se esqueceram brincando de deuses. Ficaram moles com toda a adoração. Mas a destruição é a natureza da humanidade; o mundo será melhor sem vocês."
uw.dlgFungusWin = "Desapareçam! E aproveitem os últimos minutos de suas vidas frágeis!"
uw.dlgHW21LosePuppeteer_1 = "Eu não confiaria em você nem para um papel sem falas, Shadow. O palco não é o seu lugar — não envergonhe o meu ofício!"
uw.dlgHW21StoryArkhos_1 = "A peste está chegando à sua cidade, mortais! Curvem-se diante do poder do seu deus! E deliciem seus olhos com o brilho do ouro, ou senão…"
uw.dlgHW21StoryPuppeteer_1 = "O que vocês sabem sobre arte! Vocês arruinaram o meu maior empreendimento! No entanto… o terceiro ato está chegando. E nele, o herói dá o seu último suspiro!"
uw.dlgHW21StorySensei_1 = "Desde quando os deuses do submundo sobem até aqui para extorquir dinheiro de pessoas comuns? Tire a sua máscara, enganador, antes que peguemos em armas!"
uw.dlgHW21StorySensei_2 = "O teatro deve inspirar, não horrorizar. And você distorceu a própria essência da arte. Nós vamos detê-lo antes que os seus 'atores' se firam."
uw.dlgHW21StoryThief_1 = "Espere! Sou eu… Sly! Não me bata! Ele prometeu que todos me temeriam… E que ninguém me reconheceria. Como eu me entreguei?"
uw.dlgHW21StoryThief_2 = "O dono do teatro itinerante — o Titereiro. Ele disse que seria a sua melhor performance. Deuses entre as pessoas! Isso não significava nada para mim. Mas o dinheiro, por outro lado…"
uw.dlgHW21WinPuppeteer_1 = "Isso é um fiasco! Você arruinou meu enredo maravilhoso e quebrou minhas máscaras! Como vou encenar uma peça agora sem adereços…"
uw.dlgHW22EnterArchitect = "Toda essa narrativa de fantasia sua me esgotou… Agora vamos jogar sob as minhas regras. E é do seu interesse me surpreender, Shadow…"
uw.dlgHW22LooseArchitect_1 = "Isso já era esperado. Conheço todos os seus movimentos, Shadow. Afinal, fui eu quem inventou você. Talvez eu não estivesse no meu melhor dia na época… Mas agora você vai gostar da sua nova vida."
uw.dlgHW22StoryArchitect_1 = "Isso é o que se chama de 'clichê', Titereiro. Pelo que os dramaturgos são pagos? Pelo número de símbolos? A figura do gênio louco tagarela ficou batida, bem como a figura do herói…"
uw.dlgHW22StoryArchitect_2 = "É isso aí. Vamos reescrever o seu mundo do zero! Contemporâneo, criativo, relevante! O que interessa aos adolescentes hoje em dia? Por que não diz nada, Shadow? Ah, sim…"
uw.dlgHW22StoryPuppeteer_1 = "Eis que surge uma batida — uma batida inesperada na sua porta! Será um viajante vindo fazer uma visita, ou algo mais? Intrigante, não é?"
uw.dlgHW22StoryPuppeteer_2 = "Eu sabia que você diria isso, velho. O que mais se pode esperar de personagens inventados? O papel aceita tudo… Mas o público jamais aceitará!"
uw.dlgHW22StoryPuppeteer_3 = "Sou apenas um escravo do palco, só isso. E a minha nova obra-prima falará de um encontro com o criador — dos tormentos da predestinação e do livre-arbítrio…"
uw.dlgHW22StorySensei_1 = "Seja lá o que você tenha idealizado, Titereiro, não vamos mais jogar os seus jogos. A arte pode causar dor, mas não da maneira que você a pratica."
uw.dlgHW22StorySensei_2 = "Você atuou demais e não consegue mais distinguir a realidade das suas fantasias, artista… Você está louco."
uw.dlgHW22StorySensei_3 = "Suas palavras são peculiares e preocupantes, estranho… Não sei que loucura está passando pela sua cabeça, mas o Shadow vai tirá-la de você na pancada."
uw.dlgHW22WinArchitect_1 = "Talvez a criação não pertença mais ao seu criador e tenha ganhado vida própria… Você me surpreendeu. Quero ver para onde a história vai a seguir."
uw.dlgHoaxenGreetings = "A sua vida toda não passa de uma ilusão. E nós somos os criadores dela. Vamos enlouquecer você enquanto outros contam com força bruta. Fogo, água, doenças - rá!"
uw.dlgHoaxenLost = "Onde está você, irmão? Eu não consigo mais ouvir a sua voz! Ficar trancafiado sozinho é pior do que o fogo ou a lâmina... Vão, tolos. O Pai está esperando."
uw.dlgHoaxenStory1 = "\"Nós\"? Sombra, parece que os nosso inimigo é a cabeça dele. Desculpe-me, com qual de suas personalidades estamos falando? Talvez o seu \"irmão\" possa ser mais racional."
uw.dlgHoaxenStory2 = "Estão rindo de nós, humanos? Meu irmão sugere que suas almas sejam enviados para o abismo da miséria eterna... Assim, seu mundo cederá sem uma única gota de sangue."
uw.dlgHoaxenWin = "Eu teria matado você, pois a minha misericórdia é verdadeiramente infinita. Mas meu irmão é menos tolerante; você está livre para ir - isso se você não perder a sanidade na saída."
uw.dlgHunter_enter_hunter_1 = "Você! Ei, vocêêê! Veio terminar o que começooou, é? Você? Há um poder em você. Ele faaaala comigo. Silêncio! Ou eu vou te oobrigar!"
uw.dlgHunter_greeting_may_1 = "Olhem! Tem algo dentro do cristal… Era para ser assim?"
uw.dlgHunter_greeting_saimon_1 = "Que estranho… Eu esperava que Lazarus reduzisse o Obelisco a pó. Temi a carnificina, mas parece que apenas você e eu restamos. Estou intrigado."
uw.dlgHunter_greeting_saimon_2 = "O Salão de Concentração. Consegue ver aquele cristal no centro? É assim que o Obelisco acumula energia das sombras — o coração das trevas, por assim dizer."
uw.dlgHunter_greeting_sensei_1 = "O silêncio é um mau presságio, meu amigo racional. Ele pode falar mais alto do que as palavras mais ensurdecedoras. Hum… Onde estamos? Que lugar bizarro é este?"
uw.dlgHunter_greeting_sensei_2 = "Duvido disso, minha querida… Este lugar parece diferente de quando o vi pela última vez. Estou começando a achar que o velho estava certo…"
uw.dlgHunter_loose_hunter_1 = "Deite-seee. Vou te deiiixar aqui para seééémpre. Não cause maais danos."
uw.dlgHunter_win_hunter_1 = "Pare, humano-Shadow! Não deixe se essspalhaaar! Você vaai ficar igual a eééle. Você será enganaaado! Mas você ainda tem uma chaaaance."
uw.dlgIE21AnnounceAssistant_1 = "Quem diabos é você? O que está fazendo em nosso mundo e por que deveríamos escutá-lo?"
uw.dlgIE21AnnounceAssistant_2 = "Ha! Não sei de onde você veio, mas não vai ficar aqui por muito tempo!"
uw.dlgIE21AnnounceAssistant_3 = "Ei, Shadow, esse valentão foi longe demais! Vamos ensinar bons modos a ele!"
uw.dlgIE21AnnounceBoss_1 = "Seus mortais patéticos! Curvem-se diante da minha vontade e glória, ou eu os forçarei a ficar de joelhos!"
uw.dlgIE21AnnounceBoss_2 = "Como ousa falar comigo desse jeito — eu sou Ravana, o conquistador de todos os três mundos!"
uw.dlgIE21AnnounceBoss_3 = "Esta é a sua última chance de se ajoelhar. Recuse, e eu arrancarei a sua cabeça!"
uw.dlgIE21AnnounceSensei_1 = "Shadow, sinto uma ameaça misteriosa se aproximando. Algo maligno entrou em nosso mundo mais uma vez."
uw.dlgIE21Boss_After_Loose = "Se todas as pessoas deste mundo são tão fracas, então a conquista dele é apenas uma questão de tempo!"
uw.dlgIE21Boss_After_Win = "TOLOS! Eu recuo por enquanto, mas vocês não me derrotarão tão facilmente. Eu voltarei!"
uw.dlgIndia22Story_May_1 = "E assim vocês começaram a passar fome… O que esse demônio poderia querer na sua celebração alegre? Como fazendeiros humildes puderam atrair tal predador?"
uw.dlgIndia22Story_Rakshasa_1 = "Você tem um aroma interessante, humano. Sem dúvida deve ser muito saboroso também! Consegue ouvir minha barriga roncando? Um corte de carne de primeira para acompanhar meu arroz seria muito bem-vindo!"
uw.dlgIndia22Story_Rakshasa_Lose = "Felizmente para você, nossa luta me esgotou. Além disso, minha fome está saciada… por enquanto. Vou abrir o apetite novamente e caçar de novo!"
uw.dlgIndia22Story_Sensei_1 = "Conte-me sobre ele, viajante. Pelas suas roupas, vejo que viajou de longe. Que problema aflige o seu lar?"
uw.dlgIndia22Story_Sensei_2 = "Contenha seu apetite, demônio! Não haverá convite para o festival da vida para quem rouba a própria vida!"
uw.dlgIndia22Story_Sensei_Win = "Não é a magia que faz um jardim florescer — é o trabalho duro. E você vai provar isso por si mesmo: ajude seus vizinhos a restaurar a fazenda deles, senão…"
uw.dlgIndia22Story_Sitaram_1 = "Ouvi a história da sua vida. Que os deuses o recompensem de acordo com os seus méritos! Trago más notícias: um espírito maligno apareceu em minhas terras…"
uw.dlgIndia22Story_Sitaram_2 = "A maldade deste demônio só se compara à sua fome! Estávamos nos preparando para celebrar o Bohag Bihu quando, de repente, esta… criatura apareceu e devorou todas as nossas mudas!"
uw.dlgIndia22Story_Sitaram_3 = "Com Agni como minha testemunha, minha senhora, eu me faço a mesma pergunta! Agora esperamos com pavor pelo pôr do sol… Venha comigo, eu lhe imploro!"
uw.dlgIndia24_Enter_Puppet_1 = "Você tem o espírito necessário para conduzir o destino? Decida o meu, humilde servo das artes que sou. Somente no combate você realmente entende o que é o quê. Seja ousado, Shadow — ataque!"
uw.dlgIndia24_Story_Dandy_1 = "Abra, ou eu vou derrubar esta porta maldita! Sei que estão em casa — consigo ouvir vocês! Vou atear fogo a este barraco se não me derem abrigo!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Ah, quão ferozmente os mortais se apegam à vida. Não fui eu quem escolheu este trabalho, e não derramarei lágrimas venenosas por causa dele… Por que fizeram isso comigo?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "O coração dela está cheio de amor. Os deuses nos criam puros, mas nós escolhemos nosso próprio caminho. Nrityu começa a entender isso ao ouvir a história da garota."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, sua performance carece de paixão e comprometimento. Eu lhe darei outra chance. Não atue — viva!"
uw.dlgIndia24_Story_Puppet_1 = "Toc, toc! Ei, velhos amigos! A voz do destino está sobre nós — e ela está a caminho! Sua bainha vermelha arde como a própria vida no apagar do dia!"
uw.dlgIndia24_Story_Puppet_2 = "Será pela sua alma que ela veio? Contemple um conto tão antigo quanto o próprio mundo — a lenda de Nrityu, cujo destino era ser uma ceifadora de vidas."
uw.dlgIndia24_Story_Puppet_3 = "Os fantasmas estão todos tagarelando. Você não pode confiar neles. E, além disso, a história não é deles para contar. Vou lhe mostrar a verdade através dos olhos dela. Shadow, você é o único que pode entender."
uw.dlgIndia24_Story_Sensei_1 = "Essa voz… Parece que nosso antigo adversário está tramando algo mais uma vez. Quem será a vítima desta vez? Vejo um homem correndo em direção ao pagode…"
uw.dlgIndia24_Story_Sensei_2 = "Suas roupas estão cobertas de sujeira e fuligem, estranho. E o seu tom me perturba. Explique quem é você e o que veio fazer à nossa porta!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Para trás! Eu não queria isso! Minha família tinha medo de mim, e pensei que esta seria a minha chance… Dandy prometeu me levar com ele, se eu apenas ajudasse…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "Pronto! Você cai em um sono eterno, embora não mereça. Mas não cabe a mim julgar você — esse é o chamado de outro. Sou apenas o condutor."
uw.dlgIndia24_Story_Win_Puppet_4 = "Assim como você, Shadow. Quero que siga o caminho de Nrityu. Levou uma eternidade para ela entender o seu lugar."
uw.dlgIndia24_Story_Win_Puppet_6 = "O show tem que continuar! Você, Shadow, será a estrela, e meus atores serão seus coadjuvantes. A história de Nrityu será a nossa maior produção!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Esta história é profunda — até para você. Estou surpreso! Mas qual é a moral aqui? Por que está nos mostrando isso?"
uw.dlgMegalithGreetings = "Esta mina é um lugar sagrado. Por que você está aqui? Saia e encare o seu destino com honra. A última coisa que você vai ouvir é a terra tremer sob seus pés."
uw.dlgMegalithLost = "Maldição! Terei que esperar por milhares de anos de novo? Eu movi continentes! Purificar a terra era o meu dever!"
uw.dlgMegalithWin = "Tratei os humanos gentilmente, uma característica rara entre os Eternos. Ajudei sua espécie muitas vezes. Então corra e dê seu último adeus aos seus entes queridos!"
uw.dlgRaidIntro1 = "Você está tentando corrigir o seu erro? Você abriu os Portões, mas só os Eternos podem eliminar o contágio da Sombra. Não sendo um de nós, você é fraco."
uw.dlgRaidIntro2 = "Você morrerá, como todo o resto. Magma corre nas minhas veias e vai cobrir toda a terra, purificando-a para uma nova vida."
uw.dlgRaidStory1 = "Que porão é este e o que estamos fazendo aqui?"
uw.dlgRaidStory2 = "Esta é a antecâmara do domínio dos Eternos. Seu sono perdurou por milênios, mas os Portões das Sombras colocaram o mundo em perigo. Eles despertaram."
uw.dlgRaidStory3 = "Legal - isso significa que eles vão nos ajudar a lidar com os Portões rápido e fácil!"
uw.dlgRaidStory4 = "Ah, não. Elas destruirão os Portões, mas eles também devem destruir toda a humanidade. Para eles, é só mais um ciclo de destruição e criação."
uw.dlgShurale_Announce = "Despertado por bandidos gananciosos, o espírito da floresta agora descarrega sua vingança contra os inocentes. A criatura busca a caixa de memórias roubada — o receptáculo de sua magia antiga. Apenas aqueles cujos corações guardam uma tristeza verdadeira podem acalmar a fúria da criatura. O preço, contudo, será alto…"
uw.dlgStoryBtnFight = "LUTE"
uw.dlgStoryBtnMore = "MAIS"
uw.dlgVolcanoGreetings = "De todos os Eternos, eu fui o primeiro a acordar. Muitos lutadores virão a morrer pelas minhas mãos; Vou completar a minha missão."
uw.dlgVolcanoLost = "Chega! Eu admito a derrota. Mas saiba disso: você despertou o meu irmão. Não deixe a aparência dele enganá-lo, pois ele é rápido e mortal!"
uw.dlgVolcanoStory1 = "Eu vi algumas casas parcialmente destruídas e uma enorme estátua. Existem seres humanos vivendo aqui?"
uw.dlgVolcanoStory2 = "Apenas fanáticos. Eles adoram os Eternos na esperança de serem poupados. Na verdade, eles são cegos em sua fé. Se falharmos, eles logo vão descobrir a verdade."
uw.dlgVolcanoWin = "Eu tenho dito aos meus irmãos que é meu dever decidir o destino do planeta. Observe, homens sem fé, como as minhas chamas cobrem a terra!"
uw.dlgVortexGreetings = "Águas escuras vão engolir a terra e os Portões das Sombras! O segredo estará perdido no abismo. E não haverá mais ninguém na superfície para contá-lo!"
uw.dlgVortexLost = "Pela primeira vez em milhares de anos um ser humano ganha. Sua vontade de viver é tão forte! Mas não importa o que você faça, o fim será o mesmo: você vai morrer."
uw.dlgVortexWin = "Por milhares de anos eu assisti a extinção de sua espécie. Existe alguma beleza nisso. Acho que vou mantê-los vivo - só por diversão."
uw.dlgWhisperGreetings = "Parece que alguém mal pode esperar para descobrir seu destino. Dê-me sua mão e olhe para o espelho!"
uw.dlgWhisperLost = "Você ainda está vivo? Então ainda não está sob o meu poder! Fatum adivinhará o seu destino, e então voltarei para o meu mundo — deixando o aviso para tomar cuidado com os espelhos!"
uw.dlgWhisperWin = "Eu levarei você comigo para o reino das cinzas, dos espíritos e da noite eterna! Confie em mim — olhe nos meus olhos e não desvie o olhar."
uw.dlg_American_25_Loose_1 = "Você não sabe quem está protegendo, Shadow. Eles não vão lhe agradecer. Só vão zombar de você pelas costas. Selvagens… e eu sou o monstro?"
uw.dlg_American_25_Story_1 = "May desapareceu. Levada por algo que mal parece humano. No entanto, não houve gritos, nem sinais de luta… como se ela tivesse saído por sua própria vontade."
uw.dlg_American_25_Story_2 = "Não somos os únicos passando por isso. Outros como May — jovens, fortes — também desapareceram. Ela sentiu que isso aconteceria… e encheu os bolsos com pólvora."
uw.dlg_American_25_Story_3 = "O rastro dela é claro. Devemos encontrá-la antes que venham as chuvas, ou o perderemos para sempre. Venha, Shadow!"
uw.dlg_American_25_Story_4 = "Senti o seu cheiro no momento em que pisou nesta terra amaldiçoada. Por que veio? Para pisotear o meu luto? Você não tem honra — assim como eles não tinham nenhuma."
uw.dlg_American_25_Story_5 = "Eu sabia que você apareceria, xamã. Devolva as crianças aos seus parentes e a nossa amiga para nós. Depois vá apodrecer na sua montanha de cinzas."
uw.dlg_American_25_Story_6 = "Cinzas às cinzas. E às cinzas você retornará, mortal…"
uw.dlg_American_25_Win_1 = "Espere! Eu fui com ele de livre e espontânea vontade. A forma dele é monstruosa, sim — mas o coração dele é humano. E ele está sofrendo… Eles roubaram o filho dele!"
uw.dlg_CHN_NY25_Announce = "Mergulhe na história de um herói de eras passadas — separe a verdade da fábula e ajude a forjar uma nova lenda! Enfrente um culto misterioso que usa o nome de um grande herói como disfarce para suas atrocidades! Volte ao lugar onde tudo começou e ajude um malandro fugitivo a descobrir seu verdadeiro heroísmo!"
uw.dlg_CHN_NY25_Loose_1 = "Não, devemos continuar lutando! Ninguém acreditaria que um simples fazendeiro pudesse derrotar um culto sinistro tão facilmente. Você deve dar tudo de si!"
uw.dlg_CHN_NY25_Story_1 = "O Culto do Sol tem a tradição de visitar o local de nascimento de seu grande herói uma vez por ano. Mas toda vez, isso se mostra um desastre…"
uw.dlg_CHN_NY25_Story_2 = "Ele nasceu humano? Que curioso. Parece-me que essas pessoas não estão trazendo presentes para a vila…"
uw.dlg_CHN_NY25_Story_3 = "Eles não deixam nada intacto! Roubam o gado dos aldeões, destroem plantações em um frenesi de embriaguez, quebram janelas e arrumam brigas!"
uw.dlg_CHN_NY25_Story_4 = "But why do the villagers not fight back? This is their land and their legend!"
uw.dlg_CHN_NY25_Story_5 = "Eles estão despedaçados. O herói que lhes dava esperança sumiu, e os cultistas cometem maldades em seu nome. Devemos dar esperança a eles mais uma vez!"
uw.dlg_CHN_NY25_Story_6 = "Diga que veio verificar se tudo está pronto para o 'feriado'. E nós lutaremos! Os moradores da cidade verão que o culto pode ser enfrentado!"
uw.dlg_CHN_NY25_Story_7 = "Muito bem, que seja do seu jeito… Deixe-me entrar no personagem. 'Ei, garoto, como ousa usar as vestes do nosso herói! Suma daqui — temos um banquete para preparar!'"
uw.dlg_CHN_NY25_Story_8 = "Posso não ser um herói de lenda, mas o espírito dele vive nesta terra! Ele me guará na minha hora mais escura e me dará coragem! Atacar!"
uw.dlg_CHN_NY25_Win_1 = "Eu não esperava tamanha velocidade de um mero homem… Você quase derrotou nosso campeão! Devemos fazer de você um exemplo, para que os outros não tenham ideias…"
uw.dlg_NY25_Loose_1 = "Suas memórias são vivas, e o luto fala mais alto que a razão. Você permanecerá aqui comigo. Descanse um pouco — o sono virá logo."
uw.dlg_NY25_Story_1 = "Bem-vindo! Esta cabana já pertenceu à minha família. Tantas memórias… Fique o tempo que quiser. Há tudo o que você precisa para descansar aqui."
uw.dlg_NY25_Story_2 = "Mas você nos colocou em perigo tantas vezes, e agora nos oferece uma estadia na casa da sua família? Isso é algum tipo de truque?"
uw.dlg_NY25_Story_3 = "Apenas a voz da consciência falando! Percebi que me aproveitei da bondade dos outros por tempo demais. Mas agora, desejo fazer o bem."
uw.dlg_NY25_Story_4 = "Não estamos sozinhos… Tem pessoas se reunindo diante da cabana. O que eles querem a esta hora tardia? Estão nos chamando para sair."
uw.dlg_NY25_Story_5 = "Não vá! Os fantasmas vão destruir você! Eles não passam de espectros de memórias dolorosas. O espírito da floresta veio buscar seu baú! Vamos recuperá-lo!"
uw.dlg_NY25_Story_6 = "Um baú? Então é por isso que as pessoas estão desaparecendo nos bosques! Por que você nos traiu, Sly? Nós teríamos ajudado você nesta missão nobre de qualquer maneira!"
uw.dlg_NY25_Story_7 = "Você não entende. Se eu ouvir a voz dela, perderei o controle — e eu também desaparecerei. Enquanto eu carregar um pedaço dela comigo."
uw.dlg_NY25_Story_8 = "Abra a porta, estou congelando aqui fora, papai. A casa está fria e eu não estou lá dentro. Vou te mostrar um lugar onde podemos ficar juntos mais uma vez."
uw.dlg_NY25_Story_9 = "Pare! Não vá para a floresta — você vai se perder! Não sei de quem é a voz que você ouve, mas certamente não é humana!"
uw.dlg_NY25_Win_1 = "Acorde, Sly! DevoIva o baú ao espírito enquanto ele está fraco. Deixe-o ver que a humanidade pode superar sua própria ganância."
uw.saturn_enter_saturn_1 = "Vou enfiar suas palavras de volta pela sua garganta. E seus amigos vão assistir. A única maneira de sair da minha prisão é pelo cadafalso. Quem quer ir primeiro?"
uw.saturn_greeting_saimon_1 = "Nosso governante, o Patriarca, estudou o portal por anos. Então, um dia, ele se isolou em si mesmo. Mais tarde, ele ergueu o Obelisco, e isso fez algo com o nosso mundo…"
uw.saturn_greeting_saimon_2 = "Shadow é semelhante ao Obelisco em nível molecular. Há alguém que nos ajudará a usar isso contra o Patriarca. É por isso que estamos aqui, na câmara de Saturno…"
uw.saturn_greeting_saimon_3 = "Mil desculpas, minha senhora. No entanto, devemos libertar Lazarus. Por favor, leve-nos até a cela dele e não a incomodaremos mais."
uw.saturn_greeting_saturn_1 = "Vão longe, crianças? Vocês vieram para a minha prisão por livre e espontânea vontade! Eu me pergunto — isso é bravura ou estupidez? Você, o esguio — responda-me!"
uw.saturn_greetingn_May_1 = "Mas o que isso tem a ver conosco?"
uw.saturn_lose_saturn_1 = "Já chega para vocês. Se Lazarus está se associando a rejeitados como vocês, não há perigo para o Patriarca. Sumam daqui, pivetes! Vocês não estão na minha lista."
uw.saturn_win_saturn_1 = "Vocês nunca encontrarão Lazarus. Aquele malandro escapou da minha prisão e fugiu para os pântanos. Vocês desejam perecer também? Então vão atrás dele!"
uw.summerfest25_story2_1 = "Ora, ora… Você estava tão ansioso para me encontrar que achei que deveria lhe fazer esse favor. Além disso, todo mundo estava esperando por este momento."
uw.summerfest25_story2_2 = "'Todo mundo'? Pare com o teatro. Sabemos exatamente quem você é — e como usa os outros apenas para se deliciar com a miséria deles."
uw.summerfest25_story2_3 = "Apenas uma pequena ponta e, bum — estou em alta! Sinceramente, não esperava ser tão popular."
uw.summerfest25_story2_4 = "Sua sagacidade não vai salvar você. Você vai pagar — pelos meus olhos e por todo o mal que fez. Seu jogo doentio de brincar de deus termina aqui!"
uw.summerfest25_story2_5 = "Sério, Ermine? Esse tipo de papo saiu de moda junto com os celulares de abrir. Estamos em 2026 — tente acompanhar os tempos."
uw.summerfest25_story2_6 = "Seja lá o que o Arquiteto esteja planejando… há uma escuridão ao redor dele. Uma força tão malévola que é quase tangível."
uw.summerfest25_story2_7 = "A cada palavra que ele fala, me pego acreditando cada vez mais na história de Ermine. O Arquiteto é perigoso — e deve ser detido."
uw.summerfest25_story2_defeat_1 = "Ah não — que decepcionante! O público esperava mais. Parece que terei apenas que aumentar as apostas da próxima vez."
uw.summerfest25_story2_win_1 = "Por que o mundo é tão cruel? Por que devemos sofrer? Por que tive que me cegar? Responda-me, Arquiteto — por que dói viver!?"
uw.tutorial_ascention_intro_title = "MARIONETISTA"
