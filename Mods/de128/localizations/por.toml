sensei.defeat.OK = "OK"
sensei.defeat.Sensei_defeat1 = "Não, espere... Não foi assim que aconteceu. Por favor, perdoe o esquecimento deste velho."
sensei.defeat.Sensei_defeat2 = "Acho que aconteceu de outro jeito... A memória pode ser muito frágil."
sensei.defeat.Sensei_defeat3 = "Acho que não foi assim que a luta terminou. Deixe-me tentar lembrar..."
sensei.defeat.Sensei_defeat4 = "Minhas lembranças são tão vagas... Eu acho que venci aquela luta."
sensei.defeat.Sensei_defeat5 = "Não, não foi assim. Parece que eu venci... eu acho."
sensei.defeat.characterSensei = "SENSEI"
