uw.dlgAmericanEvent22Story_May_1 = "Она совершенно замёрзла, Сенсей! Мы не можем выставить её за дверь, когда снаружи бушует такой ветер…"
uw.dlgAmericanEvent22Story_Puma_1 = "В беде, старик… Я никогда не думала, что прошлое моего народа настигнет меня, но это случилось. Поэтому я бежала, чтобы защитить их. Пожалуйста, выслушай меня!"
uw.dlgAmericanEvent22Story_Puma_2 = "Вы тоже это слышите? Когда я была ребёнком, шаман рассказывал мне о духе, чей вой поднимал волны и срывал листву. Никогда не думала, что эта старая сказка окажется правдой!"
uw.dlgAmericanEvent22Story_Puma_3 = "Он идёт сюда, чтобы преследовать нас своим криком, пока мы не упадём замертво от удушья… Просто ради забавы! Мне больше негде прятаться…"
uw.dlgAmericanEvent22Story_Sensei_1 = "Двери моей обители открыты для всех страждущих. Но увидеть пирата в этих стенах довольно неожиданно… И где же твоя банда головорезов, Пума?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Мифы шаманов — всего лишь аллегории. Люди изобрели паруса, чтобы укротить ветер, и с тех пор он верно им служит. Ты всего лишь глупая сказка, и Тень это докажет!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Я — Волк-Ветер! Любой, кто встанет у меня на пути, будет потушен, как свеча! И рано или поздно я выломаю вашу дверь. Это лишь вопрос времени!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Я буду завы-ы-ывать, пока листья не засыплют обломки. Никто никогда не найдёт сюда дорогу! Дерзко и глупо… Как ты можешь бороться со стихией, смертный?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Какой позор… Ты лишил меня моего могучего голоса! Но твоя вера, девчонка, вернёт меня к жизни… И я приду не один! Ибо нас много!"
uw.dlgArkhosGreetings = "Фанатики! Слепцы! Вы помните обо мне, и это питает меня. Вера в Отца. Родитель бывает строг, и мое наказание вы примете с благодарностью..."
uw.dlgArkhosLost = "Кому же поклониться мне в последний час? Почему ты оставил меня, создатель? Ты дал мне силу повести их за собой, а я подвел тебя... Вновь."
uw.dlgArkhosStory1 = "Я знаю таких как он. Они собирают возле себя последователей, которые питаются ложью. Не слушай его пламенные речи, ведь они — его оружие."
uw.dlgArkhosStory2 = "Ты не прав, старик. Я найду для непослушных чад немного каленого железа. Ты еще попросишь меня пустить тебя в семью... Но я буду неумолим."
uw.dlgArkhosWin = "Паршивая овца, ты не достоин места подле меня. Уходи! Я передам создателю весть, как вы, люди, вновь проиграли. И он накормит моих детей..."
uw.dlgBerstuuk_Announce = "В поисках запретных знаний талантливый учёный объединил науку и магию, стремясь стать богом. И трансформация неизбежна! Теперь лес превратился в его кошмарную лабораторию, а люди стали его добычей. Только вы можете остановить этот ужасающий метаморфоз! Отбросьте страх и отправляйтесь в самую чащу на поиски ложного идола!"
uw.dlgBerstuuk_Loose_1 = "Когда ты пришёл к моей двери, ты рассказал мне всё без слов! Я буду тянуть это знание, как тонкую нить, пока ничего не останется!"
uw.dlgBerstuuk_Story_1 = "Там снаружи Проныра ломится в дверь амбара… Чего только я ни видал в лесу по ночам, но это что-то новенькое! Что с ним стряслось?"
uw.dlgBerstuuk_Story_10 = "Недостаточно. Наука непредсказуема — посмотри на меня! Постепенно я принял лес, но он упорно отказывался принимать меня. До этого самого момента."
uw.dlgBerstuuk_Story_2 = "Тех, кто ищет помощи, дорога приводит к нужной двери. Но Проныра, похоже, сбился с пути… Ах ты, старый мошенник, руки-то побереги! Что произошло?"
uw.dlgBerstuuk_Story_3 = "Плутишка искал помощи — и он её нашёл. Идём в лес, пока он не забрал то, что принадлежит ему по праву. Человеческие жизни!"
uw.dlgBerstuuk_Story_4 = "«Человеческие»? Бедняга в шоке — на нём лица нет! Что его так сильно напугало, раз уж у него случился внезапный приступ совести?"
uw.dlgBerstuuk_Story_5 = "Слышишь пение птиц? В такой час они уже должны щебетать, но тут стоит лишь мёртвая тишина… Что ещё таится в этом лесу?"
uw.dlgBerstuuk_Story_6 = "Мёртвая тишина. Мёртвая тишина. Людям нужна помощь. Нужно по-о-мочь. Помоги сейчас!"
uw.dlgBerstuuk_Story_7 = "Боги правые! Люди обычно не превращаются в сухие ветки и мох, как бы сильно они ни были напуганы! Что это за тварь и где настоящий Проныра?!"
uw.dlgBerstuuk_Story_8 = "Он где-то здесь. Мелкий умишко Проныры оказался весьма полезен. Он рассказал мне о тебе, Тень, — о твоей особой силе. И меня осенило!"
uw.dlgBerstuuk_Story_9 = "Так это о тебе говорило то существо? Лес придёт и заберёт. И сколько же таких «законных» жизней ты отнял, безумец?"
uw.dlgBerstuuk_Win_1 = "Природа найдёт выход! Наш бой поведал мне больше, чем ты думаешь, Тень. Лес запомнит. Он поглотит меня, чтобы ожить вновь…"
uw.dlgFatumGreetings = "Смелость ваша сравнится лишь с глупостью. Но я знала о вашем приходе, ведь вы – мой рок, а я – ваш. И я перепишу ваши судьбы навсегда."
uw.dlgFatumLost = "Я знаю человечество. Вы ходите по спирали. Я видела это уже не раз. Саморазрушение и увядание. Ничто не изменит этого. Такова ваша судьба."
uw.dlgFatumStory1 = "Осторожнее, герой. Привычные тебе законы мироздания перестают работать на такой глубине..."
uw.dlgFatumStory2 = "Все верно, держи мальчишку в узде. Я знаю о ваших судьбах все: кто вы и куда идете. Рассказать вам, кто погибает в конце?"
uw.dlgFatumWin = "Твоя судьба предрешена. Ты проиграл уже в тот момент, как ступил на порог моей обители. Хватит ли тебе мужества переписать свою историю?"
uw.dlgFungusGreetings = "Вы отравили землю, открыв врата, и мои грибы умирают. Они заберут ваш разум — и мы станем единым целым, человек. Так кончится ваша история!"
uw.dlgFungusLost = "Мои братья слишком заигрались в богов. Вера услаждает их. Но разрушение — в человеческой природе, поэтому миру будет лучше без вас."
uw.dlgFungusWin = "Уходите! И насладитесь последними минутами ваших хрупких жизней!"
uw.dlgHW21LosePuppeteer_1 = "Я бы не доверил тебе даже роль без слов, Тень. Сцена — не твоё призвание, не позорь моё ремесло!"
uw.dlgHW21StoryArkhos_1 = "Чума идёт на ваш город, смертные! Склонитесь перед мощью вашего бога! И порадуйте свой взор блеском золота, иначе…"
uw.dlgHW21StoryPuppeteer_1 = "Да что ты понимаешь в искусстве! Ты погубил моё величайшее предприятие! Тем не менее… приближается третий акт. И в нём герой испустит дух!"
uw.dlgHW21StorySensei_1 = "С каких это пор боги подземного мира поднимаются сюда, чтобы вымогать деньги у простых людей? Сбрось маску, обманщик, пока мы не взялись за оружие!"
uw.dlgHW21StorySensei_2 = "Театр должен вдохновлять, а не ужасать. Ты же извратил саму суть искусства. Мы остановим тебя, пока твои «актёры» не пострадали."
uw.dlgHW21StoryThief_1 = "Постойте! Это же я… Проныра! Не бейте меня! Он обещал, что все будут меня бояться… И никто не узнает. Как я себя выдал?"
uw.dlgHW21StoryThief_2 = "Владелец бродячего театра — Кукловод. Он сказал, что это будет его лучшее представление. Боги среди людей! Мне-то до этого дела не было. Но вот деньги, с другой стороны…"
uw.dlgHW21WinPuppeteer_1 = "Это фиаско! Ты разрушил мой чудесный сюжет и разбил мои маски! Как мне теперь ставить пьесу без реквизита…"
uw.dlgHW22EnterArchitect = "Все эти ваши фэнтезийные сюжеты меня утомили… Теперь мы будем играть по моим правилам. И в твоих интересах удивить меня, Тень…"
uw.dlgHW22LooseArchitect_1 = "Этого и следовало ожидать. Я знаю все твои приёмы, Тень. В конце концов, это ведь я тебя придумал. Возможно, тогда я был не в лучшей форме… Но сейчас твоя новая жизнь тебе понравится."
uw.dlgHW22StoryArchitect_1 = "Это называется «клише», Кукловод. За что вообще платят драматургам? За количество знаков? Образ бормочущего безумного гения уже изрядно приелся, впрочем, как и образ героя…"
uw.dlgHW22StoryArchitect_2 = "Вот и всё. Мы перепишем ваш мир с нуля! Современный, креативный, актуальный! Чем там сейчас увлекаются подростки? Почему ты молчишь, Тень? Ах, ну да…"
uw.dlgHW22StoryPuppeteer_1 = "Раздаётся стук — нежданный стук в твою дверь! Это путник зашёл на огонёк или нечто большее? Интригует, не правда ли?"
uw.dlgHW22StoryPuppeteer_2 = "Я так и знал, что ты это скажешь, старик. Чего ещё ожидать от вымышленных персонажей? Бумага-то всё стерпит… А вот зрители — никогда!"
uw.dlgHW22StoryPuppeteer_3 = "Я лишь раб сцены, только и всего. И мой новый шедевр расскажет о встрече с создателем — о муках предопределения и свободы воли…"
uw.dlgHW22StorySensei_1 = "Что бы ты ни выдумал, Кукловод, мы больше не намерены играть в твои игры. Искусство может причинять боль, но не так, как это делаешь ты."
uw.dlgHW22StorySensei_2 = "Ты заигрался и больше не отличаешь реальность от своих фантазий, артист… Ты безумен."
uw.dlgHW22StorySensei_3 = "Твои слова странны и тревожны, незнакомец… Не знаю, какое безумие творится в твоей голове, но Тень его из тебя выбьет."
uw.dlgHW22WinArchitect_1 = "Пожалуй, творение больше не принадлежит своему создателю и зажило собственной жизнью… Ты удивил меня. Хочу посмотреть, куда сюжет повернёт дальше."
uw.dlgHoaxenGreetings = "Ваша жизнь — всего лишь иллюзия. А мы ее кузнецы. Мы сведем вас с ума, пока остальные надеются на грубую силу. Огонь, вода, болезни — ха!"
uw.dlgHoaxenLost = "Где ты, брат? Я больше не слышу твой голос! Воистину, одиночество взаперти гораздо страшнее огня и меча... Ступайте, глупцы. Отец ждет."
uw.dlgHoaxenStory1 = "Мы? Похоже, Тень, наш враг совершенно слетел с катушек. С какой из твоих личностей мы говорим? Может, твой \"брат\" будет куда адекватнее?"
uw.dlgHoaxenStory2 = "Смеешься над нами, человек? Брат предлагает отправить ваши души в пучину вечного кошмара... И тогда ваш мир сдастся без единой капли крови."
uw.dlgHoaxenWin = "Я бы убил тебя, ведь милосердию моему нет границ. Но мой брат не имеет такого терпения: вы вольны уйти, если не свихнетесь по пути отсюда."
uw.dlgHunter_enter_hunter_1 = "Ты! Эй, ты-ы-ы! Пришёл закончить то, что на-а-ачал, да? Ты? В тебе есть сила. Она гово-о-орит со мной. Цыц! Или я заста-а-авлю тебя!"
uw.dlgHunter_greeting_may_1 = "Смотри! Внутри кристалла что-то есть… Так и должно быть?"
uw.dlgHunter_greeting_saimon_1 = "Как странно… Я ожидал, что Лазарь сотрёт Обелиск в порошок. Я боялся резни, но, похоже, остались только мы с тобой. Я заинтригован."
uw.dlgHunter_greeting_saimon_2 = "Зал Концентрации. Видишь этот кристалл в центре? Именно так Обелиск накапливает теневую энергию — сердце тьмы, если можно так выразиться."
uw.dlgHunter_greeting_sensei_1 = "Молчание — дурное предзнаменование, мой рациональный друг. Оно может говорить громче самых оглушительных слов. Хм… Где мы? Что это за причудливое место?"
uw.dlgHunter_greeting_sensei_2 = "Сомневаюсь, дорогая… Это место выглядит совсем не так, каким я видел его в последний раз. Я начинаю думать, что старик был прав…"
uw.dlgHunter_loose_hunter_1 = "Ложи-и-ись. Я оста-а-авлю тебя здесь наве-е-ечно. Больше не причиня-а-ай вреда."
uw.dlgHunter_win_hunter_1 = "Стой, человек-Тень! Не дай этому ра-а-асползтись! Ты ста-а-анешь как о-о-он. Тебя обма-а-анут! Но у тебя всё ещё есть ша-а-анс."
uw.dlgIE21AnnounceAssistant_1 = "Это ещё кто такой? Что ты делаешь в нашем мире и с какой стати мы вообще должны тебя слушать?"
uw.dlgIE21AnnounceAssistant_2 = "Ха! Не знаю, откуда ты вылез, но долго ты здесь не задержишься!"
uw.dlgIE21AnnounceAssistant_3 = "Эй, Тень, этот наглец зашёл слишком далеко! Давай проучим его и научим хорошим манерам!"
uw.dlgIE21AnnounceBoss_1 = "Жалкие смертные! Склонитесь перед моей волей и величием, иначе я заставлю вас встать на колени!"
uw.dlgIE21AnnounceBoss_2 = "Да как ты смеешь так со мной разговаривать? Я Равана, покоритель всех трёх миров!"
uw.dlgIE21AnnounceBoss_3 = "Это ваш последний шанс преклонить колени. Откажитесь — и я лишу вас головы!"
uw.dlgIE21AnnounceSensei_1 = "Тень, я чувствую приближение таинственной угрозы. Нечто зловещее вновь проникло в наш мир."
uw.dlgIE21Boss_After_Loose = "Если все жители этого мира так слабы, то его завоевание — лишь вопрос времени!"
uw.dlgIE21Boss_After_Win = "ГЛУПЦЫ! На этот раз я отступлю, но вам не одолеть меня так просто. Я вернусь!"
uw.dlgIndia22Story_May_1 = "И из-за этого вы начали голодать… Но что могло понадобиться этому демону на вашем весёлом празднике? Как скромные фермеры могли привлечь такого хищника?"
uw.dlgIndia22Story_Rakshasa_1 = "У тебя интересный запах, человек. Спорим, ты и на вкус хорош! Слышишь, как у меня урчит в животе? Отборный кусок мяса к моему рису был бы очень кстати!"
uw.dlgIndia22Story_Rakshasa_Lose = "К твоему счастью, наш поединок измотал меня. К тому же мой голод утолён… пока что. Я нагуляю новый аппетит и снова выйду на охоту!"
uw.dlgIndia22Story_Sensei_1 = "Расскажи мне о нём, путник. По твоей одежде я вижу, что ты проделал долгий путь. Какая беда терзает твой дом?"
uw.dlgIndia22Story_Sensei_2 = "Поумерь свой аппетит, демон! Тому, кто крадёт саму жизнь, нет места на празднике жизни!"
uw.dlgIndia22Story_Sensei_Win = "Не магия заставляет сад расцветать, а упорный труд. И ты докажешь это сам: помоги соседям восстановить их ферму, иначе…"
uw.dlgIndia22Story_Sitaram_1 = "Я слышал историю твоей жизни. Да вознаградят тебя боги по твоим заслугам! Но я принёс дурные вести: в моих землях объявился злой дух…"
uw.dlgIndia22Story_Sitaram_2 = "Злоба этого демона уступает разве что его прожорливости! Мы как раз готовились праздновать Бохаг Биху, как вдруг это… существо появилось и пожрало все наши саженцы!"
uw.dlgIndia22Story_Sitaram_3 = "Клянусь Агни, госпожа моя, я задаю себе тот же вопрос! Теперь мы со страхом ждём заката… Прошу вас, пойдёмте со мной!"
uw.dlgIndia24_Enter_Puppet_1 = "Хватит ли тебе духу, чтобы направлять судьбу? Реши мою, скромного слуги искусств. Только в бою можно по-настоящему понять, кто есть кто. Будь смелее, Тень, — в атаку!"
uw.dlgIndia24_Story_Dandy_1 = "Открывайте, не то я выломаю эту проклятую дверь! Я знаю, что вы дома, — я слышу вас! Я сожгу эту лачугу дотла, если вы не впустите меня!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "О, как отчаянно смертные цепляются за жизнь. Не я выбирала это ремесло, и я не стану проливать из-за него ядовитые слёзы… Зачем ты так со мной?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Её сердце полно любви. Боги создают нас чистыми, но мы сами выбираем свой путь. Слушая историю девушки, Нритью начинает это понимать."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Тень, твоему исполнению не хватает страсти и самоотдачи. Я дам тебе ещё один шанс. Не играй эту роль — проживи её!"
uw.dlgIndia24_Story_Puppet_1 = "Тук-тук! Привет, старые друзья! Голос судьбы настиг нас — и она уже в пути! Её алый подол тлеет, как сама жизнь на исходе дня!"
uw.dlgIndia24_Story_Puppet_2 = "Не за твоей ли душой она пришла? Внемлите истории, древней как сам мир, — легенде о Нритью, чьей долей было отнимать жизни."
uw.dlgIndia24_Story_Puppet_3 = "Призраки без умолку болтают. Им нельзя верить. Да и к тому же это не их история. Я покажу тебе правду её глазами. Тень, ты единственный, кто способен понять."
uw.dlgIndia24_Story_Sensei_1 = "Этот голос… Похоже, наш старый противник снова что-то задумал. Кто станет жертвой на этот раз? Я вижу человека, бегущего к пагоде…"
uw.dlgIndia24_Story_Sensei_2 = "Твоя одежда покрыта грязью и сажей, незнакомец. И твой тон меня тревожит. Объясни, кто ты такой и какое дело привело тебя к нашему порогу!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Назад! Я этого не хотела! Моя семья боялась меня, и я подумала, что это мой шанс… Франт обещал взять меня с собой, если я помогу…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "Вот и всё! Ты засыпаешь вечным сном, хоть и не заслуживаешь этого. Но не мне судить тебя — это чужое призвание. Я лишь проводник."
uw.dlgIndia24_Story_Win_Puppet_4 = "Прямо как ты, Тень. Я хочу, чтобы ты пошел по пути Нритью. Ей потребовалась вечность, чтобы осознать своё место."
uw.dlgIndia24_Story_Win_Puppet_6 = "Шоу продолжается! Ты, Тень, будешь звездой, а мои актёры — твоей массовкой. История Нритью станет нашей лучшей постановкой!"
uw.dlgIndia24_Story_Win_Sensei_1 = "У этой истории глубокий смысл — даже для тебя. Я удивлен! Но в чём же здесь мораль? Зачем ты показываешь это нам?"
uw.dlgMegalithGreetings = "Шахта — священное место. Зачем ты здесь? Уходи и прими свою судьбу с достоинством. Последнее, что ты услышишь — как под ногами дрожит земля!"
uw.dlgMegalithLost = "Проклятье! Мне снова ждать тысячи лет?! Благодаря мне сходились континенты! Это я должен был очистить землю! "
uw.dlgMegalithWin = "Я добр к людям. Среди бессмертных это — редкость. Бывало, я помогал вашему виду. Поэтому бегите, пока я даю вам шанс попрощаться с близкими."
uw.dlgRaidIntro1 = "Ты пытаешься исправить свою ошибку? Ты открыл врата, но лишь Бессмертные могут уничтожить теневую заразу. Ты же слаб, ты не один из нас. "
uw.dlgRaidIntro2 = "Ты умрешь, как и все. В моих венах течет магма — и она покроет землю, очистит ее для новой жизни."
uw.dlgRaidStory1 = "Что это за подвал и зачем мы здесь? "
uw.dlgRaidStory2 = "Здесь начинаются владения Бессмертных. Тысячелетиями они спали, но врата теней поставили весь мир под угрозу — и им пришлось проснуться. "
uw.dlgRaidStory3 = "А, ну значит они нам помогут по-быстрому разобраться с вратами!"
uw.dlgRaidStory4 = "О, нет. Они уничтожат врата, но вместе с ними уничтожат и человечество. Для них это всего лишь новый цикл."
uw.dlgShurale_Announce = "Пробуждённый алчными бандитами, лесной дух теперь мстит невиновным. Существо ищет украденную шкатулку воспоминаний — вместилище его древней магии. Лишь те, чьи сердца полны истинной скорби, смогут усмирить ярость твари. Однако цена будет высока…"
uw.dlgStoryBtnFight = "В БОЙ!"
uw.dlgStoryBtnMore = "ДАЛЕЕ"
uw.dlgVolcanoGreetings = "Среди Бессмертных я проснулся первым. Сколько бы бойцов не пришло ко мне на убой, я завершу свое дело. "
uw.dlgVolcanoLost = "Довольно! Я отступлю. Но знай: вы, смертники, разбудили моего брата. Пусть его вид не вводит в заблуждение — он быстр и смертоносен!"
uw.dlgVolcanoStory1 = "Я вижу полуразрушенные жилища и огромную статую. Здесь живут люди?"
uw.dlgVolcanoStory2 = "Фанатики поклоняются Бессмертным в надежде, что те сохранят им жизнь. Воистину, слепы невежды в своей вере."
uw.dlgVolcanoWin = "Я всегда говорил братьям, что судьбу планеты буду решать я. Не верили? Смотрите, как мой огонь накроет планету!"
uw.dlgVortexGreetings = "Темные воды поглотят землю, а с ними и Врата теней! Их секрет уйдет в бездну со мной. А наверху не останется никого, кто бы его поведал!"
uw.dlgVortexLost = "Впервые за тысячелетия человек одерживает победу. Как же сильна ваша воля к жизни! Но что бы вы ни делали, исход один — вы умрете."
uw.dlgVortexWin = "Тысячелетиями я наблюдал, как ваш род угасает. В этом есть некая красота. Пожалуй, я сохраню тебе жизнь, но исключительно забавы ради."
uw.dlgWhisperGreetings = "Кажется, кому-то не терпится узнать свою судьбу. Дай мне руку и посмотри в зеркало!"
uw.dlgWhisperLost = "Ты всё ещё жив? Значит, ты пока не в моей власти! Фатум предскажет твою судьбу, а затем я вернусь в свой мир… но предупреждаю: будь осторожнее с зеркалами!"
uw.dlgWhisperWin = "Я заберу тебя с собой в царство пепла, духов и вечной ночи! Доверься мне — смотри мне в глаза и не отводи взгляд."
uw.dlg_American_25_Loose_1 = "Ты не знаешь, кого защищаешь, Тень. Они не скажут тебе спасибо. Они будут лишь злорадствовать у тебя за спиной. Дикари… и после этого чудовище здесь я?"
uw.dlg_American_25_Story_1 = "Мэй пропала. Её забрало какое-то существо, едва похожее на человека. Но ни криков, ни следов борьбы не осталось… как будто она ушла сама, по собственной воле."
uw.dlg_American_25_Story_2 = "Мы не одни в этой беде. Другие, такие же как Мэй — молодые и сильные, — тоже исчезли. Она чувствовала, что это произойдёт… и набила карманы порохом."
uw.dlg_American_25_Story_3 = "Её след отчётливо виден. Мы должны найти её до того, как пойдут дожди, иначе он будет потерян навсегда. За мной, Тень!"
uw.dlg_American_25_Story_4 = "Я учуял тебя в тот самый миг, когда ты ступил на эту проклятую землю. Зачем ты пришёл? Растоптать моё горе? У тебя нет чести — как не было её и у них."
uw.dlg_American_25_Story_5 = "Я знал, что ты явишься, шаман. Верни детей их близким, а нашего друга — нам. А потом ступай гнить на свою пепельную гору."
uw.dlg_American_25_Story_6 = "Прах к праху. И в пепел ты обратишься, смертный…"
uw.dlg_American_25_Win_1 = "Постойте! Я пошла с ним добровольно. Да, его облик чудовищен, но его сердце — человеческое. И оно страдает… Они украли его дитя!"
uw.dlg_CHN_NY25_Announce = "Погрузитесь в историю героя прошлых эпох — отделите правду от вымысла и помогите создать новую легенду! Выступите против таинственного культа, который прикрывает свои бесчинства именем великого героя! Вернитесь туда, где всё началось, и помогите беглому плуту открыть в себе истинный героизм!"
uw.dlg_CHN_NY25_Loose_1 = "Нет, мы должны продолжать сражаться! Никто не поверит, что простой фермер может так легко одолеть зловещий культ. Выложись на полную!"
uw.dlg_CHN_NY25_Story_1 = "У Культа Солнца есть традиция раз в год посещать место рождения своего великого героя. Но каждый раз это оборачивается катастрофой…"
uw.dlg_CHN_NY25_Story_2 = "Он родился человеком? Как любопытно. Но мне кажется, что эти люди принесли в деревню вовсе не подарки…"
uw.dlg_CHN_NY25_Story_3 = "Они крушат всё на своём пути! Крадут скот у деревенских, в пьяном угаре топчут урожай, бьют окна и лезут в драку!"
uw.dlg_CHN_NY25_Story_4 = "Но почему жители деревни не дают отпор? Это ведь их земля и их легенда!"
uw.dlg_CHN_NY25_Story_5 = "Они сломлены. Героя, который дарил им надежду, больше нет, а культисты творят зло под его именем. Мы должны вернуть им надежду!"
uw.dlg_CHN_NY25_Story_6 = "Скажи, что ты пришёл проверить, всё ли готово к «празднику». И мы примем бой! Жители увидят, что культу можно противостоять!"
uw.dlg_CHN_NY25_Story_7 = "Что ж, будь по-твоему… Дай мне войти в роль. «Эй, малец, как ты смеешь носить одеяния нашего героя! А ну пошёл прочь — нам нужно готовить пир!»"
uw.dlg_CHN_NY25_Story_8 = "Пусть я и не герой из легенд, но его дух живёт на этой земле! Он направит меня в самый тёмный час и придаст мне мужества! В атаку!"
uw.dlg_CHN_NY25_Win_1 = "Не ожидал такой прыти от обычного смертного… Ты почти одолел нашего чемпиона! Мы должны сделать из тебя пример для остальных, чтобы другим неповадно было…"
uw.dlg_NY25_Loose_1 = "Твои воспоминания ярки, а скорбь говорит громче разума. Ты останешься здесь со мной. Отдохни немного — скоро придёт сон."
uw.dlg_NY25_Story_1 = "Добро пожаловать! Эта хижина когда-то принадлежала моей семье. Столько воспоминаний… Оставайтесь сколько захотите. Здесь есть всё необходимое для отдыха."
uw.dlg_NY25_Story_2 = "Но ты столько раз подвергал нас опасности, а теперь предлагаешь остановиться в доме твоей семьи? Это какая-то уловка?"
uw.dlg_NY25_Story_3 = "Всего лишь голос совести! Я понял, что слишком долго пользовался чужой добротой. Но теперь я хочу творить добро."
uw.dlg_NY25_Story_4 = "Мы не одни… Перед хижиной собираются люди. Что им нужно в такой поздний час? Они требуют, чтобы мы вышли."
uw.dlg_NY25_Story_5 = "Не делайте этого! Фантомы погубят вас! Это всего лишь призраки болезненных воспоминаний. Лесной дух пришёл за своим сундуком! Мы должны вернуть его!"
uw.dlg_NY25_Story_6 = "Сундук? Так вот почему в лесу пропадали люди! Зачем ты предал нас, Проныра? Мы бы всё равно помогли тебе в этом благородном деле!"
uw.dlg_NY25_Story_7 = "Вы не понимаете. Если я услышу её голос, то потеряю контроль — и меня тоже не станет. Пока я ношу в себе частичку неё."
uw.dlg_NY25_Story_8 = "Открой дверь, папочка, я здесь совсем замёрзла. В доме холодно, а меня там нет. Я покажу тебе место, где мы снова сможем быть вместе."
uw.dlg_NY25_Story_9 = "Стой! Не ходи в лес — ты заблудишься! Я не знаю, чей голос ты слышишь, но это точно не человек!"
uw.dlg_NY25_Win_1 = "Проснись, Проныра! Верни сундук духу, пока он слаб. Пусть он увидит, что человечество способно преодолеть собственную алчность."
uw.saturn_enter_saturn_1 = "Я заставлю тебя проглотить эти слова обратно. А твои друзья будут смотреть. Единственный способ покинуть мою тюрьму — взойти на эшафот. Кто хочет быть первым?"
uw.saturn_greeting_saimon_1 = "Наш правитель, Патриарх, годами изучал портал. А потом в один прекрасный день ушёл в себя. Позже он воздвиг Обелиск, и тот что-то сделал с нашим миром…"
uw.saturn_greeting_saimon_2 = "Тень схож с Обелиском на молекулярном уровне. Есть кое-кто, кто поможет нам использовать это против Патриарха. Вот почему мы здесь, в чертогах Сатурн…"
uw.saturn_greeting_saimon_3 = "Тысяча извинений, госпожа. Тем не менее мы должны освободить Лазаря. Пожалуйста, проведите нас к его камере, и мы вас больше не побеспокоим."
uw.saturn_greeting_saturn_1 = "Далеко собрались, детки? Вы пришли в мою тюрьму по собственной воле! Интересно, это храбрость или глупость? Ты, длинный, — отвечай мне!"
uw.saturn_greetingn_May_1 = "Но какое отношение это имеет к нам?"
uw.saturn_lose_saturn_1 = "С вас довольно. Если Лазарь водится с такими отбросами, как вы, Патриарху ничто не угрожает. Проваливайте отсюда, шпана! Вас нет в моём списке."
uw.saturn_win_saturn_1 = "Вам ни за что не найти Лазаря. Этот подлец сбежал из моей тюрьмы и подался на болота. Тоже хотите сгинуть? Тогда отправляйтесь вслед за ним!"
uw.summerfest25_story2_1 = "Так, так… Вы так отчаянно искали меня, что я решил сделать вам одолжение. К тому же все ждали этого момента."
uw.summerfest25_story2_2 = "«Все»? Хватит ломать комедию. Мы прекрасно знаем, кто ты такой и как ты используешь других, чтобы упиваться их несчастьями."
uw.summerfest25_story2_3 = "Всего одно небольшое камео — и бум, я в трендах! Честно говоря, не ожидал, что буду настолько популярен."
uw.summerfest25_story2_4 = "Твое остроумие тебя не спасёт. Ты заплатишь — и за мои глаза, и за всё зло, что ты причинил. Твоя извращённая игра в бога заканчивается здесь!"
uw.summerfest25_story2_5 = "Серьёзно, Горностай? Такие разговоры устарели вместе с кнопочными раскладушками. На дворе 2026 год — соизволь идти в ногу со временем."
uw.summerfest25_story2_6 = "Что бы ни замышлял Архитектор… вокруг него сгущается тьма. Сила настолько злобная, что её можно ощутить физически."
uw.summerfest25_story2_7 = "С каждым его словом я всё больше верю в историю Горностая. Архитектор опасен, и его необходимо остановить."
uw.summerfest25_story2_defeat_1 = "О нет, какое разочарование! Зрители жвали большего. Что ж, видимо, в следующий раз мне придётся поднять ставки."
uw.summerfest25_story2_win_1 = "Почему мир так жесток? Почему мы должны страдать? Зачем мне пришлось лишить себя зрения? Ответь мне, Архитектор, — почему жить так больно?!"
