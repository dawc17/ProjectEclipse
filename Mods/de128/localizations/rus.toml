sensei.defeat.Sensei_defeat2 = "Кажется, все было по-другому... Память — очень хрупкая штука."
sensei.defeat.Sensei_defeat3 = "Кажется, финал той схватки был иным. Попробую вспомнить..."
sensei.defeat.Sensei_defeat4 = "Мои воспоминания такие расплывчатые... Мне кажется, я выиграл тот бой."
sensei.defeat.Sensei_defeat5 = "Нет, не так. В тот раз я победил."
