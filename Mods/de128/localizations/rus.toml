# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "История Сэнcея{br}Часть 1: \"Свидетель\""
sensei.entry.ActScreenSensei2 = "История Сэнcея{br}Часть 2: \"Тень грядущего\""
sensei.entry.ActScreenSensei3 = "История Сэнcея{br}Часть 3: \"Зверь внутри\""
sensei.entry.ActScreenSensei4 = "История Сэнcея{br}Часть 4: \"История мести\""
sensei.entry.ActScreenSensei5 = "История Сэнcея{br}Часть 5: \"Униженная и {br}оскорбленная\""
sensei.entry.ActScreenSensei6 = "История Сэнcея{br}Часть 6: \"Чудовище\""
sensei.entry.ButcherYoung_Greetings = "Никто не смеет ставить мой авторитет под сомнение! Семья не прощает этого. Ты не уйдешь отсюда живым!"
sensei.entry.Butcher_zone3_1 = "Блудный сын вернулся! Ты обдумал мое предложение, Князь: я отпускаю тебя, говорю, где магическая Сфера, а ты платишь мне золотом?"
sensei.entry.Butcher_zone3_2 = "Его молчание громче слов, старик. Я честен с собой, принял свою животную натуру. А он — нет. Но мы научим вас смирению. Дети, ко мне!"
sensei.entry.Guard1_Butcher_Sensei = "Мясник показал мне, как боль открывает нашу истинную сущность. Теперь я свободна! Вы тоже обретете счастье. Не сопротивляйтесь!"
sensei.entry.Guard1_Hermit_Sensei = "Грядут перемены! Я пересекла половину мира, чтобы понять это, столь многим пожертвовала... И мудрость учителя — это все, что у меня есть!"
sensei.entry.Guard1_Lynx_Sensei = "Нравятся мои узоры? Там, откуда я родом, их набивают сильнейшим в память о военных подвигах. Теперь и ты станешь частью моего рисунка..."
sensei.entry.Guard1_Wasp_Sensei = "Ты веришь в фортуну? Думаю, сегодня мне крупно повезет — я заберу все твои денежки! Повезет ли тебе, старик?"
sensei.entry.Guard1_Widow_Sensei = "Госпожа мне как сестра. Я отлично чувствую ее боль. Она запретила мне трогать Князя, поэтому мой гнев падет на тебя!"
sensei.entry.Guard2_Butcher_Sensei = "Добыча сама идет к хищнику! Философия — это для умников, я же просто люблю играть с ножами. Поиграете со мной?!"
sensei.entry.Guard2_Hermit_Sensei = "Учитель рассказывал о мире теней, его обитателях и невероятной силе, которой поделится с нами. Думаешь, я позволю все это у нас забрать?"
sensei.entry.Guard2_Lynx_Sensei = "Наш клан делает работу, о которую даже боги не хотят марать руки. Мы решаем проблемы и исправляем чужие ошибки. И ты — одна из них. "
sensei.entry.Guard2_Wasp_Sensei = "Угрожаешь моему капитану? Она спасла меня из рабства, и я поклялась отработать свою свободу. Пусть духи будут добры к тебе..."
sensei.entry.Guard2_Widow_Sensei = "Моя госпожа прекрасна! Я был не достоин смотреть на ее лик... Теперь моя жизнь принадлежит ей. Я буду защищать ее честь до последнего вздоха."
sensei.entry.HermitYoung_Greetings = "Князь, вы — жертва обстоятельств. Ее нужно было принести для общего блага. Моя школа станет великой, и настанет золотой век боевых искусств!"
sensei.entry.Hermit_zone2_1 = "Вы оказались между молотом и наковальней, господин. Да, я предал вас. У меня не было выбора, ведь на карту поставлено будущее моей школы."
sensei.entry.Hermit_zone2_2 = "Этот заносчивый юнец Рысь не справился со своей задачей. Видимо, его работу придется делать мне. Ученики, сюда!"
sensei.entry.LynxYoung_Greetings = "Я не могу просто так уйти. Я уже взял деньги за жизнь Князя. Ничего личного, старик."
sensei.entry.Lynx_Sensei_1 = "Не слушай Князя, старик, он сошел с ума. Мы отведем его высочество домой, пока он не навредил себе. Твоя помощь не требуется."
sensei.entry.Lynx_Sensei_2 = "Правда? А вот я вижу напуганного человека в окружении головорезов. Что-то подсказывает мне, что Князь говорит правду. Отойдите от него!"
sensei.entry.Lynx_Sensei_3 = "Дело твое. За разговоры мне не платят. Две головы — больше денег! Взять их, ребята!"
sensei.entry.NAME_BUTCHER = "МЯСНИК"
sensei.entry.NAME_HERMIT = "ОТШЕЛЬНИК"
sensei.entry.NAME_LYNX = "РЫСЬ"
sensei.entry.NAME_PRINCE = "КНЯЗЬ"
sensei.entry.NAME_SHOGUN = "СЕГУН"
sensei.entry.NAME_WASP = "ОСА"
sensei.entry.NAME_WIDOW = "ВДОВА"
sensei.entry.OK = "ОК"
sensei.entry.Prince_Intro = "Спасите! Эти люди хотят меня убить!"
sensei.entry.Prince_zone3_1 = "Как ты смеешь очернять мое имя! Ты... ты жалкий отброс! Я вернулся, чтобы положить конец твоему царству жестокости!"
sensei.entry.Prince_zone6_1 = "Вот и ты, мой верный друг! Смотри, справедливость вновь торжествует — Сегун предан мне словно пес! Его разум принадлежит мне!"
sensei.entry.Prince_zone6_2 = "Ты тоже хочешь забрать мой трон, старик?! Он принадлежит мне по праву рождения! Никто не заберет его!"
sensei.entry.Sensei_arc_intro1 = "Однажды во время прогулки я встретил правителя местных земель, которому угрожала смертельная опасность."
sensei.entry.Sensei_zone3_1 = "Значит, вот так работает \"удача\"? Купили себе свободу, бросили людей на растерзание банде безумцев... А я был добр к вам, Князь."
sensei.entry.Sensei_zone4_1 = "Вдова? Конечно... она приказала мне забрать Сферу и доставить ее  Сегуну лично в руки."
sensei.entry.Sensei_zone6_1 = "Остановись, Князь! Посмотри вокруг! Эта Сфера питается твоей яростью, она превращает тебя в чудовище!"
sensei.entry.Shogun_zone6_1 = "Слабак! Ты не годишься даже в шуты при дворе моего повелителя. Я сокрушу тебя одним ударом!"
sensei.entry.TITLE_PRINCE_EVIL = "ПРОКЛЯТЫЙ ПРИНЦ"
sensei.entry.WaspYoung_Greetings = "Что я скажу своему отцу? Что его дочь размякла и проиграла бой какому-то старику? Не бывать этому, пока я — наследница пиратского трона!"
sensei.entry.Wasp_zone4_1 = "Вдова прислала тебя забрать Сферу? А не староват ли ты для такого рода поручений? Хотя какое мне дело. Поднимайся на борт."
sensei.entry.Wasp_zone4_2 = "Только вот Сферы у меня больше нет. Люди Вдовы забрали ее еще вчера. Уж не знаю, кто ты, но ложь я не прощаю. Протащить его под килем!"
sensei.entry.WidowYoung_Greetings = "Князь унизил меня, отверг, посмеялся над моими чувствами. И теперь я ударю в ответ! Ты — его друг, поэтому передашь от меня это послание..."
sensei.entry.Widow_zone5_1 = "Ты тоже пришел унизить меня, как и Князь? Вы, мужчины, все одинаковые..."
sensei.entry.Widow_zone5_2 = "Он рассказывал о твоем добром нраве, о чести, достоинстве. Но больше я мужским словам не верю. Каждый из вас будет страдать!"
sensei.entry.Zone2_SenseiReminder = "В прошлый раз я поведал о том, как спас Князя от убийц. Я узнал, что солдаты Князя в тайне обучаются у Отшельника. И мы направились к нему."
sensei.entry.Zone3_SenseiReminder = "Отшельник поведал, что Князя предал военачальник Сегун и заплатил некому Мяснику за похищение правителя. Время навестить бандита."
sensei.entry.Zone4_SenseiReminder = "В злоключениях Князя виновата женщина! Она придумала, как сбросить правителя с трона с помощью магической Сферы, которую доставили в порт..."
sensei.entry.Zone5_SenseiReminder = "Пиратка рассказала мне о непростых отношениях Вдовы и Князя. Я не получил Сферу, но узнал, что Князь направился в горы, чтобы найти Вдову."
sensei.entry.Zone6_SenseiReminder = "Магическая Сфера свела Князя с ума! Он обрел невероятную силу, которая грозила погубить нас всех! Я не мог этого допустить!"
sensei.entry.characterSensei = "СЭНСЕЙ"
