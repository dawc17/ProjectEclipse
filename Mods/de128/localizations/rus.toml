uw.blackness_enter_blackness_1 = "Потомство. Великая жертва. Сфера. Разум. Бойня. Я чувствую. Ты прольёшь кровь. Я вижу боль. Я вижу будущее. Я покажу тебе."
uw.blackness_greeting_blackness_1 = "Что случилось, Тень? Тебе нехорошо?"
uw.blackness_greeting_lazarus_2 = "Саймон? Ну ты и сволочь! Зачем ты привёл сюда людей? Оно учует шлейф твоих мыслей! Убирайтесь отсюда, пока Чернота не добралась до вашего разума!"
uw.blackness_greeting_may_1 = "Слышишь? Ничего! Тишина. Без птичьего пения это место словно застыло в янтаре. Правильно ли мы поступаем? У меня очень плохое предчувствие…"
uw.blackness_greeting_saimon_2 = "Эти достопочтенные господа — твой билет на свободу, дорогой мой. Тот, что покрупнее и в чёрном, как-то связан с Обелиском и Вратами. Он поможет тебе, а ты поможешь ему."
uw.blackness_greetingn_saimon_1 = "Немудрено. С тех пор как обломок древних Врат рухнул сюда, жизнь в этом месте превратилась в статистическую аномалию. Смотрите в оба — нам нужно отыскать Лазаря."
uw.blackness_lose_blackness_1 = "Ты останешься здесь. На веки вечные. Одна кровь. Навсегда. Я прочту тебя. Я буду насыщаться."
uw.blackness_win_sensei = "Ты солгал нам, учёный муж! Кого мы освободили? На что мы обрекли этот мир? Ты хоть понимаешь, что натворил?!"
