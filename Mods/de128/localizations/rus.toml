uw.RANDOM_AREA_HEALTH_DEGENERATION = "Убывающее в указанной области здоровье."
uw.TRANSIENT_BLEEDING = "Переходящий эффект горения."
uw.Tenebris_greetings_1 = "Ты на границе реальности, путник. Это последний рубеж. Дальше лишь пустота, в которой рождаются миры. И я выковал для них свет и тьму!"
uw.Tenebris_greetings_2 = "Тень, портал за его спиной может быть нашим шансом на спасение. Бессмертные говорили, что разрушат наш мир — не с его ли помощью? "
uw.Tenebris_greetings_3 = "Тебе не выжить в портале! Там неизвестность. Тьма, в которой можно творить миры. Но ты не умеешь творить — лишь разрушать. Портал поглотит тебя!"
uw.Tenebris_greetings_4 = "Мы рискуем, но есть ли другой выход? Войдем в портал и остановим Бессмертных. Или же станем причиной катастрофы?"
uw.Tenebris_loses = "Ты боишься неизвестности, скрытой во тьме? Теперь ты останешься с ней один на один! Мир рассыплется в прах и возродится вновь. По спирали."
uw.Tenebris_wins = "Упертый глупец! Вы, люди, решаете свои проблемы лишь грубой силой. Но вселенная работает не так. За все эти годы ты так ничего и не понял..."
uw.Title_Sitaram = "СИТАРАМ"
uw.War_AfterLoss = "Вставай, марионетка! Дерись! Не важно, выиграешь ты или проиграешь. Сражаясь, ты уже служишь мне!"
uw.War_AfterWin = "Притворщик! Где твоя злость? Как ты можешь биться без нее?! Дерись со мной! Начнем еще один танец лезвий! Я знаю, что война живет в тебе!"
uw.War_Greetings1 = "Какой чудесный день! Я чую битву, она приближается, как буря. Гром — несметные яростные легионы, идущие в ногу. Все они — дары на моем алтаре!"
uw.War_Greetings2 = "Гнев и жажда крови клокочут в ней. Она упивается нескончаемым сражением, но ради чего? Что она найдет на вершине горы из черепов?"
uw.War_Greetings3 = "Разве тебе чужд азарт кровавой бойни? Огонь, страсть, бушующая мощь! Покажи на что ты способен, развлеки меня поединком или умри!"
uw.ZONE_RAID = "Подземелье: Уровень 1"
uw.ZONE_RAID1 = "Подземелье: Уровень 2"
