# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Я вспомнил, чем все закончилось! Вернемся к моей истории?"
sensei.notify.intro = "Этот город будит воспоминания. Я расскажу тебе историю, которая случилась со мной много лет назад..."
sensei.notify.more = "Я вспомнил еще кое-что, вернемся к моей истории?"
sensei.notify.title = "СЭНСЕЙ"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Нет. Ты не спишь. Я остановил время, чтобы забрать Сферу назад в мир Теней. Она здесь по ошибке, ибо Врата Теней в этом мире нестабильны."
sensei.victory.Ancient_zone6_2 = "Грядут перемены, человек. А пока — спи. Когда ты проснешься, никто не вспомнит о твоем подвиге. Так нужно. Однажды ты все поймешь..."
sensei.victory.Butcher_zone3_3 = "Ха! Смотри, Князь пустился наутек! Видел бы ты свое лицо, старик! Понимаешь, твой новый друг — бесхребетный лжец!"
sensei.victory.Butcher_zone3_4 = "Я понимаю, что как только Князь испустит дух, Сегун не даст мне жить. Я — просто инструмент, меня можно заменить. И потому я помогу тебе."
sensei.victory.Butcher_zone3_5 = "Одна женщина внушила Сегуну, что трон принадлежит ему. Она обещала вояке Сферу, что сделает его великим полководцем. В обмен на верность ей."
sensei.victory.Butcher_zone3_6 = "Отправляйся в порт. Сегун ждет прибытия судна. Сфера должна быть на нем. Она — это единственный шанс Князя вернуть себе трон."
sensei.victory.Hermit_zone2_3 = "Пойми, нашему ремеслу конец! Ему нужно меняться, чтобы выжить. Я знаю, как. И Сегун обещал мне защиту в обмен на обучение его людей."
sensei.victory.Hermit_zone2_4 = "Недалеко отсюда живет Мясник и его банда. Это они похитили вас, господин. Идите, желаю вам найти свои ответы."
sensei.victory.NAME_BUTCHER = "МЯСНИК"
sensei.victory.NAME_HERMIT = "ОТШЕЛЬНИК"
sensei.victory.NAME_PRINCE = "КНЯЗЬ"
sensei.victory.NAME_WASP = "ОСА"
sensei.victory.NAME_WIDOW = "ВДОВА"
sensei.victory.OK = "ОК"
sensei.victory.Prince_zone1_1 = "Спасибо! Ты благороден, мало кто вступится за незнакомца. Я уже был готов принять смерть, потому что эти люди не знают милосердия. "
sensei.victory.Prince_zone1_2 = "Я узнал то, что не должен был: мои солдаты обучаются запрещенным практикам у некого Отшельника. И меня хотели убрать как свидетеля... "
sensei.victory.Prince_zone1_3 = "Я собрал людей и направился к нему, чтобы все выяснить, но попал в плен. Правда, удача не отвернулась от меня — и я смог сбежать."
sensei.victory.Prince_zone2_1 = "Моих людей! Ставить его во главе армии было ошибкой... Если у тебя осталась хотя бы капля чести, скажи нам, где лагерь бандитов?"
sensei.victory.Sensei_arc_outro = "Конец."
sensei.victory.Sensei_zone1_1 = "Слишком много совпадений. Кто-то знал о вашем визите и предупредил разбойников. Но причем здесь Отшельник? Мы должны выяснить это. Идем!"
sensei.victory.Sensei_zone2_1 = "Стыдись! Ты продал свою честь с потрохами! И ради чего? Думаешь, люди пойдут за предателем? Какой пример ты подаешь молодым?"
sensei.victory.Sensei_zone3_2 = "Отвечай, почему Сегун хочет его смерти и что за магическая Сфера, о которой ты говорил?!"
sensei.victory.Sensei_zone4_2 = "Нужно остановить Князя, пока он не нашел Вдову. А с ней — и Сферу..."
sensei.victory.Sensei_zone5_1 = "Я сочувствую тебе, правда. Но разбитое сердце — плохой советчик. Пойми, что из-за тебя пострадали люди."
sensei.victory.Sensei_zone6_2 = "Постой! У меня столько вопросов! Кто ты? Что там, за вратами? Я хочу знать..."
sensei.victory.Wasp_zone4_3 = "Стой, я недооценила тебя, старик! Мне заплатили за доставку, но драться за честь Вдовы я не обязана! Я покажу, где она скрывается!"
sensei.victory.Wasp_zone4_4 = "Вдова любила Князя, но тот отверг ее. Она нашла себе новую игрушку — Сегуна. Чертовка использует глупого воеводу, чтобы отомстить."
sensei.victory.Wasp_zone4_5 = "Вдова хочет управлять мужчинами, стравливать их между собой. Сфера же сделает ее избранника великим... и полностью верным ей."
sensei.victory.Widow_zone5_3 = "Для меня нет пути назад. Вижу, ты хочешь помочь, но слишком поздно — Князь забрал Сферу. Сегун пытался защитить ее, но безуспешно."
sensei.victory.Widow_zone5_4 = "Я никогда не видела Князя таким диким. Его глаза горели! Он посчитал забавным казнить предателя на месте нашей первой встречи. Я покажу..."
sensei.victory.characterAncient = "ДРЕВНИЙ"
sensei.victory.characterSensei = "СЭНСЕЙ"
# END Sensei sensei.victory.

