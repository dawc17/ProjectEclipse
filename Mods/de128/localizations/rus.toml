uw.FRAGILITY = "Увеличенная уязвимость в указанной области."
uw.Gatekeeper_greetings_1 = "Странный воздух? Странный воздух! Стррранный воздух!"
uw.Gatekeeper_greetings_2 = "Не рады, не рады, не рады! Натворили, натворили, натворили!"
uw.Gatekeeper_greetings_Assistant_1 = "Тень! Ты наконец-то очнулся!"
uw.Gatekeeper_greetings_Assistant_2 = "Как же здесь холодно! Я уже пальцев не чувствую… Где мы? Воздух какой-то странный."
uw.Gatekeeper_greetings_Assistant_3 = "Но почему мне кажется, что оно нас понимает?"
uw.Gatekeeper_greetings_Sensei = "Назад, Мэй! Мы не знаем, чего оно хочет! Мир Бессмертных потрясло сильнее, чем я думал. После того, что мы натворили, они не рады нашему присутствию."
uw.Gatekeeper_greetings_Sensei_2 = "Спокойно, не делай резких движений. Кажется, это существо не блещет умом."
uw.Gatekeeper_greetings_Sensei_3 = "Сейчас это неважно. Пройти через портал было нашим выбором, и нам за него отвечать. Оно жаждет боя — у нас нет выбора, Тень."
uw.Gatekeeper_lost_Saimon = "Я ожидал большего от портала… Похоже, путешествие истощило твои силы, а молекулярные связи ослабли. Интересно… надо провести ещё несколько тестов."
uw.Gatekeeper_win_Saimon = "Веками этот хлипкий портал напоминал нам о существовании сил, неподвластных нашему пониманию. А потом появился ты…"
uw.HARD_GROUND = "При падении на землю вы получите урон."
uw.HEAD_BERSTUUK = "Маска Берстуука"
uw.HEALTH_DROPS = "Убывающее здоровье."
uw.HOT_GROUND = "Раскаленная земля."
uw.HW20Arkhos1 = "Мне не нужно предвидение, чтобы знать: огонь веры поглотит и слабых, и слепых. Я принёс чёрные свечи, чтобы каждый узрел эту истину так же ясно, как я!"
uw.HW20Fatum1 = "Границы между мирами истончаются — это лучшая ночь для пророчеств! Воздух гудит от магии, а в моих руках сплетаются сами нити судьбы!"
uw.HW20Fatum2 = "Гадание для меня — лишь игра, я могу распоряжаться судьбами смертных как мне угодно. Но вы, друзья мои, — совсем другое дело. Пожалуйста, присаживайтесь!"
uw.HW20Fatum3 = "Твоя ненависть ослепила тебя. Давайте начнём. Ни слова, просто слушайте. Я вижу фигуру… чёрную как ночь… перья и пепел… она берёт меня за руку…"
uw.HW20Fatum4 = "Как… как ты здесь оказалась? Путь в этот мир был закрыт для тебя!"
uw.HW20Megalith1 = "Вы говорили о гаданиях и маскараде, поэтому я принёс волшебное зеркало. Впервые за тысячу лет я вижу своё отражение. В этой маске я выгляжу древним!"
uw.HW20Whisper1 = "Заигралась в пророчества, сестрёнка? Решила распоряжаться судьбами смертных? Такие игрушки всегда принадлежали только мне!"
uw.HW20Whisper2 = "Закрыт, это верно! Но ты позвала, и через это чудесное зеркало пришла я. Я забираю его с собой. Заглядывай в гости, если хочешь услышать настоящее пророчество!"
uw.Hunger_AfterLoss = "Ты ведь избррранный! Я даю тебе последний шанс остаться со мной и пиррровать. Иначе твои кости будут валяться в пыли среди остальных."
uw.Hunger_AfterWin = "Создатель, ты прислал мне пищу, но я не могу насытиться. Мой голод длится целую вечность, подари мне избавление..."
uw.Hunger_Greetings1 = "Ты так долго шел сюда. Зачем? Чтобы спасти неблагодарных смеррртных? Им нет дела до тебя! А я чувствую твое одиночество, голод и стрррах."
uw.Hunger_Greetings2 = "Не обманывайся, Тень! Он только кажется слабым. Ты для него не друг, а добыча. Он разорвет тебя на куски, если приблизишься хоть на шаг!"
uw.Hunger_Greetings3 = "Видишь моих братьев? Их терррзает жажда, но иного рода. Они хотят зрррелищ. Но их голод — лишь жалкое подобие моего!"
uw.INVERTED_JOYSTICK = "Инвертированное управление."
uw.LIGHT_IN_THE_DARK = "Свет во тьме"
uw.MERCENARY_RAID = "ОТРЯД{br}НАЕМНИКОВ"
uw.MERCENARY_RAID_Title = "Отряд наемников"
uw.MiniEventAnnounce = "С незапамятных времён в недрах земли обитает культ, охраняющий чуткий сон богов подземного мира и не позволяющий им проснуться. Но плата за это — жестокая ритуальная битва до последней капли крови."
uw.MiniEventHungerFight_Enter_1 = "Здесь, под землёй, всё иначе. Мы сражаемся за жизнь, а еда — это жизнь! Не лишай свой народ — и мой — этой великой радости!"
uw.MiniEventHungerStory_1 = "Людям есть дело до прихотей духов лишь тогда, когда в их дома приходит беда. Их урожай вянет, дети голодают… И где теперь их вера?"
uw.MiniEventHungerStory_2 = "У голода есть облик. Его жажда поглощения ужасна. Но такова роль Карцера, а наша с тобой задача — не дать ему пробудиться от многовекового сна."
uw.MiniEventHunger_Loss_1 = "Тебя мама не учила доедать всё до конца? Это заметно — в твоих глазах голод! Или… что вообще с тобой такое?"
uw.MiniEventHunger_Win_1 = "Да, бьёшь ты знатно, Тень… Давай отпразднуем твою победу сытной едой! Я угощаю!"
uw.MiniEventStory_1 = "Я вижу, что ты, Тень, силён и непоколебим духом. Легенды о твоих подвигах разошлись повсюду. Хочешь стать частью ещё одной?"
uw.MiniEventStory_2 = "Духи подземного мира капризны. Мы проводим церемонию, чтобы усмирить их нрав, — ритуальные бои! Твоё участие было бы для нас большой честью."
uw.MiniEventStory_EnterBattle = "А ты не слишком ли хлипок для столь тайного зрелища? И вы правда выбрали его? Это и есть человек-легенда? О, духи будут в ярости…"
uw.MiniEventStory_Loss_1 = "Да, ну что ж… Хочется верить, что у духов есть чувство юмора и они лишь посмеются над нашей неуклюжестью на арене, вместо того чтобы обрушить на нас свой гнев…"
uw.MiniEventStory_Win_1 = "Что ж… На эту арену никто не попадает случайно. Ты и правда человек из легенд, Тень."
uw.MiniEventVulkanFight_Enter_1 = "Ведьма пугает тебя без причины. Всё гораздо проще: сталь закаляется в огне! Боги признают только силу и ничего больше. Лишь сила способна вернуть их в вечный сон! В атаку!"
uw.MiniEventVulkanStory_1 = "Очищающий огонь праведен — так говорили наши предки. Но они не знали, что Бессмертным нет дела до человеческой морали. Такова уж их природа."
uw.MiniEventVulkanStory_2 = "Чувствуешь, как жар поднимается из-под земли? Ты должен знать одно: пламя не щадит никого, будь то друг или чужак. И мы стоим прямо на его пути."
uw.MiniEventVulkan_Loss_1 = "Ты должен подняться на ноги, Тень! Разве ты не чувствуешь, как дрожит земля?! Бога утомляет наша возня в пыли…"
uw.MiniEventVulkan_Win_1 = "Здесь жарко, как в адском пламени… Дух огня довольно урчит в своём святилище! Славный бой, Тень! Мы отвоевали себе ещё один день!"
