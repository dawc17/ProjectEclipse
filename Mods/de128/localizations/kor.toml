uw.blackness_enter_blackness_1 = "자손. 거대한 희생. 구체. 정신. 대학살. 나는 느낀다. 넌 피를 흘릴 것이다. 고통이 보인다. 미래가 보인다. 내가 보여주지."
uw.blackness_greeting_blackness_1 = "무슨 일이지, 섀도우? 몸이라도 안 좋은 건가?"
uw.blackness_greeting_lazarus_2 = "사이먼? 이런 개자식 같으니! 왜 여기 사람들을 끌고 온 거야? 놈이 네놈들 생각의 냄새를 맡을 거라고! 어둠이 너희 정신을 맛보기 전에 어서 여기서 도망쳐!"
uw.blackness_greeting_may_1 = "들려요? 아무 소리도 안 나요! 정적뿐이죠. 새소리도 안 들리고, 이곳 전체가 호박 속에 갇혀버린 것 같아요. 우리 제대로 하고 있는 거 맞아요? 기분이 너무 안 좋은데…"
uw.blackness_greeting_saimon_2 = "이 훌륭한 신사분들이 바로 자네의 자유를 향한 티켓이라네, 친애하는 친구. 검은 옷을 입은 저 덩치 큰 친구가 오벨리스크와 문에 어떻게든 연결되어 있지. 그가 널 돕고, 네가 그를 돕는 거야."
uw.blackness_greetingn_saimon_1 = "놀랄 것도 없지. 고대 문의 파편이 이곳에 추락한 이후로, 이곳의 생명체는 통계적인 변칙 그 자체가 되어버렸으니까. 눈 똑바로 뜨게. 우린 라자루스를 찾아야 해."
uw.blackness_lose_blackness_1 = "넌 여기에 남는다. 영원히. 하나의 피. 영원히. 널 읽겠다. 내 먹이로 삼겠다."
uw.blackness_win_sensei = "우릴 속였군, 과학자! 우리가 누굴 풀어준 거지? 이 세상을 무슨 운명에 빠뜨린 거냔 말이다! 네가 무슨 짓을 저질렀는지 깨닫기나 한 거냐?!"
