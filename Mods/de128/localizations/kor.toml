# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "센세이의 이야기 {br} 파트 1. 증인"
sensei.entry.ActScreenSensei2 = "센세이의 이야기 {br} 파트 2. 미래의 그림자"
sensei.entry.ActScreenSensei3 = "센세이의 이야기 {br} 파트 3. 내면의 야수"
sensei.entry.ActScreenSensei4 = "센세이의 이야기 {br} 파트 4. 복수 이야기"
sensei.entry.ActScreenSensei5 = "센세이의 이야기 {br} 파트 5. 굴욕과 모욕"
sensei.entry.ActScreenSensei6 = "센세이의 이야기 {br} 파트 6. 괴물"
sensei.entry.ButcherYoung_Greetings = "그 누구도 감히 내 권위에 도전하지는 못해요! 우리 가족에게 자비란 없죠. 살아서 돌아갈 수는 없을 겁니다!"
sensei.entry.Butcher_zone3_1 = "탕아가 돌아오셨군! 내 제안은 생각 좀 해봤나요, 왕자님? 풀어주는 조건으로 구의 행방을 말해주고, 내게 금을 주는 거 말이에요."
sensei.entry.Butcher_zone3_2 = "그의 침묵이 그 어떤 말보다도 확실히 말해주는 것 같군요, 노인 양반. 난 포악한 내 본성을 받아들여 나 자신에게 솔직하지만, 왕자는 아니죠. 그래도 우리가 당신에게 겸손을 가르쳐주겠어요! 얘들아, 와라!"
sensei.entry.Guard1_Butcher_Sensei = "부쳐는 우리에게 고통이 진실을 보여주는 법을 알려주었죠. 이제 전 자유로워요! 당신들도 행복을 찾을 수 있어요. 거부하지 마세요!"
sensei.entry.Guard1_Hermit_Sensei = "변화가 임박했어요! 전 이 세상의 절반을 여행하며 그걸 깨달았죠. 너무나 큰 희생이 었어요... 마스터의 지혜가 제가 아는 전부죠!"
sensei.entry.Guard1_Lynx_Sensei = "제 문신이 마음에 드세요? 제가 태어난 곳에서는 가장 강한 자가 자신의 업적을 기리면서 이런 문신을 하거든요. 당신도 곧 문신으로 그려드릴게요."
sensei.entry.Guard1_Wasp_Sensei = "점을 믿나요? 난 오늘 당신의 돈을 뺏어 부자가 될 것 같아요. 당신은 운이 좀 따를 것 같나요, 노인 양반?"
sensei.entry.Guard1_Widow_Sensei = "위도우는 내게 자매 같은 존재예요. 위도우의 고통을 느낄 수 있죠. 왕자는 건드리지 못하게 했으니, 당신에게 내 분노를 쏟아붓겠어요!"
sensei.entry.Guard2_Butcher_Sensei = "게임이 시작됐군요! 나한테 철학이란 그냥 얼간이들을 위한 거죠. 난 칼을 좋아하거든요. 나랑 좀 놀아보시겠나요?"
sensei.entry.Guard2_Hermit_Sensei = "마스터는 우리에게 그림자의 세계와 그곳에 누가 사는지, 그리고 곧 우리에게 나눠줄 절망의 힘에 대해 알려줬어요. 제가 이 모든 걸 당신이 뺏어가도록 놔둘까요?"
sensei.entry.Guard2_Lynx_Sensei = "우리 무리는 신들도 추잡하다고 생각하는 일을 하죠. 우리는 문제를 해결하고 다른 이들의 실수를 바로 잡아요. 그런데 당신도 그중 하나인 것 같군요."
sensei.entry.Guard2_Wasp_Sensei = "당신이 우리 선장을 위협하는 건가요? 선장님은 노예였던 날 풀어줬고, 난 선장님께 내 자유를 걸었죠. 저승이 당신을 반갑게 맞아주길..."
sensei.entry.Guard2_Widow_Sensei = "위도우는 정말 공정해요! 사실 난 위도우의 얼굴을 볼 자격도 없었죠... 지금 난 위도우에게 모든 걸 바쳤어요. 내 마지막 숨을 거둘 때까지 위도우의 명예를 지킬 거죠."
sensei.entry.HermitYoung_Greetings = "왕자님은 희생양입니다. 모두의 이익을 위한 제물이죠. 제 학교는 큰 성공을 거두고, 무술의 황금기가 시작될 겁니다!"
sensei.entry.Hermit_zone2_1 = "이러지도 저러지도 못하시겠군요. 제가 배신한 건 사실입니다. 하지만 제 학교의 미래가 달렸기 때문에 선택의 여지가 없었습니다."
sensei.entry.Hermit_zone2_2 = "링스, 이 오만한 녀석은 자기 일도 제대로 못 하는군. 내가 처리해야겠어. 제자들이여, 중앙으로 전진!"
sensei.entry.LynxYoung_Greetings = "그냥 지나갈 수가 없군요. 왕자의 몸값은 이미 받은 거고, 개인적인 감정은 없습니다, 노인 양반."
sensei.entry.Lynx_Sensei_1 = "왕자의 말은 무시하시죠, 노인 양반. 그냥 미친 것뿐이니까. 우리는 그저 왕자 전하가 자해라도 하기 전에 집에 모시고 가려는 겁니다. 도움은 필요 없어요."
sensei.entry.Lynx_Sensei_2 = "정말인가? 내가 보기에는 겁에 질린 남자가 나쁜 놈들에게 둘러싸여 있는 것 같은데. 왕자의 말이 사실인 것 같은 느낌이 드는군. 왕자에게서 물러나게!"
sensei.entry.Lynx_Sensei_3 = "마음대로 하시죠. 입씨름에 낭비할 시간은 없지만, 사람이 하나 더 늘면 그만큼 돈도 늘어나니까. 이들을 잡아라!"
sensei.entry.NAME_BUTCHER = "부쳐"
sensei.entry.NAME_HERMIT = "허밋"
sensei.entry.NAME_LYNX = "링스"
sensei.entry.NAME_PRINCE = "왕자"
sensei.entry.NAME_SHOGUN = "쇼군"
sensei.entry.NAME_WASP = "와스프"
sensei.entry.NAME_WIDOW = "위도우"
sensei.entry.OK = "확인"
sensei.entry.Prince_Intro = "도와주세요! 이 사람들이 절 죽이려고 해요!"
sensei.entry.Prince_zone3_1 = "감히 내 이름을 더럽히다니! 당신... 이 끔찍한 악마 같으니라고! 내가 그대의 이 잔인한 통치에 종지부를 찍어주지!"
sensei.entry.Prince_zone6_1 = "이렇게 오셨군요, 나의 충직한 친구여! 또다시 정의가 구현되었고, 쇼군은 나의 충직한 개가 되었죠. 쇼군의 마음은 내 것이랍니다!"
sensei.entry.Prince_zone6_2 = "노인네도 내 왕좌를 탐하는 건가! 왕좌는 내 운명이라고! 누구도 뺏어갈 수는 없어!"
sensei.entry.Sensei_arc_intro1 = "오래전 난 길을 떠났다가 끔찍한 고통에 빠진 군주를 만나게 됐지..."
sensei.entry.Sensei_zone3_1 = "그러니까 이게 바로 그 \"운\"이 의미하는 건가? 자유를 사고, 백성들을 미친 자들의 손에 넘기고... 그리고 난 그대에게 너무나 친절했소, 왕자."
sensei.entry.Sensei_zone4_1 = "위도우? 그래... 위도우가 구를 쇼군에게 가져가라고 하더군. 직접 갖다 주라고."
sensei.entry.Sensei_zone6_1 = "왕자, 멈추게! 주위를 살펴보라고! 구가 그대의 분노를 빨아들이며 그대를 괴물로 만들고 있다고!"
sensei.entry.Shogun_zone6_1 = "이런, 약골이군요! 당신은 우리 군주의 광대도 상대할 수 없을 겁니다. 내가 한 방에 박살 내주죠!"
sensei.entry.TITLE_PRINCE_EVIL = "저주받은 왕자"
sensei.entry.WaspYoung_Greetings = "아버지에게 뭐라고 해야 하죠? 본인 딸이 늙은이와의 싸움에서 맥도 못 췄다고요? 내가 해적 왕좌의 후계자인 한 그런 일은 있을 수 없죠!"
sensei.entry.Wasp_zone4_1 = "구를 가져오라고 위도우가 보냈나요? 이런 일을 하기에는 너무 나이가 많은 거 아닌가요? 아, 제 알 바는 아니죠. 배에 타세요."
sensei.entry.Wasp_zone4_2 = "근데 문제는 구가 제게 없다는 거예요. 위도우의 부하들이 어제 가져갔거든요. 당신이 누군지는 모르겠지만, 거짓말은 용서할 수 없죠. 이자에게 따끔한 맛을 보여줘라!"
sensei.entry.WidowYoung_Greetings = "왕자는 내 감정을 거부하고 비웃으며 내게 모욕을 줬어요. 이제 내가 복수할 차례죠. 당신이 왕자의 친구니까, 그에게 이 메시지를 전해요..."
sensei.entry.Widow_zone5_1 = "왕자가 그랬던 것처럼 내게 굴욕을 안겨주려고 온 건가요? 남자들이란 모두 똑같군요..."
sensei.entry.Widow_zone5_2 = "왕자가 당신이 얼마나 친절하고 명예롭고, 품위 있는지 말했어요. 하지만 난 남자의 말은 믿지 않죠. 모두 고통받아야 해요!"
sensei.entry.Zone2_SenseiReminder = "지난 번에는 내가 살인자들에게서 왕자를 구한 이야기를 했었지. 난 허밋이 비밀리에 병사들을 훈련시킨 걸 알았지. 그래, 거기서부터 시작해야겠군."
sensei.entry.Zone3_SenseiReminder = "허밋은 왕자의 장군인 쇼군이 왕자를 배신하고, 부쳐에게 돈을 주고 납치를 사주했다고 말했지. 이제 그 도적을 만나 봐야겠군."
sensei.entry.Zone4_SenseiReminder = "왕자는 한 여인 때문에 곤경에 처한 거였다네! 그 여자는 지금 근처 부두에 있는 마법 구를 사용해 왕자를 끌어내리려는 계획을 세웠지..."
sensei.entry.Zone5_SenseiReminder = "그 여자 해적은 내게 위도우와 왕자의 복잡한 이야기를 들려주었다네. 난 구는 손에 넣지 못했지만, 왕자가 위도우를 찾아 산으로 갔다는 건 알아냈지."
sensei.entry.Zone6_SenseiReminder = "마법의 구가 왕자를 미치게 했지! 절망의 힘을 주었거든... 우리 모두를 파괴할 수 있을 정도였지! 그냥 지켜보고만 있을 수는 없었다네."
sensei.entry.characterSensei = "센세이"
sensei.entry.character_Asian = "로토스"
sensei.entry.character_Blind = "어민"
sensei.entry.character_Fanatic = "레이저"
sensei.entry.character_Indean = "쿠거"
sensei.entry.character_Philosopher = "클레릭"
sensei.entry.character_Pirate = "해적"
sensei.entry.character_Ronin = "하빈저"
sensei.entry.character_Sadist = "토먼트"
sensei.entry.character_Savage = "스파크"
sensei.entry.character_Sister = "아스트라"
sensei.entry.dlgStoryBtnFight = "결투"
# END Sensei sensei.entry.

# BEGIN Sensei sensei.notify.
sensei.notify.ending = "아직 마지막 이야기를 하지 못했는데, 다시 이야기로 돌아가겠나?"
sensei.notify.intro = "이 도시를 보니 옛 기억이 떠오르는군. 그대에게 오래전에 있었던 이야기를 들려주지..."
sensei.notify.more = "아직 할 얘기가 더 있는데, 다시 이야기로 돌아가겠나?"
sensei.notify.title = "센세이"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "꿈이 아니라네. 내가 구를 그림자로 되돌리려고 시간을 멈췄지. 구가 이곳에 있는 건 불안정한 그림자의 문으로 빚어진 실수라네."
sensei.victory.Ancient_zone6_2 = "변화가 찾아올 걸세. 이제 잠을 자게. 그리고 일어나면 자네의 일은 아무도 기억하지 못할 거지. 그래야 한다네. 언젠가 자네가 이해하게 되면..."
sensei.victory.Butcher_zone3_3 = "흐흐! 왕자가 도망치는 모습 좀 봐요! 당황했군요, 노인 양반. 당신의 새 친구는 나약한 거짓말쟁이일 뿐이에요!"
sensei.victory.Butcher_zone3_4 = "왕자가 마지막 숨을 거두면, 쇼군은 당장 날 없애버릴 거죠. 잘못 생각했어요, 난 그저 소모품일 뿐인데. 그러니 당신을 도울게요."
sensei.victory.Butcher_zone3_5 = "어떤 여인이 쇼군에게 왕좌는 당연히 그의 것이라고 말했어요. 쇼군이 그 구를 갖고, 위대한 장군이 될 거라 장담했죠. 다 그 여자의 손에 놀아나서 그런 거예요."
sensei.victory.Butcher_zone3_6 = "항구로 가세요. 쇼군이 구를 실은 배가 오길 기다리고 있어요. 왕자가 왕좌를 되찾을 마지막 기회죠."
sensei.victory.Hermit_zone2_3 = "생각해 보십시오. 우리의 무술은 한계가 있습니다! 살아남으려면 변화가 필요하고, 제가 그 방법을 알고 있죠. 그리고 쇼군은 그의 부하들을 훈련시키는 조건으로 보호를 약속했습니다."
sensei.victory.Hermit_zone2_4 = "부쳐는 여기서 멀지 않은 곳에 일당과 함께 있습니다. 그놈들이 왕자님을 납치한 거죠. 가서 원하는 답을 찾길 바라겠습니다."
sensei.victory.NAME_BUTCHER = "부쳐"
sensei.victory.NAME_HERMIT = "허밋"
sensei.victory.NAME_PRINCE = "왕자"
sensei.victory.NAME_WASP = "와스프"
sensei.victory.NAME_WIDOW = "위도우"
sensei.victory.OK = "확인"
sensei.victory.Prince_zone1_1 = "감사합니다! 품격을 모르는 놈들에게 맞설 수 있는 몇 안 되는 고귀하신 분이군요. 사실 전 그 무자비한 놈들 손에 죽을 거라고 생각했거든요."
sensei.victory.Prince_zone1_2 = "전 의도치 않게 제 병사들이 허밋 밑에서 금지된 무술을 배우고 있다는 걸 알게 되었습니다. 그래서 그 장면을 목격한 절 없애려 하는 거죠..."
sensei.victory.Prince_zone1_3 = "전 상황을 바로 잡으려고 병사들을 데리고 허밋을 찾아갔지만, 오히려 포로로 잡히고 말았어요. 하지만 운 좋게 탈출할 수 있었습니다."
sensei.victory.Prince_zone2_1 = "이런! 그를 우리 부대의 지휘관으로 앉힌 건 실수였어요... 당신에게 아직 최소한의 명예라도 남아있다면, 그 도적의 근거지를 말해요!"
sensei.victory.Sensei_arc_outro = "未完待續……"
sensei.victory.Sensei_zone1_1 = "우연이 너무 많군. 누군가가 우리가 오는 걸 알고 도적에게 경고를 한 거지. 하지만 허밋은 무슨 관련이 있는 걸까? 그걸 알아내야 하네. 가세!"
sensei.victory.Sensei_zone2_1 = "부끄러운 줄 알아야지! 그렇게 명예를 팔아넘기다니! 그리고 무엇을 위한다고? 사람들이 반역자의 말을 따를 거라고 생각하는 건가? 이게 젊은이들에게 좋은 본보기가 될 거라고 생각하는 거야?"
sensei.victory.Sensei_zone3_2 = "대답하게, 쇼군이 왕자를 죽이려는 이유는 뭐고, 자네가 말한 마법 구는 뭐지?"
sensei.victory.Sensei_zone4_2 = "왕자가 위도우와... 구를 찾지 못하게 해야 하네..."
sensei.victory.Sensei_zone5_1 = "그대를 이해하네. 진심으로... 하지만 상처받은 마음은 잘못된 판단으로 이어지기 쉽지. 그대 때문에 고통 받고 있는 사람들이 있다는 걸 잊지 말게."
sensei.victory.Sensei_zone6_2 = "잠깐만요! 물어볼 게 많아요! 당신은 누구죠? 문 뒤에는 뭐가 있는 거죠? 알고 싶어요..."
sensei.victory.Wasp_zone4_3 = "잠깐만요, 알겠다고요! 내가 돈을 받고 전달하긴 했지만, 위도우의 명예를 위해 싸울 생각은 없어요. 위도우의 은신처를 알려드리죠!"
sensei.victory.Wasp_zone4_4 = "위도우는 왕자를 사랑했지만, 왕자가 거절했어요. 그러다 쇼군이라는 새 장난감을 찾은 거죠. 그 쭈그렁 할망구는 멍청한 장군을 이용해 복수를 하는 거예요."
sensei.victory.Wasp_zone4_5 = "위도우는 사람들을 지배하고, 한 명씩 갖고 놀고 싶어 하죠. 그 구만 있으면 엄청난 힘을 얻어... 그녀에게 완전히 복종하게 되거든요."
sensei.victory.Widow_zone5_3 = "날 되돌릴 방법은 없어요. 날 도와주고 싶은 것 같지만, 너무 늦었죠. 왕자가 이미 구를 가져갔거든요. 쇼군이 막으려 했지만, 헛수고였죠."
sensei.victory.Widow_zone5_4 = "그렇게... 거친 왕자의 모습은 처음이었어요. 눈에서 광기가 흘렀죠! 우리가 처음 만난 곳에서 반역자를 처단하는 게 재미있다고 생각했나봐요. 제가 안내해 드릴게요..."
sensei.victory.characterAncient = "고대인"
sensei.victory.characterSensei = "센세이"
# END Sensei sensei.victory.

