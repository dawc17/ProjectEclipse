uw.Gatekeeper_greetings_1 = "이상한 공기? 이상한 공기! 이-상-한-공-기!"
uw.Gatekeeper_greetings_2 = "달가워하지 않아, 달가워하지 않아, 달가워하지 않아! 우리가 한 짓, 우리가 한 짓, 우리가 한 짓!"
uw.Gatekeeper_greetings_Assistant_1 = "섀도우! 드디어 깨어났구나!"
uw.Gatekeeper_greetings_Assistant_2 = "여긴 너무 추워! 벌써 손가락 감각이 없어… 우리 어디 있는 거지? 공기가 너무 이상해."
uw.Gatekeeper_greetings_Assistant_3 = "하지만 왜 우리 말을 이해하고 있다는 기분이 드는 걸까요?"
uw.Gatekeeper_greetings_Sensei = "물러서라, 메이! 저 녀석이 뭘 원하는지 모른다! 불멸자들의 세계가 내 생각보다 더 크게 흔들렸어. 우리가 한 짓 때문에 그들은 우리가 여기 있는 걸 달가워하지 않아."
uw.Gatekeeper_greetings_Sensei_2 = "진정해라, 갑작스러운 움직임은 삼가고. 이 피조물은 그다지 지능이 높아 보이지 않는구나."
uw.Gatekeeper_greetings_Sensei_3 = "그건 지금 중요하지 않다. 포탈을 통과한 건 우리의 선택이었고, 그에 대한 책임을 져야 해. 녀석은 싸움을 원한다. 선택의 여지가 없군, 섀도우."
uw.Gatekeeper_lost_Saimon = "포탈에 더 많은 기대를 걸었는데… 이 여정으로 자네 체력이 고갈되었고 분자 결합이 약해진 것 같군. 흥미로워… 몇 가지 테스트를 더 해봐야겠어."
uw.Gatekeeper_win_Saimon = "수 세기 동안 이 낡은 포탈은 우리의 이해를 넘어서는 힘이 존재한다는 걸 상기시켜 줬지. 그리고 자네가 나타난 거야…"
uw.HARD_GROUND = "땅에 쓰러질 때 피해를 받습니다."
uw.HEAD_BERSTUUK = "베르스투크의 마스크"
uw.HEALTH_DROPS = "시간에 따라 체력 감소"
uw.HOT_GROUND = "뜨거운 지면"
uw.HW20Arkhos1 = "연약한 자와 눈먼 자 모두 신앙의 불꽃에 휩싸이게 될 거라는 사실은 예지력 없이도 알 수 있지. 모두가 이 진실을 나처럼 선명하게 볼 수 있도록 검은 양초를 가져왔소!"
uw.HW20Fatum1 = "세계 간의 경계가 옅어지고 있어… 오늘은 예언을 위한 최고의 밤이야! 대기에 마법의 기운이 윙윙거리고, 내 손안에 운명의 실타래가 감겨 있지!"
uw.HW20Fatum2 = "나에게 점술은 게임과 같아. 필멸자들의 운명을 내 맘대로 주무를 수 있으니까. 하지만 내 친구들, 너희들은 완전히 다른 문제야. 자, 어서 앉아!"
uw.HW20Fatum3 = "당신은 증오에 눈이 멀었어. 시작하자. 말하지 말고, 들어. 어떤 형상이 보여… 밤처럼 까맣고… 깃털과 재… 내 손을 잡고…"
uw.HW20Fatum4 = "어떻게… 어떻게 여기에 온 거야? 이 세계로 통하는 길은 네게 닫혀있을 텐데!"
uw.HW20Megalith1 = "네가 점술과 가장무도회를 이야기하길래, 마법의 거울을 가져왔어. 천 년 만에 처음으로 내 모습을 볼 수 있게 되었지. 이 가면을 쓰니 정말 늙어 보이는군!"
uw.HW20Whisper1 = "예언 놀이를 하고 있었니, 여동생아? 필멸자의 운명을 짊어지고서? 그런 장난감은 항상 내 차지였는데 말이야!"
uw.HW20Whisper2 = "닫혀있었지! 하지만 네가 불렀고, 이 경이로운 거울을 통해 내가 온 거야. 이건 내가 가져가마. 꼭 날 찾아오렴, 진짜 운명을 들려줄 테니!"
uw.Hunger_AfterLoss = "네가선택 된자라고 하니, 마지막으 로한번의 기회를 더주겠다. 나와함께 연회를즐기자. 그러지 않으면네 뼈또한가루가 된다른자 들과같은 운명을 맞으리라."
uw.Hunger_AfterWin = "창조주여, 내게 자양물을 보내 주었구나. 하지만 이걸로는 부족하다. 내 굶주림은 영원하니, 날 구원해 다오..."
uw.Hunger_Greetings1 = "아주먼길 을돌아여 기까지 왔구나. 왜지? 감사할 줄모르는 필멸자들을 구하려고? 그것들은네게 아무런관 심도없다! 네외로움과 굶주림, 그리고... 공포가 아주 잘 느껴지는구나."
uw.Hunger_Greetings2 = "섀도우, 속지마라! 그는 약해보일뿐이다. 넌그의 친구가아니야. 그저 먹잇감일뿐. 더 가까이 다가가면 조각조각 찢어발길것이다!"
uw.Hunger_Greetings3 = "내 형제들이 보이나? 그들은지 금목이마 르다. 그리고그 들이느끼는갈 증은조금 다른종류의 것이다. 여흥을갈 망하고있지. 하지만내굶주림과 비교하면 아무것도 아니야!"
uw.INVERTED_JOYSTICK = "반대 움직임"
uw.LIGHT_IN_THE_DARK = "어둠 속 빛"
uw.MERCENARY_RAID = "용병{br}부대"
uw.MERCENARY_RAID_Title = "용병 부대"
uw.MiniEventAnnounce = "아주 먼 옛날부터 지구 깊숙한 곳에 이교도가 거주하며, 지하 세계 신들의 조심스러운 잠을 지켜보고 그들이 깨어나지 않도록 막아왔습니다. 하지만 그 대가는 마지막 피 한 방울까지 흘려야 하는 잔혹한 의식의 전투입니다."
uw.MiniEventHungerFight_Enter_1 = "여기 지하에서는 모든 것이 달라. 우리는 살기 위해 싸우고, 밥버러지는 생명 그 자체지! 네 사람들에게서, 아니 내 사람들에게서 이 큰 기쁨을 앗아가지 말라고!"
uw.MiniEventHungerStory_1 = "사람들은 집에 우환이 닥쳐야만 정령들의 변덕에 신경을 쓰지. 농작물은 시들고, 아이들은 굶주리고… 그런데 지금 그들의 신앙은 어디로 간 거지?"
uw.MiniEventHungerStory_2 = "굶주림에는 형체가 있어. 먹어 치우려는 그 갈증은 끔찍할 정도지. 하지만 그건 카르서의 역할이고, 자네와 내 역할은 그가 수백 년의 깊은 잠에서 깨어나지 못하게 막는 거라네."
uw.MiniEventHunger_Loss_1 = "접시에 음식을 남기지 말라고 어머니께 배우지 못했나 보군? 다 티가 나지. 네 눈에 굶주림이 서려 있잖아! 아니면… 대체 뭐가 문제인 거냐?"
uw.MiniEventHunger_Win_1 = "그래, 타격이 아주 좋군, 섀도우… 든든한 식사로 자네의 승리를 축하하세! 내가 쏘지!"
uw.MiniEventStory_1 = "섀도우, 자네가 강인하고 흔들림 없는 정신을 가졌다는 걸 알겠네. 자네의 업적에 대한 전설 널리 퍼져있지. 또 다른 전설의 일부가 되어 보지 않겠나?"
uw.MiniEventStory_2 = "지하 세계의 정령들은 제멋대로라네. 우리는 그들의 성미를 달래기 위해 의식을 치르지. 바로 의식의 전투 말일세! 자네가 참여해 준다면 우리에겐 큰 영광이 될 거야."
uw.MiniEventStory_EnterBattle = "이런 신비로운 구경거리 치고는 네가 너무 병약한 거 아니냐? 정말 이 녀석을 선택한 거야? 이게 그 전설적인 사내라고? 오, 정령들이 분노하겠군…"
uw.MiniEventStory_Loss_1 = "그래, 뭐… 정령들에게도 유머 감각이라는 게 있어서, 우리에게 분노를 쏟아내기보다는 투기장에서 벌어지는 우리의 어설픈 짓을 보고 그저 웃어넘겨 주기를 바랄 뿐이네…"
uw.MiniEventStory_Win_1 = "흠… 우연히 이 투기장에 오게 되는 자는 아무도 없다네. 자네는 진정 전설 속의 사내가 맞군, 섀도우."
uw.MiniEventVulkanFight_Enter_1 = "저 마녀가 아무 이유 없이 널 겁주고 있구나. 사실은 훨씬 더 단순해. 강철은 불 속에서 단련되는 법이지! 신들은 오직 힘만을 이해할 뿐이야. 오직 힘만이 그들을 다시 잠재울 수 있어! 공격!"
uw.MiniEventVulkanStory_1 = "정화의 불꽃은 정의롭다… 우리 조상들은 그렇게 말했지. 하지만 그들은 불멸자들이 인간의 도덕 따위엔 신경 쓰지 않는다는 사실을 몰랐어. 그저 그들의 본성일 뿐이지."
uw.MiniEventVulkanStory_2 = "땅 밑에서 열기가 피어오르는 게 느껴지나? 네가 알아야 할 것이 하나 있어. 불꽃은 친구든 이방인이든 아무도 살려두지 않는다는 사실. 그리고 우리는 지금 정확히 그 길목에 서 있지."
uw.MiniEventVulkan_Loss_1 = "다시 일어나야 해, 섀도우! 땅이 흔들리는 게 느껴지지 않아?! 신은 우리가 먼지투성이가 되어 허우적대는 꼴에 넌더리를 내고 있어…"
uw.MiniEventVulkan_Win_1 = "여긴 지옥불처럼 뜨겁군… 불의 정령이 자기 금고 안에서 만족스러운 듯 으르렁거리고 있어! 정말 훌륭한 전투였네, 섀도우! 우리가 또 하루를 벌었어!"
