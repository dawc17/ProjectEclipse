uw.dlgAmericanEvent22Story_May_1 = "꽁꽁 얼어붙었어요, 사부님! 문밖에서 저렇게 폭풍우가 몰아치는데 이 아이를 내쫓을 순 없어요…"
uw.dlgAmericanEvent22Story_Puma_1 = "곤경에 처했어, 영감님… 내 종족의 과거가 내 발목을 잡을 줄은 생각도 못 했지만, 결국 이렇게 됐어. 그래서 그들을 보호하려고 도망친 거야. 제발 내 말 좀 끝까지 들어줘!"
uw.dlgAmericanEvent22Story_Puma_2 = "너희도 저 소리 들려? 내가 어릴 적에, 한 주술사가 파도를 일으키고 나뭇잎을 찢어버리는 울음소리를 내는 정령에 대해 말해 준 적이 있어. 난 그 옛날이야기가 진짜일 줄은 꿈에도 몰랐어!"
uw.dlgAmericanEvent22Story_Puma_3 = "놈이 우릴 쫓아 이쪽으로 오고 있어. 우리가 숨이 막혀 쓰러질 때까지 비명을 지르며 말이야… 그저 재미로 말이지! 더 이상 숨을 곳이 없어…"
uw.dlgAmericanEvent22Story_Sensei_1 = "내 처소의 문은 고통받는 자라면 누구에게나 열려 있네. 하지만 이런 곳에서 해적을 보게 될 줄은 몰랐군… 자네의 그 흉악한 무리는 어디 있나, 퓨마?"
uw.dlgAmericanEvent22Story_Sensei_2 = "주술사들의 신화는 비유에 불과하네. 사람들은 바람을 길들이기 위해 돛을 발명했고, 그 이후로 돛은 그들에게 훌륭한 도움이 되었지. 넌 그저 어리석은 동화일 뿐이야. 그리고 섀도우가 그것을 증명할 테고!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "나는 늑대 바람이다! 나를 마주하는 자는 누구든 촛불처럼 꺼지게 될 것이다! 그리고 조만간 네놈의 문을 부수고 말 테다. 그건 시간문제지!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "나뭇잎이 잔해를 덮을 때까지 계속 울부짖어 주마. 그 누구도 이곳으로 오는 길을 찾지 못할 것이다! 대담하지만 어리석군… 네깟 필멸자가 어떻게 대자연에 맞서 싸우겠다는 거지?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "이 무슨 수치인가… 네가 내 강력한 목소리를 앗아갔구나! 하지만 계집애야, 너의 믿음이 날 다시 살려낼 것이다… 그리고 난 혼자 오지 않을 것이다! 우리는 수가 아주 많거든!"
uw.dlgArkhosGreetings = "맹목적 인광신도여! 나를기억해라. 네아버지 에대한믿음 이내게힘 을주는구나. 부모란엄 격하기마 련이지. 내벌을달게 받아라..."
uw.dlgArkhosLost = "내삶의마 지막에누 구에게빌 어야할 까? 오창조주여, 왜저를버 리시나이까? 제게이들 을이끌힘 을주셨 지만또실패 했습니다...."
uw.dlgArkhosStory1 = "이 런종류를잘알죠. 거짓말에능 한자들을모으죠. 도발적인 설교를듣지 마세요. 그게바로 주무기니 까요."
uw.dlgArkhosStory2 = "틀렸어, 늙은이. 내겐말썽꾸러기 를위한강한무 기도있지. 네가너희 편에서길 바랄거다... 하지만내고집은 쉽게꺾 이지않지.."
uw.dlgArkhosWin = "망나니같으니, 넌내편이 될만한자 격이없어. 사라져!창 조주에게인간들 이어떻게 다시실패 했는지 알려주겠다. 그럼, 내자식들 에게먹이 를주실거다."
uw.dlgBerstuuk_Announce = "금지된 지식을 찾아 헤매던 재능 있는 과학자가 신이 되기 위해 과학과 마법을 융합시켰습니다. 변이는 피할 수 없습니다! 이제 숲은 그의 악몽 같은 실험실이 되었고 인간들은 그의 사냥감입니다. 오직 당신만이 이 무시무시한 변이를 막을 수 있습니다! 두려움을 떨쳐내고 덤불 한가운데로 모험을 떠나 거짓 우상을 찾으세요!"
uw.dlgBerstuuk_Loose_1 = "네가 내 문 앞에 왔을 때, 넌 말없이 모든 걸 말해줬지! 아무것도 남지 않을 때까지 이 지식을 얇은 실처럼 뽑아낼 테다!"
uw.dlgBerstuuk_Story_1 = "밖에 슬라이가 헛간 문을 두드리고 있어… 밤의 숲에서 많은 걸 봤지만, 이런 건 또 처음이네! 쟤 대체 왜 저러지?"
uw.dlgBerstuuk_Story_10 = "아직 멀었지. 과학은 예측할 수 없어. 날 봐! 점차 난 숲을 받아들였지만, 숲은 나를 계속 거부했어. 지금까지는 말이지."
uw.dlgBerstuuk_Story_2 = "도움을 구하는 자에게는 올바른 문으로 가는 길이 열리는 법. 하지만 슬라이는 길을 잃은 모양이군… 이 교활한 영감탱이, 손 조심해! 무슨 일이 있었던 거지?"
uw.dlgBerstuuk_Story_3 = "그 악당이 도움을 구하더니만, 제대로 찾아왔군. 놈이 정당한 자기 몫을 빼앗아 가기 전에 숲으로 가자. 사람들의 목숨 말이야!"
uw.dlgBerstuuk_Story_4 = "'사람들'? 가엾게도 충격에 빠져있잖아. 얼굴도 없어! 무엇이 그를 저렇게 겁주었기에 갑작스럽게 양심의 위기를 맞은 걸까?"
uw.dlgBerstuuk_Story_5 = "새들이 노래하는 소리 들려? 지금쯤이면 짹짹거려야 정상인데, 여기엔 죽은 듯한 침묵뿐이야… 이 숲에 또 뭐가 도사리고 있는 거지?"
uw.dlgBerstuuk_Story_6 = "죽은 듯한 침묵. 죽은 듯한 침묵. 사람들이 도움이 필요해. 도-와-야-해. 지금 당장 도와!"
uw.dlgBerstuuk_Story_7 = "맙소사! 사람들은 아무리 겁에 질려도 마른 나뭇가지와 이끼로 변하지는 않는다고! 저건 대체 뭐고, 진짜 슬라이는 어디 있는 거지?!"
uw.dlgBerstuuk_Story_8 = "이 근처 어딘가에 있을 거다. 슬라이의 알량한 지식은 큰 도움이 되었지. 녀석이 네 특수한 힘에 대해 말해 줬거든, 섀도우. 번쩍하고 영감이 떠오르더군!"
uw.dlgBerstuuk_Story_9 = "그럼 네가 그 피조물이 말했던 녀석이군? 숲이 찾아와서 거둬갈 거다. '정당하게' 사람들의 목숨을 몇 개나 앗아간 거지, 이 미치광이 녀석?"
uw.dlgBerstuuk_Win_1 = "자연은 길을 찾을 것이다! 우리 전투는 네가 아는 것보다 더 많은 걸 말해줬지, 섀도우. 숲은 기억할 것이다. 다시 부활하기 위해 날 집어삼킬 테니…"
uw.dlgFatumGreetings = "어리석게 도용감하 구나. 네가올줄알았다. 넌나의숙 명이고난 너의숙명 이니까. 네운명을영 원히바꾸어 주겠다."
uw.dlgFatumLost = "난인간을알지. 같은행동 을계속반 복하지. 많이봐왔거든. 스스로파 괴하며시 들어가지. 아무것도 그걸바꾸 지못해. 네운명도 정해져있어."
uw.dlgFatumStory1 = "조심해요, 영웅님. 이처럼깊 은곳에선 익숙한 보편적인법 칙이통하지 않아요..."
uw.dlgFatumStory2 = "그래! 꼬마를 잘 묶어둬. 난 네 운명에 대해 훤히 알고 있지. 네가 누구이며 어디로 가는지 말이야. 결국 누가 죽게 될지 알려줄까?"
uw.dlgFatumWin = "네숙명을 받아들여. 내영토에 들어선순 간넌이미 한번졌어. 내운명을 다시쓸용 기가있나?"
uw.dlgFungusGreetings = "너희가 땅을 더럽혀서 이제 버섯들이 죽어가고 있다. 너희 정신을 흡수해서 우리도 인간이 될 것이다. 그러면 너희는 끝장이야!"
uw.dlgFungusLost = "형제들이 신 놀이에 정신을 팔렸어요. 숭배로 약해진 거야. 하지만 파괴는 인간의 천성이지. 인간이 없으면 세계는 더 좋은 곳이 될 거야."
uw.dlgFungusWin = "썩 꺼져! 얼마 남지 않은 가녀린 목숨을 즐겨라!"
uw.dlgHW21LosePuppeteer_1 = "대사가 없는 단역조차 너한테는 맡기지 않을 거다, 섀도우. 무대는 네가 있을 곳이 아니야. 내 예술을 모독하지 마라!"
uw.dlgHW21StoryArkhos_1 = "역병이 너희 마을을 덮칠 것이다, 필멸자여! 너희 신의 권능 앞에 엎드려라! 황금빛 광채로 눈을 즐겁게 하라, 그렇지 않으면…"
uw.dlgHW21StoryPuppeteer_1 = "너희들이 예술에 대해 뭘 안다고! 내 최고의 대작을 망쳐버렸어! 그럼에도 불구하고… 제3막이 다가오고 있다. 그리고 거기서 영웅은 마지막 숨을 거두게 되지!"
uw.dlgHW21StorySensei_1 = "언제부터 지하 세계의 신들이 평범한 사람들에게 돈을 갈취하러 이곳까지 올라왔지? 가면을 벗어라, 사기꾼. 우리가 무기를 들기 전에!"
uw.dlgHW21StorySensei_2 = "연극은 영감을 줘야지, 공포를 줘선 안 되네. 그리고 자넨 예술의 본질 그 자체를 왜곡했어. 자네의 '배우들'이 다치기 전에 우리가 막겠네."
uw.dlgHW21StoryThief_1 = "잠깐만요! 저예요… 슬라이! 때리지 마세요! 그가 모두가 날 두려워할 거라고 약속했단 말이에요… 그리고 아무도 날 못 알아볼 거라고요. 대체 내가 어떻게 들킨 거지?"
uw.dlgHW21StoryThief_2 = "유랑 극단의 주인, 인형술사였어요. 그는 이게 자신의 최고 공연이 될 거라고 했죠. 사람들 사이의 신! 나한테는 아무 의미도 없었지만, 돈은 얘기가 다르잖아요…"
uw.dlgHW21WinPuppeteer_1 = "완전한 대실패야! 내 완벽한 플롯을 망치고 내 가면을 부숴버렸어! 소품도 없이 이제 연극을 어떻게 무대에 올리란 말인가…"
uw.dlgHW22EnterArchitect = "네놈의 이 판타지 이야기는 진이 다 빠지는군… 이제 내 규칙대로 놀아보자고. 나를 놀라게 하는 게 너한테도 좋을 거다, 섀도우…"
uw.dlgHW22LooseArchitect_1 = "예상했던 대로군. 난 네 모든 움직임을 알고 있어, 섀도우. 결국 널 만든 건 나니까 말이야. 그땐 내 컨디션이 안 좋았을지도 모르지… 하지만 넌 새로운 삶이 맘에 들 거다."
uw.dlgHW22StoryArchitect_1 = "그게 바로 '클리셰'라는 거야, 인형술사. 극작가들이 무슨 돈을 받고 일하는 줄 알아? 상징의 개수 때문일까? 영웅이라는 설정처럼 미쳐버린 천재의 헛소리 따위도 이제 진부해졌어…"
uw.dlgHW22StoryArchitect_2 = "바로 그거야. 우리는 네 세계를 처음부터 다시 쓸 거다! 현대적이고, 창의적이고, 의미 있게 말이야! 요즘 십 대들은 뭐에 관심이 있지? 왜 아무 말도 안 하는 거냐, 섀도우? 오, 그렇군…"
uw.dlgHW22StoryPuppeteer_1 = "노크 소리가 들려. 문에서 들려오는 예상치 못한 노크 소리! 찾아온 여행자일까, 아니면 다른 무언가일까? 흥미롭지 않나?"
uw.dlgHW22StoryPuppeteer_2 = "그렇게 말할 줄 알았지, 영감. 만들어진 캐릭터들에게 뭘 더 바라겠어? 종이는 무엇이든 견뎌내지만… 관객은 결코 그렇지 않지!"
uw.dlgHW22StoryPuppeteer_3 = "나는 그저 무대의 노예일 뿐이야, 그게 다지. 그리고 내 새로운 걸작은 창조주와의 만남, 즉 예정설과 자유 의지의 고뇌에 대해 이야기하게 될 거야…"
uw.dlgHW22StorySensei_1 = "자네가 무슨 꿍꿍이를 꾸몄든, 인형술사, 우리는 더 이상 자네의 장단에 놀아나지 않을 거네. 예술이 고통을 유발할 수는 있지만, 자네가 하는 그런 방식은 아니야."
uw.dlgHW22StorySensei_2 = "자네는 연기에 너무 몰입한 나머지 이제 현실과 환상을 구분하지도 못하는군, 광대여… 자넨 미쳤어."
uw.dlgHW22StorySensei_3 = "자네의 말은 참으로 기이하고 걱정스럽군, 이방인… 자네 머릿속에 무슨 미친 생각이 맴도는지는 모르겠지만, 섀도우가 그것들을 모두 박살 내 줄 거네."
uw.dlgHW22WinArchitect_1 = "어쩌면 창조물은 더 이상 창조주의 것이 아니라 독자적인 삶을 살아가게 된 건지도 모르지… 날 놀라게 했군. 다음엔 이야기가 어떻게 전개될지 보고 싶어."
uw.dlgHoaxenGreetings = "당신의 일생은 모두 환상이에요. 우리가 창조한 거예요. 다른 사람들이 잔인한 힘에 의존하는 동안 당신을 미치게 할 거예요. 불, 물, 질병 – 하!"
uw.dlgHoaxenLost = "형, 어디에 있죠? 더 이상 형의 목소리가 들리지 않아요! 혼자 갇혀있는 것이 불이나 검보다 더 끔찍해요… 어서 가요, 모자란 사람들. 아버지가 기다리고 있어요."
uw.dlgHoaxenStory1 = "\"우리라고요\"? 새도우님, 우리의적이 그의 머리에서도망친것 같군요. 실례합니다만, 어떤 인격이랑 이야기하고 있는거죠? 아마도 당신의 \"형\"이 더 이성적일까요?"
uw.dlgHoaxenStory2 = "인간에겐 우리가 우습겠죠? 형이 말하길 당신의 영혼을 영원한 고통을 받는 심연으로 보내야 한다고 했어요… 그러면 피 한 방울 흘리지 않고 세계가 무릎을 꿇겠죠."
uw.dlgHoaxenWin = "제가 무한히 자비로운 존재가 아니었다면 당신을 벌써 죽였을 거예요. 하지만 제 형은 저처럼 자비롭지 않죠. 가도 좋아요. 하지만 끝까지 유머를 잊지 않기를 빌어요."
uw.dlgHunter_enter_hunter_1 = "너! 이봐, 너어어어! 네가 시이이작한 걸 끝내러 왔구나, 그렇지? 너? 너에게서 어떤 힘이 느껴져. 나에게 마아아알을 거는군. 조용! 아니면 내가 그으으렇게 만들어 주마!"
uw.dlgHunter_greeting_may_1 = "저기 봐요! 수정 안에 뭔가가 있어요… 원래 저런 건가요?"
uw.dlgHunter_greeting_saimon_1 = "이상하군… 라자루스가 오벨리스크를 먼지로 만들어버릴 줄 알았는데. 대학살이 일어날까 두려웠지만, 자네와 나 둘만 남은 것 같네. 흥미로워."
uw.dlgHunter_greeting_saimon_2 = "집중의 전당이라네. 중앙에 있는 저 수정이 보이나? 저게 바로 오벨리스크가 그림자 에너지를 모으는 방식이지. 말하자면 어둠의 심장인 셈이야."
uw.dlgHunter_greeting_sensei_1 = "침묵은 불길한 징조지, 내 이성적인 친구여. 침묵은 세상에서 가장 귀청이 터질 듯한 말보다 더 크게 말할 수 있네. 흠… 여긴 어디지? 이 기괴한 장소는 대체 뭐란 말인가?"
uw.dlgHunter_greeting_sensei_2 = "아닐 게다, 얘야… 예전에 내가 마지막으로 봤을 때랑은 사뭇 다르게 생겼구나. 영감이 옳았던 것 같다는 생각이 드는군…"
uw.dlgHunter_loose_hunter_1 = "누워어어어. 널 영원히 이곳에 남겨어어어 두겠다. 더 이사아아앙 해를 끼치지 마."
uw.dlgHunter_win_hunter_1 = "멈춰라, 섀도우 인간! 퍼어어어지게 두어선 안 돼! 너도 그느느느놈처럼 되에에엘 거다. 넌 속으으을 거야! 하지만 아직 기회에에에는 있어."
uw.dlgIE21AnnounceAssistant_1 = "대체 저 녀석은 누구야? 우리 세계에서 뭘 하고 있는 거지, 그리고 왜 우리가 네 말을 들어야 하는 건데?"
uw.dlgIE21AnnounceAssistant_2 = "하! 어디서 굴러먹다 온 놈인지는 모르겠지만, 여기에 오래 있진 못할걸!"
uw.dlgIE21AnnounceAssistant_3 = "이봐, 섀도우, 저 불량배가 도를 넘었어! 우리가 예절 좀 가르쳐 주자고!"
uw.dlgIE21AnnounceBoss_1 = "가련한 필멸자 놈들! 내 의지와 영광 앞에 엎드려라, 아니면 강제로 무릎 꿇게 만들어 주마!"
uw.dlgIE21AnnounceBoss_2 = "감히 내게 그런 식으로 지껄이다니! 나는 세 세계의 정복자, 라바나님이시다!"
uw.dlgIE21AnnounceBoss_3 = "무릎을 꿇을 마지막 기회다. 거절한다면 네 머리통을 날려버리겠다!"
uw.dlgIE21AnnounceSensei_1 = "섀도우, 정체 모를 위협이 다가오는 것이 느껴지네. 사악한 무언가가 또다시 우리 세계로 침투했어."
uw.dlgIE21Boss_After_Loose = "이 세계 사람들이 전부 이렇게 나약하다면, 이곳을 정복하는 건 시간문제겠군!"
uw.dlgIE21Boss_After_Win = "멍청한 놈들! 지금은 후퇴하지만, 날 그렇게 쉽게 이기진 못할 것이다. 반드시 돌아오마!"
uw.dlgIndia22Story_May_1 = "그래서 굶주리게 된 거군요… 그 악마는 즐거운 축제에서 대체 무얼 원했던 걸까요? 소박한 농부들이 어떻게 그런 포식자를 끌어들인 걸까요?"
uw.dlgIndia22Story_Rakshasa_1 = "흥미로운 냄새가 나는군, 인간. 필시 맛도 아주 좋을 테지! 내 배가 요동치는 소리가 들리느냐? 내 밥과 곁들여 먹을 최고급 고기로 안성맞춤이겠어!"
uw.dlgIndia22Story_Rakshasa_Lose = "운 좋은 줄 알아라. 너와 싸우느라 지쳐버렸거든. 게다가 내 허기도 채워졌고… 지금은 말이지. 다시 식욕을 돋우고 사냥에 나서주마!"
uw.dlgIndia22Story_Sensei_1 = "그에 대해 말해보게, 여행자여. 옷차림을 보아하니 먼 길을 온 듯하군. 집에 무슨 우환이 생겼는가?"
uw.dlgIndia22Story_Sensei_2 = "식욕을 억누르거라, 악마여! 생명 그 자체를 훔치는 자에게 생명의 축제를 위한 초대장은 없다!"
uw.dlgIndia22Story_Sensei_Win = "정원을 꽃피우는 건 마법이 아니라 고된 노동이다. 그리고 네가 직접 그것을 증명하게 될 것이다. 이웃 농부들의 농장 복구를 돕지 않으면, 가만두지 않겠다…"
uw.dlgIndia22Story_Sitaram_1 = "당신의 일대기는 익히 들었습니다. 신들께서 당신의 공로에 합당한 보상을 내리시길! 나쁜 소식이 있습니다. 제 고향 땅에 악령이 나타났습니다…"
uw.dlgIndia22Story_Sitaram_2 = "이 악마의 사악함은 그 끔찍한 식욕에 비할 바가 아닙니다! 보하그 비후 축제를 준비하고 있었는데, 갑자기 이… 괴물이 나타나 우리 묘목을 모조리 먹어 치웠습니다!"
uw.dlgIndia22Story_Sitaram_3 = "아그니 신을 걸고 맹세컨대, 아가씨, 저 역시 같은 의문입니다! 이제 우린 두려움 속에서 해가 지기만을 기다리고 있습니다… 제발, 저와 함께 가주십시오!"
uw.dlgIndia24_Enter_Puppet_1 = "너에게 운명을 이끌 정신력이 있느냐? 예술의 비천한 하인인 내 운명을 결정해라. 전투에서만이 진정 무엇이 무엇인지 이해할 수 있는 법. 대담해져라, 섀도우. 공격해!"
uw.dlgIndia24_Story_Dandy_1 = "문 열어! 안 그러면 이 빌어먹을 문을 부숴버릴 테니까! 집에 있는 거 다 알아. 소리가 다 들린다고! 날 숨겨주지 않으면 이 오두막을 잿더미로 만들어 주마!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "오, 필멸자들은 어찌 이리 생명에 집착하는지. 이 일을 선택한 건 내가 아니고, 난 이 일에 독기 어린 눈물 따윈 흘리지 않아… 왜 나에게 이런 짓을 한 거지?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "그녀의 마음은 사랑으로 가득 차 있어. 신들은 우릴 순수하게 창조하지만, 길을 선택하는 건 우리 자신이지. 느리티유는 소녀의 이야기를 들으며 이것을 깨닫기 시작했어."
uw.dlgIndia24_Story_Loose_Puppet_3 = "섀도우, 너의 연기는 열정과 헌신이 부족해. 내가 다시 기회를 주마. 연기하지 말고, 직접 살아보라고!"
uw.dlgIndia24_Story_Puppet_1 = "똑똑! 이봐, 오랜 친구들! 운명의 목소리가 우리에게 닿았고, 그녀가 오고 있어! 그녀의 붉은 치맛단이 저물어가는 하루의 끝에 놓인 삶처럼 타오르고 있지!"
uw.dlgIndia24_Story_Puppet_2 = "그녀가 찾아온 것이 당신의 영혼을 가져가기 위함일까? 세상만큼이나 오래된 이야기를 들어보라. 목숨을 거두는 자가 될 운명을 타고난 느리티유의 전설을."
uw.dlgIndia24_Story_Puppet_3 = "유령들이 다 떠들고 있네. 쟤네 말은 믿을 게 못 돼. 게다가 그들이 전할 이야기도 아니고. 내가 그녀의 눈을 통해 진실을 보여주지. 섀도우, 이해할 수 있는 건 오직 너뿐이야."
uw.dlgIndia24_Story_Sensei_1 = "저 목소리는… 우리의 옛 적수가 다시 무슨 짓을 꾸미는 모양이군. 이번엔 누가 희생양이 될까? 한 남자가 탑을 향해 달려가는 게 보이는군…"
uw.dlgIndia24_Story_Sensei_2 = "옷이 오물과 그을음으로 덮여 있군, 이방인. 게다가 자네 말투가 참으로 불쾌하네. 당신이 누구고 우리 집 앞에 무슨 용무로 왔는지 설명하게!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "물러서! 난 이런 걸 원치 않았어! 가족들은 날 무서워했고, 난 이게 기회라고 생각했지… 내가 돕기만 한다면 댄디가 날 데려가 주겠다고 약속했단 말이야…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "자! 그럴 자격은 없지만 넌 영원한 잠에 빠질 것이다. 하지만 널 심판하는 건 내 몫이 아니지. 그건 다른 이의 소명이야. 난 그저 호위꾼일 뿐이니까."
uw.dlgIndia24_Story_Win_Puppet_4 = "너처럼 말이야, 섀도우. 난 네가 느리티유의 길을 따르길 바라. 그녀가 자신의 자리를 이해하는 데는 영겁의 시간이 걸렸지."
uw.dlgIndia24_Story_Win_Puppet_6 = "쇼는 계속된다! 섀도우, 네가 주인공이고 내 배우들은 조연이 될 것이다. 느리티유의 이야기는 우리 최고의 대작이 될 거야!"
uw.dlgIndia24_Story_Win_Sensei_1 = "이 이야기는 자네가 한 것치고도 꽤 깊이가 있군. 놀랐어! 하지만 여기서 얻을 수 있는 교훈이 뭔가? 왜 이걸 우리에게 보여주는 거지?"
uw.dlgMegalithGreetings = "이 광산은 성지다. 왜 여기에 있지? 어서 명예롭게 운명을 받아들여라. 발 밑에서 흔들리는 지구를 마지막으로 듣게 될테니."
uw.dlgMegalithLost = "이런! 또 다시 수천 년을 기다려야 한다고? 대륙을 움직였어! 지구를 정화하는 게 내 임무야!"
uw.dlgMegalithWin = "이터널로서는 드물게 인간을 친절하게 대했어. 여러 차례 도움을 주었지. 어서 사랑하는 인간들에게 마지막 작별 인사를 전해라!"
uw.dlgRaidIntro1 = "실수를 바로잡고 싶나요? 관문이 열렸어요. 하지만 이터널만 새도우 전염을 제거할 수 있어요. 우리 같은 약골은 할 수 없어요."
uw.dlgRaidIntro2 = "다른 사람처럼 당신도 죽을 거예요. 마그마가 정맥을 흐르고 있어요. 땅을 모두 뒤덮고 새로운 생명을 위한 터전을 마련할 거에요."
uw.dlgRaidStory1 = "이 지하 저장고는 뭐죠? 여기서 무얼 하고 있는 거죠?"
uw.dlgRaidStory2 = "여기는 이터널 도메인의 휴게실이에요. 여기서 천 년의 잠을 자고 있었는데 새도우의 관문이 세계를 위험에 빠트렸어요. 이터널이 깨났어요."
uw.dlgRaidStory3 = "좋아요. 관문을 빨리 쉽게 처리하는 데 도움을 줄 거예요!"
uw.dlgRaidStory4 = "아니에요. 관문을 부수고 온 인류를 파괴할 거예요. 이터널에게 단지 또 다른 파괴와 창조의 순환일 뿐이에요."
uw.dlgShurale_Announce = "탐욕스러운 도적들에게 깨어난 숲의 정령이 무고한 자들에게 복수를 감행합니다. 이 피조물은 자신의 고대 마법이 담긴 도둑맞은 기억의 상자를 찾고 있습니다. 진정한 슬픔을 품은 자만이 피조물의 분노를 가라앉힐 수 있습니다. 하지만 그 대가는 몹시 클 것입니다…"
uw.dlgStoryBtnFight = "결투"
uw.dlgStoryBtnMore = "더 보기"
uw.dlgVolcanoGreetings = "모든 이터널 중에 내가 제일 먼저 일어났다. 내 손에 많은 전사들이 죽을 거야. 임무를 완수해야지."
uw.dlgVolcanoLost = "그만해! 인정할게. 하지만 이건 알아둬라. 네가 내 형제를 깨웠어. 하지만 외모에 속지 마라. 빠르고 치명적이니까!"
uw.dlgVolcanoStory1 = "무너진 집과 거대한 조각상을 봤어요. 여기 사람이 살고 있나요?"
uw.dlgVolcanoStory2 = "광신도만 있어요. 살 거라는 희망을 안고 이터널을 숭배하고 있어요. 아주 맹목적이죠. 우리가 실패하면 곧 진실을 알게 될 거예요."
uw.dlgVolcanoWin = "지구의 운명을 결정하는 것이 내 의무라고 신도들에게 말했지. 불신자들은 보아라. 화염이 땅을 뒤덮는 것을!"
uw.dlgVortexGreetings = "어둠의 물이 지구와 새도우의 관문을 휩쓸 것이다! 심연으로 비밀이 사라질 거야. 그리고 이것을 말해 줄 사람이 아무도 남아있지 않게 될 것이다!"
uw.dlgVortexLost = "수천 년 만에 처음으로 인간이 이겼어. 살려는 의지가 매우 강하구나! 하지만 아무리 발버둥쳐도 결말은 같을 거야. 넌 죽을 거야."
uw.dlgVortexWin = "수천 년 동안 인간이 시들어가는 것을 보았다. 어떤 아름다움이 있더군. 너희를 살려두는 것이 좋겠어. 재미로 말이야."
uw.dlgWhisperGreetings = "누군가 자신의 운명을 알고 싶어 안달이 났나 보군. 내게 손을 주고 거울을 응시해라!"
uw.dlgWhisperLost = "아직 살아있다고? 그렇다면 넌 아직 내 손아귀에 들어오지 않은 거구나! 파툼이 네 운명을 점칠 것이다. 난 내 세계로 돌아가마… 거울을 조심하라는 경고를 남긴 채 말이야!"
uw.dlgWhisperWin = "재와 영혼, 영원한 밤의 세계로 널 데려가 주마! 날 믿어라. 내 눈을 바라보고 절대 시선을 피하지 마."
uw.dlg_American_25_Loose_1 = "네가 누굴 보호하고 있는지 모르는군, 섀도우. 놈들은 네게 감사하지 않아. 네 등 뒤에서 비웃기만 할 뿐이지. 야만인들… 그런데 내가 괴물이라고?"
uw.dlg_American_25_Story_1 = "메이가 사라졌어. 인간이 아닌 무언가에게 끌려갔지. 하지만 비명도, 반항한 흔적도 없었어… 마치 제 발로 걸어 나간 것처럼 말이야."
uw.dlg_American_25_Story_2 = "우리만 겪은 일이 아니야. 메이처럼 젊고 강한 사람들도 사라졌어. 그녀는 이런 일이 일어날 걸 예감하고… 주머니에 화약을 채워 넣었지."
uw.dlg_American_25_Story_3 = "흔적이 뚜렷해. 비가 오기 전에 그녀를 찾아야만 해. 안 그러면 영영 흔적을 잃어버리고 말 거야. 가자, 섀도우!"
uw.dlg_American_25_Story_4 = "네 녀석이 이 저주받은 땅에 발을 들이는 순간부터 냄새를 맡았다. 왜 온 거지? 내 슬픔을 짓밟으러 왔나? 놈들처럼 너에게도 명예라곤 없군."
uw.dlg_American_25_Story_5 = "네가 나타날 줄 알았다, 주술사. 아이들은 가족에게, 우리 친구는 우리에게 돌려보내라. 그리고 네 녀석의 잿더미 산으로 돌아가 썩어버려."
uw.dlg_American_25_Story_6 = "재는 재로. 그리고 너도 재로 돌아갈 것이다, 필멸자여…"
uw.dlg_American_25_Win_1 = "잠깐! 난 내 의지로 그와 함께 갔어. 그의 모습은 짐승 같지만… 마음은 인간이야. 그리고 고통받고 있어… 놈들이 그의 아이를 훔쳐 갔어!"
uw.dlg_CHN_NY25_Announce = "과거 영웅의 이야기에 빠져들어 진실과 신화를 구별하고, 새로운 전설을 빚어내세요! 위대한 영웅의 이름을 빌려 끔찍한 만행을 저지르는 미스터리한 이교도에 맞서 싸우세요! 모든 것이 시작된 곳으로 돌아가, 도망자 악당이 진정한 영웅심을 깨닫도록 도와주세요!"
uw.dlg_CHN_NY25_Loose_1 = "안 돼, 계속 싸워야 해! 평범한 농부가 그 사악한 이교도를 이렇게 쉽게 물리쳤다고는 아무도 믿지 않을 거야. 전력을 다해!"
uw.dlg_CHN_NY25_Story_1 = "태양교에는 1년에 한 번 위대한 영웅이 태어난 곳을 방문하는 전통이 있어. 하지만 그때마다 재앙이 뒤따르지…"
uw.dlg_CHN_NY25_Story_2 = "그가 인간으로 태어났다고? 흥미롭군. 이 사람들은 마을에 선물을 가져온 것 같지는 않아 보이는데…"
uw.dlg_CHN_NY25_Story_3 = "놈들은 무엇 하나 가만두질 않아! 마을 사람들의 가축을 훔치고, 술에 취해 난동을 부리며 농작물을 망치고, 창문을 부수고 싸움을 건다고!"
uw.dlg_CHN_NY25_Story_4 = "하지만 마을 사람들은 왜 맞서 싸우지 않는 거지? 이곳은 그들의 땅이자 그들의 전설이잖아!"
uw.dlg_CHN_NY25_Story_5 = "그들은 무너졌어. 희망을 주었던 영웅은 사라졌고, 이교도들은 그의 이름으로 악행을 저지르고 있지. 우리가 그들에게 다시 희망을 줘야 해!"
uw.dlg_CHN_NY25_Story_6 = "'명절' 준비가 다 되었는지 확인하러 왔다고 해. 그럼 우리가 싸울 테니! 마을 사람들도 이교도에 맞설 수 있다는 걸 보게 될 거야!"
uw.dlg_CHN_NY25_Story_7 = "좋아, 네 뜻대로 하지… 그럼 역할에 몰입해 볼까. '어이, 애송이! 감히 우리 영웅의 옷을 입다니! 썩 꺼져라, 우린 잔치를 준비해야 한다!'"
uw.dlg_CHN_NY25_Story_8 = "난 전설의 영웅은 아니지만, 그의 영혼은 이 땅에 살아 숨 쉬고 있어! 가장 어두운 순간에 나를 이끌고 용기를 줄 거야! 공격!"
uw.dlg_CHN_NY25_Win_1 = "일개 인간에게서 이런 속도가 나올 줄이야… 우리 챔피언을 거의 이길 뻔했군! 다른 놈들이 딴생각을 품지 못하도록 널 본보기로 삼아주마…"
uw.dlg_NY25_Loose_1 = "네 기억은 선명하고, 슬픔은 이성보다 더 크게 말하는구나. 넌 나와 함께 이곳에 남게 될 거다. 잠시 쉬어라… 곧 잠이 찾아올 테니."
uw.dlg_NY25_Story_1 = "환영합니다! 이 오두막은 예전에 우리 가족이 살던 곳이죠. 추억이 정말 많아요… 머물고 싶은 만큼 머물다 가세요. 휴식에 필요한 건 다 있으니까요."
uw.dlg_NY25_Story_2 = "하지만 넌 우리를 수없이 위험에 빠뜨렸잖아. 그런데 이제 와서 너희 가족의 집을 내어준다고? 무슨 꿍꿍이지?"
uw.dlg_NY25_Story_3 = "그냥 양심의 가책을 느꼈을 뿐이야! 그동안 다른 사람들의 호의를 너무 오랫동안 이용했다는 걸 깨달았거든. 이제는 좋은 일을 하고 싶어."
uw.dlg_NY25_Story_4 = "우리만 있는 게 아니야… 오두막 앞에 사람들이 모여 있어. 이 늦은 시간에 무얼 원하는 걸까? 우리보고 나오라고 부르고 있네."
uw.dlg_NY25_Story_5 = "안 돼! 환영들이 널 파괴할 거야! 저들은 고통스러운 기억의 유령일 뿐이야. 숲의 정령이 자기 상자를 찾으러 온 거라고! 우리가 되찾아 주자!"
uw.dlg_NY25_Story_6 = "상자라고? 숲에서 사람들이 사라졌던 이유가 그거였군! 왜 우릴 배신한 거지, 슬라이? 네가 말했어도 우린 이 고귀한 임무를 기꺼이 도왔을 텐데!"
uw.dlg_NY25_Story_7 = "너흰 몰라. 그녀의 목소리를 듣는 순간 난 통제력을 잃고… 나 역시 사라져 버릴 거야. 내가 그녀의 조각을 품고 있는 한 말이지."
uw.dlg_NY25_Story_8 = "문 열어주세요, 아빠. 밖은 너무 추워요. 집도 차갑고, 전 집 안에 없잖아요. 우리가 다시 함께할 수 있는 곳을 보여줄게요."
uw.dlg_NY25_Story_9 = "멈춰! 숲으로 가지 마. 길을 잃고 말 거야! 네가 듣는 목소리가 누구의 것인지는 모르겠지만, 확실히 인간의 것은 아니라고!"
uw.dlg_NY25_Win_1 = "정신 차려, 슬라이! 정령이 약해진 틈을 타 상자를 돌려줘야 해. 인간이 스스로의 탐욕을 극복할 수 있다는 것을 보여주라고."
uw.saturn_enter_saturn_1 = "네 녀석이 뱉은 말을 그대로 목구멍에 쑤셔 넣어 주지. 그리고 네 친구들은 그걸 지켜보게 될 거야. 내 감옥에서 나갈 유일한 방법은 단두대뿐이다. 누가 먼저 갈래?"
uw.saturn_greeting_saimon_1 = "우리의 통치자 패트리아크는 수년간 포탈을 연구했지. 그러던 어느 날, 그는 자기 자신 안으로 틀어박혔어. 이후 오벨리스크를 세웠고, 그게 우리 세계에 어떤 영향을 미쳤지…"
uw.saturn_greeting_saimon_2 = "섀도우는 분자 수준에서 오벨리스크와 유사하다네. 오벨리스크를 패트리아크에게 맞서 사용할 수 있게 도와줄 자가 있지. 그게 우리가 여기, 새턴의 방에 있는 이유야…"
uw.saturn_greeting_saimon_3 = "정말 죄송합니다, 부인. 그럼에도 우리는 라자루스를 풀어줘야만 합니다. 부디 그의 감방으로 안내해 주십시오. 더 이상 귀찮게 하지 않겠습니다."
uw.saturn_greeting_saturn_1 = "멀리 가니, 꼬맹이들아? 내 감옥에 제 발로 찾아오다니! 이게 용기인지 멍청함인지 궁금하군. 거기 껑충한 녀석, 대답해 봐!"
uw.saturn_greetingn_May_1 = "근데 그게 우리랑 무슨 상관인데요?"
uw.saturn_lose_saturn_1 = "그걸로 충분하다. 라자루스가 너희 같은 쓰레기들과 어울린다면 패트리아크에게는 아무런 위협도 되지 않지. 여기서 썩 꺼져라, 꼬맹이들! 너흰 내 명단에 없다."
uw.saturn_win_saturn_1 = "라자루스는 절대 못 찾을 거다. 그 악당 녀석은 내 감옥에서 빠져나가 늪지대로 도망쳤으니까. 너희도 죽고 싶나? 그럼 그 녀석 뒤나 쫓아가 보시지!"
uw.summerfest25_story2_1 = "이런, 이런… 날 찾으려고 안달이 났길래 호의를 좀 베풀어 봤지. 게다가 모두가 이 순간을 기다리고 있었잖아."
uw.summerfest25_story2_2 = "'모두'라고? 연기 집어치워. 네가 누군지, 다른 사람들의 불행을 즐기기 위해 어떻게 사람들을 이용하는지 우린 정확히 알고 있으니까."
uw.summerfest25_story2_3 = "잠깐 카메오로 출연했을 뿐인데, 빵 떴네. 트렌드에 올랐잖아! 솔직히 내가 이렇게 인기가 많을 줄은 몰랐는데."
uw.summerfest25_story2_4 = "그런 말장난으로는 살아남지 못할 거다. 내 눈을 멀게 한 짓, 그리고 네가 저지른 모든 악행에 대한 대가를 치러야 할 테니까. 신 행세를 하던 너의 그 뒤틀린 게임은 여기서 끝이다!"
uw.summerfest25_story2_5 = "진심이야, 어민? 그런 말투는 폴더폰 시절에나 어울리는 거라고. 지금은 2026년이야, 시대의 흐름에 발 좀 맞춰 보시지."
uw.summerfest25_story2_6 = "아키텍트가 무슨 계획을 꾸미든… 그의 주변에는 어둠이 맴돌아. 거의 손에 잡힐 듯 끔찍한 악의 기운이 말이야."
uw.summerfest25_story2_7 = "그가 말을 할 때마다 어민의 이야기가 사실이라는 확신이 든다. 아키텍트는 위험한 존재야… 반드시 막아야 해."
uw.summerfest25_story2_defeat_1 = "오, 이런… 실망스럽군! 관객들은 더 많은 걸 기대했는데 말이야. 다음번엔 판돈을 더 올려야겠어."
uw.summerfest25_story2_win_1 = "세상은 왜 이리 잔인한가? 왜 우리는 고통받아야만 하지? 난 왜 내 눈을 멀게 해야 했나? 대답해라, 아키텍트. 왜 살아가는 것이 이토록 고통스러운 거지!?"
uw.tutorial_ascention_intro_title = "인형술사"
