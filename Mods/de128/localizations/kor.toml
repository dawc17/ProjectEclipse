uw.Tenebris_greetings_1 = "그대는 현실의 가장자리에 있다, 여행자여. 이곳이 마지막 변경이지. 이 선을 넘어서면 텅 비어 있는 공이 있을 뿐이다. 세계들이 태어나는 곳이지. 그리고 그 세계들의 빛과 어둠을 만든 것이 바로 나다!"
uw.Tenebris_greetings_2 = "섀도우여, 그의 뒤에 있는 차원문이 우리에겐 하나뿐인 기회일지도 모른다. 불멸자들은 우리 세계를 파괴하겠다고 말했지. 그들이 차원문을 사용하려 하는 걸까?"
uw.Tenebris_greetings_3 = "차원문에 들어가면 살아남지 못할 것이다! 그곳은 미지의 영역이다. 세계들을 만들어 내는 어둠이지. 그러나 그대는 만들 수가 없고, 오로지 파괴할 뿐이다. 차원문이 그대를 통째로 삼켜 버릴 것이다!"
uw.Tenebris_greetings_4 = "위험하지만 달리 방법이 있는가? 우리가 차원문에 들어가면 불멸자들을 막을 수 있을지도 모르지. 하지만 반대로 대재앙을 부를 수도 있다."
uw.Tenebris_loses = "어둠 속에 도사리고 있는 미지의 존재가 두려운가? 이제 혼자 상대해야 하겠구나! 세계는 먼지가 되어 무너지고 다시 태어난다. 끊임없는 나선을 그리며..."
uw.Tenebris_wins = "고집스럽고 어리석긴! 너희 인간들은 문제가 생기면 무식하게 힘으로만 해결하려 하지. 하지만 우주가 늘 그렇게 돌아가진 않아. 그 오랜 세월이 흘렀는데도 전혀 배운 것이 없구나..."
uw.Title_Sitaram = "시타람"
uw.War_AfterLoss = "일어나라, 꼭두각시야! 그리고 싸워라! 이기든 지든 상관없다. 싸울 때는 어차피 날 섬겨야 할 테니까!"
uw.War_AfterWin = "이 사기꾼 녀석! 네 분노는 어디 있느냐? 분노 없이 어떻게 싸울 수 있지? 날 상대해라! 또 한 번 칼춤을 추어 보자! 네 안에 전쟁이 꿈틀거리고 있음을 난 알고 있다!"
uw.War_Greetings1 = "정말 화창한 날이군! 전투가 다가오는 것이 느껴진다. 폭풍 같은 전투, 천둥 같은 전투가. 알려지지 않은 군단의 분노가 따라오고 있어. 모두 내 제단에 바칠 제물이 되리라!"
uw.War_Greetings2 = "그 여자 안에서는 분노와 피를 향한 갈증이 끓어오른다. 끝없는 전투에 기쁨을 느끼지만 무엇을 위한 것일까? 두개골로 쌓은 산꼭대기에서 뭘 찾을 수 있을까?"
uw.War_Greetings3 = "피투성이 전투의 희열이 네게는 그렇게 낯선 일인가? 불과 열정, 격정적인 힘 말이다! 네 힘을 보여 봐라! 단 한 번의 전투에서 내 장난감이 되거나, 그러지 못하면 죽어라!"
