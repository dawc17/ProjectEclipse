# BEGIN Sensei sensei.defeat.
sensei.defeat.OK = "확인"
sensei.defeat.Sensei_defeat1 = "아니, 잠깐... 이런 게 아니었는데... 이 늙은이의 건망증을 용서해주게."
sensei.defeat.Sensei_defeat2 = "달랐던 것 같은데... 기억은 헷갈릴 수 있거든."
sensei.defeat.Sensei_defeat3 = "이렇게 대결이 끝난 것 같지는 않은데... 다시 기억을 더듬어 보지..."
sensei.defeat.Sensei_defeat4 = "기억이 흐릿해서... 내가 그 싸움에서 이겼던 것 같은데."
sensei.defeat.Sensei_defeat5 = "아니, 이게 아니었다네. 내가 이긴 다음... 음, 그랬던 것 같다네."
sensei.defeat.characterSensei = "센세이"
