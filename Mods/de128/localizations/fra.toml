uw.TRANSIENT_BLEEDING = "Embrasement collectif"
uw.Tenebris_greetings_1 = "Vous êtes arrivé aux confins de la réalité, voyageur. L'ultime frontière. Par delà ce lieu, n'existe que le néant... Un néant nébuleux d'où jaillissent les mondes... dont je forge la lumière et les ténèbres !"
uw.Tenebris_greetings_2 = "Ombre, le portail qui se trouve derrière lui est peut-être notre seule chance de salut. Les Immortels ont dit qu'ils détruiraient notre monde. Peut-être ont-ils l'intention d'utiliser le portail ?"
uw.Tenebris_greetings_3 = "Le portail vous précipitera dans des ténèbres tentaculaires... des ténèbres qui engendrent des mondes. Mais vous ne savez point créer. Vous n'êtes capable que de destruction. Le portail vous dévorera !"
uw.Tenebris_greetings_4 = "C'est un risque, mais nous n'avons pas le choix ! Nous devons empêcher les Immortels de se frayer un chemin jusqu'au portail... mais en agissant ainsi, nous risquons de déclencher une catastrophe."
uw.Tenebris_loses = "Craignez-vous les ténèbres ? À présent, vous devrez leur faire face sans aide aucune ! Le monde sombre dans le néant et renaît de ses cendres... ad vitam æternam !"
uw.Tenebris_wins = "Vous êtes tout aussi imbéciles que bornés ! Vous autres, humains, ne connaissez que la force brute... mais l'univers ne fonctionne pas ainsi. Après toutes ces années, vous n'avez donc rien appris ?..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Relevez-vous, pantin... et battez-vous ! Qu'importe que vous gagniez ou perdiez. Lorsque vous combattrez, vous servirez ma cause !"
uw.War_AfterWin = "Où est donc votre furie ? Comment se battre sans elle ? Affrontez-moi ! Que la danse des lames débute ! Je perçois la rage en votre for intérieur !"
uw.War_Greetings1 = "Quelle belle journée ! Une bataille approche, telle une tempête. La furie des légions gronde et nourrit la puissance que recèle mon sanctuaire !"
uw.War_Greetings2 = "La fureur fait rage en son sein. Elle se délecte de batailles sans fin, mais pourquoi ? Qu'espère-t-elle trouver au sommet de sa montagne de crânes ?"
uw.War_Greetings3 = "Le frisson de la bataille vous est-il inconnu ? Feu, passion et puissance impétueuse ! Régalez-moi lors d'un combat solo... ou périssez !"
uw.ZONE_RAID = "Monde Souterrain : Palier 1"
uw.ZONE_RAID1 = "Monde Souterrain : Palier 2"
uw.ZONE_RAID2 = "Monde Souterrain : Palier 3"
uw.ZONE_RAID3 = "Monde Souterrain : Palier 4"
