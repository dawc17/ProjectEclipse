# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Je me rappelle la manière dont les choses se sont terminées, veux-tu que je continue mon histoire ?"
sensei.notify.intro = "Cette ville a éveillé certains souvenirs... Je vais te raconter une histoire qui m'est arrivée il y a fort longtemps..."
sensei.notify.more = "Un autre souvenir me vient, veux-tu que je continue mon histoire ?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Tu ne rêves pas. J'ai interrompu le flux temporel pour renvoyer la sphère dans les ténèbres. Sa présence ici-bas était le fruit vénéneux de l'instabilité des Portes des Ombres."
sensei.victory.Ancient_zone6_2 = "Des changements se profilent à l'horizon, humain. Pour le moment, dors. À ton réveil, nul ne se souviendra de tes exploits. Il doit en être ainsi. Un jour, tu comprendras..."
sensei.victory.Butcher_zone3_3 = "Héhé ! Regardez le Prince qui prend ses jambes à son cou ! T'aurais dû voir ta tête, vieillard ! Comme tu peux t'en rendre compte, ton nouvel ami est un menteur et un poltron !"
sensei.victory.Butcher_zone3_4 = "Je sais pertinemment qu'une fois le Prince mort, Shogun me fera passer de vie à trépas. À ses yeux, je ne suis qu'un simple outil. Au diable ! Je t'aiderai !"
sensei.victory.Butcher_zone3_5 = "Une femme a convaincu Shogun que le trône lui revenait de droit. Elle a promis de lui confier la sphère et de faire de lui un grand seigneur s'il devenait son vassal."
sensei.victory.Butcher_zone3_6 = "Allez au port. Shogun y attend un navire qui transporte la sphère. C'est la dernière chance pour le Prince de reconquérir son trône !"
sensei.victory.Hermit_zone2_3 = "Comprenez que notre art est moribond ! Sans coup de pied dans la fourmilière, il ne survivra pas... Et Shogun a promis de me protéger si j'entraînais ses hommes."
sensei.victory.Hermit_zone2_4 = "Boucher et son gang ont élu domicile non loin d'ici. Ce sont eux qui vous ont enlevé, sire... Partez... J'espère que vous trouverez réponse à vos questions."
sensei.victory.NAME_BUTCHER = "BOUCHER"
sensei.victory.NAME_HERMIT = "ERMITE"
sensei.victory.NAME_PRINCE = "PRINCE"
sensei.victory.NAME_WASP = "GUEPE"
sensei.victory.NAME_WIDOW = "WIDOW"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Merci ! Rares sont les nobles bienfaiteurs qui se battent pour autrui. J'ai bien cru que mon heure avait sonné... Ces malandrins ne connaissent aucune pitié."
sensei.victory.Prince_zone1_2 = "Quand j'ai appris qu'un Ermite inculquait à mes soldats les secrets ancestraux de quelque art interdit, on a voulu me faire disparaître..."
sensei.victory.Prince_zone1_3 = "Accompagné d'une escouade, je me suis rendu chez cet individu impie pour clarifier la situation, mais j'ai été emprisonné. Par chance, je suis parvenu à me sauver."
sensei.victory.Prince_zone2_1 = "MES hommes ! J'ai commis une grave erreur en nommant ce sot à la tête de mon armée ! S'il te reste un soupçon d'honneur, dis-nous où se trouve le camp des bandits !"
sensei.victory.Sensei_arc_outro = "À suivre..."
sensei.victory.Sensei_zone1_1 = "Ces événements ne sont pas fortuits. Selon toute vraisemblance, les bandits ont été avertis de notre arrivée. Quel rôle l'Ermite a-t-il joué ? Il faut en avoir le cœur net !"
sensei.victory.Sensei_zone2_1 = "Vous devriez avoir honte ! Vous faites fi de votre honneur et dans quel but ? Pensez-vous que le peuple suivra un traître ? Est-ce là, un bon exemple pour les jeunes ?"
sensei.victory.Sensei_zone3_2 = "Réponds-moi, pourquoi Shogun le veut-il mort et quelle est donc cette sphère magique que tu as évoquée ?"
sensei.victory.Sensei_zone4_2 = "Nous devons arrêter le Prince avant qu'il ne trouve Widow... et la sphère..."
sensei.victory.Sensei_zone5_1 = "Je n'éprouve que compassion à ton égard... mais nul ne doit se fier à un cœur brisé. Comprends qu'autrui souffre à cause de tes actions."
sensei.victory.Sensei_zone6_2 = "Attendez ! J'ai de nombreuses questions ! Qui êtes-vous ? Qu'est-ce qui se cache par-delà les Portes ? Je veux le savoir..."
sensei.victory.Wasp_zone4_3 = "Arrête ! Je t'ai sous-estimé, vieillard ! On m'a payée pour une livraison, trépasser au nom de l'honneur de Widow ne m'intéresse guère ! Je vais te montrer sa cachette !"
sensei.victory.Wasp_zone4_4 = "Widow aimait le Prince, mais il l'a rejetée. Elle s'est alors déniché un nouveau jouet : Shogun ! Cette sorcière se sert de lui pour assouvir une vengeance qui la ronge."
sensei.victory.Wasp_zone4_5 = "Widow veut régner sur les hommes et les monter les uns contre les autres. Grâce à la sphère, celui que cette vile sorcière aura choisi, sera transcendé."
sensei.victory.Widow_zone5_3 = "C'est le point de non-retour pour moi. Je vois bien que tu veux aider, mais il est trop tard : le Prince a déjà pris la sphère. Shogun a essayé de la protéger, mais en vain."
sensei.victory.Widow_zone5_4 = "Je n'ai jamais vu le Prince aussi... enragé. Ses yeux étaient flamboyants ! Il trouve cela ironique d'exécuter un traître à l'endroit de notre 1re rencontre. Je vais te montrer..."
sensei.victory.characterAncient = "ANCESTRAL"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

