uw.BOSS_BISON_Title = "Adanti"
uw.BOSS_LAMB = "L'AGNEAU"
uw.BOSS_RAVANA = "RAVANA"
uw.BOSS_RAVANA_Title = "Ravana"
uw.CharacterIndia24Nrityu = "NRITYU"
uw.DEMON_RAID = "LE GANTELET"
uw.DEMON_RAID_Title = "Le Gantelet"
uw.EARTHQUAKE = "Tremblements de terre à intervalle régulier"
uw.EnterPortal_ActScreen = "Portail"
uw.FRAGILITY = "Vulnérabilité augmentée dans la zone indiquée"
uw.Gatekeeper_greetings_1 = "Air étrange ? Air étrange ! Ai-i-r étrange !"
uw.Gatekeeper_greetings_2 = "Pas contents, pas contents, pas contents ! On a fait, on a fait, on a fait !"
uw.Gatekeeper_greetings_Assistant_1 = "Shadow ! Tu es enfin réveillé !"
uw.Gatekeeper_greetings_Assistant_2 = "Il fait si froid ici ! Je ne sens déjà plus mes doigts… Où sommes-nous ? L'air a l'air si étrange."
uw.Gatekeeper_greetings_Assistant_3 = "But why do I feel as though it understands us?"
uw.Gatekeeper_greetings_Sensei = "Recule, May ! Nous ne savons pas ce qu'il veut ! Le monde des Immortels a été plus ébranlé que je ne le pensais. Après ce que nous avons fait, ils ne sont pas ravis de notre présence ici."
uw.Gatekeeper_greetings_Sensei_2 = "Calme-toi maintenant — ne fais aucun geste brusque. Il semble que cette créature ne soit pas très intelligente."
uw.Gatekeeper_greetings_Sensei_3 = "Ce n'est pas important pour l'instant. Traverser le portail était notre choix, et nous devons en répondre. Elle veut un combat — nous n'avons pas le choix, Shadow."
uw.Gatekeeper_lost_Saimon = "J'attendais plus du portail… Il semble que le voyage ait épuisé vos forces, et vos liaisons moléculaires sont affaiblies. Intéressant — nous devons mener quelques tests supplémentaires."
uw.Gatekeeper_win_Saimon = "Pendant des siècles, ce portail bancal nous a rappelé qu'il existe des forces qui dépassent notre entendement. Et puis vous êtes arrivés…"
uw.HARD_GROUND = "Quand vous tombez au sol, vous subissez des dégâts."
uw.HEAD_BERSTUUK = "Masque de Berstuuk"
uw.HEALTH_DROPS = "La santé baisse au cours du temps"
uw.HOT_GROUND = "Terrain brulant"
uw.HW20Arkhos1 = "Je n'ai pas besoin de prévoyance pour voir que le feu de la foi consumera à la fois les faibles et les aveugles. J'ai apporté des bougies noires, afin que tous puissent voir cette vérité aussi clairement que moi !"
uw.HW20Fatum1 = "Les frontières entre les mondes s'amincissent — c'est la plus belle nuit pour les prophéties ! Le air vrombit de magie, et entre mes mains, les fils mêmes du destin s'enroulent !"
uw.HW20Fatum2 = "La voyance, pour moi, est un jeu — je peux faire du destin des mortels ce qu'il me plaît. Mais vous, mes amis, c'est une tout autre histoire. S'il vous plaît, asseyez-vous !"
uw.HW20Fatum3 = "Tu as été aveuglé par ta haine. Commençons. Ne parlez pas, écoutez. Je vois une silhouette… noire comme la nuit… des plumes et des cendres… me prenant par la main…"
uw.HW20Fatum4 = "Comment… comment es-tu arrivée ici ? Le chemin vers ce monde t'était scellé !"
uw.HW20Megalith1 = "Tu as parlé de voyance et de mascarade, alors j'ai apporté un miroir magique. Pour la première fois en mille ans, je peux voir mon reflet. Ce masque me donne un air ancestral !"
uw.HW20Whisper1 = "Tu as joué aux prophéties, petite sœur ? À prendre en charge le destin des mortels ? De tels jouets n'ont toujours appartenu qu'à moi !"
uw.HW20Whisper2 = "Scellé, il l'était ! Mais tu as appelé, et c'est à travers ce merveilleux miroir que je suis venue. Je l'emporte avec moi. N'oublie pas de venir me voir pour entendre de vraies prédictions !"
uw.Hunger_AfterLoss = "Comme vous êtes l'élu, je vous donne une dernière chance de rester à mes côtés et de festoyer. Sinon, vos os rejoindront ceux des autrrres dans la poussièrrre."
uw.Hunger_AfterWin = "Créateur, vous m'avez envoyé de quoi me sustenter, mais cela n'est guère suffisant ! Ma faim est éternelle, affranchissez-moi de cette voracité..."
uw.Hunger_Greetings1 = "Vous avez voyagé par monts et par vaux pour arriver jusqu'ici. Et pourquoi ? Pour sauver des morrrtels ingrats ? Ils se moquent éperdument de vous ! Je perçois votre solitude, votre faim et votre... peurrr."
uw.Hunger_Greetings2 = "Ombre, ne soyez pas idiot ! Sa faiblesse apparente n'est qu'une ruse habile. Vous n'êtes pas son ami... mais juste sa proie ! Il lacérera votre chair si vous vous approchez davantage !"
uw.Hunger_Greetings3 = "Voyez-vous mes frères ? Leur soif est arrrdente, mais ils s'abreuvent d'une race tout autre. Ils veulent s'amuser... mais leur faim n'est rien comparée à la mienne !"
uw.INVERTED_JOYSTICK = "Mouvement Inversé"
uw.LIGHT_IN_THE_DARK = "Lueur dans les ténèbres"
uw.MERCENARY_RAID = "UNITÉ{br}MERCENAIRE"
uw.MERCENARY_RAID_Title = "Unité mercenaire"
uw.MiniEventAnnounce = "Depuis des temps immémoriaux, un culte réside dans les entrailles de la terre, veillant sur le sommeil fragile des dieux du monde souterrain et empêchant leur réveil. Mais le prix à payer est une cruelle bataille rituelle, disputée jusqu'à la dernière goutte de sang."
uw.MiniEventHungerFight_Enter_1 = "Ici, sous la terre, tout est différent. Nous nous battons pour vivre, et la bouffe, c'est la vie ! Ne prive pas ton peuple — ni le mien — de cette grande joie !"
uw.MiniEventHungerStory_1 = "Les gens ne se soucient des caprices des esprits que lorsque le malheur s'abat sur leurs foyers. Leurs récoltes dépérissent, leurs enfants ont faim… Et où est leur foi maintenant ?"
uw.MiniEventHungerStory_2 = "La faim a une forme. Sa soif de dévorer est terrible. Mais c'est le rôle de Karcer, tandis que le tien et le mien est de l'empêcher de se réveiller de son sommeil séculaire."
uw.MiniEventHunger_Loss_1 = "Ta mère ne t'a pas appris à ne rien laisser dans ton assiette ? Ça se voit — il y a de la faim dans tes yeux ! Ou alors… qu'est-ce qui ne va pas chez toi ?"
uw.MiniEventHunger_Win_1 = "Oui, tu frappes bien, Shadow… Célébrons ta victoire avec de la bonne bouffe bien copieuse ! C'est ma tournée !"
uw.MiniEventStory_1 = "Je vois que tu es fort et d'un esprit inébranlable, Shadow. Les légendes de tes exploits sont célèbres partout. Aimerais-tu faire partie d'une autre histoire ?"
uw.MiniEventStory_2 = "Les esprits du monde souterrain sont capricieux. Nous organisons une cérémonie pour apaiser leur humeur — des batailles rituelles ! Votre participation serait un honneur pour nous."
uw.MiniEventStory_EnterBattle = "N'es-tu pas un peu trop chétif pour un spectacle aussi occulte ? Et vous avez choisi celui-là, vraiment ? C'est lui l'homme de la légende ? Oh, les esprits vont être furieux…"
uw.MiniEventStory_Loss_1 = "Oui, bon… Je veux croire que même les esprits ont le sens de l'humour, et qu'ils se contenteront de rire de nos maladresses dans l'arène, plutôt que de déchaîner leur colère sur nous…"
uw.MiniEventStory_Win_1 = "Eh bien… Personne ne vient dans cette arène par hasard. Tu es vraiment un homme de légendes, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "La sorcière vous fait peur sans raison. C'est bien plus simple que ça : l'acier se trempe dans le feu ! Les dieux ne comprennent que la puissance et rien d'autre. Seule la puissance peut les replonger dans leur sommeil ! À l'attaque !"
uw.MiniEventVulkanStory_1 = "Le feu purificateur est juste — ainsi parlent nos ancêtres. Mais ils ne savaient pas que les Immortels ne se soucient aucunement de la morale humaine. C'est simplement leur nature."
uw.MiniEventVulkanStory_2 = "Sens-tu la chaleur monter de sous la terre ? Il y a une chose que tu dois savoir : la flamme n'épargne personne, qu'il s'agisse d'un ami ou d'un inconnu. Et nous nous trouvons directement sur son chemin."
uw.MiniEventVulkan_Loss_1 = "Tu dois te relever, Shadow ! Ne sens-tu pas le sol trembler ?! Le dieu est dégoûté par nos futilités dans la poussière…"
uw.MiniEventVulkan_Win_1 = "Il fait une chaleur d'enfer ici… L'esprit du feu grogne de contentement dans son caveau ! Un excellent combat, Shadow ! Nous avons gagné un jour de plus !"
