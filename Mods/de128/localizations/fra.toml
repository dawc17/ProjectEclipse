sensei.defeat.OK = "OK"
sensei.defeat.Sensei_defeat1 = "Non, attends... Les choses se sont déroulées autrement... Pardonne la mémoire vacillante d'un vieillard."
sensei.defeat.Sensei_defeat2 = "Je crois que ça ne s'est pas passé ainsi... Les souvenirs sont fugaces."
sensei.defeat.Sensei_defeat3 = "Je ne pense pas que le combat se soit terminé de cette manière ! Laisse-moi puiser en mes souvenirs..."
sensei.defeat.Sensei_defeat4 = "Mes souvenirs sont si vagues... Je crois avoir remporté ce combat."
sensei.defeat.Sensei_defeat5 = "Non, ça s'est déroulé autrement. Je pense avoir gagné..."
sensei.defeat.characterSensei = "SENSEI"
