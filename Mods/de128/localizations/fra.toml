uw.dlgAmericanEvent22Story_May_1 = "Elle est complètement gelée, Sensei ! Nous ne pouvons pas la jeter dehors avec des vents pareils qui font rage à la porte…"
uw.dlgAmericanEvent22Story_Puma_1 = "Ils ont des ennuis, vieil homme… Je n'aurais jamais pensé que le passé de mon peuple me poursuivrait, mais c'est le cas. Alors j'ai fui pour les protéger. S'il te plaît, écoute-moi !"
uw.dlgAmericanEvent22Story_Puma_2 = "Vous entendez ça vous aussi ? Quand j'étais enfant, un chamane m'a parlé d'un esprit dont le hurlement soulevait les vagues et arrachait les feuilles. Je n'aurais jamais pensé que cette vieille histoire s'avérerait vraie !"
uw.dlgAmericanEvent22Story_Puma_3 = "Il vient par ici pour nous traquer de son cri jusqu'à ce que nous nous effondrions, à bout de souffle… Juste pour le sport ! Je ne sais pas où me cacher d'autre…"
uw.dlgAmericanEvent22Story_Sensei_1 = "Les portes de ma demeure sont ouvertes à tous ceux qui souffrent. Mais il est inattendu de voir une pirate entre ces murs… Et où se trouve ta bande d'égorgeurs, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Les mythes des chamanes sont des allégories. Les hommes ont inventé les voiles pour apprivoiser le vent, et depuis, il les sert bien. Tu n'es qu'un conte de fées stupide, et Shadow va le prouver !"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Je am the Wolf Wind! Whoever comes to meet me shall be snuffed out like a candle! And sooner or later, I shall break down your door. It is only a matter of time!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Je hur-ler-ai jusqu'à ce que les feuilles recouvrent les débris. Personne ne trouvera jamais la route pour venir ici ! Audacieux et insensé… Comment peux-tu lutter contre les éléments, mortel ?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Quel déshonneur… Tu m'as pris ma voix puissante ! Mais ta foi, jeune fille, me ramènera à la vie… Et je ne viendrai pas seul ! Car nous sommes nombreux !"
uw.dlgArkhosGreetings = "Des fanatiques qui tâtonnent dans les ténèbres... Voilà ce que vous êtes ! Le culte blasphématoire que vous vouez à votre Père tout-puissant insuffle en moi une vie nouvelle ! Il incombe à tout parent de se montrer sévère... et vous accepterez ma punition avec gratitude..."
uw.dlgArkhosLost = "Devant qui dois-je me prosterner alors que la Grande faucheuse se profile à l'horizon... ? Ô Créateur, pourquoi ne plus veiller sur ma frêle enveloppe charnelle ? Mon destin était de les guider, mais j'ai échoué... à nouveau !"
uw.dlgArkhosStory1 = "Lui et les siens... ils ne me sont guère inconnus ! Cette aberration contre nature séduit moult adeptes qu'elle abreuve ensuite de mensonges ! N'ajoutez point foi à ses élucubrations tonitruantes et vous échapperez à son emprise !"
uw.dlgArkhosStory2 = "Faux, vieillard ! Les enfants réfractaires subiront également mon courroux ! Vous aussi, vous me supplierez de vous accepter parmi nous... mais je me montrerai implacable."
uw.dlgArkhosWin = "Brebis galeuse, vous n'êtes point digne de m'approcher ! Allez-vous-en ! Je me fraierai un chemin jusqu'au Créateur pour lui faire part de la déception qu'incarnent les hommes ! Il vous donnera alors en pâture à ma descendance !"
uw.dlgBerstuuk_Announce = "En quête de connaissances interdites, un scientifique doué a fusionné la science et la magie dans sa quête pour devenir un dieu. Et la transformation est inévitable ! Désormais, la forêt est son laboratoire cauchemardesque, et les humains sont ses proies. Vous seul pouvez arrêter cette terrifiante métamorphose ! Chassez votre peur et aventurez-vous au cœur du fourré à la recherche de la fausse idole !"
uw.dlgBerstuuk_Loose_1 = "Quand tu t'es présenté à ma porte, tu m'as tout dit sans un mot ! Je vais tirer sur ce savoir comme sur un fil ténu jusqu'à ce qu'il ne reste plus rien !"
uw.dlgBerstuuk_Story_1 = "Il y a Sly dehors, qui frappe à la porte de la grange… J'en ai vu des choses dans la forêt la nuit, mais ça, c'est nouveau ! Qu'est-ce qui ne va pas chez lui ?"
uw.dlgBerstuuk_Story_10 = "Pas assez. La science est imprévisible — regarde-moi ! Petit à petit, j'ai accepté la forêt, mais elle continuait de refuser de m'accepter. Jusqu'à maintenant."
uw.dlgBerstuuk_Story_2 = "Pour ceux qui cherchent de l'aide, the path leads to the right door. Mais Sly semble s'être égaré… Espèce de vieux garnement, surveille tes mains ! Qu'est-ce qui s'est passé ?"
uw.dlgBerstuuk_Story_3 = "Le coquin cherchait de l'aide, et il l'a trouvée. Allons dans les bois avant qu'ils ne prennent ce qui leur revient de droit. La vie des hommes !"
uw.dlgBerstuuk_Story_4 = "« Des hommes » ? Le pauvre est sous le choc — il n'a plus de visage ! Qu'est-ce qui l'a terrifié au point qu'il soit frappé par une soudaine crise de conscience ?"
uw.dlgBerstuuk_Story_5 = "Tu entends les oiseaux chanter ? À cette heure-ci, ils devraient déjà gazouiller, mais ici, il n'y a rien qu'un silence de mort… Qu'est-ce qui se cache d'autre dans cette forêt ?"
uw.dlgBerstuuk_Story_6 = "Silence de mort. Silence de mort. Les gens ont besoin d'aide. Tu dois ai-de-r. Aide-les maintenant !"
uw.dlgBerstuuk_Story_7 = "Par les dieux ! Les gens ne se changent pas normalement en brindilles sèches et en mousse, peu importe leur peur ! Qu'est-ce que c'est que cette chose, et où est le vrai Sly ?!"
uw.dlgBerstuuk_Story_8 = "Il est par ici, quelque part. Le petit esprit de Sly s'est avéré très utile. Il m'a parlé de toi, Shadow — de ton pouvoir spécial. Et ça m'a frappé !"
uw.dlgBerstuuk_Story_9 = "C'est donc de toi que parlait la créature ? Les bois viendront et l'emporteront. Et combien de ces vies « légitimes » as-tu prises, fou furieux ?"
uw.dlgBerstuuk_Win_1 = "La nature trouvera toujours un chemin ! Notre combat m'en a appris plus que tu ne le penses, Shadow. La forêt s'en souviendra. Elle me consumera pour renaître à nouveau…"
uw.dlgFatumGreetings = "Votre courage n'a d'égal que votre folie... mais je savais que vous viendriez ! Vous êtes mon destin, et moi, le vôtre ! C'est moi qui tracerai le sentier qui vous mènera au cœur des ténèbres !"
uw.dlgFatumLost = "Je connais l’humanité ! Vous tournez en rond. Je l’ai vu de nombreuses fois.Vous êtes condamné au néant. Rien ne peut changer ce destin qui est le vôtre !"
uw.dlgFatumStory1 = "Sois prudent, jeune héros. Dans ces profondeurs insondables, le monde s’est affranchi des lois universelles que tu connais..."
uw.dlgFatumStory2 = "Tu dis vrai ! Tiens bien ce gamin en laisse. Je connais vos destinées : qui vous êtes et où vous vous rendez. Voulez-vous que je vous dévoile qui périra à la fin ?"
uw.dlgFatumWin = "Vous n’échapperez pas à votre destin ! Vous avez perdu au moment même où vous avez franchi le seuil de mon logis. Aurez-vous assez de courage pour réécrire votre histoire ?"
uw.dlgFungusGreetings = "Votre fiel a profané la terre... et maintenant, mes champignons agonisent. Ils absorberont votre esprit et nous ne ferons plus qu'un, humain ! Ainsi s'achèvera votre histoire !"
uw.dlgFungusLost = "À force de jouer les déités toutes-puissantes, mes frères ne sont plus que l'ombre d'eux-mêmes, mais l'homme ne sait répandre que mort et destruction. Sans vous, le monde connaîtra une nouvelle ère !"
uw.dlgFungusWin = "Allez-vous-en !... Et délectez-vous des derniers instants de vos vies pitoyables et fugaces !"
uw.dlgHW21LosePuppeteer_1 = "Je ne te confierais même pas un rôle muet, Shadow. La scène n'est pas ta place — ne déshonore pas mon métier !"
uw.dlgHW21StoryArkhos_1 = "La peste arrive dans votre ville, mortels ! Inclinez-vous devant la puissance de votre dieu ! Et réjouissez vos yeux de l'éclat de l'or, sinon…"
uw.dlgHW21StoryPuppeteer_1 = "Qu'est-ce que vous y connaissez à l'art ! Vous avez ruiné ma plus grande entreprise ! Quoi qu'il en soit… le troisième acte arrive. Et dedans, le héros pousse son dernier soupir !"
uw.dlgHW21StorySensei_1 = "Depuis quand les dieux du monde souterrain remontent-ils ici pour extorquer de l'argent aux gens ordinaires ? Enlève ton masque, imposteur, avant que nous ne prenions les armes !"
uw.dlgHW21StorySensei_2 = "Le théâtre devrait inspirer, pas terrifier. Et tu as déformé l'essence même de l'art. Nous t'arrêterons avant qu'il n'arrive malheur à tes « acteurs »."
uw.dlgHW21StoryThief_1 = "Attendez ! C'est moi… Sly ! Ne me frappez pas ! Il m'avait promis que tout le monde me craindrait… Et que personne ne me reconnaîtrait. Comment me suis-je trahi ?"
uw.dlgHW21StoryThief_2 = "Le propriétaire du théâtre ambulant — le Marionnettiste. Il a dit que ce serait sa meilleure performance. Des dieux parmi les hommes ! Ça ne me disait rien. Mais l'argent, en revanche…"
uw.dlgHW21WinPuppeteer_1 = "C'est un fiasco ! Tu as ruiné ma magnifique intrigue et brisé mes masques ! Comment vais-je monter une pièce maintenant sans accessoires…"
uw.dlgHW22EnterArchitect = "Tout ton récit fantastique m'a épuisé… Maintenant, nous allons jouer selon mes règles. Et il est dans ton intérêt de me surprendre, Shadow…"
uw.dlgHW22LooseArchitect_1 = "C'était prévisible. Je connais tous tes mouvements, Shadow. Après tout, c'est moi qui t'ai inventé. Peut-être que je n'étais pas au mieux de ma forme à l'époque… Mais maintenant, tu vas aimer ta nouvelle vie."
uw.dlgHW22StoryArchitect_1 = "C'est ce qu'on appelle un « cliché », le Marionnettiste. Pourquoi paye-t-on les dramaturges ? Au nombre de caractères ? Le personnage du génie fou bavard est devenu désuet, tout comme la figure du héros…"
uw.dlgHW22StoryArchitect_2 = "C'est ça. Nous allons réécrire ton monde à partir de zéro ! Contemporain, créatif, pertinent ! Qu'est-ce qui plaît aux adolescents de nos jours ? Pourquoi ne dis-tu rien, Shadow ? Ah, oui…"
uw.dlgHW22StoryPuppeteer_1 = "On frappe à la porte — un coup inattendu ! Est-ce un voyageur venu vous voir, ou quelque chose de plus ? Intrigant, n'est-ce pas ?"
uw.dlgHW22StoryPuppeteer_2 = "Je savais que tu dirais ça, vieil homme. Qu'attendre d'autre de personnages inventés ? Le papier supporte tout… Mais le public ne le fera jamais !"
uw.dlgHW22StoryPuppeteer_3 = "Je ne suis qu'un esclave de la scène, c'est tout. Et mon nouveau chef-d'œuvre racontera une rencontre avec le créateur — des tourments de la prédestination et du libre arbitre…"
uw.dlgHW22StorySensei_1 = "Quoi que tu aies imaginé, le Marionnettiste, nous ne jouerons plus à tes jeux. L'art peut causer de la douleur, mais pas de la manière dont tu le pratiques."
uw.dlgHW22StorySensei_2 = "Tu as trop joué la comédie, et tu ne sais plus distinguer la réalité de tes fantasmes, l'artiste… Tu es fou."
uw.dlgHW22StorySensei_3 = "Vos paroles sont bien étranges et inquiétantes, étranger… Je ne sais pas quelle folie vous passe par la tête, mais Shadow va vous la faire passer."
uw.dlgHW22WinArchitect_1 = "Peut-être que la création n'appartient plus à son créateur et a pris sa propre vie… Tu m'as surpris. Je veux voir où l'histoire va nous mener ensuite."
uw.dlgHoaxenGreetings = "Votre vie n'est ni plus ni moins qu'une vague illusion. Nous vous ferons sombrer dans une folie tentaculaire alors qu'autrui comptera sur votre force… Incendie, inondation, maladies… Haha !"
uw.dlgHoaxenLost = "Où es-tu, mon frère ? Je ne perçois plus ta voix ! Être enfermé, seul, est un bien pire supplice que le feu ou l'épée… Allez-vous-en, bande de sots, le Père attend."
uw.dlgHoaxenStory1 = "\"Nous ?\" Ombre, je crois que notre ennemi n'a plus toute sa tête ! Excusez-moi, mais à laquelle de vos personnalités avons-nous affaire ? Votre \"frère\" serait sans doute plus… rationnel ?"
uw.dlgHoaxenStory2 = "Tu te moques de moi, pitoyable humain ? Mon frère ? Ah, il me conseille de précipiter vos âmes dans un abîme de misère éternelle… Alors, votre monde succombera, sans effusion de sang !"
uw.dlgHoaxenWin = "Je vous aurais tué, par pure miséricorde… mais mon frère n'est pas aussi clément ! Vous êtes libre… Enfin, si vous ne perdez pas la raison avant de quitter ces lieux…"
uw.dlgHunter_enter_hunter_1 = "Toi ! Hé, toiii ! Tu es venu finir ce que tu as commeeencé, hein ? Toi ? Il y a une puissance en toi. Elle me paaarle. Chut ! Ou je vais t'y forrrrcer !"
uw.dlgHunter_greeting_may_1 = "Regardez ! Il y a quelque chose à l'intérieur du cristal… Est-ce censé être ainsi ?"
uw.dlgHunter_greeting_saimon_1 = "Comme c'est étrange… Je m'attendais à ce que Lazarus réduise l'Obélisque en poussière. Je craignais le carnage, mais il semble qu'il ne reste plus que toi et moi. Je suis intrigué."
uw.dlgHunter_greeting_saimon_2 = "La salle de concentration. Tu vois ce cristal au centre ? C'est ainsi que l'Obélisque accumule l'énergie des ombres — le cœur des ténèbres, pour ainsi dire."
uw.dlgHunter_greeting_sensei_1 = "Le silence est un mauvais présage, mon ami rationnel. Il peut parler plus fort que le plus assourdissant des mots. Hmm… Où sommes-nous ? Quel est cet endroit bizarre ?"
uw.dlgHunter_greeting_sensei_2 = "J'en doute, ma chère… Cet endroit a l'air différent de la dernière fois que je l'ai vu. Je commence à penser que le vieil homme avait raison…"
uw.dlgHunter_loose_hunter_1 = "Allonge-toiii. Je te laisssserai ici pour toujouuurs. Ne fais plus de maaal."
uw.dlgHunter_win_hunter_1 = "Arrête, humain-Shadow ! Ne le laisse pas se rrrrépaaandre ! Tu seras comme luuuui. Tu seras trooompé ! Mais tu as encore une chaaance."
uw.dlgIE21AnnounceAssistant_1 = "Qui cela peut-il bien être ? Que fais-tu dans notre monde, et pourquoi devrions-nous seulement t'écouter ?"
uw.dlgIE21AnnounceAssistant_2 = "Ha ! Je ne sais pas d'où tu viens, mais tu ne vas pas rester ici longtemps !"
uw.dlgIE21AnnounceAssistant_3 = "Hé, Shadow, cette brute est allée trop loin ! Allons lui apprendre les bonnes manières !"
uw.dlgIE21AnnounceBoss_1 = "Pathétiques mortels ! Inclinez-vous devant ma volonté et ma gloire, ou je vous forcerai à vous mettre à genoux !"
uw.dlgIE21AnnounceBoss_2 = "Comment oses-tu me parler sur ce ton — je suis Ravana, le conquérant des trois mondes !"
uw.dlgIE21AnnounceBoss_3 = "C'est votre dernière chance de vous agenouiller. Refusez, et je prendrai votre tête !"
uw.dlgIE21AnnounceSensei_1 = "Shadow, je sens une menace mystérieuse approcher. Quelque chose de maléfique s'est à nouveau frayé un chemin dans notre monde."
uw.dlgIE21Boss_After_Loose = "Si tous les habitants de ce monde sont si faibles, alors sa conquête n'est qu'une question de temps !"
uw.dlgIE21Boss_After_Win = "IMBÉCILES ! Je bats en retraite pour le moment, mais vous ne me vaincrez pas si facilement. Je reviendrai !"
uw.dlgIndia22Story_May_1 = "Et c'est ainsi que vous avez commencé à mourir de faim… Qu'est-ce que ce démon pouvait bien vouloir à votre joyeuse célébration ? Comment d'humbles fermiers ont-ils pu attirer un tel prédateur ?"
uw.dlgIndia22Story_Rakshasa_1 = "Tu pas une odeur intéressante, humain. Nul doute que tu aurais tout aussi bon goût ! Tu entends mon ventre grouiller ? Un morceau de viande de choix pour accompagner mon riz serait le bienvenu !"
uw.dlgIndia22Story_Rakshasa_Lose = "Heureusement pour toi, notre combat m'a épuisé. De plus, ma faim est rassasiée… pour l'instant. Je vais me remettre en appétit et chasser à nouveau !"
uw.dlgIndia22Story_Sensei_1 = "Parle-moi de lui, voyageur. À tes vêtements, je vois que tu as voyagé loin. Quel problème tourmente ton foyer ?"
uw.dlgIndia22Story_Sensei_2 = "Modère ton appétit, démon ! Il n'y aura pas d'invitation au festival de la vie pour celui qui vole la vie elle-même !"
uw.dlgIndia22Story_Sensei_Win = "Ce n'est pas la magie qui fait s'épanouir un jardin — c'est le travail acharné. Et tu vas le prouver toi-même : aide tes voisins à restaurer leur ferme, sinon…"
uw.dlgIndia22Story_Sitaram_1 = "J'ai entendu l'histoire de ta vie. Que les dieux te récompensent selon tes mérites ! J'apporte de mauvaises nouvelles : un esprit maléfique est apparu sur mes terres…"
uw.dlgIndia22Story_Sitaram_2 = "La méchanceté de ce démon n'a d'égale que sa faim ! Nous nous apprêtions à célébrer le Bohag Bihu quand, soudain, cette… créature est apparue et a dévoré toutes nos pousses !"
uw.dlgIndia22Story_Sitaram_3 = "Par Agni, mon témoin, ma dame, je me pose la même question ! Maintenant, nous attendons le coucher du soleil avec effroi… Venez avec moi, je vous en supplie !"
uw.dlgIndia24_Enter_Puppet_1 = "As-tu l'esprit nécessaire pour diriger le destin ? Décide du mien, humble serviteur des arts que je suis. Ce n'est qu'en combat que l'on comprend vraiment ce qu'il en est. Sois audacieux, Shadow — attaque !"
uw.dlgIndia24_Story_Dandy_1 = "Ouvrez, ou je enfonce cette maudite porte ! Je sais que vous êtes là — je vous entends ! Je mettrai le feu à cette cabane si vous ne m'accordez pas l'asile !"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Oh, avec quelle férocité les mortels s'accrochent à la vie. Ce n'est pas moi qui ai choisi ce travail, et je ne verserai pas de larmes empoisonnées dessus… Pourquoi m'as-tu fait ça ?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Son cœur est rempli d'amour. Les dieux nous créent purs, mais nous choisissons notre propre chemin. Nrityu commence à le comprendre en écoutant l'histoire de la jeune fille."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, ta performance manque de passion et d'engagement. Je vais te donner une autre chance. Ne la joue pas — vis-la !"
uw.dlgIndia24_Story_Puppet_1 = "Toc, toc ! Hé, vieux amis ! La voix du destin est sur nous — et elle est en chemin ! Son ourlet rouge couve comme la vie elle-même à la fin du jour !"
uw.dlgIndia24_Story_Puppet_2 = "Est-ce pour ton âme qu'elle est venue ? Découvre une histoire aussi ancienne que le monde lui-même — la légende de Nrityu, dont le destin était de prendre des vies."
uw.dlgIndia24_Story_Puppet_3 = "Les fantômes bavardent tous. On ne peut pas leur faire confiance. Et d'ailleurs, ce n'est pas leur histoire à raconter. Je vais te montrer la vérité à travers ses yeux. Shadow, tu es le seul qui puisse comprendre."
uw.dlgIndia24_Story_Sensei_1 = "Cette voix… Il semble que notre vieil adversaire mijote encore quelque chose. Qui sera la victime cette fois ? Je vois un homme courir vers la pagode…"
uw.dlgIndia24_Story_Sensei_2 = "Tes vêtements sont couverts de saleté et de suie, étranger. Et ton ton me perturbe. Explique qui tu es et ce que tu viens faire à notre porte !"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Reculez ! Je ne voulais pas de ça ! Ma famille avait peur de moi, et j'ai pensé que c'était ma chance… Dandy a promis de m'emmener avec lui, si seulement je l'aidais…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "Voilà ! Tu sombres dans un sommeil éternel, bien que tu ne le mérites pas. Mais ce n'est pas à moi de te juger — c'est la vocation d'un autre. Je ne suis que l'escorte."
uw.dlgIndia24_Story_Win_Puppet_4 = "Tout comme toi, Shadow. Je veux que tu suives la voie de Nrityu. Il lui a fallu une éternité pour comprendre sa place."
uw.dlgIndia24_Story_Win_Puppet_6 = "Le spectacle continue ! Toi, Shadow, tu seras la star, et mes acteurs seront tes seconds rôles. L'histoire de Nrityu sera notre plus grande production !"
uw.dlgIndia24_Story_Win_Sensei_1 = "Cette histoire va loin — même pour toi. Je suis surpris ! Mais quelle en est la morale ? Pourquoi nous montres-tu cela ?"
uw.dlgMegalithGreetings = "Cette mine est un lieu sacré. Allez-vous-en... et faites face à votre destin avec honneur ! Sachez simplement que votre ultime souvenir en ce bas monde sera la terre qui tremblera inexorablement..."
uw.dlgMegalithLost = "Enfer et damnation ! Suis-je condamné à attendre encore plusieurs milliers d'années ? J'ai déplacé des continents ! Mon devoir était de purifier la terre !"
uw.dlgMegalithWin = "Contrairement aux autres Éternels, j'ai toujours traité les humains avec compassion ! Alors, fuyez et faites vos adieux aux êtres qui vous sont chers !"
uw.dlgRaidIntro1 = "Essayez-vous de corriger votre erreur ? Vous avez ouvert le Portail... mais seuls les Éternels peuvent enrayer la contagion de l'obscurité ! Vous n'êtes que faiblesse et médiocrité."
uw.dlgRaidIntro2 = "Vous n'échapperez pas au destin funeste qui vous attend tous ici-bas ! La lave en fusion qui coule dans mes veines dévorera cette terre pour la purifier et y engendrer une vie nouvelle."
uw.dlgRaidStory1 = "Quelle est donc cette cave... et que faisons-nous ici ?"
uw.dlgRaidStory2 = "Il s'agit de l'antichambre du domaine des Éternels. Ils étaient assoupis depuis des millénaires, mais le Portail des ombres les a éveillés... et a exposé le monde entier à un danger incommensurable !"
uw.dlgRaidStory3 = "Génial ! Ils vont nous aider à nous occuper du portail en deux temps trois mouvements..."
uw.dlgRaidStory4 = "Oh, malheureusement non ! Certes, ils démoliront le portail, mais plongeront l'humanité dans les ténèbres ! À leurs yeux, il ne s'agit guère plus que d'un énième cycle de destruction et de création..."
uw.dlgShurale_Announce = "Réveillé par des bandits avides, l'esprit de la forêt se venge désormais sur les innocents. La créature cherche le coffret de souvenirs volé — le réceptacle de son ancienne magie. Seuls ceux dont le cœur abrite un véritable chagrin pourront apaiser la fureur de la créature. Le prix, cependant, sera élevé…"
uw.dlgStoryBtnFight = "COMBATTRE"
uw.dlgStoryBtnMore = "PLUS"
uw.dlgVolcanoGreetings = "De tous les Éternels, je suis le premier à avoir été arraché des bras de Morphée ! Nombreux sont les guerriers que j'enverrai dans l'au-delà et nul ne m'empêchera d'accomplir ma mission."
uw.dlgVolcanoLost = "Il suffit ! Je m'avoue vaincu !... Mais sachez que vous avez éveillé mon frère ! Ne vous fiez point à son apparence des plus trompeuses... Sa célérité n'a d'égal que sa puissance !"
uw.dlgVolcanoStory1 = "J'ai aperçu des habitations en ruine et une gigantesque statue. Des humains vivent-ils ici ?"
uw.dlgVolcanoStory2 = "Que des fanatiques ! Ils vénèrent les Éternels. Ces pauvres fous sont aveuglés par une foi inébranlable... Si notre entreprise se solde par un échec, ils découvriront la vérité..."
uw.dlgVolcanoWin = "Comme mes frères ne le savent que trop bien, c'est à moi qu'incombe la lourde tâche de décider du destin de cette planète. Prosternez-vous, et contemplez ma rage embrasée dévorer ces vertes contrées !"
uw.dlgVortexGreetings = "Des eaux ténébreuses engloutiront la terre et le Portail des ombres ! Son secret sera à tout jamais perdu dans l'abysse... et au-dessus de ces flots tumultueux, nul ne survivra !"
uw.dlgVortexLost = "Pour la première depuis un millier d'années, un humain remporte la victoire... Mais quel que soit le chemin dont vous foulez le sol boueux, votre destinée n'en demeure pas moins la même : le trépas !"
uw.dlgVortexWin = "Des millénaires durant, j'ai contemplé vos semblables sombrer dans le néant, déchéance empreinte d'une beauté fugitive ! Je pense que j'épargnerai votre misérable existence..."
uw.dlgWhisperGreetings = "Il semble que quelqu'un ait hâte de découvrir son destin. Donne-moi ta main et regarde dans le miroir !"
uw.dlgWhisperLost = "Tu es encore en vie ? Alors tu n'es pas encore en mon pouvoir ! Fatum devinera ton destin, puis je retournerai dans mon monde — en t'ayant prévenu de faire attention avec les miroirs !"
uw.dlgWhisperWin = "Je t'emmènerai avec moi dans le royaume des cendres, des esprits et de la nuit éternelle ! Fais-moi confiance — regarde-moi dans les yeux, et ne détourne pas le regard."
uw.dlg_American_25_Loose_1 = "Tu ne sais pas qui tu protèges, Shadow. Ils ne te remercieront pas. Ils ne feront que ricaner dans ton dos. Des sauvages… et c'est moi le monstre ?"
uw.dlg_American_25_Story_1 = "May a disparu. Enlevée par quelque chose d'à peine humain. Pourtant, il n'y a eu aucun cri, aucun signe de lutte… comme si elle était partie de son propre chef."
uw.dlg_American_25_Story_2 = "Nous ne sommes pas seuls dans cette histoire. D'autres comme May — jeunes et forts — ont également disparu. Elle l'a senti venir… et a rempli ses poches de poudre à canon."
uw.dlg_American_25_Story_3 = "Sa piste est claire. Nous devons la retrouver avant l'arrivée des pluies, sinon elle sera perdue pour toujours. Viens, Shadow !"
uw.dlg_American_25_Story_4 = "Je t'ai senti dès le moment où tu as posé le pied sur cette terre maudite. Pourquoi es-tu venu ? Pour piétiner mon chagrin ? Tu n'as aucun honneur — tout comme ils n'en avaient pas."
uw.dlg_American_25_Story_5 = "Je savais que tu finirais par apparaître, chamane. Rends les enfants à leurs proches, et notre amie à nous. Ensuite, va pourrir sur ta montagne de cendres."
uw.dlg_American_25_Story_6 = "Cendre aux cendres. Et tu retourneras à la cendre, mortel…"
uw.dlg_American_25_Win_1 = "Attendez ! Je l'ai suivi de mon plein gré. Sa forme est bestiale, oui — mais son cœur est humain. Et il souffre… Ils ont volé son enfant !"
uw.dlg_CHN_NY25_Announce = "Plongez dans l'histoire d'un héros d'autrefois — démêlez le vrai de la fable et aidez à forger une nouvelle légende ! Dressez-vous contre un culte mystérieux qui utilise le nom d'un grand héros pour masquer ses atrocités ! Revenez là où tout a commencé et aidez un coquin en cavale à découvrir son véritable héroïsme !"
uw.dlg_CHN_NY25_Loose_1 = "Non, nous devons continuer à nous battre ! Personne ne croirait qu'un simple fermier puisse vaincre un culte sinistre si facilement. Tu dois donner tout ce que tu as !"
uw.dlg_CHN_NY25_Story_1 = "Le Culte du Soleil a pour tradition de visiter le lieu de naissance de son grand héros une fois par an. Mais chaque fois, cela s'avère être un désastre…"
uw.dlg_CHN_NY25_Story_2 = "Il est né humain ? Comme c'est curieux. Il me semble que ces gens n'apportent pas de cadeaux au village…"
uw.dlg_CHN_NY25_Story_3 = "Ils ne laissent rien intact ! Ils volent le bétail des villageois, ravagent les récoltes dans une frénésie d'ivrognes, brisent les fenêtres et cherchent la bagarre !"
uw.dlg_CHN_NY25_Story_4 = "But why do the villagers not fight back? This is their land and their legend!"
uw.dlg_CHN_NY25_Story_5 = "Ils sont brisés. Le héros qui leur donnait de l'espoir a disparu, et les cultistes commettent le mal en son nom. Nous devons leur redonner de l'espoir !"
uw.dlg_CHN_NY25_Story_6 = "Dis que tu es venu vérifier que tout est prêt pour la « fête ». Et nous nous battrons ! Les habitants verront qu'on peut tenir tête au culte !"
uw.dlg_CHN_NY25_Story_7 = "Très bien, soit comme tu veux… Laisse-moi me mettre dans la peau du personnage. « Hé, mon garçon, comment oses-tu porter les habits de notre héros ! Va-t'en — nous avons un festin à préparer ! »"
uw.dlg_CHN_NY25_Story_8 = "Je ne suis peut-être pas un héros de légende, mais son esprit vit sur cette terre ! Il me guidera dans mes heures les plus sombres et me donnera du courage ! À l'attaque !"
uw.dlg_CHN_NY25_Win_1 = "Je ne m'attendais pas à une telle vitesse de la part d'un simple homme… Tu as presque battu notre champion ! Nous devons faire un exemple avec toi, de peur que d'autres n'aient des idées…"
uw.dlg_NY25_Loose_1 = "Tes souvenirs sont vifs, et le chagrin parle plus fort que la raison. Tu vas rester ici avec moi. Repose-toi un moment — le sommeil viendra bientôt."
uw.dlg_NY25_Story_1 = "Bienvenue ! Cette cabane a appartenu à ma famille. Tant de souvenirs… Restez aussi longtemps que vous le souhaitez. Il y a tout ce dont vous avez besoin pour vous reposer ici."
uw.dlg_NY25_Story_2 = "Mais tu nous as mis en danger tant de fois, et maintenant tu nous proposes de séjourner dans ta maison de famille ? Est-ce une sorte de piège ?"
uw.dlg_NY25_Story_3 = "C'est juste la voix de ma conscience qui s'exprime ! J'ai réalisé que j'avais profité de la gentillesse des autres pendant trop longtemps. Mais maintenant, je veux faire le bien."
uw.dlg_NY25_Story_4 = "Nous ne sommes pas seuls… Des gens se rassemblent devant la cabane. Que veulent-ils à une heure si tardive ? Ils nous appellent à sortir."
uw.dlg_NY25_Story_5 = "N'y allez pas ! Les fantômes vous détruiront ! Ce ne sont que des spectres de souvenirs douloureux. L'esprit de la forêt est venu chercher son coffre ! Allons le récupérer !"
uw.dlg_NY25_Story_6 = "Un coffre ? C'est donc pour cela que des gens disparaissaient dans les bois ! Pourquoi nous as-tu trahis, Sly ? Nous t'aurions aidé dans cette noble quête malgré tout !"
uw.dlg_NY25_Story_7 = "Vous ne comprenez pas. Si j'entends sa voix, je vais perdre le contrôle — et je disparaîtrai moi aussi. Tant que je porterai un morceau d'elle avec moi."
uw.dlg_NY25_Story_8 = "Ouvre la porte, je gèle dehors, papa. La maison est froide et je ne suis pas à l'intérieur. Je vais te montrer un endroit où nous pourrons à nouveau être ensemble."
uw.dlg_NY25_Story_9 = "Arrête ! Ne va pas dans la forêt — tu vas te perdre ! Je ne sais pas de qui est la voix que tu entends, mais elle n'a certainement rien d'humain !"
uw.dlg_NY25_Win_1 = "Réveille-toi, Sly ! Rends le coffre à l'esprit pendant qu'il est faible. Qu'il voie que l'humanité peut surmonter sa propre avidité."
uw.saturn_enter_saturn_1 = "Je vais te faire ravaler tes paroles. Et tes amis regarderont. La seule façon de quitter ma prison est de passer par l'échafaud. Qui veut passer en premier ?"
uw.saturn_greeting_saimon_1 = "Notre dirigeant, le Patriarche, a étudié le portail pendant des années. Puis, un jour, il s'est replié sur lui-même. Plus tard, il a érigé l'Obélisque, et cela a fait quelque chose à notre monde…"
uw.saturn_greeting_saimon_2 = "Shadow est similaire à l'Obélisque au niveau moléculaire. Il y a quelqu'un qui nous aidera à utiliser cela contre le Patriarche. C'est pour ça que nous sommes ici, dans la chambre de Saturne…"
uw.saturn_greeting_saimon_3 = "Mille excuses, ma dame. Néanmoins, nous devons libérer Lazarus. S'il vous plaît, montrez-nous sa cellule, et nous ne vous dérangerons plus."
uw.saturn_greeting_saturn_1 = "Vous allez bien loin, les enfants ? Vous êtes venus dans ma prison de votre plein gré ! Je me demande — est-ce de la bravoure ou de la stupidité ? Toi, le dégingandé — réponds-moi !"
uw.saturn_greetingn_May_1 = "Mais qu'est-ce que cela a à voir avec nous ?"
uw.saturn_lose_saturn_1 = "En voilà assez pour vous. Si Lazarus s'associe à des déchets dans votre genre, il n'y a aucun danger pour le Patriarche. Fichez le camp d'ici, sales gosses ! Vous n'êtes pas sur ma liste."
uw.saturn_win_saturn_1 = "Vous ne trouverez jamais Lazarus. Ce garnement s'est échappé de ma prison et s'est enfui dans les marais. Vous voulez périr vous aussi ? Alors allez-y, courez après lui !"
uw.summerfest25_story2_1 = "Tiens, tiens… Vous aviez tellement hâte de me trouver que je me suis dit que j'allais vous faire cette faveur. D'ailleurs, tout le monde attendait ce moment."
uw.summerfest25_story2_2 = "« Tout le monde » ? Arrête la comédie. Nous savons exactement qui tu es — et comment tu utilises les autres juste pour te délecter de leur misère."
uw.summerfest25_story2_3 = "Juste une petite apparition, et boum — je suis en tendance ! Honnêtement, je ne m'attendais pas à être aussi populaire."
uw.summerfest25_story2_4 = "Ton esprit ne te sauvera pas. Tu vas payer — pour mes yeux, et pour tout le mal que tu as fait. Ton jeu tordu consistant à jouer au dieu s'arrête ici !"
uw.summerfest25_story2_5 = "Sérieusement, Ermine ? Ce genre de discours a disparu avec les téléphones à clapet. On est en 2026 — essaie de vivre avec ton temps."
uw.summerfest25_story2_6 = "Quoi que prévoie l'Architecte… il y a des ténèbres autour de lui. Une force si malveillante qu'elle en est presque tangible."
uw.summerfest25_story2_7 = "À chacun de ses mots, je me surprends à croire de plus en plus à l'histoire d'Ermine. L'Architecte est dangereux — et il doit être arrêté."
uw.summerfest25_story2_defeat_1 = "Oh non — quelle déception ! Le public s'attendait à mieux. Il semble que je doive simplement augmenter les enjeux la prochaine fois."
uw.summerfest25_story2_win_1 = "Pourquoi le monde est-il si cruel ? Pourquoi devons-nous souffrir ? Pourquoi ai-je dû me rendre aveugle ? Réponds-moi, Architecte — pourquoi cela fait-il si mal de vivre !?"
