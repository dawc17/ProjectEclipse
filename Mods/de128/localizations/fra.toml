uw.blackness_enter_blackness_1 = "Descendance. Un grand sacrifice. Une sphère. L'esprit. Boucherie. Je ressens. Tu vas verser du sang. Je vois la douleur. Je vois l'avenir. Je vais te montrer."
uw.blackness_greeting_blackness_1 = "Qu'y a-t-il, Shadow ? Tu ne te sens pas bien ?"
uw.blackness_greeting_lazarus_2 = "Simon ? Quel enfoiré tu fais ! Pourquoi as-tu amené des gens ici ? Ça va flairer l'odeur de vos pensées ! Éloignez-vous d'ici avant que la Noirceur ne goûte à votre esprit !"
uw.blackness_greeting_may_1 = "Vous entendez ça ? Rien ! Le silence. Sans le chant des oiseaux, c'est comme si cet endroit était figé dans l'ambre. Est-ce qu'on fait la bonne chose ? J'ai un très mauvais pressentiment…"
uw.blackness_greeting_saimon_2 = "Ces gentils messieurs sont ton billet pour la liberté, mon cher. Le grand en noir est lié d'une manière ou d'une autre à l'Obélisque et aux Portes. Il t'aide, et tu l'aides."
uw.blackness_greetingn_saimon_1 = "Rien d'étonnant à cela. Depuis qu'un fragment des anciennes Portes s'est écrasé ici, la vie dans cet endroit est une anomalie statistique. Gardez les yeux ouverts — nous devons trouver Lazarus."
uw.blackness_lose_blackness_1 = "Tu restes ici. Éternellement. Un seul sang. Pour toujours. Je vais te lire. Je vais me nourrir."
uw.blackness_win_sensei = "Vous nous avez menti, homme de science ! Qui avons-nous libéré ? À quoi avons-nous condamné ce monde ? Est-ce que vous réalisez ce que vous avez fait ?!"
