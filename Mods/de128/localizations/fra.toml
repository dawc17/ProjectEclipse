# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "Histoire du Sensei{br}1re partie. Le témoin"
sensei.entry.ActScreenSensei2 = "Histoire du Sensei{br}2e partie. L'Ombre de l'avenir"
sensei.entry.ActScreenSensei3 = "Histoire du Sensei{br}3e partie. La Bête en son for intérieur"
sensei.entry.ActScreenSensei4 = "Histoire du Sensei{br}4e partie. Récit d'une vengeance"
sensei.entry.ActScreenSensei5 = "Histoire du Sensei{br}5e partie. Humilié et insulté"
sensei.entry.ActScreenSensei6 = "Histoire du Sensei{br}6e partie. Le monstre"
sensei.entry.ButcherYoung_Greetings = "Nul n'ose remettre mon autorité en question ! La famille ne pardonne jamais un tel affront ! Vous ne sortirez pas d'ici vivants !"
sensei.entry.Butcher_zone3_1 = "L'enfant prodigue est revenu ! Avez-vous réfléchi à ma proposition, mon Prince ? Je vous laisse partir, je vous dis où se trouve la Sphère et vous me payez grassement !"
sensei.entry.Butcher_zone3_2 = "Son silence est fort éloquent, vieillard. Moi, je suis honnête et je ne refoule pas la bestialité qui rugit en mon for intérieur. Venez, mes enfants, inculquons-leur l'humilité !"
sensei.entry.Guard1_Butcher_Sensei = "Boucher m'a montré que la douleur éveillait l'être qui sommeille en chacun de nous. À présent, je suis libre ! Toi aussi, tu peux atteindre la félicité ! Ne résiste pas !"
sensei.entry.Guard1_Hermit_Sensei = "Le monde va changer ! Après avoir sillonné moult contrées, j'en suis convaincue. Nombreux furent mes sacrifices... Aujourd'hui, seule l'érudition du Maître façonne mon existence !"
sensei.entry.Guard1_Lynx_Sensei = "Mon tatouage te plaît ? Regarde-le bien : tu y verras tous les guerriers qui se sont inclinés devant moi... et bientôt, tu y figureras, toi aussi..."
sensei.entry.Guard1_Wasp_Sensei = "Je crois qu'aujourd'hui, la chance va me sourire ! Ouais, je vais te détrousser ! Ah, tu crois avoir le vent en poupe, vieillard ?"
sensei.entry.Guard1_Widow_Sensei = "Je considère ma Lady comme une sœur. Je ressens sa douleur ! Elle m'a interdit de toucher au Prince, alors tout mon courroux s'abattra sur toi !"
sensei.entry.Guard2_Butcher_Sensei = "La parlote et la philosophie, c'est pour les pseudo-intellos ! Quant à moi, j'aime m'amuser avec des couteaux ! Tu veux jouer avec moi !"
sensei.entry.Guard2_Hermit_Sensei = "Le Maître nous a parlé du monde des ombres, des entités qui le peuplent et de ses pouvoirs qu'il partagera avec nous. Vous croyez que je vais vous laisser tout gâcher ?"
sensei.entry.Guard2_Lynx_Sensei = "Notre clan exécute les besognes répugnantes que même les Dieux ne daignent accomplir. Nous réglons les problèmes... et toi, tu es un problème de taille !"
sensei.entry.Guard2_Wasp_Sensei = "Tu menaces mon capitaine ? Sans elle, j'aurais été passée à tabac et laissée pour morte ! Je lui dois la vie ! Puissent les esprits être cléments envers toi !"
sensei.entry.Guard2_Widow_Sensei = "Ma Lady n'est que bonté et altruisme ! Ma vie lui appartient. Je ne suis pas digne de poser mon regard sur son visage... mais je la protégerai jusqu'à mon dernier souffle !"
sensei.entry.HermitYoung_Greetings = "Mon Prince, vous êtes une victime des circonstances, ce sacrifice est crucial pour le bien de tous. Mon école sera portée au pinacle, et l'âge d'or des arts martiaux débutera !"
sensei.entry.Hermit_zone2_1 = "Votre situation n'est point enviable, Monsieur le Baron. J'admets vous avoir trahi. Je n'avais pas le choix. L'avenir de mon école était en jeu."
sensei.entry.Hermit_zone2_2 = "Lynx, ce jeune arrogant, n'a pas mené à bien la besogne qui lui avait été confiée. Je vais devoir m'en occuper moi-même ! Disciples, préparez-vous !"
sensei.entry.LynxYoung_Greetings = "Je ne peux pas rebrousser chemin ! On m'a déjà payé pour la tête du prince ! Je n'ai rien contre toi, vieillard."
sensei.entry.Lynx_Sensei_1 = "N'écoute pas le Prince, vieillard, il a sombré dans la folie. Nous ramenons Sa Majesté au château avant qu'il ne lui arrive malheur. Nous n'avons nul besoin de ton aide."
sensei.entry.Lynx_Sensei_2 = "Vraiment ? Pourtant, je vois un homme terrorisé par des malandrins. J'ai l'intime conviction que le Prince dit vrai. Éloignez-vous de lui !"
sensei.entry.Lynx_Sensei_3 = "Comme il te plaira, vieillard ! On ne me paye pas pour bavarder... et deux têtes valent mieux qu'une. Au boulot, les gars !"
sensei.entry.NAME_BUTCHER = "BOUCHER"
sensei.entry.NAME_HERMIT = "ERMITE"
sensei.entry.NAME_LYNX = "LYNX"
sensei.entry.NAME_PRINCE = "PRINCE"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "GUEPE"
sensei.entry.NAME_WIDOW = "WIDOW"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Au secours ! Ces gens veulent me tuer !"
sensei.entry.Prince_zone3_1 = "Comment osez-vous souiller mon nom ! Misérable scélérat ! Je suis revenu pour mettre un terme à votre règne de terreur et de cruauté !"
sensei.entry.Prince_zone6_1 = "Te voilà, mon cher et fidèle ami ! Tu vois, la justice triomphe une fois de plus. Shogun est mon fidèle cerbère ! Son esprit m'appartient !"
sensei.entry.Prince_zone6_2 = "Ah, toi aussi, vieillard, tu veux t'emparer du trône ?! Il me revient de droit ! Nul ne me le prendra !"
sensei.entry.Sensei_arc_intro1 = "Un beau jour, alors que je me baladais, un hasard m'a conduit auprès du seigneur de la région. Le pauvre homme était en proie à une profonde détresse..."
sensei.entry.Sensei_zone3_1 = "Voilà donc votre interprétation du mot \"chance\" ? Acheter votre liberté et offrir votre peuple en pâture à une horde de dégénérés. Je ne vous ai pourtant témoigné que bonté !"
sensei.entry.Sensei_zone4_1 = "Widow ? Bien sûr... Elle m'a dit de prendre la sphère et de la remettre à Shogun en main propre."
sensei.entry.Sensei_zone6_1 = "Mon Prince, arrêtez ! Regardez autour de vous ! La sphère se nourrit de votre rage pour vous transformer en monstre !"
sensei.entry.Shogun_zone6_1 = "Misérable avorton ! Tu ne pourrais même pas être le bouffon de mon seigneur ! D'un seul et unique coup, je vais t'écraser comme le cloporte que tu es !"
sensei.entry.TITLE_PRINCE_EVIL = "PRINCE HANTÉ"
sensei.entry.WaspYoung_Greetings = "Que dirai-je à mon père ? Sa fille a perdu face à un vieillard ? Tant que je serai l'héritière du trône des pirates, une telle infamie ne se produira jamais !"
sensei.entry.Wasp_zone4_1 = "Widow t'a envoyé chercher la sphère ? N'es-tu pas un peu trop vieux pour ce genre de besogne ? Qu'importe ! Monte à bord !"
sensei.entry.Wasp_zone4_2 = "Seul problème : la sphère n'est plus en ma possession. Je l'ai remise hier aux hommes de Widow. J'sais pas qui tu es, mais j'aime pas les menteurs ! Jetez-le par-dessus bord !"
sensei.entry.WidowYoung_Greetings = "Le Prince m'a humiliée en me rejetant et en bafouant mes sentiments ! J'aurai ma vengeance ! Tu es son ami, alors tu lui apporteras ce message..."
sensei.entry.Widow_zone5_1 = "Tu viens pour m'humilier comme l'a fait le Prince ? Vous autres, mâles, êtes tous les mêmes..."
sensei.entry.Widow_zone5_2 = "Il m'a parlé de ta gentillesse, de ton honneur et de ta dignité. Mais je n'ajoute plus foi aux propos des hommes. Votre avenir à tous ne sera que douleur et souffrance !"
sensei.entry.Zone2_SenseiReminder = "La dernière fois, je t'ai raconté comment j'ai sauvé le Prince d'une mort certaine. J'ai alors appris qu'un Ermite entraînait ses soldats en secret. C'est là que nous sommes allés."
sensei.entry.Zone3_SenseiReminder = "L'Ermite nous a dit que le seigneur de guerre du Prince, Shogun, avait trahi son souverain et payé un certain Boucher pour l'enlever. Nous nous sommes rendus chez ce bandit."
sensei.entry.Zone4_SenseiReminder = "Une femme est responsable des problèmes du Prince ! Elle a mis au point un stratagème pour le renverser à l'aide d'une sphère magique qui allait arriver par bateau..."
sensei.entry.Zone5_SenseiReminder = "La flibustière m'a parlé de la relation compliquée de Widow et du Prince. Je n'ai pas obtenu la sphère, mais j'ai appris que le Prince était parti voir Widow dans les montagnes."
sensei.entry.Zone6_SenseiReminder = "La sphère magique a plongé le Prince dans la folie et lui a conféré un pouvoir... susceptible de tout anéantir ici-bas ! Je ne pouvais pas ignorer une telle menace !"
