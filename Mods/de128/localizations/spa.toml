uw.ActScreenRaid = "El{br}Inframundo"
uw.BLACKNESS = "LA OSCURIDAD"
uw.BLACKNESS_TITLE = "La oscuridad"
uw.BODY_BERSTUUK = "Forma de Berstuuk"
uw.BOSS_BISON_21 = "ADANTI"
uw.BOSS_BISON_Title = "Adanti"
uw.BOSS_LAMB = "EL CORDERO"
uw.BOSS_RAVANA = "RAVANA"
uw.BOSS_RAVANA_Title = "Ravana"
uw.CharacterIndia24Nrityu = "NRITYU"
uw.DEMON_RAID = "GUANTELETE"
uw.DEMON_RAID_Title = "Guantelete"
uw.EARTHQUAKE = "Terremotos periódicos"
uw.EnterPortal_ActScreen = "Portal"
uw.FRAGILITY = "Aumento de la vulnerabilidad en el área mostrada"
uw.Gatekeeper_greetings_1 = "¿Aire extraño? ¡Aire extraño! ¡Aiiire extraño!"
uw.Gatekeeper_greetings_2 = "¡No están contentos, no están contentos, no están contentos! ¡Lo hicimos, lo hicimos, lo hicimos!"
uw.Gatekeeper_greetings_Assistant_1 = "¡Shadow! ¡Por fin estás despierto!"
uw.Gatekeeper_greetings_Assistant_2 = "¡Hace tanto frío aquí! Ya no siento los dedos… ¿Dónde estamos? El aire se siente muy extraño."
uw.Gatekeeper_greetings_Assistant_3 = "But ¿por qué siento como si nos entendiera?"
uw.Gatekeeper_greetings_Sensei = "¡Atrás, May! ¡No sabemos qué quiere! El mundo de los Inmortales se sacudió más de lo que pensaba. Después de lo que hicimos, no están contentos de que estemos aquí."
uw.Gatekeeper_greetings_Sensei_2 = "Calma ahora, no hagas ningún movimiento brusco. Parece que esta criatura no es muy inteligente."
uw.Gatekeeper_greetings_Sensei_3 = "Eso no es importante ahora. Cruzar el portal fue nuestra elección y debemos responder por ello. Quiere una pelea... no tenemos opción, Shadow."
uw.Gatekeeper_lost_Saimon = "Esperaba más del portal… Parece que el viaje agotó tus fuerzas y tus enlaces moleculares están debilitados. Interesante... debemos realizar algunas pruebas más."
uw.Gatekeeper_win_Saimon = "Durante siglos, este portal destartalado nos ha recordado que hay fuerzas más allá de nuestra comprensión. Entonces llegaste tú…"
uw.HARD_GROUND = "Al caer al suelo, recibes daño."
uw.HEAD_BERSTUUK = "Máscara de Berstuuk"
uw.HEALTH_DROPS = "La salud se reduce con el tiempo"
uw.HOT_GROUND = "Suelo abrasador"
uw.HW20Arkhos1 = "No necesito previsión para ver que el fuego de la fe consumirá tanto a los débiles como a los ciegos. ¡He traído velas negras para que todos puedan ver esta verdad tan claramente como yo!"
uw.HW20Fatum1 = "Los límites entre los mundos se vuelven delgados; ¡esta es la mejor noche para las profecías! El aire zumba con magia y, en mis manos, ¡los hilos mismos del destino están enrollados!"
uw.HW20Fatum2 = "La adivinación, para mí, es un juego; puedo hacer lo que me plazca con el destino de los mortales. Pero ustedes, amigos míos, son un asunto completamente diferente. Por favor, ¡tomen asiento!"
uw.HW20Fatum3 = "Has sido cegado por tu odio. Empecemos. No hables, sino escucha. Veo una figura… negra como la noche… plumas y cenizas… tomándome de la mano…"
uw.HW20Fatum4 = "¿Cómo… cómo llegaste a estar aquí? ¡El camino a este mundo estaba sellado para ti!"
uw.HW20Megalith1 = "Hablaste de adivinación y de una mascarada, así que traje un espejo mágico. Por primera vez en mil años, puedo ver mi reflejo. ¡Esta máscara me hace parecer anciano!"
uw.HW20Whisper1 = "¿Has estado jugando a las profecías, hermanita? ¿Haciéndote cargo de los destinos mortales? ¡Esos juguetes siempre han sido solo míos!"
uw.HW20Whisper2 = "¡Sellado estaba! Pero llamaste, y a través de este maravilloso espejo, vine. Me lo llevaré conmigo. ¡Asegúrate de visitarme y escuchar algunas verdades sobre el destino!"
uw.Hunger_AfterLoss = "Ya que errrrres el elegido, te daré una última oportunidad de quedarrrrte conmigo y celebrarlo. De lo contrario, tus huesos caerrrrrán al polvo junto a los de los demás."
uw.Hunger_AfterWin = "Creador, me enviaste sustento, pero no es suficiente. Mi hambre es eterna; concédeme la salvación..."
uw.Hunger_Greetings1 = "Has recorrido un largo camino para llegar hasta aquí. ¿Por qué lo has hecho? ¿Para salvar a los ingratos morrrrtales? ¡A ellos no les importas nada! Siento tu soledad, tu hambrrrrre y tu... miedo."
uw.Hunger_Greetings2 = "¡Sombra, no te dejes engañar! Solo aparenta debilidad. No eres su amigo; solo su presa. ¡Te hará pedazos como te acerques!"
uw.Hunger_Greetings3 = "¿Ves a mis hermanos? Tienes sed, pero su sed es de una raza diferrrrrente. Anhelan el entretenimiento, pero su hambrrrrre no es nada en comparación con la mía."
uw.INVERTED_JOYSTICK = "Movimiento invertido"
uw.LIGHT_IN_THE_DARK = "Luz en la oscuridad"
uw.MERCENARY_RAID = "UNIDAD{br}MERCENARIA"
uw.MERCENARY_RAID_Title = "Unidad mercenaria"
uw.MiniEventAnnounce = "Desde tiempos inmemoriales, un culto ha habitado en las entrañas de la tierra, velando por el delicado letargo de los dioses del inframundo y evitando su despertar. Pero el precio es una cruel batalla ritual, librada hasta la última gota de sangre."
uw.MiniEventHungerFight_Enter_1 = "Aquí bajo la tierra, todo es diferente. ¡Luchamos para vivir, y la comida es vida! ¡No prives a tu gente, ni a la mía, de esta gran alegría!"
uw.MiniEventHungerStory_1 = "La gente se preocupa por los caprichos de los espíritus solo cuando la desgracia cae sobre sus hogares. Sus cultivos se marchitan, sus hijos pasan hambre… ¿Y dónde está su fe ahora?"
uw.MiniEventHungerStory_2 = "El hambre tiene forma. Su sed de consumir es terrible. Pero ese es el rol de Karcer, mientras que el tuyo y el mío es evitar que despierte de su letargo de siglos."
uw.MiniEventHunger_Loss_1 = "¿Acaso tu madre no te enseñó a no dejar nada en el plato? Se nota, ¡hay hambre en tus ojos! O… ¿qué te ocurre?"
uw.MiniEventHunger_Win_1 = "Sí, golpeas bien, Shadow… ¡Celebremos tu victoria con una comida abundante! ¡Yo invito!"
uw.MiniEventStory_1 = "Veo que tú, Shadow, eres fuerte y firme de espíritu. Las leyendas de tus hazañas están muy extendidas. ¿Te gustaría formar parte de otra?"
uw.MiniEventStory_2 = "Los espíritus del inframundo son rebeldes. Realizamos una ceremonia para templar sus caracteres: ¡batallas rituales! Tu participación sería un honor para nosotros."
uw.MiniEventStory_EnterBattle = "¿No estás un poco enfermizo para un espectáculo tan arcano? ¿Y elegiste a este, de verdad? ¿Este es un hombre de leyenda? Oh, los espíritus se sentirán ultrajados…"
uw.MiniEventStory_Loss_1 = "Sí, bueno… Quiero creer que incluso los espíritus tienen sentido del humor, y que simplemente se reirán de nuestros tropiezos en la arena, en lugar de desatar su furia sobre nosotros…"
uw.MiniEventStory_Win_1 = "Bueno… Nadie viene a esta arena por casualidad. Realmente eres un hombre de leyendas, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "La bruja te asusta sin motivo. Es mucho más simple que eso: ¡el acero se templa en el fuego! Los dioses entienden de poder y nada más. ¡Solo el poder puede hacerlos volver a su letargo! ¡Al ataque!"
uw.MiniEventVulkanStory_1 = "El fuego purificador es justo, eso dicen nuestros ancestros. Pero no sabían que a los Inmortales no les importa la moral humana. Es simplemente su naturaleza."
uw.MiniEventVulkanStory_2 = "¿Sientes el calor subiendo desde las entrañas de la tierra? Hay una cosa que debes saber: la llama no perdona a nadie, ya sea amigo o extraño. Y estamos directamente en su camino."
uw.MiniEventVulkan_Loss_1 = "¡Tienes que ponerte de pie, Shadow! ¿No sientes la tierra temblar? El dios está disgustado por nuestras insignificancias en el polvo…"
uw.MiniEventVulkan_Win_1 = "Hace tanto calor aquí como en el fuego del infierno… ¡El espíritu del fuego gruñe satisfecho en su bóveda! ¡Una excelente pelea, Shadow! ¡Nos hemos ganado otro día!"
