uw.Tenebris_greetings_1 = "Estás al límite de la realidad, viajero. Esta es la frontera final. Más allá de esta línea hallarás el vacío del que nacen los mundos. ¡Y fui yo quien forjó su luz y su oscuridad!"
uw.Tenebris_greetings_2 = "Sombra, el portal detrás de él podría ser nuestra única oportunidad de salvación. Los inmortales dijeron que destruirían nuestro mundo. ¿Tal vez pretendan usar ese portal?"
uw.Tenebris_greetings_3 = "¡No sobrevivirás al portal! Es una terra incognita. La oscuridad en la que se crean los mundos; pero tú no eres capaz de crear, solo de destruir. ¡El portal te engullirá por completo!"
uw.Tenebris_greetings_4 = "Es arriesgado, pero ¿acaso tenemos elección? Tal vez logremos detener a los inmortales si entramos en el portal. Aunque también podríamos causar una gran catástrofe."
uw.Tenebris_loses = "¿Tienes miedo de lo desconocido que acecha en la oscuridad? ¡Ahora tendrás que hacerle frente por tu cuenta! El mundo se convierte en polvo y renace de nuevo. La espiral continúa."
uw.Tenebris_wins = "¡Necio testarudo! Los humanos solo sabéis resolver los problemas con la fuerza bruta, pero el universo no funciona así. Tantos años y no habéis aprendido nada..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "¡Levántate, fantoche, y lucha! No importa si ganas o pierdes. Siempre que luchas, me estás sirviendo."
uw.War_AfterWin = "¡Farsante! ¿Y tu furia? ¿Cómo puedes luchar sin ella? ¡Enfréntate a mí; comencemos otra danza de espadas! ¡Sé que llevas la guerra en la sangre!"
uw.War_Greetings1 = "¡Es un día magnífico! Siento que la batalla se acerca, cual tormenta. Truenos. La furia inaudita de las legiones. ¡Todo ello es un regalo en mi altar!"
uw.War_Greetings2 = "La ira y la sed de sangre hierven en sus venas. Se deleita con batallas eternas, pero ¿con qué fin? ¿Qué encontrará bajo la montaña de calaveras?"
uw.War_Greetings3 = "¿Tan extraña te resulta la emoción de una sangrienta batalla? ¡El fuego, la pasión, el poder de la tempestad! ¡Demuestra lo que vales! ¡Lucha o muere!"
uw.ZONE_RAID = "Inframundo: Nivel 1"
uw.ZONE_RAID1 = "Inframundo: Nivel 2"
