# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "La historia del Sensei{br}Parte 1. El testigo"
sensei.entry.ActScreenSensei2 = "La historia del Sensei{br}Parte 2. Sombra del futuro"
sensei.entry.ActScreenSensei3 = "La historia del Sensei{br}Parte 3. La bestia interior"
sensei.entry.ActScreenSensei4 = "La historia del Sensei{br}Parte 4. La venganza"
sensei.entry.ActScreenSensei5 = "La historia del Sensei{br}Parte 5. Humillada e insultada."
sensei.entry.ActScreenSensei6 = "La historia del Sensei{br}Parte 6. El monstruo"
sensei.entry.ButcherYoung_Greetings = "¡Nadie osa dudar de mi autoridad! La familia nunca perdona algo así. ¡No vas a salir de aquí con vida!"
sensei.entry.Butcher_zone3_1 = "¡El hijo pródigo ha vuelto! ¿Has reflexionado sobre mi propuesta, príncipe? ¿Te parece que te deje marchar y te cuente el paradero de la esfera a cambio de oro?"
sensei.entry.Butcher_zone3_2 = "Su silencio es más elocuente que cualquier parlamento, anciano. Yo soy sincero conmigo mismo y acepto mi naturaleza salvaje. Él no. ¡Pero os daremos una lección de humildad! ¡Venid!"
sensei.entry.Guard1_Butcher_Sensei = "El Carnicero me mostró de qué forma el dolor revela nuestra auténtica naturaleza. ¡Ahora soy libre! Y tú también puedes hallar la felicidad, ¡no te resistas!"
sensei.entry.Guard1_Hermit_Sensei = "¡El cambio es inminente! He cruzado medio mundo para aprender esto, he sacrificado tanto... ¡La sabiduría del Maestro es todo cuanto tengo!"
sensei.entry.Guard1_Lynx_Sensei = "¿Te gustan mis tatuajes? En la tierra en la que nací, los más fuertes los reciben como recuerdo de sus hazañas. Pronto serás parte de la imagen tú también..."
sensei.entry.Guard1_Wasp_Sensei = "¿Crees en la suerte? Yo creo que hoy voy a tener suerte, porque te voy a quitar toda tu pasta. ¿Aún crees que vas a tener suerte, anciano?"
sensei.entry.Guard1_Widow_Sensei = "Mi señora es como una hermana para mí; siento su dolor. Me ha prohibido que toque al príncipe, ¡de modo que mi ira caerá sobre ti!"
sensei.entry.Guard2_Butcher_Sensei = "¡La presa cae en el saco! La filosofía es para cretinos. Por lo que a mí respecta, me gusta jugar con navajas. ¿Quieres jugar conmigo?"
sensei.entry.Guard2_Hermit_Sensei = "El Maestro nos ha hablado del mundo de las sombras, de sus habitantes y sus inminentes fuerzas que compartirá con nosotros. ¿Crees que te permitiré arrebatarnos todo esto?"
sensei.entry.Guard2_Lynx_Sensei = "Nuestro clan hace trabajos que son demasiado sucios hasta para los dioses. Resolvemos problemas y subsanamos los errores de otros. Y tú eres uno de esos."
sensei.entry.Guard2_Wasp_Sensei = "¿Amenazas a mi capitana? Me salvó de la esclavitud, y juré ganarme mi libertad trabajando. Que los espíritus se apiaden de ti..."
sensei.entry.Guard2_Widow_Sensei = "¡Mi señora es bellísima! No soy digno de ver su rostro... Ahora mi vida le pertenece. Protegeré su honor hasta mi último aliento."
sensei.entry.HermitYoung_Greetings = "Eres víctima de las circunstancias, príncipe; un sacrificio por el bien común. Mi escuela alcanzará la grandeza, ¡y dará comienzo la época dorada de las artes marciales!"
sensei.entry.Hermit_zone2_1 = "Estás entre la espada y la pared, mi señor. Admito que te traicioné, pero no tenía elección, pues el futuro de mi escuela está en juego."
sensei.entry.Hermit_zone2_2 = "Lince, ese joven arrogante, no se ha encargado de su tarea. Tendré que hacer su trabajo. Discípulos: ¡centraos y adelante!"
sensei.entry.LynxYoung_Greetings = "No puedo marcharme sin más, ya me han pagado por la vida del príncipe. No es nada personal, anciano."
sensei.entry.Lynx_Sensei_1 = "No escuches al príncipe, anciano, que se ha vuelto majareta. Estamos llevando a su alteza de vuelta a casa antes de que se haga daño. No hace falta tu ayuda."
sensei.entry.Lynx_Sensei_2 = "¿Seguro? Porque lo que yo veo es un hombre asustado rodeado de rufianes. Algo me dice que el príncipe dice la verdad. ¡Alejaos de él!"
sensei.entry.Lynx_Sensei_3 = "Haz lo que quieras, que a mí no me pagan por hablar. Dos cabezas dan más dinero que una. ¡A por ellos, muchachos!"
sensei.entry.NAME_BUTCHER = "CARNICERO"
sensei.entry.NAME_HERMIT = "ERMITAÑO"
sensei.entry.NAME_LYNX = "LINCE"
sensei.entry.NAME_PRINCE = "PRÍNCIPE"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "AVISPA"
sensei.entry.NAME_WIDOW = "VIUDA"
sensei.entry.OK = "VALE"
sensei.entry.Prince_Intro = "¡Socorro, esta gente quiere matarme!"
sensei.entry.Prince_zone3_1 = "¡Cómo osas mancillar mi hombre! Serás... ¡Miserable desgraciado! ¡He vuelto para poner fin a tu reinado de crueldad!"
sensei.entry.Prince_zone6_1 = "¡Aquí estás, mi leal amigo! Mira, la justicia vuelve a triunfar, el Shogun es mi fiel perro. ¡Su mente es mía!"
sensei.entry.Prince_zone6_2 = "¡¿Tú también quieres ocupar mi trono, anciano?! ¡Es mío por derecho natural! ¡Nadie me lo arrebatará!"
sensei.entry.Sensei_arc_intro1 = "Un día estaba yo paseando cuando me encontré con el señor del lugar, que estaba muy agitado..."
sensei.entry.Sensei_zone3_1 = "¿Así que eso es lo que significa tener «suerte»? Comprar tu libertad y vender a tu pueblo a una banda de locos... Con lo amable que fui contigo, príncipe..."
sensei.entry.Sensei_zone4_1 = "¿La Viuda? Claro... Me dijo que tomase la esfera y se la llevara al Shogun, a sus propias manos."
sensei.entry.Sensei_zone6_1 = "¡Detente, príncipe, y mira a tu alrededor! La esfera alimenta tu ira y te está convirtiendo en un monstruo."
sensei.entry.Shogun_zone6_1 = "¡Eres débil! Ni siquiera sirves para ser el bufón de la corte de mi señor. ¡Te aplastaré de un solo golpe!"
sensei.entry.TITLE_PRINCE_EVIL = "PRÍNCIPE MALDITO"
sensei.entry.WaspYoung_Greetings = "¿Qué le digo a mi padre? ¿Que su hija se rindió y perdió un combate contra un anciano? ¡Eso no va a suceder mientras sea la heredera al trono pirata!"
sensei.entry.Wasp_zone4_1 = "¿La Viuda te envía a llevarte la esfera? ¿No eres un poco mayor para esa clase de trabajitos? Bah, a mí qué más me da. A bordo."
sensei.entry.Wasp_zone4_2 = "La cosa es que ya no tengo la esfera: los hombres de la Viuda se la llevaron ayer. No sé quién eres, pero nunca perdono a los mentirosos. ¡Tiradlo por la borda!"
sensei.entry.WidowYoung_Greetings = "El príncipe me humilló al rechazarme y reírse de mis sentimientos, ¡pero ahora contraatacaré! Eres amigo suyo, así que vas a darle este mensaje..."
sensei.entry.Widow_zone5_1 = "¿Has venido a humillarme igual que lo hizo el príncipe? Todos los hombres sois iguales..."
sensei.entry.Widow_zone5_2 = "Me ha estado hablando de tu bondad, honor y dignidad, pero ya no me creo las palabras de ningún hombre. ¡Cada uno de vosotros sufrirá!"
sensei.entry.Zone2_SenseiReminder = "La última vez te conté cómo había salvado al príncipe de unos asesinos. Me he enterado de que un Ermitaño adiestraba en secreto a sus soldados, de modo que ahí nos dirigimos."
sensei.entry.Zone3_SenseiReminder = "El Ermitaño nos contó que el señor de la guerra del príncipe, el Shogun, había traicionado a su señor y pagado a un tal Carnicero para que lo raptase. Había llegado el momento de visitar al bandido."
sensei.entry.Zone4_SenseiReminder = "¡Las tribulaciones del príncipe tenían su origen en una mujer! Ella había ideado un plan para derrocarlo con una esfera mágica que se había llevado al puerto cercano..."
sensei.entry.Zone5_SenseiReminder = "La pirata me habló de la complicada historia de la Viuda y el príncipe. No conseguí hacerme con la esfera, pero me enteré de que el príncipe había ido a las montañas a encontrarse con la Viuda."
sensei.entry.Zone6_SenseiReminder = "¡La esfera mágica enloqueció al príncipe! Le dio un poder inminente... ¡que amenazaba con destruirnos a todos! No podía permitirlo."
sensei.entry.characterSensei = "SENSEI"
sensei.entry.character_Asian = "LOTOS"
sensei.entry.character_Blind = "ARMIÑO"
sensei.entry.character_Fanatic = "CUCHILLA"
sensei.entry.character_Indean = "PUMA"
sensei.entry.character_Philosopher = "CLÉRIGO"
sensei.entry.character_Pirate = "PIRATA"
sensei.entry.character_Ronin = "RONIN"
sensei.entry.character_Sadist = "TORMENTO"
sensei.entry.character_Savage = "CHISPA"
sensei.entry.character_Sister = "ASTRA"
sensei.entry.dlgStoryBtnFight = "LUCHAR"
# END Sensei sensei.entry.

# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Me he acordado de lo que ocurrió al final, ¿volvemos a mi relato?"
sensei.notify.intro = "La ciudad despierta algunos recuerdos. Te contaré mi historia, que ocurrió hace muchos años..."
sensei.notify.more = "Me he acordado de algo más, ¿volvemos a mi relato?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "No estás soñando; he parado el tiempo para llevar la esfera de vuelta a la sombra. Su presencia aquí fue un error causado por la inestabilidad de la Puerta de las Sombras."
sensei.victory.Ancient_zone6_2 = "El cambio es inminente, humano. Por ahora, duerme; cuando despiertes nadie recordará tu hazaña. Ha de ser así. Algún día lo comprenderás..."
sensei.victory.Butcher_zone3_3 = "¡Ji, ji, mira cómo huye el príncipe! Tendrías que haberte visto la cara, anciano. Mira: ¡tu nuevo amigo es un mentiroso pusilánime!"
sensei.victory.Butcher_zone3_4 = "Sé que, en cuanto el príncipe exhale su último aliento, el Shogun no permitirá que yo viva. No soy más que una herramienta; soy prescindible. Por eso, te ayudaré."
sensei.victory.Butcher_zone3_5 = "Cierta mujer convenció al Shogun de que el trono es legítimamente suyo. Le prometió que tendría la esfera y se convertiría en un gran señor de la guerra. Todo eso por ser su señor feudal."
sensei.victory.Butcher_zone3_6 = "Ve al puerto. El Shogun aguarda que llegue un barco con la esfera; es la última oportunidad del príncipe de recuperar su trono."
sensei.victory.Hermit_zone2_3 = "Trata de entenderlo: ¡nuestro arte se esfuma! Para sobrevivir, necesita cambiar. Y yo sé cómo hacerlo. Además, el Shogun me prometió protección a cambio de adiestrar a sus hombres."
sensei.victory.Hermit_zone2_4 = "El Carnicero vive con su banda a poca distancia de aquí. Fueron tus captores, además. Ve: deseo que des con tus respuestas."
sensei.victory.NAME_BUTCHER = "CARNICERO"
sensei.victory.NAME_HERMIT = "ERMITAÑO"
sensei.victory.NAME_PRINCE = "PRÍNCIPE"
sensei.victory.NAME_WASP = "AVISPA"
sensei.victory.NAME_WIDOW = "VIUDA"
sensei.victory.OK = "VALE"
sensei.victory.Prince_zone1_1 = "¡Gracias! Eres noble, pues pocos defenderían a alguien a quien no conocen. Pensaba que la muerte me acechaba, porque esa gente no conoce la piedad."
sensei.victory.Prince_zone1_2 = "Me enteré de algo que no debía saber: mis soldados estudian prácticas prohibidas bajo un tal Ermitaño. Querían eliminarme como testigo..."
sensei.victory.Prince_zone1_3 = "Llevé una unidad de mis hombres hasta él para aclarar las cosas, pero me tomaron prisionero. Sin embargo, la suerte siguió de mi lado y logré huir."
sensei.victory.Prince_zone2_1 = "¡Son mis hombres, no los suyos! Ponerlo al frente de mi ejército fue un error... ¡Si te queda aunque solo sea un ápice de honor, dinos dónde está el campamento de los bandidos!"
sensei.victory.Sensei_arc_outro = "Continuará..."
sensei.victory.Sensei_zone1_1 = "Demasiadas coincidencias. Alguien supo de nuestra visita y avisó a los bandidos. Pero ¿de qué modo está involucrado el Ermitaño? Hemos de averiguarlo. ¡Vamos!"
sensei.victory.Sensei_zone2_1 = "¡Vergüenza tendría que darte! ¡Vender tu orgullo de una forma tan descarada! ¿Crees que la gente seguirá la senda de un traidor? ¿Acaso es buen ejemplo para la juventud?"
sensei.victory.Sensei_zone3_2 = "Respóndeme: ¿por qué lo quiere muerto el Shogun, y cuál es la esfera mágica de la que hablabas?"
sensei.victory.Sensei_zone4_2 = "Hemos de detener al príncipe antes de que encuentre a la Viuda... y la esfera."
sensei.victory.Sensei_zone5_1 = "Te comprendo, de verdad que sí, pero un corazón roto es mal consejero. Te ruego que trates de entenderlo: hay gente que sufre por tu culpa."
sensei.victory.Sensei_zone6_2 = "¡Espera, tengo muchas preguntas! ¿Quién eres? ¿Qué hay tras las puertas? Quiero saberlo..."
sensei.victory.Wasp_zone4_3 = "Detente; ¡te he subestimado, anciano! Me han pagado por realizar la entrega, pero no tengo por qué luchar por el honor de la Viuda. Te mostraré su escondrijo."
sensei.victory.Wasp_zone4_4 = "La Viuda amaba al príncipe, pero este la rechazó, de modo que se buscó un juguete nuevo: el Shogun. La arpía está utilizando al estúpido señor de la guerra para vengarse."
sensei.victory.Wasp_zone4_5 = "La Viuda quiere gobernar a los hombres y enfrentarlos unos con otros. La esfera hará grande a su elegido..., que también será totalmente leal a ella."
sensei.victory.Widow_zone5_3 = "Ya no hay vuelta atrás para mí. Veo que quieres ayudar, pero es demasiado tarde; el príncipe ya se ha llevado la esfera. El Shogun trató de defenderla, pero fue en vano."
sensei.victory.Widow_zone5_4 = "Nunca había visto al príncipe tan... desenfrenado. ¡Sus ojos parecían arder! Le parecía gracioso ejecutar a un traidor en el lugar en que nos conocimos. Yo te enseñaré..."
sensei.victory.characterAncient = "ANCESTRAL"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

