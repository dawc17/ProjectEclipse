uw.blackness_enter_blackness_1 = "Descendencia. Un gran sacrificio. Una esfera. La mente. Carnicería. Siento. Derramarás sangre. Veo dolor. Veo el futuro. Te lo mostraré."
uw.blackness_greeting_blackness_1 = "¿Qué te pasa, Shadow? ¿Te encuentras mal?"
uw.blackness_greeting_lazarus_2 = "¿Simon? ¡Qué desgraciado eres! ¿Por qué trajiste gente aquí? ¡Olerá el rastro de tus pensamientos! ¡Aléjate de aquí antes de que la Oscuridad pruebe tu mente!"
uw.blackness_greeting_may_1 = "¿Oyes eso? ¡Nada! Silencio. Sin el canto de los pájaros, es como si este lugar estuviera congelado en ámbar. ¿Estamos haciendo lo correcto? Tengo un muy mal presentimiento…"
uw.blackness_greeting_saimon_2 = "Estos distinguidos caballeros son tu boleto a la libertad, querido. El grandullón de negro está conectado de alguna manera con el Obelisco y las Puertas. Él te ayuda y tú lo ayudas a él."
uw.blackness_greetingn_saimon_1 = "No me sorprende. Desde que un fragmento de las antiguas Puertas se estrelló aquí, la vida en este lugar ha sido una anomalía estadística. Mantén los ojos abiertos, tenemos que encontrar a Lázaro."
uw.blackness_lose_blackness_1 = "Te quedas aquí. Eternamente. Una sola sangre. Para siempre. Te leeré. Me alimentaré."
uw.blackness_win_sensei = "¡Nos mentiste, hombre de ciencia! ¿A quién hemos liberado? ¿A qué hemos condenado a este mundo? ¡¿Te das cuenta de lo que has hecho?!"
