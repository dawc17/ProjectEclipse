uw.dlgAmericanEvent22Story_May_1 = "¡Está completamente congelada, Sensei! No podemos echarla con vientos como estos rugiendo en la puerta…"
uw.dlgAmericanEvent22Story_Puma_1 = "En problemas, anciano… Nunca pensé que el pasado de mi pueblo me seguiría, pero lo ha hecho. Así que hui para protegerlos. ¡Por favor, escúchame!"
uw.dlgAmericanEvent22Story_Puma_2 = "¿Puedes oír eso también? Cuando era niña, un chamán me habló de un espíritu cuyo aullido levantaba las olas y arrancaba las hojas. ¡Nunca pensé que ese viejo relato resultaría ser cierto!"
uw.dlgAmericanEvent22Story_Puma_3 = "Viene hacia aquí para perseguirnos con su clamor hasta que caigamos sin aliento… ¡Solo por deporte! No conozco ningún otro lugar donde esconderme…"
uw.dlgAmericanEvent22Story_Sensei_1 = "Las puertas de mi morada están abiertas para cualquiera que sufra. Pero es inesperado ver a una pirata dentro de estos muros… ¿Y dónde está tu banda de degolladores, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Los mitos de los chamanes son allegorías. La gente inventó las velas para domar el viento, y desde entonces les ha servido bien. ¡Tú solo eres un cuento de hadas tonto, y Shadow lo demostrará!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "¡Soy el Viento del Lobo! ¡Quien venga a recibirme será apagado como una vela! Y tarde o temprano, derribaré tu puerta. ¡Es solo cuestión de tiempo!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Aullaré-é-é hasta que las hojas cubran los escombros. ¡Nadie encontrará jamás el camino hacia aquí! Audaz e ingenuo… ¿Cómo puedes luchar contra los elementos, mortal?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Qué desgracia… ¡Te has llevado mi poderosa voz! Pero tu fe, muchacha, me devolverá a la vida… ¡Y no vendré solo! ¡Porque somos muchos!"
uw.dlgArkhosGreetings = "¡Fanáticos ofuscados! Me recordáis y me alimentáis con vuestra fe en el Padre. Un padre puede ser estricto, y aceptaréis mi castigo con gratitud..."
uw.dlgArkhosLost = "¿A quién adoraré en esta mi hora final? Oh, Creador, ¿por qué me has abandonado? Me diste el poder para guiarlos, pero te he fallado... otra vez."
uw.dlgArkhosStory1 = "Sé cómo son. Reúnen a adeptos a los que alimentan con mentiras. No escuchéis sus sermones instigadores, porque esa es su principal arma."
uw.dlgArkhosStory2 = "Te equivocas, anciano. También tengo duro hierro para los niños rebeldes. Acabarás rogándome unirte a la familia... pero seré implacable."
uw.dlgArkhosWin = "Ovejas negras, no sois dignos de ocupar un lugar a mi lado. ¡Partid! Daré noticias al Creador de cómo vosotros, los hombres, habéis fracasado nuevamente, y él alimentará a mis hijos."
uw.dlgBerstuuk_Announce = "En busca de conocimiento prohibido, un talentoso científico ha fusionado la ciencia y la magia en su afán por convertirse en un dios. ¡Y la transformación es inevitable! Ahora el bosque es su laboratorio de pesadilla y los humanos son su presa. ¡Solo tú puedes detener esta aterradora metamorfosis! ¡Destierra tu miedo y aventúrate en el corazón de la espesura en busca del falso ídolo!"
uw.dlgBerstuuk_Loose_1 = "¡Cuando viniste a mi puerta, me lo dijiste todo sin palabras! ¡Tiraré de este conocimiento como un hilo delgado hasta que no quede nada!"
uw.dlgBerstuuk_Story_1 = "Sly está afuera, llamando a la puerta del granero… He visto mucho en el bosque por la noche, ¡pero esto es algo nuevo! ¿Qué le pasa?"
uw.dlgBerstuuk_Story_10 = "No las suficientes. La ciencia es impredecible, ¡mírame a mí! Poco a poco acepté el bosque, pero este seguía negándose a aceptarme a mí. Hasta ahora."
uw.dlgBerstuuk_Story_2 = "Para quienes buscan ayuda, el camino lleva a la puerta correcta. Pero Sly parece haber perdido el rumbo… ¡Viejo bribón, cuidado con las manos! ¿Qué pasó?"
uw.dlgBerstuuk_Story_3 = "El bribón buscaba ayuda y la encontró. Vamos al bosque antes de que se lleve lo que les pertenece por derecho. ¡La vida de los hombres!"
uw.dlgBerstuuk_Story_4 = "¿'Hombres'? El pobre infeliz está en shock, ¡no tiene rostro! ¿Qué lo asustó tanto como para que le diera una repentina crisis de conciencia?"
uw.dlgBerstuuk_Story_5 = "¿Puedes oír a los pájaros cantar? A esta hora ya deberían estar gorjeando, pero aquí no hay más que un silencio sepulcral… ¿Qué más acecha en este bosque?"
uw.dlgBerstuuk_Story_6 = "Silencio sepulcral. Silencio sepulcral. La gente necesita ayuda. Tienes que ayu-u-dar. ¡Ayuda ahora!"
uw.dlgBerstuuk_Story_7 = "¡Por los dioses! La gente no suele convertirse en ramas secas y musgo, por muy asustada que esté. ¡¿Qué es esa cosa y dónde está el verdadero Sly?!"
uw.dlgBerstuuk_Story_8 = "Está por aquí en alguna parte. La pequeña mente de Sly ha sido de gran ayuda. Me habló de ti, Shadow... de tu poder especial. ¡Y se me ocurrió una idea!"
uw.dlgBerstuuk_Story_9 = "¿Así que tú eres de quien hablaba la criatura? El bosque vendrá y se llevará todo. ¿Y cuántas de estas vidas 'legítimas' te has llevado, loco?"
uw.dlgBerstuuk_Win_1 = "¡La naturaleza encontrará el camino! Nuestra pelea me ha dicho más de lo que imaginas, Shadow. El bosque recordará. Me consumirá para revivir de nuevo…"
uw.dlgFatumGreetings = "Vuestro valor solo se equipara a vuestra necedad, pero sabía que vendríais, porque vosotros sois mi sino, y yo soy el vuestro. Reescribiré vuestros destinos... para siempre."
uw.dlgFatumLost = "Conozco a la humanidad. Recorre incesantemente de un lado a otro la misma espiral. Ya lo he visto más de una vez. Autodestrucción fulminante. Nada puede cambiarlo. Ese es vuestro sino."
uw.dlgFatumStory1 = "Cuidado, héroe. Las leyes universales que conoces no rigen estas profundidades..."
uw.dlgFatumStory2 = "¡Así es! Mantén atado bien corto al chaval. Lo sé todo acerca de vuestros destinos: quiénes sois y adónde os dirigís. ¿He de deciros quién morirá al final?"
uw.dlgFatumWin = "Vuestro sino se ha cumplido. Ya habíais perdido desde el mismo momento en que atravesasteis el umbral de mi morada. ¿Tendréis el valor suficiente para reescribir vuestra historia?"
uw.dlgFungusGreetings = "Has envenenado la tierra y ahora mis setas se están muriendo. Absorberán tu mente y todos seremos uno, humano. ¡Ese será el final de tu historia!"
uw.dlgFungusLost = "Mis hermanos se han acostumbrado a jugar a ser dioses. El culto les vuelve blandos. No obstante, la destrucción se halla en la naturaleza humana: el mundo estará mejor sin ti."
uw.dlgFungusWin = "¡Parte! ¡Y disfruta de los últimos minutos de vuestras frágiles vidas!"
uw.dlgHW21LosePuppeteer_1 = "Ni siquiera confiaría en ti para un papel mudo, Shadow. El escenario no es tu lugar; ¡no avergüences mi oficio!"
uw.dlgHW21StoryArkhos_1 = "¡La plaga llegará a su ciudad, mortales! ¡Inclínense ante el poder de su dios! Y deleiten sus ojos con el brillo del oro, o de lo contrario…"
uw.dlgHW21StoryPuppeteer_1 = "¡Qué sabes tú de arte! ¡Has arruinado mi mayor empresa! Sin embargo… el tercer acto se acerca. ¡Y en él, el héroe dará su último aliento!"
uw.dlgHW21StorySensei_1 = "¿Desde cuándo los dioses del inframundo suben aquí para extorsionar a la gente común? ¡Quítate la máscara, engañador, antes de que tomemos las armas!"
uw.dlgHW21StorySensei_2 = "El teatro debería inspirar, no horrorizar. Y has distorsionado la esencia misma del arte. Te detendremos antes de que tus 'actores' salgan lastimados."
uw.dlgHW21StoryThief_1 = "¡Espera! Soy yo… ¡Sly! ¡No me pegues! Él prometió que todos me temerían… Y que nadie me reconocería. ¿Cómo me delaté?"
uw.dlgHW21StoryThief_2 = "El dueño del teatro ambulante: el Titiritero. Dijo que sería su mejor actuación. ¡Dioses entre la gente! Eso no significaba nada para mí. Pero el dinero, por otra parte…"
uw.dlgHW21WinPuppeteer_1 = "¡Esto es un fiasco! ¡Has arruinado mi maravillosa trama y roto mis máscaras! ¿Cómo voy a montar una obra ahora sin utilería…?"
uw.dlgHW22EnterArchitect = "Toda esta narrativa de fantasía tuya me ha agotado… Ahora vamos a jugar bajo mis reglas. Y te conviene sorprenderme, Shadow…"
uw.dlgHW22LooseArchitect_1 = "Era de esperarse. Conozco todos tus movimientos, Shadow. Después de todo, fui yo quien te inventó. Quizás no estaba en mi mejor momento entonces… Pero ahora te gustará tu nueva vida."
uw.dlgHW22StoryArchitect_1 = "A eso se le llama un 'cliché', Titiritero. ¿Por qué se les paga a los dramaturgos? ¿Por el número de caracteres? La figura del genio loco que balbucea se ha vuelto trillada, al igual que la figura del héroe…"
uw.dlgHW22StoryArchitect_2 = "Eso es todo. ¡Reescribiremos tu mundo desde cero! ¡Contemporáneo, creativo, relevante! ¿Qué les interesa a los adolescentes hoy en día? ¿Por qué no dices nada, Shadow? Ah, sí…"
uw.dlgHW22StoryPuppeteer_1 = "¡Llaman a la puerta... un golpe inesperado a tu puerta! ¿Es un viajero que viene de visita o algo más? Intrigante, ¿no lo crees?"
uw.dlgHW22StoryPuppeteer_2 = "Sabía que dirías eso, anciano. ¿Qué más se puede esperar de personajes inventados? El papel lo aguanta todo… ¡Pero el público nunca lo hará!"
uw.dlgHW22StoryPuppeteer_3 = "Soy simplemente un esclavo del escenario, eso es todo. Y mi nueva obra maestra hablará de un encuentro con el creador... de los tormentos de la predestinación y el libre albedrío…"
uw.dlgHW22StorySensei_1 = "Sea lo que sea lo que hayas ideado, Titiritero, no seguiremos jugando a tus juegos. El arte puede causar dolor, pero no de la manera en que tú lo practicas."
uw.dlgHW22StorySensei_2 = "Has actuado demasiado y ya no puedes distinguir la realidad de tus fantasías, artista… Estás loco."
uw.dlgHW22StorySensei_3 = "Tus palabras son peculiares y preocupantes, extraño… No sé qué locura pasa por tu cabeza, pero Shadow te la quitará a golpes."
uw.dlgHW22WinArchitect_1 = "Quizás la creación ya no pertenezca a su creador y haya cobrado vida propia… Me has sorprendido. Quiero ver hacia dónde va la historia ahora."
uw.dlgHoaxenGreetings = "Toda tu vida es solo una ilusión. Y nosotros somos sus creadores. Te volveremos loco, mientras que otros cuentan con la fuerza bruta. Fuego, agua, enfermedades... ¡ja!"
uw.dlgHoaxenLost = "¿Dónde estás, hermano? ¡Ya no oigo tu voz! Sin duda estar encerrado solo es peor que el fuego o la espada... Marchad, estúpidos. El Padre aguarda."
uw.dlgHoaxenStory1 = "¿\"Nosotros\"? Sombra, parece que nuestro enemigo ha perdido la cabeza. Disculpa, ¿con cuál de tus personalidades estamos hablando? ¿Quizá tu \"hermano\" sea más racional?"
uw.dlgHoaxenStory2 = "¿Te ríes de nosotros, humano? Mi hermano sugiere que enviemos vuestras almas a los abismos de la pena eterna... Entonces vuestro mundo se rendirá, sin verter una sola gota de sangre."
uw.dlgHoaxenWin = "Os hubiera matado, porque mi misericordia no tiene límite, pero mi hermano es menos tolerante: sois libres de partir, si es que no perdéis la cabeza mientras salís."
uw.dlgHunter_enter_hunter_1 = "¡Tú! ¡Oye, túuu! Has venido a terminar lo que empezaaaste, ¿verdad? ¿Tú? Hay un poder en ti. Me haaabla. ¡Silencio! ¡O te obligaréee a callar!"
uw.dlgHunter_greeting_may_1 = "¡Mira! Hay algo dentro del cristal… ¿Se supone que debe ser así?"
uw.dlgHunter_greeting_saimon_1 = "Qué extraño… Esperaba que Lázaro pulverizara el Obelisco. Temía la carnicería, pero parece que solo quedamos tú y yo. Estoy intrigado."
uw.dlgHunter_greeting_saimon_2 = "La Sala de Concentración. ¿Ves ese cristal en el centro? Así es como el Obelisco acumula energía sombría... el corazón de las tinieblas, por así decirlo."
uw.dlgHunter_greeting_sensei_1 = "El silencio es un mal augurio, mi racional amigo. Puede hablar más fuerte que las palabras más ensordecedoras. Hmm… ¿Dónde estamos? ¿Qué es este lugar tan extraño?"
uw.dlgHunter_greeting_sensei_2 = "Lo dudo, mi querida… Este lugar se ve diferente de la última vez que lo vi. Estoy empezando a pensar que el viejo tenía razón…"
uw.dlgHunter_loose_hunter_1 = "Acuéééstate. Te dejaaaré aquí para sieeempre. No causes mááás daño."
uw.dlgHunter_win_hunter_1 = "¡Detente, humano-Shadow! ¡No dejes que se extieeenda! Serás como ééél. ¡Serás engañaaado! Pero aún tienes una oportunidaaad."
uw.dlgIE21AnnounceAssistant_1 = "¿Quién demonios es ese? ¿Qué estás haciendo en nuestro mundo y por qué deberíamos escucharte?"
uw.dlgIE21AnnounceAssistant_2 = "¡Ja! ¡No sé de dónde saliste, pero no te quedarás aquí por mucho tiempo!"
uw.dlgIE21AnnounceAssistant_3 = "¡Oye, Shadow, este bravucón ha ido demasiado lejos! ¡Vamos a enseñarle algunos modales!"
uw.dlgIE21AnnounceBoss_1 = "¡Patéticos mortales! ¡Inclínense ante mi voluntad y gloria, o los obligaré a arrodillarse!"
uw.dlgIE21AnnounceBoss_2 = "Cómo te atreves a hablarme así... ¡Soy Ravana, el conquistador de los tres mundos!"
uw.dlgIE21AnnounceBoss_3 = "Esta es tu última oportunidad para arrodillarte. ¡Niégate y te cortaré la cabeza!"
uw.dlgIE21AnnounceSensei_1 = "Shadow, presiento que se acerca una amenaza misteriosa. Algo maligno ha logrado entrar a nuestro mundo una vez más."
uw.dlgIE21Boss_After_Loose = "¡Si toda la gente de este mundo es tan débil, then su conquista es solo cuestión de tiempo!"
uw.dlgIE21Boss_After_Win = "¡NECIOS! Me retiro por ahora, pero no me vencerán tan fácilmente. ¡Regresaré!"
uw.dlgIndia22Story_May_1 = "Y así empezaron a pasar hambre… ¿Qué pudo haber querido este demonio en su alegre celebración? ¿Cómo unos humildes granjeros pudieron haber atraído a semejante depredador?"
uw.dlgIndia22Story_Rakshasa_1 = "Tienes un aroma interesante, humano. ¡Sin duda sabrías igual de bien! ¿Puedes oír mi estómago rugir? ¡Un corte de carne selecto para acompañar mi arroz sería muy bienvenido!"
uw.dlgIndia22Story_Rakshasa_Lose = "Por fortuna para ti, nuestra pelea me ha agotado. Además, mi hambre está saciada… por ahora. ¡Abriré el apetito de nuevo y volveré a cazar!"
uw.dlgIndia22Story_Sensei_1 = "Cuéntame de él, viajero. Por tus ropas, veo que has viajado lejos. ¿Qué problema aflige a tu hogar?"
uw.dlgIndia22Story_Sensei_2 = "¡Frena tu apetito, demonio! ¡No habrá invitación al festival de la vida para alguien que roba la vida misma!"
uw.dlgIndia22Story_Sensei_Win = "No es la magia lo que hace florecer un jardín, es el trabajo duro. Y vas a demostrarlo tú mismo: ayuda a tus vecinos a restaurar su granja, o de lo contrario…"
uw.dlgIndia22Story_Sitaram_1 = "He escuchado la historia de tu vida. ¡Que los dioses te recompensen según tus méritos! Traigo malas noticias: un espíritu maligno ha aparecido en mis tierras…"
uw.dlgIndia22Story_Sitaram_2 = "¡La maldad de este demonio solo se compara con su hambre! Nos estábamos preparando para celebrar el Bohag Bihu cuando, de repente, esta… criatura apareció y devoró todos nuestros brotes!"
uw.dlgIndia22Story_Sitaram_3 = "¡Como Agni es mi testigo, mi señora, yo me pregunto lo mismo! Ahora esperamos con temor el atardecer… ¡Venga conmigo, se lo ruego!"
uw.dlgIndia24_Enter_Puppet_1 = "¿Tienes el espíritu necesario para dirigir el destino? Decide el mío, humilde servidor de las artes que soy. Solo en el combate entiendes verdaderamente qué es qué. ¡Sé audaz, Shadow, al ataque!"
uw.dlgIndia24_Story_Dandy_1 = "¡Abran, o derribaré esta maldita puerta! Sé que están en casa, ¡puedo oírlos! ¡Prenderé fuego a esta choza si no me dan refugio!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Oh, con qué fiereza se aferran los mortales a la vida. No fui yo quien eligió este trabajo, y no derramaré lágrimas venenosas por ello… ¿Por qué me has hecho esto?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Su corazón está lleno de amor. Los dioses nos crean puros, pero nosotros elegimos nuestro propio camino. Nrityu empieza a entender esto mientras escucha la historia de la joven."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, a tu actuación le falta pasión y compromiso. Te daré otra oportunidad. ¡No lo actúes, vívelo!"
uw.dlgIndia24_Story_Puppet_1 = "¡Toc, toc! ¡Hola, viejos amigos! La voz del destino está sobre nosotros... ¡y viene en camino! ¡Su dobladillo rojo arde como la vida misma al morir el día!"
uw.dlgIndia24_Story_Puppet_2 = "¿Acaso viene por tu alma? Contempla una historia tan antigua como el mundo mismo: la leyenda de Nrityu, cuyo destino era ser una segadora de vidas."
uw.dlgIndia24_Story_Puppet_3 = "Los fantasmas no paran de parlotear. No puedes confiar en ellos. Y además, esta no es la historia que les corresponde contar. Te mostraré la verdad a través de sus ojos. Shadow, eres el único que puede entenderlo."
uw.dlgIndia24_Story_Sensei_1 = "Esa voz… Parece que nuestro viejo adversario trama algo una vez más. ¿Quién será la víctima esta vez? Veo a un hombre corriendo hacia la pagoda…"
uw.dlgIndia24_Story_Sensei_2 = "Tus ropas están cubiertas de suciedad y hollín, extraño. Y tu tono me inquieta. ¡Explica quién eres y qué asuntos tienes en nuestra puerta!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "¡Atrás! ¡Yo no quería esto! Mi familia me tenía miedo y pensé que esta era mi oportunidad… Dandy prometió llevarme con él, si tan solo ayudaba…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "¡Ahí tienes! Caes en un sueño eterno, aunque no lo mereces. Pero no me corresponde a mí juzgarte, esa es la vocación de otro. Yo solo soy la escolta."
uw.dlgIndia24_Story_Win_Puppet_4 = "Al igual que tú, Shadow. Quiero que sigas el camino de Nrityu. Le tomó una eternidad comprender su lugar."
uw.dlgIndia24_Story_Win_Puppet_6 = "¡El espectáculo continúa! Tú, Shadow, serás la estrella, y mis actores serán tu elenco secundario. ¡La historia de Nrityu será nuestra mayor producción!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Esta historia cala hondo, incluso para ti. ¡Estoy sorprendido! Pero ¿cuál es la moraleja aquí? ¿Por qué nos estás mostrando esto?"
uw.dlgMegalithGreetings = "Esta mina es sagrada. ¿Por qué estás aquí? Ve y afronta tu destino con honor. Lo último que oirás será la tierra temblando bajo tus pies."
uw.dlgMegalithLost = "¡Maldición! ¿Tendré que volver a esperar miles de años? ¡He movido continentes! ¡Mi misión era purificar la tierra!"
uw.dlgMegalithWin = "He tratado a los humanos con amabilidad, un rasgo poco común entre los eternos. He ayudado muchas veces a tu especie, ¡así que corre y despídete de tus seres queridos!"
uw.dlgRaidIntro1 = "¿Tratas de enmendar tu error? Has abierto la Puerta, pero solo los eternos pueden eliminar el contagio de Sombra. Como no eres uno de nosotros, eres débil."
uw.dlgRaidIntro2 = "Vas a morir, como los demás. El magma corre por mis venas, y cubrirá toda la tierra, purificándola para una nueva vida."
uw.dlgRaidStory1 = "¿En qué sótano estamos y qué hacemos aquí?"
uw.dlgRaidStory2 = "Es la antesala del dominio de los eternos. Su sueño duró miles de años, pero la Puerta de las Sombras ha puesto al mundo en peligro. Han despertado."
uw.dlgRaidStory3 = "Bien... ¡eso significa que nos ayudarán a ocuparnos de la Puerta sin problema!"
uw.dlgRaidStory4 = "Oh, no. Destruirán la Puerta, pero también a toda la humanidad. Para ellos no es más que otro ciclo de destrucción y creación."
uw.dlgShurale_Announce = "Despertado por bandidos codiciosos, el espíritu del bosque ahora se venga de los inocentes. La criatura busca el cofre de recuerdos robado, el contenedor de su antigua magia. Solo aquellos cuyos corazones alberguen un dolor verdadero podrán calmar la furia de la criatura. El precio, sin embargo, será alto…"
uw.dlgStoryBtnFight = "LUCHAR"
uw.dlgStoryBtnMore = "MÁS"
uw.dlgVolcanoGreetings = "De todos los eternos, yo fui el primero en despertar. Daré muerte a muchos luchadores. Cumpliré mi misión."
uw.dlgVolcanoLost = "¡Ya basta! Me doy por vencido. Pero escucha: has despertado a mi hermano. Que no te engañe su aspecto: ¡es rápido y mortífero!"
uw.dlgVolcanoStory1 = "He visto unas viviendas medio en ruinas y una enorme estatua. ¿Vive algún humano aquí?"
uw.dlgVolcanoStory2 = "Solo los fanáticos. Adoran a los eternos con la esperanza de ser salvados. Lo cierto es que su fe les ciega. Si no lo conseguimos, no tardarán en conocer la verdad."
uw.dlgVolcanoWin = "He dicho a mis hermanos que es mi deber decidir el destino del planeta. ¡Contemplad, incrédulos, cómo mi fuego cubre la tierra!"
uw.dlgVortexGreetings = "¡Las aguas oscuras engullirán la tierra y la Puerta de las Sombras! ¡Su secreto se perderá en el abismo y no quedará nadie para contarlo!"
uw.dlgVortexLost = "Por primera vez en miles de años vence un humano. ¡Qué grande es tu voluntad de vivir! Pero hagas lo que hagas, el final será siempre el mismo: morirás."
uw.dlgVortexWin = "Durante miles de años, he contemplado la destrucción de tu especie. Hay cierta belleza en ella. Creo que te mantendré con vida; solo por diversión."
uw.dlgWhisperGreetings = "Parece que alguien no puede esperar para descubrir su destino. ¡Dame tu mano y contempla el espejo!"
uw.dlgWhisperLost = "¿Aún sigues con vida? ¡Entonces todavía no estás bajo mi poder! Fatum adivinará tu destino, y luego regresaré a mi mundo… ¡habiéndote advertido que camines con cuidado con los espejos!"
uw.dlgWhisperWin = "¡Te llevaré conmigo al reino de la ceniza, el espíritu y la noche eterna! Confía en mí: mírame a los ojos y no apartes la mirada."
uw.dlg_American_25_Loose_1 = "No sabes a quién proteges, Shadow. No te lo agradecerán. Solo se burlarán a tus espaldas. Salvajes… ¿y yo soy el monstruo?"
uw.dlg_American_25_Story_1 = "May se ha ido. Se la llevó algo apenas humano. Sin embargo, no hubo gritos ni señales de lucha… como si se hubiera marchado por su propia voluntad."
uw.dlg_American_25_Story_2 = "No estamos solos en esto. Otros como May (jóvenes, fuertes) también han desaparecido. Ella sintió que se acercaba… y se llenó los bolsillos de pólvora."
uw.dlg_American_25_Story_3 = "Su rastro es claro. Debemos encontrarla antes de que lleguen las lluvias, o se perderá para siempre. ¡Ven, Shadow!"
uw.dlg_American_25_Story_4 = "Te olí en el momento en que pisaste esta tierra maldita. ¿Por qué has venido? ¿A pisotear mi dolor? No tienes honor, al igual que ellos tampoco lo tenían."
uw.dlg_American_25_Story_5 = "Sabía que aparecerías, chamán. Devuelve los niños a sus familias y a nuestra amiga a nosotros. Luego vete a pudrirte en tu montaña de ceniza."
uw.dlg_American_25_Story_6 = "Ceniza a la ceniza. Y a la ceniza regresarás, mortal…"
uw.dlg_American_25_Win_1 = "¡Espera! Fui con él por mi propia voluntad. Su forma es bestial, sí, pero su corazón es humano. Y sufre… ¡Le robaron a su hijo!"
uw.dlg_CHN_NY25_Announce = "¡Sumérgete en la historia de un héroe de eras pasadas, distingue la verdad de la fábula y ayuda a forjar una nueva leyenda! ¡Enfréntate a un misterioso culto que utiliza el nombre de un gran héroe como capa para ocultar sus atrocidades! ¡Regresa al lugar donde empezó todo y ayuda a un bribón fugitivo a descubrir su verdadero heroísmo!"
uw.dlg_CHN_NY25_Loose_1 = "¡No, debemos seguir luchando! Nadie creería que un simple granjero pudiera derrotar a un culto siniestro tan fácilmente. ¡Tienes que darlo todo!"
uw.dlg_CHN_NY25_Story_1 = "El Culto del Sol tiene la tradición de visitar el lugar de nacimiento de su gran héroe una vez al año. Pero cada vez resulta ser un desastre…"
uw.dlg_CHN_NY25_Story_2 = "¿Nació humano? Qué curioso. Me parece que esta gente no trae regalos a la aldea…"
uw.dlg_CHN_NY25_Story_3 = "¡No dejan nada intacto! ¡Roban el ganado de los aldeanos, arrasan los cultivos en un frenesí de embriaguez, rompen ventanas y buscan peleas!"
uw.dlg_CHN_NY25_Story_4 = "Pero ¿por qué los aldeanos no se defienden? ¡Esta es su tierra y su leyenda!"
uw.dlg_CHN_NY25_Story_5 = "Están destrozados. El héroe que les dio esperanza se ha ido y los cultistas cometen maldades en su nombre. ¡Debemos devolverles la esperanza una vez más!"
uw.dlg_CHN_NY25_Story_6 = "Di que has venido a comprobar que todo esté listo para la 'festividad'. ¡Y lucharemos! ¡La gente del pueblo verá que se puede hacer frente al culto!"
uw.dlg_CHN_NY25_Story_7 = "Muy bien, como quieras… Déjame entrar en personaje. '¡Oye, muchacho, cómo te atreves a vestir los ropajes de nuestro héroe! ¡Fuera de aquí, tenemos un banquete que preparar!'"
uw.dlg_CHN_NY25_Story_8 = "Puede que no sea un héroe de leyenda, ¡pero su espíritu vive en esta tierra! ¡Él me guiará en mi hora más oscura y me dará valor! ¡Al ataque!"
uw.dlg_CHN_NY25_Win_1 = "No esperaba tal velocidad de un simple hombre… ¡Casi vences a nuestro campeón! Debemos hacer de ti un ejemplo, para que otros no se hagan ideas…"
uw.dlg_NY25_Loose_1 = "Tus recuerdos son vívidos y el dolor habla más fuerte que la razón. Te quedarás aquí conmigo. Descansa un rato... el sueño llegará pronto."
uw.dlg_NY25_Story_1 = "¡Bienvenidos! Esta cabaña perteneció una vez a mi familia. Tantos recuerdos… Quédense todo el tiempo que quieran. Aquí hay todo lo necesario para descansar."
uw.dlg_NY25_Story_2 = "Pero nos has puesto en peligro tantas veces, ¿y ahora nos ofreces alojarnos en la casa de tu familia? ¿Es esto algún tipo de truco?"
uw.dlg_NY25_Story_3 = "¡Es solo la voz de la conciencia que habla! Me he dado cuenta de que me he aprovechado de la amabilidad de los demás durante demasiado tiempo. Pero ahora, deseo hacer el bien."
uw.dlg_NY25_Story_4 = "No estamos solos… Hay gente reuniéndose frente a la cabaña. ¿Qué quieren a estas altas horas de la noche? Nos están pidiendo que salgamos."
uw.dlg_NY25_Story_5 = "¡No lo hagan! ¡Los fantasmas los destruirán! No son más que espectros de recuerdos dolorosos. ¡El espíritu del bosque ha venido por su cofre! ¡Recuperémoslo!"
uw.dlg_NY25_Story_6 = "¿Un cofre? ¡Así que por eso ha estado desapareciendo gente en el bosque! ¿Por qué nos traicionaste, Sly? ¡Te habríamos ayudado en esta noble misión de todos modos!"
uw.dlg_NY25_Story_7 = "No lo entienden. Si escucho su voz, perderé el control... y yo también desapareceré. Mientras lleve un pedazo de ella conmigo."
uw.dlg_NY25_Story_8 = "Abre la puerta, me estoy congelando aquí afuera, papá. La casa está fría y yo no estoy dentro. Te mostraré un lugar donde podremos estar juntos una vez más."
uw.dlg_NY25_Story_9 = "¡Detente! No vayas al bosque, ¡perderás el camino! ¡No sé de quién es la voz que escuchas, pero ciertamente no es humana!"
uw.dlg_NY25_Win_1 = "¡Despierta, Sly! Devuelve el cofre al espíritu mientras esté débil. Deja que vea que la humanidad puede superar su propia codicia."
uw.saturn_enter_saturn_1 = "Te haré tragarte tus palabras. Y tus amigos mirarán. La única forma de salir de mi prisión es a través del patíbulo. ¿Quién quiere ir primero?"
uw.saturn_greeting_saimon_1 = "Nuestro gobernante, el Patriarca, estudió el portal durante años. Luego, un día, se recluyó en sí mismo. Más tarde, erigió el Obelisco, y este le hizo algo a nuestro mundo…"
uw.saturn_greeting_saimon_2 = "Shadow es similar al Obelisco a nivel molecular. Hay alguien que nos ayudará a usar eso contra el Patriarca. Por eso estamos aquí, en la cámara de Saturno…"
uw.saturn_greeting_saimon_3 = "Mil disculpas, mi señora. Sin embargo, debemos liberar a Lázaro. Por favor, llévenos a su celda y no la molestaremos más."
uw.saturn_greeting_saturn_1 = "¿Van lejos, muchachos? ¡Vinieron a mi prisión por su propia voluntad! Me pregunto... ¿eso es valentía o estupidez? Tú, el larguirucho... ¡respóndeme!"
uw.saturn_greetingn_May_1 = "Pero ¿qué tiene eso que ver con nosotros?"
uw.saturn_lose_saturn_1 = "Ya es suficiente para ti. Si Lázaro se junta con escoria como ustedes, no hay peligro para el Patriarca. ¡Fuera de aquí, mocosos! No están en mi lista."
uw.saturn_win_saturn_1 = "Nunca encontrarán a Lázaro. Ese bribón escapó de mi prisión y huyó a los pantanos. ¿Ustedes también quieren perecer? ¡Entonces vayan tras él!"
uw.summerfest25_story2_1 = "Vaya, vaya… Tenías tantas ganas de encontrarme que pensé que te haría el favor. Además, todo el mundo estaba esperando este momento."
uw.summerfest25_story2_2 = "¿'Todo el mundo'? Deja la farsa. Sabemos exactamente quién eres, y cómo usas a los demás solo para deleitarte con su miseria."
uw.summerfest25_story2_3 = "¡Solo un pequeño cameo y, bum, soy tendencia! Sinceramente, no esperaba ser tan popular."
uw.summerfest25_story2_4 = "Tu ingenio no te salvará. Pagarás por mis ojos y por todo el mal que has hecho. ¡Tu retorcido juego de jugar a ser dios termina aquí!"
uw.summerfest25_story2_5 = "¿En serio, Ermine? Ese tipo de comentarios pasó de moda con los teléfonos plegables. Estamos en 2026, intenta mantenerte al día."
uw.summerfest25_story2_6 = "Lo que sea que el Arquitecto esté planeando… hay una oscuridad a su alrededor. Una fuerza tan malévola que es casi tangible."
uw.summerfest25_story2_7 = "Con cada palabra que dice, me descubro creyendo más y más en la historia de Ermine. El Arquitecto es peligroso... y hay que detenerlo."
uw.summerfest25_story2_defeat_1 = "¡Oh, no, qué decepción! El público esperaba más. Parece que simplemente tendré que subir la apuesta la próxima vez."
uw.summerfest25_story2_win_1 = "¿Por qué el mundo es tan cruel? ¿Por qué debemos sufrir? ¿Por qué tuve que cegarme a mí misma? Respóndeme, Arquitecto... ¡¿por qué duele vivir?!"
