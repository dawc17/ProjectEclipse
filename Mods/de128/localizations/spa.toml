sensei.defeat.OK = "VALE"
sensei.defeat.Sensei_defeat1 = "No, espera... No ocurrió así... Disculpa la mala memoria del anciano."
sensei.defeat.Sensei_defeat2 = "Creo que ocurrió de otra forma... Los recuerdos pueden ser muy frágiles."
sensei.defeat.Sensei_defeat3 = "Creo que no fue así como acabó la lucha. Déjame que trate de recordar..."
sensei.defeat.Sensei_defeat4 = "Mis recuerdos son tan borrosos... Creo que gané esa batalla."
sensei.defeat.Sensei_defeat5 = "No, no fue así. Me parece que gané... Es probable."
sensei.defeat.characterSensei = "SENSEI"
