uw.Tenebris_greetings_1 = "Viaggiatore, ti trovi al confine della realtà. Questa è l'ultima frontiera. Oltre questa linea c'è il vuoto in cui nascono i mondi. Sono stato io a generare le loro luci e le loro tenebre!"
uw.Tenebris_greetings_2 = "Ombra, il portale alle sue spalle potrebbe essere la nostra unica possibilità di salvezza. Gli Immortali hanno detto che avrebbero distrutto il nostro mondo. Forse hanno intenzione di usare il portale?"
uw.Tenebris_greetings_3 = "Non sopravvivrai al portale! È un territorio inesplorato, l'oscurità dove vengono creati i mondi. Ma tu non puoi creare, solo distruggere. Il portale ti inghiottirà per sempre!"
uw.Tenebris_greetings_4 = "È un rischio, ma che altro possiamo fare? Potremmo impedire agli Immortali di attraversare il portale... oppure potremmo causare una grande catastrofe."
uw.Tenebris_loses = "Hai paura dell'ignoto che si nasconde nell'oscurità? Ora dovrai affrontarlo da solo! Il mondo finirà in cenere e da essa nascerà di nuovo, seguendo la spirale della storia."
uw.Tenebris_wins = "Sciocco ostinato! Vuoi umani sapete risolvere i problemi solo con la forza bruta. Ma l'universo non funziona così. In tutti questi anni, non avete imparato nulla..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Alzati, fantoccio! Combatti! Non importa se vinci o perdi. Mentre combatti, mi servi!"
uw.War_AfterWin = "Impostore! Dov'è la tua furia? Come fai a combattere senza? Combatti con me! Iniziamo un'altra danza delle lame! So che in te c'è voglia di lottare!"
uw.War_Greetings1 = "Che bella giornata! Sento che è in arrivo un combattimento, come una tempesta. Tuoni. L'incredibile furia delle legioni. Tutte offerte sul mio altare!"
uw.War_Greetings2 = "In lei ribollono rabbia e sete di sangue. Adora combattere senza fine, ma a che scopo? Cosa troverà in cima alla sua montagna di teschi?"
uw.War_Greetings3 = "Non senti il brivido della battaglia? Fuoco, passione, potenza! Mostrami cosa sei in grado di fare! Dimostra di essere alla mia altezza o muori!"
uw.ZONE_RAID = "Mondo Sotterraneo: Livello 1"
uw.ZONE_RAID1 = "Mondo Sotterraneo: Livello 2"
uw.ZONE_RAID2 = "Mondo Sotterraneo: Livello 3"
