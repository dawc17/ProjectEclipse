uw.BLACKNESS_TITLE = "L'Oscurità"
uw.BODY_BERSTUUK = "Forma di Berstuuk"
uw.BOSS_BISON_21 = "ADANTI"
uw.BOSS_BISON_Title = "Adanti"
uw.BOSS_LAMB = "L'AGNELLO"
uw.BOSS_RAVANA = "RAVANA"
uw.BOSS_RAVANA_Title = "Ravana"
uw.CharacterIndia24Nrityu = "NRITYU"
uw.DEMON_RAID = "GUANTO DI SFIDA"
uw.DEMON_RAID_Title = "Guanto di Sfida"
uw.EARTHQUAKE = "Scosse periodiche"
uw.EnterPortal_ActScreen = "Portale"
uw.FRAGILITY = "Maggiore vulnerabilità nell'area indicata"
uw.Gatekeeper_greetings_1 = "Aria strana? Aria strana! Arrria strrrana!"
uw.Gatekeeper_greetings_2 = "Non felici, non felici, non felici! Fatto, fatto, fatto!"
uw.Gatekeeper_greetings_Assistant_1 = "Shadow! Ti sei finalmente svegliato!"
uw.Gatekeeper_greetings_Assistant_2 = "Fa così freddo qui! Non mi sento già più le dita... Dove siamo? L'aria è così strana."
uw.Gatekeeper_greetings_Assistant_3 = "Ma perché ho la sensazione che ci capisca?"
uw.Gatekeeper_greetings_Sensei = "Indietro, May! Non sappiamo cosa voglia! Il mondo degli Immortali è stato scosso più di quanto pensassi. Dopo quello che abbiamo fatto, non sono felici che noi siamo qui."
uw.Gatekeeper_greetings_Sensei_2 = "Calma, ora. Non fare movimenti bruschi. Sembra che questa creatura non sia molto intelligente."
uw.Gatekeeper_greetings_Sensei_3 = "Non è importante ora. Attraversare il portale è stata una nostra scelta e dobbiamo risponderne. Vuole combattere, non abbiamo scelta, Shadow."
uw.Gatekeeper_lost_Saimon = "Mi aspettavo di più dal portale... Sembra che il viaggio abbia prosciugato le tue forze e i tuoi legami molecolari si siano indeboliti. Interessante... dovremo condurre qualche altro test."
uw.Gatekeeper_win_Saimon = "Per secoli, questo portale traballante ci ha ricordato che ci sono forze oltre la nostra comprensione. Poi sei arrivato tu..."
uw.HARD_GROUND = "Quando cadi a terra, subisci danni."
uw.HEAD_BERSTUUK = "Maschera di Berstuuk"
uw.HEALTH_DROPS = "La vita cala col passare del tempo"
uw.HOT_GROUND = "Terreno bollente"
uw.HW20Arkhos1 = "Non mi serve la preveggenza per capire che il fuoco della fede consumerà sia i deboli che i ciechi. Ho portato delle candele nere, in modo che tutti possano vedere questa verità chiaramente quanto me!"
uw.HW20Fatum1 = "I confini tra i mondi si assottigliano: questa è la notte migliore per le profezie! L'aria freme di magia, e tra le mie mani sono avvolti i fili stessi del destino!"
uw.HW20Fatum2 = "Per me la divinazione è un gioco: posso disporre del destino dei mortali come mi pare. Ma voi, amici miei, siete un'altra faccenda. Prego, sedetevi!"
uw.HW20Fatum3 = "Sei stato accecato dal tuo odio. Iniziamo. Non parlate, ma ascoltate. Vedo una figura... nera come la notte... piume e ceneri... che mi prende per mano..."
uw.HW20Fatum4 = "Come... come sei arrivata fin qui? Il passaggio per questo mondo ti era stato sigillato!"
uw.HW20Megalith1 = "Parlavi di divinazione e di un ballo in maschera, così ho portato uno specchio magico. Per la prima volta in mille anni riesco a vedere il mio riflesso. Questa maschera mi fa sembrare antico!"
uw.HW20Whisper1 = "Hai giocato a fare profezie, sorellina? Ti sei presa carico dei destini mortali? Certi giocattoli sono sempre stati solo miei!"
uw.HW20Whisper2 = "Sigillato, sì! Ma tu hai chiamato e, attraverso questo meraviglioso specchio, io sono venuta. Lo porto con me. Assicurati di farmi visita per ascoltare delle vere predizioni sul tuo futuro!"
uw.Hunger_AfterLoss = "Visto che sei il prrrescelto, ti darò un'ultima possibilità di restare con me e banchettare. Altrrrimenti, le tue ossa cadranno insieme alle altre nella polvere."
uw.Hunger_AfterWin = "Creatore, mi mandi il sostentamento, ma non è sufficiente. La mia fame è eterna, liberami..."
uw.Hunger_Greetings1 = "Hai fatto molta strada per arrivare qui. Per quale ragione? Per salvare i morrrtali? A loro non importa nulla di te! Sento la tua solitudine, la tua fame, la tua... paurrra."
uw.Hunger_Greetings2 = "Non farti ingannare, Ombra! Sembra debole, ma non lo è. Non sei un amico, ma la sua preda. Ti farà a pezzi se ti avvicinerai ulteriormente!"
uw.Hunger_Greetings3 = "Vedi i miei fratelli? Hanno sete, ma la loro sete è diversa. Hanno sete di diverrrtimento. Ma la loro fame non è paragonabile alla mia!"
uw.INVERTED_JOYSTICK = "Movimenti invertiti"
uw.LIGHT_IN_THE_DARK = "Luce nell'oscurità"
uw.MERCENARY_RAID = "UNITÀ{br}MERCENARIA"
uw.MERCENARY_RAID_Title = "Unità Mercenaria"
uw.MiniEventAnnounce = "Da tempo immemorabile, un culto dimora nelle viscere della terra, vegliando sul delicato sonno degli dèi del sottosuolo per impedirne il risveglio. Ma il prezzo è una crudele battaglia rituale, combattuta fino all'ultima goccia di sangue."
uw.MiniEventHungerFight_Enter_1 = "Qui, sotto la terra, tutto è diverso. Combattiamo per vivere e la pappa è vita! Non privare la tua gente, o la mia, di questa grande gioia!"
uw.MiniEventHungerStory_1 = "La gente si preoccupa dei capricci degli spiriti solo quando i guai si abbattono sulle loro case. I loro raccolti appassiscono, i loro figli soffrono la fame... E dov'è finita la loro fede, ora?"
uw.MiniEventHungerStory_2 = "La fame ha una forma. La sua sete di consumare è terribile. Ma questo è il ruolo di Karcer, mentre il tuo e il mio è impedirgli di svegliarsi dal suo sonno plurisecolare."
uw.MiniEventHunger_Loss_1 = "Tua madre non ti ha insegnato a non lasciare nulla nel piatto? Si vede: c'è fame nei tuoi occhi! O... che cos'hai che non va?"
uw.MiniEventHunger_Win_1 = "Sì, colpisci bene, Shadow... Celebriamo la tua vittoria con del cibo abbondante! Offro io!"
uw.MiniEventStory_1 = "Vedo che tu, Shadow, sei forte e saldo di spirito. Le leggende sulle tue imprese sono molto diffuse. Ti piacerebbe diventare parte di un'altra?"
uw.MiniEventStory_2 = "Gli spiriti del sottosuolo sono imprevedibili. Noi eseguiamo una cerimonia per placare i loro animi: delle battaglie rituali! La tua partecipazione sarebbe un onore per noi."
uw.MiniEventStory_EnterBattle = "Non sei un po' troppo gracile per uno spettacolo così arcano? E hai scelto proprio questo, sul serio? Sarebbe questo un uomo leggendario? Oh, gli spiriti saranno indignati..."
uw.MiniEventStory_Loss_1 = "Sì, beh... Voglio credere che anche gli spiriti abbiano un po' di senso dell'umorismo e che rideranno dei nostri pasticci nell'arena, invece di scatenare la loro furia su di noi..."
uw.MiniEventStory_Win_1 = "Beh... Nessuno arriva in questa arena per caso. Sei davvero un uomo leggendario, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "La strega ti spaventa senza motivo. È molto più semplice di così: l'acciaio si tempra nel fuoco! Gli dèi capiscono la forza e nient'altro. Solo la forza può farli tornare al loro sonno! All'attacco!"
uw.MiniEventVulkanStory_1 = "Il fuoco purificatore è giusto: così dicono i nostri antenati. Ma non sapevano che agli Immortali non importa nulla della morale umana. Questa è semplicemente la loro natura."
uw.MiniEventVulkanStory_2 = "Senti il calore salire dalle profondità della terra? C'è una cosa che devi sapere: la fiamma non risparmia nessuno, che sia amico o sconosciuto. E noi ci troviamo proprio sulla sua strada."
uw.MiniEventVulkan_Loss_1 = "Devi rimetterti in piedi, Shadow! Non senti la terra tremare?! Il dio è disgustato dal nostro ruzzolare nella polvere..."
uw.MiniEventVulkan_Win_1 = "Fa caldo come il fuoco dell'inferno qui... Lo spirito del fuoco ringhia soddisfatto nella sua cripta! Davvero un bel combattimento, Shadow! Ci siamo guadagnati un altro giorno!"
