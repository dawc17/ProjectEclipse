# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "La storia di Sensei{br}Prima parte. Il testimone"
sensei.entry.ActScreenSensei2 = "La storia di Sensei{br}Seconda parte. Ombra del futuro"
sensei.entry.ActScreenSensei3 = "La storia di Sensei{br}Terza parte. La bestia dentro"
sensei.entry.ActScreenSensei4 = "La storia di Sensei{br}Quarta parte. La storia della vendetta"
sensei.entry.ActScreenSensei5 = "La storia di Sensei{br}Quinta parte. Umiliato e insultato"
sensei.entry.ActScreenSensei6 = "La storia di Sensei{br}Sesta parte. Il mostro"
sensei.entry.ButcherYoung_Greetings = "Nessuno osa mettere in dubbio la mia autorità! La famiglia non lo perdonerebbe. Non uscirai vivo!"
sensei.entry.Butcher_zone3_1 = "Il figliol prodigo è tornato! Principe, hai valutato la mia proposta? Pagami l'oro richiesto: ti lascerò andare e ti dirò dove si trova la Sfera."
sensei.entry.Butcher_zone3_2 = "Il suo silenzio dice più delle parole, vecchio. Io sono onesto con me stesso e ho accettato la mia natura bestiale. Lui no. Ma vi insegneremo l'umiltà! Venite, ragazzi!"
sensei.entry.Guard1_Butcher_Sensei = "Macellaio mi ha mostrato che il dolore ci mostra chi siamo realmente. Ora sono libera! Anche tu puoi trovare la felicità. Non resistere!"
sensei.entry.Guard1_Hermit_Sensei = "Il cambiamento è imminente! Ho attraversato il mondo per scoprirlo, ho fatto immensi sacrifici... La saggezza del mio Maestro è tutto ciò che ho!"
sensei.entry.Guard1_Lynx_Sensei = "Ti piacciono i miei tatuaggi? Nella mia terra, i più forti li ricevono per ricordare le gesta che hanno compiuto. Presto sarai ritratto anche tu..."
sensei.entry.Guard1_Wasp_Sensei = "Credi nella fortuna? La mia sarà derubarti di tutti i tuoi quattrini. Pensi di avere la fortuna dalla tua, vecchio?"
sensei.entry.Guard1_Widow_Sensei = "La mia signora è come una sorella per me. Sono partecipa del suo dolore. Non mi permette di mettere le mani su Principe, quindi tu sarai il bersaglio della mia ira!"
sensei.entry.Guard2_Butcher_Sensei = "Le prede vengono dai loro carnefici! La filosofia è inutile, preferisco giocare con i coltelli. Vuoi giocare con me?"
sensei.entry.Guard2_Hermit_Sensei = "Il Maestro ci ha parlato del Mondo delle Ombre, dei suoi abitanti e degli immensi poteri che condividerà con noi. Credi davvero che ti permetterò di privarcene?"
sensei.entry.Guard2_Lynx_Sensei = "Il nostro clan svolge lavori che sono troppo sporchi persino per gli dèi. Risolviamo i problemi e rimediamo agli errori degli altri. E tu sei uno di essi."
sensei.entry.Guard2_Wasp_Sensei = "Minacci la mia capitana? Mi ha salvata dalla schiavitù e ho giurato di seguirla per sdebitarmi. Spero che gli spiriti siano indulgenti con te..."
sensei.entry.Guard2_Widow_Sensei = "Com'è bella la mia signora! Non ero degno di vedere il suo volto... Ora la mia vita le appartiene. Proteggerò il suo onore fino alla morte."
sensei.entry.HermitYoung_Greetings = "Principe, sei una vittima delle circostanze e un sacrificio necessario per il bene comune. La mia scuola raggiungerà nuove vette e darà inizio all'età dell'oro delle arti marziali!"
sensei.entry.Hermit_zone2_1 = "Signore, ti trovi fra l'incudine e il martello. Ammetto di averti tradito, ma non avevo scelta. Ne va del futuro della mia scuola."
sensei.entry.Hermit_zone2_2 = "Lince, questo giovane arrogante, non ha portato a termine il suo lavoro. Dovrò pensarci io. Allievi, davanti a me!"
sensei.entry.LynxYoung_Greetings = "Non posso andarmene. Sono già stato pagato per la vita di Principe. Niente di personale, vecchio."
sensei.entry.Lynx_Sensei_1 = "Vecchio, non ascoltare Principe, è impazzito. Stiamo portando a casa Sua Altezza prima che si faccia del male da solo. Non c'è bisogno del tuo aiuto."
sensei.entry.Lynx_Sensei_2 = "Davvero? Vedo un uomo spaventato circondato da dei tagliagole. Qualcosa mi suggerisce che Principe stia dicendo la verità. Allontanatevi da lui!"
sensei.entry.Lynx_Sensei_3 = "Fa' quello che credi. Non mi pagano per parlare. Due teste valgono più di una. All'attacco, ragazzi!"
sensei.entry.NAME_BUTCHER = "MACELLAIO"
sensei.entry.NAME_HERMIT = "EREMITA"
sensei.entry.NAME_LYNX = "LINCE"
sensei.entry.NAME_PRINCE = "PRINCIPE"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "VESPA"
sensei.entry.NAME_WIDOW = "VEDOVA"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Aiuto! Queste persone vogliono uccidermi!"
sensei.entry.Prince_zone3_1 = "Come osi insudiciare il mio nome? Tu... miserabile mascalzone! Sono qui per porre fine al tuo regno efferato!"
sensei.entry.Prince_zone6_1 = "Eccoti qui, mio fedele amico! Guarda: la giustizia ha trionfato di nuovo. Shogun è diventato il mio fedele servitore. Ora obbedisce a me!"
sensei.entry.Prince_zone6_2 = "Anche tu, vecchio, vuoi rubarmi il trono?! È mio per diritto di nascita! Nessuno potrà togliermelo!"
sensei.entry.Sensei_arc_intro1 = "Un tempo, mentre stavo facendo una passeggiata, ho incontrato il sovrano locale. Era in grandi difficoltà..."
sensei.entry.Sensei_zone3_1 = "È questo il significato di \"fortuna\"? Acquistare la libertà e consegnare il popolo nelle mani di una banda di pazzi... Ero stato molto generoso con te, Principe."
sensei.entry.Sensei_zone4_1 = "Vedova? Ma certo... mi ha detto di prendere la Sfera e di consegnarla nelle mani di Shogun."
sensei.entry.Sensei_zone6_1 = "Fermati, Principe! Guardati attorno! La Sfera si sta nutrendo della tua ira e ti sta trasformando in un mostro!"
sensei.entry.Shogun_zone6_1 = "Smidollato! Non sei degno di essere neanche il pagliaccio di corte del mio signore. Ti spazzerò via con un solo colpo!"
sensei.entry.TITLE_PRINCE_EVIL = "PRINCIPE INFESTATO"
sensei.entry.WaspYoung_Greetings = "Cosa dirò a mio padre? Che sua figlia è diventata debole e ha perso da un vecchio? Non accadrà finché sono l'erede del trono dei pirati!"
sensei.entry.Wasp_zone4_1 = "Vedova ti manda a prendere la Sfera? Non sei troppo vecchio per questo lavoro? Ah, non importa. Sali a bordo."
sensei.entry.Wasp_zone4_2 = "Ma non ho più la Sfera. Gli uomini di Vedova l'hanno presa ieri. Non so chi tu sia, ma non perdono mai i bugiardi. Fategli fare un giro di chiglia!"
sensei.entry.WidowYoung_Greetings = "Principe mi ha umiliata rifiutandomi e ridendo dei miei sentimenti. Ora mi vendicherò! Tu sei suo amico, quindi portagli questo messaggio..."
sensei.entry.Widow_zone5_1 = "Sei qui per umiliarmi, come ha fatto Principe? Voi uomini siete tutti uguali..."
sensei.entry.Widow_zone5_2 = "Mi ha parlato della tua gentilezza, del tuo onore e della tua dignità. Ma non credo più alle parole degli uomini. Soffrirete tutti!"
sensei.entry.Zone2_SenseiReminder = "L'ultima volta ti ho raccontato come ho salvato Principe dagli assassini. Ho scoperto che Eremita stava addestrando in segreto i suoi soldati, così siamo andati da lui."
sensei.entry.Zone3_SenseiReminder = "Eremita ci ha detto che il signore della guerra di Principe, Shogun, aveva tradito il suo sovrano e pagato un certo Macellaio per rapirlo. Era ora di far visita al bandito."
sensei.entry.Zone4_SenseiReminder = "Tutti i problemi di Principe erano stati causati da una donna! Aveva escogitato un piano per deporlo usando una Sfera magica che stava per arrivare in un porto poco distante..."
sensei.entry.Zone5_SenseiReminder = "La donna pirata mi ha raccontato del passato movimentato fra Vedova e Principe. Non ho trovato la Sfera, ma ho scoperto che Principe si era recato sulle montagne per trovare Vedova."
sensei.entry.Zone6_SenseiReminder = "La Sfera magica ha fatto impazzire Principe! gli ha conferito enormi poteri... che minacciavano di distruggerci tutti! Non potevo permettere che accadesse."
sensei.entry.characterSensei = "SENSEI"
sensei.entry.character_Asian = "LOTO"
sensei.entry.character_Blind = "ERMELLINO"
sensei.entry.character_Fanatic = "RASOIO"
sensei.entry.character_Indean = "PANTERA"
sensei.entry.character_Philosopher = "CHIERICO"
sensei.entry.character_Pirate = "PIRATA"
sensei.entry.character_Ronin = "FORIERO"
sensei.entry.character_Sadist = "TORTURATRICE"
sensei.entry.character_Savage = "SCINTILLA"
sensei.entry.character_Sister = "ASTRA"
sensei.entry.dlgStoryBtnFight = "COMBATTI"
# END Sensei sensei.entry.

# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Mi sono ricordato cos'è successo alla fine. Vuoi che continui il mio racconto?"
sensei.notify.intro = "Questa città ha risvegliato alcuni dei miei ricordi. Ti racconterò la mia storia. Questi eventi sono accaduti molto tempo fa..."
sensei.notify.more = "Ho ricordato un'altra parte della mia storia. Vuoi che continui il mio racconto?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Non stai sognando. Ho fermato il tempo per riportare la Sfera nell'ombra. La sua presenza qui è un errore dovuto all'instabilità del Portale delle Ombre."
sensei.victory.Ancient_zone6_2 = "Umano, stanno per cambiare molte cose. Ora riposa. Quando ti sveglierai, nessuno si ricorderà di te. È giusto così. Un giorno capirai..."
sensei.victory.Butcher_zone3_3 = "Eh eh, guarda come se la dà a gambe Principe! Avresti dovuto vedere la tua faccia, vecchio. Vedi? Il tuo nuovo amico è un bugiardo e un codardo!"
sensei.victory.Butcher_zone3_4 = "So che appena Principe tirerà le cuoia, Shogun non mi permetterà più di vivere. Sono solo uno strumento, sono sacrificabile. Quindi ti aiuterò."
sensei.victory.Butcher_zone3_5 = "È stata una donna a convincere Shogun che il trono gli spetta di diritto. Gli ha promesso la Sfera, di diventare un grande guerriero. A condizione di essere il suo signore."
sensei.victory.Butcher_zone3_6 = "Vai al porto. Shogun sta aspettando l'arrivo di una nave con la Sfera. È l'ultima possibilità per Principe di reclamare il suo trono."
sensei.victory.Hermit_zone2_3 = "Cerca di capire: per la nostra arte è la fine! Deve cambiare per sopravvivere. So come. E Shogun ha promesso che, se avessi addestrato i suoi uomini, mi avrebbe protetto."
sensei.victory.Hermit_zone2_4 = "Macellaio e la sua banda sono poco lontani. Sono stati loro a rapirti, sire. Va', spero che troverai una risposta ai tuoi interrogativi."
sensei.victory.NAME_BUTCHER = "MACELLAIO"
sensei.victory.NAME_HERMIT = "EREMITA"
sensei.victory.NAME_PRINCE = "PRINCIPE"
sensei.victory.NAME_WASP = "VESPA"
sensei.victory.NAME_WIDOW = "VEDOVA"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Grazie! Sei nobile, pochi avrebbero lottato per qualcuno che non conoscono. Pensavo fosse giunta la mia ora, perché quelle sono persone senza scrupoli."
sensei.victory.Prince_zone1_2 = "Ho scoperto qualcosa che non avrei dovuto sapere: un certo Eremita insegna ai miei soldati pratiche proibite. Volevano disfarsi di un testimone..."
sensei.victory.Prince_zone1_3 = "Sono andato da lui con degli uomini per chiarire la situazione, ma mi hanno imprigionato. Per fortuna sono riuscito a fuggire."
sensei.victory.Prince_zone2_1 = "I MIEI uomini! Non avrei dovuto farlo capo del mio esercito... Se hai ancora solo una briciola d'onore, dicci dove si trova l'accampamento dei banditi!"
sensei.victory.Sensei_arc_outro = "Continua..."
sensei.victory.Sensei_zone1_1 = "Troppe coincidenze. Qualcuno sapeva della visita e ha avvertito i banditi. È possibile che Eremita sia coinvolto? Dobbiamo scoprirlo. Andiamo!"
sensei.victory.Sensei_zone2_1 = "Vergognati! Hai venduto il tuo onore! E per cosa? Pensi che le persone seguiranno questo traditore? Ti sembra un bell'insegnamento per i giovani?"
sensei.victory.Sensei_zone3_2 = "Rispondimi: perché Shogun lo vuole morto e cos'è la Sfera magica di cui mi hai parlato?"
sensei.victory.Sensei_zone4_2 = "Dobbiamo fermare Principe prima che trovi Vedova... e la Sfera..."
sensei.victory.Sensei_zone5_1 = "Ti comprendo, davvero. Ma un cuore spezzato è un cattivo consigliere. Cerca di capire: ci sono persone che soffrono per causa tua."
sensei.victory.Sensei_zone6_2 = "Aspetta! Ho molte domande! Chi sei? Cosa c'è, dietro al Portale? Voglio saperlo..."
sensei.victory.Wasp_zone4_3 = "Fermati. Ti ho sottovalutato, vecchio! Sono stata pagata per la consegna, non ho intenzione di combattere per Vedova. Ti dirò dove si nasconde!"
sensei.victory.Wasp_zone4_4 = "Vedova era innamorata di Principe, ma lui l'ha rifiutata. Così ha trovato un nuovo giocattolo: Shogun. Quella megera lo sta usando per ottenere la sua vendetta."
sensei.victory.Wasp_zone4_5 = "Vedova vuole comandare gli uomini e farli combattere l'uno contro l'altro. La Sfera darà grandi poteri al suo prescelto... e lo farà ubbidire solo a lei."
sensei.victory.Widow_zone5_3 = "Non tornerò indietro. Vedo che vuoi aiutarmi, ma è troppo tardi: Principe ha già preso la Sfera. Shogun ha cercato di difenderla, ma invano."
sensei.victory.Widow_zone5_4 = "Com'era strano, Principe! I suoi occhi sembravano in fiamme! Gli piaceva l'idea di giustiziare un traditore dove ci siamo incontrati la prima volta. Lascia che te lo mostri..."
sensei.victory.characterAncient = "ANTICO"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

