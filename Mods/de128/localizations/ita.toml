uw.dlgAmericanEvent22Story_May_1 = "È completamente congelata, Sensei! Non possiamo buttarla fuori con questi venti che infuriano alla porta..."
uw.dlgAmericanEvent22Story_Puma_1 = "Nei guai, vecchio... Non avrei mai pensato che il passato del mio popolo mi avrebbe perseguitato, ma è così. Quindi sono scappata per proteggerli. Ti prego, ascoltami!"
uw.dlgAmericanEvent22Story_Puma_2 = "Lo sentite anche voi? Quando ero bambina, uno sciamano mi raccontò di uno spirito il cui ululato sollevava le onde e strappava le foglie. Non avrei mai pensato che quella vecchia fiaba si sarebbe rivelata vera!"
uw.dlgAmericanEvent22Story_Puma_3 = "Sta venendo da questa parte per perseguitarci con il suo richiamo finché non crolleremo, senza fiato... Solo per divertimento! Non conosco nessun altro posto dove nascondermi..."
uw.dlgAmericanEvent22Story_Sensei_1 = "Le porte della mia dimora sono aperte a chiunque soffra. Ma è inaspettato vedere un pirata tra queste mura... E dov'è la tua banda di tagliagole, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "I miti degli sciamani sono allegorie. Le persone hanno inventato le vele per domare il vento, e da allora è servito loro bene. Sei solo una sciocca fiaba e Shadow lo dimostrerà!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Io sono il Vento del Lupo! Chiunque mi venga incontro verrà spento come una candela! E prima o poi butterò giù la vostra porta. È solo questione di tempo!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Ululerò finché le foglie non copriranno i detriti. Nessuno troverà mai la strada per arrivare qui! Audace e sciocco... Come puoi combattere contro gli elementi, mortale?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Che vergogna... Mi hai privato della mia voce possente! Ma la tua fede, ragazza, mi riporterà in vita... E non tornerò da solo! Perché noi siamo molti!"
uw.dlgArkhosGreetings = "Ciechi fanatici! Vi ricordate di me e mi nutrite con la vostra fede nel Padre. Un genitore ha il diritto di essere severo. Vi punirò e accetterete la punizione con riconoscenza."
uw.dlgArkhosLost = "Chi dovrei venerare in questa mia ultima ora? O Creatore, perché mi hai abbandonato? Mi hai dato il potere di guidarli, ma ho fallito. Di nuovo."
uw.dlgArkhosStory1 = "Conosco quelli come lui. Nutrono i loro adepti con la menzogna. Non ascoltare le sue prediche sobillatrici: sono la sua arma."
uw.dlgArkhosStory2 = "Sbagli, vecchio. So essere molto duro con i figli più refrattari. Mi pregherai di permetterti di entrare a far parte della famiglia, ma sarò implacabile."
uw.dlgArkhosWin = "Pecora nera, non sei degno di un posto al mio fianco. Vattene! Dirò al Creatore che i tuoi uomini hanno fallito di nuovo e lui sfamerà i miei figli."
uw.dlgBerstuuk_Announce = "In cerca di conoscenza proibita, un brillante scienziato ha unito scienza e magia nel tentativo di diventare un dio. E la trasformazione è inevitabile! Ora la foresta è il suo laboratorio da incubo e gli umani sono le sue prede. Solo tu puoi fermare questa terrificante metamorfosi! Bandisci la paura e avventurati nel cuore della boscaglia in cerca del falso idolo!"
uw.dlgBerstuuk_Loose_1 = "Quando sei arrivato alla mia porta, mi hai detto tutto senza parole! Tirerò questa conoscenza come un filo sottile finché non resterà nulla!"
uw.dlgBerstuuk_Story_1 = "C'è Sly là fuori, che bussa alla porta del fienile... Ne ho viste tante nella foresta di notte, ma questa è nuova! Cosa c'è che non va in lui?"
uw.dlgBerstuuk_Story_10 = "Non abbastanza. La scienza è imprevedibile: guardami! Gradualmente ho accettato la foresta, ma lei continuava a rifiutare di accettare me. Fino a ora."
uw.dlgBerstuuk_Story_2 = "Per coloro che cercano aiuto, il sentiero conduce alla porta giusta. Ma Sly sembra aver smarrito la strada... Vecchio furfante, attento alle mani! Cos'è successo?"
uw.dlgBerstuuk_Story_3 = "Il furfante cercava aiuto, e l'ha trovato. Andiamo nel bosco, prima che si prenda ciò che le spetta di diritto. Le vite degli uomini!"
uw.dlgBerstuuk_Story_4 = "\"Uomini\"? Il poveretto è sotto shock: non ha il volto! Cosa l'ha spaventato così tanto da fargli venire un'improvvisa crisi di coscienza?"
uw.dlgBerstuuk_Story_5 = "Senti gli uccelli cantare? A quest'ora dovrebbero già cinguettare, ma qui non c'è altro che un silenzio di tomba... Cos'altro si nasconde in questa foresta?"
uw.dlgBerstuuk_Story_6 = "Silenzio di tomba. Silenzio di tomba. La gente ha bisogno di aiuto. Devi a-a-iutare. Aiuta ora!"
uw.dlgBerstuuk_Story_7 = "Per gli dèi! Normalmente le persone non si trasformano in ramoscelli secchi e muschio, non importa quanto siano spaventate! Cos'è quella roba, e dov'è il vero Sly?!"
uw.dlgBerstuuk_Story_8 = "È qui in giro da qualche parte. La piccola mente di Sly è stata molto utile. Mi ha parlato di te, Shadow, e del tuo potere speciale. E mi ha folgorato!"
uw.dlgBerstuuk_Story_9 = "Quindi sei tu colui di cui parlava la creatura? Il bosco verrà e porterà via. E quante di queste vite \"di diritto\" hai preso, pazzo?"
uw.dlgBerstuuk_Win_1 = "La natura troverà un modo! Il nostro scontro mi ha detto più di quanto tu creda, Shadow. La foresta ricorderà. Mi consumerà per rinascere di nuovo..."
uw.dlgFatumGreetings = "Il tuo coraggio è pari solo alla tua follia. Sapevo che saresti venuto: sei il mio destino e io il tuo. Riscriverò la tua sorte, una volta per tutte."
uw.dlgFatumLost = "Conosco gli esseri umani. Continuano a salire e scendere la stessa spirale. L'ho visto molte volte. Autodistruzione e declino. È il vostro destino, nulla può cambiarlo."
uw.dlgFatumStory1 = "Fa' attenzione, eroe. A questa profondità, le leggi universali che conoscevi non sono più valide..."
uw.dlgFatumStory2 = "Proprio così! Tieni al guinzaglio il ragazzo. So tutto sulle vostre sorti: chi siete e dove andrete. Volete sapere chi morrà, alla fine?"
uw.dlgFatumWin = "Il tuo destino è segnato. Hai già perso non appena hai varcato la soglia della mia dimora. Avrai coraggio a sufficienza per riscrivere la tua storia?"
uw.dlgFungusGreetings = "Avete avvelenato la terra, ora i miei funghi stanno morendo. Assorbiranno le vostre menti e diventerete tutti uno solo. Sarà la fine della vostra storia!"
uw.dlgFungusLost = "I miei fratelli hanno giocato agli dèi. Farsi adorare li ha resi deboli. Ma la distruzione fa parte della vostra natura. Il mondo sarà migliore senza di voi."
uw.dlgFungusWin = "Andatevene! Godetevi gli ultimi minuti delle vostre fragili vite!"
uw.dlgHW21LosePuppeteer_1 = "Non ti affiderei nemmeno un ruolo da comparsa, Shadow. Il palcoscenico non fa per te: non disonorare la mia arte!"
uw.dlgHW21StoryArkhos_1 = "La piaga sta arrivando nella vostra città, mortali! Inchinatevi di fronte alla potenza del vostro dio! E deliziate i vostri occhi con lo splendore dell'oro, altrimenti..."
uw.dlgHW21StoryPuppeteer_1 = "Cosa ne sapete voi di arte! Avete rovinato la mia impresa più grande! Tuttavia... il terzo atto è in arrivo. E in esso, l'eroe esala l'ultimo respiro!"
uw.dlgHW21StorySensei_1 = "Da quando gli dèi del sottosuolo vengono quassù a estorcere denaro alla gente comune? Getta la maschera, ingannatore, prima che prendiamo le armi!"
uw.dlgHW21StorySensei_2 = "Il teatro dovrebbe ispirare, non inorridire. E tu hai distorto l'essenza stessa dell'arte. Ti fermeremo prima che i tuoi \"attori\" si facciano male."
uw.dlgHW21StoryThief_1 = "Aspettate! Sono io... Sly! Non colpitemi! Mi aveva promesso che tutti mi avrebbero temuto... E che nessuno mi avrebbe riconosciuto. Come mi sono tradito?"
uw.dlgHW21StoryThief_2 = "Il proprietario del teatro itinerante: il Burattinaio. Ha detto che sarebbe stata la sua performance migliore. Dèi tra gli uomini! Per me non significava nulla. Ma i soldi, d'altra parte..."
uw.dlgHW21WinPuppeteer_1 = "È un fiasco! Avete rovinato la mia splendida trama e rotto le mie maschere! Come farò a mettere in scena un'opera teatrale senza oggetti di scena..."
uw.dlgHW22EnterArchitect = "Tutta questa tua narrativa fantasy mi ha sfiancato... Ora giocheremo secondo le mie regole. Ed è nel tuo interesse sorprendermi, Shadow..."
uw.dlgHW22LooseArchitect_1 = "C'era da aspettarselo. Conosco tutte le tue mosse, Shadow. Dopotutto, sono stato io a inventarti. Forse in quel periodo non ero in forma... Ma ora la tua nuova vita ti piacerà."
uw.dlgHW22StoryArchitect_1 = "Questo è quello che si definisce un \"cliché\", Burattinaio. Per cosa vengono pagati i drammaturghi? Per il numero di simboli? La figura del folle genio balbettante è diventata stantia, un po' come la figura dell'eroe..."
uw.dlgHW22StoryArchitect_2 = "Ecco fatto. Riscriveremo il tuo mondo da zero! Contemporaneo, creativo, rilevante! Cosa va di moda tra i giovani oggigiorno? Perché non dici niente, Shadow? Oh, già..."
uw.dlgHW22StoryPuppeteer_1 = "Si sente bussare, qualcuno bussa inaspettatamente alla tua porta! È un viaggiatore venuto in visita, o qualcosa di più? Intrigante, vero?"
uw.dlgHW22StoryPuppeteer_2 = "Sapevo che l'avresti detto, vecchio. Cos'altro ci si può aspettare da personaggi inventati? La carta sopporta tutto... Ma il pubblico non lo farà mai!"
uw.dlgHW22StoryPuppeteer_3 = "Sono solo uno schiavo del palcoscenico, tutto qui. E il mio nuovo capolavoro racconterà di un incontro con il creatore: dei tormenti della predestinazione e del libero arbitrio..."
uw.dlgHW22StorySensei_1 = "Qualsiasi cosa tu ti sia inventato, Burattinaio, non giocheremo più ai tuoi giochi. L'arte può causare dolore, ma non nel modo in cui la pratichi tu."
uw.dlgHW22StorySensei_2 = "Hai recitato troppo e non riesci più a distinguere la realtà dalle tue fantasie, teatrante... Sei pazzo."
uw.dlgHW22StorySensei_3 = "Le tue parole sono strane e preoccupanti, straniero... Non so quale follia ti frulli in testa, ma Shadow te la farà passare a suon di botte."
uw.dlgHW22WinArchitect_1 = "Forse la creazione non appartiene più al suo creatore e ha preso vita propria... Mi hai sorpreso. Voglio vedere dove andrà a parare la storia."
uw.dlgHoaxenGreetings = "Tutta la tua vita è solo un'illusione. Noi siamo i suoi creatori. Vi faremo impazzire senza nemmeno usare la forza. Fuoco, acqua, malattie? Pfui!"
uw.dlgHoaxenLost = "Dove sei, fratello? Non sento più la tua voce! Restare soli è peggio delle fiamme e delle lame. Andatevene, sciocchi. Il Padre vi attende."
uw.dlgHoaxenStory1 = "“Noi”? Ombra, sembra che il nostro nemico sia impazzito. Perdonami, con quale delle tue personalità stiamo parlando? Forse tuo “fratello” potrebbe essere più razionale?"
uw.dlgHoaxenStory2 = "Ridi di noi, umano? Mio fratello suggerisce di inviare le vostre anime nell'abisso del dolore eterno. Il vostro mondo cederà senza spargere una sola goccia di sangue."
uw.dlgHoaxenWin = "Ti avrei ucciso, perché la mia pietà non ha limiti, ma mio fratello è meno tollerante. Se non impazzirai cercando l'uscita, puoi andare liberamente."
uw.dlgHunter_enter_hunter_1 = "Tu! Ehi, tuuu! Sei venuto a finire ciò che hai iniziaaato, non è vero? Tu? C'è un potere in te. Mi ppparla. Zitto! O ti cccostringerò a farlo!"
uw.dlgHunter_greeting_may_1 = "Guardate! C'è qualcosa all'interno del cristallo... Dovrebbe essere così?"
uw.dlgHunter_greeting_saimon_1 = "Che strano... Mi aspettavo che Lazarus riducesse l'Obelisco in polvere. Temevo una carneficina, ma sembra che siamo rimasti solo io e te. Sono intrigato."
uw.dlgHunter_greeting_saimon_2 = "La Sala di Concentrazione. Vedi quel cristallo al centro? È così che l'Obelisco accumula l'energia dell'ombra: il cuore di tenebra, per così dire."
uw.dlgHunter_greeting_sensei_1 = "Il silenzio è un cattivo presagio, mio razionale amico. Può parlare più forte della parola più assordante. Hmm... Dove siamo? Che cos'è questo posto bizzarro?"
uw.dlgHunter_greeting_sensei_2 = "Ne dubito, mia cara... Questo posto sembra diverso dall'ultima volta che l'ho visto. Comincio a credere che il vecchio avesse ragione..."
uw.dlgHunter_loose_hunter_1 = "Stenditiii. Ti lasceròòò qui per sempreee. Non causare aaaaltro male."
uw.dlgHunter_win_hunter_1 = "Fermati, Shadow-umano! Non lasciare che si ddiiiffondaaa! Ssssarai come luuuiiii. Sarai ingaaaannato! Ma hai ancora un'occcasioneee."
uw.dlgIE21AnnounceAssistant_1 = "Chi diavolo è questo? Cosa ci fai nel nostro mondo e perché mai dovremmo ascoltarti?"
uw.dlgIE21AnnounceAssistant_2 = "Ah! Non so da dove tu sia venuto, ma non resterai qui a lungo!"
uw.dlgIE21AnnounceAssistant_3 = "Ehi, Shadow, questo prepotente si è spinto oltre! Insegniamogli un po' di buone maniere!"
uw.dlgIE21AnnounceBoss_1 = "Voi, patetici mortali! Inchinatevi di fronte alla mia volontà e alla mia gloria, o vi costringerò io in ginocchio!"
uw.dlgIE21AnnounceBoss_2 = "Come osi parlarmi in questo modo? Io sono Ravana, conquistatore di tutti e tre i mondi!"
uw.dlgIE21AnnounceBoss_3 = "Questa è la vostra ultima occasione per inginocchiarvi. Rifiutate e vi taglierò la testa!"
uw.dlgIE21AnnounceSensei_1 = "Shadow, percepisco una minaccia misteriosa in avvicinamento. Qualcosa di malvagio si è fatto strada nel nostro mondo ancora una volta."
uw.dlgIE21Boss_After_Loose = "Se tutte le persone di questo mondo sono così deboli, allora la sua conquista è solo questione di tempo!"
uw.dlgIE21Boss_After_Win = "STOLTI! Mi ritiro per ora, ma non mi sconfiggerete così facilmente. Ritornerò!"
uw.dlgIndia22Story_May_1 = "E così avete iniziato a patire la fame... Cosa poteva volere questo demone alla vostra gioiosa celebrazione? Come hanno potuto degli umili contadini attirare un simile predatore?"
uw.dlgIndia22Story_Rakshasa_1 = "Hai un profumo interessante, umano. Senza dubbio avresti anche un ottimo sapore! Senti il mio stomaco che brontola? Un bel pezzo di carne scelta da accompagnare al mio riso sarebbe molto gradito!"
uw.dlgIndia22Story_Rakshasa_Lose = "Fortunatamente per te, il nostro scontro mi ha sfiancato. Inoltre, la mia fame è placata... per ora. Mi farò tornare l'appetito e caccerò di nuovo!"
uw.dlgIndia22Story_Sensei_1 = "Parlami di lui, viaggiatore. Dai tuoi abiti vedo che hai viaggiato a lungo. Quale guaio affligge la tua casa?"
uw.dlgIndia22Story_Sensei_2 = "Frena il tuo appetito, demone! Non ci sarà alcun invito al festival della vita per chi ruba la vita stessa!"
uw.dlgIndia22Story_Sensei_Win = "Non è la magia a far fiorire un giardino, è il duro lavoro. E lo dimostrerai tu stesso: aiuta i tuoi vicini a ripristinare la loro fattoria, altrimenti..."
uw.dlgIndia22Story_Sitaram_1 = "Ho sentito la storia della tua vita. Che gli dèi ti ricompensino secondo i tuoi meriti! Porto cattive notizie: uno spirito maligno è apparso nelle mie terre..."
uw.dlgIndia22Story_Sitaram_2 = "La malvagità di questo demone è pari solo alla sua fame! Ci stavamo preparando a celebrare il Bohag Bihu quando, all'improvviso, questa... creatura è apparsa e ha divorato tutte le nostre piantine!"
uw.dlgIndia22Story_Sitaram_3 = "Come Agni mi è testimone, mia signora, mi faccio la stessa domanda! Ora aspettiamo con terrore il tramonto... Venite con me, vi supplico!"
uw.dlgIndia24_Enter_Puppet_1 = "Hai lo spirito necessario per dirigere il destino? Decidi il mio, umile servitore delle arti quale sono. Solo in combattimento si capisce veramente come stanno le cose. Sii audace, Shadow, all'attacco!"
uw.dlgIndia24_Story_Dandy_1 = "Aprite, o sfonderò questa maledetta porta! So che siete a casa, vi sento! Darò fuoco a questa baracca se non mi concedete rifugio!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Oh, con quanta ferocia i mortali si aggrappano alla vita. Non sono stata io a scegliere questo compito e non verserò lacrime avvelenate per questo... Perché mi avete fatto questo?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Il suo cuore è pieno d'amore. Gli dèi ci creano puri, ma siamo noi a scegliere la nostra strada. Nrityu inizia a capirlo ascoltando la storia della ragazza."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, la tua interpretazione manca di passione e impegno. Ti darò un'altra possibilità. Non recitare, vivilo!"
uw.dlgIndia24_Story_Puppet_1 = "Toc, toc! Ehi, vecchi amici! La voce del destino è su di noi ed è in arrivo! Il suo orlo rosso brucia come la vita stessa sul finire del giorno!"
uw.dlgIndia24_Story_Puppet_2 = "È venuta per la tua anima? Ammira una storia antica quanto il mondo stesso: la leggenda di Nrityu, il cui destino era quello di essere una portatrice di morte."
uw.dlgIndia24_Story_Puppet_3 = "I fantasmi chiacchierano tutti quanti. Non puoi fidarti di loro. E poi, non spetta a loro raccontare la storia. Ti mostrerò la verità attraverso i suoi occhi. Shadow, tu sei l'unico che può capire."
uw.dlgIndia24_Story_Sensei_1 = "Quella voce... Sembra che il nostro vecchio avversario stia tramando di nuovo qualcosa. Chi sarà la vittima stavolta? Vedo un uomo correre verso la pagoda..."
uw.dlgIndia24_Story_Sensei_2 = "I tuoi abiti sono coperti di sporcizia e fuliggine, straniero. E il tuo tono mi inquieta. Spiega chi sei e che affari hai sulla nostra soglia!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Indietro! Non volevo questo! La mia famiglia aveva paura di me e pensavo che questa fosse la mia occasione... Dandy aveva promesso di portarmi con sé, se solo l'avessi aiutato..."
uw.dlgIndia24_Story_Win_Nrityu_1 = "Ecco! Cadi in un sonno eterno, anche se non te lo meriti. Ma non spetta a me giudicarti, è compito di qualcun altro. Io sono solo la scorta."
uw.dlgIndia24_Story_Win_Puppet_4 = "Proprio come te, Shadow. Voglio che tu segua il percorso di Nrityu. Ci ha messo un'eternità per capire quale fosse il suo posto."
uw.dlgIndia24_Story_Win_Puppet_6 = "Lo spettacolo continua! Tu, Shadow, sarai la star e i miei attori saranno i tuoi non protagonisti. La storia di Nrityu sarà la nostra più grande produzione!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Questa storia è profonda, persino per te. Sono sorpreso! Ma qual è la morale, qui? Perché ci stai mostrando questo?"
uw.dlgMegalithGreetings = "Questa miniera è un luogo sacro. Perché siete qui? Andatevene a incontrare il vostro destino con onore. L'ultima cosa che sentirete sarà la terra che trema sotto i vostri piedi."
uw.dlgMegalithLost = "Dannazione! Dovrò attendere di nuovo per migliaia di anni? Ho persino spostato i continenti! Spettava a me purificare la Terra!"
uw.dlgMegalithWin = "Ho trattato con gentilezza gli esseri umani, un comportamento non comune fra gli Eterni. Ho aiutato spesso la vostra specie. Quindi vattene e dì addio ai tuoi cari!"
uw.dlgRaidIntro1 = "Stai cercando di correggere il tuo errore? Hai aperto il Portale, ma solo gli Eterni possono eliminare l'Ombra. Non sei uno di noi, quindi sei debole."
uw.dlgRaidIntro2 = "Morirai, come tutti gli altri. Nelle mie vene scorre la lava. Coprirà tutta la terra, purificandola per lasciare spazio a nuove forme di vita."
uw.dlgRaidStory1 = "Che sotterraneo è questo e cosa stiamo facendo qui sotto?"
uw.dlgRaidStory2 = "Questa è l'anticamera dei territori degli Eterni. Il loro sonno è durato per millenni, ma l'apertura del Portale minaccia il mondo. Ora si sono ridestati."
uw.dlgRaidStory3 = "Splendido, quindi ci aiuteranno a occuparci del Portale!"
uw.dlgRaidStory4 = "No. Distruggeranno il Portale, ma faranno fare la stessa fine all'intera umanità. Per loro non è che un altro ciclo di distruzione e creazione."
uw.dlgShurale_Announce = "Risvegliato da avidi banditi, lo spirito della foresta ora sfoga la sua vendetta sugli innocenti. La creatura cerca lo scrigno dei ricordi rubato, il contenitore della sua antica magia. Solo coloro i cui cuori celano vera tristezza possono placare la furia della creatura. Il prezzo, tuttavia, sarà alto..."
uw.dlgStoryBtnFight = "COMBATTI"
uw.dlgStoryBtnMore = "ANCORA"
uw.dlgVolcanoGreetings = "Io sono stato il primo eterno a destarmi. Molti combattenti verranno a sfidarmi e morire, ma porterò a compimento la mia missione."
uw.dlgVolcanoLost = "Basta! Mi arrendo. Ma sappi che hai svegliato mio fratello. Non farti ingannare dal suo aspetto, è rapido e letale!"
uw.dlgVolcanoStory1 = "Ho visto dei villaggi in rovina e una statua enorme. Qui vivono altri esseri umani?"
uw.dlgVolcanoStory2 = "Solo dei fanatici. Adorano gli Eterni nella speranza di essere risparmiati. Ma la loro fede li acceca. Se falliremo, scopriranno la verità."
uw.dlgVolcanoWin = "Ho detto ai miei fratelli che sta a me decidere il destino del pianeta. Osservate, non credenti, mentre le mie fiamme ricoprono tutte le terre!"
uw.dlgVortexGreetings = "Acque oscure avvolgeranno la Terra e il Portale dell'Ombra! Il loro segreto andrà perduto nell'abisso. Non resterà nessuno sulla superficie per raccontare ciò che è successo!"
uw.dlgVortexLost = "Per la prima volta in migliaia di anni un uomo ha vinto. La vostra voglia di vivere è troppo forte! Ma qualsiasi cosa facciate, la vostra fine sarà sempre la stessa: morirete tutti."
uw.dlgVortexWin = "Per migliaia di anni ho osservato la decadenza della vostra razza. È stato divertente, penso che vi manterrò in vita."
uw.dlgWhisperGreetings = "A quanto pare qualcuno non vede l'ora di scoprire il proprio destino. Dammi la mano e fissa lo specchio!"
uw.dlgWhisperLost = "Sei ancora vivo? Allora non sei ancora in mio potere! Fatum divinerà il tuo destino e poi tornerò al mio mondo... dopo averti avvertito di procedere con cautela con gli specchi!"
uw.dlgWhisperWin = "Ti porterò con me nel regno di cenere, spiriti e notte eterna! Fidati di me, guardami negli occhi e non distogliere lo sguardo."
uw.dlg_American_25_Loose_1 = "Non sai chi stai proteggendo, Shadow. Non ti ringrazieranno. Sogghigneranno solo alle tue spalle. Selvaggi... e il mostro sarei io?"
uw.dlg_American_25_Story_1 = "May se n'è andata. Presa da qualcosa di a malapena umano. Eppure non ci sono state urla, nessun segno di lotta... come se se ne fosse andata di sua spontanea volontà."
uw.dlg_American_25_Story_2 = "Non siamo soli in questo. Anche altri come May — giovani, forti — sono svaniti. Sentiva che stava per succedere... e si è riempita le tasche di polvere da sparo."
uw.dlg_American_25_Story_3 = "La sua pista è chiara. Dobbiamo trovarla prima che arrivino le piogge, o la perderemo per sempre. Vieni, Shadow!"
uw.dlg_American_25_Story_4 = "Ti ho fiutato nel momento in cui hai messo piede su questa terra maledetta. Perché sei venuto? Per calpestare il mio dolore? Non hai onore, proprio come non ne avevano loro."
uw.dlg_American_25_Story_5 = "Sapevo che saresti apparso, sciamano. Restituisci i bambini ai loro cari, e la nostra amica a noi. Poi vai a marcire sulla tua montagna di cenere."
uw.dlg_American_25_Story_6 = "Cenere alla cenere. E cenere ritornerai, mortale..."
uw.dlg_American_25_Win_1 = "Aspetta! Sono andata con lui di mia spontanea volontà. Il suo aspetto è bestiale, sì... ma il suo cuore è umano. E soffre... Hanno rapito suo figlio!"
uw.dlg_CHN_NY25_Announce = "Immergiti nella storia di un eroe di tempi antichi: districa la verità dalla leggenda e contribuisci a forgiare un nuovo mito! Affronta un misterioso culto che usa il nome di un grande eroe come mantello per le proprie atrocità! Torna nel luogo in cui tutto è iniziato e aiuta un furfante fuggiasco a scoprire il suo vero eroismo!"
uw.dlg_CHN_NY25_Loose_1 = "No, dobbiamo continuare a combattere! Nessuno crederebbe che un semplice contadino possa sconfiggere un culto sinistro così facilmente. Devi dare il massimo!"
uw.dlg_CHN_NY25_Story_1 = "Il Culto del Sole ha la tradizione di visitare il luogo di nascita del suo grande eroe una volta all'anno. Ma ogni volta si rivela un disastro..."
uw.dlg_CHN_NY25_Story_2 = "Era nato umano? Che curiosità. Mi sembra che queste persone non stiano portando doni al villaggio..."
uw.dlg_CHN_NY25_Story_3 = "Non lasciano nulla di intatto! Rubano il bestiame agli abitanti del villaggio, devastano i raccolti in preda a un delirio da ubriachi, frantumano finestre e attaccano briga!"
uw.dlg_CHN_NY25_Story_4 = "Ma perché gli abitanti del villaggio non si ribellano? Questa è la loro terra e la loro leggenda!"
uw.dlg_CHN_NY25_Story_5 = "Sono a pezzi. L'eroe che ha dato loro speranza se n'è andato e i cultisti commettono atrocità in suo nome. Dobbiamo ridare loro speranza!"
uw.dlg_CHN_NY25_Story_6 = "Di' che sei venuto a controllare che sia tutto pronto per la \"festa\". E noi combatteremo! I cittadini vedranno che il culto può essere affrontato!"
uw.dlg_CHN_NY25_Story_7 = "Molto bene, come vuoi... Fammi entrare nella parte. \"Ehi, ragazzo, come osi indossare le vesti del nostro eroe! Vattene, abbiamo un banchetto da preparare!\""
uw.dlg_CHN_NY25_Story_8 = "Non sarò un eroe leggendario, ma il suo spirito vive in questa terra! Mi guiderà nella mia ora più buia e mi infonderà coraggio! All'attacco!"
uw.dlg_CHN_NY25_Win_1 = "Non mi aspettavo una simile velocità da un semplice uomo... Hai quasi sconfitto il nostro campione! Dobbiamo fare di te un esempio, per evitare che altri si facciano strane idee..."
uw.dlg_NY25_Loose_1 = "I tuoi ricordi sono vividi e il dolore parla più forte della ragione. Resterai qui con me. Riposa un po'... il sonno arriverà presto."
uw.dlg_NY25_Story_1 = "Benvenuti! Questa capanna un tempo apparteneva alla mia famiglia. Quanti ricordi... Restate quanto volete. Qui c'è tutto ciò che vi serve per riposare."
uw.dlg_NY25_Story_2 = "Ma ci hai messo in pericolo così tante volte, e ora ci offri un soggiorno nella tua casa di famiglia? È una specie di trucco?"
uw.dlg_NY25_Story_3 = "È solo la voce della coscienza che parla! Mi sono reso conto di aver approfittato della gentilezza altrui per troppo tempo. Ma ora desidero fare del bene."
uw.dlg_NY25_Story_4 = "Non siamo soli... C'è gente che si raduna davanti al rifugio. Cosa vogliono a quest'ora tarda? Ci stanno chiamando per farci uscire."
uw.dlg_NY25_Story_5 = "Non fatelo! I fantasmi vi distruggeranno! Non sono altro che spettri di ricordi dolorosi. Lo spirito della foresta è venuto per il suo scrigno! Recuperiamolo!"
uw.dlg_NY25_Story_6 = "Uno scrigno? Ecco perché la gente scompare nei boschi! Perché ci hai traditi, Sly? Ti avremmo aiutato comunque in questa nobile ricerca!"
uw.dlg_NY25_Story_7 = "Non capite. Se sento la sua voce, perderò il controllo... e sparirò anch'io. Finché porterò un pezzo di lei con me."
uw.dlg_NY25_Story_8 = "Apri la porta, sto congelando qua fuori, papà. La casa è fredda e io non sono dentro. Ti mostrerò un posto dove potremo stare di nuovo insieme."
uw.dlg_NY25_Story_9 = "Fermo! Non andare nella foresta, ti perderai! Non so di chi sia la voce che senti, ma non è di certo umana!"
uw.dlg_NY25_Win_1 = "Svegliati, Sly! Restituisci lo scrigno allo spirito mentre è debole. Fagli vedere che l'umanità può superare la propria avidità."
uw.saturn_enter_saturn_1 = "Ti ricaccerò in gola quelle tue parole. E i tuoi amici guarderanno. L'unico modo per uscire dalla mia prigione è tramite il patibolo. Chi vuole essere il primo?"
uw.saturn_greeting_saimon_1 = "Il nostro sovrano, il Patriarca, ha studiato il portale per anni. Poi, un giorno, si è chiuso in se stesso. Più tardi, ha eretto l'Obelisco, e ha fatto qualcosa al nostro mondo..."
uw.saturn_greeting_saimon_2 = "Shadow è simile all'Obelisco a livello molecolare. C'è qualcuno che ci aiuterà a usarlo contro il Patriarca. Ecco perché siamo qui, nella camera di Saturn..."
uw.saturn_greeting_saimon_3 = "Mille scuse, mia signora. Tuttavia, dobbiamo liberare Lazarus. Vi prego di mostrarci la sua cella, e non vi disturberemo oltre."
uw.saturn_greeting_saturn_1 = "Andate lontano, bambini? Siete venuti nella mia prigione di vostra spontanea volontà! Mi chiedo: è coraggio o stupidità? Tu, quello allampanato: rispondimi!"
uw.saturn_greetingn_May_1 = "Ma cosa c'entra con noi?"
uw.saturn_lose_saturn_1 = "Questo ti basta. Se Lazarus si associa a scarti come voi, non c'è alcun pericolo per il Patriarca. Fuori di qui, mocciosi! Non siete sulla mia lista."
uw.saturn_win_saturn_1 = "Non troverete mai Lazarus. Quel mascalzone è fuggito dalla mia prigione ed è scappato verso le paludi. Volete perire anche voi? Allora andategli dietro!"
uw.summerfest25_story2_1 = "Bene, bene... Eri così ansioso di trovarmi, ho pensato di farti un favore. D'altronde, tutti stavano aspettando questo momento."
uw.summerfest25_story2_2 = "\"Tutti\"? Smettila di recitare. Sappiamo esattamente chi sei e come usi gli altri solo per crogiolarti nella loro miseria."
uw.summerfest25_story2_3 = "Solo un piccolo cameo e boom, sono in tendenza! Sinceramente, non mi aspettavo di essere così popolare."
uw.summerfest25_story2_4 = "La tua arguzia non ti salverà. Pagherai per i miei occhi e per tutto il male che hai fatto. Il tuo perverso gioco di fare il dio finisce qui!"
uw.summerfest25_story2_5 = "Sul serio, Ermine? Quel tipo di discorsi è passato di moda con i telefoni a conchiglia. Siamo nel 2026, cerca di stare al passo coi tempi."
uw.summerfest25_story2_6 = "Qualunque cosa l'Architetto stia progettando... c'è un'oscurità attorno a lui. Una forza così malevola che è quasi tangibile."
uw.summerfest25_story2_7 = "Con ogni parola che pronuncia, mi ritrovo a credere sempre di più alla storia di Ermine. L'Architetto è pericoloso e deve essere fermato."
uw.summerfest25_story2_defeat_1 = "Oh no... che delusione! Il pubblico si aspettava di più. Sembra che dovrò semplicemente alzare la posta in gioco la prossima volta."
uw.summerfest25_story2_win_1 = "Perché il mondo è così crudele? Perché dobbiamo soffrire? Perché ho dovuto accecarmi? Rispondimi, Architetto: perché fa così male vivere!?"
uw.tutorial_ascention_intro_title = "BURATTINAIO"
