sensei.defeat.OK = "OK"
sensei.defeat.Sensei_defeat1 = "No, aspetta... Non è stato proprio così... Perdonami, sono vecchio e la mia memoria non è più quella di un tempo."
sensei.defeat.Sensei_defeat2 = "Penso che non sia andata proprio così... A volte i ricordi sono piuttosto confusi."
sensei.defeat.Sensei_defeat3 = "Non mi sembra che il combattimento sia terminato così. Lascia che provi a ricordare meglio..."
sensei.defeat.Sensei_defeat4 = "I miei ricordi sono molto vaghi... Penso di aver vinto quel combattimento."
sensei.defeat.Sensei_defeat5 = "No, mi sono sbagliato. Mi sembra di aver vinto... dev'essere così."
sensei.defeat.characterSensei = "SENSEI"
