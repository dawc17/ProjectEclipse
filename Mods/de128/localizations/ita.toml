uw.blackness_enter_blackness_1 = "Progenie. Un grande sacrificio. Una sfera. La mente. Massacro. Io sento. Verserai sangue. Vedo dolore. Vedo il futuro. Ti mostrerò."
uw.blackness_greeting_blackness_1 = "Qual è il problema, Shadow? Non ti senti bene?"
uw.blackness_greeting_lazarus_2 = "Simon? Che bastardo che sei! Perché hai portato delle persone qui? Coglierà il profumo dei vostri pensieri! Andatevene da qui prima che l'Oscurità assapori la vostra mente!"
uw.blackness_greeting_may_1 = "Lo senti? Niente! Silenzio. Senza il canto degli uccelli, è come se questo posto fosse congelato nell'ambra. Stiamo facendo la cosa giusta? Ho un bruttissimo presentimento..."
uw.blackness_greeting_saimon_2 = "Questi gentiluomini sono il tuo biglietto per la libertà, mio caro. Quello grosso vestito di nero è in qualche modo connesso all'Obelisco e alle Porte. Lui aiuta te, e tu aiuti lui."
uw.blackness_greetingn_saimon_1 = "Non c'è da stupirsi. Da quando un frammento delle antiche Porte si è schiantato qui, la vita in questo luogo è un'anomalia statistica. Tieni gli occhi aperti, dobbiamo trovare Lazarus."
uw.blackness_lose_blackness_1 = "Tu resti qui. In eterno. Un solo sangue. Per sempre. Ti leggerò. Mi nutrirò."
uw.blackness_win_sensei = "Ci hai mentito, uomo di scienza! Chi abbiamo liberato? A cosa abbiamo condannato questo mondo? Ti rendi conto di quello che hai fatto?!"
