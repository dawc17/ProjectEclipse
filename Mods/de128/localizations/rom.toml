# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Mi-am amintit ce s-a întâmplat la final. Să ne întoarcem la povestea mea?"
sensei.notify.intro = "Acest loc trezește niște amintiri. Îţi voi spune povestea mea — una care s-a întâmplat cu mulţi ani în urmă..."
sensei.notify.more = "Mi-am amintit ceva mai mult. Să ne întoarcem la povestea mea?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Nu visezi. Am oprit timpul pentru a duce Sfera înapoi în umbre. Prezenţa ei aici a fost o greșeală — cauzată de instabilitatea Porţilor Umbrelor."
sensei.victory.Ancient_zone6_2 = "Schimbarea este iminentă, omule. Deocamdată, dormi. Când te vei trezi, nimeni nu-și va mai aminti de fapta ta. Așa trebuie să fie. Într-o zi, vei înţelege..."
sensei.victory.Butcher_zone3_3 = "He-he! Privește-l pe Prinţ cum o ia la goană! Ar fi trebuit să-ţi vezi faţa, bătrâne. Vezi? Noul tău prieten este un mincinos lipsit de coloană vertebrală!"
sensei.victory.Butcher_zone3_4 = "Știu că de îndată ce Prinţul își va da ultima suflare, Shogun nu mă va lăsa în viaţă. Sunt doar o unealtă — de sacrificiu. Așa că... te voi ajuta."
sensei.victory.Butcher_zone3_5 = "O anume femeie l-a convins pe Shogun că tronul îi aparţine de drept. I-a promis că va avea Sfera și va deveni un mare senior al războiului — totul în schimbul supunerii sale."
sensei.victory.Butcher_zone3_6 = "Mergi în port. Shogun așteaptă sosirea unei corăbii — cea care aduce Sfera. Este ultima șansă a Prinţului de a-și revendica tronul."
sensei.victory.Hermit_zone2_3 = "Încearcă să înţelegi — arta noastră a ajuns la final! Pentru a supravieţui, trebuie să se schimbe. Știu cum, iar Shogunul mi-a promis protecţie în schimbul antrenării oamenilor săi."
sensei.victory.Hermit_zone2_4 = "Măcelarul locuiește cu banda lui nu departe de aici. Ei au fost răpitorii tăi, sire. Du-te — fie să găsești răspunsurile pe care le cauţi."
sensei.victory.NAME_BUTCHER = "MĂCELAR"
sensei.victory.NAME_HERMIT = "PUSTNIC"
sensei.victory.NAME_PRINCE = "PRINŢ"
sensei.victory.NAME_WASP = "VIESPE"
sensei.victory.NAME_WIDOW = "VĂDUVĂ"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Îţi mulţumesc! Ești nobil — puţini ar lua apărarea cuiva pe care nu-l cunosc. Credeam că moartea e aproape — oamenii aceștia nu știu ce este mila."
sensei.victory.Prince_zone1_2 = "Am aflat ceva ce nu trebuia: soldaţii mei au studiat practici interzise sub îndrumarea unui anumit Sihastru. Au vrut să mă elimine ca martor..."
sensei.victory.Prince_zone1_3 = "Am luat o unitate de oameni la el pentru a clarifica lucrurile, dar am fost luat captiv. Cu toate acestea, norocul a fost de partea mea și am reușit să scap."
sensei.victory.Prince_zone2_1 = "Oamenii mei! Să-l pun la conducerea armatei mele a fost o greșeală... Dacă mai aveţi măcar un strop de onoare, spuneţi-ne unde este tabăra bandiţilor!"
sensei.victory.Sensei_arc_outro = "Sfârșit."
sensei.victory.Sensei_zone1_1 = "Prea multe coincidenţe. Cineva a știut despre vizita noastră și i-a avertizat pe bandiţi. Dar cum este implicat Pustnicul? Trebuie să aflăm. Să mergem!"
sensei.victory.Sensei_zone2_1 = "Rușine să-ţi fie! Îţi vinzi onoarea pe faţă! Și pentru ce? Crezi că oamenii vor urma un trădător? Este acesta un bun exemplu pentru cei tineri?"
sensei.victory.Sensei_zone3_2 = "Răspunde-mi: de ce vrea Shogun să fie mort și despre ce Sferă magică vorbeai?"
sensei.victory.Sensei_zone4_2 = "Trebuie să-l oprim pe Prinţ înainte să o găsească pe Văduvă... și Sfera..."
sensei.victory.Sensei_zone5_1 = "Te compătimesc — chiar o fac. Dar o inimă frântă este un sfetnic slab. Te rog să înţelegi: sunt oameni care suferă din cauza ta."
sensei.victory.Sensei_zone6_2 = "Stai! Am atâtea întrebări! Cine ești? Ce este acolo, în spatele Porţilor? Vreau să știu..."
sensei.victory.Wasp_zone4_3 = "Stai — te-am subestimat, moșule! Am fost plătită pentru livrare, dar nu am nicio treabă să lupt pentru onoarea Văduvei. Îţi voi arăta ascunzătoarea ei!"
sensei.victory.Wasp_zone4_4 = "Văduva îl iubea pe Prinţ, dar el a respins-o. Apoi și-a găsit o nouă jucărie: Shogun. Cotoroanţa se folosește de acel lord al războiului stupid pentru răzbunarea ei."
sensei.victory.Wasp_zone4_5 = "Văduva vrea să conducă bărbaţii și să-i asmută pe unii împotriva altora. Sfera îl va face pe alesul ei măreţ... și absolut loial ei."
sensei.victory.Widow_zone5_3 = "Nu mai există cale de întoarcere pentru mine. Văd că vrei să mă ajuţi, dar e prea târziu — Prinţul a luat deja Sfera. Shogun a încercat să o apere, dar în zadar."
sensei.victory.Widow_zone5_4 = "Nu l-am văzut niciodată pe Prinţ atât de... sălbatic. Ochii lui ardeau! S-a gândit că ar fi amuzant să execute o trădătoare exact în locul în care ne-am cunoscut. Îţi voi arăta..."
sensei.victory.characterAncient = "ANTICUL"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

