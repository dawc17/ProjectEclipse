uw.Tenebris_greetings_1 = "Ești la marginea realităţii, călătorule. Aceasta este ultima frontieră. Dincolo de această linie se află vidul din care se nasc lumile. Și eu am fost cel care le-a făurit lumina și întunericul!"
uw.Tenebris_greetings_2 = "Shadow, portalul din spatele lui ar putea fi șansa noastră de salvare. Eternii au spus că ne vor distruge lumea. Poate cu ajutorul lui?"
uw.Tenebris_greetings_3 = "Nu vei supravieţui portalului! Este terra incognita. Întunericul în care pot fi create lumi. Dar tu nu poţi crea, doar distruge. Portalul te va înghiţi cu totul!"
uw.Tenebris_greetings_4 = "E un risc, dar avem altă variantă? Am putea opri Eternii intrând în portal. Dar am putea, de asemenea, să provocăm o mare catastrofă."
uw.Tenebris_loses = "Te înspăimântă necunoscutul care pândește din întuneric? Acum vei fi lăsat să-l înfrunţi de unul singur! Lumea se preface în pulbere și renaște din nou. Urmând spirala."
uw.Tenebris_wins = "Nesăbuit încăpăţânat! Voi, oamenii, puteţi rezolva problemele doar prin forţă brută. Dar universul nu funcţionează așa. După toţi acești ani, nu ai învăţat nimic..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Ridică-te, marionetă! Și luptă! Nu contează dacă învingi sau pierzi. Când lupţi, mă slujești pe mine!"
uw.War_AfterWin = "Impostorule! Unde îţi e furia? Cum poţi lupta fără ea? Luptă cu mine! Să începem un nou dans al tăișurilor! Știu că războiul trăiește în tine!"
uw.War_Greetings1 = "Ce zi minunată! Simt cum se apropie o bătălie, asemeni unei furtuni. Tunetul. Furia de nedescris a legiunilor ţinând pasul. Toate acestea sunt ofrande pe altarul meu!"
uw.War_Greetings2 = "Furia și setea de sânge fierb în ea. Se delectează în bătălii nesfârșite, dar pentru ce? Ce va găsi în vârful muntelui ei de cranii?"
uw.War_Greetings3 = "E fiorul unei bătălii sângeroase atât de străin ţie? Foc, pasiune, putere furtunoasă! Arată-mi ce poţi! Distrează-mă într-o luptă corp la corp sau mori!"
