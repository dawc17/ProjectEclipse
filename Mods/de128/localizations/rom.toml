uw.dlgAmericanEvent22Story_May_1 = "Este complet înghețată, Sensei! Nu o putem da afară când la ușă dezlănțuie asemenea vânturi…"
uw.dlgAmericanEvent22Story_Puma_1 = "La necaz, bătrâne… N-am crezut niciodată că trecutul poporului meu mă va urmări, dar s-a întâmplat. Așa că am fugit ca să-i protejez. Te rog, ascultă-mă!"
uw.dlgAmericanEvent22Story_Puma_2 = "Auzi și tu asta? Când eram copil, un șaman mi-a povestit despre un spirit al cărui urlet ridica valurile și smulgea frunzele. N-am crezut niciodată că acea veche poveste se va dovedi adevărată!"
uw.dlgAmericanEvent22Story_Puma_3 = "Vine încoace să ne fugărească cu strigătul lui până când vom cădea fără suflare… Doar de distracție! Nu mai știu onde să mă ascund…"
uw.dlgAmericanEvent22Story_Sensei_1 = "Ușile lăcașului meu sunt deschise oricui suferă. Dar este neașteptat să văd un pirat între acești pereți… Și unde îți este banda de ticăloși, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Miturile șamanilor sunt alegorii. Oamenii au inventat pânzele ca să îmblânzească vântul, iar de atunci le-a slujit cu folos. Ești doar o poveste stupidă pentru copii, iar Shadow o va dovedi!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Eu sunt Vântul Lupului! Oricine îmi iese în cale va fi stins ca o lumânare! Și mai devreme sau mai târziu, vă voi sparge ușa. Este doar o chestiune de timp!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Voi ur-ur-la până când frunzele vor acoperi rămășițele. Nimeni nu va mai găsi vreodată drumul spre acest loc! Îndrăzneț și prostesc… Cum poți lupta împotriva elementelor, muritorule?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Ce rușine… Mi-ai luat vocea puternică! Dar credința ta, fată, mă va readuce la viață… Și nu voi veni singur! Căci suntem mulți!"
uw.dlgArkhosGreetings = "Fanatici orbi! Vă amintiţi de mine și mă hrăniţi cu credinţa voastră în Tatăl. Un părinte poate fi aspru, iar voi îmi veţi accepta pedeapsa cu recunoștinţă..."
uw.dlgArkhosLost = "Pe cine să venerez în acest ultim ceas al meu? O, Creatorule, de ce m-ai părăsit? Mi-ai dat puterea să-i conduc, dar te-am dezamăgit... din nou."
uw.dlgArkhosStory1 = "Îi știu genul. Adună adepţi pe care îi hrănesc cu minciuni. Nu-i asculta predica incendiară, căci aceea este arma sa principală."
uw.dlgArkhosStory2 = "Te înșeli, bătrâne. Am ceva fier dur și pentru copiii îndărătnici. Mă veţi implora să vă las să vă alăturaţi familiei... dar eu voi fi de neînduplecat."
uw.dlgArkhosWin = "Oaie neagră, ești nedemn de un loc alături de mine. Piei! Îi voi trimite vorbă Creatorului despre cum voi, oamenii, aţi dat greș din nou, iar el îi va hrăni pe copiii mei."
uw.dlgBerstuuk_Announce = "În căutarea cunoașterii interzise, un savant talentat a îmbinat știința și magia în dorința lui de a deveni zeu. Iar transformarea este inevitabilă! Acum pădurea este laboratorul lui de coșmar, iar oamenii sunt prada lui. Doar tu poți opri această metamorfoză terifiantă! Alungă-ți frica și aventurează-te în inima desișului în căutarea idolului fals!"
uw.dlgBerstuuk_Loose_1 = "Când ai venit la ușa mea, mi-ai spus toutul fără cuvinte! Voi trage de această cunoaștere ca de un fir subțire, până când nu va mai rămâne nimic!"
uw.dlgBerstuuk_Story_1 = "E Sly afară, bate la ușa hambarului… Am văzut multe în pădure pe timp de noapte, dar asta-i ceva nou! Ce o fi cu el?"
uw.dlgBerstuuk_Story_10 = "Nu destule. Știința este imprevizibilă — uită-te la mine! Treptat am acceptat pădurea, dar ea a continuat să refuze să mă accepte pe mine. Până acum."
uw.dlgBerstuuk_Story_2 = "Pentru cei care caută ajutor, drumul duce la ușa potrivită. Dar Sly pare să se fi rătăcit… Bătrână pușlama, vezi ce faci cu mâinile alea! Ce s-a întâmplat?"
uw.dlgBerstuuk_Story_3 = "Ticălosul căuta ajutor și l-a găsit. Să mergem în pădure înainte ca ea să ia ceea ce este al ei de drept. Viețile oamenilor!"
uw.dlgBerstuuk_Story_4 = "„Oamenilor”? Sărmanul e în stare de șoc — nu mai are chip! Ce l-a speriat atât de tare încât l-a izbit o bruscă criză de conștiință?"
uw.dlgBerstuuk_Story_5 = "Auzi păsările cântând? La ora asta ar trebui să ciripească deja, dar aici e doar o tăcere de mormânt… Ce altceva se mai ascunde în pădurea asta?"
uw.dlgBerstuuk_Story_6 = "Tăcere de mormânt. Tăcere de mormânt. Oamenii au nevoie de ajutor. Trebuie să aju-u-ți. Ajută acum!"
uw.dlgBerstuuk_Story_7 = "Pe zei! Oamenii nu se transformă în crengi uscate și mușchi de copac, indiferent cât de speriați ar fi! Ce naiba e chestia aia și unde este adevăratul Sly?!"
uw.dlgBerstuuk_Story_8 = "Este pe aici pe undeva. Mintea măruntă a lui Sly a fost extrem de utilă. Mi-a povestit despre tine, Shadow — despre puterea ta specială. Și m-a izbit o idee!"
uw.dlgBerstuuk_Story_9 = "Deci tu ești cel despre care vorbea creatura? Pădurea va veni și va lua totul. Și câte dintre aceste vieți „de drept” ai luat, nebunule?"
uw.dlgBerstuuk_Win_1 = "Natura va găsi o cale! Lupta noastră mi-a dezvăluit mai multe decât îți imaginezi, Shadow. Pădurea va ține minte. Mă va devora ca să renască din nou…"
uw.dlgFatumGreetings = "Curajul tău poate fi egalat doar de nebunia ta. Dar știam că vei veni, căci tu ești soarta mea, iar eu a ta. Vă voi rescrie destinele — pentru totdeauna."
uw.dlgFatumLost = "Cunosc omenirea. Vă rotiţi în sus și-n jos pe aceeași spirală. Am văzut asta de mai multe ori. Autodistrugere și ofilire. Nimic nu poate schimba asta. Aceasta vă este soarta."
uw.dlgFatumStory1 = "Fii precaut, eroule. La această adâncime, legile universale cu care ești obișnuit încetează să mai funcţioneze..."
uw.dlgFatumStory2 = "Așa e! Ţine băiatul în lesă. Știu totul despre destinele voastre: cine sunteţi, și încotro vă îndreptaţi. Să vă spun cine moare la sfârșit?"
uw.dlgFatumWin = "Soarta ta este pecetluită. Ai pierdut deja din clipa în care ai pășit pragul lăcașului meu. Vei avea oare destul curaj să-ţi rescrii povestea?"
uw.dlgFungusGreetings = "Ai otrăvit pământul, iar acum ciupercile mele mor. Ele îţi vor absorbi mintea, și cu toţii vom fi una, omule. Acesta va fi sfârșitul poveștii tale!"
uw.dlgFungusLost = "Fraţii mei s-au uitat pe sine jucându-se de-a zeii. Veneraţia îi face slabi. Dar distrugerea este în natura umanităţii; lumea va fi mai bună fără voi."
uw.dlgFungusWin = "Piei! Și desfată-te în ultimele minute ale vieţilor voastre fragile!"
uw.dlgHW21LosePuppeteer_1 = "Nu ți-aș încredința nici măcar un rol mut, Shadow. Locul tău nu este pe scenă — nu-mi dezonora meseria!"
uw.dlgHW21StoryArkhos_1 = "Ciuma vine în orașul vostru, muritorilor! Plecați-vă în fața puterii zeului vostru! Și încântați-vă ochii cu strălucirea aurului, altfel…"
uw.dlgHW21StoryPuppeteer_1 = "Ce știi tu despre artă! Mi-ai ruinat cea mai mare afacere! Cu toate acestea… actul trei se apropie. Iar în el, eroul își dă ultima suflare!"
uw.dlgHW21StorySensei_1 = "De când vin zeii lumii de dincolo aici sus ca să stoarcă bani de la oamenii de rând? Dă-ți jos masca, amăgitorule, înainte să punem mâna pe arme!"
uw.dlgHW21StorySensei_2 = "Teatrul ar trebui să inspire, nu să îngrozească. Iar tu ai deformat însăși esența artei. Te vom opri înainte ca „actorii” tăi să aibă de suferit."
uw.dlgHW21StoryThief_1 = "Așteaptă! Sunt eu… Sly! Nu mă lovi! Mi-a promis că toată lumea se va teme de mine… și că nimeni nu mă va recunoaște. Cum de m-am dat de gol?"
uw.dlgHW21StoryThief_2 = "Proprietarul teatrului ambulant — Păpușarul. A spus că va fi cea mai bună reprezentație a lui. Zei printre oameni! N-a însemnat nimic pentru mine. Dar banii, pe de altă parte…"
uw.dlgHW21WinPuppeteer_1 = "Este un fiasco! Mi-ai distrus complotul minunat și mi-ai spart măștile! Cum să mai pun în scenă o piesă acum, fără recuzită…"
uw.dlgHW22EnterArchitect = "Toată narațiunea asta fantastică a voastră m-a epuizat… Acum vom juca după regulile mele. Și este în interesul tău să mă surprinzi, Shadow…"
uw.dlgHW22LooseArchitect_1 = "Era de așteptat. Îți știu toate mișcările, Shadow. Până la urmă, eu am fost cel care te-a inventat. Poate că nu eram în cea mai bună formă atunci… Dar acum o să-ți placă noua ta viață."
uw.dlgHW22StoryArchitect_1 = "Asta se numește un „clișeu”, Păpușarule. Pentru ce sunt plătiți dramaturgii? Pentru numărul de caractere? Personajul geniului nebun și bânguitor s-a învechit, la fel ca și cel al eroului…"
uw.dlgHW22StoryArchitect_2 = "Gata. Îți vom rescrie lumea de la zero! Contemporan, creativ, relevant! Ce mai e la modă printre adolescenți în zilele noastre? De ce nu spui nimic, Shadow? Ah, da…"
uw.dlgHW22StoryPuppeteer_1 = "Se aude un ciocănit — un ciocănit neașteptat la ușa ta! Să fie oare un călător venit în vizită sau ceva mai mult? Intrigant, nu-i așa?"
uw.dlgHW22StoryPuppeteer_2 = "Știam eu că o să spui asta, bătrâne. La ce altceva te poți aștepta de la niște personaje inventate? Hârtia suportă orice… Dar publicul, niciodată!"
uw.dlgHW22StoryPuppeteer_3 = "Sunt doar un sclav al scenei, asta-i tot. Iar noua mea capodoperă va povesti despre o întâlnire cu creatorul — despre chinurile predestinării și ale liberului arbitru…"
uw.dlgHW22StorySensei_1 = "Orice ai fi clocit, Păpușarule, nu ne mai jucăm jocurile tale. Arta poate provoca durere, dar nu în felul în care o practici tu."
uw.dlgHW22StorySensei_2 = "Ai jucat prea mult teatru și nu mai poți deosebi realitatea de fanteziile tale, artistule… Ești nebun."
uw.dlgHW22StorySensei_3 = "Cuvintele tale sunt ciudate și îngrijorătoare, străinule… Nu știu ce nebunie îți mișună prin cap, dar Shadow ți-o va scoate din minți."
uw.dlgHW22WinArchitect_1 = "Se prea poate ca această creație să nu mai aparțină creatorului ei și să fi prins o viață proprie… M-ai surprins. Vreau să văd încotro se îndreaptă povestea acum."
uw.dlgHoaxenGreetings = "Toată viaţa ta este doar o iluzie. Iar noi suntem creatorii ei. Te vom aduce la nebunie în timp ce alţii se bazează pe forţa brută. Foc, apă, boli — hah!"
uw.dlgHoaxenLost = "Unde ești, frate? Nu-ţi mai pot auzi vocea! Cu adevărat, să fii închis complet singur este mai rău decât focul sau lama... Duceţi-vă, proștilor. Tatăl vă așteaptă."
uw.dlgHoaxenStory1 = "„Noi”? Umbră, se pare că dușmanul nostru și-a pierdut minţile. Scuză-mă, cu care dintre personalităţile tale vorbim? Poate „fratele” tău ar putea fi mai raţional?"
uw.dlgHoaxenStory2 = "Râzi de noi, omule? Fratele meu sugerează ca sufletele voastre să fie trimise în abisul suferinţei eterne... Atunci lumea voastră se va preda, fără nici măcar o picătură de sânge."
uw.dlgHoaxenWin = "Te-aș fi ucis, căci mila mea este cu adevărat nemărginită. Dar fratele meu este mai puţin tolerant; ești liber să pleci, în caz că nu-ţi pierzi minţile pe drumul spre ieșire."
uw.dlgHunter_enter_hunter_1 = "Tu! Ei, tuuu! Ai venit să termini ce ai îîînceput, nu-i așa? Tu? Ai o putere în tine. Îmi vooorbește. Liniște! Sau te voooi obliga eu!"
uw.dlgHunter_greeting_may_1 = "Uită-te! E ceva în interiorul cristalului… Așa ar trebui să fie?"
uw.dlgHunter_greeting_saimon_1 = "Ce ciudat… Mă așteptam ca Lazarus să facă Obeliscul praf și pulbere. Mă temeam de măcel, dar se pare că am rămas doar tu și cu mine. Sunt intrigat."
uw.dlgHunter_greeting_saimon_2 = "Sala de Concentrare. Vezi acel cristal din centru? Așa acumulează Obeliscul energia umbrei — inima întunericului, ca să spunem așa."
uw.dlgHunter_greeting_sensei_1 = "Tăcerea este un semn rău, prietene rațional. Poate vorbi mai tare decât cele mai asurzitoare cuvinte. Hmm… Unde suntem? Ce este acest loc bizar?"
uw.dlgHunter_greeting_sensei_2 = "Mă îndoiesc, draga mea… Locul ăsta arată altfel decât atunci când l-am văzut ultima oară. Încep să cred că bătrânul avea dreptate…"
uw.dlgHunter_loose_hunter_1 = "Așaaaază-te. Te voi lăsaaa aici pe veeeecie. Nu mai face rrrrău."
uw.dlgHunter_win_hunter_1 = "Oprește-te, om-Shadow! Nu-l lăsa să se răăăspândească! Vei fiii ca eeeeeel. Vei fi amăăăăgit! Dar încă mai ai o șaaaansă."
uw.dlgIE21AnnounceAssistant_1 = "Cine naiba mai e și ăsta? Ce cauți în lumea noastră și de ce ar trebui măcar să te ascultăm?"
uw.dlgIE21AnnounceAssistant_2 = "Ha! Nu știu de unde ai răsărit, dar nu vei rămâne aici pentru mult timp!"
uw.dlgIE21AnnounceAssistant_3 = "Hei, Shadow, bătăușul ăsta a mers prea departe! Hai să-i dăm o lecție de bune maniere!"
uw.dlgIE21AnnounceBoss_1 = "Muritori patetici! Plecați-vă în fața voinței și gloriei mele, altfel vă voi pune în genunchi cu forța!"
uw.dlgIE21AnnounceBoss_2 = "Cum îndrăznești să-mi vorbești așa — eu sunt Ravana, cuceritorul tuturor celor trei lumi!"
uw.dlgIE21AnnounceBoss_3 = "Aceasta este ultima ta șansă de a îngenunchea. Refuză, și îți voi lua capul!"
uw.dlgIE21AnnounceSensei_1 = "Shadow, simt că se apropie o amenințare misterioasă. Ceva malefic a pătruns din nou în lumea noastră."
uw.dlgIE21Boss_After_Loose = "Dacă toți oamenii din această lume sunt atât de slabi, atunci cucerirea ei este doar o chestiune de timp!"
uw.dlgIE21Boss_After_Win = "NEBUNILOR! Mă retrag pentru moment, dar nu mă veți învinge atât de ușor. Mă voi întoarce!"
uw.dlgIndia22Story_May_1 = "Și așa ați început să îndurați foamea… Ce-o fi vrut acest demon de la sărbătoarea voastră plină de bucurie? Cum de niște fermieri umili au atras un asemenea prădător?"
uw.dlgIndia22Story_Rakshasa_1 = "Ai un miros interesant, omule. Fără îndoială ai fi la fel de gustos! Îmi auzi burta cum chiorăie? O bucată aleasă de carne care să meargă cu orezul meu ar fi binevenită!"
uw.dlgIndia22Story_Rakshasa_Lose = "Din fericire pentru tine, lupta noastră m-a stors de puteri. În plus, foamea mi-e potolită… momentan. O să-mi fac din nou poftă și voi vâna iarăși!"
uw.dlgIndia22Story_Sensei_1 = "Spune-mi despre el, călătorule. După haine, văd că ai călătorit departe. Ce necaz îți tulbură căminul?"
uw.dlgIndia22Story_Sensei_2 = "Înfrânează-ți apetitul, demonule! Nu va exista nicio invitație la festivalul vieții pentru cel care fură viața însăși!"
uw.dlgIndia22Story_Sensei_Win = "Nu magia face o grădină să înflorească — ci munca grea. Și ai să dovedești asta singur: ajută-ți vecinii să-și refacă ferma, altfel…"
uw.dlgIndia22Story_Sitaram_1 = "Ți-am auzit povestea vieții. Zeii să te răsplătească după merite! Vin cu vești proaste: un spirit malefic a apărut pe pământurile mele…"
uw.dlgIndia22Story_Sitaram_2 = "Răutatea acestui demon este egalată doar de foamea lui! Ne pregăteam să sărbătorim Bohag Bihu când, deodată, această… creatură a apărut și ne-a devorat toate răsadurile!"
uw.dlgIndia22Story_Sitaram_3 = "Martor mi-e Agni, doamnă, și eu îmi pun aceeași întrebare! Acum așteptăm cu groază apusul soarelui… Vino cu mine, te rog din suflet!"
uw.dlgIndia24_Enter_Puppet_1 = "Ai spiritul necesar pentru a dirija destinul? Decide-l pe al meu, umil slujitor al artelor ce sunt. Doar în luptă înțelegi cu adevărat ce și cum. Fii îndrăzneț, Shadow — atacă!"
uw.dlgIndia24_Story_Dandy_1 = "Deschideți, sau sparg ușa asta blestemată! Știu că sunteți acasă — vă aud! Dau foc cocioabei ăsteia dacă nu-mi oferiți adăpost!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "O, cât de pătimaș se agață muritorii de viață. Nu eu am ales această îndeletnicire și nu voi vărsa lacrimi veninoase pentru asta… De ce mi-ai făcut asta?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Inima ei este plină de iubire. Zeii ne creează puri, dar noi ne alegem propria cale. Nrityu începe să înțeleagă asta în timp ce ascultă povestea fetei."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, interpretării tale îi lipsesc pasiunea și dăruirea. Îți voi mai da o șansă. Nu te preface că joci — trăiește-o!"
uw.dlgIndia24_Story_Puppet_1 = "Cioc, cioc! Hei, vechi prieteni! Vocea destinului ne cheamă — iar ea este pe drum! Tivul ei roșu mocnește ca viața însăși la sfârșitul zilei!"
uw.dlgIndia24_Story_Puppet_2 = "Oare pentru sufletul tău a venit? Priviți o poveste la fel de veche ca lumea însăși — legenda lui Nrityu, al cărei destin a fost să fie o secerătoare de vieți."
uw.dlgIndia24_Story_Puppet_3 = "Toate fantomele pălăvrăgesc. Nu poți avea încredere în ele. Și în plus, nu este povestea lor. Îți voi arăta adevărul prin ochii ei. Shadow, ești singurul care poate înțelege."
uw.dlgIndia24_Story_Sensei_1 = "Vocea aceea… Se pare că vechiul nostru adversar pune iar ceva la cale. Cine va fi victima de data asta? Văd un om alergând spre pagodă…"
uw.dlgIndia24_Story_Sensei_2 = "Hainele îți sunt pline de murdărie și funingine, străinule. Iar tonul tău mă neliniștește. Explică-ne cine ești și ce treabă ai la ușa noastră!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Înapoi! N-am vrut asta! Familiei mele îi era frică de mine și am crezut că asta e șansa mea… Dandy mi-a promis că mă ia cu el, doar dacă îl ajut…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "Poftim! Cazi într-un somn etern, deși nu-l meriți. Dar nu-i treaba mea să te judec — aceea este chemarea altcuiva. Eu sunt doar însoțitorul."
uw.dlgIndia24_Story_Win_Puppet_4 = "Exact ca tine, Shadow. Vreau să urmezi calea lui Nrityu. I-a luat o veșnicie să-și înțeleagă locul."
uw.dlgIndia24_Story_Win_Puppet_6 = "Spectacolul continuă! Tu, Shadow, vei fi vedeta, iar actorii mei vor fi distribuția ta secundară. Povestea lui Nrityu va fi cea mai mare producție a noastră!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Povestea asta este profundă — chiar și pentru tine. Sunt surprins! Dar care este morala aici? De ce ne arăți asta?"
uw.dlgMegalithGreetings = "Această mină este un loc sacru. De ce ești aici? Pleacă și întâmpină-ţi destinul cu onoare. Ultimul lucru pe care îl vei auzi va fi pământul cutremurându-se sub picioarele tale."
uw.dlgMegalithLost = "Blestem! Va trebui oare să aștept din nou mii de ani? Am mutat continente! Purificarea pământului era rolul meu!"
uw.dlgMegalithWin = "I-am tratat pe oameni cu blândeţe, o trăsătură rară printre Eterni. V-am ajutat specia de multe ori. Așa că fugi și ia-ţi rămas-bun de la cei dragi!"
uw.dlgRaidIntro1 = "Încerci să-ţi corectezi greșeala? Ai deschis Porţile, dar numai Eternii pot elimina contagiunea Umbrei. Nefiind unul de-ai noștri, ești slab."
uw.dlgRaidIntro2 = "Vei muri, ca toţi ceilalţi. Magma îmi curge prin vene și va acoperi tot pământul, curăţându-l pentru o viaţă nouă."
uw.dlgRaidStory1 = "Ce pivniţă este aceasta și ce căutăm noi aici?"
uw.dlgRaidStory2 = "Aceasta este anticamera domeniului Eternilor. Somnul lor a durat milenii, dar Porţile Umbrelor au pus lumea în pericol. S-au trezit."
uw.dlgRaidStory3 = "Grozav — asta înseamnă că ne vor ajuta să ne ocupăm de Porţi rapid și ușor!"
uw.dlgRaidStory4 = "O, nu. Ei vor distruge Porţile, dar vor distruge și întreaga omenire. Pentru ei, este doar un alt ciclu de distrugere și creaţie."
uw.dlgShurale_Announce = "Trezit de bandiți lacomi, spiritul pădurii se răzbună acum pe cei inocenți. Creatura caută caseta cu amintiri furată — receptaculul magiei sale străvechi. Doar cei ale căror inimi adăpostesc o durere adevărată pot potoli furia creaturii. Prețul, însă, va fi piperat…"
uw.dlgStoryBtnFight = "LUPTĂ!"
uw.dlgStoryBtnMore = "MAI MULTE"
uw.dlgVolcanoGreetings = "Dintre toţi Eternii, am fost primul care s-a trezit. Mulţi luptători vor veni să moară de mâna mea, îmi voi îndeplini misiunea."
uw.dlgVolcanoLost = "Destul! Conced. Dar află asta: mi-ai trezit fratele. Să nu fii înșelat de înfăţișarea lui, căci este rapid și mortal!"
uw.dlgVolcanoStory1 = "Am văzut niște locuinţe pe jumătate dărâmate și o statuie uriașă. Trăiesc oameni aici?"
uw.dlgVolcanoStory2 = "Doar fanatici. Ei venerează Eternii în speranţa de a fi cruţaţi. Cu adevărat, sunt orbi în credinţa lor. Dacă eșuăm, vor afla în curând adevărul."
uw.dlgVolcanoWin = "Le tot spuneam fraţilor mei că este datoria mea să decid destinul planetei. Priviţi, necredincioșilor, cum vâlvătaia mea acoperă pământul!"
uw.dlgVortexGreetings = "Apele întunecate vor înghiţi pământul și Porţile Umbrelor! Secretul lor va fi pierdut în abis. Și nu va mai rămâne nimeni la suprafaţă care să-l povestească!"
uw.dlgVortexLost = "Pentru prima dată într-o mie de ani, un om câștigă. Voinţa ta de a trăi este atât de puternică! Dar orice ai face, sfârșitul va fi același: vei muri."
uw.dlgVortexWin = "Timp de mii de ani am privit ofilirea neamului vostru. E o frumuseţe în ea. Cred că te voi lăsa în viaţă — doar pentru amuzament."
uw.dlgWhisperGreetings = "Se pare că cineva abia așteaptă să-și afle destinul. Dă-mi mâna și privește în oglindă!"
uw.dlgWhisperLost = "Mai trăiești? Înseamnă că nu ești încă în puterea mea! Fatum îți va prezice destinul, iar apoi mă voi întoarce în lumea mea — după ce te-am avertizat să calci cu băgare de seamă când vine vorba de oglinzi!"
uw.dlgWhisperWin = "Te voi lua cu mine în tărâmul cenușii, al spiritelor și al nopții eterne! Ai încredere în mine — privește-mă în ochi și nu-ți întoarce privirea."
uw.dlg_American_25_Loose_1 = "Nu știi pe cine protejezi, Shadow. N-o să-ți mulțumească. O să rânjească doar pe la spatele tău. Sălbatici… și eu sunt monstrul?"
uw.dlg_American_25_Story_1 = "May a dispărut. Luată de ceva ce abia dacă era uman. Și totuși, n-au fost țipete, nici semne de luptă… de parcă ar fi plecat de bunăvoie."
uw.dlg_American_25_Story_2 = "Nu suntem singuri în situația asta. Și alții ca May — tineri, puternici — au dispărut de asemenea. Ea a simțit că se apropie… și și-a umplut buzunarele cu praf de pușcă."
uw.dlg_American_25_Story_3 = "Urma ei este clară. Trebuie să o găsim înainte să vină ploile, altfel va fi pierdută definitiv. Vino, Shadow!"
uw.dlg_American_25_Story_4 = "Te-am mirosit din clipa în care ai pus piciorul pe acest pământ blestemat. De ce ai venit? Ca să-mi calci în picioare suferința? N-ai deloc onoare — exact așa cum nici ei n-au avut."
uw.dlg_American_25_Story_5 = "Știam eu că o să apari, șamanule. Dă copiii înapoi neamului lor, iar pe prietena noastră dă-ne-o nouă. Apoi du-te și putrezește pe muntele tău de cenușă."
uw.dlg_American_25_Story_6 = "Cenușă din cenușă. Și în cenușă te vei întoarce, muritorule…"
uw.dlg_American_25_Win_1 = "Așteaptă! M-am dus cu el de bunăvoie. Înfățișarea lui e monstruoasă, da — dar inima lui e umană. Și suferă… I-au furat copilul!"
uw.dlg_CHN_NY25_Announce = "Cufundă-te în povestea unui erou din vremuri apuse — descurcă adevărul de basm și ajută la făurirea unei noi legende! Înfruntă un cult misterios care folosește numele unui mare erou drept paravan pentru atrocitățile sale! Întoarce-te în locul unde a început totul și ajută un pușlama pribeag să-și descopere adevăratul eroism!"
uw.dlg_CHN_NY25_Loose_1 = "Nu, trebuie să continuăm lupta! Nimeni n-ar crede că un simplu fermier poate învinge atât de ușor un cult sinistru. Trebuie să dai tot ce ai mai bun!"
uw.dlg_CHN_NY25_Story_1 = "Cultul Soarelui are tradiția de a vizita locul de naștere al marelui lor erou o dată pe an. Dar de fiecare dată, totul se dovedește a fi un dezastru…"
uw.dlg_CHN_NY25_Story_2 = "S-a născut om? Ce curios. Mie mi se pare că oamenii ăștia nu aduc daruri în sat…"
uw.dlg_CHN_NY25_Story_3 = "Nu lasă nimic neatins! Fură vitele sătenilor, distrug recoltele într-o frenzie de oameni beți, sparg ferestre și caută ceartă!"
uw.dlg_CHN_NY25_Story_4 = "Dar de care nu ripostează sătenii? Acesta este pământul lor și legenda lor!"
uw.dlg_CHN_NY25_Story_5 = "Sunt dărâmați. Eroul care le dădea speranță a pierit, iar cultiștii fac fapte rele în numele lui. Trebuie să le dăm din nou speranță!"
uw.dlg_CHN_NY25_Story_6 = "Spune că ai venit să verifici dacă totul este gata pentru „sărbătoare”. Și ne vom lupta! Locuitorii orașului vor vedea că se pot opune cultului!"
uw.dlg_CHN_NY25_Story_7 = "Fie, cum vrei tu… Lasă-mă să intru în rol. „Hei, băiatu', cum îndrăznești să porți veșmintele eroului nostru! Valea — avem un ospăț de pregătit!”"
uw.dlg_CHN_NY25_Story_8 = "Poate că nu sunt un erou de legendă, dar spiritul lui trăiește în acest pământ! Mă va călăuzi în cele mai întunecate clipe și îmi va da curaj! Atacați!"
uw.dlg_CHN_NY25_Win_1 = "Nu mă așteptam la o asemenea viteză de la un simplu om… Aproape că l-ai învins pe campionul nostru! Trebuie să facem din tine un exemplu, ca nu cumva să le vină și altora idei…"
uw.dlg_NY25_Loose_1 = "Amintirile tale sunt vii, iar durerea vorbește mai tare decât rațiunea. Vei rămâne aici cu mine. Odihnește-te puțin — somnul va veni curând."
uw.dlg_NY25_Story_1 = "Bun venit! Cabana aceasta a aparținut cândva familiei mele. Atâtea amintiri… Rămâneți cât doriți. Aveți aici tot ce vă trebuie ca să vă odihniți."
uw.dlg_NY25_Story_2 = "Dar ne-ai pus în pericol de atâtea ori, iar acum ne oferi găzduire în casa familiei tale? Este vreun fel de truc?"
uw.dlg_NY25_Story_3 = "E doar vocea conștiinței! Mi-am dat seama că am profitat prea mult timp de bunătatea altora. Dar acum vreau să fac bine."
uw.dlg_NY25_Story_4 = "Nu suntem singuri… Se strâng oameni în fața colibei. Ce vor la ora asta târzie? Ne cer să ieșim afară."
uw.dlg_NY25_Story_5 = "Nu ieșiți! Fantomele vă vor distruge! Nu sunt decât strigoi ai unor amintiri dureroase. Spiritul pădurii a venit după cufărul lui! Să-l recuperăm!"
uw.dlg_NY25_Story_6 = "Un cufăr? Deci de asta dispăreau oamenii în pădure! De ce ne-ai trădat, Sly? Te-am fi ajutat oricum în această misiune nobilă!"
uw.dlg_NY25_Story_7 = "Nu înțelegi. Dacă îi aud vocea, o să-mi pierd controlul — și voi dispărea și eu. Atâta timp cât port o bucățică din ea cu mine."
uw.dlg_NY25_Story_8 = "Deschide ușa, tăticule, îngheț aici afară. Casa e rece și eu nu sunt înăuntru. Îți voi arăta un loc unde putem fi din nou împreună."
uw.dlg_NY25_Story_9 = "Oprește-te! Nu te duce în pădure — te vei rătăci! Nu știu a cui voce o auzi, dar cu siguranță nu este una umană!"
uw.dlg_NY25_Win_1 = "Trezește-te, Sly! Înapoiază cufărul spiritului cât timp este slăbit. Lasă-l să vadă că omenirea își poate depăși propria lăcomie."
uw.saturn_enter_saturn_1 = "Îți voi vârî cuvintele înapoi pe gât. Iar prietenii tăi vor privi. Singura cale de a părăsi închisoarea mea este prin eșafod. Cine vrea să meargă primul?"
uw.saturn_greeting_saimon_1 = "Conducătorul nostru, Patriarhul, a studiat portalul ani de zile. Apoi, într-o zi, s-a izolat în sine. Mai târziu, a ridicat Obeliscul, iar acesta a făcut ceva lumii noastre…"
uw.saturn_greeting_saimon_2 = "Shadow este similar cu Obeliscul la nivel molecular. Există cineva care ne va ajuta să folosim asta împotriva Patriarhului. De aceea suntem aici, în camera lui Saturn…"
uw.saturn_greeting_saimon_3 = "Mii de scuze, doamnă. Cu toate acestea, trebuie să-l eliberăm pe Lazarus. Te rog, arată-ne celula lui și nu te vom mai deranja."
uw.saturn_greeting_saturn_1 = "Plecați departe, copii? Ați venit în închisoarea mea de bunăvoie! Mă întreb — o fi bravură sau prostie? Tu, ăla deșirat — răspunde-mi!"
uw.saturn_greetingn_May_1 = "Dar ce legătură are asta cu noi?"
uw.saturn_lose_saturn_1 = "Vă ajunge. Dacă Lazarus se însoțește cu lepădături ca voi, nu există niciun pericol pentru Patriarh. Valea de aici, puștilor! Nu sunteți pe lista mea."
uw.saturn_win_saturn_1 = "Nu-l veți găsi niciodată pe Lazarus. Ticălosul ăla a evadat din închisoarea mea și a fugit în mlaștini. Vreți să pieriți și voi? Atunci valea după el!"
uw.summerfest25_story2_1 = "Ia te uită… Ați fost atât de dornici să mă găsiți, încât m-am gândit să vă fac favoarea asta. În plus, toată lumea aștepta momentul acesta."
uw.summerfest25_story2_2 = "„Toată lumea”? Lasă teatrul. Știm exact cine ești — și cum te folosești de alții doar ca să te desfătezi cu nefericirea lor."
uw.summerfest25_story2_3 = "Doar o scurtă apariție și bum — sunt în tendințe! Sincer, nu mă așteptam să fiu atât de popular."
uw.summerfest25_story2_4 = "Spiritualitatea ta nu te va salva. Vei plăti — pentru ochii mei și pentru tot răul pe care l-ai făcut. Jocul tău bolnav de-a dumnezeul se termină aici!"
uw.summerfest25_story2_5 = "Serios, Ermine? Genul ăsta de discurs a dispărut odată cu telefoanele cu clapetă. Suntem în 2026 — încearcă să ții pasul cu vremurile."
uw.summerfest25_story2_6 = "Orice ar plănui Arhitectul… e un întuneric în jurul lui. O forță atât de malefică, încât e aproape tangibilă."
uw.summerfest25_story2_7 = "Cu fiecare cuvânt pe care îl spune, mă surprind crezând povestea lui Ermine tot mai mult. Arhitectul este periculos — și trebuie oprit."
uw.summerfest25_story2_defeat_1 = "O, nu — ce dezamăgire! Publicul se aștepta la mai mult. Se pare că data viitoare va trebui pur și simplu să măresc mizele."
uw.summerfest25_story2_win_1 = "De cy este lumea atât de crudă? De ce trebuie să suferim? De ce a trebuit să mă orbesc singur? Răspunde-mi, Arhitectule — de ce doare să trăiești?!"
uw.tutorial_ascention_intro_title = "PĂPUȘARUL"
