uw.EnterPortal_ActScreen = "Portal"
uw.FRAGILITY = "Vulnerabilitate crescută în zona indicată."
uw.Gatekeeper_greetings_1 = "Aer ciudat? Aer ciudat! Aeeer ciudat!"
uw.Gatekeeper_greetings_2 = "Nu bucuroși, nu bucuroși, nu bucuroși! Am făcut, am făcut, am făcut!"
uw.Gatekeeper_greetings_Assistant_1 = "Shadow! În sfârșit te-ai trezit!"
uw.Gatekeeper_greetings_Assistant_2 = "E atât de frig aici! Deja nu-mi mai simt degetele… Unde suntem? Aerul pare atât de ciudat."
uw.Gatekeeper_greetings_Assistant_3 = "But de ce am senzația că ne înțelege?"
uw.Gatekeeper_greetings_Sensei = "Înapoi, May! Nu știm ce vrea! Lumea Nemuritorilor a fost zdruncinată mai mult decât credeam. După ce am făcut, nu sunt deloc bucuroși că ne aflăm aici."
uw.Gatekeeper_greetings_Sensei_2 = "Calm acum — nu faceți mișcări bruște. Se pare că această creatură nu este prea inteligentă."
uw.Gatekeeper_greetings_Sensei_3 = "Asta nu mai contează acum. Trecerea prin portal a fost alegerea noastră și trebuie să răspundem pentru ea. Vrea o luptă — nu avem de ales, Shadow."
uw.Gatekeeper_lost_Saimon = "Mă așteptam la mai mult de la portal… Se pare că călătoria ți-a secătuit puterile, iar legăturile tale moleculare sunt slăbite. Interesant — trebuie să mai facem câteva teste."
uw.Gatekeeper_win_Saimon = "Timp de secole, acest portal șubred ne-a amintit că există forțe dincolo de înțelegerea noastră. Apoi ai apărut tu…"
uw.HARD_GROUND = "Când cazi la pământ, primești daune."
uw.HEAD_BERSTUUK = "Masca lui Berstuuk"
uw.HEALTH_DROPS = "Viaţa scade în timp."
uw.HOT_GROUND = "Pământ fierbinte."
uw.HW20Arkhos1 = "N-am nevoie de viziuni ca să văd că focul credinței îi va mistui atât pe cei slabi, cât și pe cei orbi. Am adus lumânări negre, pentru ca toți să vadă acest adevăr la fel de clar ca mine!"
uw.HW20Fatum1 = "Granițele dintre lumi devin fragile — aceasta este cea mai potrivită noapte pentru profeții! Aerul zumzăie de magie, iar în mâinile mele se încolăcesc chiar firele destinului!"
uw.HW20Fatum2 = "Ghicitul, pentru mine, este un joc — pot face ce vreau cu destinele muritorilor. Dar voi, prieteni, sunteți o cu totul altă poveste. Vă rog, luați loc!"
uw.HW20Fatum3 = "Ai fost orbit de ură. Să începem. Nu vorbi, ci ascultă. Văd o siluetă… neagră ca noaptea… pene și cenușă… luându-mă de mână…"
uw.HW20Fatum4 = "Cum… cum ai ajuns aici? Calea către această lume a fost sigilată împotriva ta!"
uw.HW20Megalith1 = "Ai vorbit despre ghicit și despre un bal mascat, așa că am adus o oglindă magică. Pentru prima dată într-o mie de ani, îmi pot vedea reflexia. Masca asta mă face să arăt străvechi!"
uw.HW20Whisper1 = "Te-ai jucat de-a profeția, surioară? Te ocupi de destinele muritorilor? Astfel de jucării au fost întotdeauna doar ale mele!"
uw.HW20Whisper2 = "Sigilată a fost! Dar tu ai chemat, iar prin această oglindă minunată, am venit. O iau cu mine. Să nu uiți să mă vizitezi ca să-ți ghicesc viitorul cel adevărat!"
uw.Hunger_AfterLoss = "Din moment ce ești cel ales, îţi dau o ultimă șansă să rrămâi cu mine și să te ospătezi. Altfel, oasele tale vor cădea pentru a se alăturrra celorlalte în praf."
uw.Hunger_AfterWin = "Creatorule, mi-ai trimis hrană, dar nu este de ajuns. Foamea mea este eternă, oferă-mi eliberarea..."
uw.Hunger_Greetings1 = "Ai călătorit un drum destul de lung pentru a ajunge aici. De ce? Pentru a-i salva pe murrritorii nerecunoscători? Nu le pasă deloc de tine! Îţi pot simţi singurătatea, foamea și... frica."
uw.Hunger_Greetings2 = "Shadow, nu te lăsa păcălit! Doar pare slab. Nu ești prietenul lui, ești doar prada lui. Te va rupe în bucăţi dacă te apropii mai mult!"
uw.Hunger_Greetings3 = "Îi vezi pe fraţii mei? Le este sete, dar setea lor este de un alt soi. Ei tânjesc după divertisment. Dar foamea lor nu e nimic în comparaţie cu a mea!"
uw.INVERTED_JOYSTICK = "Mișcare inversată."
uw.LIGHT_IN_THE_DARK = "Lumină în întuneric"
uw.MERCENARY_RAID = "UNITATE{br}DE MERCENARI"
uw.MERCENARY_RAID_Title = "Unitate de Mercenari"
uw.MiniEventAnnounce = "Din timpuri imemoriale, un cult sălășluiește în măruntaiele pământului, veghind asupra somnului fragil al zeilor lumii de dincolo și împiedicând trezirea lor. Dar prețul este o luptă ritualică crudă, dusă până la ultima picătură de sânge."
uw.MiniEventHungerFight_Enter_1 = "Aici, sub pământ, totul este altfel. Ne luptăm ca să trăim, iar mâncarea înseamnă viață! Nu-ți priva oamenii — și nici pe ai mei — de această mare bucurie!"
uw.MiniEventHungerStory_1 = "Oamenilor le pasă de capriciile spiritelor doar când necazul se abate asupra caselor lor. Recoltele li se ofilesc, copiii le flămânzesc… Și unde le este credința acum?"
uw.MiniEventHungerStory_2 = "Foamea are o formă. Setea ei de a mistui este groaznică. Dar acesta este rolul lui Karcer, în timp ce al tău și al meu este să-l împiedicăm să se trezească din somnul său de secole."
uw.MiniEventHunger_Loss_1 = "Mama ta nu te-a învățat să nu lași nimic în farfurie? Se vede — e foame în ochii tăi! Sau… ce este în neregulă cu tine?"
uw.MiniEventHunger_Win_1 = "Da, lovești bine, Shadow… Hai să-ți sărbătorim victoria cu o masă copioasă! Dau eu!"
uw.MiniEventStory_1 = "Văd că tu, Shadow, ești puternic și neclintit în spirit. Legendele despre faptele tale sunt răspândite pretutindeni. Ți-ar plăcea să devii parte dintr-o altă legendă?"
uw.MiniEventStory_2 = "Spiritele lumii de dincolo sunt capricioase. Noi săvârșim o ceremonie pentru a le domoli firea — bătălii ritualice! Participarea ta ar fi o onoare pentru noi."
uw.MiniEventStory_EnterBattle = "Nu ești cam firav pentru un asemenea spectacol arcan? Și chiar pe ăsta l-ați ales? Acesta e omul de legendă? O, spiritele vor fi revoltate…"
uw.MiniEventStory_Loss_1 = "Da, mă rog… Vreau să cred că până și spiritele au simțul umorului și că doar vor râde de bâlbâiala noastră din arenă, în loc să-și reverse furia asupra noastră…"
uw.MiniEventStory_Win_1 = "Ei bine… Nimeni nu ajunge în această arenă din întâmplare. Cu adevărat ești un om de legendă, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "Vrăjitoarea te sperie fără motiv. Este mult mai simplu de atât: oțelul se călește în foc! Zeii înțeleg doar puterea și nimic altceva. Doar puterea îi poate trimite înapoi la somnul lor! Atacați!"
uw.MiniEventVulkanStory_1 = "Focul purificator este drept — așa spun strămoșii noștri. Dar ei nu știau că Nemuritorilor nu le pasă deloc de moralitatea umană. Aceasta este puți și simplu natura lor."
uw.MiniEventVulkanStory_2 = "Simți căldura cum se ridică de sub pământ? Există un lucru pe care trebuie să-l știi: flacăra nu iartă pe nimeni, fie el prieten sau străin. Iar noi ne aflăm direct în calea ei."
uw.MiniEventVulkan_Loss_1 = "Trebuie să te ridici pe picioare, Shadow! Nu simți cum se cutremură pământul?! Zeul este dezgustat de cum ne pierdem vremea în praf…"
uw.MiniEventVulkan_Win_1 = "E cald ca în focul iadului aici… Spiritul focului mormăie mulțumit în cripta lui! O luptă excelentă, Shadow! Am mai câștigat o zi!"
