# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "Povestea lui Sensei{br}Partea 1. Martorul"
sensei.entry.ActScreenSensei2 = "Povestea lui Sensei{br}Partea 2. Umbra Viitorului"
sensei.entry.ActScreenSensei3 = "Povestea lui Sensei{br}Partea 3. Bestia din Interior"
sensei.entry.ActScreenSensei4 = "Povestea lui Sensei{br}Partea 4. Povestea Răzbunării"
sensei.entry.ActScreenSensei5 = "Povestea lui Sensei{br}Partea 5. Umiliţi și Jigniţi"
sensei.entry.ActScreenSensei6 = "Povestea lui Sensei{br}Partea 6. Monstrul"
sensei.entry.ButcherYoung_Greetings = "Nimeni nu îndrăznește să se îndoiască de autoritatea mea! Familia nu iartă niciodată asta. Nu vei pleca de-aici în viaţă!"
sensei.entry.Butcher_zone3_1 = "Fiul risipitor se întoarce! Te-ai gândit la propunerea mea, Prinţule? Te las să pleci și îţi spun unde este Sfera, iar tu mă plătești în aur."
sensei.entry.Butcher_zone3_2 = "Tăcerea lui este mai asurzitoare decât cuvintele, bătrâne. Eu? Eu sunt sincer cu mine însumi — îmi accept natura bestială. El nu. Dar vă vom învăţa umilinţa! Veniţi, copiii mei!"
sensei.entry.Guard1_Butcher_Sensei = "Măcelarul mi-a arătat cum durerea ne dezvăluie adevăratul sine. Acum sunt liber! Și tu poţi găsi fericirea. Nu te împotrivi!"
sensei.entry.Guard1_Hermit_Sensei = "Schimbarea este iminentă! Am străbătut jumătate de lume pentru a o învăţa, am sacrificat atât de mult... Înţelepciunea Maestrului este tot ce am!"
sensei.entry.Guard1_Lynx_Sensei = "Îţi plac tatuajele mele? În ţinutul în care m-am născut, cei mai puternici le primesc ca amintiri ale isprăvilor lor. În curând vei face și tu parte din tablou..."
sensei.entry.Guard1_Wasp_Sensei = "Crezi în noroc? Cred că azi îmi voi face norocul luându-ţi toţi banii. Crezi că vei avea noroc, bătrâne?"
sensei.entry.Guard1_Widow_Sensei = "Doamna mea îmi este ca o soră. Îi simt durerea. Ea îmi interzice să mă ating de Prinţ, așa că mânia mea va cădea asupra ta!"
sensei.entry.Guard2_Butcher_Sensei = "Jocul e ca și câștigat! Filozofia e pentru tocilari — mie îmi place doar să mă joc cu cuţitele. Vrei să te joci cu mine?"
sensei.entry.Guard2_Hermit_Sensei = "Maestrul ne-a povestit despre lumea umbrelor — despre locuitorii ei și puterea imensă pe care o va împărţi cu noi. Crezi că te voi lăsa să ne iei toate acestea?"
sensei.entry.Guard2_Lynx_Sensei = "Clanul nostru face o treabă care e prea murdară chiar și pentru zei. Noi rezolvăm probleme și corectăm greșelile altora. Iar tu — tu ești una dintre acele greșeli."
sensei.entry.Guard2_Wasp_Sensei = "Îmi ameninţi căpitanul? M-a salvat din sclavie, iar eu am jurat să-mi răscumpăr libertatea prin muncă. Fie ca spiritele să fie blânde cu tine..."
sensei.entry.Guard2_Widow_Sensei = "Doamna mea este atât de frumoasă! Am fost nedemn să-i văd chipul... Acum viaţa mea îi aparţine. Îi voi proteja onoarea până la ultima mea suflare."
sensei.entry.HermitYoung_Greetings = "Ești o victimă a circumstanţelor, Prinţule — un sacrificiu necesar pentru binele comun. Școala mea va atinge măreţia, iar epoca de aur a artelor marţiale va începe!"
sensei.entry.Hermit_zone2_1 = "Ești între ciocan și nicovală, stăpâne. Recunosc — te-am trădat. Nu am avut de ales, totuși — viitorul școlii mele este în joc."
sensei.entry.Hermit_zone2_2 = "Lynx, acel tânăr arogant, nu s-a descurcat cu sarcina sa. Va trebui să-i fac eu treaba. Discipoli, adunarea!"
sensei.entry.LynxYoung_Greetings = "Nu pot să plec pur și simplu. Am fost deja plătit pentru viaţa Prinţului. Nimic personal, bătrâne."
sensei.entry.Lynx_Sensei_1 = "Nu-l asculta pe Prinţ, bătrâne — doar și-a pierdut minţile. Îl ducem pe Alteţa Sa acasă înainte să se rănească. Nu este nevoie de ajutorul tău."
sensei.entry.Lynx_Sensei_2 = "Într-adevăr? De unde stau eu, văd un om înspăimântat înconjurat de ucigași. Ceva îmi spune că Prinţul spune adevărul. Îndepărtaţi-vă de el!"
sensei.entry.Lynx_Sensei_3 = "Fă ce vrei. Nu sunt plătit ca să vorbesc. Două capete înseamnă mai mulţi bani. Luaţi-i, băieţi!"
sensei.entry.NAME_BUTCHER = "MĂCELAR"
sensei.entry.NAME_HERMIT = "PUSTNIC"
sensei.entry.NAME_LYNX = "LYNX"
sensei.entry.NAME_PRINCE = "PRINŢ"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "VIESPE"
sensei.entry.NAME_WIDOW = "VĂDUVĂ"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Ajutor! Oamenii aceștia vor să mă omoare!"
sensei.entry.Prince_zone3_1 = "Cum îndrăznești să-mi murdărești numele! Tu... ticălos mizerabil! M-am întors să pun capăt domniei tale pline de cruzime!"
sensei.entry.Prince_zone6_1 = "Iată-te, prietenul meu loial! Privește — dreptatea triumfă din nou. Shogun este câinele meu credincios. Mintea lui e a mea!"
sensei.entry.Prince_zone6_2 = "Și tu, bătrâne? Vrei să-mi iei tronul?! Îl deţin prin drept din naștere! Nimeni nu mi-l va lua!"
sensei.entry.Sensei_arc_intro1 = "A fost odată ca niciodată, mă plimbam și m-am întâlnit cu lordul local — era într-o mare suferinţă..."
sensei.entry.Sensei_zone3_1 = "Deci asta înseamnă „noroc”? Să-ţi cumperi libertatea și să-ţi dai oamenii pe mâna unei bande de nebuni... Și eu am fost atât de bun cu tine, Prinţule."
sensei.entry.Sensei_zone4_1 = "Văduva? Desigur... ea mi-a spus să iau Sfera și să i-o aduc lui Shogun — chiar în mâinile lui."
sensei.entry.Sensei_zone6_1 = "Prinţule, oprește-te! Privește în jur! Sfera se hrănește cu furia ta, transformându-te într-un monstru!"
sensei.entry.Shogun_zone6_1 = "Slăbănogule! Nici măcar nu ești destul de bun pentru a fi bufonul curţii lordului meu. Te voi zdrobi cu o singură lovitură!"
sensei.entry.TITLE_PRINCE_EVIL = "PRINŢUL BÂNTUIT"
sensei.entry.WaspYoung_Greetings = "Ce ar trebui să-i spun tatălui meu? Că fiica lui s-a muiat și a pierdut o luptă în faţa unui moșneag? Asta n-o să se întâmple atâta timp cât sunt moștenitoarea tronului piraţilor!"
sensei.entry.Wasp_zone4_1 = "Văduva te trimite să iei Sfera? Nu ești cam bătrân pentru astfel de treburi? Ah, de ce mi-ar păsa? Urcă la bord."
sensei.entry.Wasp_zone4_2 = "Chestia e că nu mai am Sfera. Oamenii Văduvei au luat-o ieri. Nu știu cine ești, dar nu iert niciodată mincinoșii. Treceţi-l pe sub chilă!"
sensei.entry.WidowYoung_Greetings = "Prinţul m-a umilit — m-a respins, a râs de sentimentele mele. Acum voi lovi și eu! Ești prietenul lui, așa că îi vei transmite acest mesaj..."
sensei.entry.Widow_zone5_1 = "Ai venit să mă umilești la fel cum a făcut-o Prinţul? Voi, masculii, sunteţi toţi la fel..."
sensei.entry.Widow_zone5_2 = "Mi-a tot povestit despre bunătatea, onoarea și demnitatea ta. Dar nu mai cred cuvintele niciunui mascul. Fiecare dintre voi va suferi!"
sensei.entry.Zone2_SenseiReminder = "Ultima dată, ţi-am povestit cum l-am salvat pe Prinţ de asasini. Am aflat că Pustnicul își antrena soldaţii în secret. Așa că acolo ne-am dus."
sensei.entry.Zone3_SenseiReminder = "Pustnicul ne-a spus că lordul de război al Prinţului, Shogun, și-a trădat stăpânul și a plătit un anume Măcelar să-l răpească. Era timpul să-l vizităm pe bandit."
sensei.entry.Zone4_SenseiReminder = "Problemele Prinţului au fost cauzate de o femeie! Ea a pus la cale un plan pentru a-l răsturna folosind o Sferă magică — care acum era adusă în portul din apropiere..."
sensei.entry.Zone5_SenseiReminder = "Fata pirat mi-a povestit despre istoria complicată a Văduvei cu Prinţul. Nu am obţinut Sfera, dar am aflat că Prinţul s-a dus la munte să o găsească pe Văduvă."
sensei.entry.Zone6_SenseiReminder = "Sfera magică l-a înnebunit pe Prinţ! I-a oferit o putere imensă... o putere care ameninţa să ne distrugă pe toţi! Nu puteam permite să se întâmple asta."
