sensei.defeat.OK = "OK"
sensei.defeat.Sensei_defeat1 = "Nu, stai... Nu s-a întâmplat așa... Te rog să ierţi uitarea bătrânului."
sensei.defeat.Sensei_defeat2 = "Cred că s-a întâmplat altfel... Amintirile pot fi foarte fragile."
sensei.defeat.Sensei_defeat3 = "Cred că nu așa s-a terminat acea luptă. Lasă-mă să încerc să mi-o amintesc..."
sensei.defeat.Sensei_defeat4 = "Amintirile mele sunt atât de vagi... Cred că am câștigat acea luptă."
sensei.defeat.Sensei_defeat5 = "Nu, nu a fost așa. Se pare că am câștigat atunci... probabil."
sensei.defeat.characterSensei = "SENSEI"
