uw.blackness_enter_blackness_1 = "Urmași. Un mare sacrificiu. O sferă. Mintea. Măcel. Simt. Vei vărsa sânge. Văd durere. Văd viitorul. Îți voi arăta."
uw.blackness_greeting_blackness_1 = "Ce s-a întâmplat, Shadow? Îți este rău?"
uw.blackness_greeting_lazarus_2 = "Simon? Ce ticălos ești! De ce ai adus oameni aici? Le va simți mirosul gândurilor! Plecați de aici înainte ca Întunecimea să vă guste mintea!"
uw.blackness_greeting_may_1 = "Auzi asta? Nimic! Tăcere. Fără cântecul păsărilor, e ca și cum locul ăsta ar fi încremenit în chihlimbar. Oare facem ce trebuie? Am o presimțire foarte rea…"
uw.blackness_greeting_saimon_2 = "Acești domni distinși sunt biletul tău spre libertate, dragul meu. Cel mare în negru are cumva legătură cu Obeliscul și cu Porțile. El te ajută pe tine, iar tu îl ajuți pe el."
uw.blackness_greetingn_saimon_1 = "Nici nu-i de mirare. De când un fragment din vechile Porți s-a prăbușit aici, viața în acest loc a fost o anomalie statistică. Fiți cu ochii în patru — trebuie să-l găsim pe Lazarus."
uw.blackness_lose_blackness_1 = "Tu rămâi aici. Etern. Un singur sânge. Pentru totdeauna. Te voi citi. Mă voi hrăni."
uw.blackness_win_sensei = "Ne-ai mințit, om al științei! Pe cine am eliberat? La ce am condamnat această lume? Îți dai seama ce ai făcut?!"
