uw.Gatekeeper_greetings_1 = "Garip hava mı? Garip hava! Gaaa-rip hava!"
uw.Gatekeeper_greetings_2 = "Mutlu değiller, mutlu değiller, mutlu değiller! Yaptık, yaptık, yaptık!"
uw.Gatekeeper_greetings_Assistant_1 = "Shadow! Sonunda uyandın!"
uw.Gatekeeper_greetings_Assistant_2 = "Burada çok soğuk! Parmaklarımı hissetmiyorum bile... Neredeyiz? Hava çok garip."
uw.Gatekeeper_greetings_Assistant_3 = "Ama neden bizi anlıyormuş gibi hissediyorum?"
uw.Gatekeeper_greetings_Sensei = "Geri dur May! Ne istediğini bilmiyoruz! Ölümsüzler dünyası sandığımdan daha fazla sarsıldı. Yaptıklarımızdan sonra burada olmamızdan mutlu değiller."
uw.Gatekeeper_greetings_Sensei_2 = "Sakin ol—ani hareketler yapma. Görünüşe göre bu yaratık pek zeki değil."
uw.Gatekeeper_greetings_Sensei_3 = "Şu an bu önemli değil. Portaldan geçmek bizim seçimimizdi ve bunun hesabını vermeliyiz. Savaş istiyor—başka şansımız yok Shadow."
uw.Gatekeeper_lost_Saimon = "Portal'dan daha fazlasını bekliyordum... Görünüşe göre yolculuk gücünü tüketti ve moleküler bağların zayıfladı. İlginç—birkaç test daha yapmalıyız."
uw.Gatekeeper_win_Saimon = "Yüzyıllardır bu derme çatma portal, anlayışımızın ötesinde güçler olduğunu bize hatırlattı. Sonra sen geldin..."
uw.HARD_GROUND = "Yere düştüğünde hasar alırsın."
uw.HEAD_BERSTUUK = "Berstuuk'un Maskesi"
uw.HEALTH_DROPS = "Canın zamanla azalır"
uw.HOT_GROUND = "Sıcak Zemin"
uw.HW20Arkhos1 = "İnanç ateşinin hem zayıfları hem de körleri tüketeceğini görmek için ileri görüşlülüğe ihtiyacım yok. Siyah mumlar getirdim, böylece herkes bu gerçeği benim kadar net görebilir!"
uw.HW20Fatum1 = "Dünyalar arasındaki sınırlar inceliyor—bu kehanet için en iyi gece! Hava sihirle uğulduyor ve ellerimde kaderin iplikleri düğümlenmiş durumda!"
uw.HW20Fatum2 = "Fal bakmak benim için bir oyun—ölümlülerin kaderiyle istediğimi yapabilirim. Ama siz arkadaşlarım, bambaşka bir mesele. Lütfen, oturun!"
uw.HW20Fatum3 = "Nefretinle kör olmuşsun. Başlayalım. Konuşma, sadece dinle. Bir silüet görüyorum... gece kadar siyah... tüyler ve küller... elimden tutuyor..."
uw.HW20Fatum4 = "Nasıl... buraya nasıl geldin? Bu dünyaya giden yol sana karşı mühürlenmişti!"
uw.HW20Megalith1 = "Fal bakmaktan ve maskeli balodan bahsettin, ben de sihirli bir ayna getirdim. Bin yıldır ilk kez yansımamı görebiliyorum. Bu maske beni antik gösteriyor!"
uw.HW20Whisper1 = "Kehanetçilik mi oynuyordun küçük kız kardeş? Ölümlü kaderlerin sorumluluğunu mu üstlendin? Böyle oyuncaklar her zaman sadece bana ait olmuştur!"
uw.HW20Whisper2 = "Mühürlüydü doğru! Ama sen çağırdın ve bu harika ayna aracılığıyla geldim. Onu yanımda götürüyorum. Ziyarete gelmeyi unutma, biraz gerçek fal dinle!"
uw.Hunger_AfterLoss = "Seçilmiş kişi olduğun için, sana yanımda kalıp ziyafet etmen için son bir şans vereceğim. Aksi takdirde kemiklerin tozun içinde diğerlerininkine karışacak."
uw.Hunger_AfterWin = "Yaratıcı, sen bana yiyecek gönderdin ama bu yetmez. Benim açlığım ebedi, bana kurtuluş ver..."
uw.Hunger_Greetings1 = "Buraya gelmek için uzun bir yol kat ettin. Neden? Bu nankör ölümlüleri kurtarmak için mi? Seni daha az önemseyemezlerdi! Ben senin yalnızlığını hissedebilirim, açlığını, ve... korkunu."
uw.Hunger_Greetings2 = "Gölge, aldanma! O yalnızca zayıflıkları görür. Onun arkadaşı değil, yalnızca avısın. Daha fazla yaklaşırsan seni parçalara ayıracak!"
uw.Hunger_Greetings3 = "Kardeşlerimi görüyor musun? Susadılar ama onların susuzluğu daha farklı. Eğlenmeye hasretler. Ama onların açlıkları benimkinin yanında bir hiç!"
uw.INVERTED_JOYSTICK = "Tersine hareket"
uw.LIGHT_IN_THE_DARK = "Karanlıktaki Işık"
uw.MERCENARY_RAID = "PARALI ASKER{br}BİRLİĞİ"
uw.MERCENARY_RAID_Title = "Paralı Asker Birliği"
uw.MiniEventAnnounce = "Kadim zamanlardan beri bir tarikat, yeraltı tanrılarının hassas uykularını gözleyerek ve uyanmalarını engelleyerek yerin derinliklerinde yaşadı. Ancak bedeli, son kan damlasına kadar süren acımasız bir ritüel savaşıdır."
uw.MiniEventHungerFight_Enter_1 = "Burada, yerin altında her şey farklıdır. Yaşamak için savaşırız ve yemek hayattır! İnsanlarını—veya benimkileri—bu büyük neşeden mahrum etme!"
uw.MiniEventHungerStory_1 = "İnsanlar ruhların kaprislerini ancak evlerine bela indiğinde önemserler. Mahsulleri kurur, çocukları aç kalır... Peki inançları şimdi nerede?"
uw.MiniEventHungerStory_2 = "Açlığın bir biçimi vardır. Tüketme susuzluğu korkunçtur. Ancak bu Karcer'in rolüdür, seninki ve benimki ise onun asırlık uykusundan uyanmasını engellemektir."
uw.MiniEventHunger_Loss_1 = "Annen sana tabağında bir şey bırakmaman gerektiğini öğretmedi mi? Belli oluyor—gözlerinde açlık var! Ya da... senin sorunun ne?"
uw.MiniEventHunger_Win_1 = "Evet, iyi vuruyorsun Shadow... Zaferini doyurucu bir yemekle kutlayalım! Ismarlıyorum!"
uw.MiniEventStory_1 = "Görüyorum ki sen Shadow, güçlü ve sarsılmaz bir ruha sahipsin. Yaptıklarının efsaneleri yaygın. Bir başkasının parçası olmak ister misin?"
uw.MiniEventStory_2 = "Yeraltı dünyasının ruhları kaprislidir. Onların mizaçlarını ılımlılaştırmak için bir seremoni yaparız—ritüel savaşları! Katılımın bizim için onur olurdu."
uw.MiniEventStory_EnterBattle = "Böyle bir gizemli gösteri için biraz cılız değil misin? Ve bunu seçtin, gerçekten mi? Bu mu efsanevi adam? Oh, ruhlar öfkelenecek..."
uw.MiniEventStory_Loss_1 = "Evet, peki... İnanmak istiyorum ki ruhların bile bir mizah anlayışı var ve onlar üzerimize öfkelerini salmak yerine arenadaki acemiliğimize gülecekler..."
uw.MiniEventStory_Win_1 = "Peki... Buraya kimse şans eseri gelmez. Sen gerçekten efsanelerden biriymişsin, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "Cadı seni sebepsiz yere korkutuyor. İş bundan çok daha basit: çelik ateşle sertleşir! Tanrılar güçten ve başka hiçbir şeyden anlamazlar. Onları uykuya döndürecek olan tek şey güçtür! Saldır!"
uw.MiniEventVulkanStory_1 = "Arındırıcı ateş kutsaldır—atalarımız böyle der. Ama Ölümsüzlerin insan ahlakını hiç umursamadığını bilmiyorlardı. Bu sadece onların doğası."
uw.MiniEventVulkanStory_2 = "Yerin altından yükselen ısıyı hissediyor musun? Bilmen gereken tek bir şey var: alev kimseyi ayırt etmez, dost ya da yabancı olsun. Ve biz tam yolunun üzerindeyiz."
uw.MiniEventVulkan_Loss_1 = "Ayağa kalkmalısın Shadow! Yerin titrediğini hissetmiyor musun?! Tanrı bizim toz içindeki önemsizleşmemizden iğreniyor..."
uw.MiniEventVulkan_Win_1 = "Burası cehennem ateşi gibi sıcak... Ateş ruhu mahzeninde memnuniyetle hırıldıyor! Güzel bir dövüş oldu Shadow! Bir gün daha kazandık!"
