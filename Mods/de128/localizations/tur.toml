# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Rüya görmüyorsun. Küre'yi yeniden gölgelere döndürmek için zamanı durdurdum. Onun buradaki varlığı bir hataydı — Gölgeler Kapısı'nın istikrarsızlığından kaynaklandı."
sensei.victory.Ancient_zone6_2 = "Değişim kaçınılmazdır, insanoğlu. Şimdilik uyu. Uyandığında, hiç kimse senin bu büyük başarını hatırlamayacak. Böyle olması gerekiyor. Bir gün, anlayacaksın..."
sensei.victory.Butcher_zone3_3 = "Ha-ha! Tabanlarını yağlayan Prens'e bakın! Yüzünü görmeliydin, yaşlı adam. Gördün mü—yeni arkadaşın omurgasız bir yalancı!"
sensei.victory.Butcher_zone3_4 = "Prens son nefesini verir vermez Shogun'ın kellemi uçuracağını biliyorum. Ben sadece bir aracım; harcanabilirim. Bu yüzden—sana yardım etmeliyim."
sensei.victory.Butcher_zone3_5 = "Malum kadın, Şogun’u tahtın hukuken kendisine ait olduğuna ikna etti. Kendisine tabi olması karşılığında; ona Küre’yi vermeyi ve onu büyük bir savaş beyi yapmayı vadetti."
sensei.victory.Butcher_zone3_6 = "Limana git. Shogun, Küre'yi getirecek geminin varmasını bekliyor. Bu, Prens'in tahtını kurtarmak için son şansı."
sensei.victory.Hermit_zone2_3 = "Anlamaya çalış; dövüş sanatları yolun sonuna geldi! Hayatta kalabilmesi için değişmesi gerekiyor. Nasıl olacağını biliyorum; Shogun adamlarını eğitmem karşılığında bana koruma sözü verdi."
sensei.victory.Hermit_zone2_4 = "Kasap, çetesiyle birlikte buradan pek de uzak olmayan bir yerde kalıyor. Sizi kaçıranlar onlardı, Hünkârım. Gidin; dilerim aradığınız cevapları bulursunuz."
sensei.victory.NAME_BUTCHER = "KASAP"
sensei.victory.NAME_HERMIT = "HERMIT"
sensei.victory.NAME_PRINCE = "PRENS"
sensei.victory.NAME_WASP = "WASP"
sensei.victory.NAME_WIDOW = "WIDOW"
sensei.victory.OK = "TAMAM"
sensei.victory.Prince_zone1_1 = "Teşekkür ederim! Sen asil birisin, çok az kişi tanımadığı biri için karşı durur. Merhametten anlamayan bu insanlarla ölümün yakın olduğunu düşünmüştüm."
sensei.victory.Prince_zone1_2 = "Öğrenmemem gereken bir şeyi öğrendim: askerlerim belirli bir Hermit altında yasaklı uygulamaları araştırıyorlar. Şahit olarak beni ortadan kaldırmak istediler..."
sensei.victory.Prince_zone1_3 = "İşleri açığa kavuşturmak için bir grup adam aldım ama esir alındım. Ancak şans hâlâ benden yanaymış ki kaçabildim."
sensei.victory.Prince_zone2_1 = "ADAMLARIM! Ordumun başına onu yerleştirmek bir hataydı... Ama bir tutam onurunuz varsa bize haydut kampının nerede olduğunu söyleyin!"
sensei.victory.Sensei_arc_outro = "Devam edecek...."
sensei.victory.Sensei_zone1_1 = "Tesadüfler aşırı fazla. Birisi ziyaretimizden haberdardı ve haydutları uyardı. Ama Hermit buna nasıl dâhil oldu? Bunu öğrenmeliyiz. Gidelim!"
sensei.victory.Sensei_zone2_1 = "Yazıklar olsun sana! Bütünüyle onurunu satıyorsun! Ve ne için? İnsanların bir hainin liderliğini izleyeceğini düşünüyor musun? Genç bir insan için bu iyi bir örnek mi?"
sensei.victory.Sensei_zone3_2 = "Bana cevap ver, Shogun onu neden ölü istiyor ve bahsettiğiniz şu sihirli Küre nedir?"
sensei.victory.Sensei_zone4_2 = "Widow'u bulmadan önce Prens'i durdurmalıyız.... Ve de Küre'yi..."
sensei.victory.Sensei_zone5_1 = "Sana sempati duyuyorum, gerçekten. Ama kırık bir kalp zayıf bir danışmandır. Lütfen şunu anla: insanlar senin yüzünden acı çekiyor."
sensei.victory.Sensei_zone6_2 = "Bekle! Bir sürü sorum var! Sen kimsin? Bunların ardında, Kapıların ardında ne var? Bilmek istiyorum..."
sensei.victory.Wasp_zone4_3 = "Dur—Seni hafife almışım, yaşlı adam! Teslimat için bana ödeme yapıldı ama Widow'un onuru için savaşmak gibi bir derdim yok. Saklanma yerini sana göstereceğim!"
sensei.victory.Wasp_zone4_4 = "Widow, Prensi sevdi ama Prens onu reddetti. Widow da kendine yeni bir oyuncak buldu: Shogun. Kocakarı aptal savaş lordunu intikam için kullanıyor."
sensei.victory.Wasp_zone4_5 = "Widow adamları yönetmek ve birbirlerine karşı onları oynatmak istiyor. Küre seçilmiş kişisini büyük... ve ona mutlak biçimde sadık kılacak."
sensei.victory.Widow_zone5_3 = "Benim için geri dönüş yolu yok. Yardım etmeye çalıştığını görüyorum ama artık çok geç—Prens, Küre'yi zaten aldı. Shogun bunu boşu boşuna korumaya çalışıyordu."
sensei.victory.Widow_zone5_4 = "Prens'i hiç bu kadar... çıldırmış görmedim. Gözlerinden alev fışkırıyordu! İlk tanıştığımız yerde bir haini idam etmenin eğlenceli olacağını düşünmüştü. Sana göstereyim..."
sensei.victory.characterAncient = "KADİM"
sensei.victory.characterSensei = "SENSEY"
# END Sensei sensei.victory.

