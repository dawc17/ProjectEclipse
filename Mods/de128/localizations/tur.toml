uw.Tenebris_greetings_1 = "Gerçekliğin sınırındasın yolcu. Burası sınır. Bu hattın ötesinde dünyaların doğduğu boşluk var. Ve o dünyaların ışığını ve karanlığını ben işledim!"
uw.Tenebris_greetings_2 = "Gölge, onun arkasındaki geçit kurtuluşumuz için şans olabilir. Ölümsüzler dünyamıza kıyamet getireceğini söyledi. Belki onlar bu geçiti kullanmayı düşünüyordur?"
uw.Tenebris_greetings_3 = "Geçitte hayatta kalamazsın! Orası hiçlik. Dünyaların yaratıldığı karanlık. Ancak sen yaratamazsın, yalnızca yok edersin. Kapı seni tamamen yutar!"
uw.Tenebris_greetings_4 = "Bu bir risk ancak başka bir seçeneğimiz var mı? Belki ölümsüzlerin geçidi aşmasını durdurabiliriz. Aynı zamanda büyük bir felakete yol açabiliriz."
uw.Tenebris_loses = "Karanlıkta gizlenen bilinmezden korkuyor musun? Şimdi tek başına yüzleşmek için kalacaksın! Dünya kül olmaya başlayacak ve küllerinden doğacak. Döngüyü devam ettirecek."
uw.Tenebris_wins = "İnatçı ahmak! Siz insanlar problemleri yalnızca kaba kuvvetle çözersiniz. Ama evren böyle çalışmıyor. Sayısız yıl geçti ve siz hiçbir şey öğrenmediniz..."
uw.Title_Sitaram = "SİTARAM"
uw.War_AfterLoss = "Kukla, ayağa kalk! Ve dövüş! Kazanman ya da kaybetmen bir şey ifade etmez. Dövüştüğünde, bana hizmet edersin!"
uw.War_AfterWin = "Sahtekar! Nerede senin öfken? Onsuz nasıl dövüşebilirsin? Dövüş benimle! Hadi başka bir bıçak dansına başlayalım! İçinde savaş yaşıyor, biliyorum!"
uw.War_Greetings1 = "Ne mükemmel bir gün! Savaşın fırtına gibi yaklaştığını hissediyorum. Gök gürültüsü. Lejyonların muazzam öfkesi ayak uyduruyor. Hepsi sunağıma hediye!"
uw.War_Greetings2 = "Hiddet ve kana susamışlık onun içinde kaynıyor. O sonsuz savaştan zevk alır ama neden? Kafatası dağının tepesinde ne bulacak?"
uw.War_Greetings3 = "Kanlı savaşın heyecanı sana yabancı mı? Ateş, tutku, şiddetli güç! Ne yapabildiğini göster! Tekli dövüşte beni eğlendir ya da öl!"
