uw.dlgAmericanEvent22Story_May_1 = "Tamamen donmuş durumda, Sensei! Kapıda böyle fırtınalar kükrerken onu dışarı atamayız..."
uw.dlgAmericanEvent22Story_Puma_1 = "Beladayım, yaşlı adam... Halkımın geçmişinin beni takip edeceğini hiç düşünmemiştim, ama etti. Onları korumak için kaçtım. Lütfen, beni dinle!"
uw.dlgAmericanEvent22Story_Puma_2 = "Bunu sen de duyabiliyor musun? Çocukken bir şaman bana uluması dalgaları yükselten ve yaprakları yolan bir ruhtan bahsetmişti. O eski masalın gerçek çıkacağını hiç düşünmemiştim!"
uw.dlgAmericanEvent22Story_Puma_3 = "Bizi nefesimiz tükenene kadar çığlığıyla kovalamak için buraya geliyor... Sadece spor olsun diye! Saklanacak başka bir yer bilmiyorum..."
uw.dlgAmericanEvent22Story_Sensei_1 = "Meskenimin kapıları acı çeken herkese açıktır. Ancak bu duvarlar içinde bir korsan görmek beklenmedik bir durum... Peki senin haydut çeten nerede, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Şamanların mitleri alegoridir. İnsanlar rüzgarı evcilleştirmek için yelkenleri icat etti ve o günden beri onlara iyi hizmet etti. Sen sadece aptal bir peri masalısın ve Shadow bunu kanıtlayacak!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Ben Kurt Rüzgar'ım! Benimle karşılaşmaya gelen herkes bir mum gibi sönecek! Ve er ya da geç kapını kıracağım. Sadece zaman meselesi!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Yapraklar enkazı kaplayana kadar u-u-ulu-y-ac-a-ğ-ım. Kimse buraya giden yolu asla bulamayacak! Cesur ve aptal... Elementlere karşı nasıl savaşabilirsin, ölümlü?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Ne büyük bir utanç... Kudretli sesimi aldın! Ama inancın, kızım, beni hayata döndürecek... Ve yalnız gelmeyeceğim! Çünkü biz çokuz!"
uw.dlgArkhosGreetings = "Gözü dönmüş fanatikler! Beni hatırlıyor ve Baba'ya olan inancınızla beni besliyorsunuz. Bir ebeveyn sert olabilir; siz de verdiğim cezayı minnetle kabul edeceksiniz..."
uw.dlgArkhosLost = "Bu son saatimde kime inanacağım? Yaratıcı, neden beni terkettin? Bana onları yönetecek güç verdin ama ben seni hayal kırıklığına uğrattım… Yeniden."
uw.dlgArkhosStory1 = "Onun türünü biliyorum. Onlar yalanlarla besledikleri ustaları bir araya getirirler. Onun ortalığı karıştıran vaazlarını dinleme çünkü bu onun asıl silahıdır."
uw.dlgArkhosStory2 = "Yanılıyorsun, yaşlı adam. Asi çocuklar için benim de sert demirim var. Seni aileye katmam için bana dua edeceksin ama ben acımasız olacağım!"
uw.dlgArkhosWin = "Ailenin yüz karası, sen yanımda bir yer haketmiyorsun. Defol! Siz insanların nasıl başarısız olduğunu Yaratıcı’ya söyleyeceğim ve o benim çocuklarımı besleyecek."
uw.dlgBerstuuk_Announce = "Yasak bilgi peşinde koşan yetenekli bir bilim insanı, tanrı olma arayışında bilimi ve sihri birleştirdi. Ve dönüşüm kaçınılmaz! Artık orman onun kabus laboratuvarı ve insanlar avı. Bu korkunç metamorfozu sadece sen durdurabilirsin! Korkunu defet ve sahte putu aramak için çalılığın kalbine doğru atıl!"
uw.dlgBerstuuk_Loose_1 = "Kapıma geldiğinde, kelimeler olmadan her şeyi anlattın! Bu bilgiyi ince bir iplik gibi çekip çıkaracağım, geriye hiçbir şey kalmayana dek!"
uw.dlgBerstuuk_Story_1 = "Sly dışarıda ahır kapısını tıklatıyor... Gece ormanda çok şey gördüm ama bu başka bir şey! Nesi var onun?"
uw.dlgBerstuuk_Story_10 = "Yeterince değil. Bilim öngörülemez—sadece bana bak! Yavaş yavaş ormanı kabul ettim ama o beni kabul etmeyi reddetmeye devam etti. Şimdiye kadar."
uw.dlgBerstuuk_Story_2 = "Yardım arayanlar için yol doğru kapıya çıkar. Ama Sly yolunu kaybetmiş gibi... Yaşlı serseri, ellerine dikkat et! Ne oldu?"
uw.dlgBerstuuk_Story_3 = "Serseri yardım arıyordu ve buldu. Orman haklı olarak kendilerine ait olanı almadan önce oraya gidelim. İnsanların hayatları!"
uw.dlgBerstuuk_Story_4 = "\"İnsanlar\" mı? Zavallı şokta—yüzü yok! Onu ne bu kadar korkuttu da ani bir vicdan krizine girdi?"
uw.dlgBerstuuk_Story_5 = "Kuşların cıvıltısını duyabiliyor musun? Bu saatte ötmeleri gerekirdi ama burada ölüm sessizliğinden başka bir şey yok... Bu ormanda başka ne saklanıyor?"
uw.dlgBerstuuk_Story_6 = "Ölüm sessizliği. Ölüm sessizliği. İnsanların yardıma ihtiyacı var. Yar-dım et-me-li-sin. Şimdi yardım et!"
uw.dlgBerstuuk_Story_7 = "Tanrılar aşkına! İnsanlar ne kadar korkarlarsa korksunlar genellikle kuru dallara ve yosuna dönüşmezler! O şey nedir ve gerçek Sly nerede?!"
uw.dlgBerstuuk_Story_8 = "Buralarda bir yerde. Sly'ın küçük zihni çok yardımcı oldu. Bana senden bahsetti Shadow—özel gücünden. Ve aklıma geldi!"
uw.dlgBerstuuk_Story_9 = "Demek yaratığın bahsettiği kişi sensin? Orman gelecek ve alıp götürecek. Ve sen kaç tane \"haklı\" hayat aldın, çılgın adam?"
uw.dlgBerstuuk_Win_1 = "Doğa bir yolunu bulacak! Savaşımız bana fark ettiğinden çok daha fazlasını anlattı Shadow. Orman hatırlayacak. Beni tekrar canlanmak için tüketecek..."
uw.dlgFatumGreetings = "Cesaretiniz ancak ahmaklığınızla eşleştirilebilir. Ama geleceğinizi biliyordum, çünkü siz benim kaderimsiniz, ben de sizin. Kaderlerinizi sonsunza kadar yeniden yazacağım."
uw.dlgFatumLost = "İnsan ırkını iyi bilirim. Aynı sarmalda aşağı yukarı gidersiniz. Birden fazlasını gördüm. Kendini yok etme ve kurutma. Hiçbir şey bunu değiştiremez. Kaderin gibi."
uw.dlgFatumStory1 = "Dikkatli ol, kahraman, Alıştığın bu derin, evrensel kanunlar artık işe yaramıyor…"
uw.dlgFatumStory2 = "Haklısın! Çocuğun tasmasını tut. Kaderinizin tümünü biliyorum: kim{br}olduğunuzu ve nereye gittiğinizi. Sonda kimin öldüğünü söyleyeyim mi?"
uw.dlgFatumWin = "Yazgın çözüldü. İkametimin eşiğine ayak alttığında zaten kaybetmiştin. Öykünü yeniden yazacak cesaretin var mı?"
uw.dlgFungusGreetings = "Araziyi zehirledin ve şimdi mantarlarım ölüyor. Zihnini emmeliler ve hepimiz insan olmalıyız. Bu hikâyenin sonunu getirecek!"
uw.dlgFungusLost = "Tarikatım onların tanrıyı oynadığını unuttu. Tapınma onları yumuşattı. Ama yıkım insanın doğasında var; dünya siz olmadan daha iyi olacak."
uw.dlgFungusWin = "Defolun! Ve zavallı hayatlarınızın son dakikalarından zevk alın!"
uw.dlgHW21LosePuppeteer_1 = "Sana konuşmasız bir rolde bile güvenmezdim Shadow. Sahne senin yerin değil—sanatımı kirletme!"
uw.dlgHW21StoryArkhos_1 = "Veba kasabanıza geliyor, ölümlüler! Tanrınızın kudreti önünde eğilin! Ve gözlerinizi altının ışıltısıyla sevindirin, yoksa..."
uw.dlgHW21StoryPuppeteer_1 = "Sanattan ne anlarsın! En büyük girişimimi mahvettin! Yine de... üçüncü perde geliyor. Ve onda kahraman son nefesini veriyor!"
uw.dlgHW21StorySensei_1 = "Yeraltı tanrıları ne zamandan beri gelip sıradan insanlardan para sızdırıyor? Maskeni çıkar sahtekar, silahlanmadan önce!"
uw.dlgHW21StorySensei_2 = "Tiyatro korkutmamalı, ilham vermeli. Ve sen sanatın özünü çarpıttın. \"Aktörlerine\" zarar gelmeden önce seni durduracağız."
uw.dlgHW21StoryThief_1 = "Bekle! Benim... Sly! Vurma! Herkesin benden korkacağına söz verdi... Ve kimse beni tanıyamayacaktı. Kendimi nasıl ele verdim?"
uw.dlgHW21StoryThief_2 = "Gezgin tiyatronun sahibi—Kuklacı. En iyi performansı olacağını söyledi. İnsanlar arasındaki tanrılar! Benim için bir anlamı yoktu. Ama diğer yandan para..."
uw.dlgHW21WinPuppeteer_1 = "Bu bir fiyasko! Harika senaryomu mahvettin ve maskelerimi kırdın! Şimdi aksesuarlar olmadan bir oyun nasıl sahneleyeceğim..."
uw.dlgHW22EnterArchitect = "Senin bu fantezi anlatıların beni tüketti... Artık benim kurallarıma göre oynayacağız. Ve beni şaşırtmak senin yararına olur, Shadow..."
uw.dlgHW22LooseArchitect_1 = "Bunun olacağı belliydi. Tüm hamlelerini biliyorum Shadow. Sonuçta seni ben icat ettim. Belki o zaman formumda değildim... Ama yeni hayatını seveceksin."
uw.dlgHW22StoryArchitect_1 = "Buna \"klişe\" denir, Kuklacı. Oyun yazarlarına ne için para ödeniyor? Sembol sayısına mı? Kekeleyen çılgın dahi figürü, kahraman figürü gibi artık bayatladı..."
uw.dlgHW22StoryArchitect_2 = "İşte bu kadar. Dünyanı sıfırdan yeniden yazacağız! Çağdaş, yaratıcı, güncel! Gençler bugünlerde nelerden hoşlanıyor? Neden hiçbir şey söylemiyorsun Shadow? Ah, evet..."
uw.dlgHW22StoryPuppeteer_1 = "Bir tıkırtı var—kapında beklenmedik bir tıkırtı! Gelen bir gezgin mi, yoksa daha fazlası mı? Merak uyandırıcı, değil mi?"
uw.dlgHW22StoryPuppeteer_2 = "Bunu söyleyeceğini biliyordum yaşlı adam. İcat edilmiş karakterlerden başka ne beklenebilir ki? Kağıt her şeye dayanır... Ama izleyici asla dayanmaz!"
uw.dlgHW22StoryPuppeteer_3 = "Ben sadece sahnenin kölesiyim, hepsi bu. Ve yeni şaheserim yaratıcıyla buluşmayı anlatacak—kaderciliğin ve özgür iradenin acılarını..."
uw.dlgHW22StorySensei_1 = "Ne hayal ettiysen hayal et, Kuklacı, artık oyunlarını oynamayacağız. Sanat acı verebilir, ama senin uyguladığın şekilde değil."
uw.dlgHW22StorySensei_2 = "Çok fazla oyunculuk yaptın ve artık gerçekle fantezilerini ayıramıyorsun, performans sanatçısı... Sen delisin."
uw.dlgHW22StorySensei_3 = "Sözlerin tuhaf ve endişe verici, yabancı... Kafanın içinde nasıl bir delilik dönüyor bilmiyorum ama Shadow onu sana vura vura çıkaracak."
uw.dlgHW22WinArchitect_1 = "Belki de yaratım artık yaratıcısına ait değildir ve kendi hayatını kazanmıştır... Beni şaşırtın. Hikayenin bundan sonra nereye gittiğini görmek istiyorum."
uw.dlgHoaxenGreetings = "Tüm hayatın sadece bir illüzyon. Ve bizler de yaratıcısıyız. Diğerleri kaba kuvvete başvururken biz seni deli edeceğiz. Yangın, sel, hastalıklar - hah!"
uw.dlgHoaxenLost = "Neredesin birader? Artık sesini duyamıyorum! Gerçekten yapayalnız hapsolmak ateş ya da kılıçtan daha kötü… Gidin, salaklar. Tanrı, bekliyor."
uw.dlgHoaxenStory1 = "Biz'' mi? Gölge, görünen o ki düşmanımız kafayı sıyırmış. Pardon da hangi kişiliğinizle konuşuyoruz? Belki ''biraderin'' daha rasyonel olabilir."
uw.dlgHoaxenStory2 = "Bize mi gülüyorsun, insan? Biraderim ruhunun cehennemdeki ebedi ızdıraba gönderilmesini öneriyor… O zaman sözlerin tek bir damla kan olmaksızın boyun eğecek."
uw.dlgHoaxenWin = "Merhametim sonsuz olduğu için seni öldürürdüm. Falakt biraderim bu kadar hoşgörülü değil; çıkış yolunda delirmediğin takdirde gitmekte özgürsün."
uw.dlgHunter_enter_hunter_1 = "Sen! Hey, seeen! Başladığını bitirmeye mi geldin, hı? Sen? İçinde bir güç var. Bana fısıldıyor. Sus! Yoksa seni susstururum!"
uw.dlgHunter_greeting_may_1 = "Bak! Kristalin içinde bir şey var... Böyle mi olması gerekiyor?"
uw.dlgHunter_greeting_saimon_1 = "Ne kadar tuhaf... Lazarus'un Dikilitaş'ı toz haline getirmesini bekliyordum. Katliamdan korkuyordum ama görünen o ki sadece sen ve ben kaldık. Meraklandım."
uw.dlgHunter_greeting_saimon_2 = "Konsantrasyon Salonu. Merkezdeki o kristali görüyor musun? Dikilitaş gölge enerjisini böyle biriktirir—kısacası karanlığın kalbi."
uw.dlgHunter_greeting_sensei_1 = "Sessizlik kötü bir alamettir mantıklı dostum. En sağır edici kelimelerden daha yüksek konuşabilir. Hmm... Neredeyiz? Burası nasıl tuhaf bir yer?"
uw.dlgHunter_greeting_sensei_2 = "Ondan şüpheliyim tatlım... Burası en son gördüğümden beri farklı görünüyor. Yaşlı adamın haklı olmaya başladığını düşünüyorum..."
uw.dlgHunter_loose_hunter_1 = "Yat aaşağı. Seni burada sonsuza dek bırrrakacağım. Daaaha fazla zarar verme."
uw.dlgHunter_win_hunter_1 = "Dur, Shadow-insan! Yayılmasınnn! Onun gibi olacaaaksın. Kandırılacaaaksın! Ama hala bir şansın vaaar."
uw.dlgIE21AnnounceAssistant_1 = "O da kimin nesi? Dünyamızda ne yapıyorsun ve seni neden dinleyelim ki?"
uw.dlgIE21AnnounceAssistant_2 = "Ha! Nereden geldiğini bilmiyorum ama burada uzun süre kalmayacaksın!"
uw.dlgIE21AnnounceAssistant_3 = "Hey, Shadow, bu zorba haddini aştı! Hadi ona biraz görgü kuralları öğretelim!"
uw.dlgIE21AnnounceBoss_1 = "Sizi zavallı ölümlüler! İradem ve görkemim önünde diz çökün, yoksa sizi dizlerinizin üzerine zorla çöktürürüm!"
uw.dlgIE21AnnounceBoss_2 = "Bana nasıl böyle hitap etmeye cüret edersin—ben üç dünyanın da fatihi Ravana'yım!"
uw.dlgIE21AnnounceBoss_3 = "Diz çökmek için son şansın. Reddedersen, kafanı alırım!"
uw.dlgIE21AnnounceSensei_1 = "Shadow, gizemli bir tehdidin yaklaştığını hissediyorum. Kötü bir şey dünyamıza bir kez daha yolunu buldu."
uw.dlgIE21Boss_After_Loose = "Eğer bu dünyanın tüm insanları bu kadar zayıfsa, fethi sadece zaman meselesidir!"
uw.dlgIE21Boss_After_Win = "APTALLAR! Şimdilik geri çekiliyorum ama beni bu kadar kolay yenemezsiniz. Geri döneceğim!"
uw.dlgIndia22Story_May_1 = "Ve böylece aç kalmaya başladınız... Bu iblis sizin neşeli kutlamanızda ne istemiş olabilir? Mütevazı çiftçiler böyle bir yırtıcıyı nasıl çekmiş olabilir?"
uw.dlgIndia22Story_Rakshasa_1 = "İlginç bir kokun var, insan. Şüphesiz tadın da o kadar güzel olurdu! Karnımın gurultusunu duyabiliyor musun? Pirincimin yanında iyi bir parça et çok makbule geçerdi!"
uw.dlgIndia22Story_Rakshasa_Lose = "Senin şansına, dövüşümüz beni yordu. Ayrıca açlığım dindi... şimdilik. Taze bir iştah yapıp tekrar avlanacağım!"
uw.dlgIndia22Story_Sensei_1 = "Ondan bahset bana, gezgin. Kıyafetlerinden çok uzaklardan geldiğini görebiliyorum. Evinde ne gibi bir sorun var?"
uw.dlgIndia22Story_Sensei_2 = "İştahını frenle, iblis! Yaşamı çalan birine yaşam festivaline davet yok!"
uw.dlgIndia22Story_Sensei_Win = "Bir bahçeyi çiçek açtıran sihir değil—sıkı çalışmadır. Ve bunu kendin kanıtlayacaksın: komşularının çiftliklerini düzeltmelerine yardım et, yoksa..."
uw.dlgIndia22Story_Sitaram_1 = "Hayat hikayeni duydum. Tanrılar seni liyakatine göre ödüllendirsin! Kötü haberlerim var: topraklarımda kötü bir ruh belirdi..."
uw.dlgIndia22Story_Sitaram_2 = "Bu iblisin kötülüğü sadece açlığıyla kıyaslanabilir! Bohag Bihu'yu kutlamaya hazırlanırken aniden bu... yaratık belirdi ve tüm fidelerimizi yedi bitirdi!"
uw.dlgIndia22Story_Sitaram_3 = "Agni şahidim olsun hanımefendi, aynı soruyu ben de kendime soruyorum! Şimdi gün batımını korkuyla bekliyoruz... Benimle gel, yalvarırım!"
uw.dlgIndia24_Enter_Puppet_1 = "Kaderi yönetecek ruha sahip misin? Benimkine karar ver, sanatın mütevazı hizmetkarı. Sadece savaşta neyin ne olduğunu gerçekten anlarsın. Cesur ol Shadow—saldır!"
uw.dlgIndia24_Story_Dandy_1 = "Aç, yoksa bu lanet kapıyı kırarım! Evde olduğunuzu biliyorum—sizi duyabiliyorum! Eğer bana sığınak vermezseniz bu barakayı ateşe vereceğim!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Ah, ölümlüler hayata ne kadar da sıkı tutunuyor. Bu işi seçen ben değildim ve bunun için zehirli gözyaşları dökmeyeceğim... Bunu bana neden yaptın?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Kalbi sevgiyle dolu. Tanrılar bizi saf yaratır, ama kendi yolumuzu biz seçeriz. Nrityu, kızın hikayesini dinlerken bunu anlamaya başlıyor."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, performansın tutku ve bağlılıktan yoksun. Sana bir şans daha vereceğim. Oynama—yaşa!"
uw.dlgIndia24_Story_Puppet_1 = "Tık tık! Hey, eski dostlar! Kaderin sesi üzerimizde—ve yolda! Kırmızı eteği günün ölümünde hayatın kendisi gibi tütüyor!"
uw.dlgIndia24_Story_Puppet_2 = "Yoksa o senin ruhun için mi geldi? Dünya kadar eski bir hikayeye şahit ol—kaderi hayatları almak olan Nrityu'nun efsanesine."
uw.dlgIndia24_Story_Puppet_3 = "Hayaletlerin hepsi gevezelik ediyor. Onlara güvenemezsin. Hem sonra, bu onların anlatacağı bir hikaye değil. Sana gerçeği onun gözlerinden göstereceğim. Shadow, sadece sen anlayabilirsin."
uw.dlgIndia24_Story_Sensei_1 = "O ses... Görünüşe göre eski hasmımızın yine bir planı var. Bu seferki kurban kim olacak? Pagodaya doğru koşan bir adam görüyorum..."
uw.dlgIndia24_Story_Sensei_2 = "Kıyafetlerin kir ve kurum içinde, yabancı. Ve tonun beni huzursuz ediyor. Kim olduğunu ve kapımızda ne işin olduğunu açıkla!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Geri dur! Bunu istemedim! Ailem benden korkuyordu ve bunun benim şansım olduğunu düşündüm... Dandy yardım edersem beni de yanında götüreceğine söz vermişti..."
uw.dlgIndia24_Story_Win_Nrityu_1 = "İşte! Hak etmesen de sonsuz uykuya dalıyorsun. Ama seni yargılamak bana düşmez—bu başkasının çağrısı. Ben sadece eskortum."
uw.dlgIndia24_Story_Win_Puppet_4 = "Tıpkı senin gibi Shadow. Nrityu'nun yolunu izlemeni istiyorum. Kendi yerini anlaması bir sonsuzluk sürdü."
uw.dlgIndia24_Story_Win_Puppet_6 = "Şov devam ediyor! Sen Shadow, yıldız olacaksın ve aktörlerim senin yardımcı oyuncuların olacak. Nrityu'nun hikayesi en büyük yapımımız olacak!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Bu hikaye derinlere iniyor—senin için bile. Şaşırdım! Peki buradaki ahlaki ders ne? Bunu bize neden gösteriyorsun?"
uw.dlgMegalithGreetings = "Bu maden terk edilmiş bir yer. Neden buradasın? Ayrıl ve kaderinle şerefinle yüzleş. Duyacağın son şey ayağının altındaki yerkürenin sarsıntısı olacak."
uw.dlgMegalithLost = "Lanet olsun! Bin yıl daha mı beklemeliyim? Kıta değiştirdim! Dünyayı arındırmak benim rolümdü!"
uw.dlgMegalithWin = "Ebediler arasında nadir görünen bir şey olsa da İnsanlara nazik davrandım. Türünüze çok kez yardım ettim. O yüzden koşun ve sevdiklerinize son kez veda edin!"
uw.dlgRaidIntro1 = "Hatanı düzeltmeye mi çalışıyorsun? Kapıları açtın ama yalnızca Ebediler Gölge sirayetini saf dışı bırakabilir. Bizlerden biri değilsiniz, siz zayıfsınız."
uw.dlgRaidIntro2 = "Aynı diğerleri gibi ölmelisiniz. Magma damarlarımdan akıyor, yeni bir hayatı arındırmak için tüm araziyi kaplayacak."
uw.dlgRaidStory1 = "Bu kiler de ne böyle ve biz burada ne yapıyoruz?"
uw.dlgRaidStory2 = "Burası Ebedilerin alanının antresi. Uykuları bir milenyum sürdü ama Gölge Kapıları dünyayı tehlikeye attı. Uyandılar."
uw.dlgRaidStory3 = "İyiymiş - yani Kapılarla hızlı ve kolay biçimde başa çıkmamız için bize yardımcı olacaklardır!"
uw.dlgRaidStory4 = "Of hayır. Kapıları yok etmeliler ama tüm insan ırkını da yok etmeliler. Onlar için bu, yıkım ve yaratmanın bir diğer döngüsü sadece."
uw.dlgShurale_Announce = "Açgözlü haydutlar tarafından uyandırılan orman ruhu, şimdi masumlar üzerinde intikamını alıyor. Yaratık, antik büyüsünün kabı olan çalınmış anılar sandığını arıyor. Sadece kalbinde gerçek keder barındıranlar yaratığın öfkesini dindirebilir. Ancak bedeli ağır olacaktır..."
uw.dlgStoryBtnFight = "DÖVÜŞ"
uw.dlgStoryBtnMore = "DAHA FAZLA"
uw.dlgVolcanoGreetings = "Tüm Ebedilerden uyanan ilk ben oldum. Bir çok savaşçı ellerimde ölmeye gelecek; görevimi tamamlamalıyım."
uw.dlgVolcanoLost = "Yeter! Teslim oluyorum Ama şunu unutma: biraderimi kışkırttın. Hızlı ve ölümcül olduğundan görünüşüne aldanma!"
uw.dlgVolcanoStory1 = "Birkaç yarı döküntü mesken ve devasa bir heykel gördüm. Burada yaşayan insan var mı?"
uw.dlgVolcanoStory2 = "Yalnızca fanatikler. Canlarının bağışlanması umuduyla Ebedi'ye ibadet ediyorlar. Gerçekten inançlarına körü körüne bağlılar. Eğer başarısız olursak yakında gerçeği öğrenirler."
uw.dlgVolcanoWin = "Tarikatıma gezegenin kaderine karar vermenin benim görevim olduğunu anlatıyordum. İnançsızlar, alevlerim araziyi kaplarken izleyin!"
uw.dlgVortexGreetings = "Karanlık sular dünyayı ve Gölge Kapılarını yutacak! Sırları manastırlarda kaybolacak. Ve yer üstünde bunu anlatacak kimse kalmayacak!"
uw.dlgVortexLost = "Binlerce yıldır ilk kez insan kazanıyor. Yaşama olan bağlılığın çok güçlü! Ama ne yaparsan yap son aynı olacak; öleceksin."
uw.dlgVortexWin = "Binlerce yıldır türünüzün kurumasını izledim. İçinde bir güzellik var. Sanırım sırf eğlence için seni canlı tutmalıyım."
uw.dlgWhisperGreetings = "Görünüşe göre birileri kaderini keşfetmek için sabırsızlanıyor. Elini ver ve aynanın içine bak!"
uw.dlgWhisperLost = "Hala yaşıyor musun? O zaman henüz gücümün altında değilsin! Fatum kaderini tayin edecek ve sonra kendi dünyama döneceğim—aynalarla dikkatli olman konusunda seni uyardıktan sonra!"
uw.dlgWhisperWin = "Seni kül, ruh ve sonsuz gece alemine götüreceğim! Güven bana—gözlerimin içine bak ve sakın başka yere bakma."
uw.dlg_American_25_Loose_1 = "Kimi koruduğunu bilmiyorsun, Shadow. Sana teşekkür etmeyecekler. Sadece arkandan alay edecekler. Vahşiler... ve ben mi canavarım?"
uw.dlg_American_25_Story_1 = "May gitti. Neredeyse insan olmayan bir şey tarafından alındı. Yine de çığlık yoktu, mücadele izi yoktu... sanki kendi isteğiyle yürüyüp gitmiş gibi."
uw.dlg_American_25_Story_2 = "Bu konuda yalnız değiliz. May gibi diğerleri—genç, güçlü olanlar—da kayboldu. Bunun olacağını sezmişti... ve ceplerini barutla doldurdu."
uw.dlg_American_25_Story_3 = "İzi belli. Yağmurlar gelmeden onu bulmalıyız, yoksa sonsuza dek kaybolacak. Gel, Shadow!"
uw.dlg_American_25_Story_4 = "Bu lanetli topraklara adım attığın an kokunu aldım. Neden geldin? Yasımı mı çiğneyeceksin? Hiç onurun yok—tıpkı onların hiç olmadığı gibi."
uw.dlg_American_25_Story_5 = "Geleceğini biliyordum, şaman. Çocukları ailelerine, arkadaşımızı da bize geri ver. Sonra da o kül dağında çürüyüp git."
uw.dlg_American_25_Story_6 = "Küller küllere. Ve sen de küle döneceksin, ölümlü..."
uw.dlg_American_25_Win_1 = "Bekle! Onunla isteyerek gittim. Biçimi canavarca, evet—ama kalbi insan. Ve acı çekiyor... Çocuğunu çaldılar!"
uw.dlg_CHN_NY25_Announce = "Kendini geçmiş çağlardan kalma bir kahramanın hikayesine bırak—gerçeği efsaneden ayır ve yeni bir efsane yaratmaya yardım et! Büyük bir kahramanın adını vahşetlerine kılıf yapan gizemli bir tarikatın karşısında dur! Her şeyin başladığı yere geri dön ve kaçak bir serserinin gerçek kahramanlığını keşfetmesine yardım et!"
uw.dlg_CHN_NY25_Loose_1 = "Hayır, savaşmaya devam etmeliyiz! Basit bir çiftçinin kötü niyetli bir tarikatı bu kadar kolay yenebileceğine kimse inanmazdı. Her şeyini ortaya koymalısın!"
uw.dlg_CHN_NY25_Story_1 = "Güneş Tarikatı'nın, büyük kahramanlarının doğum yerini yılda bir kez ziyaret etme geleneği vardır. Ancak her seferinde bu bir felaketle sonuçlanır..."
uw.dlg_CHN_NY25_Story_2 = "İnsan olarak mı doğdu? Ne kadar ilginç. Bana öyle geliyor ki bu insanlar köye hediye getirmiyorlar..."
uw.dlg_CHN_NY25_Story_3 = "Hiçbir şeye dokunmadan bırakmıyorlar! Köylülerin hayvanlarını çalıyor, sarhoş bir çılgınlıkla mahsullerini harap ediyor, pencereleri kırıp kavga çıkarıyorlar!"
uw.dlg_CHN_NY25_Story_4 = "Peki köylüler neden karşı koymuyor? Bu onların toprağı ve onların efsanesi!"
uw.dlg_CHN_NY25_Story_5 = "Kırılmış durumdalar. Onlara umut veren kahraman gitti ve tarikat üyeleri onun adını kullanarak kötülük yapıyor. Onlara yeniden umut vermeliyiz!"
uw.dlg_CHN_NY25_Story_6 = "\"Tatil\" için her şeyin hazır olup olmadığını kontrol etmeye geldiğini söyle. Ve savaşacağız! Kasabalılar tarikatın karşısında durulabileceğini görecek!"
uw.dlg_CHN_NY25_Story_7 = "Pekala, senin istediğin gibi olsun... Karaktere gireyim. \"Hey çocuk, kahramanımızın kıyafetlerini giymeye nasıl cüret edersin! Git buradan—hazırlamamız gereken bir şölen var!\""
uw.dlg_CHN_NY25_Story_8 = "Efsanevi bir kahraman olmayabilirim ama onun ruhu bu topraklarda yaşıyor! En karanlık saatimde bana yol gösterecek ve cesaret verecek! Saldır!"
uw.dlg_CHN_NY25_Win_1 = "Sıradan bir insandan bu kadar hız beklemiyordum... Şampiyonumuzu neredeyse yendin! Başkalarına da fikir vermemesi için sana ibretlik bir ders vermeliyiz..."
uw.dlg_NY25_Loose_1 = "Anıların canlı ve keder, mantıktan daha yüksek sesle konuşuyor. Benimle burada kalacaksın. Biraz dinlen—uyku yakında gelecek."
uw.dlg_NY25_Story_1 = "Hoş geldiniz! Bu kulübe bir zamanlar aileme aitti. Çok fazla anı... İstediğiniz kadar kalın. Burada dinlenmek için ihtiyacınız olan her şey var."
uw.dlg_NY25_Story_2 = "Ama bizi defalarca tehlikeye attın ve şimdi aile evinde kalmamızı mı teklif ediyorsun? Bu bir çeşit tuzak mı?"
uw.dlg_NY25_Story_3 = "Sadece vicdanın sesi konuşuyor! Başkalarının nezaketinden çok uzun süre yararlandığımı fark ettim. Ama artık iyilik yapmak istiyorum."
uw.dlg_NY25_Story_4 = "Yalnız değiliz... Kulübenin önünde insanlar toplanıyor. Bu geç saatte ne istiyorlar? Dışarı çıkmamız için sesleniyorlar."
uw.dlg_NY25_Story_5 = "Sakın çıkmayın! Hayaletler sizi yok eder! Onlar sadece acı dolu anıların hayaletleri. Orman ruhu sandığı için geldi! Gidip onu geri alalım!"
uw.dlg_NY25_Story_6 = "Bir sandık mı? Demek insanlar bu yüzden ormanda kayboluyormuş! Neden bize ihanet ettin, Sly? Ne olursa olsun bu soylu görevde sana yardım ederdik!"
uw.dlg_NY25_Story_7 = "Anlamıyorsun. Eğer onun sesini duyarsam, kontrolümü kaybederim—ve ben de gitmiş olurum. Onun bir parçasını yanımda taşıdığım sürece."
uw.dlg_NY25_Story_8 = "Kapıyı aç, burada donuyorum baba. Ev soğuk ve ben içeride değilim. Sana yeniden birlikte olabileceğimiz bir yer göstereceğim."
uw.dlg_NY25_Story_9 = "Dur! Ormana girme—yolunu kaybedersin! Hangi sesi duyduğunu bilmiyorum ama kesinlikle insan olmadığı kesin!"
uw.dlg_NY25_Win_1 = "Uyan, Sly! Ruh zayıfken sandığı ona geri ver. İnsanlığın kendi açgözlülüğünün üstesinden gelebileceğini görsün."
uw.saturn_enter_saturn_1 = "Sözlerini boğazından geri tıkacağım. Arkadaşların da izleyecek. Hapishanemden çıkmanın tek yolu darağacından geçer. Kim önce gitmek ister?"
uw.saturn_greeting_saimon_1 = "Hükümdarımız Patriark, portalı yıllarca inceledi. Sonra bir gün içine kapandı. Daha sonra Dikilitaş'ı yükseltti ve o dünyamıza bir şeyler yaptı..."
uw.saturn_greeting_saimon_2 = "Shadow, moleküler düzeyde Dikilitaş'a benziyor. Bunu Patriark'a karşı kullanmamıza yardım edecek biri var. İşte bu yüzden Satürn'ün odasındayız..."
uw.saturn_greeting_saimon_3 = "Binlerce özür dilerim hanımefendi. Yine de Lazarus'u kurtarmalıyız. Lütfen bizi hücresine götürün, sizi daha fazla rahatsız etmeyeceğiz."
uw.saturn_greeting_saturn_1 = "Uzağa mı çocuklar? Hapishaneme kendi özgür iradenizle geldiniz! Merak ediyorum—bu cesaret mi aptallık mı? Sen, uzun boylu olan—cevap ver bana!"
uw.saturn_greetingn_May_1 = "Ama bunun bizimle ne ilgisi var?"
uw.saturn_lose_saturn_1 = "Bu kadarı yeterli. Eğer Lazarus senin gibi döküntülerle arkadaşlık ediyorsa, Patriark için tehlike yok demektir. Çıkın buradan, veletler! Listemde değilsiniz."
uw.saturn_win_saturn_1 = "Lazarus'u asla bulamayacaksınız. O serseri hapishanemden kaçtı ve bataklığa sığındı. Sen de mi can vermek istiyorsun? O zaman peşinden git!"
uw.summerfest25_story2_1 = "Peki, peki... Beni bulmak için o kadar hevesliydin ki, sana bu iyiliği yapayım dedim. Hem herkes bu anı bekliyordu."
uw.summerfest25_story2_2 = "\"Herkes\" mi? Numarayı bırak. Kim olduğunu tam olarak biliyoruz—ve başkalarının sefaletinden zevk almak için onları nasıl kullandığını."
uw.summerfest25_story2_3 = "Sadece küçük bir konuk oyuncu, ve bom—trend oldum! Dürüst olmak gerekirse, bu kadar popüler olmayı beklemiyordum."
uw.summerfest25_story2_4 = "Zekan seni kurtarmayacak. Ödeyeceksin—gözlerim için ve yaptığın tüm kötülükler için. Tanrıcılık oynadığın çarpık oyun burada sona eriyor!"
uw.summerfest25_story2_5 = "Cidden mi Ermine? O tür laflar kapaklı telefonlarla birlikte tarihe karıştı. 2026 yılındayız—çağa ayak uydurmaya çalış."
uw.summerfest25_story2_6 = "Mimar ne planlıyorsa planlasın... etrafında bir karanlık var. Neredeyse somut sayılabilecek kadar kötücül bir güç."
uw.summerfest25_story2_7 = "Ağzından çıkan her kelimeyle, Ermine'nin hikayesine daha çok inanmaya başlıyorum. Mimar tehlikeli—ve durdurulması gerekiyor."
uw.summerfest25_story2_defeat_1 = "Oh hayır—ne hayal kırıklığı! Seyirci daha fazlasını bekliyordu. Görünüşe göre bir dahaki sefere bahisleri yükseltmem gerekecek."
uw.summerfest25_story2_win_1 = "Dünya neden bu kadar zalim? Neden acı çekmek zorundayız? Neden kendimi kör etmek zorundaydım? Cevap ver bana Mimar—yaşamak neden bu kadar acı veriyor!?"
uw.tutorial_ascention_intro_title = "KUKLACI"
