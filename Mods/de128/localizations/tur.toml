uw.blackness_enter_blackness_1 = "Döl. Büyük bir kurban. Bir küre. Zihin. Kasaplık. Hissediyorum. Kan dökeceksin. Acı görüyorum. Geleceği görüyorum. Sana göstereceğim."
uw.blackness_greeting_blackness_1 = "Sorun ne Shadow? İyi değil misin?"
uw.blackness_greeting_lazarus_2 = "Simon? Ne pislik birisin! Neden insanları buraya getirdin? Düşüncelerinin kokusunu alacak! Karanlık zihnini tatmadan buradan uzaklaş!"
uw.blackness_greeting_may_1 = "Bunu duyuyor musun? Hiçbir şey! Sessizlik. Kuş cıvıltısı olmayınca, burası sanki kehribar içinde donmuş gibi. Doğru olanı mı yapıyoruz? Çok kötü bir hissim var..."
uw.blackness_greeting_saimon_2 = "Bu beyefendiler özgürlüğe biletin azizim. Siyahlı olan büyük olan, Dikilitaş ve Kapılarla bir şekilde bağlantılı. O sana yardım ediyor, sen de ona."
uw.blackness_greetingn_saimon_1 = "Şaşmamalı. Kadim Kapılar'ın bir parçası buraya çarptığından beri, bu yerdeki yaşam istatistiksel bir anomali haline geldi. Gözlerini dört aç—Lazarus'u bulmamız gerek."
uw.blackness_lose_blackness_1 = "Burada kalıyorsun. Sonsuza dek. Bir kan. Ebediyen. Seni okuyacağım. Besleneceğim."
uw.blackness_win_sensei = "Bize yalan söyledin bilim adamı! Kimi özgür bıraktık? Bu dünyayı neye mahkum ettik? Ne yaptığının farkında mısın?!"
