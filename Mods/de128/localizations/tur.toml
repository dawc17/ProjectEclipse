sensei.notify.ending = "Sonunda ne olduğunu hatırladım, öyküme dönelim mi?"
sensei.notify.intro = "Bu şehirde bazı hatıralar uyanıyor. Yıllar önce olan öykümü sana anlatayım..."
sensei.notify.more = "Bir şey daha hatırladım, öyküme dönelim mi?"
