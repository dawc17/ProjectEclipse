sensei.defeat.Sensei_defeat1 = "Hayır, bekle... O şekilde olmadı... Lütfen bu yaşlı adamın unutkanlığını bağışla."
sensei.defeat.Sensei_defeat2 = "Bence başka bir şekilde oldu... Hatıralar çok kırılgan olabiliyor."
sensei.defeat.Sensei_defeat3 = "Sanki sonu öyle bitmemişti. Müsaade edersen son kısmı tekrar hatırlamak isterim..."
sensei.defeat.Sensei_defeat4 = "Hatıralarım çok belirsiz... Sanırım o dövüşü ben kazanmıştım."
sensei.defeat.Sensei_defeat5 = "Hayır, öyle olmamıştı. Ben kazanmıştım... galiba."
