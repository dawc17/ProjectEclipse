sensei.entry.ActScreenSensei1 = "Sensey'in Öyküsü{br}1. Kısım. Şahit"
sensei.entry.ActScreenSensei2 = "Sensey'in Öyküsü{br}2. Kısım. Geleceğin Gölgesi"
sensei.entry.ActScreenSensei3 = "Sensey'in Öyküsü{br}3. Kısım. İçindeki Yaratık"
sensei.entry.ActScreenSensei4 = "Sensey'in Öyküsü{br}4. Kısım. İntikam Öyküsü"
sensei.entry.ActScreenSensei5 = "Sensey'in Öyküsü{br}5. Kısım. Ezilenler"
sensei.entry.ActScreenSensei6 = "Sensey'in Öyküsü{br}6. Kısım. Canavar"
sensei.entry.ButcherYoung_Greetings = "Hiç kimse otoritemden şüphe duymaya cüret edemez! Aile bunu hiçbir zaman unutmaz. Canlı çıkamayacaksın!"
sensei.entry.Butcher_zone3_1 = "Kayıp çocuk döndü! Teklifimi düşündün mü, Prens? Ben seni serbest bırakıp Küre'nin yerini söylüyorum, sen de bana altın ödüyorsun."
sensei.entry.Butcher_zone3_2 = "Sessizliği sözlerinden daha büyük anlam taşır, yaşlı adam. Ben-Ben kendime karşı dürüstüm, caniliğimi kabulleniyorum. Ama o kabullenmiyor. Size tevazunun ne anlama geldiğini öğretmeliyiz! Gelin çocuklar!"
sensei.entry.Guard1_Butcher_Sensei = "Kasap, acının gerçek bizi nasıl ortaya çıkardığını gösterdi. Artık özgürüm! Sen de mutluluğu bulabilirsin. Direnme!"
sensei.entry.Guard1_Hermit_Sensei = "Değişim kaçınılmazdır! Bunu öğrenmek için dünyanın yarısını aştım, çok fazla şey feda ettim... Elimdeki tek şey Usta'nın bilgeliği!"
sensei.entry.Guard1_Lynx_Sensei = "Dövmelerimi beğendin mi? Doğduğum bölgede, en güçlüler başarılarının hatıralarını dövmelerinde taşır. Yakında sen de bu hatıraların bir parçası olacaksın..."
sensei.entry.Guard1_Wasp_Sensei = "Şansa inanır mısın? Bugünkü harçlığımı ihtiyarın tekinden çıkartacağım için oldukça şanslıyım. Şansına küs ihtiyar. "
sensei.entry.Guard1_Widow_Sensei = "Hanımım benim kardeşim gibidir. Acısını hissedebilirim. Prens'e dokunmam yasak ama sinirimi senden çıkartmama kimse engel olmayacak!"
sensei.entry.Guard2_Butcher_Sensei = "Zafer çantada keklik! Felsefe ezikler içindir—bense sadece bıçaklarla oynamayı severim. Benimle oynamak ister misin?"
sensei.entry.Guard2_Hermit_Sensei = "Ustamız bize gölgeler dünyasından; oranın sakinlerinden ve bizimle paylaşacağı o muazzam güçten bahsetti. Tüm bunları elimizden almana izin vereceğimi mi sanıyorsun?"
sensei.entry.Guard2_Lynx_Sensei = "Klanımız tanrılar için bile fazla kirli olan işleri yapar. Sorunları çözer ve başkalarının hatalarını düzeltiriz. Ve sen-sen de bu hatalardan birisin."
sensei.entry.Guard2_Wasp_Sensei = "Kaptanımı tehdit etmek mi? Beni esaretten kurtardı ve özgürlüğümün hakkını vermeye yemin ettim. Dilerim ki ruhlar sana nazik davranırlar..."
sensei.entry.Guard2_Widow_Sensei = "Hanımım çok adildir! Onun yüzünü görmeye layık değilim... Artık hayatım ona ait. Son nefesime kadar hanımımın onurunu koruyacağım."
sensei.entry.HermitYoung_Greetings = "Siz tesadüfler kurbanısınız, Prens, ortak fayda için gerekli bir kurban. Okulum yüceliğe ermeli ve dövüş sanatlarının altın çağı başlamalıdır!"
sensei.entry.Hermit_zone2_1 = "İki arada bir derede kalmışsınız, efendim. Size ihanet ettiğimi kabul ediyorum. Okulumun geleceği tehlikede olduğundan ötürü başka bir seçeneğim yoktu."
sensei.entry.Hermit_zone2_2 = "Kendini beğenmiş Lynx göreviyle baş edemedi. Şimdi onun arkasını benim toplamam gerek. Çömezler, öne ve merkeze geçin!"
sensei.entry.LynxYoung_Greetings = "Sizi öylece bırakıp gidemem. Prens'in hayatı için bana zaten ödeme yapıldı. Bunu kişisel algılama, ihtiyar."
sensei.entry.Lynx_Sensei_1 = "Prensi dinleme yaşlı adam, aklı yerinde değil. Kendine zarar vermeden önce Majestelerini evine götürüyoruz. Yardım istemez."
sensei.entry.Lynx_Sensei_2 = "Gerçekten mi? Buradan görünen etrafı katillerle çevrili korkmuş bir adam. İçimden bir ses, Prens'in doğruyu söylediğini söylüyor. Ondan uzak durun!"
sensei.entry.Lynx_Sensei_3 = "Ne istersen yap. Konuşmam için para ödemiyorlar. Kellen ne kadar ediyor öğrenelim. Yakalayın şunu çocuklar!"
sensei.entry.NAME_BUTCHER = "KASAP"
sensei.entry.NAME_HERMIT = "HERMIT"
sensei.entry.NAME_LYNX = "LYNX"
sensei.entry.NAME_PRINCE = "PRENS"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "WASP"
sensei.entry.NAME_WIDOW = "WIDOW"
sensei.entry.OK = "TAMAM"
sensei.entry.Prince_Intro = "Yardım edin! Bu insanlar beni öldürmek istiyor!"
sensei.entry.Prince_zone3_1 = "Adımı lekelemeye nasıl cüret edersin! Seni... zavallı herif! Zulüm saltanatına son vermek için geri döndüm!"
sensei.entry.Prince_zone6_1 = "İşte buradasın, sadık dostum! Bak—Adalet tekrar galip geldi, Shogun sadık köpeğimdir. Zihni benimdir!"
sensei.entry.Prince_zone6_2 = "Sen de yaşlı adam, tahtımda hak mı iddia etmek istiyorsun? Ben doğuştan bu hakka sahibim! Bunu kimse benden alamaz!"
sensei.entry.Sensei_arc_intro1 = "Bir zamanlar yürürken vahim bir sıkıntı yaşayan yerli bir lort ile tanıştım."
sensei.entry.Sensei_zone3_1 = "Yani “şans” bu mudur? Özgürlüğünüzü satın almak ve insanlarınızı bir çılgın çeteye vermek... Ve size karşı çok naziktim, prens."
sensei.entry.Sensei_zone4_1 = "Widow mu? Tabi ki.. Küre'yi alıp kendi elleri olan Shogun'a götürmemi söyledi."
sensei.entry.Sensei_zone6_1 = "Prens, durun! Etrafınıza bakın! Küre hiddetinizi besleyerek sizi bir canavara dönüştürüyor!"
sensei.entry.Shogun_zone6_1 = "Zayıf karakterli! Lordumun saray soytarısı bile olamayacak kadar kötüsün. Tek bir darbeyle seni ezeceğim!"
sensei.entry.TITLE_PRINCE_EVIL = "LANETLİ PRENS"
sensei.entry.WaspYoung_Greetings = "Babama ne söylerim? Kızı eridi ve yaşlı bir adama karşı bir dövüş mü kaybetti diyeceğim? Korsanların tahtı için varis ben olduğun sürece böyle bir şey olmayacak!"
sensei.entry.Wasp_zone4_1 = "Widow, Küre'yi almak için seni mi gönderdi? Böyle işler için biraz fazla yaşlı değil misin? Ah, neden umurumda olsun ki. Tekneye atla."
sensei.entry.Wasp_zone4_2 = "Şöyle ki artık bende Küre yok. Widow'un adamları Küre'yi dün aldı. Kim olduğunu bilmiyorum ama yalancıları asla affetmem. Cezalandırın onu!"
sensei.entry.WidowYoung_Greetings = "Prens, beni reddederek ve hislerime gülerek beni küçük düşürdü. Şimdi ona geri saldırmalıyım! Sen onun arkadaşısın bu yüzden bu mesajı ona ileteceksin..."
sensei.entry.Widow_zone5_1 = "Prens'in yaptığı gibi beni aşağılamak için mi geliyorsun? Siz erkekler hep aynısınız..."
sensei.entry.Widow_zone5_2 = "Sizin nezaketinizden, onurunuzdan ve haysiyetinizden bahsediyordu. Ama hiçbir erkeğin sözüne artık inanmıyorum. Her biriniz acı çekmelisiniz!"
sensei.entry.Zone2_SenseiReminder = "Son seferinde Prens'i katillerin elinden nasıl kurtardığımı anlatıyordum sana. Hermit'in askerlerini gizlice eğittiğini öğrendim. Bu yüzden oraya gittik."
sensei.entry.Zone3_SenseiReminder = "Hermit, Prens'in savaş lordu Shogun'ın lorduna ihanet ettiğini ve onu kaçırması için Kasap'a önemli bir miktar ödediğini anlattı. Artık haydudu ziyaret etme zamanı."
sensei.entry.Zone4_SenseiReminder = "Prens'in başına gelenlerin nedeni bir kadın! Kadın, şu an yakındaki bir limana getirilen sihirli bir Küre'yi kullanarak Prens'i devirmeyi planlamıştı..."
sensei.entry.Zone5_SenseiReminder = "Korsan kız bana Prens'in Widow ile olan karmaşık öyküsünü anlattı. Küre'yi alamadım ama Prens'in Widow'u bulmak için dağlara gittiğini öğrendi."
sensei.entry.Zone6_SenseiReminder = "Sihirli Küre Prens'i çıldırttı! Ona hepimizi yok etme tehdidi olan muhtemel güç verdi! Bunun olmasına izin veremem."
