uw.dlgAmericanEvent22Story_May_1 = "Potpuno je smrznuta, Sensei! Ne možemo je izbaciti dok ovakvi vjetrovi bjesne pred vratima..."
uw.dlgAmericanEvent22Story_Puma_1 = "U nevolji su, starče... Nikad nisam mislila da će me prošlost mog naroda pratiti, ali jest. Zato sam pobjegla kako bih ih zaštitila. Molim te, poslušaj me!"
uw.dlgAmericanEvent22Story_Puma_2 = "Čujete li i vi to? Kad sam bila dijete, jedan mi je šaman pričao o duhu čije je zavijanje podizalo valove i kidalo lišće. Nikad nisam mislila da će se ta stara priča pokazati istinitom!"
uw.dlgAmericanEvent22Story_Puma_3 = "Dolazi ovamo kako bi nas lovio svojim krikom dok ne padnemo u nesvijest bez daha... Samo iz zabave! Ne znam gdje se drugdje sakriti..."
uw.dlgAmericanEvent22Story_Sensei_1 = "Vrata mojeg doma otvorena su svima koji pate. Ali neočekivano je vidjeti gusarku unutar ovih zidova... A gdje je tvoja banda krvoloka, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Šamanski su mitovi alegorije. Ljudi su izumili jedra da ukrote vjetar, i od tada im dobro služi. Ti si samo smiješna bajka, a Sjena će to i dokazati!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Ja sam Vuk Vjetra! Tko god mi izađe u susret bit će ugašen poput svijeće! I prije ili kasnije, srušit ću vaša vrata. Samo je pitanje vremena!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Zaviiijat ću dok lišće ne prekrije olupine. Nitko nikada neće pronaći put do ovamo! Hrabro i glupo... Kako se možeš boriti protiv prirodnih sila, smrtniče?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Kakva sramota... Uzeo si mi moj moćni glas! Ali tvoja vjera, djevojko, vratit će me u život... I neću doći sam! Jer nas je mnogo!"
uw.dlgArkhosGreetings = "Slijepi fanatici! Sjećate me se, i hranite me s vašom vjerom u Oca. Roditelj može biti strog, a moju kaznu ćeš primiti sa zahvalnošću..."
uw.dlgArkhosLost = "Kome da se poklonim u svojim posljednjim satima? Bože, zašto si me ostavio? Dao si mi snagu da ih vodim, a ja sam te iznevjerio... opet."
uw.dlgArkhosStory1 = "Znam ja takve kao što je on. Skupljaju oko sebe sljedbenike koje hrane lažima. Ne slušaj njegove goruće govore — jer to bijaše njegovo oružje."
uw.dlgArkhosStory2 = "Griješiš, starče. Imam i željeznu disciplinu za neposlušnu djecu. Još ćeš me moliti da te primim u obitelj... Ali ja ću biti neumoljiv."
uw.dlgArkhosWin = "Janje šugavo, nisi dostojan mjesta uz mene. Gubi se! Reći ću Stvoritelju kako ste vi, ljudi, opet izgubili, i on će nahraniti moju djecu..."
uw.dlgBerstuuk_Announce = "U potrazi za zabranjenim znanjem, nadareni je znanstvenik spojio znanost i magiju u svojoj težnji da postane bog. A transformacija je neizbježna! Sada je šuma njegov košmarni laboratorij, a ljudi su njegov plijen. Samo ti možeš zaustaviti ovu zastrašujuću metamorfozu! Odagnaj svoj strah i upusti se u srce šipražja u potrazi za lažnim idolom!"
uw.dlgBerstuuk_Loose_1 = "Kada si došao na moja vrata, sve si mi rekao bez riječi! Vući ću ovo znanje poput tanke niti sve dok ništa ne ostane!"
uw.dlgBerstuuk_Story_1 = "Ondje vani je Sly, kuca na vrata staje... Vidio sam puno toga u šumi noću, ali ovo je nešto novo! Što nije u redu s njim?"
uw.dlgBerstuuk_Story_10 = "Nedovoljno. Znanost je nepredvidiva—samo pogledaj mene! Postupno sam prihvatio šumu, ali ona je neprestano odbijala prihvatiti mene. Sve do sada."
uw.dlgBerstuuk_Story_2 = "Za one koji traže pomoć, put vodi do pravih vrata. Ali čini se da je Sly izgubio put... Stari vragolane, pazi na ruke! Što se dogodilo?"
uw.dlgBerstuuk_Story_3 = "Lupež je tražio pomoć, i pronašao ju je. Idemo u šumu prije nego što ona uzme ono što joj s pravom pripada. Živote ljudi!"
uw.dlgBerstuuk_Story_4 = "'Ljudi'? Jadnik je u šoku—nema lice! Što ga je toliko prestrašilo da ga je uhvatila iznenadna kriza savjesti?"
uw.dlgBerstuuk_Story_5 = "Čuješ li ptice kako pjevaju? U ovo doba već bi trebale cvrkutati, ali ovdje nema ničega osim mrtve tišine... Što još vreba u ovoj šumi?"
uw.dlgBerstuuk_Story_6 = "Mrtva tišina. Mrtva tišina. Ljudima treba pomoć. Moraš pomo-o-ći. Pomozi sada!"
uw.dlgBerstuuk_Story_7 = "Tako mi bogova! Ljudi se inače ne pretvaraju u suhe grančice i mahovinu, ma koliko god bili prestrašeni! Što je ta stvar, i gdje je pravi Sly?!"
uw.dlgBerstuuk_Story_8 = "Tu je negdje u blizini. Slyjev mali um bio je od velike pomoći. Pričao mi je o tebi, Sjeno—o tvojoj posebnoj moći. I sinulo mi je!"
uw.dlgBerstuuk_Story_9 = "Znači, ti si onaj o kojemu je stvorenje govorilo? Šuma će doći i uzeti. A koliko si takvih 'opravdanih' života oduzeo, luđače?"
uw.dlgBerstuuk_Win_1 = "Priroda će pronaći put! Naša mi je borba rekla više nego što shvaćaš, Sjeno. Šuma će pamtiti. Progutat će me da bi ponovno oživjela..."
uw.dlgFatumGreetings = "Tvoja hrabrost ravna je jedino tvojoj gluposti. Ali znala sam za tvoj dolazak, jer ti si moja sudba a ja sam tvoja. Ja ću izmijeniti tvoju sudbinu, zauvijek."
uw.dlgFatumLost = "Poznajem čovječanstvo. Krečete se gore i dolje u istoj spirali. Vidjela sam to već mnogo puta. Samouništenje i propadanje. Ništa to neće promijeniti. Takva je vaša sudbina."
uw.dlgFatumStory1 = "Oprezno, junače. Zakoni svemira koji su ti poznati prestaju vrijediti na ovakvim dubinama..."
uw.dlgFatumStory2 = "Upravo tako, drži dečka na uzdi. Znam sve o vašim sudbinama: tko ste i kamo idete. Hoću li vam reći tko umire na kraju?"
uw.dlgFatumWin = "Tvoja sudbina je zapečaćena. Izgubio si već u trenutku kad si zakoračio na prag mog boravišta. Hoćeš li biti dovoljno ustrajan da izmijeniš svoju priču?"
uw.dlgFungusGreetings = "Otrovao si nam zemlju otvarajući Vrata Sjena, i zbog tog moje gljive umiru. One će ti oduzeti razum, i postati ćemo jedno, čovječe. Tako završava vaša priča!"
uw.dlgFungusLost = "Moja braća su se previše smekšali igrajući se bogova. Vjera njihovih vjernika ih razmazuje. Ali uništenje je dio ljudske naravi, svijetu će biti bolje bez vas."
uw.dlgFungusWin = "Gubite se! I uživajte u posljednjim minutama svojih krhkih života!"
uw.dlgHW21LosePuppeteer_1 = "Ne bih ti povjerio ni ulogu bez teksta, Sjeno. Pozornica nije mjesto kojemu pripadaš—ne sramoti moj zanat!"
uw.dlgHW21StoryArkhos_1 = "Kuga dolazi u vaš grad, smrtnici! Poklonite se pred moći vašeg boga! I nahranite svoje oči sjajem zlata, ili inače..."
uw.dlgHW21StoryPuppeteer_1 = "Što vi znate o umjetnosti! Uništili ste moj najveći pothvat! Ipak... dolazi treći čin. A u njemu, junak ispušta svoj posljednji dah!"
uw.dlgHW21StorySensei_1 = "Od kada bogovi podzemlja dolaze ovamo gore kako bi iznuđivali novac od običnih ljudi? Skini masku, obmanjivaču, prije nego što se latimo oružja!"
uw.dlgHW21StorySensei_2 = "Kazalište bi trebalo nadahnjivati, a ne užasavati. A ti si iskrivio samu bit umjetnosti. Zaustavit ćemo te prije nego što tvoji 'glumci' nastradaju."
uw.dlgHW21StoryThief_1 = "Čekaj! To sam ja... Sly! Ne udaraj me! Obećao je da će me se svi bojati... I da me nitko neće prepoznati. Kako sam se odao?"
uw.dlgHW21StoryThief_2 = "Vlasnik putujućeg kazališta—Lutkar. Rekao je da će to biti njegova najbolja izvedba. Bogovi među ljudima! Meni to nije ništa značilo. Ali novac, s druge strane..."
uw.dlgHW21WinPuppeteer_1 = "Ovo je fijasko! Uništili ste moj predivan zaplet i slomili mi maske! Kako da sada postavim predstavu bez rekvizita..."
uw.dlgHW22EnterArchitect = "Sva ta vaša fantastična priča me iscrpila... Sada ćemo igrati po mojim pravilima. I u tvom je interesu da me iznenadiš, Sjeno..."
uw.dlgHW22LooseArchitect_1 = "To se moglo očekivati. Znam sve tvoje poteze, Sjeno. Uostalom, ja sam taj koji te izmislio. Možda tada nisam bio u formi... Ali sada će ti se svidjeti tvoj novi život."
uw.dlgHW22StoryArchitect_1 = "To se zove 'kliše', Lutkaru. Za što su plaćeni dramatičari? Za broj simbola? Figura brbljavog ludog genija postala je ustajala, baš kao i figura junaka..."
uw.dlgHW22StoryArchitect_2 = "To je to. Ponovno ćemo napisati tvoj svijet od nule! Suvremeno, kreativno, relevantno! Što tinejdžeri vole ovih dana? Zašto ništa ne govoriš, Sjeno? Oh, da..."
uw.dlgHW22StoryPuppeteer_1 = "Čuje se kucanje—neočekivano kucanje na vašim vratima! Je li to putnik koji vas želi posjetiti ili nešto više? Intrigantno, zar ne?"
uw.dlgHW22StoryPuppeteer_2 = "Znao sam da ćeš to reći, starče. Što se drugo može očekivati od izmišljenih likova? Papir sve trpi... Ali publika nikada neće!"
uw.dlgHW22StoryPuppeteer_3 = "Ja sam samo rob pozornice, to je sve. A moje novo remek-djelo govorit će o susretu sa stvoriteljem—o mukama predodređenja i slobodne volje..."
uw.dlgHW22StorySensei_1 = "Što god da si zamislio, Lutkaru, više nećemo igrati tvoje igre. Umjetnost može uzrokovati bol, ali ne na način na koji je ti prakticiraš."
uw.dlgHW22StorySensei_2 = "Previše si glumio i više ne možeš razlikovati stvarnost od svojih fantazija, izvođaču... Lud si."
uw.dlgHW22StorySensei_3 = "Tvoje su riječi neobične i zabrinjavajuće, stranče... Ne znam kakvo se ludilo odvija u tvojoj glavi, ali Sjena će ga izbiti iz tebe."
uw.dlgHW22WinArchitect_1 = "Možda kreacija više ne pripada svom stvoritelju i zaživjela je vlastitim životom... Iznenadio si me. Želim vidjeti kamo će priča dalje ići."
uw.dlgHoaxenGreetings = "Svi vaši životi su samo iluzije. A mi smo njeni stvoritelji. Izludit ćemo vas dok se ostali uzdaju u grubu silu. Vatra, voda, bolesti... ha!"
uw.dlgHoaxenLost = "Gdje si, brate moj? Više ne čujem tvoj glas! Doista, samoća u zatočeništvu je daleko strašnija od vatre ili mača... Idite, budale. Otac vas čeka."
uw.dlgHoaxenStory1 = "Mi? Sjeno, čini mi se da je naš je neprijatelj potpuno sišao s uma. Pardon, s kojom od tvojih ličnosti sad razgovaramo? Možda je tvoj \"brat\" ponešto razumniji?"
uw.dlgHoaxenStory2 = "Ismijavaš nas, čovječe? Moj brat predlaže da vaše duše pošaljemo u ponor vječne patnje... Tada bi se vaš svijet predao bez krvoprolića."
uw.dlgHoaxenWin = "Ubio bih te, ali moja milost je uistinu beskrajna. Doduše, moj brat nema takvog strpljenj. Slobodni ste otići, ako ne poludite na putu odavde."
uw.dlgHunter_enter_hunter_1 = "Ti! Hej, tiii! Došao si završiti ono što si započeeeo, zar ne? Ti? Ima u tebi neke moći. Oooona mi govori. Tišina! Ili ću te naaatjerati!"
uw.dlgHunter_greeting_may_1 = "Gledajte! Nešto je unutar kristala... Je li to tako zamišljeno?"
uw.dlgHunter_greeting_saimon_1 = "Kako čudno... Očekivao sam da će Lazar smrviti Obelisk u prašinu. Bojao sam se pokolja, ali čini se da smo ostali samo ti i ja. Zaintrigiran sam."
uw.dlgHunter_greeting_saimon_2 = "Dvorana Koncentracije. Vidiš li onaj kristal u sredini? Tako Obelisk prikuplja energiju sjena—srce tame, da tako kažem."
uw.dlgHunter_greeting_sensei_1 = "Tišina je loš predznak, moj racionalni prijatelju. Može govoriti glasnije od najzaglušujućih riječi. Hmm... Gdje smo? Kakvo je ovo bizarno mjesto?"
uw.dlgHunter_greeting_sensei_2 = "Sumnjam u to, draga moja... Ovo mjesto izgleda drugačije nego kad sam ga zadnji put vidio. Počinjem misliti da je starac bio u pravu..."
uw.dlgHunter_loose_hunter_1 = "Leziiii. Ostaaavit ću te ovdje zauvijeeek. Ne čini viiiiše zla."
uw.dlgHunter_win_hunter_1 = "Stani, čovjekuuu-Sjeno! Ne dopusti da se šiiiiiriiii! Biiiiit ćeš kao oooooon. Biiiit ćeš preeeevaaaareeen! Ali još uvijek imaš šaaaansuuu."
uw.dlgIE21AnnounceAssistant_1 = "Tko je to zaboga? Što radiš u našem svijetu, i zašto bismo te uopće slušali?"
uw.dlgIE21AnnounceAssistant_2 = "Ha! Ne znam odakle si došao, ali ovdje se nećeš dugo zadržati!"
uw.dlgIE21AnnounceAssistant_3 = "Hej, Sjeno, ovaj je nasilnik otišao predaleko! Ajmo ga naučiti nekim manirima!"
uw.dlgIE21AnnounceBoss_1 = "Vi patetični smrtnici! Poklonite se pred mojom voljom i slavom, ili ću vas ja natjerati na koljena!"
uw.dlgIE21AnnounceBoss_2 = "Kako se usuđuješ tako razgovarati sa mnom—ja sam Ravana, osvajač sva tri svijeta!"
uw.dlgIE21AnnounceBoss_3 = "Ovo vam je posljednja prilika da kleknete. Odbijte, i uzet ću vam glave!"
uw.dlgIE21AnnounceSensei_1 = "Sjeno, osjećam da se približava tajanstvena prijetnja. Nešto zlo je ponovno pronašlo put do našeg svijeta."
uw.dlgIE21Boss_After_Loose = "Ako su svi ljudi ovoga svijeta tako slabi, onda je njegovo osvajanje samo pitanje vremena!"
uw.dlgIE21Boss_After_Win = "BUDALE! Povlačim se za sada, ali nećete me tako lako pobijediti. Vratit ću se!"
uw.dlgIndia22Story_May_1 = "I tako ste počeli gladovati... Što je taj demon mogao htjeti na vašem radosnom slavlju? Kako su skromni farmeri mogli privući takvog grabežljivca?"
uw.dlgIndia22Story_Rakshasa_1 = "Imaš zanimljiv miris, čovječe. Nema sumnje da bi bio jednako ukusan! Čuješ li kako mi kruli u trbuhu? Bilo bi jako lijepo imati odabrani komad mesa uz moju rižu!"
uw.dlgIndia22Story_Rakshasa_Lose = "Na tvoju sreću, naša me borba izmorila. Osim toga, moja je glad utažena... za sada. Probudit ću novi apetit i ponovno loviti!"
uw.dlgIndia22Story_Sensei_1 = "Pričaj mi o njemu, putniče. Po tvojoj odjeći vidim da si dugo putovao. Kakva nevolja muči tvoj dom?"
uw.dlgIndia22Story_Sensei_2 = "Obuzdaj svoj apetit, demone! Neće biti pozivnice za festival života za onoga tko krade sam život!"
uw.dlgIndia22Story_Sensei_Win = "Nije magija ono što tjera vrt da cvjeta—već naporan rad. A ti ćeš to i sam dokazati: pomozi svojim susjedima obnoviti njihovu farmu, ili inače..."
uw.dlgIndia22Story_Sitaram_1 = "Čuo sam tvoju životnu priču. Neka te bogovi nagrade prema tvojim zaslugama! Nosim loše vijesti: u mojim se zemljama pojavio zli duh..."
uw.dlgIndia22Story_Sitaram_2 = "Zlo ovog demona nadmašuje samo njegova glad! Spremali smo se proslaviti Bohag Bihu kada se, iznenada, ovo... stvorenje pojavilo i proždrlo sve naše sadnice!"
uw.dlgIndia22Story_Sitaram_3 = "Kao što mi je Agni svjedok, moja gospo, i ja se pitam isto! Sada u strahu čekamo zalazak sunca... Pođite sa mnom, preklinjem vas!"
uw.dlgIndia24_Enter_Puppet_1 = "Imaš li duh potreban da usmjeravaš sudbinu? Odluči o mojoj, kakav sam ponizni sluga umjetnosti. Tek u borbi istinski shvaćaš što je što. Budi hrabar, Sjeno—u napad!"
uw.dlgIndia24_Story_Dandy_1 = "Otvaraj, ili ću razvaliti ova prokleta vrata! Znam da ste kod kuće—čujem vas! Zapalit ću ovu kolibu ako mi ne pružite utočište!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Oh, kako se smrtnici žestoko drže za život. Nisam ja izabrala ovaj posao, i neću nad njim liti otrovne suze... Zašto ste mi to učinili?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Njezino je srce ispunjeno ljubavlju. Bogovi nas stvaraju čistima, ali mi sami biramo svoj put. Nrityu to počinje shvaćati slušajući djevojčinu priču."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Sjeno, tvojoj izvedbi nedostaje strasti i predanosti. Dat ću ti još jednu priliku. Nemoj to samo glumiti—živi to!"
uw.dlgIndia24_Story_Puppet_1 = "Kuc, kuc! Hej, stari prijatelji! Glas sudbine je pred nama—i ona je na putu! Njen crveni porub tinja kao sam život na zalasku dana!"
uw.dlgIndia24_Story_Puppet_2 = "Je li to po tvoju dušu došla? Gledaj priču staru koliko i sam svijet—legendu o Nrityu, čija je sudbina bila oduzimati živote."
uw.dlgIndia24_Story_Puppet_3 = "Duhovi svi brbljaju. Ne možete im vjerovati. A osim toga, nije na njima da ispričaju priču. Pokazat ću ti istinu kroz njezine oči. Sjeno, ti si jedini koji može razumjeti."
uw.dlgIndia24_Story_Sensei_1 = "Taj glas... Čini se da naš stari protivnik ponovno nešto smjera. Tko će ovoga puta biti žrtva? Vidim muškarca kako trči prema pagodi..."
uw.dlgIndia24_Story_Sensei_2 = "Tvoja je odjeća prekrivena prljavštinom i čađom, stranče. I tvoj me ton uznemiruje. Objasni tko si ti i kakvog posla imaš pred našim pragom!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Odstupi! Nisam to htjela! Moja me se obitelj bojala, a ja sam mislila da je ovo moja prilika... Kicoš je obećao da će me povesti sa sobom, samo ako pomognem..."
uw.dlgIndia24_Story_Win_Nrityu_1 = "Eto! Padaš u vječni san, iako to ne zaslužuješ. Ali nije na meni da ti sudim—to je tuđi poziv. Ja sam samo pratnja."
uw.dlgIndia24_Story_Win_Puppet_4 = "Baš kao i ti, Sjeno. Želim da slijediš put od Nrityu. Trebala joj je vječnost da shvati svoje mjesto."
uw.dlgIndia24_Story_Win_Puppet_6 = "Predstava se nastavlja! Ti ćeš, Sjeno, biti zvijezda, a moji glumci bit će tvoja prateća postava. Priča o Nrityu bit će naša najveća produkcija!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Ova je priča duboka—čak i za tebe. Iznenađen sam! Ali koja je pouka ovdje? Zašto nam to pokazuješ?"
uw.dlgMegalithGreetings = "Ovaj rudnik je sveto mjesto. Što tražiš ovdje? Odlazi i prihvati svoju sudbinu dostojno. Posljednje što ćeš čuti je kako ti zemlja drhti pod nogama!"
uw.dlgMegalithLost = "Prokletstvo! Moram li opet čekati tisuće godina?! Ja sam micao kontinente! Čišćenje Zemlje je bila moja uloga!"
uw.dlgMegalithWin = "Bio sam dobar prema ljudima. Što je rijetkost među Besmrtnicima. Puno sam puta pomagao vašoj vrsti. Zato bježite i oprostite se od svojih bližnjih dok još možete."
uw.dlgRaidIntro1 = "Pokušavaš li ispraviti svoju pogrešku? Otvorio si Vrata Sjena, ali samo Besmrtnici mogu uništiti sjenovitu zarazu. Ti si slab, nisi jedan od nas."
uw.dlgRaidIntro2 = "Umrijet ćeš kao i svi ostali. Magma teče mojim žilama, i ona će prekriti cijelu Zemlju, očistiti je za novi život."
uw.dlgRaidStory1 = "Kakav je ovo podrum i zašto smo ovdje?"
uw.dlgRaidStory2 = "Ovdje počinju vladavine Besmrtnika. Tisućljećima su spavali, ali Vrata Sjena stavila su cijeli svijet u opasnost, i to ih je probudilo."
uw.dlgRaidStory3 = "Super, znači oni će nam pomoći brzo riješiti problem s vratima!"
uw.dlgRaidStory4 = "Ne, ne. Uništit će Vrata, ali zajedno s njima uništit će i čovječanstvo. Za njih je to samo novi ciklus stvaranja i uništenja."
uw.dlgShurale_Announce = "Probuđen od strane pohlepnih razbojnika, šumski duh se sada osvjećuje nedužnima. Stvorenje traži ukradenu škrinju sjećanja—posudu svoje drevne magije. Samo oni čija srca kriju pravu tugu mogu smiriti gnjev stvorenja. No, cijena će biti visoka..."
uw.dlgStoryBtnFight = "U BOJ!"
uw.dlgStoryBtnMore = "DALJE"
uw.dlgVolcanoGreetings = "Od svih Besmrtnika, ja sam se probudio prvi. Mnogo boraca će umrijeti pod mojoj rukom, a ja ću dovršiti svoju misiju."
uw.dlgVolcanoLost = "Dosta! Predajem se. Ali znaj ovo: probudili ste mog brata. Neka vas ne prevari njegov izgled, jer on bijaše brz i ubojit."
uw.dlgVolcanoStory1 = "Vidim neke polurazrušene nastambe i ogroman kip. Žive li ovdje ljudi?"
uw.dlgVolcanoStory2 = "Samo fanatici. Oni se klanjaju Besmrtnicima u nadi da će ih poštedjeti. Doista, vjera ih čini slijepima. Ako mi ne uspijemo zaustaviti Besmrtnike, ti fanatici će ubrzo doznati pravu istinu."
uw.dlgVolcanoWin = "Uvijek sam govorio braći da bih ja trebao odlučivati o sudbini planeta. Sad gledajte, nevjernici, kako moj oganj prekriva planet!"
uw.dlgVortexGreetings = "Tamne vode progutati će zemlju, a s njima i Vrata sjena! Njihova tajna otići će u morski bezdan. A na površini neće ostati nitko tko bi je ispričao!"
uw.dlgVortexLost = "Po prvi put u tisućljećima čovjek odnosi pobjedu. Uistinu vaša volja za životom bijaše snažna! Ali što god činili, ishod je isti — umrijet ćete."
uw.dlgVortexWin = "Tisućljećima sam promatrao kako vaš rod blijedi. U tome ima neke ljepote. Možda ću ti poštediti život, ali samo radi zabave."
uw.dlgWhisperGreetings = "Čini se da netko jedva čeka otkriti svoju sudbinu. Daj mi ruku i zagledaj se u ogledalo!"
uw.dlgWhisperLost = "Još si živ? Onda još nisi u mojoj moći! Fatum će proreći tvoju sudbinu, a onda ću se ja vratiti u svoj svijet—nakon što sam te upozorila da oprezno postupaš s ogledalima!"
uw.dlgWhisperWin = "Odvest ću te sa sobom u carstvo pepela, duhova i vječne noći! Vjeruj mi—gledaj me u oči, i ne skreći pogled."
uw.dlg_American_25_Loose_1 = "Ne znaš koga štitiš, Sjeno. Neće ti zahvaliti. Samo će ti se rugati iza leđa. Divljaci... a ja sam čudovište?"
uw.dlg_American_25_Story_1 = "May je nestala. Odvelo ju je nešto jedva ljudsko. Ipak, nije bilo vrisaka, nikakvih znakova borbe... kao da je otišla svojom voljom."
uw.dlg_American_25_Story_2 = "Nismo sami u ovome. Drugi poput May—mladi, snažni—također su nestali. Predosjetila je da to dolazi... i napunila džepove barutom."
uw.dlg_American_25_Story_3 = "Njezin trag je jasan. Moramo je pronaći prije nego što padnu kiše, ili će biti zauvijek izgubljen. Krenimo, Sjeno!"
uw.dlg_American_25_Story_4 = "Nanjušio sam te čim si stupio na ovo prokleto tlo. Zašto si došao? Da gaziš po mojoj tuzi? Nemaš časti—baš kao što je ni oni nisu imali."
uw.dlg_American_25_Story_5 = "Znao sam da ćeš se pojaviti, šamane. Vrati djecu njihovim obiteljima, a nama našu prijateljicu. A onda idi i truni na svojoj planini pepela."
uw.dlg_American_25_Story_6 = "Pepeo pepelu. I u pepeo ćeš se pretvoriti, smrtniče..."
uw.dlg_American_25_Win_1 = "Čekajte! Pošla sam s njim dobrovoljno. Njegov izgled jest zvjerski, da—ali njegovo je srce ljudsko. I pati... Ukrali su mu dijete!"
uw.dlg_CHN_NY25_Announce = "Uroni u priču o junaku iz davnih vremena—razmrsi istinu od mita i pomozi iskovati novu legendu! Suprotstavi se tajanstvenom kultu koji koristi ime velikog junaka kao paravan za svoja zvjerstva! Vrati se na mjesto gdje je sve počelo i pomozi odbjeglom lupežu da otkrije svoje pravo junaštvo!"
uw.dlg_CHN_NY25_Loose_1 = "Ne, moramo se nastaviti boriti! Nitko ne bi povjerovao da običan farmer može tako lako poraziti zlokobni kult. Moraš dati sve od sebe!"
uw.dlg_CHN_NY25_Story_1 = "Kult Sunca ima tradiciju posjećivati rodno mjesto svog velikog junaka jednom godišnje. Ali svaki put to završi katastrofom..."
uw.dlg_CHN_NY25_Story_2 = "Rođen je kao čovjek? Kako neobično. Čini mi se da ovi ljudi ne donose darove selu..."
uw.dlg_CHN_NY25_Story_3 = "Ništa ne ostavljaju netaknutim! Kradu stoku seljanima, pustoše usjeve u pijanom ludilu, razbijaju prozore i započinju tučnjave!"
uw.dlg_CHN_NY25_Story_4 = "Ali zašto se seljani ne brane? Ovo je njihova zemlja i njihova legenda!"
uw.dlg_CHN_NY25_Story_5 = "Slomljeni su. Junaka koji im je dao nadu više nema, a kultisti čine zlo u njegovo ime. Moramo im ponovno vratiti nadu!"
uw.dlg_CHN_NY25_Story_6 = "Reci da si došao provjeriti je li sve spremno za 'blagdan'. I mi ćemo se boriti! Građani će vidjeti da se kultu može suprotstaviti!"
uw.dlg_CHN_NY25_Story_7 = "Vrlo dobro, neka bude po tvom... Daj da uđem u ulogu. 'Hej, momče, kako se usuđuješ nositi odjeću našeg junaka! Odlazi—moramo pripremiti gozbu!'"
uw.dlg_CHN_NY25_Story_8 = "Možda nisam legendarni junak, ali njegov duh živi u ovoj zemlji! Vodit će me u mom najmračnijem satu i dati mi hrabrosti! U napad!"
uw.dlg_CHN_NY25_Win_1 = "Nisam očekivao takvu brzinu od običnog čovjeka... Gotovo si nadvladao našeg prvaka! Moramo na tebi pokazati primjer, da drugima ne bi padale na pamet ovakve ideje..."
uw.dlg_NY25_Loose_1 = "Tvoja su sjećanja živa, a tuga govori glasnije od razuma. Ostat ćeš ovdje sa mnom. Odmori se malo—san će uskoro doći."
uw.dlg_NY25_Story_1 = "Dobro došli! Ova je koliba nekad pripadala mojoj obitelji. Toliko sjećanja... Ostanite koliko god želite. Ovdje je sve što vam treba za odmor."
uw.dlg_NY25_Story_2 = "Ali toliko si nas puta doveo u opasnost, a sada nam nudiš boravak u svom obiteljskom domu? Je li ovo nekakav trik?"
uw.dlg_NY25_Story_3 = "To samo govori glas savjesti! Shvatio sam da sam predugo iskorištavao tuđu dobrotu. Ali sada, želim činiti dobro."
uw.dlg_NY25_Story_4 = "Nismo sami... Neki se ljudi okupljaju ispred kolibe. Što žele u ovaj kasni sat? Zovu nas da izađemo."
uw.dlg_NY25_Story_5 = "Nemojte! Fantomi će vas uništiti! To su samo duhovi bolnih sjećanja. Šumski duh je došao po svoju škrinju! Idemo je vratiti!"
uw.dlg_NY25_Story_6 = "Škrinja? Dakle, to je razlog zašto ljudi nestaju u šumi! Zašto si nas izdao, Sly? Svejedno bismo ti pomogli u ovom plemenitom pothvatu!"
uw.dlg_NY25_Story_7 = "Ne razumijete. Ako čujem njezin glas, izgubit ću kontrolu—i mene će također nestati. Sve dok sa sobom nosim djelić nje."
uw.dlg_NY25_Story_8 = "Otvori vrata, smrzavam se ovdje vani, tatice. U kući je hladno, a ja nisam unutra. Pokazat ću ti mjesto gdje možemo ponovno biti zajedno."
uw.dlg_NY25_Story_9 = "Stani! Ne idi u šumu—izgubit ćeš se! Ne znam čiji glas čuješ, ali zasigurno nije ljudski!"
uw.dlg_NY25_Win_1 = "Probudi se, Sly! Vrati škrinju duhu dok je slab. Neka vidi da čovječanstvo može nadvladati vlastitu pohlepu."
uw.saturn_enter_saturn_1 = "Natjerat ću te da progutaš svoje riječi. A tvoji prijatelji će gledati. Jedini način da se napusti moj zatvor je preko stratišta. Tko želi ići prvi?"
uw.saturn_greeting_saimon_1 = "Naš vladar, Patrijarh, godinama je proučavao portal. Zatim se jednog dana povukao u sebe. Kasnije je podigao Obelisk, i on je učinio nešto našem svijetu..."
uw.saturn_greeting_saimon_2 = "Sjena je sličan Obelisku na molekularnoj razini. Postoji netko tko će nam pomoći da to iskoristimo protiv Patrijarha. Zato smo ovdje, u Saturnovoj odaji..."
uw.saturn_greeting_saimon_3 = "Tisuću isprika, moja gospođo. Ipak, moramo osloboditi Lazara. Molim vas, pokažite nam njegovu ćeliju i nećemo vas više mučiti."
uw.saturn_greeting_saturn_1 = "Daleko idete, djeco? Došli ste u moj zatvor svojom slobodnom voljom! Pitam se—je li to hrabrost ili glupost? Ti, onaj krakati—odgovori mi!"
uw.saturn_greetingn_May_1 = "Ali kakve to veze ima s nama?"
uw.saturn_lose_saturn_1 = "To vam je dovoljno. Ako se Lazar druži s otpadnicima poput vas, onda nema opasnosti za Patrijarha. Gubite se odavde, derišta! Niste na mom popisu."
uw.saturn_win_saturn_1 = "Nikad nećete pronaći Lazara. Taj je vragolan pobjegao iz mog zatvora i sklonio se u močvare. Želite li i vi nestati? Onda krenite za njim!"
uw.summerfest25_story2_1 = "Gle, gle... Toliko ste me željeli pronaći, pa sam pomislio da vam učinim uslugu. Osim toga, svi su čekali ovaj trenutak."
uw.summerfest25_story2_2 = "'Svi'? Prestani s glumom. Znamo točno tko si—i kako koristiš druge samo da bi uživao u njihovoj patnji."
uw.summerfest25_story2_3 = "Samo jedno malo pojavljivanje i bum—u trendu sam! Iskreno, nisam očekivao da ću biti ovako popularan."
uw.summerfest25_story2_4 = "Tvoja domišljatost te neće spasiti. Platit ćeš—za moje oči, i za sve zlo koje si učinio. Tvoja uvrnuta igra izigravanja boga ovdje završava!"
uw.summerfest25_story2_5 = "Ozbiljno, Ermine? Takav je govor izašao iz mode s mobitelima na preklop. Godina je 2026.—pokušaj ići ukorak s vremenom."
uw.summerfest25_story2_6 = "Što god Arhitekt planira... tama ga okružuje. Sila toliko zlonamjerna da je gotovo opipljiva."
uw.summerfest25_story2_7 = "Sa svakom riječi koju izgovori, uhvatim se kako sve više vjerujem u Ermininu priču. Arhitekt je opasan—i mora biti zaustavljen."
uw.summerfest25_story2_defeat_1 = "O ne—kako razočaravajuće! Publika je očekivala više. Čini se da ću jednostavno morati podići uloge sljedeći put."
uw.summerfest25_story2_win_1 = "Zašto je svijet tako okrutan? Zašto moramo patiti? Zašto sam se morala oslijepiti? Odgovori mi, Arhitektu—zašto život boli!?"
uw.tutorial_ascention_intro_title = "LUTKAR"
