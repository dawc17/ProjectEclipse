sensei.defeat.OK = "OK"
sensei.defeat.Sensei_defeat1 = "Ne, stani, sve je bilo sasvim drukčije... Oprosti starcu, zaboravio sam."
sensei.defeat.Sensei_defeat2 = "Čini se da je sve išlo drugačije... Sjećanje je vrlo krhka stvar."
sensei.defeat.Sensei_defeat3 = "Čini mi se da je kraj tog okršaja bio drukčiji. Pokušat ću se sjetiti..."
sensei.defeat.Sensei_defeat4 = "Moja sjećanja su tako mutna... Čini mi se da sam pobijedio u toj borbi."
sensei.defeat.Sensei_defeat5 = "Ne, nije tako. Tada sam pobijedio."
