uw.blackness_enter_blackness_1 = "Potomstvo. Velika žrtva. Sfera. Um. Pokolj. Osjećam. Prolit ćeš krv. Vidim bol. Vidim budućnost. Pokazat ću ti."
uw.blackness_greeting_blackness_1 = "Što nije u redu, Sjeno? Jesi li loše?"
uw.blackness_greeting_lazarus_2 = "Simon? Kakav si ti gad! Zašto si doveo ljude ovamo? Nanjušit će vaše misli! Bježite odavde prije nego što Crnilo okusi vaš um!"
uw.blackness_greeting_may_1 = "Čujete li to? Ništa! Tišina. Bez pjeva ptica, kao da je ovo mjesto zamrznuto u jantaru. Radimo li pravu stvar? Imam jako loš predosjećaj..."
uw.blackness_greeting_saimon_2 = "Ova gospoda su tvoja karta za slobodu, dragi moj. Veliki u crnom je nekako povezan s Obeliskom i Vratima. On pomogne tebi, a ti njemu."
uw.blackness_greetingn_saimon_1 = "Nije ni čudo. Otkako se djelić drevnih Vrata srušio ovdje, život na ovom mjestu postao je statistička anomalija. Držite oči širom otvorene—moramo pronaći Lazara."
uw.blackness_lose_blackness_1 = "Ostaješ ovdje. Vječno. Jedna krv. Zauvijek. Čitat ću te. Hranit ću se."
uw.blackness_win_sensei = "Lagao si nam, čovječe od znanosti! Koga smo to oslobodili? Na što smo osudili ovaj svijet? Shvaćaš li što si učinio?!"
