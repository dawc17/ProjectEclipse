uw.DEMON_RAID_Title = "Rukavica"
uw.EARTHQUAKE = "Periodični potresi."
uw.EnterPortal_ActScreen = "Portal"
uw.FRAGILITY = "Povećana ranjivost na označenom području."
uw.Gatekeeper_greetings_1 = "Čudan zrak? Čudan zrak! Čuuudan zrak!"
uw.Gatekeeper_greetings_2 = "Nisu sretni, nisu sretni, nisu sretni! Mi smo učinili, mi smo učinili, mi smo učinili!"
uw.Gatekeeper_greetings_Assistant_1 = "Sjeno! Konačno si se probudio!"
uw.Gatekeeper_greetings_Assistant_2 = "Tako je hladno ovdje! Već ne osjećam prste... Gdje smo? Zrak se čini tako čudnim."
uw.Gatekeeper_greetings_Assistant_3 = "Ali zašto osjećam kao da nas razumije?"
uw.Gatekeeper_greetings_Sensei = "Odstupi, May! Ne znamo što želi! Svijet Besmrtnika potresen je više nego što sam mislio. Nakon onoga što smo učinili, nisu sretni što smo ovdje."
uw.Gatekeeper_greetings_Sensei_2 = "Smiri se sada—ne radi nikakve nagle pokrete. Čini se da ovo stvorenje nije baš inteligentno."
uw.Gatekeeper_greetings_Sensei_3 = "To sad nije važno. Prolazak kroz portal bio je naš izbor i moramo za to odgovarati. Ono želi borbu—nemamo izbora, Sjeno."
uw.Gatekeeper_lost_Saimon = "Očekivao sam više od portala... Čini se da vam je putovanje iscrpilo snagu, a vaše su molekularne veze oslabljene. Zanimljivo—moramo provesti još nekoliko testova."
uw.Gatekeeper_win_Saimon = "Stoljećima nas je ovaj klimavi portal podsjećao da postoje sile izvan našeg razumijevanja. A onda ste se pojavili vi..."
uw.HARD_GROUND = "Pri padu na tlo primaš štetu."
uw.HEAD_BERSTUUK = "Berstuukova maska"
uw.HEALTH_DROPS = "Zdravlje opada s vremenom."
uw.HOT_GROUND = "Užareno tlo."
uw.HW20Arkhos1 = "Ne treba mi proročanstvo da vidim kako će vatra vjere progutati i slabe i slijepe. Donio sam crne svijeće, kako bi svi mogli vidjeti ovu istinu jednako jasno kao i ja!"
uw.HW20Fatum1 = "Granice između svjetova postaju sve tanje—ovo je najbolja noć za proricanje! Zrak bruji od magije, a u mojim rukama leže same niti sudbine!"
uw.HW20Fatum2 = "Proricanje je za mene igra—mogu raspolagati sudbinama smrtnika kako me volja. Ali vi, moji prijatelji, vi ste potpuno druga priča. Molim vas, sjednite!"
uw.HW20Fatum3 = "Zaslijepljen si svojom mržnjom. Započnimo. Ne govorite, već slušajte. Vidim figuru... crnu kao noć... perje i pepeo... kako me hvata za ruku..."
uw.HW20Fatum4 = "Kako... kako to da si ovdje? Put do ovog svijeta bio ti je zapečaćen!"
uw.HW20Megalith1 = "Govorila si o proricanju sudbine i maskenbalu, pa sam donio čarobno ogledalo. Prvi put u tisuću godina mogu vidjeti svoj odraz. Pod ovom maskom izgledam prastaro!"
uw.HW20Whisper1 = "Jesi li se to igrala proricanja, sestrice? Preuzimala kontrolu nad smrtničkim sudbinama? Takve su igračke oduvijek bile samo moje!"
uw.HW20Whisper2 = "I jest bio zapečaćen! Ali ti si zvala, a ja sam kroz ovo predivno ogledalo došla. Uzimam ga sa sobom. Svakako posjeti, da čuješ neka prava proricanja sudbine!"
uw.Hunger_AfterLoss = "Ti si izabranik! Dajem ti posljednju šansu da ostaneš sa mnom i gozziš se. Inače će ti kosti ležati u prahu zajedno s ostalima."
uw.Hunger_AfterWin = "Stvoritelju, poslao si mi hranu, ali ne mogu se nasititi. Moja glad traje čitavu vječnost, podari mi oslobođenje..."
uw.Hunger_Greetings1 = "Tako dugo si hodao do ovdje. Zašto? Da spašavaš nezahvalne smmmrtnike? Njima nije stalo do tebe! A ja osjećam tvoju samoću, glad i strrrah."
uw.Hunger_Greetings2 = "Ne daj se prevariti, Sjeno! On samo izgleda slabo. Za njega nisi prijatelj, nego plijen. Rastrgat će te na komade ako mu priđeš i korak bliže!"
uw.Hunger_Greetings3 = "Vidiš li moju braću? Muči ih žeđ, ali drugačije vrste. Žele prizooore. Ali njihova glad — samo je jadno odraz moje!"
uw.INVERTED_JOYSTICK = "Obrnuto upravljanje."
uw.LIGHT_IN_THE_DARK = "Svjetlo u tami"
uw.MERCENARY_RAID = "PLAĆENIČKA{br}POSTROJBA"
uw.MERCENARY_RAID_Title = "Plaćenička postrojba"
uw.MiniEventAnnounce = "Od pamtivijeka kult obitava u utrobi zemlje, pazeći na osjetljivi san bogova podzemlja i sprječavajući njihovo buđenje. Ali cijena je okrutna obredna bitka, borba do posljednje kapi krvi."
uw.MiniEventHungerFight_Enter_1 = "Ovdje pod zemljom sve je drugačije. Borimo se da bismo živjeli, a klopa je život! Nemoj lišiti svoj narod—ili moj—ove velike radosti!"
uw.MiniEventHungerStory_1 = "Ljudi brinu o hirovima duhova samo kada nevolja zakuca na njihova vrata. Njihovi usjevi venu, njihova djeca gladuju... A gdje je sada njihova vjera?"
uw.MiniEventHungerStory_2 = "Glad ima oblik. Njena žeđ za proždiranjem je strašna. Ali to je Karcerova uloga, dok je tvoja i moja spriječiti ga da se probudi iz svog stoljetnog sna."
uw.MiniEventHunger_Loss_1 = "Zar te majka nije naučila da ne ostavljaš ništa na tanjuru? Vidi se—ima gladi u tvojim očima! Ili... što je s tobom?"
uw.MiniEventHunger_Win_1 = "Da, dobro udaraš, Sjeno... Proslavimo tvoju pobjedu uz neku obilnu klopu! Ja častim!"
uw.MiniEventStory_1 = "Vidim da si ti, Sjeno, snažan i postojanog duha. Legende o tvojim djelima su nadaleko poznate. Želiš li postati dio još jedne?"
uw.MiniEventStory_2 = "Duhovi podzemlja su nepredvidivi. Izvodimo ceremoniju kako bismo ublažili njihove naravi—obredne bitke! Tvoje bi nam sudjelovanje bilo čast."
uw.MiniEventStory_EnterBattle = "Nisi li malo previše boležljiv za ovakav tajanstveni spektakl? I stvarno ste odabrali ovoga? Ovo je čovjek iz legendi? Oh, duhovi će biti ogorčeni..."
uw.MiniEventStory_Loss_1 = "Da, pa... Želim vjerovati da čak i duhovi imaju smisla za humor i da će se samo smijati našem nespretnom batrganju u areni, umjesto da oslobode svoj gnjev na nama..."
uw.MiniEventStory_Win_1 = "Pa... Nitko ne dolazi u ovu arenu slučajno. Ti si doista čovjek iz legendi, Sjeno."
uw.MiniEventVulkanFight_Enter_1 = "Vještica vas plaši bez razloga. Stvar je puno jednostavnija od toga: čelik se kali u vatri! Bogovi razumiju samo moć i ništa drugo. Samo ih moć može vratiti u njihov san! U napad!"
uw.MiniEventVulkanStory_1 = "Očišćavajuća vatra je pravedna—tako kažu naši preci. Ali oni nisu znali da Besmrtnici ne mare za ljudski moral. To je jednostavno njihova priroda."
uw.MiniEventVulkanStory_2 = "Osjećaš li vrelinu koja se diže iz dubine zemlje? Postoji jedna stvar koju moraš znati: plamen ne štedi nikoga, bio on prijatelj ili stranac. A mi stojimo točno na njegovom putu."
uw.MiniEventVulkan_Loss_1 = "Moraš stati na noge, Sjeno! Zar ne osjećaš kako se tlo trese?! Bogu se gadi naše puzanje u prašini..."
uw.MiniEventVulkan_Win_1 = "Ovdje je vruće kao u paklu... Vatreni duh zadovoljno reži u svom trezoru! Doista odlična borba, Sjeno! Zaradili smo još jedan dan!"
