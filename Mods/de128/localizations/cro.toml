# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "Senseijeva priča{br}Dio 1: \"Svjedok\""
sensei.entry.ActScreenSensei2 = "Senseijeva priča{br}Dio 2: \"Sjena budućnosti\""
sensei.entry.ActScreenSensei3 = "Senseijeva priča{br}Dio 3: \"Zvijer iznutra\""
sensei.entry.ActScreenSensei4 = "Senseijeva priča{br}Dio 4: \"Priča o osveti\""
sensei.entry.ActScreenSensei5 = "Senseijeva priča{br}Dio 5: \"Ponižen i {br}uvrijeđen\""
sensei.entry.ActScreenSensei6 = "Senseijeva priča{br}Dio 6: \"Čudovište\""
sensei.entry.ButcherYoung_Greetings = "Nitko se ne usudi sumnjati u moj autoritet! Obitelj to ne oprašta. Nećeš odavde živ izaći!"
sensei.entry.Butcher_zone3_1 = "Vratio se izgubljeni sin! Jesi li razmislio o mom prijedlogu, Kneže? Pustim te, kažem gdje je Sfera, a ti mi platiš zlatom?"
sensei.entry.Butcher_zone3_2 = "Njegova šutnja govori više od riječi, starče. Ja sam iskren sa sobom, prihvatio sam svoju zvjersku narav. On nije. Ali naučit ćemo vas mi poniznosti. Djeco, k meni!"
sensei.entry.Guard1_Butcher_Sensei = "Mesar mi je pokazao kako bol otkriva našu pravu bit. Sad sam slobodna! I vi ćete naći sreću. Ne oppirite se!"
sensei.entry.Guard1_Hermit_Sensei = "Promjene dolaze! Prešla sam pola svijeta da to shvatim, žrtvovala sam toliko mnogo... I učiteljeva mudrost — to je sve što mi ostaje!"
sensei.entry.Guard1_Lynx_Sensei = "Sviđaju ti se moji uzorci? Ondje odakle potječem, tetoviraju ih najjačima u spomen na ratne podvige. Sad ćeš i ti postati dio mog crteža..."
sensei.entry.Guard1_Wasp_Sensei = "Vjeruješ li u sreću? Mislim da će mi danas posebno posrećiti — uzet ću sav tvoj novac! Hoće li tebi posrećiti, starče?"
sensei.entry.Guard1_Widow_Sensei = "Gospodarica mi je poput sestre. Dobro osjećam njenu bol. Zabranila mi je dirati Kneza, pa će moj gnjev pasti na tebe!"
sensei.entry.Guard2_Butcher_Sensei = "Plijen sam dolazi grabežljivcu! Filozofija je za pametne, a ja jednostavno volim igrati se noževima. Hoćete li se igrati sa mnom?!"
sensei.entry.Guard2_Hermit_Sensei = "Učitelj je pričao o svijetu sjena, njegovim stanovnicima i nevjerojatnoj moći kojom će se podijeliti s nama. Misliš li da ću to dopustiti da nam se uzme?"
sensei.entry.Guard2_Lynx_Sensei = "Naš klan radi posao kojim se ni bogovi ne žele prljati. Mi rješavamo probleme i ispravljamo tuđe greške. I ti si jedna od njih."
sensei.entry.Guard2_Wasp_Sensei = "Prijetiš mojoj kapetanici? Ona me spasila iz ropstva, i zaklela sam se da ću odraditi svoju slobodu. Neka ti duhovi budu milostivi..."
sensei.entry.Guard2_Widow_Sensei = "Moja gospodarica je prekrasna! Nisam bio dostojan gledati u njezino lice... Sada moj život pripada njoj. Branit ću njezinu čast do posljednjeg daha."
sensei.entry.HermitYoung_Greetings = "Kneže, vi ste žrtva okolnosti. Trebalo je prinijeti tu žrtvu za opće dobro. Moja škola postat će velika, i nastupit će zlatno doba borilačkih vještina!"
sensei.entry.Hermit_zone2_1 = "Našli ste se između čekića i nakovnja, gospodine. Da, izdao sam vas. Nisam imao izbora, jer u igri je budućnost moje škole."
sensei.entry.Hermit_zone2_2 = "Taj oholI mladić Ris nije uspio izvršiti svoju zadaću. Izgleda da ću morati obaviti posao umjesto njega. Učenici, ovamo!"
sensei.entry.LynxYoung_Greetings = "Ne mogu tek tako otići. Već sam uzeo novac za Knežev život. Ništa osobno, starče."
sensei.entry.Lynx_Sensei_1 = "Ne slušaj Kneza, starče, poludio je. Odvest ćemo njegovo visočanstvo kući dok ne naudi samome sebi. Tvoja pomoć nije potrebna."
sensei.entry.Lynx_Sensei_2 = "Zbilja? A ja vidim prestrašenog čovjeka okruženog ubicama. Nešto mi govori da Knez govori istinu. Maknite se od njega!"
sensei.entry.Lynx_Sensei_3 = "Kako znaš. Za pričanje mi ne plaćaju. Dvije glave — više novca! Uhvatite ih, momci!"
sensei.entry.NAME_BUTCHER = "MESAR"
sensei.entry.NAME_HERMIT = "PUSTINJAK"
sensei.entry.NAME_LYNX = "RIS"
sensei.entry.NAME_PRINCE = "KNEZ"
sensei.entry.NAME_SHOGUN = "ŠOGUN"
sensei.entry.NAME_WASP = "OSA"
sensei.entry.NAME_WIDOW = "UDOVICA"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Upomoć! Ovi ljudi žele me ubiti!"
sensei.entry.Prince_zone3_1 = "Kako se usuđuješ okaljati moje ime! Ti... ti jadni ološe! Vratio sam se da stanem na kraj tvojoj vladavini okrutnosti!"
sensei.entry.Prince_zone6_1 = "Evo te konačno, moj vjerni prijatelju! Gledaj, pravda opet trijumfira — Šogun mi je odan poput psa! Njegov razum pripada meni!"
sensei.entry.Prince_zone6_2 = "I ti želiš uzeti moje prijestolje, starče?! Pripada mi po pravu rođenja! Nitko ga neće uzeti!"
sensei.entry.Sensei_arc_intro1 = "Jednog dana u šetnji susreo sam vladara ovih zemalja kojemu je prijetila smrtna opasnost."
sensei.entry.Sensei_zone3_1 = "Dakle, tako funkcionira \"sreća\"? Kupili ste slobodu, ostavili ljude na milost i nemilost bandi ludaka... A ja sam bio dobar prema vama, Kneže."
sensei.entry.Sensei_zone4_1 = "Udovica? Naravno... naredila mi je da uzmem Sferu i osobno je dostavim Šogunu."
sensei.entry.Sensei_zone6_1 = "Stani, Kneže! Pogledaj oko sebe! Ova Sfera se hrani tvojom bjesnilom, pretvara te u čudovište!"
sensei.entry.Shogun_zone6_1 = "Slabiću! Ne vrijediš ni za dvorskog šaljivdžiju moga gospodara. Srvat ću te jednim udarcem!"
sensei.entry.TITLE_PRINCE_EVIL = "UKLETI PRINC"
sensei.entry.WaspYoung_Greetings = "Što ću reći svom ocu? Da je njegova kći omekšala i izgubila borbu od nekog starca? To se neće dogoditi dok sam ja nasljednica gusarskog prijestolja!"
sensei.entry.Wasp_zone4_1 = "Udovica te poslala po Sferu? Nisi li malo star za takve zadatke? Mada, svejedno mi je. Ukrcaj se."
sensei.entry.Wasp_zone4_2 = "Samo što Sfere više nemam. Udovičini ljudi su je uzeli još jučer. Ne znam tko si, ali laž ne opraštam. Provucite ga pod kobilicom!"
sensei.entry.WidowYoung_Greetings = "Knez me je ponizio, odbio me, narugao se mojim osjećajima. I sad ću uzvratiti udarac! Ti si njegov prijatelj, pa ćeš mu prenijeti ovu poruku..."
sensei.entry.Widow_zone5_1 = "I ti si došao da me ponizis, kao i Knez? Vi, muškarci, svi ste isti..."
sensei.entry.Widow_zone5_2 = "Pričao je o tvojoj dobroti, o časti, dostojanstvu. Ali muškim riječima više ne vjerujem. Svaki od vas će patiti!"
sensei.entry.Zone2_SenseiReminder = "Prošli put sam pričao o tome kako sam spasio Kneza od ubojica. Saznao sam da se Kneževi vojnici potajno uvježbavaju kod Pustinjaka. Krenuli smo k njemu."
sensei.entry.Zone3_SenseiReminder = "Pustinjak je otkrio da je Kneza izdao vojskovođa Šogun i platio nekom Mesaru da otme vladara. Vrijeme je posjetiti tog razbojnika."
sensei.entry.Zone4_SenseiReminder = "Za Kneževe nevolje kriva je jedna žena! Ona je smislila kako svrgnuti vladara s prijestolja uz pomoć magične Sfere koju su dopremili u luku..."
sensei.entry.Zone5_SenseiReminder = "Gusarica mi je ispričala o kompliciranom odnosu Udovice i Kneza. Nisam dobio Sferu, ali sam saznao da se Knez uputio u planine kako bi pronašao Udovicu."
sensei.entry.Zone6_SenseiReminder = "Magična Sfera je Kneza dovela do ludila! Stekao je nevjerojatnu moć koja nam je svima prijetila propašću! Nisam to mogao dopustiti!"
