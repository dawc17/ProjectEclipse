uw.Tenebris_greetings_1 = "Na granici si stvarnosti, putniče. Ovo je posljednja crta. Iza nje samo je praznina u kojoj se rađaju svjetovi. I ja sam isklesao za njih svjetlo i tamu!"
uw.Tenebris_greetings_2 = "Sjeno, portal iza njegovih leđa možda je naša jedina šansa za spas. Besmrtni su govorili da će uništiti naš svijet — nije li on taj koji će im to omogućiti?"
uw.Tenebris_greetings_3 = "Nećeš preživjeti portal! Ondje vlada nepoznato. Tama u kojoj se mogu stvarati svjetovi. Ali ti ne umiješ stvarati — samo rušiti. Portal će te progutati!"
uw.Tenebris_greetings_4 = "Riskiramo, ali ima li drugog izlaza? Uđimo u portal i zaustavimo Besmrtne. Ili ćemo sami izazvati katastrofu?"
uw.Tenebris_loses = "Bojiš se nepoznatog skrivenog u tami? Sad ćeš s njim ostati sam! Svijet će se raspasti u prah i iznova se roditi. Po spirali."
uw.Tenebris_wins = "Tvrdoglavi budale! Vi, ljudi, svoje probleme rješavate samo grubom silom. Ali svemir ne funkcionira tako. Nakon svih ovih godina, još uvijek ništa nisi shvatio..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Ustani, lutko! Bori se! Nije važno pobijediš li ili izgubis. Boreći se, već mi služiš!"
uw.War_AfterWin = "Lažljivče! Gdje ti je bijes? Kako možeš se boriti bez njega?! Bori se sa mnom! Započnimo još jedan ples oštrica! Znam da rat živi u tebi!"
uw.War_Greetings1 = "Kakav divan dan! Osjećam bitku, približava se poput oluje. Grom — bezbrojna bijesna legija u koraku. Svi su oni darovi na mom oltaru!"
uw.War_Greetings2 = "Gnjev i žeđ za krvlju vriju u njoj. Opija se beskrajnom borbom, ali čemu? Što će naći na vrhu planine od lubanja?"
uw.War_Greetings3 = "Zar ti je stran žar krvave masakra? Vatra, strast, bujna moć! Pokaži na što si sposoban, zabavi me dvobojom ili umri!"
uw.ZONE_RAID = "Podzemlje: Razina 1"
uw.ZONE_RAID1 = "Podzemlje: Razina 2"
