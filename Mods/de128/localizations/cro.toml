# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Sjetio sam se kako je sve završilo! Vraćamo li se mojoj priči?"
sensei.notify.intro = "Ovaj grad budi uspomene. Ispričat ću ti priču koja mi se dogodila mnogo godina temu..."
sensei.notify.more = "Sjetio sam se još nečeg, vraćamo li se mojoj priči?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Ne, Ne spavaš. Zaustavio sam vrijeme kako bih vratio Sferu u svijet Sjena. Njena prisutnost je greška izazvana nestabilnošću Vrata sjena."
sensei.victory.Ancient_zone6_2 = "Promjene dolaze, čovječe. A za sada, spavaj. Kad se probudiš, nitko se neće sjećati tvojeg junačkog čina. Tako treba biti. Jednog dana ćeš razumjeti..."
sensei.victory.Butcher_zone3_3 = "Ha ha! Vidi, Knez je dao petama vjetra! Kad bi samo vidio svoje lice, starče! Vidiš, tvoj novi prijatelj je kukavički lažljivac!"
sensei.victory.Butcher_zone3_4 = "Svjestan sam da čim Knez izdahne svoj posljednji dah, Šogun me neće pustiti da živim. Ja sam samo alat, zamjenjiv. Stoga ću ti pomoći."
sensei.victory.Butcher_zone3_5 = "Jedna žena je uvjerila Šoguna da prijestolje pripada njemu. Obećala mu je Sferu koja će ga učiniti velikim zapovjednikom. U zamjenu za odanost njoj."
sensei.victory.Butcher_zone3_6 = "Idi u luku. Šogun čeka dolazak broda na kojem je Sfera. Ona je jedina Kneževa šansa da povrati prijestolje."
sensei.victory.Hermit_zone2_3 = "Shvati, našem zanatu je kraj! Mora se mijenjati da bi preživio. Ja znam kako. I Šogun mi je obećao zaštitu u zamjenu za obuku njegovih ljudi."
sensei.victory.Hermit_zone2_4 = "Nedaleko odavde živi Mesar i njegova banda. Oni su vas oteli, gospodine. Idite, želim vam da pronađete svoje odgovore."
sensei.victory.NAME_BUTCHER = "MESAR"
sensei.victory.NAME_HERMIT = "PUSTINJAK"
sensei.victory.NAME_PRINCE = "KNEZ"
sensei.victory.NAME_WASP = "OSA"
sensei.victory.NAME_WIDOW = "UDOVICA"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Hvala ti! Plemenit si, malo tko bi se zauzeo za stranca. Već sam se bio pomiro sa smrću jer ti ljudi ne poznaju milost."
sensei.victory.Prince_zone1_2 = "Saznao sam nešto što nisam smio: moji vojnici se tajno uvježbavaju u zabranjenim vještinama kod nekog Pustinjaka. I htjeli su me ukloniti kao svjedoka..."
sensei.victory.Prince_zone1_3 = "Skupio sam ljude i uputio se k njemu da sve razjasnim, ali uhvatili su me. Ipak, sreća me nije napustila — uspio sam pobjeći."
sensei.victory.Prince_zone2_1 = "Mojih ljudi! Bila je greška postaviti ga za zapovjednika vojske... Ako ti je ostalo imalo časti, reci nam gdje je razbojnički logor?"
sensei.victory.Sensei_arc_outro = "Kraj."
sensei.victory.Sensei_zone1_1 = "Previše je slučajnosti. Netko je znao za vaš posjet i upozorio razbojnike. Ali što Pustinjak ima s tim? Moramo to saznati. Idemo!"
sensei.victory.Sensei_zone2_1 = "Sramota! Prodao si svoju čast do kosti! I zbog čega? Misliš li da će ljudi slijediti izdajicu? Kakav primjer daješ mladima?"
sensei.victory.Sensei_zone3_2 = "Odgovori, zašto Šogun želi njegovu smrt i što je ta magična Sfera o kojoj si govorio?!"
sensei.victory.Sensei_zone4_2 = "Moramo zaustaviti Kneza prije nego pronađe Udovicu. A s njom — i Sferu..."
sensei.victory.Sensei_zone5_1 = "Suosjećam s tobom, doista. Ali slomljeno srce je loš savjetnik. Shvati da su zbog tebe stradali ljudi."
sensei.victory.Sensei_zone6_2 = "Pričekaj! Imam toliko pitanja! Tko si? Što se nalazi iza vrata? Želim znati..."
sensei.victory.Wasp_zone4_3 = "Stani, podcijenila sam te, starče! Plaćena sam za dostavu, ali za Udovičinu čast se boriti ne moram! Pokazat ću ti gdje se krije!"
sensei.victory.Wasp_zone4_4 = "Udovica je voljela Kneza, ali on ju je odbio. Našla si novu igračku — Šoguna. Ta vražja žena koristi glupog vojskovođu da se osveti."
sensei.victory.Wasp_zone4_5 = "Udovica želi vladati muškarcima, natjerati ih da se međusobno sukobljavaju. A Sfera će njezina izabranika učiniti velikim... i potpuno joj odanim."
sensei.victory.Widow_zone5_3 = "Za mene nema povratka. Vidim da želiš pomoći, ali prekasno je — Knez je uzeo Sferu. Šogun je pokušao zaštititi je, ali bez uspjeha."
sensei.victory.Widow_zone5_4 = "Nikada nisam vidjela Kneza takvog. Oči su mu gorjele! Smatrao je zabavnim smaknuti izdajicu na mjestu našeg prvog susreta. Pokazat ću..."
sensei.victory.characterAncient = "DREVNI"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

