# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Eszembe jutott, mi történt a végén. Visszatérjünk a történetemhez?"
sensei.notify.intro = "Ez a hely felébreszt néhány emléket. Elmesélem a történetemet – egyet, ami sok-sok évvel ezelőtt történt..."
sensei.notify.more = "Eszembe jutott még valami. Visszatérjünk a történetemhez?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Nem álmodsz. Megállítottam az időt, hogy visszavigyem a Szférát az árnyak közé. A jelenléte itt hiba volt – az Árnyak Kapujának instabilitása okozta."
sensei.victory.Ancient_zone6_2 = "A változás küszöbön áll, ember. Egyelőre aludj. Mikor felébredsz, senki sem fog emlékezni a tettedre. Így kell lennie. Egy napon majd megérted..."
sensei.victory.Butcher_zone3_3 = "He-he! Nézd, ahogy a Herceg inába szállt a bátorság! Látnod kellett volna az arcod, öreg. Látod? Az új barátod egy gerinctelen hazug!"
sensei.victory.Butcher_zone3_4 = "Tudom, hogy amint a Herceg kileheli a lelkét, a Sógun engem sem hagy életben. Csak egy eszköz vagyok – feláldozható. Szóval... segítek neked."
sensei.victory.Butcher_zone3_5 = "Egy bizonyos hölgy meggyőzte a Sógunt, hogy a trón jog szerint az övé. Megígérte neki a Szférát, s hogy hatalmas hadúrrá válik – mindezt cserébe azért, hogy a vazallusa lesz."
sensei.victory.Butcher_zone3_6 = "Menj a kikötőbe. A Sógun egy hajó érkezésére vár – arra, amelyik a Szférát hozza. Ez a Herceg utolsó esélye, hogy visszaszerezze a trónját."
sensei.victory.Hermit_zone2_3 = "Próbáld megérteni – a művészetünk a végéhez közeledik! A túléléshez változnia kell. Tudom, hogyan, és Sógun védelmet ígért cserébe az emberei kiképzéséért."
sensei.victory.Hermit_zone2_4 = "Mészáros a bandájával nem messze innen tanyázik. Ők raboltak el, uram. Menj – találd meg a válaszokat, amiket keresel."
sensei.victory.NAME_BUTCHER = "HENTES"
sensei.victory.NAME_HERMIT = "REMETE"
sensei.victory.NAME_PRINCE = "HERCEG"
sensei.victory.NAME_WASP = "DARÁZS"
sensei.victory.NAME_WIDOW = "ÖZVEGY"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Köszönöm! Nemes lélek vagy – kevesen állnának ki valakiért, akit nem is ismernek. Azt hittem, közel a halál – ezek az emberek nem ismernek irgalmat."
sensei.victory.Prince_zone1_2 = "Megtudtam valami olyasmit, amit nem lett volna szabad: a katonáim tiltott tanokat tanultak egy bizonyos Remeténél. Meg akartak szabadulni tőlem, mint tanútól..."
sensei.victory.Prince_zone1_3 = "Elvittem hozzá egy egységnyi embert, hogy tisztázzuk a dolgokat, de fogságba estem. A szerencse azonban mellém állt, és sikerült elszöknöm."
sensei.victory.Prince_zone2_1 = "Az embereim! Hiba volt őt a hadseregem élére állítani... Ha maradt még bennetek akár egy pici becsület is, mondjátok meg, hol van a banditák tábora!"
sensei.victory.Sensei_arc_outro = "Vége."
sensei.victory.Sensei_zone1_1 = "Túl sok a véletlen egybeesés. Valaki tudott a látogatásunkról, és figyelmeztette a banditákat. De hogy jön a képbe a Remete? Ki kell derítenünk. Gyerünk!"
sensei.victory.Sensei_zone2_1 = "Szégyelld magad! Hogy így kiárusítsd a becsületet! És miért? Azt hiszed, az emberek követni fognak egy árulót? Jó példa ez az ifjúságnak?"
sensei.victory.Sensei_zone3_2 = "Válaszolj: miért akarja Sogun a halálát, és mi az a mágikus Gömb, amiről beszéltél?"
sensei.victory.Sensei_zone4_2 = "Megmenekíteni és megállítani kell a Herceget, mielőtt megtalálja Özvegyet... és a Gömböt..."
sensei.victory.Sensei_zone5_1 = "Együttérzek veled – őszintén. De az összetört szív rossz tanácsadó. Kérlek értsd meg: emberek szenvednek miattad."
sensei.victory.Sensei_zone6_2 = "Várj! Oly sok kérdésem van! Ki vagy te? Mi van odakint, a Kapuk mögött? Tudni akarom..."
sensei.victory.Wasp_zone4_3 = "Állj meg – alábecsültelek, öreg! Nekem a szállításért fizettek, semmi keresnivalóm nincs Özvegy becsületéért harcolni. Megmutatom a rejtekhelyét!"
sensei.victory.Wasp_zone4_4 = "Özvegy szerette a Herceget, de az visszautasította őt. Aztán talált magának egy új játékot: Sogun-t. A banya azt a bolond hadurat használja a bosszújához."
sensei.victory.Wasp_zone4_5 = "Özvegy uralkodni akar a férfiakon, és egymás ellen akarja kijátszani őket. A Gömb naggyá teszi majd a kiválasztottját... és teljesen hűségessé teszi hozzá."
sensei.victory.Widow_zone5_3 = "Számomra nincs visszaút. Látom, hogy segíteni akarsz, de már túl késő – a Herceg már elvitte a Gömböt. Sogun megpróbálta megvédeni, de hiába."
sensei.victory.Widow_zone5_4 = "Sohasem láttam még a Herceget ennyire... vadnak. Lángoltak a szemei! Úgy gondolta, vicces lenne kivégezni egy árulót azon a helyen, ahol először találkoztunk. Megmutatom neked..."
sensei.victory.characterAncient = "ŐSI"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

