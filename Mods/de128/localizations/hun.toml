uw.blackness_enter_blackness_1 = "Ivadék. Egy nagy áldozat. Egy gömb. Az elme. Mészárlás. Érzem. Vért fogsz ontani. Fájdalmat látok. Látom a jövőt. Megmutatom neked."
uw.blackness_greeting_blackness_1 = "Mi a baj, Árnyék? Nem érzed jól magad?"
uw.blackness_greeting_lazarus_2 = "Simon? Micsoda szemétláda vagy! Miért hoztál ide embereket? Megérzi a gondolataitok szagát! Tűnjetek innen, mielőtt a Feketeség megízleli az elméteket!"
uw.blackness_greeting_may_1 = "Hallod ezt? Semmi! Csend. Madárdal nélkül olyan, mintha ez a hely borostyánba fagyott volna. Helyesen cselekszünk? Nagyon rossz érzésem van…"
uw.blackness_greeting_saimon_2 = "Ezek a derék emberek a belépőid a szabadságba, kedvesem. A nagy fekete ruhás valahogy kapcsolatban áll az Obeliszkkel és a Kapukkal. Ő segít neked, te pedig segítesz neki."
uw.blackness_greetingn_saimon_1 = "Nem csoda. Mióta az ősi Kapuk egy darabja idezuhant, az élet ezen a helyen statisztikai anomália. Tartsátok nyitva a szemeteket – meg kell találnunk Lázárt."
uw.blackness_lose_blackness_1 = "Itt maradsz. Örökké. Egy vér. Mindörökké. Olvasni fogok benned. Táplálkozni fogok."
uw.blackness_win_sensei = "Hazudtál nekünk, a tudomány embere! Kit szabadítottunk ki? Mire ítéltük ezt a világot? Felfogod egyáltalán, mit tettél?!"
