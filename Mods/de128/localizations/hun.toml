# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "Sensei Története{br}1. Rész. A Szemtanú"
sensei.entry.ActScreenSensei2 = "Sensei Története{br}2. Rész. A Jövő Árnyéka"
sensei.entry.ActScreenSensei3 = "Sensei Története{br}3. Rész. A Belső Fenevad"
sensei.entry.ActScreenSensei4 = "Sensei Története{br}4. Rész. A Bosszú Története"
sensei.entry.ActScreenSensei5 = "Sensei Története{br}5. Rész. Megalázva és Meggyalázva"
sensei.entry.ActScreenSensei6 = "Sensei Története{br}6. Rész. A Szörnyeteg"
sensei.entry.ButcherYoung_Greetings = "Senki sem meri kétségbe vonni a tekintélyemet! A család ezt sosem bocsátja meg. Nem távozol élve!"
sensei.entry.Butcher_zone3_1 = "A tékozló fiú visszatér! Megfontoltad az ajánlatomat, Herceg? Elengedlek, és elárulom, hol a Szféra, te pedig arannyal fizetsz."
sensei.entry.Butcher_zone3_2 = "A csendje hangosabb a szavaknál, öreg. Én? Én őszinte vagyok magammal – elfogadom az állati természetem. Ő nem. De mi majd megtanítunk az alázatra! Gyertek, gyermekeim!"
sensei.entry.Guard1_Butcher_Sensei = "Mészáros megmutatta nekem, hogyan fedi fel a fájdalom az igazi valónkat. Most már szabad vagyok! Te is megtalálhatod a boldogságot. Ne állj ellen!"
sensei.entry.Guard1_Hermit_Sensei = "A változás küszöbön áll! Átszeltem a fél világot, hogy megtanuljam, és oly sokat áldoztam... A Mester bölcsessége mindenem!"
sensei.entry.Guard1_Lynx_Sensei = "Tetszenek a tetoválásaim? Abban az országban, ahol születtem, a legerősebbek kapják ezeket a hőstetteik emlékéül. Hamarosan te is a kép részévé válsz..."
sensei.entry.Guard1_Wasp_Sensei = "Hiszel a szerencsében? Azt hiszem, ma megcsinálom a szerencsémet azzal, hogy elveszem minden pénzed. Gondolod, hogy neked lesz szerencséd, öreg?"
sensei.entry.Guard1_Widow_Sensei = "Úrnőm olyan számomra, mintha a nővérem lenne. Érzem a fájdalmát. Megtiltotta, hogy a Herceghez érjek, így haragom rád fog lesújtani!"
sensei.entry.Guard2_Butcher_Sensei = "A meccs már a zsebben! A filozófia a lúzereknek való – én csak késekkel szeretek játszani. Akarsz velem játszani?"
sensei.entry.Guard2_Hermit_Sensei = "Mester mesélt nekünk az árnyak világáról – annak lakóiról és a hatalmas erőről, amit megoszt majd velünk. Azt hiszed, hagyom, hogy ezt mind elvedd tőlünk?"
sensei.entry.Guard2_Lynx_Sensei = "Klánunk olyan munkákat végez, amelyek még az istenek számára is túl piszkosak. Problémákat oldunk meg és mások hibáit javítjuk ki. És te – te is egyike vagy ezeknek a hibáknak."
sensei.entry.Guard2_Wasp_Sensei = "Megfenyegetted a kapitányomat? Megmentett a rabszolgaságtól, én pedig megesküdtem, hogy ledolgozom a szabadságomat. Legyenek hozzád kegyesek a szellemek..."
sensei.entry.Guard2_Widow_Sensei = "Úrnőm oly gyönyörű! Nem voltam méltó rá, hogy lássam az arcát... Most már az életem az övé. Utolsó leheletemig védeni fogom a becsületét."
sensei.entry.HermitYoung_Greetings = "A körülmények áldozata vagy, Herceg – a közjó érdekében szükséges áldozat. Az iskolám nagyságot ér el, és megkezdődik a harcművészetek aranykora!"
sensei.entry.Hermit_zone2_1 = "Két tűz közé kerültél, uram. Elismerem – elárultalak. De nem volt más választásom, az iskolám jövője forog kockán."
sensei.entry.Hermit_zone2_2 = "Hiúz, az az arrogáns kölyök, nem tudott megbirkózni a feladatával. Magamnak kell elvégeznem a munkáját. Tanítványok, sorakozó!"
sensei.entry.LynxYoung_Greetings = "Nem mehetek csak úgy el. Már fizettek nekem a Herceg életéért. Semmi személyes, öreg."
sensei.entry.Lynx_Sensei_1 = "Ne hallgass a Hercegre, öreg – csak megőrült. Hazavisszük Őfelségét, mielőtt kárt tesz magában. Nincs szükségünk a segítségedre."
sensei.entry.Lynx_Sensei_2 = "Valóban? Ahonnan én nézem, egy rémült embert látok, akit gyilkosok vesznek körül. Valami azt súgja, hogy a Herceg igazat mond. Lépjetek el tőle!"
sensei.entry.Lynx_Sensei_3 = "Csinálj, amit akarsz. Engem nem a beszédért fizetnek. Két fej több pénzt jelent. Kapjátok el őket, fiúk!"
sensei.entry.NAME_BUTCHER = "HENTES"
sensei.entry.NAME_HERMIT = "REMETE"
sensei.entry.NAME_LYNX = "HIÚZ"
sensei.entry.NAME_PRINCE = "HERCEG"
sensei.entry.NAME_SHOGUN = "SÓGUN"
sensei.entry.NAME_WASP = "DARÁZS"
sensei.entry.NAME_WIDOW = "ÖZVEGY"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Segítség! Ezek az emberek meg akarnak ölni!"
sensei.entry.Prince_zone3_1 = "Hogy merészeled beszennyezni a nevemet! Te... te nyomorult gazfickó! Visszatértem, hogy véget vessek a kegyetlen uralmadnak!"
sensei.entry.Prince_zone6_1 = "Hát itt vagy, hűséges barátom! Nézd – az igazság ismét győzedelmeskedik. Sogun a hűséges kutyám. Az elméje az enyém!"
sensei.entry.Prince_zone6_2 = "Te is, öregember? Igényt tartasz a trónomra?! Születési jogon az enyém! Senki sem veheti el tőlem!"
sensei.entry.Sensei_arc_intro1 = "Egyszer régen, sétám közben találkoztam a helyi úrral – nagy bajban volt..."
sensei.entry.Sensei_zone3_1 = "Hát ezt jelenti a „szerencse”? Megvásároltad a szabadságodat, a népedet pedig odalökted egy csapat őrültnek... Pedig olyan kedves voltam hozzád, Herceg."
sensei.entry.Sensei_zone4_1 = "Özvegy? Hát persze... azt mondta, vegyem el a Gömböt, és vigyem el Sogunnak – egyenesen a kezébe."
sensei.entry.Sensei_zone6_1 = "Herceg, állj meg! Nézz körül! A Gömb a dühödből táplálkozik, és szörnyeteggé változtat téged!"
sensei.entry.Shogun_zone6_1 = "Vézna alak! Még arra sem vagy jó, hogy az uram udvari bolondja legyél. Egyetlen csapással eltiporlak!"
sensei.entry.TITLE_PRINCE_EVIL = "KÍSÉRTETJÁRTA HERCEG"
sensei.entry.WaspYoung_Greetings = "Mit mondjak az apámnak? Hogy a lánya beijedt, és elveszített egy harcot egy öregember ellen? Ez nem fog megtörténni, amíg én vagyok a kalóztrón örököse!"
sensei.entry.Wasp_zone4_1 = "Özvegy küldött, hogy elvidd a Gömböt? Nem vagy te kicsit túl öreg az ilyen munkákhoz? Áh, mit bánom én. Szállj fedélzetre."
sensei.entry.Wasp_zone4_2 = "Az a helyzet, hogy a Gömb már nincs nálam. Özvegy emberei tegnap elvitték. Nem tudom, ki vagy, de a hazugoknak sosem bocsátok meg. Húzzátok a gerinc alatt!"
sensei.entry.WidowYoung_Greetings = "A Herceg megalázott – visszautasított, nevetett az érzéseimen. Most visszavágok! Te a barátja vagy, úgyhogy átadod neki ezt az üzenetet..."
sensei.entry.Widow_zone5_1 = "Azért jössz, hogy megalázz engem, ahogy a Herceg tette? Ti férfiak mind egyformák vagytok..."
sensei.entry.Widow_zone5_2 = "Mesélt nekem a kedvességedről, a becsületedről és a méltóságodról. De én már egyetlen férfi szavának sem hiszek. Mindegyikőtök bűnhődni fog!"
sensei.entry.Zone2_SenseiReminder = "Legutóbb meséltem neked arról, hogyan mentettem meg a Herceget a gyilkosoktól. Megtudtam, hogy Remete titokban képezte a katonáit. Úgyhogy oda mentünk."
sensei.entry.Zone3_SenseiReminder = "Remete elmondta nekünk, hogy a Herceg hadura, Sogun, elárulta urát, és fizetett egy bizonyos Hentesnek, hogy rabolja el. Itt volt az ideje meglátogatni a banditát."
sensei.entry.Zone4_SenseiReminder = "A Herceg bajait egy nő okozta! Tervet eszelt ki a megdöntésére egy mágikus Gömb segítségével – amelyet most a közeli kikötőbe szállítottak..."
sensei.entry.Zone5_SenseiReminder = "A kalózlány mesélt nekem Özvegy és a Herceg bonyolult múltjáról. A Gömböt nem szereztem meg, de megtudtam, hogy a Herceg a hegyekbe ment, hogy megtalálja Özvegyet."
sensei.entry.Zone6_SenseiReminder = "A mágikus Gömb őrületbe kergette a Herceget! Hatalmas erőt adott neki... olyan erőt, amely azzal fenyegetett, hogy mindannyiunkat elpusztít! Nem hagyhattam, hogy ez megtörténjen."
sensei.entry.characterSensei = "SENSEI"
