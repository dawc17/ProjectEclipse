uw.dlgAmericanEvent22Story_May_1 = "Teljesen átfagyott, Sensei! Nem dobhatjuk ki, amikor odakint ilyen szelek tombolnak az ajtó előtt…"
uw.dlgAmericanEvent22Story_Puma_1 = "Bajban vannak, öreg… Sosem gondoltam volna, hogy a népem múltja követni fog, de így lett. Így hát elmenekültem, hogy megvédjem őket. Kérlek, hallgass végig!"
uw.dlgAmericanEvent22Story_Puma_2 = "Ti is halljátok? Amikor gyerek voltam, egy sámán mesélt nekem egy szellemről, akinek az üvöltése felkorbácsolta a hullámokat és letépte a leveleket. Sosem gondoltam volna, hogy ez a régi mese igaznak bizonyul!"
uw.dlgAmericanEvent22Story_Puma_3 = "Erre jön, hogy az üvöltésével üldözzön minket, amíg össze nem esünk kifulladva… Csak szórakozásból! Nem tudok más helyet, ahol elrejtőzhetnénk…"
uw.dlgAmericanEvent22Story_Sensei_1 = "Hajlékom ajtaja nyitva áll minden szenvedő előtt. De váratlan egy kalózt látni ezek között a falak között… És hol van a te torokmetsző-bandád, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "A sámánok mítoszai allegóriák. Az emberek feltalálták a vitorlákat, hogy megszelídítsék a szelet, és azóta is jól szolgálja őket. Te csak egy buta tündérmese vagy, és Árnyék be fogja bizonyítani!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Én vagyok a Farkasszél! Bárki is jön elém, úgy alszik ki, mint egy gyertya! És előbb-utóbb rátok töröm az ajtót. Ez csak idő kérdése!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Üvö-üvö-üvölteni fogok, amíg a levelek be nem borítják a roncsokat. Soha senki nem találja meg ide az utat! Merész és ostoba… Hogy harcolhatnál az elemek ellen, halandó?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Micsoda szégyen… Elvetted a hatalmas hangomat! De a te hited, lány, újra életre fog kelteni engem… És nem leszek egyedül! Mert mi sokan vagyunk!"
uw.dlgArkhosGreetings = "Vak fanatikusok! Emlékeztek rám, és az Atyába vetett hitetekkel tápláltok engem. Egy szülő lehet szigorú, ti pedig hálával fogjátok fogadni a büntetésemet..."
uw.dlgArkhosLost = "Kihez fohászkodjam utolsó órámban? Ó, Teremtőm, miért hagytál el engem? Erőt adtál, hogy isteni utat mutassak nekik, de én cserbenhagytalak... ismét."
uw.dlgArkhosStory1 = "Ismerem a fajtáját. Adeptusokat gyűjtenek maguk köré, akiket hazugságokkal etetnek. Ne hallgass a tüzet szító prédikációjára, mert az a legfőbb fegyvere."
uw.dlgArkhosStory2 = "Tévedsz, öreg. Tartogatok még kemény vasat is a makacs gyermekeknek. Imádkozni fogsz hozzám, hogy befogadjalak a családba... de én kérlelhetetlen leszek."
uw.dlgArkhosWin = "Fekete bárány, méltatlan vagy a mellettem lévő helyre. Távozz! Megviszem a hírt a Teremtőnek, hogy ti, emberek, miként buktatok el újra, ő pedig táplálni fogja gyermekeimet."
uw.dlgBerstuuk_Announce = "Tiltott tudást keresve egy tehetséges tudós ötvözte a tudományt és a mágiát annak érdekében, hogy istenné váljon. És az átalakulás elkerülhetetlen! Most az erdő a rémálomszerű laboratóriuma, az emberek pedig a zsákmányai. Csak te állíthatod meg ezt a rémisztő metamorfózist! Űzd el a félelmed, és merészkedj a sűrű bozót szívébe a hamis bálvány nyomában!"
uw.dlgBerstuuk_Loose_1 = "Amikor az ajtómhoz jöttél, szavak nélkül is mindent elmondtál! Addig húzom ezt a tudást, mint egy vékony fonalat, amíg nem marad belőle semmi!"
uw.dlgBerstuuk_Story_1 = "Sly van odakint, és az istálló ajtaján kopog… Sokat láttam már az erdőben éjszaka, de ez valami új! Mi a baj vele?"
uw.dlgBerstuuk_Story_10 = "Nem eleget. A tudomány kiszámíthatatlan – csak nézz rám! Fokozatosan elfogadtam az erdőt, de az folyton visszautasított engem. Egészen mostanáig."
uw.dlgBerstuuk_Story_2 = "A segítséget kérők számára az út a megfelelő ajtóhoz vezet. De úgy tűnik, Sly eltévedt… Te vén zsivány, vigyázz a kezeidre! Mi történt?"
uw.dlgBerstuuk_Story_3 = "A zsivány segítséget keresett, és meg is találta. Irány az erdő, mielőtt elveszik azt, ami jogosan az övék. Az emberek életét!"
uw.dlgBerstuuk_Story_4 = "»Emberek«? Szegény pára sokkot kapott – nincs is arca! Mi ijesztette meg ennyire, hogy hirtelen lelkiismereti válságba került?"
uw.dlgBerstuuk_Story_5 = "Hallod a madarak énekét? Ilyenkor már csiripelniük kellene, de itt nincs más, csak síri csend… Mi más leselkedik még ebben az erdőben?"
uw.dlgBerstuuk_Story_6 = "Síri csend. Síri csend. Az embereknek segítségre van szükségük. Se-e-gítened kell. Segíts most!"
uw.dlgBerstuuk_Story_7 = "Az istenekre! Az emberek normális esetben nem változnak száraz gallyakká és mohává, akármennyire is félnek! Mi ez a dolog, és hol van az igazi Sly?!"
uw.dlgBerstuuk_Story_8 = "Valahol itt van a közelben. Sly kis elméje nagyon segítőkész volt. Mesélt nekem rólad, Árnyék – a különleges erődről. És hirtelen megvilágosodtam!"
uw.dlgBerstuuk_Story_9 = "Szóval te vagy az, akiről a lény beszélt? Az erdő eljön és mindent elragad. És hány ilyen »jogos« életet vettél már el, őrült?"
uw.dlgBerstuuk_Win_1 = "A természet utat tör magának! A harcunk többet elárult nekem, mint gondolnád, Árnyék. Az erdő emlékezni fog. Fel fog emészteni, hogy újra életre keljen…"
uw.dlgFatumGreetings = "A bátorságodnak csak a balgaságod mérhető. De tudtam, hogy eljössz, mert te vagy a végzetem, és én a tiéd. Örökre átírom a sorsotokat."
uw.dlgFatumLost = "Ismerem az emberiséget. Ugyanazon a spirálon jártok fel s alá. Láttam már ezt többször is. Önpusztítás és elsorvadás. Semmi sem változtathat ezen. Ez a sorsotok."
uw.dlgFatumStory1 = "Légy óvatos, hős. Ilyen mélyen a számodra megszokott egyetemes törvények már nem működnek..."
uw.dlgFatumStory2 = "Úgy bizony! Tartsd pórázon a fiút. Mindent tudok a sorsotokról: kik vagytok és merre tartotok. Eláruljam, ki hal meg a végén?"
uw.dlgFatumWin = "A sorsod beteljesedett. Már abban a pillanatban veszítettél, mikor átlépted lakhelyem küszöbét. Lesz elég bátorságod újraírni a történeted?"
uw.dlgFungusGreetings = "Megmérgeztétek a földet, és most a gombáim haldokolnak. El fogják nyelni az elmédet, és mindannyian eggyé válunk, ember. Ez lesz a történeted vége!"
uw.dlgFungusLost = "A testvéreim megfeledkeztek magukról az istenesdi játék közben. Az imádat lággyá teszi őket. De a pusztítás az emberiség természetében van; a világ jobb lesz nélkületek."
uw.dlgFungusWin = "Távozz! És gyönyörködj törékeny életetek utolsó perceiben!"
uw.dlgHW21LosePuppeteer_1 = "Még egy néma szerepet sem bíznék rád, Árnyék. A színpad nem a te helyed – ne hozd szégyent a mesterségemre!"
uw.dlgHW21StoryArkhos_1 = "A pestis eléri a városotokat, halandók! Hajoljatok meg istenetek hatalma előtt! És gyönyörködtessétek szemeteket az arany ragyogásában, különben…"
uw.dlgHW21StoryPuppeteer_1 = "Mit is tudnátok ti a művészetről! Tönkretettétek a legnagyobb vállalkozásomat! Mindazonáltal… jön a harmadik felvonás. És abban a hős kileheli a lelkét!"
uw.dlgHW21StorySensei_1 = "Mióta jönnek fel ide az alvilág istenei, hogy pénzt zsaroljanak ki hétköznapi emberektől? Dobd el a maszkodat, csaló, mielőtt fegyvert fogunk!"
uw.dlgHW21StorySensei_2 = "A színháznak inspirálnia kell, nem megrémisztenie. Te pedig eltorzítottad a művészet leglényegét. Megállítunk, mielőtt a »színészeidnek« bántódása esne."
uw.dlgHW21StoryThief_1 = "Várjatok! Én vagyok az… Sly! Ne üssetek meg! Azt ígérte, hogy mindenki félni fog tőlem… És senki sem fog felismerni. Hogy buktattam le magam?"
uw.dlgHW21StoryThief_2 = "A vándorszínház tulajdonosa – a Bábmester. Azt mondta, ez lesz a legjobb előadása. Istenek az emberek között! Számomra ez semmit sem jelentett. De a pénz, az már más kérdés…"
uw.dlgHW21WinPuppeteer_1 = "Ez egy fiaskó! Tönkretettétek a csodálatos cselekményemet, és összetörtétek a maszkjaimat! Hogyan állítsak most színpadra egy darabot kellékek nélkül…"
uw.dlgHW22EnterArchitect = "Ez a sok fantasy narratívátok teljesen kimerített… Mostantól az én szabályaim szerint játszunk. És a te érdeked, hogy meglepj engem, Árnyék…"
uw.dlgHW22LooseArchitect_1 = "Erre lehetett számítani. Minden mozdulatodat ismerem, Árnyék. Végül is én találtalak ki. Talán akkoriban nem voltam a formámban… De az új életed tetszeni fog."
uw.dlgHW22StoryArchitect_1 = "Ezt hívják »klisének«, Bábmester. Miért fizetik a drámaírókat? A szimbólumok számáért? A gügyögő, őrült zseni alakja éppúgy elcsépelt lett, mint a hősé…"
uw.dlgHW22StoryArchitect_2 = "Ennyi. A nulláról fogjuk újraírni a világotokat! Kortárs, kreatív, releváns! Mit szeretnek mostanában a tinédzserek? Miért nem mondasz semmit, Árnyék? Ó, igen…"
uw.dlgHW22StoryPuppeteer_1 = "Kopogtatnak – váratlan kopogtatás az ajtódon! Egy utazó jött látogatóba, vagy valami több? Érdekfeszítő, nemde?"
uw.dlgHW22StoryPuppeteer_2 = "Tudtam, hogy ezt fogod mondani, öregem. Mi mást is várhatna az ember kitalált karakterektől? A papír mindent elbír… De a közönség soha!"
uw.dlgHW22StoryPuppeteer_3 = "Csupán a színpad rabszolgája vagyok, ez minden. Új mesterművem pedig a teremtővel való találkozásról fog mesélni – a predesztináció és a szabad akarat gyötrelmeiről…"
uw.dlgHW22StorySensei_1 = "Bármit is álmodtál meg, Bábmester, nem játsszuk tovább a játékaidat. A művészet okozhat fájdalmat, de nem úgy, ahogy te műveled."
uw.dlgHW22StorySensei_2 = "Túl sokat színészkedtél, és már nem tudod megkülönböztetni a valóságot a fantáziáidtól, előadóművész… Őrült vagy."
uw.dlgHW22StorySensei_3 = "A szavaid különösek és aggasztóak, idegen… Nem tudom, milyen őrültség folyik a fejedben, de Árnyék majd kiveri belőled."
uw.dlgHW22WinArchitect_1 = "Talán a teremtmény már nem tartozik a teremtőjéhez, és önálló életre kelt… Meglepettél. Látni akarom, merre folytatódik a történet."
uw.dlgHoaxenGreetings = "Az egész életed csupán illúzió. És mi vagyunk a teremtői. Megőrjítünk téged, míg mások a nyers erőre támaszkodnak. Tűz, víz, betegségek – hah!"
uw.dlgHoaxenLost = "Hol vagy, testvérem? Nem hallom többé a hangodat! Valóban, teljesen egyedül bezárva lenni rosszabb, mint a tűz vagy a penge... Menjetek, ostobák. Az Atya vár rátok."
uw.dlgHoaxenStory1 = "„Mi”? Árny, úgy tűnik, az ellenfelünk elment az eszétől. Elnézést, de melyik személyiségeddel beszélgetünk éppen? Talán a „testvéred” ésszerűbb lenne?"
uw.dlgHoaxenStory2 = "Nevetsz rajtunk, ember? A testvérem azt javasolja, hogy a lelketeket küldjük az örök gyötrelem szakadékába... Akkor a világotok behódol, egyetlen csepp vér nélkül."
uw.dlgHoaxenWin = "Megöltelek volna, mert a kegyelmem valóban határtalan. De a testvérem kevésbé toleráns; szabadon távozhatsz, feltéve, ha nem veszíted el a józan eszed a kifelé vezető úton."
uw.dlgHunter_enter_hunter_1 = "Te! Hé, teeeee! Azért jöttél, hogy befejezd, amit elkeeazdtél, mi? Te? Van benned egy erő. Beszééél hozzám. Pszt! Különben rákééényszerítelek!"
uw.dlgHunter_greeting_may_1 = "Nézzétek! Van valami a kristály belsejében… Ennek ilyennek kell lennie?"
uw.dlgHunter_greeting_saimon_1 = "Milyen furcsa… Arra számítottam, hogy Lázár porrá zúzza az Obeliszket. Féltem a mészárlástól, de úgy tűnik, csak te és én maradtunk. Felkeltetted az érdeklődésemet."
uw.dlgHunter_greeting_saimon_2 = "A Koncentrációs Csarnok. Látod azt a kristályt középen? Az Obeliszk így halmozza fel az árnyékenergiát – hogy úgy mondjam, a sötétség szívében."
uw.dlgHunter_greeting_sensei_1 = "A csend rossz ómen, racionális barátom. Hangosabban beszélhet a legsiketítőbb szavaknál is. Hmm… Hol vagyunk? Milyen bizarr hely ez?"
uw.dlgHunter_greeting_sensei_2 = "Kétlem, kedvesem… Ez a hely másképp néz ki, mint ahogy utoljára láttam. Kezdem azt hinni, hogy az öregnek igaza volt…"
uw.dlgHunter_loose_hunter_1 = "Feküdj leeee. Itt hagylaaaaak örökkéééé. Ne okozz tööööbb kárt."
uw.dlgHunter_win_hunter_1 = "Állj meg, Árnyék-ember! Ne hagyd, hogy elterjedjeeeeen! Olyaaaan leszel, mint őőőő. Be fognak csapaaaaani! De még van esélyeeeeeed."
uw.dlgIE21AnnounceAssistant_1 = "Ki a csuda ez? Mit keresel a mi világunkban, és miért kellene egyáltalán meghallgatnunk téged?"
uw.dlgIE21AnnounceAssistant_2 = "Ha! Nem tudom, honnan jöttél, de nem maradsz itt sokáig!"
uw.dlgIE21AnnounceAssistant_3 = "Hé, Árnyék, ez a zsarnok túl messzire ment! Tanítsuk meg a jó modorra!"
uw.dlgIE21AnnounceBoss_1 = "Ti szánalmas halandók! Hajoljatok meg az akaratom és dicsőségem előtt, különben én kényszerítelek térdre benneteket!"
uw.dlgIE21AnnounceBoss_2 = "Hogy merészelsz így beszélni velem – én vagyok Rávana, a három világ meghódítója!"
uw.dlgIE21AnnounceBoss_3 = "Ez az utolsó esélyed, hogy letérdelj. Ha visszautasítod, veszem a fejed!"
uw.dlgIE21AnnounceSensei_1 = "Árnyék, egy titokzatos fenyegetés közeledtét érzékelem. Valami gonosz dolog ismét utat talált a világunkba."
uw.dlgIE21Boss_After_Loose = "Ha ezen a világon minden ember ilyen gyenge, akkor a meghódítása csak idő kérdése!"
uw.dlgIE21Boss_After_Win = "BOLONDOK! Egyelőre visszavonulok, de nem fogtok ilyen könnyen legyőzni. Még visszatérek!"
uw.dlgIndia22Story_May_1 = "És így éhezni kezdtetek… Mit akarhatott ez a démon a ti vidám ünnepléseteken? Hogyan vonzhattak szerény parasztok egy ilyen ragadozót?"
uw.dlgIndia22Story_Rakshasa_1 = "Érdekes illatod van, ember. Kétségtelenül pont olyan jóízű is lennél! Hallod, hogy korog a gyomrom? Egy válogatott hússzelet a rizsem mellé nagyon is jól jönne!"
uw.dlgIndia22Story_Rakshasa_Lose = "Szerencsédre a harcunk kimerített. Ráadásul az éhségem is csillapodott… egyelőre. Újra étvágyat csinálok magamnak, és újra vadászni fogok!"
uw.dlgIndia22Story_Sensei_1 = "Mesélj róla, utazó. A ruháidból látom, hogy messziről jöttél. Milyen baj sújtja az otthonodat?"
uw.dlgIndia22Story_Sensei_2 = "Fékezd meg az étvágyad, démon! Nem kap meghívást az élet fesztiváljára az, aki magát az életet veszi el!"
uw.dlgIndia22Story_Sensei_Win = "Nem a varázslat teszi virágzóvá a kertet, hanem a kemény munka. És ezt te magad fogod bebizonyítani: segíts a szomszédaidnak helyreállítani a farmjukat, különben…"
uw.dlgIndia22Story_Sitaram_1 = "Hallottam életed történetét. Jutalmazzanak meg az istenek érdemeid szerint! Rossz hírrel érkezem: egy gonosz szellem jelent meg a földjeimen…"
uw.dlgIndia22Story_Sitaram_2 = "Ennek a démonnak a gonoszságával csak az éhsége ér fel! Épp arra készültünk, hogy megünnepeljük a Bohag Bihut, amikor hirtelen ez a… lény megjelent, és felfalta az összes palántánkat!"
uw.dlgIndia22Story_Sitaram_3 = "Agni a tanúm, hölgyem, én is ugyanezt kérdezem magamtól! Most rettegve várjuk a naplementét… Jöjjön velem, könyörgöm!"
uw.dlgIndia24_Enter_Puppet_1 = "Megvan benned a sors irányításához szükséges szellem? Döntsd el az enyémet, hisz a művészetek alázatos szolgája vagyok. Csak a harcban érted meg igazán, mi micsoda. Légy bátor, Árnyék – támadj!"
uw.dlgIndia24_Story_Dandy_1 = "Nyissátok ki, különben betöröm ezt az átkozott ajtót! Tudom, hogy itthon vagytok – hallom! Felgyújtom ezt a viskót, ha nem adtok menedéket!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Ó, milyen hevesen ragaszkodnak a halandók az élethez. Nem én választottam ezt a munkát, és nem fogok mérges könnyeket hullatni miatta… Miért tettétek ezt velem?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "A szíve tele van szeretettel. Az istenek tisztának teremtenek minket, de mi magunk választjuk meg az utunkat. Nrityu kezdi ezt megérteni, ahogy hallgatja a lány történetét."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Árnyék, az előadásodból hiányzik a szenvedély és az elkötelezettség. Adok még egy esélyt. Ne csak eljátszd – éld is át!"
uw.dlgIndia24_Story_Puppet_1 = "Kopp-kopp! Hé, régi barátaim! A sors hangja utolért minket – és már úton is van! Vörös szegélye úgy parázslik, mint maga az élet a naplementében!"
uw.dlgIndia24_Story_Puppet_2 = "Vajon a lelkedért jött? Íme egy olyan ősi mese, mint maga a világ – Nrityu legendája, kinek sorsa az volt, hogy életek elvevője legyen."
uw.dlgIndia24_Story_Puppet_3 = "A szellemek mind csak fecsegnek. Nem bízhatsz bennük. Ráadásul nem az ő történetük. Megmutatom az igazságot az ő szemein keresztül. Árnyék, te vagy az egyetlen, aki megértheti."
uw.dlgIndia24_Story_Sensei_1 = "Ez a hang… Úgy tűnik, régi ellenfelünk ismét sántikál valamiben. Ki lesz ezúttal az áldozat? Látok egy férfit futni a pagoda felé…"
uw.dlgIndia24_Story_Sensei_2 = "A ruhádat mocsok és korom borítja, idegen. A hangnemed pedig nyugtalanít. Magyarázd meg, ki vagy, és mi járatban vagy a küszöbünkön!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Hátraarc! Én nem akartam ezt! A családom félt tőlem, és azt hittem, ez az én esélyem… Dandy megígérte, hogy magával visz, ha segítek…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "Így ni! Örök álomba szenderülsz, bár nem érdemled meg. De nem az én tisztem megítélni téged – az másnak a hivatása. Én csak kísérő vagyok."
uw.dlgIndia24_Story_Win_Puppet_4 = "Pont mint te, Árnyék. Azt akarom, hogy kövesd Nrityu útját. Neki egy örökkévalóságba telt, mire megértette a helyét."
uw.dlgIndia24_Story_Win_Puppet_6 = "Az előadás folytatódik! Te, Árnyék, leszel a sztár, az én színészeim pedig a mellékszereplőid. Nrityu története lesz a mi legnagyobb produkciónk!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Ez a történet nagyon mélyre hatol – még hozzád képest is. Meg vagyok lepve! De mi itt a tanulság? Miért mutatod ezt nekünk?"
uw.dlgMegalithGreetings = "Ez a bánya szent hely. Miért vagy itt? Távozz, és nézz szembe a végzeteddel emelt fővel! Az utolsó dolog, amit hallani fogsz, a lábad alatt megremegő föld lesz."
uw.dlgMegalithLost = "Kárhozat! Újra évezredekig kell várnom? Kontinenseket mozgattam meg! A föld megtisztítása az én feladatom volt!"
uw.dlgMegalithWin = "Kedvesen bántam az emberekkel, ami ritka tulajdonság az Örökkévalók között. Sokszor segítettem a fajotoknak. Úgyhogy fussatok, és mondjatok utolsó búcsút a szeretteiteknek!"
uw.dlgRaidIntro1 = "Úgy próbálod kijavítani a hibádat? Megnyitottad a Kapukat, de az Árnyékfertőzést csak az Örökkévalók képesek felszámolni. Mivel nem vagy közénk való, gyenge vagy."
uw.dlgRaidIntro2 = "Meghalsz, mint a többiek. Magma folyik az ereimben, és beborítja majd az egész földet, megtisztítva azt egy új élet számára."
uw.dlgRaidStory1 = "Milyen pince ez, és mit keresünk itt?"
uw.dlgRaidStory2 = "Ez az Örökkévalók birodalmának előszobája. Évezredekig szunnyadtak, de az Árnyak Kapuja veszélybe sodorta a világot. Felébredtek."
uw.dlgRaidStory3 = "Szuper – ez azt jelenti, hogy gyorsan és egyszerűen segítenek majd elintézni a Kapukat!"
uw.dlgRaidStory4 = "Ó, nem. El fogják pusztítani a Kapukat, de velük együtt a teljes emberiséget is. Számukra ez csupán a pusztítás és teremtés egy újabb ciklusa."
uw.dlgShurale_Announce = "A kapzsi banditák által felébresztett erdei szellem most az ártatlanokon áll bosszút. A lény az ellopott emlékek ládáját keresi – ősi mágiájának hordozóját. Csak azok csillapíthatják le a lény dühét, akiknek a szívében igaz bánat lakozik. Az ár azonban borsos lesz…"
uw.dlgStoryBtnFight = "HARC!"
uw.dlgStoryBtnMore = "TÖBB"
uw.dlgVolcanoGreetings = "Az Örökkévalók közül én ébredtem fel elsőként. Sok harcos jön majd, hogy elessen a kezem által, én pedig beteljesítem a küldetésem."
uw.dlgVolcanoLost = "Elég! Megadom magam. De tudd meg: felébresztetted a testvéremet. Ne tévesszen meg a külseje, mert gyors és halálos!"
uw.dlgVolcanoStory1 = "Félig lerombolt lakóhelyeket és egy hatalmas szobrot láttam. Élnek itt emberek?"
uw.dlgVolcanoStory2 = "Csak fanatikusok. Imádják az Örökkévalókat abban a reményben, hogy megkímélik őket. Valóban vakok a hitükben. Ha elbukunk, hamarosan megtanulják az igazságot."
uw.dlgVolcanoWin = "Mindig is mondtam a testvéreimnek, hogy az én kötelességem eldönteni a bolygó sorsát. Nézzétek, hitetlenek, ahogy a lángom beborítja a földet!"
uw.dlgVortexGreetings = "A sötét vizek elnyelik a földet és az Árnyak Kapuját! Titkuk elvész a mélységben. És nem marad senki a felszínen, aki elmesélhetné!"
uw.dlgVortexLost = "Ezer év óta először győz egy ember. Oly erős benned az élni akarás! De bármit is teszel, a vég ugyanaz lesz: meg fogsz halni."
uw.dlgVortexWin = "Évezredek óta figyelem a fajtádat elsorvadását. Van benne némi szépség. Úgy gondolom, életben tartalak – csak a móka kedvéért."
uw.dlgWhisperGreetings = "Úgy tűnik, valaki alig várja, hogy felfedezze a sorsát. Add a kezed, és nézz a tükörbe!"
uw.dlgWhisperLost = "Még mindig élsz? Akkor még nem állsz a hatalmamban! Fatum megjósolja a sorsodat, én pedig visszatérek a világomba – miután figyelmeztettelek, hogy óvatosan bánj a tükrökkel!"
uw.dlgWhisperWin = "Magammal viszlek a hamu, a szellemek és az örök éjszaka birodalmába! Bízz bennem – nézz a szemembe, és ne kapd el a tekintetedet."
uw.dlg_American_25_Loose_1 = "Nem tudod, kit védelmezel, Árnyék. Nem fognak köszönetet mondani. Csak gúnyolódni fognak a hátad mögött. Vadállatok… és én lennék a szörnyeteg?"
uw.dlg_American_25_Story_1 = "May eltűnt. Valami alig emberi lény vitte el. Mégsem voltak sikolyok, sem küzdelemre utaló nyomok… mintha jószántából ment volna el."
uw.dlg_American_25_Story_2 = "Nem vagyunk egyedül ebben. Mások is eltűntek, akik olyanok, mint May – fiatalok, erősek. Érezte, hogy közeleg… és teletömte a zsebeit puskaporral."
uw.dlg_American_25_Story_3 = "A nyoma világos. Meg kell találnunk, mielőtt megérkeznek az esők, különben örökre elvész. Gyere, Árnyék!"
uw.dlg_American_25_Story_4 = "Megéreztem a szagodat abban a pillanatban, ahogy a lábadat erre az elátkozott földre tetted. Miért jöttél? Hogy sárba tipord a gyászomat? Nincs benned becsület – ahogy bennük sem volt."
uw.dlg_American_25_Story_5 = "Tudtam, hogy feltűnsz, sámán. Add vissza a gyerekeket a rokonaiknak, a barátunkat pedig nekünk. Aztán menj, és rohadj meg a hamuhegyeden."
uw.dlg_American_25_Story_6 = "Porból lettél. És porrá is leszel, halandó…"
uw.dlg_American_25_Win_1 = "Várj! Önszántamból mentem vele. A külseje valóban bestiális – de a szíve emberi. És szenved… Ellopták a gyermekét!"
uw.dlg_CHN_NY25_Announce = "Merülj el egy letűnt kor hősének történetében – bogozd ki az igazságot a meséből, és segíts egy új legenda kovácsolásában! Szállj szembe egy titokzatos szektával, amely egy nagy hős nevét használja álcaként atrocitásaihoz! Térj vissza oda, ahol minden elkezdődött, és segíts egy szökevény csibésznek felfedezni valódi hősiességét!"
uw.dlg_CHN_NY25_Loose_1 = "Nem, tovább kell harcolnunk! Senki sem hinné el, hogy egy egyszerű földműves ilyen könnyedén legyőzhet egy baljós szektát. Mindent bele kell adnod!"
uw.dlg_CHN_NY25_Story_1 = "A Nap Szekta hagyománya, hogy évente egyszer ellátogat nagy hősük szülőhelyére. De minden alkalommal katasztrófának bizonyul…"
uw.dlg_CHN_NY25_Story_2 = "Embernek született? Milyen különös. Nekem úgy tűnik, ezek az emberek nem ajándékokat hoznak a faluba…"
uw.dlg_CHN_NY25_Story_3 = "Semmit sem hagynak érintetlenül! Jószágot lopnak a falusiaktól, részeg őrjöngésükben letarolják a termést, ablakokat zúznak be és kötekednek!"
uw.dlg_CHN_NY25_Story_4 = "De miért nem vágnak vissza a falusiak? Ez az ő földjük és az ő legendájuk!"
uw.dlg_CHN_NY25_Story_5 = "Megtörtek. A hős, aki reményt adott nekik, eltűnt, a szektások pedig az ő nevében követnek el gonoszságokat. Újra reményt kell adnunk nekik!"
uw.dlg_CHN_NY25_Story_6 = "Mondd, hogy azért jöttél, hogy ellenőrizd, minden készen áll-e az »ünnepre«. És mi harcolni fogunk! A városlakók látni fogják, hogy a szektával szembe lehet szállni!"
uw.dlg_CHN_NY25_Story_7 = "Nagyon jól van, legyen a te akaratod szerint… Hadd bújjak szerepbe. »Hé, fiú, hogy merészeled hősünk öltözékét viselni! Takarodj – lakomát kell készítenünk!«"
uw.dlg_CHN_NY25_Story_8 = "Lehet, hogy nem vagyok legendás hős, de a szelleme ezen a földön él! Ő fog vezetni a legsötétebb órámon, és bátorságot ad nekem! Támadás!"
uw.dlg_CHN_NY25_Win_1 = "Nem vártam ekkora gyorsaságot egy puszta embertől… Majdnem legyőzted a bajnokunkat! Példát kell statuálnunk veled, nehogy másoknak is ötletei támadjanak…"
uw.dlg_NY25_Loose_1 = "Az emlékeid élénkek, és a gyász hangosabban beszél, mint az ész. Itt maradsz velem. Pihenj egy kicsit – az álom hamarosan eljön."
uw.dlg_NY25_Story_1 = "Üdvözöllek! Ez a kunyhó egykor a családomé volt. Annyi emlék… Maradjatok, ameddig csak akartok. Itt minden megvan, amire a pihenéshez szükségetek lehet."
uw.dlg_NY25_Story_2 = "De már annyiszor sodortál minket veszélybe, és most felajánlod, hogy szálljunk meg a családi házadban? Ez valami csel?"
uw.dlg_NY25_Story_3 = "Csak a lelkiismeret hangja beszél belőlem! Ráébredtem, hogy túl sokáig használtam ki mások kedvességét. De most jót akarok tenni."
uw.dlg_NY25_Story_4 = "Nem vagyunk egyedül… Emberek gyülekeznek a kunyhó előtt. Mit akarnak ilyen későn? Hívnak minket, hogy menjünk ki."
uw.dlg_NY25_Story_5 = "Ne tegyétek! A fantomok elpusztítanak titeket! Ők csak a fájdalmas emlékek szellemei. Az erdei szellem eljött a ládájáért! Szerezzük vissza!"
uw.dlg_NY25_Story_6 = "Egy ládáért? Szóval ezért tűnnek el emberek az erdőben! Miért árultál el minket, Sly? Mindenképpen segítettünk volna ebben a nemes küldetésben!"
uw.dlg_NY25_Story_7 = "Nem érted. Ha meghallom a hangját, elveszítem az irányítást – és én is el fogok tűnni. Mindaddig, amíg egy darabot hordozok belőle magammal."
uw.dlg_NY25_Story_8 = "Nyisd ki az ajtót, nagyon fázom idekint, Apa. A ház hideg, és én nem vagyok bent. Mutatok neked egy helyet, ahol újra együtt lehetünk."
uw.dlg_NY25_Story_9 = "Állj! Ne menj az erdőbe – eltévedsz! Nem tudom, kinek a hangját hallod, de az biztosan nem emberi!"
uw.dlg_NY25_Win_1 = "Ébredj, Sly! Add vissza a ládát a szellemnek, amíg gyenge. Hadd lássa, hogy az emberiség képes felülkerekedni a saját kapzsiságán."
uw.saturn_enter_saturn_1 = "Visszanyomom a szavakat a torkodon. A barátaid pedig végignézik. A börtönömből az egyetlen út a vérpadon át vezet. Ki akar kezdeni?"
uw.saturn_greeting_saimon_1 = "Uralkodónk, a Pátriárka, éveken át tanulmányozta a portált. Aztán egy nap magába fordult. Később felállította az Obeliszket, és ez tett valamit a világunkkal…"
uw.saturn_greeting_saimon_2 = "Árnyék molekuláris szinten hasonló az Obeliszkhez. Van valaki, aki segít majd ezt felhasználni a Pátriárka ellen. Ezért vagyunk itt, a Szaturnusz kamrájában…"
uw.saturn_greeting_saimon_3 = "Ezer bocsánat, hölgyem. Mindazonáltal ki kell szabadítanunk Lázárt. Kérem, mutassa meg nekünk a celláját, és nem zavarjuk tovább."
uw.saturn_greeting_saturn_1 = "Messzire mentek, gyerekek? Szabad akaratotokból jöttetek a börtönömbe! Kíváncsi vagyok – ez bátorság vagy ostobaság? Te, az a langaléta – felelj!"
uw.saturn_greetingn_May_1 = "De mi köze ennek hozzánk?"
uw.saturn_lose_saturn_1 = "Ez elég lesz nektek. Ha Lázár ilyen selejtekkel barátkozik, mint ti, akkor nem jelent veszélyt a Pátriárkára. Tűnjetek innen, kölykök! Nem vagytok a listámon."
uw.saturn_win_saturn_1 = "Soha nem találjátok meg Lázárt. Az a zsivány megszökött a börtönömből, és a mocsarakba menekült. Ti is el akartok pusztulni? Akkor menjetek csak utána!"
uw.summerfest25_story2_1 = "Nos, nos… Olyannyira alig vártad, hogy megtalálj, úgy gondoltam, megteszem neked ezt a szívességet. Különben is, már mindenki erre a pillanatra várt."
uw.summerfest25_story2_2 = "»Mindenki«? Fejezd be a színészkedést. Pontosan tudjuk, ki vagy – és hogy hogyan használsz ki másokat, csak hogy a nyomorúságukon mulass."
uw.summerfest25_story2_3 = "Csak egy kis cameoszerep, és bumm – trendi vagyok! Őszintén szólva, nem számítottam ekkora népszerűségre."
uw.summerfest25_story2_4 = "A szellemességed nem fog megmenteni. Fizetni fogsz – a szemeimért, és minden gonoszságért, amit elkövettél. Itt véget ér a kifacsart istenjátszmád!"
uw.summerfest25_story2_5 = "Komolyan, Hermelin? Ez a fajta beszéd a kinyitható telefonokkal együtt kiment a divatból. 2026-ot írunk – próbálj haladni a korral."
uw.summerfest25_story2_6 = "Bármit is tervez az Építész… sötétség veszi körül. Egy olyan rosszindulatú erő, ami szinte tapintható."
uw.summerfest25_story2_7 = "Minden egyes szavával egyre jobban elhiszem Hermelin történetét. Az Építész veszélyes – és meg kell állítani."
uw.summerfest25_story2_defeat_1 = "Ó, nem – milyen kiábrándító! A közönség többet várt. Úgy tűnik, legközelebb egyszerűen emelnem kell a tétet."
uw.summerfest25_story2_win_1 = "Miért olyan kegyetlen a világ? Miért kell szenvednünk? Miért kellett megvakítanom magam? Válaszolj, Építész – miért fáj élni!?"
uw.tutorial_ascention_intro_title = "BÁBMESTER"
