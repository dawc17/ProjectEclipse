uw.Tenebris_greetings_1 = "A valóság peremén állsz, utazó. Ez a végső határ. Ezen a vonalon túl van az az üresség, amelyben a világok születnek. És én voltam az, aki kovácsolta a fényüket és sötétségüket!"
uw.Tenebris_greetings_2 = "Árnyék, a mögötte lévő portál lehet az esélyünk a megváltásra. Az Örökkévalók azt mondták, elpusztítják a világunkat. Talán az ő segítségével?"
uw.Tenebris_greetings_3 = "Nem fogod túlélni a portált! Ez terra incognita. A sötétség, amelyben világok teremthetők. De te nem tudsz teremteni, csak pusztítani. A portál egészben fog elnyelni téged!"
uw.Tenebris_greetings_4 = "Kockázatos, de van más választásunk? Megállíthatjuk az Örökkévalókat, ha belépünk a portálba. De akár hatalmas katasztrófát is okozhatunk."
uw.Tenebris_loses = "Félsz a sötétségben ólálkodó ismeretlentől? Most magadra maradsz, hogy egyedül nézz szembe vele! A világ porrá omlik, és újjászületik. A spirált követve."
uw.Tenebris_wins = "Makacs bolond! Ti, emberek, csak nyers erővel tudjátok megoldani a problémákat. De az univerzum nem így működik. Ennyi év után sem tanultál semmit..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Kelj fel, báb! És harcolj! Nem számít, hogy nyersz vagy veszítesz. Amikor harcolsz, engem szolgálsz!"
uw.War_AfterWin = "Imposztor! Hol van a dühöd? Hogyan harcolhatnál nélküle? Harcolj velem! Kezdjünk egy újabb pengetáncot! Tudom, hogy a háború benned él!"
uw.War_Greetings1 = "Milyen csodás nap! Érzem, hogy közeleg a csata, mint egy vihar. Mennydörgés. A lépést tartó légiók elmondhatatlan dühe. Mind ajándékok az oltáromon!"
uw.War_Greetings2 = "Düh és vérszomj forr benne. Kedvét leli a végtelen csatában, de miért? Mit fog találni a koponyákból emelt hegye tetején?"
uw.War_Greetings3 = "Hát ennyire idegen tőled a véres csata izgalma? Tűz, szenvedély, viharos erő! Mutasd meg, mit tudsz! Szórakoztass egy párbajjal, vagy halj meg!"
