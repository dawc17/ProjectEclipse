sensei.defeat.OK = "OK"
sensei.defeat.Sensei_defeat1 = "Nem, várj... Ez nem így történt... Kérlek, bocsásd meg egy öregember feledékenységét."
sensei.defeat.Sensei_defeat2 = "Szerintem ez másképp történt... Az emlékek nagyon törékenyek tudnak lenni."
sensei.defeat.Sensei_defeat3 = "Azt hiszem, a küzdelem nem így végződött. Hadd próbáljam meg felidézni..."
sensei.defeat.Sensei_defeat4 = "Az emlékeim olyan homályosak... Úgy rémlik, megnyertem azt a harcot."
sensei.defeat.Sensei_defeat5 = "Nem, nem így volt. Úgy tűnik, akkor én győztem... valószínűleg."
sensei.defeat.characterSensei = "SENSEI"
