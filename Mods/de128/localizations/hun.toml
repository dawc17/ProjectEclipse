uw.BOSS_RAVANA_Title = "Ravana"
uw.CharacterIndia24Nrityu = "NRITYU"
uw.DEMON_RAID = "PRÓBATÉTEL"
uw.DEMON_RAID_Title = "Próbatétel"
uw.EARTHQUAKE = "Időszakos földrengések."
uw.EnterPortal_ActScreen = "Portál"
uw.FRAGILITY = "Megnövekedett sebezhetőség a jelzett területen belül."
uw.Gatekeeper_greetings_1 = "Furcsa levegő? Furcsa levegő! Furrrcsa levegő!"
uw.Gatekeeper_greetings_2 = "Nem örülnek, nem örülnek, nem örülnek! Amit tettünk, amit tettünk, amit tettünk!"
uw.Gatekeeper_greetings_Assistant_1 = "Árnyék! Végre felébredtél!"
uw.Gatekeeper_greetings_Assistant_2 = "Milyen hideg van itt! Már nem érzem az ujjaimat… Hol vagyunk? A levegő olyan furcsa."
uw.Gatekeeper_greetings_Assistant_3 = "De miért érzem úgy, mintha megértene minket?"
uw.Gatekeeper_greetings_Sensei = "Hátra, May! Nem tudjuk, mit akar! A Halhatatlanok világát jobban megrázta, mint gondoltam. Amit tettünk, azután nem örülnek neki, hogy itt vagyunk."
uw.Gatekeeper_greetings_Sensei_2 = "Nyugi – ne tegyetek hirtelen mozdulatokat. Úgy tűnik, ez a lény nem túl intelligens."
uw.Gatekeeper_greetings_Sensei_3 = "Ez most nem fontos. A portálon való áthaladás a mi döntésünk volt, és felelnünk kell érte. Harcot akar – nincs más választásunk, Árnyék."
uw.Gatekeeper_lost_Saimon = "Többet vártam a portáltól… Úgy tűnik, az utazás elszívta az erődet, és a molekuláris kötéseid meggyengültek. Érdekes – el kell végeznünk még néhány tesztet."
uw.Gatekeeper_win_Saimon = "Évszázadok óta ez a rozoga portál emlékeztetett minket arra, hogy vannak erők, melyek meghaladják a megértésünket. Aztán jöttél te…"
uw.HARD_GROUND = "A földre zuhanáskor sebzést szenvedsz el."
uw.HEAD_BERSTUUK = "Berstuuk maszkja"
uw.HEALTH_DROPS = "Az életerő idővel csökken."
uw.HOT_GROUND = "Forró talaj."
uw.HW20Arkhos1 = "Nincs szükségem jövőbelátásra ahhoz, hogy lássam: a hit tüze megemészti a gyengéket és a vakokat egyaránt. Fekete gyertyákat hoztam, hogy mindenki olyan tisztán lássa ezt az igazságot, mint én!"
uw.HW20Fatum1 = "A világok közötti határok elvékonyodnak – ez a legkiválóbb éjszaka a jóslatokra! A levegő zümmög a mágiától, és a kezemben a sors fonalai tekerednek!"
uw.HW20Fatum2 = "A jóslás számomra egy játék – azt tehetem a halandók sorsával, amit csak akarok. De ti, barátaim, teljesen más tészta vagytok. Kérlek, foglaljatok helyet!"
uw.HW20Fatum3 = "A gyűlöleted megvakított téged. Kezdjük. Ne beszélj, csak figyelj! Látok egy alakot… fekete, mint az éjszaka… tollak és hamu… és kézen fog engem…"
uw.HW20Fatum4 = "Hogy… hogy kerültél ide? Az e világba vezető út le volt zárva előtted!"
uw.HW20Megalith1 = "Jóslásról és álarcosbálról beszéltél, így hoztam egy varázstükröt. Ezer év után először látom a tükörképemet. Ettől a maszktól ősinek tűnök!"
uw.HW20Whisper1 = "Jóslásosdit játszottál, húgocskám? Halandó sorsokat vettél a kezedbe? Az ilyen játékszerek mindig is csak az enyémek voltak!"
uw.HW20Whisper2 = "Le volt zárva, az igaz! De te hívtál, és ezen a csodálatos tükrön keresztül megérkeztem. Magammal viszem. Mindenképp látogass meg, és hallgass meg néhány igaz jóslatot!"
uw.Hunger_AfterLoss = "Mivel te vagy a kiválasztott, adok még egy utolsó esélyt, hogy velem maradj és lakmározz. Különben a csontjaid csatlakoznak a többiekhez a porban."
uw.Hunger_AfterWin = "Teremtő, küldtél nekem táplálékot, de nem elég. Az éhségem örökkévaló, adj nekem feloldozást..."
uw.Hunger_Greetings1 = "Hosszú utat tettél meg idáig. Miért? Hogy megmentsd a hálátlan halandókat? Fittyet hánynak rád! Érzem a magányodat, az éhségedet, és a... félelmedet."
uw.Hunger_Greetings2 = "Árny, ne hagyd magad átverni! Csak gyengének tűnik. Nem a barátja vagy, csak a prédája. Darabokra tép, ha közelebb mész!"
uw.Hunger_Greetings3 = "Látod a fivéreimet? Szomjaznak, de az ő szomjúságuk másfajta. Ők a szórakozásra vágynak. De az ő éhségük semmi az enyémhez képest!"
uw.INVERTED_JOYSTICK = "Megfordított mozgásirányítás."
uw.LIGHT_IN_THE_DARK = "Fény a sötétségben"
uw.MERCENARY_RAID = "ZSOLDOSEGYSÉG"
uw.MERCENARY_RAID_Title = "Zsoldosegység"
uw.MiniEventAnnounce = "Időtlen idők óta egy szekta lakozik a föld gyomrában, őrködve az alvilági istenek törékeny álma felett, megakadályozva az ébredésüket. De az ár egy kegyetlen rituális csata, amelyet az utolsó csepp vérig vívnak."
uw.MiniEventHungerFight_Enter_1 = "Itt a föld alatt minden más. Azért harcolunk, hogy éljünk, és a kaja az élet! Ne foszd meg a te népedet – vagy az enyémet – ettől a hatalmas örömtől!"
uw.MiniEventHungerStory_1 = "Az emberek csak akkor törődnek a szellemek szeszélyeivel, amikor a baj lesújt az otthonukra. A termésük elhervad, a gyermekeik éheznek… És hol van most a hitük?"
uw.MiniEventHungerStory_2 = "Az éhségnek van formája. A fogyasztás iránti szomja rettenetes. De ez Karcer szerepe, míg a tiéd és az enyém az, hogy megakadályozzuk, hogy felébredjen évszázados álmából."
uw.MiniEventHunger_Loss_1 = "Nem tanította meg az anyád, hogy ne hagyj semmit a tányérodon? Meg is látszik – éhség van a szemedben! Vagy… mi a baj veled?"
uw.MiniEventHunger_Win_1 = "Igen, jól ütsz, Árnyék… Ünnepeljük meg a győzelmedet egy kis kiadós kajával! Én fizetek!"
uw.MiniEventStory_1 = "Látom, Árnyék, hogy erős és állhatatos a szellemed. A tetteidről szóló legendák széles körben elterjedtek. Szeretnél egy újabbnak a részévé válni?"
uw.MiniEventStory_2 = "Az alvilág szellemei önfejűek. Szertartást végzünk, hogy lecsillapítsuk a kedélyeiket – rituális csatákat! A te részvételed megtiszteltetés lenne számunkra."
uw.MiniEventStory_EnterBattle = "Nem vagy egy kicsit beteges egy ilyen rejtélyes látványossághoz? És tényleg őt választottad? Ő lenne a legenda embere? Ó, a szellemek felháborodnak majd…"
uw.MiniEventStory_Loss_1 = "Igen, nos… Hinni akarom, hogy a szellemeknek is van humorérzéke, és csupán nevetnek majd az arénában való csetlés-botlásunkon, ahelyett, hogy ránk zúdítanák a dühüket…"
uw.MiniEventStory_Win_1 = "Nos… Senki sem jön ebbe az arénába véletlenül. Te valóban a legendák embere vagy, Árnyék."
uw.MiniEventVulkanFight_Enter_1 = "A boszorkány ok nélkül ijesztget téged. Ez sokkal egyszerűbb ennél: az acélt tűzben edzik! Az istenek csakis az erőt értik meg, mást nem. Csak az erő térítheti vissza őket álmukba! Támadás!"
uw.MiniEventVulkanStory_1 = "A tisztító tűz igazságos – legalábbis ezt mondják őseink. De ők nem tudták, hogy a Halhatatlanok mit sem törődnek az emberi erkölccsel. Ez egyszerűen az ő természetük."
uw.MiniEventVulkanStory_2 = "Érzed a hőt felemelkedni a föld alól? Egy dolgot tudnod kell: a láng senkit sem kímél, legyen az barát vagy idegen. És mi pont az útjában állunk."
uw.MiniEventVulkan_Loss_1 = "Talpra kell állnod, Árnyék! Nem érzed, hogy reng a föld?! Az istent undorítja a mi porban való csetlés-botlásunk…"
uw.MiniEventVulkan_Win_1 = "Pokoli forróság van itt… A tűzszellem elégedetten morog a boltozatában! Szép harc volt, Árnyék! Újabb napot nyertünk magunknak!"
