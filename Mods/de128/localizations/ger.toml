# BEGIN Sensei sensei.defeat.
sensei.defeat.OK = "OK"
sensei.defeat.Sensei_defeat1 = "Nein, warte ... So war es nicht ... Bitte vergib die Vergesslichkeit eines alten Mannes."
sensei.defeat.Sensei_defeat2 = "Ich glaube, es war anders ... Das Gedächtnis spielt mir oft einen Streich."
sensei.defeat.Sensei_defeat3 = "Ich glaube, das war nicht das Ende dieses Kampfes. Lass mich noch einmal nachdenken ..."
sensei.defeat.Sensei_defeat4 = "Meine Erinnerungen sind so verschwommen ... Ich glaube, ich habe diesen Kampf gewonnen."
sensei.defeat.Sensei_defeat5 = "Nein, so war es nicht. Offenbar habe ich dann gewonnen ... wahrscheinlich."
sensei.defeat.characterSensei = "SENSEI"
# END Sensei sensei.defeat.

# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "Senseis Geschichte{br}Teil 1. Der Zeuge"
sensei.entry.ActScreenSensei2 = "Senseis Geschichte{br}Teil 2. Schatten der Zukunft"
sensei.entry.ActScreenSensei3 = "Senseis Geschichte{br}Teil 3. Die innere Bestie"
sensei.entry.ActScreenSensei4 = "Senseis Geschichte{br}Teil 4. Die Geschichte der Rache"
sensei.entry.ActScreenSensei5 = "Senseis Geschichte{br}Teil 5. Gedemütigt und beleidigt"
sensei.entry.ActScreenSensei6 = "Senseis Geschichte{br}Teil 6. Das Monster"
sensei.entry.ButcherYoung_Greetings = "Niemand wagt es, meine Autorität zu bezweifeln! Die Familie vergisst das nicht. Du gehst hier nicht lebend weg!"
sensei.entry.Butcher_zone3_1 = "Der verlorene Sohn ist zurück! Hast du meinen Vorschlag überdacht, Prinz – den mit der Freilassung und dem Aufenthaltsort der Sphäre, und dass du mir dafür Gold bezahlst?"
sensei.entry.Butcher_zone3_2 = "Sein Schweigen sagt mehr als Worte, alter Mann. Ich – ich bin ehrlich zu mir selbst und akzeptiere meine bestialische Natur. Er tut das nicht. Aber wir werden dir Demut lehren! Kommt, Kinder!"
sensei.entry.Guard1_Butcher_Sensei = "Metzger zeigte mir, wie Schmerz unser wahres Ich enthüllt. Ich bin jetzt frei! Auch du kannst das Glück finden. Widersetze dich nicht!"
sensei.entry.Guard1_Hermit_Sensei = "Es steht eine Veränderung bevor! Ich habe die halbe Welt durchquert, um es zu erkennen, und so viel geopfert ... Ich habe nur die Weisheit meines Meisters!"
sensei.entry.Guard1_Lynx_Sensei = "Gefallen dir meine Tattoos? Ich wurde in einem Land geboren, in dem die Stärksten diese Souvenirs für ihre Taten erhalten. Schon bald wirst auch du auf diesem Bild zu sehen sein ..."
sensei.entry.Guard1_Wasp_Sensei = "Glaubst du an Schicksal? Ich glaube, dass ich heute ein Vermögen machen werde, indem ich dir all dein Geld abnehme. Glaubst du, dass dir das Glück hold ist, alter Mann?"
sensei.entry.Guard1_Widow_Sensei = "Meine Frau ist wie eine Schwester für mich. Ich kann ihren Schmerz fühlen. Sie verbot mir, den Prinzen anzufassen, daher wird mein Zorn auf dich fallen!"
sensei.entry.Guard2_Butcher_Sensei = "Das Spiel kommt in die Tasche! Philosophie ist etwas für Idioten – ich spiele lieber mit Messern. Willst du mit mir spielen?"
sensei.entry.Guard2_Hermit_Sensei = "Der Meister hat uns von der Welt der Schatten erzählt, von ihren Bewohnern und der bevorstehenden Macht, die er mit uns teilen wird. Glaubst du, ich werde zulassen, dass du uns das alles nimmst?"
sensei.entry.Guard2_Lynx_Sensei = "Unser Clan erledigt Aufträge, die selbst für die Götter zu schmutzig sind. Wir korrigieren Fehler und lösen Probleme. Und du bist ein solches Problem."
sensei.entry.Guard2_Wasp_Sensei = "Meinen Captain bedrohen? Sie rettete mich vor der Knechtschaft und ich schwor, meine Freiheit abzuarbeiten. Mögen die Geister gnädig mit dir sein ..."
sensei.entry.Guard2_Widow_Sensei = "Meine Frau ist so liebreizend! Ich war unwürdig, ihr Gesicht betrachten zu dürfen ... Jetzt gehört ihr mein Leben. Ich werde ihre Ehre bis zu meinem letzten Atemzug beschützen."
sensei.entry.HermitYoung_Greetings = "Du bist ein Opfer der Umstände, Prinz, ein erforderliches Opfer für das Wohl der Allgemeinheit. Meine Schule wird Großes erreichen und das goldene Zeitalter der Kampfkunst wird anbrechen!"
sensei.entry.Hermit_zone2_1 = "Du steckst in der Zwickmühle, mein Lord. Ich gebe zu, dass ich dich betrogen habe. Ich hatte allerdings keine andere Wahl, denn die Zukunft meiner Schule steht auf dem Spiel."
sensei.entry.Hermit_zone2_2 = "Lynx, dieser arrogante junge Kerl, hat seine Aufgabe nicht ausgeführt. Ich muss seine Arbeit erledigen. Schüler, vorne und in der Mitte!"
sensei.entry.LynxYoung_Greetings = "Ich kann nicht einfach gehen. Ich wurde für das Leben des Prinzen bezahlt. Das ist nichts Persönliches, alter Mann."
sensei.entry.Lynx_Sensei_1 = "Hör nicht auf den Prinzen, alter Mann, er ist verrückt geworden. Wir bringen Seine Hoheit nach Hause, ehe er sich noch verletzt. Deine Hilfe wird hier nicht benötigt."
sensei.entry.Lynx_Sensei_2 = "Wirklich? Ich sehe hier einen verängstigten Mann, der von Halsabschneidern umzingelt wurde. Ich habe das Gefühl, dass der Prinz die Wahrheit sagt. Tretet zurück!"
sensei.entry.Lynx_Sensei_3 = "Mach was du willst. Sie bezahlen mich nicht fürs Reden. Zwei Köpfe bedeuten mehr Geld. Los, Jungs!"
sensei.entry.NAME_BUTCHER = "METZGER"
sensei.entry.NAME_HERMIT = "WANDERER"
sensei.entry.NAME_LYNX = "LYNX"
sensei.entry.NAME_PRINCE = "PRINZ"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "WESPE"
sensei.entry.NAME_WIDOW = "WIDOW"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Hilfe! Diese Leute wollen mich töten!"
sensei.entry.Prince_zone3_1 = "Wie kannst du es wagen, meinen Namen zu beschmutzen! Du ... Du miserabler Schurke! Ich werde deiner grausamen Herrschaft ein Ende setzen!"
sensei.entry.Prince_zone6_1 = "Du bist hier, mein loyaler Freund! Schau – erneut triumphiert die Gerechtigkeit. Shogun ist mein treuer Hund. Sein Geist gehört mir!"
sensei.entry.Prince_zone6_2 = "Alter Mann, du willst meinen Thron ebenfalls beanspruchen?! Ich besitze ihn aufgrund meines Geburtsrechts! Niemand wird ihn mir wegnehmen!"
sensei.entry.Sensei_arc_intro1 = "Vor langer Zeit traf ich bei einem Spaziergang den Lord dieser Gegend – er war in entsetzlicher Not ..."
sensei.entry.Sensei_zone3_1 = "Das also bedeutet „Glück“? Deine Freiheit zu erkaufen und dein Volk an eine Bande Verrückter zu verfüttern ... Und ich war so nett zu dir, Prinz."
sensei.entry.Sensei_zone4_1 = "Widow? Natürlich ... Sie befahl mir, die Sphäre zu holen und sie zu Shogun zu bringen, direkt zu ihm persönlich."
sensei.entry.Sensei_zone6_1 = "Prinz, aufhören! Sieh dich um! Die Sphäre nährt sich von deinem Zorn und verwandelt dich in ein Monster!"
sensei.entry.Shogun_zone6_1 = "Schwächling! Du bist nicht einmal gut genug, um der Hofnarr meines Lord zu werden. Ich werde dich mit einem einzigen Hieb vernichten!"
sensei.entry.TITLE_PRINCE_EVIL = "VERFLUCHTER PRINZ"
sensei.entry.WaspYoung_Greetings = "Was soll ich meinem Vater sagen? Seine Tochter ist dahingeschmolzen und hat einen Kampf mit einem alten Mann verloren? Das wird nicht geschehen, solange ich die Erbin des Piratenthrons bin!"
sensei.entry.Wasp_zone4_1 = "Widow schickt dich, um die Sphäre abzuholen? Bist du nicht ein wenig zu alt für solche Aufträge? Ach, was kümmert es mich. Komm an Bord."
sensei.entry.Wasp_zone4_2 = "Es ist nur so, dass ich die Sphäre nicht mehr habe. Widows Männer haben sie gestern abgeholt. Ich weiß nicht, wer du bist, aber ich vergebe keinen Lügnern. Kielholt ihn!"
sensei.entry.WidowYoung_Greetings = "Der Prinz hat mich gedemütigt – er hat mich zurückgewiesen und meine Gefühle verspottet. Jetzt werde ich zurückschlagen! Ihr seid befreundet, daher wirst du ihm diese Nachricht überbringen ..."
sensei.entry.Widow_zone5_1 = "Kommst du, um mich zu demütigen, so wie der Prinz? Ihr Männer seid alle gleich ..."
sensei.entry.Widow_zone5_2 = "Er hat mir von deiner Güte, Würde und Ehre berichtet. Aber ich glaube kein Wort mehr, das aus dem Mund eines Mannes kommt. Ihr sollt alle leiden!"
sensei.entry.Zone2_SenseiReminder = "Das letzte Mal habe ich dir erzählt, wie ich den Prinzen vor Mördern gerettet habe. Ich habe gelernt, dass ein Wanderer heimlich seine Soldaten ausgebildet hat. Dahin ist er also gegangen."
sensei.entry.Zone3_SenseiReminder = "Der Wanderer berichtete uns, dass der Kriegslord des Prinzen, Shogun, seinen Lord verriet und einen gewissen Metzger dafür bezahlte, ihn zu entführen. Es war nun an der Zeit, dem Banditen einen Besuch abzustatten."
sensei.entry.Zone4_SenseiReminder = "Eine Frau hatte die Probleme des Prinzen zu verantworten! Sie hatte einen Plan ersonnen, ihn mithilfe einer magischen Sphäre zu stürzen, die an einem nahegelegenen Hafen geliefert wurde ..."
sensei.entry.Zone5_SenseiReminder = "Das Piratenmädchen erzählte mir von der verwickelten Geschichte mit den Prinzen. Ich erhielt die Sphäre nicht, aber ich erfuhr, dass der Prinz in die Berge ging, um Widow zu finden."
sensei.entry.Zone6_SenseiReminder = "Die magische Sphäre trieb den Prinzen in den Wahnsinn! Sie gab ihm unmittelbare Macht ... die uns alle zu vernichten drohte! Das durfte ich nicht zulassen."
