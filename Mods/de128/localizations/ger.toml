# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Ich erinnere mich, was am Ende geschah – wollen wir zu meiner Geschichte zurückkehren?"
sensei.notify.intro = "Die Stadt weckt einige Erinnerungen. Ich erzähle dir meine Geschichte, die sich vor vielen Jahren ereignete ..."
sensei.notify.more = "Ich erinnere mich noch an etwas – wollen wir zu meiner Geschichte zurückkehren?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Du träumst nicht. Ich habe die Zeit angehalten, um die Sphäre zurück in den Schatten zu bringen. Ihre Präsenz an diesem Ort war ein Fehler, verursacht durch die Instabilität der Tore der Schatten."
sensei.victory.Ancient_zone6_2 = "Es steht eine Veränderung bevor, Mensch. Aber jetzt schlafe. Wenn du erwachst, wird sich niemand an deine Heldentat erinnern. So muss es sein. Eines Tages wirst du es verstehen ..."
sensei.victory.Butcher_zone3_3 = "Hiihii! Schau dir den Prinzen an, wie er Reißaus nimmt! Du hättest sein Gesicht sehen sollen, alter Mann. Schau – dein neuer Freund ist ein feiger Lügner!"
sensei.victory.Butcher_zone3_4 = "Ich weiß, sobald der Prinz sein Leben aushaucht, wird mich Shogun umbringen. Ich bin nur ein Werkzeug – ich bin entbehrlich. Daher – werde ich dir helfen."
sensei.victory.Butcher_zone3_5 = "Eine gewisse Frau überzeugte Shogun, dass der Thron rechtmäßig ihm gehört. Sie versprach, dass er die Sphäre haben und ein großer Kriegslord werden würde. Wenn er ihr Lehnsmann würde."
sensei.victory.Butcher_zone3_6 = "Geh zum Hafen. Shogun wartet auf die Ankunft eines Schiffs, das die Sphäre bringt. Es ist die letzte Chance des Prinzen, seinen Thron zurückzuerorbern."
sensei.victory.Hermit_zone2_3 = "Versuch doch, es zu verstehen: Unsere Kunst ist am Ende! Um zu überleben, müssen wir sie verändern. Ich weiß, wie das geht. Und Shogun versprach mir Schutz, wenn ich seine Männer ausbilde."
sensei.victory.Hermit_zone2_4 = "Metzger lagert mit seiner Gang nicht weit von hier. Sie waren die Entführer, Herr. Geh – ich möchte, dass du deine Antworten findest."
sensei.victory.NAME_BUTCHER = "METZGER"
sensei.victory.NAME_HERMIT = "WANDERER"
sensei.victory.NAME_PRINCE = "PRINZ"
sensei.victory.NAME_WASP = "WESPE"
sensei.victory.NAME_WIDOW = "WIDOW"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Vielen Dank! Du bist ein edler Mensch. Nur wenige würden für jemanden einstehen, den sie nicht einmal kennen. Ich dachte, der Tod wäre gekommen, denn diese Leute kennen keine Gnade."
sensei.victory.Prince_zone1_2 = "Ich habe etwas erfahren, das ich nicht hätte wissen dürfen: Meine Soldaten studieren die geheimen Praktiken unter einem gewissen Wanderer. Sie wollten mich als Zeugen beseitigen ..."
sensei.victory.Prince_zone1_3 = "Ich ging mit einer Einheit Männer zu ihm, um die Sache klarzustellen, aber ich wurde gefangen genommen. Doch das Glück war mir gewogen und ich konnte entkommen."
sensei.victory.Prince_zone2_1 = "MEINE Männer! Es war ein Fehler, ihn zum Anführer meiner Armee zu machen ... Wenn du noch einen Funken Ehre in dir hast, dann sag mir, wo das Lager der Banditen ist!"
sensei.victory.Sensei_arc_outro = "Fortsetzung folgt ..."
sensei.victory.Sensei_zone1_1 = "Zu viele Zufälle. Jemand wusste von unserem Besuch und hat die Banditen gewarnt. Aber was hat der Wanderer damit zu tun? Das müssen wir herausfinden. Los!"
sensei.victory.Sensei_zone2_1 = "Schande über dich! Einfach so deine Ehre zu verkaufen! Und wofür? Glaubst du, dass die Menschen einem Verräter folgen werden? Ist das ein gutes Beispiel für die Jugend?"
sensei.victory.Sensei_zone3_2 = "Antworte mir, warum will Shogun ihn tot sehen, und was ist das für eine magische Sphäre, von der du sprichst?"
sensei.victory.Sensei_zone4_2 = "Wir müssen den Prinzen aufhalten, ehe er Widow findet ... und die Sphäre ..."
sensei.victory.Sensei_zone5_1 = "Ich fühle mit dir, das tue ich wirklich. Aber ein gebrochenes Herz ist ein schlechter Ratgeber. Versteh bitte, wegen dir leiden Menschen."
sensei.victory.Sensei_zone6_2 = "Warte! Ich habe so viele Fragen! Wer bist du? Was liegt hinter den Toren? Ich möchte es wissen ..."
sensei.victory.Wasp_zone4_3 = "Aufhören – ich habe dich unterschätzt, alter Mann! Ich wurde für die Lieferung bezahlt, aber ich werde nicht für Widows Ehre kämpfen. Ich werde dir ihr Versteck zeigen!"
sensei.victory.Wasp_zone4_4 = "Widow liebte den Prinzen, aber er wies sie zurück. Dann fand sie ein neues Spielzeug: Shogun. Diese Hexe benutzt den dämlichen Kriegslord für ihre Rache."
sensei.victory.Wasp_zone4_5 = "Widow will die Männer beherrschen und sie gegeneinander ausspielen. Die Sphäre soll ihren Auserwählten große Macht verleihen ... und ihr gegenüber absolut loyal machen."
sensei.victory.Widow_zone5_3 = "Für mich gibt es kein Zurück. Ich verstehe, dass du helfen willst, aber es ist zu spät – der Prinz hat die Sphäre bereits an sich genommen. Shogun wollte sie verteidigen, aber vergeblich."
sensei.victory.Widow_zone5_4 = "Ich sah den Prinzen noch nie so ... wild. In seinen Augen brannte ein Feuer! Er dachte, es wäre spaßig, einen Verräter an dem Ort zu exekutieren, an dem wir uns das erste Mal getroffen hatten. Ich werde es dir zeigen ..."
sensei.victory.characterAncient = "DER ALTE"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

