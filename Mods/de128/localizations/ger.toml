uw.BOSS_BISON_Title = "Adanti"
uw.BOSS_LAMB = "DAS LAMM"
uw.BOSS_RAVANA = "RAVANA"
uw.BOSS_RAVANA_Title = "Ravana"
uw.CharacterIndia24Nrityu = "NRITYU"
uw.DEMON_RAID = "SPIESSRUTENLAUF"
uw.DEMON_RAID_Title = "Spießrutenlauf"
uw.EARTHQUAKE = "Periodische Erdbeben"
uw.EnterPortal_ActScreen = "Portal"
uw.FRAGILITY = "Erhöhte Verletzbarkeit innerhalb des angezeigten Bereichs"
uw.Gatekeeper_greetings_1 = "Seltsame Luft? Seltsame Luft! Seeeeltsame Luft!"
uw.Gatekeeper_greetings_2 = "Nicht glücklich, nicht glücklich, nicht glücklich! Haben wir, haben wir, haben wir!"
uw.Gatekeeper_greetings_Assistant_1 = "Shadow! Du bist endlich wach!"
uw.Gatekeeper_greetings_Assistant_2 = "Es ist so kalt hier! Ich spüre meine Finger jetzt schon nicht mehr... Wo sind wir? Die Luft fühlt sich so seltsam an."
uw.Gatekeeper_greetings_Assistant_3 = "Aber warum habe ich das Gefühl, dass es uns versteht?"
uw.Gatekeeper_greetings_Sensei = "Zurück, May! Wir wissen nicht, was es will! Die Welt der Unsterblichen wurde mehr erschüttert, als ich dachte. Nach dem, was wir getan haben, sind sie nicht glücklich darüber, dass wir hier sind."
uw.Gatekeeper_greetings_Sensei_2 = "Ruhig jetzt – mach keine plötzlichen Bewegungen. Es scheint, als wäre diese Kreatur nicht sehr intelligent."
uw.Gatekeeper_greetings_Sensei_3 = "Das ist jetzt nicht wichtig. Das Portal zu durchschreiten war unsere Entscheidung und wir müssen uns dafür verantworten. Es will einen Kampf – wir haben keine Wahl, Shadow."
uw.Gatekeeper_lost_Saimon = "Ich hätte mehr von dem Portal erwartet... Es scheint, als hätte die Reise eure Kräfte geraubt und eure molekularen Bindungen sind geschwächt. Interessant – wir müssen noch ein paar Tests durchführen."
uw.Gatekeeper_win_Saimon = "Jahrhundertelang hat uns dieses wackelige Portal daran erinnert, dass es Kräfte gibt, die unser Verständnis übersteigen. Und dann seid ihr aufgetaucht..."
uw.HARD_GROUND = "Wenn du zu Boden fällst, erhältst du Schaden."
uw.HEAD_BERSTUUK = "Berstuuks Maske"
uw.HEALTH_DROPS = "Energie fällt ständig"
uw.HOT_GROUND = "Heißer Boden"
uw.HW20Arkhos1 = "Ich brauche keine Voraussicht, um zu erkennen, dass das Feuer des Glaubens sowohl die Schwachen als auch die Blinden verzehren wird. Ich habe schwarze Kerzen mitgebracht, damit alle diese Wahrheit so klar sehen können wie ich!"
uw.HW20Fatum1 = "Die Grenzen zwischen den Welten werden dünner – dies ist die beste Nacht für Prophezeiungen! Die Luft summt vor Magie und in meinen Händen liegen die Fäden des Schicksals aufgewickelt!"
uw.HW20Fatum2 = "Wahrsagen ist für mich ein Spiel – ich kann mit den Schicksalen der Sterblichen machen, was mir gefällt. Aber ihr, meine Freunde, seid eine ganz andere Sache. Bitte, setzt euch!"
uw.HW20Fatum3 = "Du wurdest von deinem Hass geblendet. Lasst uns anfangen. Sprecht nicht, sondern hört zu. Ich sehe eine Gestalt... schwarz wie die Nacht... Federn und Asche... sie nimmt mich bei der Hand..."
uw.HW20Fatum4 = "Wie... wie bist du hierhergekommen? Der Weg in diese Welt war für dich versiegelt!"
uw.HW20Megalith1 = "Du hast von Wahrsagerei und einer Maskerade gesprochen, also habe ich einen magischen Spiegel mitgebracht. Zum ersten Mal seit tausend Jahren kann ich mein Spiegelbild sehen. Durch diese Maske sehe ich uralt aus!"
uw.HW20Whisper1 = "Hast du Prophezeiung gespielt, kleine Schwester? Hast du dich der sterblichen Schicksale angenommen? Solche Spielsachen gehörten schon immer mir allein!"
uw.HW20Whisper2 = "Versiegelt war er! Aber du hast gerufen, und durch diesen wunderbaren Spiegel bin ich gekommen. Ich nehme ihn mit. Besuche mich unbedingt und lass dir wahre Schicksale vorhersagen!"
uw.Hunger_AfterLoss = "Da du der Auserrrwählte bist, werde ich dir eine letzte Chance geben, bei mir zu bleiben und zu schlemmen. Anderrrenfalls werden sich deine Knochen zu den anderen im Staub gesellen."
uw.Hunger_AfterWin = "Schöpfer, du hast mir Nahrung geschickt, aber sie reicht nicht. Mein Hunger währt ewiglich. Gewähre mir die Errettung ..."
uw.Hunger_Greetings1 = "Du bist sehr weit gereist, um an diesen Ort zu kommen. Warum? Um die undankbaren Sterrrblichen zu retten? Du bist ihnen völlig egal! Ich spüre deine Einsamkeit, deinen Hunger und deine ... Furrrcht."
uw.Hunger_Greetings2 = "Schatten, lass dich nicht zum Narren halten! Er mutet nur schwach an. Du bist nicht sein Freund, du bist nur seine Beute. Er wird dich in Stücke reißen, wenn du noch näher herangehst!"
uw.Hunger_Greetings3 = "Kannst du meine Brüder sehen? Sie haben Durrrst, aber ihr Durst ist von einer anderen Art. Sie sehnen sich nach Unterrrhaltung. Aber ihr Hunger ist nichts im Vergleich zu meinem!"
uw.INVERTED_JOYSTICK = "Umgedrehte Bewegung"
uw.LIGHT_IN_THE_DARK = "Licht in der Dunkelheit"
uw.MERCENARY_RAID = "SÖLDNER-{br}EINHEIT"
uw.MERCENARY_RAID_Title = "Söldnereinheit"
uw.MiniEventAnnounce = "Seit jeher haust ein Kult im Inneren der Erde, wacht über den empfindlichen Schlaf der Götter der Unterwelt und verhindert deren Erwachen. Aber der Preis dafür ist ein grausamer ritueller Kampf, der bis zum letzten Blutstropfen ausgetragen wird."
uw.MiniEventHungerFight_Enter_1 = "Hier unter der Erde ist alles anders. Wir kämpfen um zu leben, und Futter ist Leben! Beraube dein Volk – oder meines – nicht dieser großen Freude!"
uw.MiniEventHungerStory_1 = "Die Menschen scheren sich nur um die Launen der Geister, wenn Unheil über ihre Häuser hereinbricht. Ihre Ernte verdorrt, ihre Kinder hungern... Und wo ist ihr Glaube jetzt?"
uw.MiniEventHungerStory_2 = "Der Hunger hat eine Gestalt. Sein Durst zu verschlingen ist furchtbar. Aber das ist Karcers Rolle, während deine und meine darin besteht, ihn daran zu hindern, aus seinem jahrhundertelangen Schlaf zu erwachen."
uw.MiniEventHunger_Loss_1 = "Hat dir deine Mutter nicht beigebracht, dass man nichts auf dem Teller liegen lässt? Das merkt man – in deinen Augen ist Hunger! Oder... was ist los mit dir?"
uw.MiniEventHunger_Win_1 = "Ja, du schlägst gut zu, Shadow... Lass uns deinen Sieg mit einem herzhaften Essen feiern! Ich lade dich ein!"
uw.MiniEventStory_1 = "Ich sehe, dass du stark bist und einen unbeugsamen Geist hast, Shadow. Die Legenden deiner Taten sind weit verbreitet. Möchtest du Teil einer weiteren werden?"
uw.MiniEventStory_2 = "Die Geister der Unterwelt sind unberechenbar. Wir führen eine Zeremonie durch, um ihr Gemüt zu besänftigen – rituelle Kämpfe! Deine Teilnahme wäre uns eine Ehre."
uw.MiniEventStory_EnterBattle = "Bist du nicht ein wenig zu kränklich für ein solch arkanes Spektakel? Und ihr habt diesen hier ausgewählt, wirklich? Das ist ein legendärer Mann? Oh, die Geister werden empört sein..."
uw.MiniEventStory_Loss_1 = "Ja, nun... Ich möchte glauben, dass selbst die Geister Sinn für Humor haben und sie über unser Herumstümpern in der Arena nur lachen werden, anstatt ihre Wut an uns auszulassen..."
uw.MiniEventStory_Win_1 = "Nun... Niemand kommt durch Zufall in diese Arena. Du bist wirklich ein legendärer Mann, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "Die Hexe macht dir grundlos Angst. Es ist viel einfacher als das: Stahl wird im Feuer geschmiedet! Die Götter verstehen Macht und sonst nichts. Nur Macht allein kann sie in ihren Schlaf zurückschicken! Angriff!"
uw.MiniEventVulkanStory_1 = "Das reinigende Feuer ist gerecht – so sagen unsere Vorfahren. Aber sie wussten nicht, dass sich Unsterbliche nicht um die menschliche Moral scheren. Das ist einfach ihre Natur."
uw.MiniEventVulkanStory_2 = "Spürst du die Hitze, die aus der Erde aufsteigt? Eine Sache musst du wissen: Die Flamme verschont niemanden, ob Freund oder Fremder. Und wir stehen direkt auf ihrem Weg."
uw.MiniEventVulkan_Loss_1 = "Du musst wieder auf die Beine kommen, Shadow! Spürst du nicht das Beben der Erde?! Der Gott ist angewidert von unseren Tändeleien im Staub..."
uw.MiniEventVulkan_Win_1 = "Hier ist es so heiß wie im Höllenfeuer... Der Feuergeist knurrt zufrieden in seinem Gewölbe! Ein wirklich guter Kampf, Shadow! Wir haben uns einen weiteren Tag verdient!"
