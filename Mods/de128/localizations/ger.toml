uw.Tenebris_greetings_1 = "Du stehst am Rande der Realität, Reisender. Dies ist die letzte Grenze. Hinter dieser Linie liegt die Leere – dort entstehen Welten. Und ich habe ihr Licht und ihre Dunkelheit geschmiedet!"
uw.Tenebris_greetings_2 = "Schatten, das Portal hinter ihm ist vielleicht unsere Chance auf Erlösung. Die Unsterblichen sagten, sie würden unsere Welt vernichten. Vielleicht wollen Sie dieses Portal benutzen?"
uw.Tenebris_greetings_3 = "Du wirst das Portal nicht überleben! Es ist terra incognito. In dieser Dunkelheit können Welten erschaffen werden. Aber du kannst nicht erschaffen, nur zerstören. Das Portal wird dich einfach verschlingen!"
uw.Tenebris_greetings_4 = "Es besteht ein Risiko, aber bleibt uns eine andere Wahl? Wenn wir das Portal betreten, können wir die Unsterblichen vielleicht aufhalten. Aber wir können damit auch eine unglaubliche Katastrophe beschwören."
uw.Tenebris_loses = "Fürchtest du dich vor dem Unbekannten, das in der Dunkelheit lauert? Nun musst du dich ihm alleine stellen! Die Welt zerfällt zu Staub und wird wiedergeboren. Dem Kreislauf gemäß."
uw.Tenebris_wins = "Sturer Idiot! Ihr Menschen löst Probleme immer nur mit roher Gewalt. Aber so funktioniert das Universum nicht. All die Jahre hast du nicht dazugelernt ..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Erhebe dich, Marionette! Und kämpfe! Es ist egal, ob du gewinnst oder verlierst. Wenn du kämpfst, dienst du mir!"
uw.War_AfterWin = "Betrüger! Wo ist die Wut? Kann man ohne sie kämpfen? Kämpfe gegen mich! Vollführen wir einen weiteren Klingentanz! Ich weiß, in dir lebt der Krieg!"
uw.War_Greetings1 = "Ein toller Tag! Ich spüre die kommende Schlacht – wie ein Sturm. Donner. Die ungeahnte Wut marschierender Legionen. Ein Geschenk auf meinem Altar!"
uw.War_Greetings2 = "Wut und Blutdurst kochen in ihr. Sie erfreut sich am endlosen Kampf, aber wozu? Was wird sie auf ihrem Schädelberg finden?"
uw.War_Greetings3 = "Ist dir der Nervenkitzel der blutigen Schlacht so fremd? Feuer, Leidenschaft, Kraft! Beweise dein Können! Unterhalte mich im Einzelkampf oder stirb!"
uw.ZONE_RAID = "Unterwelt: Stufe 1"
uw.ZONE_RAID1 = "Unterwelt: Stufe 2"
uw.ZONE_RAID2 = "Unterwelt: Stufe 3"
uw.ZONE_RAID3 = "Unterwelt: Stufe 4"
