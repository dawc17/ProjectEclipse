uw.dlgAmericanEvent22Story_May_1 = "Sie ist völlig durchgefroren, Sensei! Wir können sie nicht hinauswerfen, wenn solche Winde vor der Tür wüten..."
uw.dlgAmericanEvent22Story_Puma_1 = "In Schwierigkeiten, alter Mann... Ich hätte nie gedacht, dass die Vergangenheit meines Volkes mich verfolgen würde, aber das tut sie. Also bin ich geflohen, um sie zu beschützen. Bitte hör mir zu!"
uw.dlgAmericanEvent22Story_Puma_2 = "Könnt ihr das auch hören? Als ich ein Kind war, erzählte mir ein Schamane von einem Geist, dessen Heulen die Wellen aufpeitschte und die Blätter abriss. Ich hätte nie gedacht, dass sich dieses alte Märchen als wahr erweisen würde!"
uw.dlgAmericanEvent22Story_Puma_3 = "Er kommt hierher, um uns mit seinem Schrei zu jagen, bis wir atemlos zusammenbrechen... Nur zum Spaß! Ich weiß nicht, wo ich mich sonst verstecken soll..."
uw.dlgAmericanEvent22Story_Sensei_1 = "Die Türen meines Hauses stehen jedem offen, der leidet. Aber es kommt unerwartet, eine Piratin in diesen Mauern zu sehen... Und wo ist deine Bande von Halsabschneidern, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Die Mythen der Schamanen sind Allegorien. Die Menschen haben Segel erfunden, um den Wind zu zähmen, und seitdem hat er ihnen gute Dienste geleistet. Du bist nur ein dummes Märchen, und Shadow wird das beweisen!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Ich bin der Wolfswind! Wer auch immer mir entgegenkommt, wird wie eine Kerze ausgeblasen! Und früher oder später werde ich eure Tür eintreten. Es ist nur eine Frage der Zeit!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Ich werde heuuuulen, bis die Blätter die Trümmer bedecken. Niemand wird je den Weg hierher finden! Kühn und töricht... Wie kannst du gegen die Elemente ankämpfen, Sterblicher?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Welche Schande... Du hast mir meine mächtige Stimme genommen! Aber dein Glaube, Mädchen, wird mich wieder zum Leben erwecken... Und ich werde nicht allein kommen! Denn wir sind viele!"
uw.dlgArkhosGreetings = "Blinde Fanatiker! Ihr erinnert euch an mich und füttert mich mit dem Glauben an den Vater. Eltern können streng sein und du wirst meine Bestrafung mit Freuden hinnehmen..."
uw.dlgArkhosLost = "Wem soll ich huldigen in der letzten Stunde? Oh Schöpfer, warum hast du mich verlassen? Du gabst mir die Macht, sie zu führen, doch habe ich dich enttäuscht...mal wieder."
uw.dlgArkhosStory1 = "Ich kenne solche Leute. Sie umgeben sich mit Anhängern, die sie mit ihren Lügen füttern. Höre nicht auf seine feurigen Predigten, denn diese sind seine stärkste Waffe."
uw.dlgArkhosStory2 = "Du hast Unrecht, alter Mann. Ich habe auch Eisen als Mittel für ungehorsame Kinder. Du wirst mich noch anflehen, der Familie beitreten zu dürfen...aber ich werde keine Barmherzigkeit kennen. "
uw.dlgArkhosWin = "Du schwarzes Schaf bist unwürdig eines Platzes an meiner Seite. Hinfort! Gesandt wird ein Wort an den Schöpfer und wie ihr Menschen wieder versagt habt, auf dass er meine Kinder wieder füttere..."
uw.dlgBerstuuk_Announce = "Auf der Suche nach verbotenem Wissen hat ein begabter Wissenschaftler Wissenschaft und Magie in seinem Bestreben, ein Gott zu werden, miteinander verschmolzen. Und die Transformation ist unausweichlich! Nun ist der Wald sein albtraumhaftes Labor und Menschen sind seine Beute. Nur du kannst diese furchterregende Metamorphose aufhalten! Verbanne deine Angst und wage dich ins Herz des Dickichts auf der Suche nach dem falschen Götzen!"
uw.dlgBerstuuk_Loose_1 = "Als du an meine Tür kamst, hast du mir alles ohne Worte erzählt! Ich werde an diesem Wissen wie an einem dünnen Faden ziehen, bis nichts mehr übrig ist!"
uw.dlgBerstuuk_Story_1 = "Sly ist draußen und klopft an die Scheunentür... Ich habe nachts schon vieles im Wald gesehen, aber das ist etwas Neues! Was ist los mit ihm?"
uw.dlgBerstuuk_Story_10 = "Nicht genug. Die Wissenschaft ist unberechenbar – sieh mich nur an! Nach und nach habe ich den Wald akzeptiert, aber er weigerte sich beharrlich, mich zu akzeptieren. Bis jetzt."
uw.dlgBerstuuk_Story_2 = "Für diejenigen, die Hilfe suchen, führt der Weg zur richtigen Tür. Aber Sly scheint sich verirrt zu haben... Du alter Schurke, pass auf deine Hände auf! Was ist passiert?"
uw.dlgBerstuuk_Story_3 = "Der Schurke hat nach Hilfe gesucht und sie gefunden. Lass uns in den Wald gehen, bevor er sich nimmt, was rechtmäßig ihnen gehört. Das Leben der Menschen!"
uw.dlgBerstuuk_Story_4 = "‚Menschen‘? Der arme Kerl steht unter Schock – er hat kein Gesicht! Was hat ihn so sehr erschreckt, dass ihn eine plötzliche Gewissenskrise heimgesucht hat?"
uw.dlgBerstuuk_Story_5 = "Kannst du die Vögel singen hören? Um diese Uhrzeit sollten sie bereits zwitschern, aber hier herrscht nichts als Totenstille... Was lauert sonst noch in diesem Wald?"
uw.dlgBerstuuk_Story_6 = "Totenstille. Totenstille. Die Menschen brauchen Hilfe. Du musst h-e-l-f-e-n. Hilf jetzt!"
uw.dlgBerstuuk_Story_7 = "Bei den Göttern! Menschen verwandeln sich normalerweise nicht in trockene Zweige und Moos, ganz gleich, wie viel Angst sie haben! Was ist das für ein Ding, und wo ist der echte Sly?!"
uw.dlgBerstuuk_Story_8 = "Er ist hier irgendwo in der Nähe. Slys kleiner Verstand war sehr hilfreich. Er hat mir von dir erzählt, Shadow – von deiner besonderen Kraft. Und da ist es mir klar geworden!"
uw.dlgBerstuuk_Story_9 = "Du bist also derjenige, von dem die Kreatur gesprochen hat? Der Wald wird kommen und es sich holen. Und wie viele dieser ‚rechtmäßigen‘ Leben hast du dir genommen, Wahnsinniger?"
uw.dlgBerstuuk_Win_1 = "Die Natur findet immer einen Weg! Unser Kampf hat mir mehr verraten, als du ahnst, Shadow. Der Wald wird sich erinnern. Er wird mich verschlingen, um wieder aufzuerstehen..."
uw.dlgFatumGreetings = "Dein Mut wird nur durch deine Torheit übertroffen.{br}Jedoch wusste ich von eurem Kommen, du ihr meine Bestimmung seid und ich eure. Ich werde euer Schicksal auf ewig umschreiben."
uw.dlgFatumLost = "Ich kenne die Menschheit. Ihr lauft ständig im Kreis. Ich habe das schon mehrmals beobachtet. Selbstzerstörung und Vernichtung. Nichts kann dies ändern. Dies ist euer Schicksal."
uw.dlgFatumStory1 = "Vorsichtig, mein Held. Die dir gewohnten universellen Gesetze verlieren hier unten ihre Wirkung..."
uw.dlgFatumStory2 = "Du hast recht! Halte den Jungen an der Leine. Ich weiss alles über euer Schicksal: Wer ihr seid und wohin ihr geht. Wollt ihr erfahren, wer am Ende stirbt?"
uw.dlgFatumWin = "Dein Schicksal ist besiegelt. Du hast bereits verloren in dem Moment als du einen Fuß über meine Türschwelle gesetzt hast. Hast du genug Mut in dir um deine Geschichte umzuschreiben?"
uw.dlgFungusGreetings = "Ihr habt das Land vergiftet und nun sterben meine Pilze. Sie werden euren Verstand absorbieren und wir werden alle eins, Menschen. Dies wird das Ende eurer Geschichte sein!"
uw.dlgFungusLost = "Meine Brüder haben wohl zu viel Gott gespielt. Der Glaube macht sie schwach. Doch Zerstörung ist in der Natur der Menschen, die Welt ist besser dran ohne euch."
uw.dlgFungusWin = "Verschwindet! Und geniesst die letzten Minuten eures Lebens!"
uw.dlgHW21LosePuppeteer_1 = "Ich würde dir nicht einmal eine stumme Rolle anvertrauen, Shadow. Die Bühne ist nicht der Ort, an den du gehörst – entehre mein Handwerk nicht!"
uw.dlgHW21StoryArkhos_1 = "Die Pest kommt in eure Stadt, Sterbliche! Verbeugt euch vor der Macht eures Gottes! Und erfreut eure Augen am Glanz des Goldes, oder sonst..."
uw.dlgHW21StoryPuppeteer_1 = "Was wisst ihr schon von Kunst! Ihr habt mein größtes Unterfangen ruiniert! Wie dem auch sei... der dritte Akt steht an. Und darin haucht der Held sein Leben aus!"
uw.dlgHW21StorySensei_1 = "Seit wann kommen die Götter der Unterwelt hier herauf, um von einfachen Leuten Geld zu erpressen? Wirf deine Maske ab, Betrüger, bevor wir zu den Waffen greifen!"
uw.dlgHW21StorySensei_2 = "Theater sollte inspirieren, nicht entsetzen. Und du hast die wahre Essenz der Kunst verdreht. Wir werden dich aufhalten, bevor deine ‚Schauspieler‘ zu Schaden kommen."
uw.dlgHW21StoryThief_1 = "Wartet! Ich bin es... Sly! Schlagt mich nicht! Er hatte versprochen, dass mich jeder fürchten würde... Und dass mich niemand erkennen würde. Wie habe ich mich verraten?"
uw.dlgHW21StoryThief_2 = "Der Besitzer des Wandertheaters – der Puppenspieler. Er sagte, es würde seine beste Vorstellung werden. Götter unter den Menschen! Das hat mir nichts bedeutet. Aber das Geld hingegen..."
uw.dlgHW21WinPuppeteer_1 = "Das ist ein Fiasko! Du hast meine wunderbare Handlung ruiniert und meine Masken zerbrochen! Wie soll ich jetzt ein Stück ohne Requisiten inszenieren..."
uw.dlgHW22EnterArchitect = "All diese eure Fantasy-Erzählung hat mich erschöpft... Jetzt werden wir nach meinen Regeln spielen. Und es ist in deinem Interesse, mich zu überraschen, Shadow..."
uw.dlgHW22LooseArchitect_1 = "Das war zu erwarten. Ich kenne alle deine Bewegungen, Shadow. Schließlich war ich es, der dich erfunden hat. Vielleicht hatte ich damals nicht meinen besten Tag... Aber jetzt wird dir dein neues Leben gefallen."
uw.dlgHW22StoryArchitect_1 = "Das nennt man ein ‚Klischee‘, Puppenspieler. Wofür werden Dramatiker bezahlt? Für die Anzahl der Symbole? Die Figur des plappernden, verrückten Genies ist abgedroschen, genau wie die Figur des Helden..."
uw.dlgHW22StoryArchitect_2 = "Das ist es. Wir werden eure Welt von Grund auf neu schreiben! Zeitgemäß, kreativ, relevant! Worauf stehen die Teenager heutzutage? Warum sagst du nichts, Shadow? Oh, ja..."
uw.dlgHW22StoryPuppeteer_1 = "Es klopft – ein unerwartetes Klopfen an deiner Tür! Ist das ein Reisender, der zu Besuch kommt, oder etwas mehr? Faszinierend, nicht wahr?"
uw.dlgHW22StoryPuppeteer_2 = "Ich wusste, dass du das sagen würdest, alter Mann. Was kann man von erfundenen Charakteren auch anderes erwarten? Papier ist geduldig... Aber das Publikum wird es nie sein!"
uw.dlgHW22StoryPuppeteer_3 = "Ich bin nur ein Sklave der Bühne, mehr nicht. Und mein neues Meisterwerk wird von einer Begegnung mit dem Schöpfer erzählen – von den Qualen der Vorherbestimmung und des freien Willens..."
uw.dlgHW22StorySensei_1 = "Was auch immer du dir ausgedacht hast, Puppenspieler, wir werden deine Spiele nicht länger mitspielen. Kunst mag Schmerz verursachen, aber nicht auf die Art und Weise, wie du sie praktizierst."
uw.dlgHW22StorySensei_2 = "Du hast zu viel geschauspielert und kannst die Realität nicht mehr von deinen Fantasien unterscheiden, Künstler... Du bist verrückt."
uw.dlgHW22StorySensei_3 = "Deine Worte sind merkwürdig und besorgniserregend, Fremder... Ich weiß nicht, welcher Wahnsinn in deinem Kopf vor sich geht, aber Shadow wird ihn aus dir herausprügeln."
uw.dlgHW22WinArchitect_1 = "Vielleicht gehört die Schöpfung nicht mehr ihrem Schöpfer und hat ein Eigenleben entwickelt... Du hast mich überrascht. Ich möchte sehen, wohin die Geschichte als Nächstes führt."
uw.dlgHoaxenGreetings = "Dein ganzes Leben ist lediglich eine Illusion. Und wir sind die Schöpfer. Wir rauben euch den Verstand während andere es mit roher Gewalt versuchen. Feuer, Wasser, Krankheiten - ha!"
uw.dlgHoaxenLost = "Wo bist du, Bruder? Ich kann deine Stimme nicht mehr hören! Wahrlich, einsam eingesperrt zu sein ist schlimmer als jegliches Feuer oder Schwert...Verzieht euch, Dümmlinge. Der Vater wartet."
uw.dlgHoaxenStory1 = "\"Wir?\" Shadow, ich glaube unser Freund hier hat einen Vogel. Entschuldige, mit welcher deiner Persönlichkeiten sprechen wir gerade? Vielleicht könnte dein \"Bruder\" ein wenig vernünftiger sein?"
uw.dlgHoaxenStory2 = "Du lachst über uns, Menschlicher? Mein Bruder rät mir eure Seelen in die ewigen Abgründe der Verdammnis zu schicken...Dann wird sich eure Welt ergeben ohne auch nur einen Tropfen Blut zu vergiessen."
uw.dlgHoaxenWin = "Ich hätte dich getötet, doch meine Barmherzigkeit kennt keine Grenzen. Doch mein Bruder hat weniger Geduld. Es steht dir frei zu gehen, stolpere jedoch nicht über deine Füsse auf dem Weg nach draussen."
uw.dlgHunter_enter_hunter_1 = "Du! Hey, duuuu! Bist du gekommen, um zu beenden, was du aaaangefangen hast, hm? Du? Es steckt eine Kraft in dir. Sie ssspriiicht zu mir. Ruhe! Oder ich weeeerde dich dazu zwingen!"
uw.dlgHunter_greeting_may_1 = "Seht mal! Da ist etwas in dem Kristall... Soll das so sein?"
uw.dlgHunter_greeting_saimon_1 = "Wie seltsam... Ich hatte erwartet, dass Lazarus den Obelisken zu Staub zermahlt. Ich fürchtete das Gemetzel, aber es scheint, als wären nur du und ich übrig geblieben. Ich bin fasziniert."
uw.dlgHunter_greeting_saimon_2 = "Die Konzentrationshalle. Siehst du den Kristall in der Mitte? So sammelt der Obelisk Schattenenergie an – das Herz der Finsternis, sozusagen."
uw.dlgHunter_greeting_sensei_1 = "Stille ist ein schlechtes Omen, mein rationaler Freund. Sie kann lauter sprechen als die ohrenbetäubendsten Worte. Hmm... Wo sind wir? Was ist das für ein bizarrer Ort?"
uw.dlgHunter_greeting_sensei_2 = "Das bezweifle ich, meine Liebe... Dieser Ort sieht anders aus als bei meinem letzten Besuch. Ich beginne zu glauben, dass der alte Mann recht hatte..."
uw.dlgHunter_loose_hunter_1 = "Leg diiiich hin. Ich werde dich für iiiimmmmer hier laaaassen. Richte keeeinen weiteren Schaden mehr an."
uw.dlgHunter_win_hunter_1 = "Halt, Shadow-Mensch! Lass es sich nicht auuuusssbreeeiten! Du wiiiirst wie eeeeeeer sein. Du wiiiirst getäääääuscht werden! Aber du hast noch eine Chaaaaannnnce."
uw.dlgIE21AnnounceAssistant_1 = "Wer in aller Welt ist das? Was machst du in unserer Welt, und warum sollten wir dir überhaupt zuhören?"
uw.dlgIE21AnnounceAssistant_2 = "Ha! Ich weiß nicht, wo du herkommst, aber du wirst nicht lange hier bleiben!"
uw.dlgIE21AnnounceAssistant_3 = "Hey Shadow, dieser Schläger ist zu weit gegangen! Lass uns ihm ein paar Manieren beibringen!"
uw.dlgIE21AnnounceBoss_1 = "Ihr erbärmlichen Sterblichen! Verbeugt euch vor meinem Willen und meiner Herrlichkeit, oder ich werde euch in die Knie zwingen!"
uw.dlgIE21AnnounceBoss_2 = "Wie wagst du es, so mit mir zu sprechen – ich bin Ravana, der Eroberer aller drei Welten!"
uw.dlgIE21AnnounceBoss_3 = "Das ist eure letzte Chance, niederzuknien. Weigert euch, und ich nehme mir euren Kopf!"
uw.dlgIE21AnnounceSensei_1 = "Shadow, ich spüre, wie sich eine mysteriöse Bedrohung nähert. Etwas Böses hat sich wieder einmal den Weg in unsere Welt gebahnt."
uw.dlgIE21Boss_After_Loose = "Wenn alle Menschen dieser Welt so schwach sind, dann ist ihre Eroberung nur eine Frage der Zeit!"
uw.dlgIE21Boss_After_Win = "NARREN! Ich ziehe mich für den Moment zurück, aber ihr werdet mich nicht so leicht besiegen. Ich werde wiederkommen!"
uw.dlgIndia22Story_May_1 = "Und so habt ihr angefangen zu hungern... Was konnte dieser Dämon bei eurem freudigen Fest gewollt haben? Wie konnten einfache Bauern ein solches Raubtier anlocken?"
uw.dlgIndia22Story_Rakshasa_1 = "Du hast einen interessanten Geruch, Mensch. Zweifellos würdest du genauso gut schmecken! Hörst du meinen Magen knurren? Ein feines Stück Fleisch zu meinem Reis wäre mir sehr willkommen!"
uw.dlgIndia22Story_Rakshasa_Lose = "Zum Glück für dich hat mich unser Kampf erschöpft. Außerdem ist mein Hunger gestillt... fürs Erste. Ich werde mir neuen Appetit holen und wieder auf die Jagd gehen!"
uw.dlgIndia22Story_Sensei_1 = "Erzähle mir von ihm, Reisender. An deiner Kleidung sehe ich, dass du weit gereist bist. Welche Not plagt deine Heimat?"
uw.dlgIndia22Story_Sensei_2 = "Zügle deinen Appetit, Dämon! Es wird keine Einladung zum Fest des Lebens für jemanden geben, der das Leben selbst stiehlt!"
uw.dlgIndia22Story_Sensei_Win = "Es ist keine Magie, die einen Garten zum Blühen bringt – es ist harte Arbeit. Und das wirst du selbst beweisen: Hilf deinen Nachbarn, ihre Farm wieder aufzubauen, oder sonst..."
uw.dlgIndia22Story_Sitaram_1 = "Ich habe deine Lebensgeschichte gehört. Mögen die Götter dich nach deinen Verdiensten belohnen! Ich überbringe schlechte Nachrichten: Ein böser Geist ist in meinem Land erschienen..."
uw.dlgIndia22Story_Sitaram_2 = "Die Bösartigkeit dieses Dämons wird nur von seinem Hunger übertroffen! Wir bereiteten uns darauf vor, Bohag Bihu zu feiern, als plötzlich diese... Kreatur auftauchte und all unsere Setzlinge verschlang!"
uw.dlgIndia22Story_Sitaram_3 = "Agni ist mein Zeuge, meine Dame, ich frage mich dasselbe! Jetzt warten wir in Angst auf den Sonnenuntergang... Kommt mit mir, ich flehe euch an!"
uw.dlgIndia24_Enter_Puppet_1 = "Hast du den nötigen Geist, um das Schicksal zu lenken? Entscheide über meines, als demütiger Diener der Künste, der ich bin. Nur im Kampf versteht man wirklich, was Sache ist. Sei mutig, Shadow – greif an!"
uw.dlgIndia24_Story_Dandy_1 = "Macht auf, oder ich breche diese verdammte Tür ein! Ich weiß, dass ihr zu Hause seid – ich kann euch hören! Ich werde diese Hütte in Brand stecken, wenn ihr mir keinen Unterschlupf gewährt!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Oh, wie heftig Sterbliche doch am Leben klammern. Nicht ich habe mir diese Arbeit ausgesucht, und ich werde keine giftigen Tränen darüber vergießen... Warum habt ihr mir das angetan?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Ihr Herz ist erfüllt von Liebe. Die Götter erschaffen uns rein, aber wir wählen unseren eigenen Weg. Nrityu beginnt das zu verstehen, während sie der Geschichte des Mädchens lauscht."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, deiner Vorstellung fehlt es an Leidenschaft und Hingabe. Ich werde dir noch eine Chance geben. Spiel es nicht – lebe es!"
uw.dlgIndia24_Story_Puppet_1 = "Klopf, klopf! Hey, alte Freunde! Die Stimme des Schicksals ist über uns gekommen – und sie ist auf dem Weg! Ihr roter Saum glimmt wie das Leben selbst in der Abenddämmerung!"
uw.dlgIndia24_Story_Puppet_2 = "Ist sie wegen deiner Seele gekommen? Sieh hier eine Geschichte, so alt wie die Welt selbst – die Legende von Nrityu, deren Schicksal es war, Leben zu nehmen."
uw.dlgIndia24_Story_Puppet_3 = "Die Geister plappern alle durcheinander. Man kann ihnen nicht trauen. Und außerdem ist es nicht ihre Geschichte, die sie erzählen können. Ich werde euch die Wahrheit durch ihre Augen zeigen. Shadow, du bist der Einzige, der es verstehen kann."
uw.dlgIndia24_Story_Sensei_1 = "Diese Stimme... Es scheint, unser alter Widersacher heckt schon wieder etwas aus. Wer wird dieses Mal das Opfer sein? Ich sehe einen Mann, der auf die Pagode zurennt..."
uw.dlgIndia24_Story_Sensei_2 = "Deine Kleidung ist voller Schmutz und Ruß, Fremder. Und dein Tonfall beunruhigt mich. Erkläre, wer du bist und was du an unserer Türschwelle zu suchen hast!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Zurück! Ich wollte das nicht! Meine Familie hatte Angst vor mir und ich dachte, das sei meine Chance... Dandy versprach, mich mitzunehmen, wenn ich nur helfen würde..."
uw.dlgIndia24_Story_Win_Nrityu_1 = "Da! Du fällst in einen ewigen Schlaf, obwohl du ihn nicht verdienst. Aber es steht mir nicht zu, über dich zu urteilen – das ist die Berufung eines anderen. Ich bin nur die Begleitung."
uw.dlgIndia24_Story_Win_Puppet_4 = "Genau wie du, Shadow. Ich möchte, dass du Nrityus Weg folgst. Sie hat eine Ewigkeit gebraucht, um ihren Platz zu verstehen."
uw.dlgIndia24_Story_Win_Puppet_6 = "Die Show geht weiter! Du, Shadow, wirst der Star sein, und meine Schauspieler werden deine Nebendarsteller sein. Die Geschichte von Nrityu wird unsere größte Produktion!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Diese Geschichte geht tief – selbst für dich. Ich bin überrascht! Aber was ist die Moral von der Geschicht’? Warum zeigst du uns das?"
uw.dlgMegalithGreetings = "Diese Mine ist ein heiliger Ort. Warum bist du hier? Verschwinde und triff auf dein Schicksal mit Ehre. Das Letzte was du hören wirst, wird die bebende Erde unter deinen Füßen sein."
uw.dlgMegalithLost = "Verdammt! Muss ich wieder Tausend Jahre warten?! Ich habe Kontinente bewegt! ICH sollte die Erde reinigen!"
uw.dlgMegalithWin = "Ich mag Menschen. Unter Unsterblichen ist das eine Seltenheit. Es gab Zeiten, da half ich euresgleichen. Darum lauft, so lange ich euch die Möglichkeit gebe, euch von euren Nächsten zu verabschieden."
uw.dlgRaidIntro1 = "Willst du deinen Fehler wiedergutmachen? Du öffnetest die Tore, doch nur die Unsterblichen können die Schattenplage eliminieren. Du bist schwach, und somit keiner von uns."
uw.dlgRaidIntro2 = "Du sollst sterben, genau wie der Rest. Magma fliesst durch meine Venen, und es wird das gesamte Land bedecken, es reinigen, für neues Leben."
uw.dlgRaidStory1 = "Was ist das für ein Keller und was tun wir hier?"
uw.dlgRaidStory2 = "Hier beginnt der Einflussbereich der Unsterblichen. Ihr Schlaf währte für Tausende von Jahren, doch die Tore der Schatten haben die Welt in Gefahr gebracht. Sie sind nun erwacht."
uw.dlgRaidStory3 = "Super - das heisst sie helfen uns, mit den Toren schnell und einfach fertig zu werden!"
uw.dlgRaidStory4 = "Oh, nein. Sie werden die Tore zerstören, aber sie werden ebenso die Menschheit vernichten. Für sie ist es nur ein weiterer Zyklus von Zerstörung und Aufbau."
uw.dlgShurale_Announce = "Von gierigen Banditen erweckt, rächt sich der Waldgeist nun an den Unschuldigen. Die Kreatur sucht nach der gestohlenen Schatulle der Erinnerungen – dem Gefäß ihrer uralten Magie. Nur diejenigen, in deren Herzen wahrer Kummer herrscht, können den Zorn der Kreatur besänftigen. Der Preis wird jedoch hoch sein..."
uw.dlgStoryBtnFight = "KÄMPFT"
uw.dlgStoryBtnMore = "MEHR"
uw.dlgVolcanoGreetings = "Von all den Unsterblichen bin ich als erster erwacht. Viele Kämpfer werden durch meine Hand sterben - ich werde meine Mission beenden."
uw.dlgVolcanoLost = "Genug! Ich gebe auf. Aber wisse: Ihr habt meinen Bruder gegen auch aufgebracht. Lasst euch nicht von seinem Äußeren ablenken - er ist schnell und tödlich!"
uw.dlgVolcanoStory1 = "Ich habe einige zerstörte Häuser und eine riesige Statue gesehen. Wohnen hier Menschen?"
uw.dlgVolcanoStory2 = "Nur Fanatiker. Sie beten die Unsterblichen an um verschont zu werden. Sie sind blind in ihrem Glauben. Wenn wir scheitern, werden sie bald die Wahrheit spüren."
uw.dlgVolcanoWin = "Ich habe meinen Waffenbrüdern schon immer gesagt, dass es meine Pflicht ist, über das Schicksal dieser Welt zu entscheiden. Seht, Ungläubige, wie mein Feuer das ganze Land bedeckt!"
uw.dlgVortexGreetings = "Dunkle Wasser werden die Erde und die Tore der Schatten verschlingen! Ihr Geheimnis wird in der Versenkung verschwinden. Und an der Oberfläche wird niemand übrig bleiben, um davon zu erzählen!"
uw.dlgVortexLost = "Zum ersten mal seit einen Jahrtausend gewinnt ein Mensch. Dein Überlebenswille ist stark! Aber was auch immer du tust, das Ende wird dasselbe sein: Du wirst sterben."
uw.dlgVortexWin = "Tausende Jahre habe ich eurer Vernichtung zugesehen. Darin verbirgt sich ein wenig Schönheit. Ich glaube, ich lasse dich am Leben. nur so zum Spass."
uw.dlgWhisperGreetings = "Scheint so, als könne jemand es nicht abwarten, sein Schicksal zu entdecken. Gib mir deine Hand und blick in den Spiegel!"
uw.dlgWhisperLost = "Du bist noch am Leben? Dann bist du noch nicht in meiner Macht! Fatum soll dein Schicksal weissagen, und dann werde ich in meine Welt zurückkehren – nachdem ich dich gewarnt habe, vorsichtig mit Spiegeln umzugehen!"
uw.dlgWhisperWin = "Ich werde dich mitnehmen in das Reich der Asche, der Geister und der ewigen Nacht! Vertrau mir – schau mir in die Augen und sieh nicht weg."
uw.dlg_American_25_Loose_1 = "Du weißt nicht, wen du beschützt, Shadow. Sie werden dir nicht danken. Sie werden hinter deinem Rücken nur spotten. Wilde... und ich soll das Monster sein?"
uw.dlg_American_25_Story_1 = "May ist weg. Von etwas mitgenommen, das kaum menschlich ist. Doch es gab keine Schreie, keine Anzeichen eines Kampfes... als wäre sie aus freien Stücken gegangen."
uw.dlg_American_25_Story_2 = "Wir sind damit nicht allein. Andere wie May – jung, stark – sind ebenfalls verschwunden. Sie hat es kommen spüren... und sich die Taschen mit Schießpulver gefüllt."
uw.dlg_American_25_Story_3 = "Ihre Spur ist deutlich. Wir müssen sie finden, bevor der Regen kommt, sonst ist sie für immer verloren. Komm, Shadow!"
uw.dlg_American_25_Story_4 = "Ich habe dich gerochen, als du diesen verfluchten Boden betreten hast. Warum bist du hier? Um auf meiner Trauer herumzutrampeln? Du hast keine Ehre – genau wie sie."
uw.dlg_American_25_Story_5 = "Ich wusste, dass du auftauchen würdest, Schamane. Gib die Kinder ihren Familien zurück und unsere Freundin uns. Dann geh und verrotte auf deinem Ascheberg."
uw.dlg_American_25_Story_6 = "Asche zu Asche. Und zu Asche wirst du zurückkehren, Sterblicher..."
uw.dlg_American_25_Win_1 = "Warte! Ich bin freiwillig mit ihm gegangen. Seine Gestalt ist bestialisch, ja – aber sein Herz ist menschlich. Und es leidet... Sie haben sein Kind gestohlen!"
uw.dlg_CHN_NY25_Announce = "Tauche in die Geschichte eines Helden aus vergangenen Zeiten ein – entwirre Wahrheit und Fabel und hilf dabei, eine neue Legende zu schmieden! Stelle dich einem mysteriösen Kult, der den Namen eines großen Helden als Deckmantel für seine Gräueltaten nutzt! Kehre an den Ort zurück, an dem alles begann, und hilf einem flüchtigen Schurken, sein wahres Heldentum zu entdecken!"
uw.dlg_CHN_NY25_Loose_1 = "Nein, wir müssen weiterkämpfen! Niemand würde glauben, dass ein einfacher Bauer einen finsteren Kult so leicht besiegen kann. Du musst alles geben!"
uw.dlg_CHN_NY25_Story_1 = "Der Sonnenkult hat die Tradition, einmal im Jahr den Geburtsort seines großen Helden zu besuchen. Aber jedes Mal endet es in einer Katastrophe..."
uw.dlg_CHN_NY25_Story_2 = "Er wurde als Mensch geboren? Wie merkwürdig. Mir scheint, dass diese Leute keine Geschenke für das Dorf mitbringen..."
uw.dlg_CHN_NY25_Story_3 = "Sie lassen nichts unberührt! Sie stehlen den Dorfbewohnern das Vieh, verwüsten im Rausch die Felder, zerschlagen Fenster und fangen Schlägereien an!"
uw.dlg_CHN_NY25_Story_4 = "Aber warum wehren sich die Dorfbewohner nicht? Das ist ihr Land und ihre Legende!"
uw.dlg_CHN_NY25_Story_5 = "Sie sind gebrochen. Der Held, der ihnen Hoffnung gab, ist fort, und die Kultisten begehen Böses in seinem Namen. Wir müssen ihnen wieder Hoffnung geben!"
uw.dlg_CHN_NY25_Story_6 = "Sag, du bist gekommen, um zu überprüfen, ob alles für den ‚Feiertag‘ bereit ist. Und wir werden kämpfen! Die Stadtbewohner werden sehen, dass man sich dem Kult entgegenstellen kann!"
uw.dlg_CHN_NY25_Story_7 = "Also gut, wie du willst... Lass mich in meine Rolle schlüpfen. ‚He, Junge, wie kannst du es wagen, das Gewand unseres Helden zu tragen! Verschwinde – wir haben ein Festmahl vorzubereiten!‘"
uw.dlg_CHN_NY25_Story_8 = "Ich bin vielleicht kein legendärer Held, aber sein Geist lebt in diesem Land! Er wird mich in meiner dunkelsten Stunde führen und mir Mut verleihen! Angriff!"
uw.dlg_CHN_NY25_Win_1 = "Ich hätte von einem einfachen Menschen nicht so eine Geschwindigkeit erwartet... Du hast unseren Champion fast besiegt! Wir müssen ein Exempel an dir statuieren, damit andere nicht auf dumme Gedanken kommen..."
uw.dlg_NY25_Loose_1 = "Deine Erinnerungen sind lebendig, und der Kummer spricht lauter als die Vernunft. Du wirst hier bei mir bleiben. Ruhe dich ein wenig aus – der Schlaf wird bald kommen."
uw.dlg_NY25_Story_1 = "Willkommen! Diese Hütte gehörte einst meiner Familie. So viele Erinnerungen... Bleibt so lange, wie ihr wollt. Hier gibt es alles, was ihr zum Ausruhen braucht."
uw.dlg_NY25_Story_2 = "Aber du hast uns schon so oft in Gefahr gebracht, und jetzt bietest du uns einen Aufenthalt in deinem Elternhaus an? Ist das eine Art Trick?"
uw.dlg_NY25_Story_3 = "Das ist nur die Stimme des Gewissens! Mir ist klar geworden, dass ich die Freundlichkeit anderer zu lange ausgenutzt habe. Aber jetzt möchte ich Gutes tun."
uw.dlg_NY25_Story_4 = "Wir sind nicht allein... Vor der Hütte versammeln sich Leute. Was wollen sie zu dieser späten Stunde? Sie rufen uns zu, wir sollen herauskommen."
uw.dlg_NY25_Story_5 = "Tut das nicht! Die Phantome werden euch vernichten! Sie sind nur Geister schmerzhafter Erinnerungen. Der Waldgeist ist wegen seiner Truhe gekommen! Lasst sie uns zurückholen!"
uw.dlg_NY25_Story_6 = "Eine Truhe? Darum sind also Menschen in den Wäldern verschwunden! Warum hast du uns verraten, Sly? Wir hätten dir bei dieser edlen Mission sowieso geholfen!"
uw.dlg_NY25_Story_7 = "Ihr versteht das nicht. Wenn ich ihre Stimme höre, verliere ich die Kontrolle – und dann bin ich auch weg. Solange ich ein Stück von ihr bei mir trage."
uw.dlg_NY25_Story_8 = "Mach die Tür auf, ich friere hier draußen, Papa. Das Haus ist kalt und ich bin nicht drinnen. Ich zeige dir einen Ort, an dem wir wieder zusammen sein können."
uw.dlg_NY25_Story_9 = "Halt! Geh nicht in den Wald – du wirst dich verirren! Ich weiß nicht, wessen Stimme du hörst, aber sie ist ganz sicher nicht menschlich!"
uw.dlg_NY25_Win_1 = "Wach auf, Sly! Gib dem Geist die Truhe zurück, solange er schwach ist. Lass ihn sehen, dass die Menschheit ihre eigene Gier überwinden kann."
uw.saturn_enter_saturn_1 = "Ich werde dir deine Worte wieder in den Hals stopfen. Und deine Freunde werden zusehen. Der einzige Weg, mein Gefängnis zu verlassen, führt über das Schafott. Wer will zuerst gehen?"
uw.saturn_greeting_saimon_1 = "Unser Herrscher, der Patriarch, hat das Portal jahrelang studiert. Dann, eines Tages, zog er sich in sich selbst zurück. Später errichtete er den Obelisken, und er hat etwas mit unserer Welt gemacht..."
uw.saturn_greeting_saimon_2 = "Shadow ist dem Obelisken auf molekularer Ebene ähnlich. Es gibt jemanden, der uns helfen wird, das gegen den Patriarchen einzusetzen. Deshalb sind wir hier, in der Kammer von Saturn..."
uw.saturn_greeting_saimon_3 = "Tausendmal um Verzeihung, meine Dame. Dennoch müssen wir Lazarus befreien. Bitte führt uns zu seiner Zelle, und wir werden euch nicht weiter behelligen."
uw.saturn_greeting_saturn_1 = "Wollt ihr weit weg, Kinder? Ihr seid aus freiem Willen in mein Gefängnis gekommen! Ich frage mich – ist das Mut oder Dummheit? Du, der Schlaksige – antworte mir!"
uw.saturn_greetingn_May_1 = "Aber was hat das mit uns zu tun?"
uw.saturn_lose_saturn_1 = "Das reicht für euch. Wenn Lazarus sich mit Ausschuss wie euch abgibt, besteht keine Gefahr für den Patriarchen. Verschwindet von hier, Gören! Ihr steht nicht auf meiner Liste."
uw.saturn_win_saturn_1 = "Ihr werdet Lazarus nie finden. Dieser Schuft ist aus meinem Gefängnis ausgebrochen und in die Sümpfe geflohen. Wollt ihr auch zugrunde gehen? Dann los, hinterher!"
uw.summerfest25_story2_1 = "Sieh mal an... Du warst so versessen darauf, mich zu finden, da dachte ich, ich tue dir den Gefallen. Außerdem haben sowieso alle auf diesen Moment gewartet."
uw.summerfest25_story2_2 = "‚Alle‘? Hör auf mit dem Theater. Wir wissen genau, wer du bist – und wie du andere benutzt, nur um dich an ihrem Elend zu ergötzen."
uw.summerfest25_story2_3 = "Nur ein kleiner Gastauftritt und bumm – ich liege voll im Trend! Ehrlich gesagt, hätte ich nicht erwartet, dass ich so beliebt bin."
uw.summerfest25_story2_4 = "Dein Witz wird dich nicht retten. Du wirst bezahlen – für meine Augen und für all das Böse, das du getan hast. Dein verdrehtes Spiel, Gott zu spielen, endet hier!"
uw.summerfest25_story2_5 = "Ernsthaft, Ermine? Solche Sprüche sind zusammen mit Klapphandys aus der Mode gekommen. Wir haben 2026 – versuch, mit der Zeit zu gehen."
uw.summerfest25_story2_6 = "Was auch immer der Architekt plant... ihn umgibt eine Dunkelheit. Eine Kraft, die so bösartig ist, dass sie fast greifbar ist."
uw.summerfest25_story2_7 = "Mit jedem Wort, das er spricht, ertappe ich mich dabei, dass ich Ermines Geschichte immer mehr glaube. Der Architekt ist gefährlich – und er muss aufgehalten werden."
uw.summerfest25_story2_defeat_1 = "Oh nein – wie enttäuschend! Das Publikum hat mehr erwartet. Es scheint, als müsste ich beim nächsten Mal einfach die Einsätze erhöhen."
uw.summerfest25_story2_win_1 = "Warum ist die Welt so grausam? Warum müssen wir leiden? Warum musste ich mich selbst blenden? Antworte mir, Architekt – warum tut das Leben so weh!?"
