uw.blackness_enter_blackness_1 = "Nachwuchs. Ein großes Opfer. Eine Sphäre. Der Verstand. Gemetzel. Ich fühle. Du wirst Blut vergießen. Ich sehe Schmerz. Ich sehe die Zukunft. Ich werde es dir zeigen."
uw.blackness_greeting_blackness_1 = "Was ist los, Shadow? Ist dir nicht gut?"
uw.blackness_greeting_lazarus_2 = "Simon? Was bist du doch für ein Mistkerl! Warum hast du Leute hierhergebracht? Es wird den Geruch eurer Gedanken wahrnehmen! Verschwindet von hier, bevor die Schwärze euren Verstand schmeckt!"
uw.blackness_greeting_may_1 = "Hört ihr das? Nichts! Stille. Ohne Vogelgezwitscher ist es, als wäre dieser Ort in Bernstein eingefroren. Tun wir das Richtige? Ich habe ein sehr ungutes Gefühl..."
uw.blackness_greeting_saimon_2 = "Diese feinen Herren sind deine Eintrittskarte in die Freiheit, mein Lieber. Der Große in Schwarz ist irgendwie mit dem Obelisken und den Toren verbunden. Er hilft dir, und du hilfst ihm."
uw.blackness_greetingn_saimon_1 = "Kein Wunder. Seit ein Fragment der uralten Tore hier abgestürzt ist, ist das Leben an diesem Ort eine statistische Anomalie. Haltet die Augen offen – wir müssen Lazarus finden."
uw.blackness_lose_blackness_1 = "Du bleibst hier. Auf ewig. Ein Blut. Für immer. Ich werde dich lesen. Ich werde mich nähren."
uw.blackness_win_sensei = "Du hast uns belogen, Mann der Wissenschaft! Wen haben wir befreit? Wozu haben wir diese Welt verdammt? Ist dir klar, was du getan hast?!"
