# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "Sensei’s Story{br}Part 1. The Witness"
sensei.entry.ActScreenSensei2 = "Sensei’s Story{br}Part 2. Shadow of the Future"
sensei.entry.ActScreenSensei3 = "Sensei’s Story{br}Part 3. The Beast Within"
sensei.entry.ActScreenSensei4 = "Sensei’s Story{br}Part 4. The Story of Revenge"
sensei.entry.ActScreenSensei5 = "Sensei’s Story{br}Part 5. Humiliated and Insulted"
sensei.entry.ActScreenSensei6 = "Sensei’s Story{br}Part 6. The Monster"
sensei.entry.ButcherYoung_Greetings = "Nobody dares to doubt my authority! The family never forgives that. You’re not leaving alive!"
sensei.entry.Butcher_zone3_1 = "The prodigal son returns! Have you considered my proposal, Prince? I let you go and tell you where the Sphere is, and you pay me gold."
sensei.entry.Butcher_zone3_2 = "His silence is louder than words, old man. Me? I’m honest with myself—I embrace my bestial nature. He doesn’t. But we shall teach you humility! Come, children!"
sensei.entry.Guard1_Butcher_Sensei = "Butcher showed me how pain reveals our true self. I am free now! You can find happiness, too. Do not resist!"
sensei.entry.Guard1_Hermit_Sensei = "Change is imminent! I’ve crossed half the world to learn it, sacrificed so much... Master’s wisdom is all that I have!"
sensei.entry.Guard1_Lynx_Sensei = "Do you like my tattoos? In the land where I was born, the strongest get them as souvenirs of their feats. You’ll soon be part of the picture too..."
sensei.entry.Guard1_Wasp_Sensei = "Do you believe in fortune? I think I’m gonna make my fortune today by takin’ all yer money. You think you’ll have any luck, ol’ man?"
sensei.entry.Guard1_Widow_Sensei = "My lady is like a sister to me. I can feel her pain. She forbids me from touching the Prince, so my anger shall fall upon you!"
sensei.entry.Guard2_Butcher_Sensei = "The game is in the bag! Philosophy is for dorks—me, I just like playing with knives. Wanna play with me?"
sensei.entry.Guard2_Hermit_Sensei = "Master told us about the world of shadows—about its dwellers and the immense power he’ll share with us. Do you think I’ll let you take all of this from us?"
sensei.entry.Guard2_Lynx_Sensei = "Our clan does work that’s too dirty even for the gods. We solve problems and correct others’ mistakes. And you—you’re one of those mistakes."
sensei.entry.Guard2_Wasp_Sensei = "Threatening my captain? She saved me from thralldom, and I swore to work off my freedom. May the spirits be kind to you..."
sensei.entry.Guard2_Widow_Sensei = "My lady is so fair! I was unworthy of seeing her face... Now my life belongs to her. I will protect her honour till my last breath."
sensei.entry.HermitYoung_Greetings = "You’re a victim of circumstances, Prince—a sacrifice needed for the common good. My school shall attain greatness, and the golden age of martial arts shall begin!"
sensei.entry.Hermit_zone2_1 = "You’re between a rock and a hard place, my lord. I admit—I betrayed you. I had no choice, though—the future of my school is at stake."
sensei.entry.Hermit_zone2_2 = "Lynx, that arrogant youth, couldn’t handle his task. I’ll have to do his job myself. Disciples, front and centre!"
sensei.entry.LynxYoung_Greetings = "I can’t just leave. I’ve already been paid for the Prince’s life. Nothing personal, old man."
sensei.entry.Lynx_Sensei_1 = "Don’t listen to the Prince, old man—he’s just gone mad. We’re taking His Highness home before he hurts himself. Your help isn’t required."
sensei.entry.Lynx_Sensei_2 = "Really? From where I’m standing, I see a frightened man surrounded by cutthroats. Something tells me the Prince is telling the truth. Step away from him!"
sensei.entry.Lynx_Sensei_3 = "Do what you want. They don’t pay me for talking. Two heads means more money. Get ’em, boys!"
sensei.entry.NAME_BUTCHER = "BUTCHER"
sensei.entry.NAME_HERMIT = "HERMIT"
sensei.entry.NAME_LYNX = "LYNX"
sensei.entry.NAME_PRINCE = "PRINCE"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "WASP"
sensei.entry.NAME_WIDOW = "WIDOW"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Help! These people want to kill me!"
sensei.entry.Prince_zone3_1 = "How dare you soil my name! You... you miserable wretch! I’m back to put an end to your reign of cruelty!"
sensei.entry.Prince_zone6_1 = "Here you are, my loyal friend! Look—justice triumphs again. Shogun is my faithful dog. His mind is mine!"
sensei.entry.Prince_zone6_2 = "You too, old man? You want to claim my throne?! I own it by birthright! No one shall take it from me!"
sensei.entry.Sensei_arc_intro1 = "Once upon a time, I was taking a walk and met the local lord—he was in dire distress..."
sensei.entry.Sensei_zone3_1 = "So this is what ‘luck’ means? Buying your freedom, and feeding your people to a gang of madmen... And I was so kind to you, Prince."
sensei.entry.Sensei_zone4_1 = "Widow? Of course... she told me to take the Sphere and bring it to Shogun—into his own hands."
sensei.entry.Sensei_zone6_1 = "Prince, stop! Look around! The Sphere is feeding on your anger, turning you into a monster!"
sensei.entry.Shogun_zone6_1 = "Weakling! You’re not even good enough to be my lord’s court jester. I’ll crush you with a single blow!"
sensei.entry.TITLE_PRINCE_EVIL = "HAUNTED PRINCE"
sensei.entry.WaspYoung_Greetings = "What shall I tell my father? That his daughter melted and lost a fight to an old man? That ain’t gonna happen as long as I’m the heir to the pirates’ throne!"
sensei.entry.Wasp_zone4_1 = "Widow sends you to take the Sphere? Aren’t you a bit too old for jobs like that? Ah, why should I care? Get on board."
sensei.entry.Wasp_zone4_2 = "Thing is, I don’t have the Sphere anymore. Widow’s men took it yesterday. Dunno who you are, but I never forgive liars. Keelhaul ’im!"
sensei.entry.WidowYoung_Greetings = "The Prince humiliated me—rejected me, laughed at my feelings. Now I shall strike back! You are his friend, so you’ll deliver this message to him..."
sensei.entry.Widow_zone5_1 = "Are you coming to humiliate me the way the Prince did? You males are all the same..."
sensei.entry.Widow_zone5_2 = "He’s been telling me of your kindness, honour, and dignity. But I don’t believe any male’s words anymore. Each of you shall suffer!"
sensei.entry.Zone2_SenseiReminder = "Last time, I told you how I saved the Prince from killers. I learned that Hermit was secretly training his soldiers. So that’s where we went."
sensei.entry.Zone3_SenseiReminder = "Hermit told us that the Prince’s warlord, Shogun, betrayed his lord and paid a certain Butcher to kidnap him. It was time to visit the bandit."
sensei.entry.Zone4_SenseiReminder = "The Prince’s troubles were caused by a woman! She devised a plan to overthrow him by using a magical Sphere—which was now being brought to the nearby port..."
sensei.entry.Zone5_SenseiReminder = "The pirate girl told me about Widow’s complicated history with the Prince. I didn’t get the Sphere, but I learned that the Prince went to the mountains to find Widow."
sensei.entry.Zone6_SenseiReminder = "The magical Sphere drove the Prince mad! It gave him immense power... power that threatened to destroy us all! I couldn’t allow that to happen."
sensei.entry.characterSensei = "SENSEI"
