sensei.defeat.Sensei_defeat2 = "I think it happened another way... Memories can be very fragile."
sensei.defeat.Sensei_defeat3 = "I think that wasn’t how that fight ended. Let me try to recall it..."
sensei.defeat.Sensei_defeat4 = "My memories are so vague... I think I won that fight."
sensei.defeat.Sensei_defeat5 = "No, it wasn’t that way. It seems like I won then... likely."
