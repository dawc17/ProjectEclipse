uw.dlgAmericanEvent22Story_May_1 = "She is completely frozen, Sensei! We cannot throw her out with winds like these raging at the door…"
uw.dlgAmericanEvent22Story_Puma_1 = "In trouble, old man… I never thought the past of my people would follow me, but it has. So I ran to protect them. Please, hear me out!"
uw.dlgAmericanEvent22Story_Puma_2 = "Can you hear that too? When I was a child, a shaman told me of a spirit whose howl raised the waves and tore the leaves. I never thought that old tale would prove true!"
uw.dlgAmericanEvent22Story_Puma_3 = "He is coming this way to chase us with his cry until we collapse, breathless… Just for sport! I know nowhere else to hide…"
uw.dlgAmericanEvent22Story_Sensei_1 = "The doors of my abode are open to any who are suffering. But it is unexpected to see a pirate within these walls… And where is your band of cutthroats, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "The myths of the shamans are allegories. People invented sails to tame the wind, and since then it has served them well. You are just a silly fairy tale, and Shadow will prove it!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "I am the Wolf Wind! Whoever comes to meet me shall be snuffed out like a candle! And sooner or later, I shall break down your door. It is only a matter of time!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "I shall how-ow-owl until the leaves cover the wreckage. No one will ever find the road here! Bold and foolish… How can you fight against the elements, mortal?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "What disgrace… You have taken my mighty voice! But your faith, girl, will bring me back to life… And I shall not be coming alone! For we are many!"
uw.dlgArkhosGreetings = "Blind fanatics! You remember me and feed me with your faith in the Father. A parent can be strict, and you’ll accept my punishment with gratitude..."
uw.dlgArkhosLost = "Whom shall I worship in this last hour of mine? O Creator, why hast thou forsaken me? Thou gavest me power to lead them, but I have failed thee... again."
uw.dlgArkhosStory1 = "I know his kind. They gather adepts whom they feed with lies. Don’t listen to his firebrand preaching, for that is his primary weapon."
uw.dlgArkhosStory2 = "Wrong, old man. I have some hard iron for the refractory children, too. You will be praying me to let you join the family... but I shall be implacable."
uw.dlgArkhosWin = "Black sheep, you are unworthy of a place by my side. Begone! I shall send word to the Creator of how you men have failed again, and he shall feed my children."
uw.dlgBerstuuk_Announce = "Seeking forbidden knowledge, a gifted scientist has merged science and magic in his quest to become a god. And the transformation is inevitable! Now the forest is his nightmarish laboratory, and humans are his prey. Only you can stop this terrifying metamorphosis! Banish your fear and venture to the heart of the thicket in search of the false idol!"
uw.dlgBerstuuk_Loose_1 = "When you came to my door, you told me everything without words! I will pull this knowledge like a thin thread until there is nothing left!"
uw.dlgBerstuuk_Story_1 = "There is Sly outside, knocking on the barn door… I have seen much in the forest at night, but this is something new! What is wrong with him?"
uw.dlgBerstuuk_Story_10 = "Not enough. Science is unpredictable—just look at me! Gradually I accepted the forest, but it kept refusing to accept me. Until now."
uw.dlgBerstuuk_Story_2 = "For those seeking help, the path leads to the right door. But Sly seems to have lost his way… You old rascal, watch your hands! What happened?"
uw.dlgBerstuuk_Story_3 = "The rascal was looking for help, and he found it. Let us go to the woods before it takes what is rightfully theirs. The lives of men!"
uw.dlgBerstuuk_Story_4 = "‘Men’? Poor fellow is in shock—he has no face! What frightened him so badly that he was struck by a sudden crisis of conscience?"
uw.dlgBerstuuk_Story_5 = "Can you hear the birds singing? At this hour they should already be chirping, but here there is nothing but dead silence… What else is lurking in this forest?"
uw.dlgBerstuuk_Story_6 = "Dead silence. Dead silence. People need help. You have to he-e-lp. Help now!"
uw.dlgBerstuuk_Story_7 = "By the gods! People do not normally turn into dry twigs and moss, no matter how frightened they are! What is that thing, and where is the real Sly?!"
uw.dlgBerstuuk_Story_8 = "He is around here somewhere. Sly's little mind has been most helpful. He told me about you, Shadow—about your special power. And it struck me!"
uw.dlgBerstuuk_Story_9 = "So you are the one the creature spoke of? The woods will come and take away. And how many of these ‘rightful’ lives have you taken, madman?"
uw.dlgBerstuuk_Win_1 = "Nature will find a way! Our fight has told me more than you realise, Shadow. The forest will remember. It will consume me to revive again…"
uw.dlgFatumGreetings = "Your courage can be only matched by your folly. But I knew that you shall come, for you are my fate, and I am yours. I shall rewrite your destinies—forever."
uw.dlgFatumLost = "I know mankind. You walk up and down the same spiral. I’ve seen that more than once. Self-destruction and withering. Nothing can change that. Such is your fate."
uw.dlgFatumStory1 = "Be cautious, hero. This deep, the universal laws that you’re used to cease to work..."
uw.dlgFatumStory2 = "That’s right! Hold the boy on the leash. I know all about your destinies: who you are, and where you are going. Shall I tell you who dies in the end?"
uw.dlgFatumWin = "Your fate is solved. You have already lost once you’ve set foot on my abode’s threshold. Will you have enough courage to rewrite your story?"
uw.dlgFungusGreetings = "You have poisoned the land, and now my mushrooms are dying. They shall absorb your mind, and we shall all be one, human. That will be the end of your story!"
uw.dlgFungusLost = "My brethren have forgotten themselves playing gods. Worship makes them soft. But destruction is in humanity’s nature; the world will be better without you."
uw.dlgFungusWin = "Begone! And revel in the last minutes of your fragile lives!"
uw.dlgHW21LosePuppeteer_1 = "I would not even trust you in a non-speaking role, Shadow. The stage is not where you belong—do not disgrace my craft!"
uw.dlgHW21StoryArkhos_1 = "The plague is coming to your town, mortals! Bow down before the might of your god! And delight your eyes with the shine of gold, or else…"
uw.dlgHW21StoryPuppeteer_1 = "What do you know about art! You have ruined my greatest enterprise! Nevertheless… the third act is coming. And in it, the hero breathes his last!"
uw.dlgHW21StorySensei_1 = "Since when do the gods of the underworld come up here to extort money from ordinary people? Throw off your mask, deceiver, before we take up arms!"
uw.dlgHW21StorySensei_2 = "Theatre should inspire, not horrify. And you have distorted the very essence of art. We will stop you before your ‘actors’ are harmed."
uw.dlgHW21StoryThief_1 = "Wait! It is me… Sly! Do not hit me! He promised that everyone would fear me… And no one would recognise me. How did I give myself away?"
uw.dlgHW21StoryThief_2 = "The owner of the wandering theatre—the Puppeteer. He said it would be his best performance. Gods among people! It meant nothing to me. But the money, on the other hand…"
uw.dlgHW21WinPuppeteer_1 = "This is a fiasco! You have ruined my wonderful plot and broken my masks! How am I to stage a play now without props…"
uw.dlgHW22EnterArchitect = "All this fantasy narrative of yours has exhausted me… Now we are going to play by my rules. And it is in your interest to surprise me, Shadow…"
uw.dlgHW22LooseArchitect_1 = "That was to be expected. I know all of your moves, Shadow. After all, I was the one who invented you. Perhaps I was off my game at the time… But now you will like your new life."
uw.dlgHW22StoryArchitect_1 = "That is what is called a ‘cliché’, Puppeteer. What are playwrights paid for? The number of symbols? The figure of the babbling mad genius has grown stale, much like the figure of the hero…"
uw.dlgHW22StoryArchitect_2 = "That is it. We shall rewrite your world from scratch! Contemporary, creative, relevant! What are the teenagers into these days? Why do you not say anything, Shadow? Oh, yes…"
uw.dlgHW22StoryPuppeteer_1 = "There comes a knock—an unexpected knock at your door! Is that a traveller come to call, or something more? Intriguing, is it not?"
uw.dlgHW22StoryPuppeteer_2 = "I knew you would say that, old man. What else can one expect from invented characters? Paper will bear anything… But the audience never will!"
uw.dlgHW22StoryPuppeteer_3 = "I am merely a slave to the stage, that is all. And my new masterpiece will tell of a meeting with the creator—of the torments of predestination and free will…"
uw.dlgHW22StorySensei_1 = "Whatever you have dreamed up, Puppeteer, we will not be playing your games any longer. Art may cause pain, but not in the manner you practise it."
uw.dlgHW22StorySensei_2 = "You have acted too much, and can no longer tell reality from your fantasies, performer… You are mad."
uw.dlgHW22StorySensei_3 = "Your words are peculiar and worrying, stranger… I do not know what madness is going on in your head, but Shadow will knock it out of you."
uw.dlgHW22WinArchitect_1 = "Perhaps the creation no longer belongs to its creator and has taken on a life of its own… You have surprised me. I want to see where the story goes next."
uw.dlgHoaxenGreetings = "All your life is only an illusion. And we are its creators. We shall drive you mad while others count upon brute force. Fire, water, diseases—hah!"
uw.dlgHoaxenLost = "Where are you, brother? I can’t hear your voice anymore! Truly, being locked all alone is worse than fire or blade... Go, stupid ones. The Father is waiting."
uw.dlgHoaxenStory1 = "‘We’? Shadow, it seems like our foe is off his head. Excuse me, which of your personalities are we talking with? Perhaps your ‘brother’ could be more rational?"
uw.dlgHoaxenStory2 = "Laughing at us, human? My brother suggests your souls to be sent to the abyss of eternal misery... Then your world shall yield, without a single drop of blood."
uw.dlgHoaxenWin = "I would’ve killed you, for my mercy is truly boundless. But my brother is less tolerant; you’re free to go, in case if you don’t lose your wits on the way out."
uw.dlgHunter_enter_hunter_1 = "You! Hey, yooou! Come to finish what you staaarted, have you? You? There is a power to you. It ssspeaks to me. Hush! Or I shall maaake you!"
uw.dlgHunter_greeting_may_1 = "Look! There is something inside the crystal… Is it meant to be like that?"
uw.dlgHunter_greeting_saimon_1 = "How strange… I was expecting Lazarus to grind the Obelisk to dust. I feared the carnage, but it seems that only you and I remain. I am intrigued."
uw.dlgHunter_greeting_saimon_2 = "The Concentration Hall. Do you see that crystal in the centre? That is how the Obelisk accumulates shadow energy—the heart of darkness, so to speak."
uw.dlgHunter_greeting_sensei_1 = "Silence is a bad omen, my rational friend. It can speak louder than the most deafening of words. Hmm… Where are we? What is this bizarre place?"
uw.dlgHunter_greeting_sensei_2 = "I doubt that, my dear… This place looks different from how I last saw it. I am beginning to think the old man was right…"
uw.dlgHunter_loose_hunter_1 = "Lay dooown. I will leeeeave you here foreveeeer. Do not cause mooore harm."
uw.dlgHunter_win_hunter_1 = "Stop, Shadow-human! Do not let it ssssspreeeeaad! You will beee like hiiiiiiiim. You shall be decccceived! But you still have a chaaaanccce."
uw.dlgIE21AnnounceAssistant_1 = "Who on earth is that? What are you doing in our world, and why should we even listen to you?"
uw.dlgIE21AnnounceAssistant_2 = "Ha! I do not know where you came from, but you will not be staying here long!"
uw.dlgIE21AnnounceAssistant_3 = "Hey, Shadow, this bully has gone too far! Let us teach him some manners!"
uw.dlgIE21AnnounceBoss_1 = "You pathetic mortals! Bow down before my will and glory, or I shall force you to your knees!"
uw.dlgIE21AnnounceBoss_2 = "How dare you speak to me like that—I am Ravana, conqueror of all three worlds!"
uw.dlgIE21AnnounceBoss_3 = "This is your last chance to kneel. Refuse, and I shall take your head!"
uw.dlgIE21AnnounceSensei_1 = "Shadow, I sense a mysterious threat approaching. Something evil has made its way into our world once more."
uw.dlgIE21Boss_After_Loose = "If all the people of this world are so weak, then its conquest is merely a matter of time!"
uw.dlgIE21Boss_After_Win = "FOOLS! I retreat for now, but you will not defeat me so easily. I shall return!"
uw.dlgIndia22Story_May_1 = "And so you began to starve… What could this demon have wanted at your joyful celebration? How could humble farmers have drawn such a predator?"
uw.dlgIndia22Story_Rakshasa_1 = "You have an interesting scent, human. No doubt you would taste just as good! Can you hear my belly rumbling? A choice cut of meat to go with my rice would be most welcome!"
uw.dlgIndia22Story_Rakshasa_Lose = "Fortunately for you, our fight has worn me out. Besides, my hunger is sated… for now. I will work up a fresh appetite and hunt again!"
uw.dlgIndia22Story_Sensei_1 = "Tell me of him, traveller. From your clothes, I can see that you have journeyed far. What trouble troubles your home?"
uw.dlgIndia22Story_Sensei_2 = "Curb your appetite, demon! There will be no invitation to the festival of life for one who steals life itself!"
uw.dlgIndia22Story_Sensei_Win = "It is not magic that makes a garden blossom—it is hard work. And you are going to prove that yourself: help your neighbours restore their farm, or else…"
uw.dlgIndia22Story_Sitaram_1 = "I have heard your life story. May the gods reward you according to your merits! I bear ill news: an evil spirit has appeared in my lands…"
uw.dlgIndia22Story_Sitaram_2 = "This demon's evil is matched only by its hunger! We were preparing to celebrate Bohag Bihu when, suddenly, this… creature appeared and devoured all our seedlings!"
uw.dlgIndia22Story_Sitaram_3 = "As Agni is my witness, my lady, I ask myself the same question! Now we wait in dread for sunset… Come with me, I beg you!"
uw.dlgIndia24_Enter_Puppet_1 = "Do you have the spirit required to direct fate? Decide mine, humble servant of the arts that I am. Only in combat do you truly understand what is what. Be bold, Shadow—attack!"
uw.dlgIndia24_Story_Dandy_1 = "Open up, or I shall break down this damned door! I know you are home—I can hear you! I will set this shack ablaze if you do not grant me shelter!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Oh, how fiercely mortals cling to life. It was not I who chose this work, and I shall not shed venomous tears over it… Why have you done this to me?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Her heart is filled with love. The gods create us pure, but we choose our own path. Nrityu begins to understand this as she listens to the girl's story."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, your performance lacks passion and commitment. I shall give you another chance. Do not act it—live it!"
uw.dlgIndia24_Story_Puppet_1 = "Knock, knock! Hey, old friends! The voice of fate is upon us—and she is on her way! Her red hem smoulders like life itself at the dying of the day!"
uw.dlgIndia24_Story_Puppet_2 = "Is it for your soul that she has come? Behold a tale as ancient as the world itself—the legend of Nrityu, whose fate it was to be a taker of lives."
uw.dlgIndia24_Story_Puppet_3 = "The ghosts are all chattering. You cannot trust them. And besides, it is not their tale to tell. I will show you the truth through her eyes. Shadow, you are the only one who can understand."
uw.dlgIndia24_Story_Sensei_1 = "That voice… It seems our old adversary is up to something once more. Who will be the victim this time? I see a man running towards the pagoda…"
uw.dlgIndia24_Story_Sensei_2 = "Your clothes are covered in filth and soot, stranger. And your tone unsettles me. Explain who you are and what business you have at our doorstep!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Get back! I did not want this! My family was afraid of me, and I thought this was my chance… Dandy promised to take me with him, if only I helped…"
uw.dlgIndia24_Story_Win_Nrityu_1 = "There! You fall into eternal sleep, though you do not deserve it. But it is not for me to judge you—that is another's calling. I am but the escort."
uw.dlgIndia24_Story_Win_Puppet_4 = "Just like you, Shadow. I want you to follow Nrityu's path. It took her an eternity to understand her place."
uw.dlgIndia24_Story_Win_Puppet_6 = "The show goes on! You, Shadow, will be the star, and my actors will be your supporting players. The story of Nrityu will be our greatest production!"
uw.dlgIndia24_Story_Win_Sensei_1 = "This story runs deep—even for you. I am surprised! But what is the moral here? Why are you showing this to us?"
uw.dlgMegalithGreetings = "This mine is a sacred place. Why are you here? Leave and meet your destiny with honour. The last thing you will hear is the earth trembling beneath your feet."
uw.dlgMegalithLost = "Damnation! Shall I have to wait for thousands of years again? I’ve moved continents! Cleansing the earth was my role!"
uw.dlgMegalithWin = "I’ve treated humans kindly, a rare trait among the Eternals. I helped your species many times. So run and say your last goodbyes to your dear ones!"
uw.dlgRaidIntro1 = "Are you trying to correct your mistake? You opened the Gates, but only the Eternals can eliminate the Shadow contagion. Not being one of us, you are weak."
uw.dlgRaidIntro2 = "You shall die, like all the rest. Magma flows through my veins, and it will cover all the land, cleansing it for new life."
uw.dlgRaidStory1 = "What cellar is this, and what are we doing here?"
uw.dlgRaidStory2 = "This is the antechamber of the Eternals’ domain. Their slumber lasted for millennia, but the Gates of Shadows have put the world in peril. They’ve awakened."
uw.dlgRaidStory3 = "Cool—that means they’ll help us deal with the Gates quick and easy!"
uw.dlgRaidStory4 = "Oh, no. They shall destroy the Gates, but they shall also destroy the whole of mankind. For them, it’s only another cycle of destruction and creation."
uw.dlgShurale_Announce = "Awakened by greedy bandits, the forest spirit now wreaks its revenge upon the innocent. The creature seeks the stolen casket of memories—the vessel of its ancient magic. Only those whose hearts hold true sorrow may quell the creature's fury. The price, however, will be steep…"
uw.dlgStoryBtnFight = "FIGHT"
uw.dlgStoryBtnMore = "MORE"
uw.dlgVolcanoGreetings = "Of all the Eternals, I was the first to awaken. Many fighters will come to die by my hand, I shall complete my mission."
uw.dlgVolcanoLost = "Enough! I concede. But know this: you have roused my brother. Be not deceived by his appearance, for he is quick and deadly!"
uw.dlgVolcanoStory1 = "I saw some half-ruined dwellings and a huge statue. Are there humans living here?"
uw.dlgVolcanoStory2 = "Only fanatics. They worship the Eternals in hope to be spared. Truly, they are blind in their faith. If we fail, they will soon learn the truth."
uw.dlgVolcanoWin = "I have been telling my brethren that it is my duty to decide the planet’s destiny. Watch, unbelievers, as my blaze blankets the land!"
uw.dlgVortexGreetings = "Dark waters will engulf the earth and the Gates of Shadows! Their secret will be lost in the abyss. And there will be no one left on the surface to tell it!"
uw.dlgVortexLost = "For the first time in a thousand years a human wins. Your will to live is so strong! But whatever you do, the end shall be the same: you will die."
uw.dlgVortexWin = "For thousands of years I’ve watched the withering of your kind. There is some beauty in it. I think I shall keep you alive—just for fun."
uw.dlgWhisperGreetings = "It seems someone cannot wait to discover their fate. Give me your hand and gaze into the mirror!"
uw.dlgWhisperLost = "You are still alive? Then you are not yet in my power! Fatum shall divine your destiny, and then I shall return to my world—having warned you to tread carefully with mirrors!"
uw.dlgWhisperWin = "I shall take you with me into the realm of ash, spirit, and eternal night! Trust me—look into my eyes, and do not look away."
uw.dlg_American_25_Loose_1 = "You do not know whom you protect, Shadow. They will not thank you. They will only sneer behind your back. Savages… and I am the monster?"
uw.dlg_American_25_Story_1 = "May is gone. Taken by something barely human. Yet there were no screams, no signs of struggle… as though she had walked out of her own accord."
uw.dlg_American_25_Story_2 = "We are not alone in this. Others like May—young, strong—have vanished too. She sensed it coming… and filled her pockets with gunpowder."
uw.dlg_American_25_Story_3 = "Her trail is clear. We must find her before the rains come, or it will be lost for good. Come, Shadow!"
uw.dlg_American_25_Story_4 = "I smelled you the moment you set foot on this cursed ground. Why have you come? To trample upon my grief? You have no honour—just as they had none."
uw.dlg_American_25_Story_5 = "I knew you would show up, shaman. Give the children back to their kin, and our friend to us. Then go and rot on your mountain of ash."
uw.dlg_American_25_Story_6 = "Ashes to ashes. And to ash you shall return, mortal…"
uw.dlg_American_25_Win_1 = "Wait! I went with him willingly. His form is beastly, yes—but his heart is human. And it suffers… They stole his child!"
uw.dlg_CHN_NY25_Announce = "Immerse yourself in the story of a hero from ages past—untangle truth from fable, and help forge a new legend! Stand against a mysterious cult that wields the name of a great hero as a cloak for their atrocities! Return to the place where it all began, and help a fugitive rascal discover his true heroism!"
uw.dlg_CHN_NY25_Loose_1 = "No, we must keep fighting! No one would believe a simple farmer could defeat a sinister cult so easily. You must give it your all!"
uw.dlg_CHN_NY25_Story_1 = "The Sun Cult has a tradition of visiting their great hero's birthplace once a year. But every time, it proves to be a disaster…"
uw.dlg_CHN_NY25_Story_2 = "He was born human? How curious. It seems to me that these people are not bringing gifts to the village…"
uw.dlg_CHN_NY25_Story_3 = "They leave nothing untouched! They steal cattle from the villagers, ravage crops in drunken frenzy, shatter windows and pick fights!"
uw.dlg_CHN_NY25_Story_4 = "But why do the villagers not fight back? This is their land and their legend!"
uw.dlg_CHN_NY25_Story_5 = "They are broken. The hero who gave them hope is gone, and the cultists commit evil in his name. We must give them hope once more!"
uw.dlg_CHN_NY25_Story_6 = "Say you have come to check that all is ready for the ‘holiday’. And we shall fight! The townsfolk will see that the cult can be confronted!"
uw.dlg_CHN_NY25_Story_7 = "Very well, have it your way… Let me get into character. ‘Hey, boy, how dare you wear our hero's raiment! Be gone—we have a feast to prepare!’"
uw.dlg_CHN_NY25_Story_8 = "I may not be a hero of legend, but his spirit lives in this land! He will guide me in my darkest hour and lend me courage! Attack!"
uw.dlg_CHN_NY25_Win_1 = "I did not expect such speed from a mere man… You almost bested our champion! We must make an example of you, lest others get ideas…"
uw.dlg_NY25_Loose_1 = "Your memories are vivid, and grief speaks louder than reason. You shall remain here with me. Rest a while—sleep will come soon."
uw.dlg_NY25_Story_1 = "Welcome! This cabin once belonged to my family. So many memories… Stay as long as you like. There is everything you need to rest here."
uw.dlg_NY25_Story_2 = "But you have placed us in danger so many times, and now you offer us a stay at your family home? Is this some sort of trick?"
uw.dlg_NY25_Story_3 = "Just the voice of conscience speaking! I have realised that I have taken advantage of others' kindness for too long. But now, I wish to do good."
uw.dlg_NY25_Story_4 = "We are not alone… There are people gathering before the hut. What do they want at this late hour? They are calling for us to come out."
uw.dlg_NY25_Story_5 = "Do not! The phantoms will destroy you! They are but ghosts of painful memories. The forest spirit has come for his chest! Let us retrieve it!"
uw.dlg_NY25_Story_6 = "A chest? So that is why people have been disappearing in the woods! Why did you betray us, Sly? We would have helped you in this noble quest regardless!"
uw.dlg_NY25_Story_7 = "You do not understand. If I hear her voice, I shall lose control—and I will be gone too. So long as I carry a piece of her with me."
uw.dlg_NY25_Story_8 = "Open the door, I am freezing out here, Daddy. The house is cold and I am not inside. I will show you a place where we can be together once more."
uw.dlg_NY25_Story_9 = "Stop! Do not go into the forest—you will lose your way! I do not know whose voice you hear, but it is certainly not human!"
uw.dlg_NY25_Win_1 = "Wake up, Sly! Return the chest to the spirit while it is weak. Let it see that humanity can overcome its own greed."
uw.saturn_enter_saturn_1 = "I shall ram your words back down your throat. And your friends will watch. The only way to leave my prison is via the scaffold. Who wishes to go first?"
uw.saturn_greeting_saimon_1 = "Our ruler, the Patriarch, studied the portal for years. Then, one day, he withdrew into himself. Later, he raised the Obelisk, and it did something to our world…"
uw.saturn_greeting_saimon_2 = "Shadow is similar to the Obelisk on a molecular level. There is someone who will help us use that against the Patriarch. That is why we are here, in the chamber of Saturn…"
uw.saturn_greeting_saimon_3 = "A thousand apologies, my lady. Nevertheless, we must free Lazarus. Please show us to his cell, and we shall not trouble you further."
uw.saturn_greeting_saturn_1 = "Going far, children? You came to my prison of your own free will! I wonder—is that bravery or stupidity? You, the lanky one—answer me!"
uw.saturn_greetingn_May_1 = "But what has that got to do with us?"
uw.saturn_lose_saturn_1 = "That is enough for you. If Lazarus is associating with rejects like you, there is no danger to the Patriarch. Get out of here, brats! You are not on my list."
uw.saturn_win_saturn_1 = "You will never find Lazarus. That rascal escaped from my prison and fled to the marshes. You wish to perish too? Then off you go after him!"
uw.summerfest25_story2_1 = "Well, well… You have been so eager to find me, I figured I would do you the favour. Besides, everyone was waiting for this moment."
uw.summerfest25_story2_2 = "‘Everyone’? Stop the act. We know exactly who you are—and how you use others just to revel in their misery."
uw.summerfest25_story2_3 = "Just one little cameo, and boom—I am trending! Honestly, I did not expect to be this popular."
uw.summerfest25_story2_4 = "Your wit will not save you. You will pay—for my eyes, and for all the evil you have done. Your twisted game of playing god ends here!"
uw.summerfest25_story2_5 = "Seriously, Ermine? That kind of talk went out with flip phones. It is 2026—try to keep up with the times."
uw.summerfest25_story2_6 = "Whatever the Architect is planning… there is a darkness around him. A force so malevolent, it is almost tangible."
uw.summerfest25_story2_7 = "With every word he speaks, I find myself believing Ermine's story more and more. The Architect is dangerous—and he must be stopped."
uw.summerfest25_story2_defeat_1 = "Oh no—how disappointing! The audience expected more. It seems I shall simply have to raise the stakes next time."
uw.summerfest25_story2_win_1 = "Why is the world so cruel? Why must we suffer? Why did I have to blind myself? Answer me, Architect—why does it hurt to live!?"
uw.tutorial_ascention_intro_title = "PUPPETEER"
