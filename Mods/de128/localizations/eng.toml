# BEGIN Sensei sensei.notify.
sensei.notify.ending = "I remembered what happened at the end. Shall we return to my story?"
sensei.notify.intro = "This place awakens some memories. I will tell you my story—one that happened many years ago..."
sensei.notify.more = "I remembered something more. Shall we return to my story?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "You’re not dreaming. I’ve stopped time to take the Sphere back to the shadows. Its presence here was a mistake—caused by the instability of the Gates of Shadows."
sensei.victory.Ancient_zone6_2 = "Change is imminent, human. For now, sleep. When you wake, no one will remember your feat. It must be this way. One day, you will understand..."
sensei.victory.Butcher_zone3_3 = "He-he! Look at the Prince taking to his heels! You should’ve seen your face, old man. See? Your new friend is a spineless liar!"
sensei.victory.Butcher_zone3_4 = "I know that as soon as the Prince draws his last breath, Shogun won’t let me live. I’m just a tool—expendable. So... I shall help you."
sensei.victory.Butcher_zone3_5 = "A certain woman convinced Shogun that the throne is his by right. She promised he’ll have the Sphere and become a great warlord—all in exchange for being her liege."
sensei.victory.Butcher_zone3_6 = "Go to the port. Shogun is waiting for a ship to arrive—the one bringing the Sphere. It’s the Prince’s last chance to reclaim his throne."
sensei.victory.Hermit_zone2_3 = "Try to understand—our art is at its end! To survive, it must change. I know how, and Shogun has promised me protection in exchange for training his men."
sensei.victory.Hermit_zone2_4 = "Butcher dwells with his gang not far from here. They were your kidnappers, sire. Go—may you find the answers you seek."
sensei.victory.NAME_BUTCHER = "BUTCHER"
sensei.victory.NAME_HERMIT = "HERMIT"
sensei.victory.NAME_PRINCE = "PRINCE"
sensei.victory.NAME_WASP = "WASP"
sensei.victory.NAME_WIDOW = "WIDOW"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Thank you! You’re noble—few would stand up for someone they don’t know. I thought death was near—these people know nothing of mercy."
sensei.victory.Prince_zone1_2 = "I learned something I wasn’t supposed to: my soldiers have been studying forbidden practices under a certain Hermit. They wanted to eliminate me as a witness..."
sensei.victory.Prince_zone1_3 = "I took a unit of men to him to make things clear, but I was taken captive. However, luck was still on my side, and I managed to escape."
sensei.victory.Prince_zone2_1 = "My men! Placing him at the head of my army was a mistake... If you still have even a shred of honour, tell us where the bandits’ camp is!"
sensei.victory.Sensei_arc_outro = "The End."
sensei.victory.Sensei_zone1_1 = "Too many coincidences. Someone knew about our visit and warned the bandits. But how is Hermit involved? We need to find out. Let’s go!"
sensei.victory.Sensei_zone2_1 = "Shame on you! Selling your honour outright! And for what? Do you think people will follow a traitor’s lead? Is that a good example for the young?"
sensei.victory.Sensei_zone3_2 = "Answer me: why does Shogun want him dead, and what is the magic Sphere you were talking about?"
sensei.victory.Sensei_zone4_2 = "We must stop the Prince before he finds Widow... and the Sphere..."
sensei.victory.Sensei_zone5_1 = "I sympathize with you—I truly do. But a broken heart is a poor advisor. Please understand: there are people suffering because of you."
sensei.victory.Sensei_zone6_2 = "Wait! I have so many questions! Who are you? What’s out there, behind the Gates? I want to know..."
sensei.victory.Wasp_zone4_3 = "Stop—I’ve underestimated you, ol’ man! I was paid for delivery, but I’ve got no business fighting for Widow’s honour. I’ll show you to her hiding place!"
sensei.victory.Wasp_zone4_4 = "Widow loved the Prince, but he rejected her. Then she found herself a new toy: Shogun. The hag is using that stupid warlord for her revenge."
sensei.victory.Wasp_zone4_5 = "Widow wants to rule men and play them off against one another. The Sphere shall make her chosen one great... and absolutely loyal to her."
sensei.victory.Widow_zone5_3 = "There’s no way back for me. I see that you want to help, but it’s too late—the Prince already took the Sphere. Shogun tried to defend it, but in vain."
sensei.victory.Widow_zone5_4 = "I’ve never seen the Prince so... wild. His eyes were flaming! He thought it’d be funny to execute a traitor in the place where we first met. I’ll show you..."
sensei.victory.characterAncient = "ANCIENT"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

