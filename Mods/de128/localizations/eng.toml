uw.Gatekeeper_greetings_1 = "Strange air? Strange air! Strrrange air!"
uw.Gatekeeper_greetings_2 = "Not happy, not happy, not happy! We did, we did, we did!"
uw.Gatekeeper_greetings_Assistant_1 = "Shadow! You are finally awake!"
uw.Gatekeeper_greetings_Assistant_2 = "It is so cold here! I cannot feel my fingers already… Where are we? The air feels so strange."
uw.Gatekeeper_greetings_Assistant_3 = "But why do I feel as though it understands us?"
uw.Gatekeeper_greetings_Sensei = "Get back, May! We do not know what it wants! The world of the Immortals was shaken more than I thought. After what we did, they are not happy that we are here."
uw.Gatekeeper_greetings_Sensei_2 = "Calm now—do not make any sudden moves. It seems this creature is not very intelligent."
uw.Gatekeeper_greetings_Sensei_3 = "That is not important now. Passing through the portal was our choice, and we must answer for it. It wants a fight—we have no choice, Shadow."
uw.Gatekeeper_lost_Saimon = "I expected more from the portal… It seems the journey drained your strength, and your molecular bonds are weakened. Interesting—we must conduct a few more tests."
uw.Gatekeeper_win_Saimon = "For centuries, this rickety portal has reminded us that there are forces beyond our understanding. Then you came along…"
uw.HARD_GROUND = "When falling to the ground, you receive damage."
uw.HEAD_BERSTUUK = "Berstuuk’s Mask"
uw.HEALTH_DROPS = "Health drops over time."
uw.HOT_GROUND = "Hot ground."
uw.HW20Arkhos1 = "I need no foresight to see that the fire of faith shall consume both the weak and the blind. I have brought black candles, so that all may see this truth as clearly as I do!"
uw.HW20Fatum1 = "The boundaries between worlds grow thin—this is the finest night for prophecy! The air hums with magic, and in my hands, the very threads of fate lie coiled!"
uw.HW20Fatum2 = "Fortunetelling, to me, is a game—I may do with the fates of mortals as I please. But you, my friends, are a different matter entirely. Please, do sit down!"
uw.HW20Fatum3 = "You have been blinded by your hatred. Let us begin. Speak not, but listen. I see a figure… black as night… feathers and ashes… taking me by the hand…"
uw.HW20Fatum4 = "How… how did you come to be here? The path to this world was sealed against you!"
uw.HW20Megalith1 = "You spoke of fortunetelling and a masquerade, so I brought a magic mirror. For the first time in a thousand years, I can see my reflection. This mask makes me look ancient!"
uw.HW20Whisper1 = "Have you been playing at prophecy, little sister? Taking charge of mortal destinies? Such toys have always been mine alone!"
uw.HW20Whisper2 = "Sealed it was! But you called, and through this marvellous mirror, I came. I am taking it with me. Be sure to visit, and hear some true fortunes told!"
uw.Hunger_AfterLoss = "Since you’rrre the chosen one, I’ll give you one last chance to stay with me and feast. Otherrrwise your bones will fall to join the others in the dust."
uw.Hunger_AfterWin = "Creator, you sent me sustenance, but it is not enough. My hunger is eternal, grant me deliverance..."
uw.Hunger_Greetings1 = "You travelled quite a long path to get here. Why? To save the ungrateful morrrtals? They couldn’t care less about you! I can sense your loneliness, your hunger, and your...fearrr."
uw.Hunger_Greetings2 = "Shadow, don’t be fooled! He only seems weak. You’re not his friend, you’re just his prey. He’ll tear you to pieces if you get any closer!"
uw.Hunger_Greetings3 = "Can you see my brothers? They thirrrst, but their thirst is of a different breed. They crave enterrrtainment. But their hunger is nothing compared to mine!"
uw.INVERTED_JOYSTICK = "Inverted movement."
uw.LIGHT_IN_THE_DARK = "Light in the darkness."
uw.MERCENARY_RAID = "MERCENARY{br}UNIT"
uw.MERCENARY_RAID_Title = "Mercenary Unit"
uw.MiniEventAnnounce = "Since time immemorial, a cult has dwelt in the bowels of the earth, watching over the delicate slumbers of the underworld gods and preventing their awakening. But the price is a cruel ritual battle, fought to the last drop of blood."
uw.MiniEventHungerFight_Enter_1 = "Here beneath the earth, everything is different. We fight to live, and grub is life! Do not deprive your people—or mine—of this great joy!"
uw.MiniEventHungerStory_1 = "The people care about the whims of the spirits only when trouble descends upon their homes. Their crops wither, their children go hungry… And where is their faith now?"
uw.MiniEventHungerStory_2 = "Hunger has a form. Its thirst to consume is terrible. But that is Karcer's role, while yours and mine is to prevent him from waking from his centuries-old slumber."
uw.MiniEventHunger_Loss_1 = "Did your mother not teach you not to leave anything on your plate? It shows—there is hunger in your eyes! Or… what is the matter with you?"
uw.MiniEventHunger_Win_1 = "Yes, you strike well, Shadow… Let us celebrate your victory with some hearty chow! My treat!"
uw.MiniEventStory_1 = "I see that you, Shadow, are strong and steadfast of spirit. The legends of your deeds are widespread. Would you like to become part of another?"
uw.MiniEventStory_2 = "The spirits of the underworld are wayward. We perform a ceremony to temper their tempers—ritual battles! Your participation would be an honour to us."
uw.MiniEventStory_EnterBattle = "Are you not a little sickly for such an arcane spectacle? And you chose this one, truly? This is a man of legend? Oh, the spirits will be outraged…"
uw.MiniEventStory_Loss_1 = "Yes, well… I want to believe that even the spirits have a sense of humour, and that they will merely laugh at our fumbling in the arena, rather than unleashing their rage upon us…"
uw.MiniEventStory_Win_1 = "Well… No one comes to this arena by chance. You truly are a man of legends, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "The witch frightens you without cause. It is far simpler than that: steel is tempered in fire! The gods understand power and nothing else. Power alone can return them to their slumber! Attack!"
uw.MiniEventVulkanStory_1 = "The cleansing fire is righteous—so say our ancestors. But they did not know that Immortals care nothing for human morality. That is simply their nature."
uw.MiniEventVulkanStory_2 = "Do you feel the heat rising from beneath the earth? There is one thing you must know: the flame spares no one, be they friend or stranger. And we stand directly in its path."
uw.MiniEventVulkan_Loss_1 = "You must get back on your feet, Shadow! Can you not feel the ground quaking?! The god is disgusted by our trifling in the dust…"
uw.MiniEventVulkan_Win_1 = "It is as hot as hellfire here… The fire spirit growls contentedly in its vault! A fine fight indeed, Shadow! We have earned another day!"
