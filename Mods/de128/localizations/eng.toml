uw.TRANSIENT_BLEEDING = "Passing burning effect."
uw.Tenebris_greetings_1 = "You are on the edge of reality, traveller. This is the final frontier. Beyond this line is the emptiness in which worlds are born. And it was I who forged their light and darkness!"
uw.Tenebris_greetings_2 = "Shadow, the portal behind him may be our chance for salvation. The Eternals said that they would destroy our world. Maybe with his help?"
uw.Tenebris_greetings_3 = "You won’t survive the portal! It’s terra incognita. The darkness in which worlds can be created. But you cannot create, only destroy. The portal will swallow you whole!"
uw.Tenebris_greetings_4 = "It’s a risk, but do we have any other choice? We may stop the Eternals by entering the portal. But also we may cause a great catastrophe."
uw.Tenebris_loses = "Are you afraid of the unknown lurking in the darkness? Now you’ll be left to face it on your own! The world falls to dust and is reborn anew. Following the spiral."
uw.Tenebris_wins = "Stubborn fool! You humans can only solve problems with brute force. But the universe doesn’t work that way. All these years, and you’ve learned nothing..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Rise, puppet! And fight! It matters not if you win or lose. When you fight, you serve me!"
uw.War_AfterWin = "Imposter! Where is your fury? How can you fight without it? Fight me! Let us begin another dance of blades! I know that war lives in you!"
uw.War_Greetings1 = "What a lovely day! I can sense a battle coming, like a storm. Thunder. The untold fury of the legions keeping pace. They are all gifts on my altar!"
uw.War_Greetings2 = "Rage and thirst for blood boil within her. She delights in endless battle, but for what? What will she find atop her mountain of skulls?"
uw.War_Greetings3 = "Is the thrill of bloody battle so foreign to you? Fire, passion, tempestuous power! Show what you can do! Entertain me in single-combat or die!"
uw.ZONE_RAID = "Underworld: Tier 1"
uw.ZONE_RAID1 = "Underworld: Tier 2"
uw.ZONE_RAID2 = "Underworld: Tier 3"
uw.ZONE_RAID3 = "Underworld: Tier 4"
uw.ZONE_RAID4 = "Underworld: Tier 5"
uw.ZONE_RAID5 = "Underworld: Tier 6"
uw.ZONE_RAID6 = "Underworld: Tier 7"
uw.ZONE_RAID7 = "Underworld: Tier 8"
uw.blackness_enter_blackness_1 = "Offspring. A great sacrifice. A sphere. The mind. Butchery. I feel. You will spill blood. I see pain. I see the future. I will show you."
uw.blackness_greeting_blackness_1 = "What is the matter, Shadow? Are you unwell?"
uw.blackness_greeting_lazarus_2 = "Simon? What a bastard you are! Why did you bring people here? It will catch the scent of your thoughts! Get away from here before the Blackness tastes your mind!"
uw.blackness_greeting_may_1 = "Do you hear that? Nothing! Silence. Without birdsong, it is as though this place is frozen in amber. Are we doing the right thing? I have a very bad feeling…"
uw.blackness_greeting_saimon_2 = "These fine gentlemen are your ticket to freedom, my dear. The big one in black is somehow connected to the Obelisk and the Gates. He helps you, and you help him."
uw.blackness_greetingn_saimon_1 = "No wonder. Ever since a fragment of the ancient Gates crashed here, life in this place has been a statistical anomaly. Keep your eyes open—we need to find Lazarus."
uw.blackness_lose_blackness_1 = "You stay here. Eternally. One blood. Forever. I will read you. I will feed."
uw.blackness_win_sensei = "You lied to us, man of science! Who have we freed? What have we condemned this world to? Do you realise what you have done?!"
