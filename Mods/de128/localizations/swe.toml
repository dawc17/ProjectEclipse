uw.dlgAmericanEvent22Story_May_1 = "Hon är helt stelfrusen, Sensei! Vi kan inte kasta ut henne med vindar som dessa härjande vid dörren..."
uw.dlgAmericanEvent22Story_Puma_1 = "I trubbel, gamle man... Jag trodde aldrig att mitt folks förflutna skulle följa efter mig, men det har det gjort. Så jag flydde för att skydda dem. Snälla, lyssna på mig!"
uw.dlgAmericanEvent22Story_Puma_2 = "Hör du det också? När jag var barn berättade en schaman för mig om en ande vars ylande reste vågorna och slet av löven. Jag trodde aldrig att den gamla berättelsen skulle visa sig vara sann!"
uw.dlgAmericanEvent22Story_Puma_3 = "Han är på väg hitåt för att jaga oss med sitt skrik tills vi kollapsar, andlösa... Bara för skojs skull! Jag vet ingen annanstans att gömma mig..."
uw.dlgAmericanEvent22Story_Sensei_1 = "Dörrarna till min boning står öppna för alla som lider. Men det är oväntat att se en pirat innanför dessa väggar... Och var är ditt gäng med mördare, Puma?"
uw.dlgAmericanEvent22Story_Sensei_2 = "Schamanernas myter är allegorier. Människor uppfann segel för att tämja vinden, och sedan dess har den tjänat dem väl. Du är bara en fånig saga, och Shadow ska bevisa det!"
uw.dlgAmericanEvent22Story_Wind_Wolf_1 = "Jag är Vargvinden! Den som kommer för att möta mig kommer att släckas som ett ljus! Och förr eller senare kommer jag att slå in din dörr. Det är bara en tidsfråga!"
uw.dlgAmericanEvent22Story_Wind_Wolf_Lose = "Jag ska y-y-yla tills löven täcker vrakresterna. Ingen kommer någonsin att hitta vägen hit! Djärv och dåraktig... Hur kan du kämpa mot elementen, dödlige?"
uw.dlgAmericanEvent22Story_Wind_Wolf_Win_1 = "Vilken skam... Du har tagit min mäktiga röst! Men din tro, flicka, kommer att väcka mig till liv igen... Och jag kommer inte att komma ensam! För vi är många!"
uw.dlgArkhosGreetings = "Blinda fanatiker! Ni minns mig och mättar mig med er tro på Fadern. En förälder kan vara sträng, och ni kommer att ta emot mitt straff med tacksamhet..."
uw.dlgArkhosLost = "Vem ska jag tillbe i denna min sista stund? O Skapare, varför har du övergivit mig? Du gav mig makt att leda dem, men jag har svikit dig... igen."
uw.dlgArkhosStory1 = "I känner hans sort. De samlar adepter som de mättar med lögner. Lyssna inte på hans eldiga predikan, för den är hans främsta vapen."
uw.dlgArkhosStory2 = "Fel, gamle man. Jag har hårt järn till de motsträviga barnen också. Du kommer att be mig om att få gå med i familjen... men jag kommer att vara obeveklig."
uw.dlgArkhosWin = "Svarta får, ni är ovärdiga en plats vid min sida. Gå er väg! Jag ska sända bud till Skaparen om hur ni människor har misslyckats igen, och han ska mätta mina barn."
uw.dlgBerstuuk_Announce = "I sökandet efter förbjuden kunskap har en begåvad forskare smält samman vetenskap och magi i sin strävan efter att bli en gud. Och förvandlingen är oundviklig! Nu är skogen hans mardrömslaboratorium och människor är hans byte. Bara du kan stoppa denna skrämmande metamorfos! Fördriv din rädsla och våga dig in till hjärtat av snåret i jakt på den falska guden!"
uw.dlgBerstuuk_Loose_1 = "När du kom till min dörr berättade du allt för mig utan ord! Jag kommer att dra i den här kunskapen som en tunn tråd tills det inte finns något kvar!"
uw.dlgBerstuuk_Story_1 = "Sly är där ute och knackar på ladugårdsdörren... Jag har sett mycket i skogen på natten, men det här är något nytt! Vad är det för fel på honom?"
uw.dlgBerstuuk_Story_10 = "Inte tillräckligt. Vetenskap är oförutsägbar – titta bara på mig! Gradvis accepterade jag skogen, men den fortsatte att vägra acceptera mig. Tills nu."
uw.dlgBerstuuk_Story_2 = "För dem som söker hjälp leder vägen till rätt dörr. Men Sly verkar ha gått vilse... Din gamla rackare, håll händerna i styr! Vad hände?"
uw.dlgBerstuuk_Story_3 = "Rackaren letade efter hjälp, och han hittade den. Låt oss gå till skogen innan den tar vad som rättmätigt är deras. Människors liv!"
uw.dlgBerstuuk_Story_4 = "’Människor’? Stackaren är i chock – han har inget ansikte! Vad skrämde honom så mycket att han drabbades av en plötslig samvetskris?"
uw.dlgBerstuuk_Story_5 = "Kan du höra fåglarna sjunga? Vid den här tiden borde de redan kvittra, men här finns det inget annat än dödstystnad... Vad mer lurar i den här skogen?"
uw.dlgBerstuuk_Story_6 = "Dödstystnad. Dödstystnad. Folk behöver hjälp. Du måste hj-ä-lpa till. Hjälp nu!"
uw.dlgBerstuuk_Story_7 = "Vid gudarna! Folk brukar inte förvandlas till torra kvistar och mossa, oavsett hur rädda de är! Vad är den där saken, och var är den riktiga Sly?!"
uw.dlgBerstuuk_Story_8 = "Han är här någonstans. Slys lilla sinne har varit mycket hjälpsamt. Han berättade för mig om dig, Shadow – om din speciella kraft. Och då slog det mig!"
uw.dlgBerstuuk_Story_9 = "Så det är dig varelsen pratade om? Skogen kommer att komma och ta ifrån dig. Och hur många av dessa 'rättmätiga' liv har du tagit, galning?"
uw.dlgBerstuuk_Win_1 = "Naturen hittar en utväg! Vår strid har sagt mig mer än du anar, Shadow. Skogen kommer att minnas. Den kommer att sluka mig för att återupplivas igen..."
uw.dlgFatumGreetings = "Ditt mod kan endast mätas med din dårskap. Men jag visste att du skulle komma, för du är mitt öde, och jag är ditt. Jag ska skriva om era öden – för alltid."
uw.dlgFatumLost = "Jag känner till mänskligheten. Ni vandrar upp och ner för samma spiral. Jag har sett det mer än en gång. Självförstörelse och tynande. Inget kan ändra det. Sådant är ert öde."
uw.dlgFatumStory1 = "Var försiktig, hjälte. Så här djupt slutar de universella lagar som du är van vid att fungera..."
uw.dlgFatumStory2 = "Precis! Håll pojken i koppel. Jag vet allt om era öden: vilka ni är och vart ni är på väg. Ska jag berätta vem som dör i slutet?"
uw.dlgFatumWin = "Ditt öde är beseglat. Du förlorade redan när du steg över tröskeln till min boning. Kommer du att ha tillräckligt med mod för att skriva om din historia?"
uw.dlgFungusGreetings = "Du har förgiftat landet, och nu dör mina svampar. De ska absorbera ditt sinne, och vi ska alla bli ett, människa. Det blir slutet på din historia!"
uw.dlgFungusLost = "Mina bröder har glömt bort sig själva i att leka gudar. Tillbedjan gör dem svaga. Men förstörelse ligger i mänsklighetens natur; världen blir bättre utan er."
uw.dlgFungusWin = "Gå er väg! Och frossa i de sista minuterna av era bräckliga liv!"
uw.dlgHW21LosePuppeteer_1 = "Jag skulle inte ens lita på dig i en stum roll, Shadow. Scenen är inte din plats – dra inte vanära över mitt hantverk!"
uw.dlgHW21StoryArkhos_1 = "Pesten är på väg till er stad, dödliga! Böj er för er guds makt! Och fröjda era ögon med guldets glans, annars..."
uw.dlgHW21StoryPuppeteer_1 = "Vad vet du om konst! Du har förstört mitt största projekt! Trots det... den tredje akten är på väg. Och i den drar hjälten sin sista suck!"
uw.dlgHW21StorySensei_1 = "Sedan när kommer underjordens gudar upp hit för att utpressa vanliga människor på pengar? Kasta masken, bedragare, innan vi tar till vapen!"
uw.dlgHW21StorySensei_2 = "Teater borde inspirera, inte förskräcka. Och du har förvrängt själva essensen av konst. Vi kommer att stoppa dig innan dina 'skådespelare' kommer till skada."
uw.dlgHW21StoryThief_1 = "Vänta! Det är jag... Sly! Slå mig inte! Han lovade att alla skulle frukta mig... Och ingen skulle känna igen mig. Hur avslöjade jag mig?"
uw.dlgHW21StoryThief_2 = "Ägaren till den kringresande teatern – Marionettspelaren. Han sa att det skulle bli hans bästa framträdande. Gudar bland människor! Det betydde ingenting för mig. Men pengarna, å andra sidan..."
uw.dlgHW21WinPuppeteer_1 = "Det här är ett fiasko! Du har förstört min underbara intrig och krossat mina masker! Hur ska jag kunna sätta upp en pjäs nu utan rekvisita..."
uw.dlgHW22EnterArchitect = "Allt det här med ditt fantasy-berättande har gjort mig utmattad... Nu ska vi spela efter mina regler. Och det ligger i ditt intresse att överraska mig, Shadow..."
uw.dlgHW22LooseArchitect_1 = "Det var väntat. Jag kan alla dina drag, Shadow. Det var trots allt jag som uppfann dig. Kanske var jag inte på topp då... Men nu kommer du att gilla ditt nya liv."
uw.dlgHW22StoryArchitect_1 = "Det är vad som kallas en 'klyscha', Marionettspelare. Vad får pjäsförfattare betalt för? Antalet symboler? Gestalten av det pladdrande galna geniet har blivit uttjatad, precis som hjältegestalten..."
uw.dlgHW22StoryArchitect_2 = "Det var det. Vi ska skriva om din värld från grunden! Samtida, kreativt, relevant! Vad gillar tonåringar nuförtiden? Varför säger du ingenting, Shadow? Åh, just det..."
uw.dlgHW22StoryPuppeteer_1 = "Det knackar – en oväntad knackning på din dörr! Är det en resenär som kommer på besök, eller något mer? Intrigant, eller hur?"
uw.dlgHW22StoryPuppeteer_2 = "Jag visste att du skulle säga så, gamle man. Vad kan man annars förvänta sig av påhittade karaktärer? Papper tål vad som helst... Men publiken kommer aldrig att göra det!"
uw.dlgHW22StoryPuppeteer_3 = "Jag är blott en slav under scenen, det är allt. Och mitt nya mästerverk kommer att handla om ett möte med skaparen – om förutbestämmelsens kval och den fria viljan..."
uw.dlgHW22StorySensei_1 = "Vad du än har hittat på, Marionettspelare, så tänker vi inte spela dina spel längre. Konst kan orsaka smärta, men inte på det sätt som du utövar den."
uw.dlgHW22StorySensei_2 = "Du har spelat teater för länge och kan inte längre skilja verkligheten från dina fantasier, aktör... Du är galen."
uw.dlgHW22StorySensei_3 = "Dina ord är märkliga och oroväckande, främling... Jag vet inte vilken galenskap som försiggår i ditt huvud, men Shadow kommer att slå ut den ur dig."
uw.dlgHW22WinArchitect_1 = "Kanske tillhör skapelsen inte längre sin skapare och har fått ett eget liv... Du har överraskat mig. Jag vill se vart historien tar vägen härnäst."
uw.dlgHoaxenGreetings = "Hela ditt liv är bara en illusion. Och vi är dess skapare. Vi ska driva dig till vansinne medan andra förlitar sig på råstyrka. Eld, vatten, sjukdomar – hah!"
uw.dlgHoaxenLost = "Var är du, broder? Jag kan inte höra din röst längre! Sannerligen, att vara inlåst helt ensam är värre än eld eller svärd... Gå, ni enfaldiga. Fadern väntar."
uw.dlgHoaxenStory1 = "”Vi”? Shadow, det verkar som om vår fiende har tappat förståndet. Ursäkta mig, vilken av dina personligheter talar vi med? Kanske din ”broder” kan vara mer rationell?"
uw.dlgHoaxenStory2 = "Skrattar du åt oss, människa? Min bror föreslår att era själar ska sändas till den eviga misärens avgrund... Då ska er värld ge vika, utan en enda droppe blod."
uw.dlgHoaxenWin = "Jag skulle ha dödat dig, för min nåd är sannerligen gränslös. Men min bror är mindre tolerant; du är fri att gå, såvida du inte tappar förståndet på vägen ut."
uw.dlgHunter_enter_hunter_1 = "Du! Hej duuu! Kommit för att avsluta det du påbörjadeee, va? Du? Det finns en kraft i dig. Den taaalar till mig. Tyst! Annars tvingar jag diiig!"
uw.dlgHunter_greeting_may_1 = "Titta! Det är något inuti kristallen... Ska det vara så där?"
uw.dlgHunter_greeting_saimon_1 = "Vad märkligt... Jag förväntade mig att Lazarus skulle mala ner Obelisken till damm. Jag fruktade blodbadet, men det verkar som om bara du och jag är kvar. Jag är fascinerad."
uw.dlgHunter_greeting_saimon_2 = "Koncentrationshallen. Ser du kristallen i mitten? Det är så Obelisken ackumulerar skuggenergi – mörkrets hjärta, så att säga."
uw.dlgHunter_greeting_sensei_1 = "Tystnad är ett dåligt omen, min rationelle vän. Den kan tala högre än de mest dövande av ord. Hmm... Var är vi? Vad är det här för bisarr plats?"
uw.dlgHunter_greeting_sensei_2 = "Jag tvivlar på det, min kära... Den här platsen ser annorlunda ut från när jag sist såg den. Jag börjar tro att den gamle mannen hade rätt..."
uw.dlgHunter_loose_hunter_1 = "Lägg dig neeerrr. Jag kommer att lämna diiiig här för alltttiiid. Orsaka inte meeeer skada."
uw.dlgHunter_win_hunter_1 = "Stopp, Shadow-människa! Låt det inte ssssprridaaaa sig! Du kommer att bliiii som hoooonooom. Du kommer att bli bedragaaaad! Men du har fortfarande en chaaaans."
uw.dlgIE21AnnounceAssistant_1 = "Vem i hela friden är det där? Vad gör du i vår värld, och varför ska vi ens lyssna på dig?"
uw.dlgIE21AnnounceAssistant_2 = "Ha! Jag vet inte var du kom ifrån, men du kommer inte att bli kvar här länge!"
uw.dlgIE21AnnounceAssistant_3 = "Hej Shadow, den här översittaren har gått för långt! Låt oss lära honom lite hyfs!"
uw.dlgIE21AnnounceBoss_1 = "Ni patetiska dödliga! Böj er för min vilja och härlighet, annars tvingar jag ner er på knä!"
uw.dlgIE21AnnounceBoss_2 = "Hur vågar du prata med mig på det där viset – jag är Ravana, erövraren av alla tre världarna!"
uw.dlgIE21AnnounceBoss_3 = "Det här är din sista chans att knäböja. Vägra, så tar jag ditt huvud!"
uw.dlgIE21AnnounceSensei_1 = "Shadow, jag känner ett mystiskt hot närma sig. Något ondskefullt har letat sig in i vår värld ännu en gång."
uw.dlgIE21Boss_After_Loose = "Om alla människor i den här världen är så svaga, då är dess erövring bara en tidsfråga!"
uw.dlgIE21Boss_After_Win = "DÅRAR! Jag drar mig tillbaka för tillfället, men ni kommer inte att besegra mig så lätt. Jag kommer att återvända!"
uw.dlgIndia22Story_May_1 = "Och så började ni svälta... Vad kunde denna demon ha velat ha på ert glada firande? Hur kunde ödmjuka bönder locka till sig ett sådant rovdjur?"
uw.dlgIndia22Story_Rakshasa_1 = "Du har en intressant doft, människa. Utan tvekan skulle du smaka lika bra! Hör du min mage kurra? En fin köttbit till mitt ris skulle vara mycket välkommen!"
uw.dlgIndia22Story_Rakshasa_Lose = "Som tur är för dig har vår strid slitit ut mig. Dessutom är min hunger mättad... för tillfället. Jag ska bygga upp en ny aptit och jaga igen!"
uw.dlgIndia22Story_Sensei_1 = "Berätta om honom, resenär. På dina kläder kan jag se att du har rest långt. Vilket elände plågar ditt hem?"
uw.dlgIndia22Story_Sensei_2 = "Stilla din aptit, demon! Det blir ingen inbjudan till livets fest för den som stjäl själva livet!"
uw.dlgIndia22Story_Sensei_Win = "Det är inte magi som får en trädgård att blomma – det är hårt arbete. Och det ska du själv få bevisa: hjälp dina grannar att återställa sin gård, annars..."
uw.dlgIndia22Story_Sitaram_1 = "Jag har hört din livshistoria. Må gudarna belöna dig efter dina meriter! Jag har dåliga nyheter: en ond ande har dykt upp i mina länder..."
uw.dlgIndia22Story_Sitaram_2 = "Denna demons ondska matchas bara av dess hunger! Vi förberedde oss för att fira Bohag Bihu när, plötsligt, denna... varelse dök upp och slukade alla våra plantor!"
uw.dlgIndia22Story_Sitaram_3 = "Med Agni som mitt vittne, min dam, jag ställer mig samma fråga! Nu väntar vi i skräck på solnedgången... Följ med mig, jag ber dig!"
uw.dlgIndia24_Enter_Puppet_1 = "Har du den anda som krävs för att styra ödet? Avgör mitt, den ödmjuka tjänare av konsterna som jag är. Endast i strid förstår du verkligen hur saker ligger till. Var djärv, Shadow – attackera!"
uw.dlgIndia24_Story_Dandy_1 = "Öppna, annars slår jag in den här förbannade dörren! Jag vet att ni är hemma – jag kan höra er! Jag tänker tända eld på den här rucklet om ni inte ger mig tak över huvudet!"
uw.dlgIndia24_Story_Loose_Nrityu_1 = "Åh, hur ihärdigt dödliga klamrar sig fast vid livet. Det var inte jag som valde det här arbetet, och jag ska inte fälla giftiga tårar över det... Varför har du gjort detta mot mig?"
uw.dlgIndia24_Story_Loose_Puppet_2 = "Hennes hjärta är fyllt med kärlek. Gudarna skapar oss rena, men vi väljer vår egen väg. Nrityu börjar förstå detta när hon lyssnar till flickans historia."
uw.dlgIndia24_Story_Loose_Puppet_3 = "Shadow, ditt framträdande saknar passion och engagemang. Jag ska ge dig en chans till. Spela det inte – lev det!"
uw.dlgIndia24_Story_Puppet_1 = "Knack, knack! Hej, gamla vänner! Ödets röst är över oss – och hon är på väg! Hennes röda fåll pyr som själva livet i slutet av dagen!"
uw.dlgIndia24_Story_Puppet_2 = "Är det för din själ som hon har kommit? Skåda en saga lika uråldrig som världen själv – legenden om Nrityu, vars öde det var att vara en tagare av liv."
uw.dlgIndia24_Story_Puppet_3 = "Spökena bara pladdrar. Du kan inte lita på dem. Och dessutom är det inte deras historia att berätta. Jag kommer att visa dig sanningen genom hennes ögon. Shadow, du är den enda som kan förstå."
uw.dlgIndia24_Story_Sensei_1 = "Den rösten... Det verkar som om vår gamla motståndare har något i kikaren igen. Vem blir offret den här gången? Jag ser en man springa mot pagoden..."
uw.dlgIndia24_Story_Sensei_2 = "Dina kläder är täckta av smuts och sot, främling. Och din ton gör mig orolig. Förklara vem du är och vad du har för ärende vid vår dörr!"
uw.dlgIndia24_Story_Win_Faradeya_1 = "Håll er tillbaka! Jag ville inte det här! Min familj var rädd för mig, och jag trodde att det här var min chans... Dandy lovade att ta med mig, om jag bara hjälpte till..."
uw.dlgIndia24_Story_Win_Nrityu_1 = "Sådär! Du faller i evig sömn, fast du inte förtjänar det. Men det är inte min sak att döma dig – det är någon annans kall. Jag är blott eskortören."
uw.dlgIndia24_Story_Win_Puppet_4 = "Precis som du, Shadow. Jag vill att du följer Nrityus väg. Det tog henne en evighet att förstå sin plats."
uw.dlgIndia24_Story_Win_Puppet_6 = "Showen fortsätter! Du, Shadow, kommer att bli stjärnan, och mina skådespelare kommer att vara dina biroller. Berättelsen om Nrityu kommer att bli vår största uppsättning!"
uw.dlgIndia24_Story_Win_Sensei_1 = "Den här historien stikker djupt – till och med för dig. Jag är överraskad! Men vad är moralen här? Varför visar du detta för oss?"
uw.dlgMegalithGreetings = "Denna gruva är en helig plats. Varför är du här? Gå och möt ditt öde med heder. Det sista du kommer att höra är jorden som skälver under dina fötter."
uw.dlgMegalithLost = "Förbannelse! Måste jag vänta i tusentals år igen? Jag har flyttat kontinenter! Att rena jorden var min uppgift!"
uw.dlgMegalithWin = "Jag har behandlat människor väl, ett sällsynt drag bland de Eviga. Jag hjälpte er art många gånger. Så spring och ta ett sista farväl av dina nära och kära!"
uw.dlgRaidIntro1 = "Försöker du rätta till ditt misstag? Du öppnade portarna, but endast de Eviga kan eliminera skuggsmittan. Eftersom du inte är en av oss, är du svag."
uw.dlgRaidIntro2 = "Du kommer att dö, precis som alla andra. Magma rinner genom mina ådror, och den kommer att täcka hela landet och rena det för nytt liv."
uw.dlgRaidStory1 = "Vad är detta för källare, och vad gör vi här?"
uw.dlgRaidStory2 = "Detta är förrummet till de Evigas domän. Deras sömn varade i årtusenden, men Skuggportarna har satt världen i fara. De har vaknat."
uw.dlgRaidStory3 = "Häftigt – det betyder att de kommer att hjälpa oss att ta hand om portarna snabbt och enkelt!"
uw.dlgRaidStory4 = "Åh, nej. De kommer att förstöra portarna, men de kommer också att utplåna hela mänskligheten. För dem är det bara ännu en cykel av förstörelse och skapelse."
uw.dlgShurale_Announce = "Skogsanden har väckts av giriga banditer och utkräver nu sin hämnd på de oskyldiga. Varelsen söker efter det stulna skrinet med minnen – kärlet för dess uråldriga magi. Endast de vars hjärtan hyser sann sorg kan stilla varelsens vrede. Priset kommer dock att bli högt..."
uw.dlgStoryBtnFight = "STRID!"
uw.dlgStoryBtnMore = "MER"
uw.dlgVolcanoGreetings = "Av alla de Eviga var jag den förste att vakna. Många kämpar kommer att dö för min hand, jag ska fullborda mitt uppdrag."
uw.dlgVolcanoLost = "Nog! Jag ger mig. Men vet detta: du har väckt min bror. Låt dig inte luras av hans yttre, för han är snabb och dödlig!"
uw.dlgVolcanoStory1 = "Jag såg några halvruinerade bostäder och en enorm staty. Bor det människor här?"
uw.dlgVolcanoStory2 = "Endast fanatiker. De tillber de Eviga i hopp om att bli skonade. Sannerligen, de är blinda i sin tro. Om vi misslyckas kommer de snart att få veta sanningen."
uw.dlgVolcanoWin = "Jag har sagt till mina bröder att det är min plikt att bestämma planetens öde. Se på, otrogna, när min eld täcker landet!"
uw.dlgVortexGreetings = "Mörka vatten kommer att sluka jorden och Skuggportarna! Deras hemlighet kommer att gå förlorad i avgrunden. Och det kommer inte att finnas någon kvar på ytan som kan berätta den!"
uw.dlgVortexLost = "För första gången på tusen år vinner en människa. Din vilja att leva är så stark! Men vad du än gör kommer slutet att bli detsamma: du kommer att dö."
uw.dlgVortexWin = "I tusentals år har jag sett ditt släktes tynande. Det finns en viss skönhet i det. Jag tror jag ska hålla dig vid liv – bara för skojs skull."
uw.dlgWhisperGreetings = "Det verkar som om någon inte kan vänta med att upptäcka sitt öde. Ge mig din hand och stirra in i spegeln!"
uw.dlgWhisperLost = "Är du fortfarande vid liv? Då är du ännu inte i min makt! Fatum ska spå ditt öde, och sedan ska jag återvända till min värld – efter att ha varnat dig för att vara försiktig med speglar!"
uw.dlgWhisperWin = "Jag ska ta dig med mig in i askans, andens och den eviga nattens rike! Lita på mig – se mig i ögonen och titta inte bort."
uw.dlg_American_25_Loose_1 = "Du vet inte vem du beskyddar, Shadow. De kommer inte att tacka dig. De kommer bara att hånle bakom din rygg. Vildar... och jag är monstret?"
uw.dlg_American_25_Story_1 = "May är borta. Tagen av något knappt mänskligt. Ändå fanns det inga skrik, inga tecken på strid... som om hon hade gått av egen fri vilja."
uw.dlg_American_25_Story_2 = "Vi är inte ensamma om detta. Andra som May – unga, starka – har också försvunnit. Hon kände att det var på väg... och fyllde sina fickor med krut."
uw.dlg_American_25_Story_3 = "Hennes spår är tydliga. Vi måste hitta henne innan regnet kommer, annars går de förlorade för alltid. Kom, Shadow!"
uw.dlg_American_25_Story_4 = "Jag kände lukten av dig sekunden du satte din fot på denna förbannade mark. Varför har du kommit? För att trampa på min sorg? Du har ingen heder – precis som de saknade heder."
uw.dlg_American_25_Story_5 = "Jag visste att du skulle dyka upp, schaman. Ge tillbaka barnen till deras släktingar, och vår vän till oss. Gå sedan och ruttna på ditt berg av aska."
uw.dlg_American_25_Story_6 = "Aska till aska. Och till aska ska du återvända, dödlige..."
uw.dlg_American_25_Win_1 = "Vänta! Jag följde med honom frivilligt. Hans skepnad är djurlik, ja – men hans hjärta är mänskligt. Och det lider... De stal hans barn!"
uw.dlg_CHN_NY25_Announce = "Fördjupa dig i berättelsen om en hjälte från svunna tider – red ut sanningen från fabeln och hjälp till att smida en ny legend! Stå emot en mystisk kult som använder en stor hjältes namn som täckmantel för sina grymheter! Återvänd till platsen där allt började och hjälp en flyende rackare att upptäcka sitt sanna hjältemod!"
uw.dlg_CHN_NY25_Loose_1 = "Nej, vi måste fortsätta kämpa! Ingen skulle tro att en enkel bonde så lätt kan besegra en ondskefull kult. Du måste ge allt du har!"
uw.dlg_CHN_NY25_Story_1 = "Solkulten har en tradition av att besöka sin stora hjältes födelseplats en gång om året. Men varje gång slutar det i katastrof..."
uw.dlg_CHN_NY25_Story_2 = "Föddes han som människa? Vad märkligt. Det verkar som om dessa människor inte kommer med några gåvor till byn..."
uw.dlg_CHN_NY25_Story_3 = "De lämnar ingenting orört! De stjäl boskap från byborna, skövlar grödor i fyllerus, krossar fönster och startar bråk!"
uw.dlg_CHN_NY25_Story_4 = "Men varför slår byborna inte tillbaka? Det här är deras land och deras legend!"
uw.dlg_CHN_NY25_Story_5 = "De är knäckta. Hjälten som gav dem hopp är borta, och kultmedlemmarna begår ondska i hans namn. Vi måste ge dem hopp igen!"
uw.dlg_CHN_NY25_Story_6 = "Säg att du har kommit för att kontrollera att allt är redo för 'högtiden'. Och vi ska slåss! Stadsborna kommer att se att man kan konfrontera kulten!"
uw.dlg_CHN_NY25_Story_7 = "Nåväl, som du vill... Låt mig gå in i rollen. 'Hej, pojk, hur vågar du bära vår hjältes klädnad! Försvinn – vi har en fest att förbereda!'"
uw.dlg_CHN_NY25_Story_8 = "Jag kanske inte är en mytomspunnen hjälte, men hans ande lever i det här landet! Han kommer att vägleda mig i min mörkaste stund och ge mig mod! Attack!"
uw.dlg_CHN_NY25_Win_1 = "Jag förväntade mig inte en sådan snabbhet från en vanlig människa... Du besegrade nästan vår mästare! Vi måste statuera ett exempel av dig, så att andra inte får några idéer..."
uw.dlg_NY25_Loose_1 = "Dina minnen är starka, och sorgen talar högre än förnuftet. Du ska stanna här med mig. Vila en stund – sömnen kommer snart."
uw.dlg_NY25_Story_1 = "Välkomna! Den här stugan tillhörde en gång min familj. Så många minnen... Stanna så länge ni vill. Här finns allt ni behöver för att vila."
uw.dlg_NY25_Story_2 = "Men du har utsatt oss för fara så många gånger, och nu erbjuder du oss att bo i ditt familjehem? Är det här något slags trick?"
uw.dlg_NY25_Story_3 = "Det är bara samvetets röst som talar! Jag har insett att jag har utnyttjat andras vänlighet för länge. Men nu vill jag göra gott."
uw.dlg_NY25_Story_4 = "Vi är inte ensamma... Det samlas människor utanför stugan. Vad vill de så här dags? De ropar på oss att komma ut."
uw.dlg_NY25_Story_5 = "Gör det inte! Vålnaderna kommer att förgöra er! De är bara spöken av smärtsamma minnen. Skogsanden har kommit för sin kista! Låt oss hämta den!"
uw.dlg_NY25_Story_6 = "En kista? Så det är därför folk har försvunnit i skogen! Varför förrådde du oss, Sly? Vi skulle ändå ha hjälpt dig med detta ädla uppdrag!"
uw.dlg_NY25_Story_7 = "Du förstår inte. Om jag hör hennes röst kommer jag att tappa kontrollen – och då är jag också borta. Så länge jag bär en del av henne med mig."
uw.dlg_NY25_Story_8 = "Öppna dörren, jag fryser ihjäl här ute, pappa. Huset är kallt och jag är inte där inne. Jag ska visa dig en plats där vi kan vara tillsammans igen."
uw.dlg_NY25_Story_9 = "Stanna! Gå inte in i skogen – du kommer att gå vilse! Jag vet inte vems röst du hör, men den är verkligen inte mänsklig!"
uw.dlg_NY25_Win_1 = "Vakna, Sly! Ge tillbaka kistan till anden medan den är svag. Låt den se att mänskligheten kan övervinna sin egen girighet."
uw.saturn_enter_saturn_1 = "Jag ska trycka ner dina ord i halsen på dig. Och dina vänner kommer att få titta på. Enda sättet att lämna mitt fängelse är via schavotten. Vem vill gå först?"
uw.saturn_greeting_saimon_1 = "Vår härskare, Patriarken, studerade portalen i åratal. Sedan, en dag, drog han sig undan. Senare reste han Obelisken, och den gjorde något med vår värld..."
uw.saturn_greeting_saimon_2 = "Shadow liknar Obelisken på molekylär nivå. Det finns någon som kommer att hjälpa oss att använda det mot Patriarken. Det är därför vi är här, i Saturnus kammare..."
uw.saturn_greeting_saimon_3 = "Tusen ursäkter, min dam. Icke desto mindre måste vi frita Lazarus. Snälla visa oss till hans cell, så ska vi inte besvära dig ytterligare."
uw.saturn_greeting_saturn_1 = "Ska ni långt, barn? Ni kom till mitt fängelse av egen fri vilja! Jag undrar – är det mod eller dumhet? Du, den gänglige – svara mig!"
uw.saturn_greetingn_May_1 = "Men vad har det med oss att göra?"
uw.saturn_lose_saturn_1 = "Det räcker för er. Om Lazarus umgås med avskrap som ni, utgör han ingen fara för Patriarken. Försvinn härifrån, snorungar! Ni står inte på min lista."
uw.saturn_win_saturn_1 = "Ni kommer aldrig att hitta Lazarus. Den rackaren rymde från mitt fängelse och flydde till träsken. Vill ni också gå under? Ge er då iväg efter honom!"
uw.summerfest25_story2_1 = "Jaså... Du har varit så ivrig att hitta mig, så jag tänkte att jag skulle göra dig den tjänsten. Dessutom väntade alla på det här ögonblicket."
uw.summerfest25_story2_2 = "’Alla’? Sluta spela. Vi vet exakt vem du är – och hur du utnyttjar andra bara för att gotta dig i deras elände."
uw.summerfest25_story2_3 = "Bara ett litet inhopp, och boom – jag är trendig! Ärligt talat förväntade jag mig inte att bli så här populär."
uw.summerfest25_story2_4 = "Din kvickhet kommer inte att rädda dig. Du kommer att få betala – för mina ögon, och för all ondska du har gjort. Ditt vridna spel om att leka gud slutar här!"
uw.summerfest25_story2_5 = "Allvarligt, Ermine? Det där snacket dog ut med viktelefonerna. Det är 2026 – försök hänga med i tiden."
uw.summerfest25_story2_6 = "Vad Arkitekten än planerar... så finns det ett mörker omkring honom. En kraft så ondskefull att den nästan är påtaglig."
uw.summerfest25_story2_7 = "För varje ord han säger finner jag mig själv tro mer och mer på Ermines historia. Arkitekten är farlig – och han måste stoppas."
uw.summerfest25_story2_defeat_1 = "Åh nej – vad nedslående! Publiken förväntade sig mer. Det verkar som om jag helt enkelt får höja insatserna nästa gång."
uw.summerfest25_story2_win_1 = "Varför är världen så grym? Varför måste vi lida? Varför var jag tvungen att förblinda mig själv? Svara mig, Arkitekt – varför gör det ont att leva!?"
uw.tutorial_ascention_intro_title = "DOCKMÄSTARE"
