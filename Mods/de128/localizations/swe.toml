uw.Tenebris_greetings_1 = "Du befinner dig på verklighetens rand, resenär. Detta är den sista utposten. Bortom denna linje finns tomheten i vilken världar föds. Och det var jag som smidde deras ljus och mörker!"
uw.Tenebris_greetings_2 = "Shadow, portalen bakom honom kan vara vår chans till räddning. De eviga sa am de skulle förgöra vår värld. Kanske med hans hjälp?"
uw.Tenebris_greetings_3 = "Du kommer inte att överleva portalen! Det är terra incognita. Mörkret i vilket världar kan skapas. Men du kan inte skapa, bara förgöra. Portalen kommer att sluka dig hel!"
uw.Tenebris_greetings_4 = "Det är en risk, maen har vi något annat val? Vi kanske kan stoppa de eviga genom att gå in i portalen. Men vi kan också orsaka en stor katastrof."
uw.Tenebris_loses = "Är du rädd för det okända som lurar i mörkret? Nu lämnas du att möta det helt själv! Världen faller till damm och föds på nytt. Den följer spiralen."
uw.Tenebris_wins = "Envise dåre! Ni människor kan bara lösa problem med råstyrka. Men universum fungerar inte så. Alla dessa år, och du har ingenting lärt dig..."
uw.Title_Sitaram = "SITARAM"
uw.War_AfterLoss = "Res dig, marionett! Och strid! Det spelar ingen roll om du vinner eller förlorar. När du strider tjänar du mig!"
uw.War_AfterWin = "Bedragare! Var är ditt raseri? Hur kan du strida utan det? Kämpa mot mig! Låt oss börja ännu en klingornas dans! Jag vet att kriget lever inom dig!"
uw.War_Greetings1 = "Vilken underbar dag! Jag kan känna en strid nalkas, likt en storm. Åska. Legionernas obeskrivliga raseri som håller jämna steg. De är alla gåvor på mitt altare!"
uw.War_Greetings2 = "Raseri och blodstörst sjuder inom henne. Hon njuter av ändlösa strider, men till vilken nytta? Vad kommer hon att finna på toppen av sitt berg av dödsskallar?"
uw.War_Greetings3 = "Är spänningen i en blodig strid så främmande för dig? Eld, passion, stormig kraft! Visa vad du går för! Underhåll mig i tvekamp eller dö!"
uw.ZONE_RAID = "Undervärlden: Nivå 1"
uw.ZONE_RAID1 = "Undervärlden: Nivå 2"
uw.ZONE_RAID2 = "Undervärlden: Nivå 3"
