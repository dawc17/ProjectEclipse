# BEGIN Sensei sensei.defeat.
sensei.defeat.OK = "OK"
sensei.defeat.Sensei_defeat1 = "Nej, vänta... Det gick inte till på det viset... Ursäkta en gammal mans glömska."
sensei.defeat.Sensei_defeat2 = "Jag tror det hände på ett annat sätt... Minnen kan vara väldigt bräckliga."
sensei.defeat.Sensei_defeat3 = "Jag tror inte att det var så den striden slutade. Låt mig försöka minnas..."
sensei.defeat.Sensei_defeat4 = "Mina minnen är så vaga... Jag tror att jag vann den striden."
sensei.defeat.Sensei_defeat5 = "Nej, det var inte så. Det verkar som om jag vann då... troligtvis."
sensei.defeat.characterSensei = "SENSEI"
