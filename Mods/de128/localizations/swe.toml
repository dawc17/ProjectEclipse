uw.blackness_enter_blackness_1 = "Avkomma. Ett stort offer. En sfär. Sinnet. Slakt. Jag känner. Du kommer att spilla blod. Jag ser smärta. Jag ser framtiden. Jag ska visa dig."
uw.blackness_greeting_blackness_1 = "Vad är det, Shadow? Mår du inte bra?"
uw.blackness_greeting_lazarus_2 = "Simon? Vilken jävel du är! Varför tog du hit folk? Den kommer att fånga doften av era tankar! Försvinn härifrån innan Mörkret smakar på ert medvetande!"
uw.blackness_greeting_may_1 = "Hör du det? Ingenting! Tystnad. Utan fågelsång är det som om den här platsen är frusen i bärnsten. Gör vi rätt? Jag har en väldigt dålig magkänsla..."
uw.blackness_greeting_saimon_2 = "Dessa fina herrar är din biljett till frihet, min käre. Den stora i svart är på något sätt kopplad till Obelisken och Portarna. Han hjälper dig, och du hjälper honom."
uw.blackness_greetingn_saimon_1 = "Inte konstigt. Ända sedan ett fragment av de uråldriga Portarna kraschade här, har livet på denna plats varit en statistisk anomali. Håll ögonen öppna – vi måste hitta Lazarus."
uw.blackness_lose_blackness_1 = "Du stannar här. I evighet. Ett blod. För alltid. Jag ska läsa dig. Jag ska äta."
uw.blackness_win_sensei = "Du ljög för oss, vetenskapsman! Vem har vi släppt fri? Vad har vi dömt den här världen till? Inser du vad du har gjort?!"
