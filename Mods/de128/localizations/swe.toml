sensei.entry.character_Sadist = "PLÅGA"
sensei.entry.character_Savage = "GNISTA"
sensei.entry.character_Sister = "ASTER"
sensei.entry.dlgStoryBtnFight = "STRID!"
# END Sensei sensei.entry.

# BEGIN Sensei sensei.notify.
sensei.notify.ending = "Jag kom ihåg vad som hände i slutet. Ska vi återgå till min berättelse?"
sensei.notify.intro = "Platsen väcker en del minnen till liv. Jag ska berätta min historia för dig — en som utspelade sig för många år sedan..."
sensei.notify.more = "Jag kom ihåg något mer. Ska vi återgå till min berättelse?"
sensei.notify.title = "SENSEI"
# END Sensei sensei.notify.

# BEGIN Sensei sensei.victory.
sensei.victory.Ancient_zone6_1 = "Du drömmer inte. Jag har stannat tiden för att ta sfären tillbaka till skuggorna. Dess närvaro här var ett misstag — orsakat av instabiliteten hos Skuggornas portar."
sensei.victory.Ancient_zone6_2 = "Förändring är nära förestående, människa. Sov för nu. När du vaknar kommer ingen att komma ihåg din bedrift. Det måste vara så. En dag kommer du att förstå..."
sensei.victory.Butcher_zone3_3 = "He-he! Titta på prinsen som lägger benen på ryggen! Du skulle ha sett ditt ansikte, gamle man. Ser du? Din nya vän är en ryggradslös lögnare!"
sensei.victory.Butcher_zone3_4 = "Jag vet att så fort prinsen drar sin sista suck kommer Shogun inte att låta mig leva. Jag är bara ett verktyg — umbärlig. Så... jag ska hjälpa er."
sensei.victory.Butcher_zone3_5 = "En viss kvinna övertygade Shogun om att tronen är hans enligt lag. She lovade att han ska få sfären och bli en stor krigsherre — allt i utbyte mot att han är hennes länsherre."
sensei.victory.Butcher_zone3_6 = "Gå till hamnen. Shogun väntar på att ett skepp ska anlända — det som för med sig sfären. Det är prinsens sista chans att återta sin tron."
sensei.victory.Hermit_zone2_3 = "Försök att förstå — vår konst är vid sitt slut! För att överleva måste den förändras. Jag vet hur, och Shogun has lovat mig skydd i utbyte mot att jag tränar hans män."
sensei.victory.Hermit_zone2_4 = "Butcher håller till med sitt gäng inte långt härifrån. De var dina kidnappare, ers höghet. Gå — må du finna svaren du söker."
sensei.victory.NAME_BUTCHER = "SLAKTARE"
sensei.victory.NAME_HERMIT = "EREMIT"
sensei.victory.NAME_PRINCE = "PRINS"
sensei.victory.NAME_WASP = "GETING"
sensei.victory.NAME_WIDOW = "ÄNKA"
sensei.victory.OK = "OK"
sensei.victory.Prince_zone1_1 = "Tack! Du är ädel — få skulle stå upp för någon de inte känner. I trodde att döden var nära — de här människorna vet ingenting om barmhärtighet."
sensei.victory.Prince_zone1_2 = "Jag fick reda på något som jag inte borde ha gjort: mina soldater har studerat förbjudna riter under en viss Hermit. De ville eliminera mig som vittne..."
sensei.victory.Prince_zone1_3 = "Jag tog med mig en enhet män till honom för att klargöra saken, men jag togs till fånga. Men turen var fortfarande på min sida och jag lyckades fly."
sensei.victory.Prince_zone2_1 = "Mina män! Att placera honom i spetsen för min armé var ett misstag... Om du fortfarande har ens ett spår av ära, berätta för oss var banditernas läger ligger!"
sensei.victory.Sensei_arc_outro = "Slut."
sensei.victory.Sensei_zone1_1 = "För många sammanträffanden. Någon visste om vårt besök och varnade banditerna. But hur är Hermit inblandad? Vi måste ta reda på det. Vi går!"
sensei.victory.Sensei_zone2_1 = "Skäms på dig! Att sälja din ära så där! Och för vad? Tror du att folk kommer att följa en förrädares ledning? Är det ett bra exempel för de unga?"
sensei.victory.Sensei_zone3_2 = "Svara mig: varför vill Shogun se honom död, och vad är den magiska sfär du pratade om?"
sensei.victory.Sensei_zone4_2 = "Vi must stoppa Prinsen innan han hittar Widow... och sfären..."
sensei.victory.Sensei_zone5_1 = "Jag känner med dig — det gör jag verkligen. Men ett krossat hjärta är en dålig rådgivare. Snälla förstå: det finns människor som lider på grund av dig."
sensei.victory.Sensei_zone6_2 = "Vänta! Jag har så många frågor! Vem är du? Vad finns där ute, bakom portarna? Jag vill veta..."
sensei.victory.Wasp_zone4_3 = "Vänta — jag underskattade dig, gamle man! Jag fick betalt för leveransen, men jag har inget intresse av att slåss för Widows ära. Jag ska visa dig till hennes gömställe!"
sensei.victory.Wasp_zone4_4 = "Widow älskade prinsen, men han avvisade henne. Sedan hittade hon en ny leksak: Shogun. Häxan använder den där korkade krigsherren för sin hämnd."
sensei.victory.Wasp_zone4_5 = "Widow vill styra män och spela ut dem mot varandra. Sfären ska göra hennes utvalda stor... och absolut lojal mot henne."
sensei.victory.Widow_zone5_3 = "Det finns ingen återvändo for mig. Jag ser att du vill hjälpa till, men det är för sent — prinsen har redan tagit sfären. Shogun försökte försvara den, men förgäves."
sensei.victory.Widow_zone5_4 = "Jag har aldrig sett prinsen så... vild. Hans ögon flammade! He tyckte det skulle vara roligt att avrätta en förrädare på den plats där vi först möttes. Jag ska visa dig..."
sensei.victory.characterAncient = "URÅLDRIG"
sensei.victory.characterSensei = "SENSEI"
# END Sensei sensei.victory.

