uw.DEMON_RAID_Title = "Gatlopp"
uw.EARTHQUAKE = "Periodiska jordbävningar."
uw.EnterPortal_ActScreen = "Portal"
uw.FRAGILITY = "Ökad sårbarhet inom det visade området."
uw.Gatekeeper_greetings_1 = "Konstig luft? Konstig luft! Kooooonstig luft!"
uw.Gatekeeper_greetings_2 = "Inte glada, inte glada, inte glada! Vi gjorde, vi gjorde, vi gjorde!"
uw.Gatekeeper_greetings_Assistant_1 = "Shadow! Du är äntligen vaken!"
uw.Gatekeeper_greetings_Assistant_2 = "Det är så kallt här! Jag känner redan inte mina fingrar... Var är vi? Luften känns så konstig."
uw.Gatekeeper_greetings_Assistant_3 = "Men varför känns det som om den förstår oss?"
uw.Gatekeeper_greetings_Sensei = "Håll dig tillbaka, May! Vi vet inte vad den vill! De Odödligas värld skakades mer än jag trodde. Efter vad vi gjorde är de inte glada att vi är här."
uw.Gatekeeper_greetings_Sensei_2 = "Lugn nu – gör inga plötsliga rörelser. Det verkar som att denna varelse inte är särskilt intelligent."
uw.Gatekeeper_greetings_Sensei_3 = "Det är inte viktigt just nu. Att passera genom portalen var vårt val, och vi måste svara för det. Den vill ha en strid – vi har inget val, Shadow."
uw.Gatekeeper_lost_Saimon = "Jag förväntade mig mer av portalen... Det verkar som om resan dränerade din styrka och dina molekylära bindningar är försvagade. Intressant – vi måste utföra några fler tester."
uw.Gatekeeper_win_Saimon = "I århundraden har denna skrangliga portal påmint oss om att det finns krafter bortom vårt förstånd. Sedan kom du..."
uw.HARD_GROUND = "När du faller till marken tar du skada."
uw.HEAD_BERSTUUK = "Berstuuks mask"
uw.HEALTH_DROPS = "Hälsan sjunker över tid."
uw.HOT_GROUND = "Het mark."
uw.HW20Arkhos1 = "Jag behöver ingen framsynthet för att se att trons eld kommer att förtära både de svaga och de blinda. Jag har tagit med svarta ljus, så att alla kan se denna sanning lika tydligt som jag!"
uw.HW20Fatum1 = "Gränserna mellan världarna blir tunnare – det här är den bästa natten för profetior! Luften surrar av magi, och i mina händer ligger själva ödes trådar hoprullade!"
uw.HW20Fatum2 = "Spådomar är ett spel för mig – jag kan göra vad jag vill med de dödligas öden. Men ni, mina vänner, är en helt annan sak. Snälla, slå er ner!"
uw.HW20Fatum3 = "Du har blivit förblindad av ditt hat. Låt oss börja. Tala inte, utan lyssna. Jag ser en gestalt... svart som natten... fjädrar och aska... som tar min hand..."
uw.HW20Fatum4 = "Hur... hur kom du hit? Vägen till denna värld förseglades för dig!"
uw.HW20Megalith1 = "Du pratade om spådom och en maskerad, så jag tog med en magisk spegel. För första gången på tusen år kan jag se min spegelbild. Den här masken får mig att se uråldrig ut!"
uw.HW20Whisper1 = "Har du lekt med profetior, lillasyster? Tagit hand om dödliga öden? Sådana leksaker har alltid varit bara mina!"
uw.HW20Whisper2 = "Förseglad var den! Men du ropade, och genom denna fantastiska spegel kom jag. Jag tar den med mig. Se till att hälsa på, och hör några sanna spådomar!"
uw.Hunger_AfterLoss = "Efterssom du ärrr den utvalde ska jag ge dig en sista chans att stanna hos mig och festa. Annarrrs kommer dina ben att falla för att förena sig med de andra i dammet."
uw.Hunger_AfterWin = "Skapare, du sände mig föda, men det är inte nog. Min hunger är evig, skänk mig befrielse..."
uw.Hunger_Greetings1 = "Du har färdats en ganska lång väg för att komma hit. Varför? För att rädda de otacksamma dödliga? De bryr sig inte ett skvatt om dig! Jag kan känna din ensamhet, din hunger och din... rrrädsla."
uw.Hunger_Greetings2 = "Shadow, låt dig inte luras! Han verkar bara svag. Du är inte hans vän, du är bara hans byte. Han kommer att slita dig i stycken om du går närmare!"
uw.Hunger_Greetings3 = "Kan du se mina bröder? De törrrstar, men deras törst är av ett annat slag. De trånar efter underrrhållning. Men deras hunger är ingenting jämfört med min!"
uw.INVERTED_JOYSTICK = "Omvänd rörelse."
uw.LIGHT_IN_THE_DARK = "Ljus i mörkret"
uw.MERCENARY_RAID = "LEO-{br}KNÄKTAR"
uw.MERCENARY_RAID_Title = "Leoknektar"
uw.MiniEventAnnounce = "Sedan urminnes tider har en kult bott i jordens innandöme och vakat över underjordsgudarnas känsliga slummer och förhindrat deras uppvaknande. Men priset är en grym rituell strid som utkämpas till sista blodsdroppen."
uw.MiniEventHungerFight_Enter_1 = "Här under jorden är allting annorlunda. Vi kämpar för att överleva, och käk är livet! Beröva inte ditt folk – eller mitt – denna stora glädje!"
uw.MiniEventHungerStory_1 = "Folket bryr sig om andarnas nycker först när problem drabbar deras hem. Deras grödor vissnar, deras barn går hungriga... Och var är deras tro nu?"
uw.MiniEventHungerStory_2 = "Hungern har en form. Dess törst efter att konsumera är fruktansvärd. Men det är Karcers roll, medan din och min är att hindra honom från att vakna ur sin sekellånga dvala."
uw.MiniEventHunger_Loss_1 = "Lärde inte din mamma dig att inte lämna något på tallriken? Det märks – det finns hunger i dina ögon! Eller... vad är det för fel på dig?"
uw.MiniEventHunger_Win_1 = "Ja, du slår bra, Shadow... Låt oss fira din seger med lite rejält käk! Jag bjuder!"
uw.MiniEventStory_1 = "Jag ser att du, Shadow, är stark och ståndaktig i anden. Legenderna om dina bedrifter är vida spridda. Skulle du vilja bli en del av ännu en?"
uw.MiniEventStory_2 = "Underjordens andar är egensinniga. Vi utför en ceremoni för att tygla deras humör – rituella strider! Ditt deltagande skulle vara en ära för oss."
uw.MiniEventStory_EnterBattle = "Är du inte lite väl klen för ett så obskyrt spektakel? Och du valde den här, på riktigt? Är det här en mytomspunnen man? Åh, andarna kommer att bli rasande..."
uw.MiniEventStory_Loss_1 = "Ja, okej... Jag vill tro att till och med andarna har ett sinne för humor, och att de bara kommer att skratta åt vårt famlande på arenan, istället för att släppa loss sin vrede över oss..."
uw.MiniEventStory_Win_1 = "Tja... Ingen kommer till den här arenan av en slump. Du är verkligen en mytomspunnen man, Shadow."
uw.MiniEventVulkanFight_Enter_1 = "Häxan skrämmer dig utan anledning. Det är mycket enklare än så: stål härdas i eld! Gudarna förstår bara makt och ingenting annat. Bara makt kan få dem att somna om! Attack!"
uw.MiniEventVulkanStory_1 = "Den renande elden är rättfärdig – det säger våra förfäder. Men de visste inte att De Odödliga inte bryr sig om mänsklig moral. Det ligger helt enkelt i deras natur."
uw.MiniEventVulkanStory_2 = "Känner du hettan som stiger upp från underjorden? Det finns en sak du måste veta: lågan skonar ingen, vare sig vän eller främling. Och vi står rakt i dess väg."
uw.MiniEventVulkan_Loss_1 = "Du måste komma på fötter igen, Shadow! Känner du inte hur marken skälver?! Guden äcklas av vårt tramsande i dammet..."
uw.MiniEventVulkan_Win_1 = "Det är lika varmt som helveteselden här... Eldsanden morrar belåtet i sitt valv! En mycket bra strid, Shadow! Vi har tjänat in en dag till!"
