# BEGIN Sensei sensei.entry.
sensei.entry.ActScreenSensei1 = "Senseis berättelse{br}Del 1. Vittnet"
sensei.entry.ActScreenSensei2 = "Senseis berättelse{br}Del 2. Framtidens skugga"
sensei.entry.ActScreenSensei3 = "Senseis berättelse{br}Del 3. Odjuret inom"
sensei.entry.ActScreenSensei4 = "Senseis berättelse{br}Del 4. Berättelsen om hämnd"
sensei.entry.ActScreenSensei5 = "Senseis berättelse{br}Del 5. Förödmjukad och kränkt"
sensei.entry.ActScreenSensei6 = "Senseis berättelse{br}Del 6. Monstret"
sensei.entry.ButcherYoung_Greetings = "Ingen vågar tvivla på min auktoritet! Familjen förlåter aldrig sådant. Du kommer inte härifrån levande!"
sensei.entry.Butcher_zone3_1 = "Den förlorade sonen återvänder! Har du övervägt mitt förslag, prins? Jag släpper dig och berättar var sfären är, och du betalar mig i guld."
sensei.entry.Butcher_zone3_2 = "Hans tystnad är mer talande än ord, gamle man. Jag? Jag är ärlig mot mig själv — jag omfamnar min bestialiska natur. Det gör inte han. Men vi ska lära er ödmjukhet! Kom, barn!"
sensei.entry.Guard1_Butcher_Sensei = "Butcher visade mig hur smärta avslöjar vårt sanna jag. Jag är fri nu! Du kan också finna lycka. Gör inte motstånd!"
sensei.entry.Guard1_Hermit_Sensei = "Förändring är nära förestående! Jag har rest över halva världen för att lära mig den, offrat så mycket... Mästarens visdom är allt jag har!"
sensei.entry.Guard1_Lynx_Sensei = "Gillar du mina tatueringar? I landet där jag föddes får de starkaste dem som souvenirer av sina bedrifter. Du kommer snart också att vara en del av bilden..."
sensei.entry.Guard1_Wasp_Sensei = "Tror du på tursamhet? Jag tror att jag ska skapa min egen förmögenhet idag genom att ta alla dina pengar. Tror du att du har någon tur, gamle man?"
sensei.entry.Guard1_Widow_Sensei = "Min dam är som en syster för mig. Jag kan känna hennes smärta. Hon förbjuder mig att röra prinsen, så min vrede ska falla över dig!"
sensei.entry.Guard2_Butcher_Sensei = "Spelet är i hamn! Filosofi är för töntar — jag gillar bara att leka med knivar. Vill du leka med mig?"
sensei.entry.Guard2_Hermit_Sensei = "Mästaren berättade för oss om skuggvärlden — om dess invånare och den enorma kraft han ska dela med oss. Tror du att jag tänker låta dig ta allt detta från oss?"
sensei.entry.Guard2_Lynx_Sensei = "Vår klan gör jobb som är för smutsiga till och med för gudarna. Vi löser problem och korrigerar andras misstag. Och du — du är ett av de misstagen."
sensei.entry.Guard2_Wasp_Sensei = "Hotar du min kapten? Hon räddade mig från träldom, och jag svor att arbeta ihop till min frihet. Må andarna vara nådiga mot dig..."
sensei.entry.Guard2_Widow_Sensei = "Min dam är så fager! Jag var ovärdig att se hennes ansikte... Nu tillhör mitt liv henne. Jag kommer att skydda hennes ära till mitt sista andetag."
sensei.entry.HermitYoung_Greetings = "Du är ett offer för omständigheterna, prins — ett offer som krävs för det allmänna bästa. Min skola ska nå storhet, och kampsportens guldålder ska börja!"
sensei.entry.Hermit_zone2_1 = "Du befinner dig mellan barken och trädet, min herre. Jag erkänner — jag förrådde dig. Jag hade dock inget val — min skolas framtid står på spel."
sensei.entry.Hermit_zone2_2 = "Lynx, den där arroganta ynglingen, klarade inte av sin uppgift. Jag får göra hans jobb själv. Lärjungar, lystra och träd fram!"
sensei.entry.LynxYoung_Greetings = "Jag kan inte bara ge mig av. Jag har redan fått betalt för prinsens liv. Inget personligt, gamle man."
sensei.entry.Lynx_Sensei_1 = "Lyssna inte på prinsen, gubbe — han har bara blivit galen. Vi ska ta hans höghet hem innan han skadar sig själv. Din hjälp behövs inte."
sensei.entry.Lynx_Sensei_2 = "Säger du det? Därifrån jag står ser jag en skrämd man omgiven av mördare. Något säger mig att prinsen talar sanning. Backa undan från honom!"
sensei.entry.Lynx_Sensei_3 = "Gör som du vill. De betalar mig inte för att prata. Två huvuden betyder mer pengar. Ta dem, grabbar!"
sensei.entry.NAME_BUTCHER = "SLAKTARE"
sensei.entry.NAME_HERMIT = "EREMIT"
sensei.entry.NAME_LYNX = "LYNX"
sensei.entry.NAME_PRINCE = "PRINS"
sensei.entry.NAME_SHOGUN = "SHOGUN"
sensei.entry.NAME_WASP = "GETING"
sensei.entry.NAME_WIDOW = "ÄNKA"
sensei.entry.OK = "OK"
sensei.entry.Prince_Intro = "Hjälp! De här människorna vill döda mig!"
sensei.entry.Prince_zone3_1 = "Hur vågar du smutskasta mitt namn! Du... din eländiga krake! Jag är tillbaka för att sätta stopp för ditt skräckvälde!"
sensei.entry.Prince_zone6_1 = "Här är du, min lojale vän! Se — rättvisan segrar igen. Shogun is min trogna hund. Hans sinne är mitt!"
sensei.entry.Prince_zone6_2 = "Du också, gubbe? Vill du göra anspråk på min tron?! Jag äger den genom förstfödslorätt! Ingen ska ta den ifrån mig!"
sensei.entry.Sensei_arc_intro1 = "Det var en gång när jag var ute och gick och mötte den lokale herren — han var i yttersta nöd..."
sensei.entry.Sensei_zone3_1 = "Så det är vad ”tur” betyder? Att köpa din frihet och mata ditt folk till ett gäng galningar... Och jag som var så snäll mot dig, Prins."
sensei.entry.Sensei_zone4_1 = "Widow? Javisst... hon sa åt mig att ta sfären och lämna den till Shogun — direkt i hans egna händer."
sensei.entry.Sensei_zone6_1 = "Prins, stanna! Se dig omkring! Sfären livnär sig på din ilska och förvandlar dig till ett monster!"
sensei.entry.Shogun_zone6_1 = "Klenis! Du duger inte ens till att vara min herres hovnarr. Jag ska krossa dig med ett enda slag!"
sensei.entry.TITLE_PRINCE_EVIL = "HEMSÖKT PRINS"
sensei.entry.WaspYoung_Greetings = "Vad ska jag säga till min far? Att hans dotter vek ner sig och förlorade en strid mot en gammal man? Det kommer inte att hända så länge jag är arvinge till piraternas tron!"
sensei.entry.Wasp_zone4_1 = "Skickar Widow dig för att ta sfären? Är du inte lite för gammal för sådana jobb? Äsch, varför skulle jag bry mig? Gå ombord."
sensei.entry.Wasp_zone4_2 = "Saken är den att jag inte har sfären längre. Widows män tog den igår. Vet inte vem du är, men jag förlåter aldrig lögnare. Kölhala honom!"
sensei.entry.WidowYoung_Greetings = "Prinsen förödmjukade mig — avvisade mig, skrattade åt mina känslor. Nu ska jag slå tillbaka! Du är hans vän, så du får framföra det här meddelandet till honom..."
sensei.entry.Widow_zone5_1 = "Kommer du för att förödmjuka mig så som prinsen gjorde? Ni män är alla likadana..."
sensei.entry.Widow_zone5_2 = "Han har berättat för mig om din godhet, ära och värdighet. Men jag tror inte på någon mans ord längre. Var och en av er ska få lida!"
sensei.entry.Zone2_SenseiReminder = "Förra gången berättade jag hur jag räddade prinsen från mördare. Jag fick reda på att Eremiten i hemlighet tränade hans soldater. Så det var dit vi begav oss."
sensei.entry.Zone3_SenseiReminder = "Eremiten berättade för oss att prinsens krigsherre, Shogun, förrådde sin herre och betalade en viss Butcher för att kidnappa honom. Det var dags att besöka banditen."
sensei.entry.Zone4_SenseiReminder = "Prinsens problem orsakades av en kvinna! Hon uttänkte en plan för att störta honom med hjälp av en magisk sfär — som nu höll på att föras till den närliggande hamnen..."
sensei.entry.Zone5_SenseiReminder = "Piratflickan berättade för mig om Widows komplicerade historia med prinsen. Jag fick inte tag i sfären, men jag fick veta att prinsen gav sig av till bergen för att leta efter Widow."
sensei.entry.Zone6_SenseiReminder = "Den magiska sfären drev prinsen till vansinne! Den gav honom oerhörd makt... makt som hotade att förgöra oss alla! Jag kunde inte tillåta att det hände."
sensei.entry.characterSensei = "SENSEI"
